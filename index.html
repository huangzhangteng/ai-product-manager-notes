obdesc.html?postId=2082723377528877056","published":"2026年10月28日","verified":"2026-11-14","summary":"办公文档场景、用户视角、逻辑抽象与机会判断。","sample_group":"中文岗位","source_kind":"腾讯招聘官方详情接口正文","snapshot":"research/raw/tencent-2082723377528877056.json"},{"company":"腾讯","title":"企业微信-AI产品经理-搜索方向","location":"广州","url":"https://careers.tencent.com/jobdesc.html?postId=2112375607512969216","published":"2026年10月27日","verified":"2026-11-14","summary":"搜索召回、排序、相关性和数据分析；搜索经验优先。","sample_group":"中文岗位","source_kind":"腾讯招聘官方详情接口正文","snapshot":"research/raw/tencent-2112375607512969216.json"},{"company":"腾讯","title":"大数据平台部-高级AI产品经理","location":"深圳","url":"https://careers.tencent.com/jobdesc.html?postId=2110569968142827520","published":"2026年10月22日","verified":"2026-11-14","summary":"AI落地、RAG和Agent、评测、原型及质量成本延迟取舍。","sample_group":"中文岗位","source_kind":"腾讯招聘官方详情接口正文","snapshot":"research/raw/tencent-2110569968142827520.json"},{"company":"腾讯","title":"企业微信-AI产品经理-智能助理Agent","location":"广州","url":"https://careers.tencent.com/jobdesc.html?postId=1880770535693004800","published":"2026年11月09日","verified":"2026-11-14","summary":"Agent产品策划、AI理解、用户视角和系统思考。","sample_group":"中文岗位","source_kind":"腾讯招聘官方详情接口正文","snapshot":"research/raw/tencent-1880770535693004800.json"},{"company":"腾讯","title":"企业微信-AI产品经理-智能机器人","location":"广州","url":"https://careers.tencent.com/jobdesc.html?postId=1985253844522782720","published":"2026年11月09日","verified":"2026-11-14","summary":"ToB产品、技术理解、抽象与沟通；AI背景为优先项。","sample_group":"中文岗位","source_kind":"腾讯招聘官方详情接口正文","snapshot":"research/raw/tencent-1985253844522782720.json"},{"company":"腾讯","title":"企业微信-AI产品经理-效率办公 AI","location":"广州","url":"https://careers.tencent.com/jobdesc.html?postId=2038501839850336256","published":"2026年10月28日","verified":"2026-11-14","summary":"效率工具、真实场景抽象、Agent原理与数据分析。","sample_group":"中文岗位","source_kind":"腾讯招聘官方详情接口正文","snapshot":"research/raw/tencent-2038501839850336256.json"}]},"reports":{"career":{"html":"<h2 id=\"section-1\">岗位能力与个人差距分析<\/h2><p>资料核验：2026-11-14。个人建议依据用户提供的信息和下述岗位样本作出，属于分析判断。知识库是学习支持，不能据此认定已具备某级别任职资格。<\/p><h2 id=\"section-2\">研究范围与边界<\/h2><p>本轮直接读取招聘官网托管接口正文，登记30个目的性样本：10个腾讯中文岗位；20个来自 Anthropic、OpenAI、Cohere、LangChain、Notion、Perplexity 的国际岗位。每个样本的标题、地点、原始链接、核验日期和简要归纳见 <code>research/岗位样本登记.md<\/code> 与 <code>research/jobs.json<\/code>。原始正文保留在本地 research 目录。<\/p><p>这是为了识别能力类型的目的性采样。中文样本集中于腾讯，国际样本偏模型与工具公司，不能用来估计中国市场职位数量、技能出现率、薪资或录用概率。岗位存在和正文可读，仅说明核验时可获取，后续投递前需再次核实开放状态及条件。<\/p><h2 id=\"section-3\">岗位实际在要求什么<\/h2><h3 id=\"section-4\">1. 产品基本功与技术判断需要同时成立<\/h3><p><a href=\"https://careers.tencent.com/jobdesc.html?postId=2092538895714664448\" target=\"_blank\" rel=\"noopener noreferrer\">腾讯 AI 产品经理<\/a>将企业研发流程、需求抽象、Agent/MCP/API 理解和跨团队落地放在同一角色中。<a href=\"https://jobs.ashbyhq.com/Perplexity/a8c79425-eb48-40e0-8557-93460fa67097\" target=\"_blank\" rel=\"noopener noreferrer\">Perplexity 平台产品经理<\/a>要求理解 API、数据流、系统依赖和故障模式。这支持的学习方向是：把已有产品经验接到系统机制与技术取舍上。<\/p><p>不能仅凭会使用聊天工具判断技术理解已经充分。阅读需求时，还要能解释数据来自哪里、工具如何执行、结果怎样验证、失败由谁处理。<\/p><h3 id=\"section-5\">2. 质量评估是产品定义的一部分<\/h3><p><a href=\"https://careers.tencent.com/jobdesc.html?postId=2110569968142827520\" target=\"_blank\" rel=\"noopener noreferrer\">腾讯高级 AI 产品经理<\/a>明确连接 RAG、Agent、模型评测和质量、成本、延迟、数据安全取舍。<a href=\"https://jobs.ashbyhq.com/langchain/27af5f96-b287-4bcc-8679-f96686dc7c8d\" target=\"_blank\" rel=\"noopener noreferrer\">LangSmith 产品经理<\/a>围绕观测、评估、部署和多步失败调试展开。由此将评测集、质量量表、失败分类、任务成功与回归检查列为知识库核心。<\/p><p>产品经理需要知道成功标准从业务任务而来，单次演示和公开榜单不能直接证明实际产品效果。知识库将解释如何形成证据、证据有哪些局限。<\/p><h3 id=\"section-6\">3. Agent 产品需要理解执行过程与控制<\/h3><p><a href=\"https://jobs.ashbyhq.com/cohere/1d1b300d-254b-48c4-958f-99c6b907f295\" target=\"_blank\" rel=\"noopener noreferrer\">Cohere Agent Harness &amp; Modelling<\/a>涉及工具编排、并行执行、委派、执行环境和恢复。<a href=\"https://jobs.ashbyhq.com/openai/fc38c6bf-5330-435c-99b6-1bcf1f5829a8\" target=\"_blank\" rel=\"noopener noreferrer\">OpenAI API Agents<\/a>连接开发者问题、API/SDK、模型能力和技术协作。知识库据此覆盖工具契约、状态、幂等、终止、记忆、权限、人工介入及单/多Agent选择。<\/p><h3 id=\"section-7\">4. 用户体验与商业价值仍然是核心责任<\/h3><p><a href=\"https://careers.tencent.com/jobdesc.html?postId=2110653070814916608\" target=\"_blank\" rel=\"noopener noreferrer\">腾讯证券 Agent 产品经理<\/a>强调多步任务交互、等待和异常体验、用户研究与效果复盘。<a href=\"https://jobs.ashbyhq.com/Perplexity/7f880194-7276-4b46-8a50-58b48da8882e\" target=\"_blank\" rel=\"noopener noreferrer\">Perplexity AI Capabilities<\/a>连接可理解、可控制的交互与Agent能力。资深产品判断应能把技术特性转成用户可理解的价值，再连接采用、留存、交付和成本。<\/p><h3 id=\"section-8\">5. 编程、学历与领域要求并不统一<\/h3><p><a href=\"https://careers.tencent.com/jobdesc.html?postId=2088450750270324736\" target=\"_blank\" rel=\"noopener noreferrer\">腾讯 Agent 平台岗位<\/a>列出了相关技术专业学历；<a href=\"https://careers.tencent.com/jobdesc.html?postId=2110569968142827520\" target=\"_blank\" rel=\"noopener noreferrer\">腾讯高级 AI 产品经理<\/a>则描述可用AI工具、低代码或基础代码快速验证。研究型、模型型、基础设施型岗位通常需要另核验更深入的技术或领域条件。不能概括成“AI产品经理必须算法出身”或“完全不必懂技术”。应逐个读取具体岗位的必需项和优先项。<\/p><h2 id=\"section-9\">结合你的现状，如何定位<\/h2><p>已知事实：8年互联网产品经验；正在负责工具类Agent产品AI SCADA；没有技术背景；自述AI理解尚不深入；主攻通用AI/Agent，系统提升，无求职期限。<\/p><p>初步建议：优先以“具备工具产品经验、正在建立AI系统与产品判断能力的资深产品经理”为发展方向。通用Agent应用、企业效率工具、知识工作助手可作为重点理解的岗位类型；开发者平台可作为进一步深入方向。岗位适配还取决于既往产品成果、目标用户、业务复杂度与实际AI项目贡献。<\/p><p>这不意味着重新从初级产品经理开始。8年经历可能提供用户研究、产品抽象、优先级和交付经验，但具体强项尚无项目证据，因此不直接给能力打分，也不把任职年限等同于AI资深度。<\/p><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>能力<\/th><th>当前依据<\/th><th>建议补齐方向<\/th><th>对应知识域<\/th><\/tr><tr><td>产品基本功<\/td><td>有8年产品经历；实际水平待项目证据判断<\/td><td>理解概率性能力对需求、交互和验收的改变<\/td><td>13、14<\/td><\/tr><tr><td>领域与工具经验<\/td><td>正在负责AI SCADA，实际贡献边界未提供<\/td><td>提炼复杂工具、工作流、权限和可靠性经验，迁移到通用场景<\/td><td>08、09、17<\/td><\/tr><tr><td>AI基础认知<\/td><td>用户自述不深入<\/td><td>建立ML、LLM、训练推理与局限的连续认知<\/td><td>01、02<\/td><\/tr><tr><td>技术沟通<\/td><td>无技术背景；实际接口经验未知<\/td><td>API、JSON、数据流、状态、日志与基础代码阅读<\/td><td>03、08、12<\/td><\/tr><tr><td>核心方案判断<\/td><td>尚无材料可验证<\/td><td>Prompt/RAG/微调、工作流/Agent、模型部署和数据方案<\/td><td>04—09<\/td><\/tr><tr><td>评估与诊断<\/td><td>未提供现有评测工作<\/td><td>业务目标、评测集、失败分类、质量成本延迟综合判断<\/td><td>11、12<\/td><\/tr><tr><td>产品与商业闭环<\/td><td>经验可能可迁移，缺具体数据<\/td><td>用户价值、采用、单位经济性、企业交付与反馈<\/td><td>13、16<\/td><\/tr><tr><td>职业表达<\/td><td>无作品材料<\/td><td>用角色边界、关键决策和结果证据呈现AI项目<\/td><td>18<\/td><\/tr><\/table><\/div><h2 id=\"section-10\">知识学习的推荐关系<\/h2><p>先建立AI全景与大模型机制，并平行补技术基础；再理解模型选择、上下文、数据与RAG；接到工具、工作流和Agent；随后结合评估、可靠性、安全、交互及商业分析形成系统判断。产品设计和案例可随工作问题随时查阅。此顺序只表示知识依赖，不规定学习期限或每日任务。<\/p><p>数学以概率、统计、向量、损失和实验直觉为桥梁，提供必要公式与数值解释；代码先读懂、再运行与修改小例子。模型训练工程和复杂数学推导作为扩展阅读。知识库将完整解释原理与操作示例，由你自主决定是否动手。<\/p><h2 id=\"section-11\">什么变化能支撑“资深AI产品经理”的表达<\/h2><p>能够解释业务为什么需要某种AI能力；在多个方案之间说明数据、质量、成本、延迟与风险的取舍；把不确定模型行为转化为明确产品边界；根据执行记录和评估定位问题；对用户价值与结果负责。这些是本研究形成的能力归纳，并非招聘市场统一证书或单一标准。<\/p><p>未来呈现AI SCADA经历时，可围绕实际发生的用户问题、你的决策、团队分工、验证方式和真实结果组织材料。内部数据与客户细节先按公司要求处理；知识库中的SCADA案例统一标为教学构造，不虚构你的上线指标或业绩。<\/p>","toc":[{"id":"section-1","title":"岗位能力与个人差距分析","level":2},{"id":"section-2","title":"研究范围与边界","level":2},{"id":"section-3","title":"岗位实际在要求什么","level":2},{"id":"section-4","title":"1. 产品基本功与技术判断需要同时成立","level":3},{"id":"section-5","title":"2. 质量评估是产品定义的一部分","level":3},{"id":"section-6","title":"3. Agent 产品需要理解执行过程与控制","level":3},{"id":"section-7","title":"4. 用户体验与商业价值仍然是核心责任","level":3},{"id":"section-8","title":"5. 编程、学历与领域要求并不统一","level":3},{"id":"section-9","title":"结合你的现状，如何定位","level":2},{"id":"section-10","title":"知识学习的推荐关系","level":2},{"id":"section-11","title":"什么变化能支撑“资深AI产品经理”的表达","level":2}]},"sample":{"html":"<h2 id=\"section-1\">招聘岗位样本登记<\/h2><p>核验日期：2026-11-14。30个目的性样本：腾讯中文岗位10个，国际岗位20个。均读取招聘官方接口的岗位正文；正文快照留在本地research。样本不代表招聘市场总体。<\/p><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>公司<\/th><th>岗位与原始链接<\/th><th>地点<\/th><th>本项目归纳的能力信号<\/th><\/tr><tr><td>anthropic<\/td><td><a href=\"https://job-boards.greenhouse.io/anthropic/jobs/5457043008\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, Claude Marketplace<\/a><\/td><td>San Francisco, CA / New York City, NY<\/td><td>商业流程、伙伴需求、成功指标与产品推进。<\/td><\/tr><tr><td>anthropic<\/td><td><a href=\"https://job-boards.greenhouse.io/anthropic/jobs/5394887008\" target=\"_blank\" rel=\"noopener noreferrer\">Produc  New York City, NY<\/td><td>自主原型验证、从研究到零到一产品。<\/td><\/tr><tr><td>cohere<\/td><td><a href=\"https://jobs.ashbyhq.com/cohere/1d1b300d-254b-48c4-958f-99c6b907f295\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, Agent Harness &amp; Modelling<\/a><\/td><td>Toronto<\/td><td>运行环境、工具编排、并行执行和故障恢复。<\/td><\/tr><tr><td>cohere<\/td><td><a href=\"https://jobs.ashbyhq.com/cohere/fe2e2971-e2c0-43fd-9ab1-187571776a5d\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager,  Inference Platform<\/a><\/td><td>Toronto<\/td><td>推理服务、成本与商业落地、控制台体验。<\/td><\/tr><tr><td>langchain<\/td><td><a href=\"https://jobs.ashbyhq.com/langchain/27af5f96-b287-4bcc-8679-f96686dc7c8d\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, LangSmith<\/a><\/td><td>New York, NY<\/td><td>可观测性、评估、复杂Agent故障与开发者体验。<\/td><\/tr><tr><td>notion<\/td><td><a href=\"https://jobs.ashbyhq.com/notion/be6e1a35-d467-48e6-96bf-62afc4ad0126\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, Connections<\/a><\/td><td>San Francisco, California<\/td><td>企业连接、跨系统知识、用户问题与产品策略。<\/td><\/tr><tr><td>openai<\/td><td><a href=\"https://jobs.ashbyhq.com/openai/fc38c6bf-5330-435c-99b6-1bcf1f5829a8\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, API Agents<\/a><\/td><td>San Francisco<\/td><td>Agent开发者需求、API和SDK、模型与工程协作。<\/td><\/tr><tr><td>openai<\/td><td><a href=\"https://jobs.ashbyhq.com/openai/05a8cae8-81bd-4f7b-bc48-41ef1bd67e5d\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, Integrity<\/a><\/td><td>San Francisco<\/td><td>风险控制、Agent调查流程、指标与部署准入。<\/td><\/tr><tr><td>openai<\/td><td><a href=\"https://jobs.ashbyhq.com/openai/7ffa2a14-fa9c-46cb-a30a-1f7a35ae904a\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, API Infrastructure<\/a><\/td><td>San Francisco<\/td><td>API基础设施、企业数据控制与技术权衡。<\/td><\/tr><tr><td>perplexity<\/td><td><a href=\"https://jobs.ashbyhq.com/Perplexity/f25e190e-0508-4707-b575-fcaed358dc13\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager (Builder)<\/a><\/td><td>San Francisco<\/td><td>知识工作、原型、模型效果、数据与产品判断。<\/td><\/tr><tr><td>perplexity<\/td><td><a href=\"https://jobs.ashbyhq.com/Perplexity/3c9c051f-e6ca-4a70-9abf-1f640e154ee1\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, Mobile Apps<\/a><\/td><td>San Francisco<\/td><td>移动体验、模型输出评估与平台限制。<\/td><\/tr><tr><td>perplexity<\/td><td><a href=\"https://jobs.ashbyhq.com/Perplexity/7f880194-7276-4b46-8a50-58b48da8882e\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, AI Capabilities<\/a><\/td><td>San Francisco<\/td><td>工具、Agent、评估、可扩展性与工作流。<\/td><\/tr><tr><td>perplexity<\/td><td><a href=\"https://jobs.ashbyhq.com/Perplexity/a8c79425-eb48-40e0-8557-93460fa67097\" target=\"_blank\" rel=\"noopener noreferrer\">Product Manager, Platform<\/a><\/td><td>New York City<\/td><td>API、数据流、故障模式、可靠性与平台优先级。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=2092538895714664448\" target=\"_blank\" rel=\"noopener noreferrer\">AI产品经理<\/a><\/td><td>深圳<\/td><td>企业Agent平台、开发者工作流、MCP与API理解；产品与技术协作。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=1978467627152072704\" target=\"_blank\" rel=\"noopener noreferrer\">微信输入法-AI产品经理<\/a><\/td><td>广州<\/td><td>输入和语音场景、模型效果标准、数据和跨职能协作。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=2110653070814916608\" target=\"_blank\" rel=\"noopener noreferrer\">证券-AI产品经理-Agent方向<\/a><\/td><td>深圳<\/td><td>复杂任务交互、上下文和工具调用、用户研究与效果复盘。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=2088450750270324736\" target=\"_blank\" rel=\"noopener noreferrer\">AI产品经理-AI平台（Agent）方向<\/a><\/td><td>深圳<\/td><td>Agent架构、评测、原型验证；该岗位明确列出相关技术专业学历。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=2082723377528877056\" target=\"_blank\" rel=\"noopener noreferrer\">企业微信-AI产品经理-智能文档<\/a><\/td><td>广州<\/td><td>办公文档场景、用户视角、逻辑抽象与机会判断。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=2112375607512969216\" target=\"_blank\" rel=\"noopener noreferrer\">企业微信-AI产品经理-搜索方向<\/a><\/td><td>广州<\/td><td>搜索召回、排序、相关性和数据分析；搜索经验优先。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=2110569968142827520\" target=\"_blank\" rel=\"noopener noreferrer\">大数据平台部-高级AI产品经理<\/a><\/td><td>深圳<\/td><td>AI落地、RAG和Agent、评测、原型及质量成本延迟取舍。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=1880770535693004800\" target=\"_blank\" rel=\"noopener noreferrer\">企业微信-AI产品经理-智能助理Agent<\/a><\/td><td>广州<\/td><td>Agent产品策划、AI理解、用户视角和系统思考。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=1985253844522782720\" target=\"_blank\" rel=\"noopener noreferrer\">企业微信-AI产品经理-智能机器人<\/a><\/td><td>广州<\/td><td>ToB产品、技术理解、抽象与沟通；AI背景为优先项。<\/td><\/tr><tr><td>腾讯<\/td><td><a href=\"https://careers.tencent.com/jobdesc.html?postId=2038501839850336256\" target=\"_blank\" rel=\"noopener noreferrer\">企业微信-AI产品经理-效率办公 AI<\/a><\/td><td>广州<\/td><td>效率工具、真实场景抽象、Agent原理与数据分析。<\/td><\/tr><\/table><\/div>","toc":[{"id":"section-1","title":"招聘岗位样本登记","level":2}]},"guide":{"html":"<h2 id=\"section-1\">阅读与维护说明<\/h2><h2 id=\"section-2\">这份知识库如何使用<\/h2><p>知识库面向通用AI与Agent产品工作，以完整正文连接基础、技术、产品、案例和职业能力。包含18个能力域、144个单元；每篇围绕一个问题展开，原理、案例、方法和深入资料按需结合。你自主选择学习进度，无固定期限、每日任务、练习或测验。<\/p><p>知识地图按参考顺序排列。建议先建立AI和大模型基础，同时补接口、数据流等技术语言；再连接模型选型、上下文、数据、RAG、工作流与Agent。评估、可靠性、安全、交互与商业内容帮助形成整体产品判断。按问题查阅入口把常见工作问题连到相关文章；案例库提供端到端流程。<\/p><p>每篇上方显示阅读估时与前置阅读。估时按正文长度粗略计算，理解原理或查看原资料可能需要更久，不代表学习要求。前置关系方便回查，可自由跳读。正文涉及真实工具操作时，请先看环境和权限条件；示意代码与教学构造数据不等于已验证的生产实现。<\/p><h2 id=\"section-3\">手机阅读<\/h2><p>左上角打开知识目录，顶部搜索可检索正文、标题和中英文术语。右上角Aa调整字体、导出和导入阅读记录。“本篇目录”可展开，点击小节跳转；表格和代码区域可横向滚动。每篇有收藏、已读、稍后重读、复制链接与上下篇入口。<\/p><p>继续阅读会回到最近文章与记录的阅读位置；页面内容或屏幕尺寸改变时位置可能有少量偏移。阅读标记只是个人整理，不表示掌握程度。浏览器地址中的文章链接可以分享，跨设备打开的是同一篇内容。<\/p><h2 id=\"section-4\">阅读记录保存在哪里<\/h2><p>收藏、标记、字体和阅读位置存于当前浏览器的本地存储。网站没有登录账号，不把个人阅读记录发送到服务器。换浏览器、换手机或清除浏览器数据，记录不会自动同步。<\/p><p>在Aa中选择导出阅读记录，将得到JSON文件。到新设备导入，收藏和标记合并保留，导入文件中的文章位置覆盖同篇旧位置。导入只接受本知识库格式的阅读记录；无效文件不会改变原数据。隐私或受限模式可能无法持久保存，请及时导出。清除记录可通过浏览器对应站点的数据管理完成，操作前先导出备份。<\/p><h2 id=\"section-5\">在线与本地内容<\/h2><p>在线阅读地址：<a href=\"https://huangzhangteng.github.io/ai-product-manager-notes/\" target=\"_blank\" rel=\"noopener noreferrer\">https://huangzhangteng.github.io/ai-product-manager-notes/<\/a>。公开站点提供知识正文，案例采用公开材料或明确标注的教学构造数据，不放入你的个人能力评估细节之外的私密资料、内部数据或密钥。<\/p><p>本地<code>AI产品经理成长知识库.html<\/code>与<code>index.html<\/code>为自包含阅读文件，保存后可用浏览器打开，正文、目录和搜索可离线工作；外部资料链接需要网络。部分浏览器对本地文件的存储和复制链接有限制，正式手机阅读建议使用在线站点。本地文件与在线站点的阅读记录分别保存，迁移时使用导出与导入。<\/p><p>content目录保留每个单元的Markdown正文；curriculum.json管理标题、能力域、先修关系和别名；glossary.json管理简要术语索引。research保留岗位样本与来源核验记录，site保存页面模板和代码，scripts保存生成与审计工具。无需从最终HTML反向编辑内容。<\/p><h2 id=\"section-6\">内容的来源与适用性<\/h2><p>每篇列出原始资料与核验日期。稳定原理和特定平台功能分别解释。模型能力、价格、平台特性、协议及招聘条件可能变化，采用前需按原始页面复核。没有验证的平台兼容性、法律适用结论或产品承诺不应从原理介绍中推断。<\/p><p>岗位报告基于30个目的性样本：10个中文岗位集中于腾讯，20个国际岗位来自6家公司。它用于识别能力类型，不能代表市场份额、岗位数量、薪资或个人录用概率。个人建议按用户提供的信息提出，未知能力没有打分。<\/p><p>SCADA及其他教学案例的数字、用户流程和故障情境均按文中说明使用。教学数字用于展示判断过程，不代表你的工作业绩或某产品公开测评。<\/p><h2 id=\"section-7\">后续如何扩充<\/h2><p>先判断新问题属于已有专题还是需要新单元。为新单元选择稳定ID，补充标题、层次、先修关系和别名；正文延续“问题—机制—例子—取舍—边界—产品方法—来源”的解释方式，按主题调整结构。修改已有概念时同步核对其他文章，避免术语冲突。<\/p><p>将新增术语接入glossary.json，原始资料保留核验日期；记录具体改动、版本与受影响单元。运行<code>scripts/build_site.py<\/code>可重新生成单文件站点，构建在缺少正文时会失败。运行内容审计和浏览器检查，确认目录、全文检索、关联跳转和阅读记录行为正常，再按项目发布技能同步既有站点。<\/p><p>更新由你的新需求或资料变化触发。本次没有设置自动更新或提醒。希望追加内容时，可以直接提出知识主题、实际问题或资料链接，继续沿同一结构维护。<\/p><p>核验日期：2026-11-14。<\/p>","toc":[{"id":"section-1","title":"阅读与维护说明","level":2},{"id":"section-2","title":"这份知识库如何使用","level":2},{"id":"section-3","title":"手机阅读","level":2},{"id":"section-4","title":"阅读记录保存在哪里","level":2},{"id":"section-5","title":"在线与本地内容","level":2},{"id":"section-6","title":"内容的来源与适用性","level":2},{"id":"section-7","title":"后续如何扩充","level":2}]}},"glossary":[{"term":"人工智能 AI","definition":"让计算机完成识别、预测、生成、规划等任务的方法与系统的统称。产品分析仍需要具体到任务、输入、结果与边界。","lessons":["01-01"]},{"term":"机器学习 ML","definition":"利用数据学习规律的方法。通过训练形成模型，再对未见输入作预测；效果取决于任务、数据与泛化。","lessons":["01-02","01-03"]},{"term":"深度学习 DL","definition":"使用多层神经网络学习数据表示的方法，大模型是其应用之一。层数与参数数量不直接等于业务效果。","lessons":["01-04","02-04"]},{"term":"生成式 AI","definition":"根据输入生成文本、图像、声音等内容的AI能力类别。生成流畅性与事实正确性需要分别判断。","lessons":["01-01","02-08"]},{"term":"监督学习","definition":"用带目标标签的数据学习输入到输出的映射，如分类与回归。标签质量和任务定义直接影响结果。","lessons":["01-02","06-04"]},{"term":"泛化 Generalization","definition":"模型在未见数据和真实使用场景上的表现。训练样本表现好不能独立证明泛化良好。","lessons":["01-03","06-08"]},{"term":"过拟合 Overfitting","definition":"模型过度贴合训练样本中的细节或噪声，导致新样本表现变差。需通过数据划分和独立验证识别。","lessons":["01-03"]},{"term":"损失 Loss","definition":"训练中用于衡量预测与目标差异的数值目标。损失下降不自动等于用户价值提升。","lessons":["01-04"]},{"term":"梯度 Gradient","definition":"描述参数变化如何影响损失的方向与幅度，用于指导优化更新。产品层面首先理解其训练作用。","lessons":["01-04"]},{"term":"条件概率","definition":"已知某个条件时另一事件发生的概率。理解条件、样本基数和先验有助于判断置信度与误报。","lessons":["01-05"]},{"term":"向量 Vector","definition":"有序数字序列，可表达对象特征或语义表示。相似度结果仍需结合实际任务验证。","lessons":["01-06","02-02"]},{"term":"抽样偏差 Sampling bias","definition":"样本构成系统性偏离目标用户或任务分布，使估计产生偏差。增加同类样本不能自动消除偏差。","lessons":["01-07","11-02"]},{"term":"强化学习 RL","definition":"围绕奖励学习行动策略的方法。奖励定义不当可能使行为优化偏离真正目标。","lessons":["01-08","02-05"]},{"term":"大语言模型 LLM","definition":"在大量数据上训练、处理和生成语言等内容的模型。外部工具、状态与权限通常属于应用系统。","lessons":["02-04","02-08"]},{"term":"Token","definition":"模型处理的文本或其他输入单元。Token与汉字、单词不一一对应，影响上下文与计费。","lessons":["02-01"]},{"term":"Embedding 嵌入","definition":"将对象映射到向量空间的表示方法。用于语义搜索等任务，向量相近并不保证事实相同。","lessons":["02-02","07-03"]},{"term":"Attention 注意力","definition":"按输入之间的关系分配信息权重的计算机制。模型注意力与人的注意力不是同一概念。","lessons":["02-03"]},{"term":"Transformer","definition":"以注意力等模块组织表示计算的模型架构。理解其机制有助于解释上下文处理和计算约束。","lessons":["02-03"]},{"term":"预训练 Pretraining","definition":"在大规模数据上学习通用表示或预测能力的训练阶段。模型并非据此获得实时或私有知识。","lessons":["02-04"]},{"term":"后训练 Post-training","definition":"在预训练之后通过指令、偏好等数据改进模型行为的过程，常涉及SFT与偏好优化。","lessons":["02-05"]},{"term":"SFT 监督微调","definition":"使用任务或指令示例调整模型参数。常用于行为与格式适配，仍需数据质量和独立评估。","lessons":["02-05","04-05"]},{"term":"RLHF","definition":"利用人类反馈形成偏好或奖励信号，再优化模型行为的一类方法。对齐不意味着消除全部风险。","lessons":["02-05"]},{"term":"推理 Inference","definition":"使用已训练模型处理输入并产生输出的过程。与训练过程不同，也需区别于日常所说的逻辑推理能力。","lessons":["02-06","02-08"]},{"term":"温度 Temperature","definition":"影响输出采样分布的参数之一。降低温度通常不能单独保证正确、稳定或可重复。","lessons":["02-06"]},{"term":"上下文窗口 Context window","definition":"一次模型处理可容纳的信息范围。容量、有效使用程度和持久记忆是不同问题。","lessons":["02-07","05-06"]},{"term":"幻觉 Hallucination","definition":"模型生成缺乏依据或不符合事实的内容。可能与任务、输入、证据、生成等多环节有关。","lessons":["02-08","07-07"]},{"term":"API","definition":"软件系统之间约定的调用接口。定义请求、响应、鉴权、错误和版本，模型工具调用依赖实际接口执行。","lessons":["03-02","08-02"]},{"term":"HTTP","definition":"网络请求与响应的协议。方法、状态码、请求头和正文帮助理解一次API交互。","lessons":["03-02"]},{"term":"JSON","definition":"表达对象、数组、字符串等结构化数据的文本格式。格式合法不代表业务含义正确。","lessons":["03-03"]},{"term":"Schema","definition":"描述数据结构与约束的契约。用于字段类型、必填项与格式校验，还需业务规则校验。","lessons":["03-03","08-03"]},{"term":"流式输出 Streaming","definition":"逐段返回生成内容的响应方式，可缩短首段等待；完整任务正确性仍需最终检查。","lessons":["03-04","12-03"]},{"term":"异步任务","definition":"请求发出后通过任务ID、回调或轮询跟踪完成的执行方式。受理成功不等于业务完成。","lessons":["03-04","09-06"]},{"term":"SQL","definition":"查询与操作关系型数据库的语言。学习聚合、连接与过滤，有助于分析产品数据和取数口径。","lessons":["03-05"]},{"term":"Trace 执行轨迹","definition":"将请求中多次模型、工具和其他调用关联起来的记录，便于定位多步任务失败。","lessons":["12-02","11-08"]},{"term":"开放权重模型","definition":"公开模型权重的模型类型。权重可获取不意味着数据、训练代码或商业许可全部开放。","lessons":["04-02"]},{"term":"LoRA","definition":"以低秩参数更新实现参数高效微调的方法。降低训练资源需求，但不省略数据和评估工作。","lessons":["04-05"]},{"term":"蒸馏 Distillation","definition":"利用较强模型的行为或信号训练较小模型等方法。可改善成本，但须验证能力覆盖与许可条件。","lessons":["04-06"]},{"term":"量化 Quantization","definition":"以较低数值精度表示参数或计算的优化方法。可节约资源，也可能影响效果与兼容性。","lessons":["04-06"]},{"term":"模型路由","definition":"按任务、成本或风险等条件将请求分发给不同模型的策略，需要端到端质量与故障控制。","lessons":["04-08","12-08"]},{"term":"Prompt 提示","definition":"向模型表达任务、背景、约束和示例的输入。效果取决于与上下文和系统流程的组合。","lessons":["05-01"]},{"term":"Few-shot 少样本提示","definition":"在上下文中提供少量示例表达目标行为，通常不更新模型参数。","lessons":["05-02"]},{"term":"上下文工程","definition":"组织一次任务所需的指令、资料、状态、记忆与工具信息，并控制预算、优先级和可信边界。","lessons":["05-05","05-06"]},{"term":"结构化输出","definition":"要求模型按字段或格式返回结果，便于下游处理；需同时检查结构、语义和业务约束。","lessons":["05-03"]},{"term":"数据泄漏","definition":"评估数据或不应使用的信息进入训练或测试过程，造成效果被高估；也可指敏感数据不当外流，需按语境区分。","lessons":["06-08","15-04"]},{"term":"元数据 Metadata","definition":"描述资料来源、版本、时间、权限等的数据，使内容可管理、过滤与追溯。","lessons":["06-06","07-02"]},{"term":"RAG 检索增强生成","definition":"先从外部资料检索证据，再将证据交给模型生成回答的系统方式。检索成功与回答正确需分别验证。","lessons":["07-01"]},{"term":"切分 Chunking","definition":"将文档按合适的结构和长度拆成可索引片段。影响证据完整性、检索粒度与上下文成本。","lessons":["07-02"]},{"term":"混合检索 Hybrid search","definition":"组合关键词、向量等检索方式，以覆盖精确术语和语义表达。融合策略需要任务验证。","lessons":["07-04"]},{"term":"重排 Reranking","definition":"对初步召回候选重新计算相关性和排序。提高精度可能增加延迟与成本。","lessons":["07-04"]},{"term":"召回 Recall","definition":"在目标相关项中找回的比例；定义取决于任务、标注和截断位置。需与精确率等一起看。","lessons":["07-07","11-05"]},{"term":"工具调用 Tool calling","definition":"模型生成结构化工具请求，由应用验证并执行，再把结果交回模型的过程。模型输出调用意图不等于操作已完成。","lessons":["08-02"]},{"term":"工作流 Workflow","definition":"按明确规则、分支与状态组织任务执行的方式。可包含模型步骤，不必全部由模型自主决定。","lessons":["08-01","08-04"]},{"term":"幂等 Idempotency","definition":"重复执行同一操作不会额外改变业务结果的性质或设计约束，可减少重试造成重复副作用。","lessons":["08-05"]},{"term":"补偿 Compensation","definition":"分布式流程中用相应业务动作修正已完成步骤的影响，可能无法完全恢复原状。","lessons":["08-06"]},{"term":"MCP","definition":"连接AI应用与工具、资源等能力的协议。协议兼容不自动解决授权、质量与业务语义。","lessons":["08-07"]},{"term":"A2A","definition":"面向Agent之间发现、协作和任务交流的协议体系。与工具连接协议关注的问题不同。","lessons":["08-08"]},{"term":"Agent 智能体","definition":"围绕目标利用模型、工具和状态进行多步行动的系统形态，自主程度和控制边界需要明确。","lessons":["09-01"]},{"term":"ReAct","definition":"将推理与行动相结合的一类Agent组织思路。实际产品仍需状态、权限、停止和结果验证。","lessons":["09-01","09-02"]},{"term":"记忆 Memory","definition":"跨步骤或跨会话保存并按需提取信息的系统机制。应区分临时状态、历史记录和可管理用户信息。","lessons":["09-03"]},{"term":"多 Agent","definition":"多个分工不同的Agent协作完成任务的系统。增加模块化也增加通信、交接与协调成本。","lessons":["09-04","09-05"]},{"term":"Human-in-the-loop","definition":"在指定条件下由人确认、纠正、接管或完成关键步骤的设计，需要清楚的触发与责任边界。","lessons":["09-08","14-05"]},{"term":"Computer use","definition":"通过浏览器或电脑界面执行操作的Agent能力，需要环境隔离、权限和操作结果核验。","lessons":["09-07"]},{"term":"多模态 Multimodal","definition":"处理或生成文字、图像、声音、视频等多种模态的能力，不同模态有不同质量与延迟要求。","lessons":["10-01"]},{"term":"OCR","definition":"从图像或扫描件中识别文字的技术。复杂版式、表格结构和识别内容需分别评估。","lessons":["10-02","06-05"]},{"term":"ASR","definition":"将语音转为文本的能力，受噪声、口音、领域术语与分段等影响。","lessons":["10-04"]},{"term":"TTS","definition":"将文本合成为语音的能力，涉及自然度、语气、发音、延迟及使用授权。","lessons":["10-05"]},{"term":"评测集 Evaluation set","definition":"用于衡量特定任务表现的样本集合，应体现目标任务、难例、权限与失败条件。","lessons":["11-02"]},{"term":"LLM-as-a-judge","definition":"使用模型按量表评审输出的方法，需要校准、偏差检查和必要的人工复核。","lessons":["11-04"]},{"term":"任务成功率","definition":"按明确任务完成标准计算的成功比例。必须注明样本、分母、人工介入和部分完成的处理。","lessons":["11-01","11-05"]},{"term":"回归评估","definition":"在版本改变后重复检查既有能力与关键案例，发现改进带来的退化。","lessons":["11-07"]},{"term":"延迟 Latency","definition":"从请求到指定响应事件的耗时。首Token、完整生成和任务完成延迟需区分。","lessons":["12-03"]},{"term":"成功任务成本","definition":"将调用、重试、工具、人工处理等成本与最终成功任务联系的口径，比单次模型价格更接近业务决策。","lessons":["12-04"]},{"term":"降级 Fallback","definition":"在能力或服务受限时提供较低能力但可用的替代路径，需要明确用户提示和结果边界。","lessons":["12-06"]},{"term":"灰度发布","definition":"逐步向部分用户或流量开放新版本，以观察质量与风险，配合监控和回滚条件。","lessons":["12-07","13-07"]},{"term":"AI PRD","definition":"定义用户任务、能力范围、数据、规则、交互、异常、评估和验收的需求说明。","lessons":["13-05"]},{"term":"Copilot","definition":"以辅助用户完成工作为主的交互与产品形态，用户通常保留过程控制与关键决定。","lessons":["14-01"]},{"term":"信任校准","definition":"帮助用户对系统能力、依据和不确定性形成合适预期，避免过度依赖或无谓不信任。","lessons":["14-04"]},{"term":"提示注入 Prompt injection","definition":"不可信内容试图改变系统原有任务或越过授权边界的攻击，需要多层防护与测试。","lessons":["15-02"]},{"term":"最小权限","definition":"仅授予完成当前任务必要的访问与操作范围，并考虑有效期、身份和撤销。","lessons":["15-03"]},{"term":"沙箱 Sandbox","definition":"限制执行环境可访问资源和操作范围的隔离机制。需要与权限、网络、文件和工具策略配合。","lessons":["15-03"]},{"term":"ROI","definition":"以明确时间范围、投入与收益口径评估回报的方法。节省的理论工时不自动等于可兑现现金收益。","lessons":["16-01"]},{"term":"单位经济性","definition":"按用户、任务或其他业务单位衡量收入、成本与贡献，需包含失败、重试和服务交付成本。","lessons":["16-03"]},{"term":"数据闭环","definition":"将使用和反馈转为可治理、可评估的改进输入的过程。数据积累本身不保证形成竞争优势。","lessons":["16-05","16-08"]}],"stats":{"domains":18,"lessons":144,"characters":192874,"sources":82,"jobs":30},"digest":"07651d9196e8"}</script><script>'use strict';
const KB=JSON.parse(document.getElementById('knowledge-data').textContent);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const byId=new Map(KB.lessons.map(x=>[x.id,x])),modById=new Map(KB.modules.map(x=>[x.id,x]));
const STORE='ai-pm-knowledge-reading-v2';
let storageOK=true,state={bookmarks:[],read:[],revisit:[],positions:{},last:null,font:18};
try{const raw=JSON.parse(localStorage.getItem(STORE)||'null');if(raw)state=cleanState(raw)}catch(e){storageOK=false}
let current=null,toastTimer=null,scrollTimer=null,restoring=false;
function cleanState(raw){
 const ids=v=>Array.isArray(v)?[...new Set(v.filter(x=>typeof x==='string'&&byId.has(x)))]:[];
 const positions={};if(raw&&typeof raw.positions==='object'&&raw.positions)for(const [id,p]of Object.entries(raw.positions))if(byId.has(id)&&Number.isFinite(p)&&p>=0)positions[id]=Math.min(p,1000000);
 return{bookmarks:ids(raw?.bookmarks),read:ids(raw?.read),revisit:ids(raw?.revisit),positions,last:byId.has(raw?.last)?raw.last:null,font:Number.isFinite(raw?.font)?Math.max(16,Math.min(23,raw.font)):18};
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){storageOK=false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function closeMenu(){$('#sidebar').classList.remove('open');$('#shade').classList.remove('visible');$('#menuBtn').setAttribute('aria-expanded','false')}
function setFont(){document.documentElement.style.setProperty('--font',state.font+'px');$('#fontValue').textContent=state.font+' px'}
function nav(){
 const items=[['home','◈','知识地图'],['questions','⌕','按问题查阅'],['cases','▤','产品案例库'],['career','↗','岗位与能力分析'],['glossary','Aa','术语索引'],['sources','↗','资料索引'],['reading','♡','我的阅读']];
 $('#mainNav').innerHTML=items.map(([id,ico,title])=>`<a href="#${id}" data-nav="${id}"><span class="nav-num">${ico}</span>${title}</a>`).join('');
 $('#moduleNav').innerHTML=KB.modules.map(m=>`<a href="#module/${m.id}" data-module="${m.id}"><span class="nav-num">${m.id}</span>${esc(m.title)}</a>`).join('');
}
function footer(){return`<footer class="page-foot">AI 产品经理成长知识库 · ${esc(KB.version)} · 内容核验 ${esc(KB.updated)}<br>自主掌握学习进度。资料入口用于深入阅读；平台功能与岗位条件请在使用时再次核实。<br><a href="#guide">阅读与维护说明</a> · <a href="#sample">30 个招聘岗位样本</a> · 内容版本 ${esc(KB.digest)}</footer>`}
function lessonLink(l){return`<a class="lesson-link" href="#lesson/${l.id}"><span class="number">${l.id.split('-')[1]}</span><div><h3>${esc(l.title)}</h3><p>${esc(l.moduleTitle)} · ${esc(l.level)} · 约 ${l.minutes} 分钟 ${state.read.includes(l.id)?' · 已读':''}${state.bookmarks.includes(l.id)?' · 已收藏':''}</p></div><span class="arrow">↗</span></a>`}
function moduleCard(m){const count=m.lessons.filter(l=>byId.has(l.id)).length;return`<a class="module-card" href="#module/${m.id}"><div class="card-top"><span>能力域 ${m.id}</span><span>${count} 篇 ↗</span></div><h3>${esc(m.title)}</h3><p>${esc(m.summary)}</p><div class="card-tags">${m.aliases.slice(0,4).map(esc).join(' / ')}</div></a>`}
function home(){
 const s=KB.stats,last=byId.get(state.last);
 return`<section class="hero"><div class="eyebrow">一套可持续扩充的个人知识库</div><h1>从理解 AI，<br>到做出有判断的产品。</h1><p>面向通用 AI 与 Agent 产品经理的持续学习知识库。连接基础原理、系统设计与产品决策，按自己的节奏深入。</p>${last?`<a class="button" href="#lesson/${last.id}">继续阅读 · ${esc(last.title)} →</a>`:`<a class="button" href="#lesson/01-01">从 AI 知识地图开始 →</a>`}<div class="stats"><div class="stat"><b>${s.domains}</b><span>能力域</span></div><div class="stat"><b>${s.lessons}</b><span>知识单元</span></div><div class="stat"><b>${(s.characters/10000).toFixed(1)} 万</b><span>中文正文</span></div><div class="stat"><b>${s.sources}</b><span>资料入口</span></div></div></section><div class="intro-row"><div><h2>完整知识体系</h2><p>由浅入深的参考顺序，也可以从当前问题进入。</p></div><a href="#questions" class="quiet">按工作问题查阅 →</a></div><section class="grid">${KB.modules.map(moduleCard).join('')}</section><div class="path-note">建议先读 01—03 建立基础，再连接模型、数据、RAG 和 Agent。产品设计与案例可随时查阅；每篇提供前置知识和深入阅读入口。</div><div class="intro-row"><div><h2>连接工作与机会</h2><p>从岗位原文看能力要求，从案例看产品取舍。</p></div></div><section class="grid"><a class="module-card" href="#career"><div class="card-top">研究与个人分析 ↗</div><h3>如何迁移 8 年产品经验</h3><p>基于 30 个招聘官方岗位样本，区分事实、岗位要求与个人补充方向。</p></a><a class="module-card" href="#cases"><div class="card-top">端到端案例 ↗</div><h3>看见完整系统如何工作</h3><p>知识助手、工具执行、研究办公和 AI SCADA 的流程、边界与失败复盘。</p></a></section>${footer()}`;
}
function modulePage(id){const m=modById.get(id);if(!m)return notFound();return`<div class="crumb"><a href="#home">知识地图</a> / 能力域 ${m.id}</div><div class="eyebrow">能力域 ${m.id}</div><h1 class="page-title">${esc(m.title)}</h1><p class="page-desc">${esc(m.summary)}</p><div class="mini-stats"><span>${m.lessons.length} 个知识单元</span><span>按需阅读 · 自主掌握进度</span></div><div class="lesson-list">${m.lessons.map(l=>byId.has(l.id)?lessonLink(byId.get(l.id)):'').join('')}</div>${footer()}`}
function tocLinks(l){return l.toc.map(h=>`<a href="#lesson/${l.id}" data-scroll="${h.id}" class="${h.level>2?'sub':''}">${esc(h.title)}</a>`).join('')}
function article(l){
 const m=modById.get(l.module),mi=m.lessons.findIndex(x=>x.id===l.id),prev=byId.get(m.lessons[mi-1]?.id),next=byId.get(m.lessons[mi+1]?.id);
 const pre=l.prerequisites.map(id=>byId.get(id)).filter(Boolean);
 const related=[...new Set([...pre.map(x=>x.id),...KB.lessons.filter(x=>x.prerequisites.includes(l.id)).map(x=>x.id)])].filter(id=>id!==l.id).slice(0,5);
 return`<div class="article-wrap"><div class="crumb"><a href="#home">知识地图</a> / <a href="#module/${m.id}">${m.id} ${esc(m.title)}</a> / ${l.id}</div><span class="pill">${esc(l.level)}</span><h1 class="page-title">${esc(l.title)}</h1><div class="article-meta"><span>约 ${l.minutes} 分钟阅读</span><span>${l.chars.toLocaleString()} 字</span><span>核验 ${KB.updated}</span></div><div class="article-tools"><button class="button ${state.bookmarks.includes(l.id)?'selected':''}" data-action="bookmarks" data-id="${l.id}">${state.bookmarks.includes(l.id)?'♥ 已收藏':'♡ 收藏本篇'}</button><button class="button ${state.read.includes(l.id)?'selected':''}" data-action="read" data-id="${l.id}">${state.read.includes(l.id)?'✓ 已读':'标为已读'}</button><button class="button ${state.revisit.includes(l.id)?'selected':''}" data-action="revisit" data-id="${l.id}">${state.revisit.includes(l.id)?'↻ 待重读':'稍后重读'}</button><button class="button" data-copy="${l.id}">复制链接</button></div>${pre.length?`<div class="prereq">前置阅读：${pre.map(p=>`<a href="#lesson/${p.id}">${esc(p.title)}</a>`).join(' · ')}。可以按需回看。</div>`:''}<details class="mobile-toc"><summary>本篇目录 · ${l.toc.length} 节</summary>${tocLinks(l)}</details><article class="prose">${l.html}</article><div class="article-next">${prev?`<a href="#lesson/${prev.id}"><small>← 上一篇</small>${esc(prev.title)}</a>`:`<a href="#module/${m.id}"><small>返回专题</small>${esc(m.title)}</a>`}${next?`<a href="#lesson/${next.id}"><small>下一篇 →</small>${esc(next.title)}</a>`:`<a href="#home"><small>继续探索 →</small>返回完整知识地图</a>`}</div>${related.length?`<section class="related"><h3>关联阅读</h3><div class="related-links">${related.map(id=>`<a href="#lesson/${id}">${esc(byId.get(id).title)}</a>`).join('')}</div></section>`:''}${footer()}</div>`;
}
const questions=[
 ['模型为什么答错？','沿着模型、输入、证据、执行和验收逐层定位。',['02-08','05-07','07-07','11-08']],
 ['什么时候用 RAG，什么时候微调？','从任务、知识变化、数据与评估比较方案。',['04-04','04-05','07-01','07-08']],
 ['Agent 为什么重复执行或停不下来？','理解幂等、状态、任务终止和恢复。',['08-05','08-06','09-06','09-08']],
 ['如何判断 AI 功能真的变好了？','连接业务目标、评测集、在线效果与回归。',['11-01','11-02','11-06','11-07']],
 ['如何兼顾质量、速度与成本？','比较任务成本、延迟和可靠性。',['04-03','12-03','12-04','12-08']],

];
function questionPage(){return`<div class="eyebrow">从工作问题出发</div><h1 class="page-title">从工作问题进入</h1><p class="page-desc">将一个现实问题连接到相关原理、方法和案例。每条路线可以自由跳读。</p><div class="question-grid">${questions.map(([q,d,ids])=>`<section class="question-card"><h3>${esc(q)}</h3><p>${esc(d)}</p>${ids.filter(id=>byId.has(id)).map(id=>`<a href="#lesson/${id}">${esc(byId.get(id).title)} ↗</a><br>`).join('')}</section>`).join('')}</div>${footer()}`}
function readingPage(){const group=(title,ids)=>`<div class="intro-row"><h2>${title} <span class="quiet">${ids.length}</span></h2></div>${ids.length?`<div class="lesson-list">${ids.map(id=>byId.get(id)).filter(Boolean).map(lessonLink).join('')}</div>`:'<p class="empty">暂时没有记录。在文章上方可以收藏或标记。</p>'}`;return`<div class="eyebrow">自主整理阅读记录</div><h1 class="page-title">我的阅读</h1><p class="page-desc">按自己的节奏阅读。记录保存在当前浏览器，阅读标记只用于整理；可在右上角 Aa 中导出、导入。</p>${state.last?`<a class="button" href="#lesson/${state.last}">继续上次阅读 →</a>`:''}${group('已收藏',state.bookmarks)}${group('稍后重读',state.revisit)}${group('已读',state.read)}${footer()}`}
function glossaryPage(){return`<div class="eyebrow">概念与术语</div><h1 class="page-title">术语索引</h1><p class="page-desc">用简短解释定位概念，再进入完整正文。可用全文搜索查找更多中英文术语。</p>${KB.glossary.map(t=>`<section class="term"><h3>${esc(t.term)}</h3><p>${esc(t.definition)}</p>${t.lessons.filter(id=>byId.has(id)).map(id=>`<a href="#lesson/${id}">${esc(byId.get(id).title)} ↗</a>`).join(' · ')}</section>`).join('')}${footer()}`}
function sourcesPage(){return`<div class="eyebrow">一手资料与延伸阅读</div><h1 class="page-title">资料索引</h1><p class="page-desc">${KB.sources.length} 个去重资料入口，连接官方文档、原始论文、公开课程与产品资料。每篇正文列出相关来源；引用来源与教学构造案例分别说明。</p><div class="sources-list">${KB.sources.map(s=>`<div class="source-item"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a><small>${esc(new URL(s.url).hostname)} · 关联 ${s.lessons.length} 篇 · 核验 ${KB.updated}</small><small>${s.lessons.slice(0,4).map(id=>`<a href="#lesson/${id}">${id}</a>`).join(' / ')}</small></div>`).join('')}</div>${footer()}`}
function reportPage(kind){const titles={career:'岗位能力与个人补充方向',sample:'30 个招聘岗位样本',guide:'阅读与维护说明'};const r=KB.reports[kind];return`<div class="article-wrap"><div class="crumb"><a href="#home">知识地图</a> / ${titles[kind]}</div>${kind==='career'?'<div class="mini-stats"><span>30 个官方岗位正文</span><span>10 个中文 · 20 个国际样本</span><a class="button" href="#sample">查看样本与来源 ↗</a></div>':''}<article class="prose">${r?.html||'<p>资料暂未载入。</p>'}</article>${footer()}</div>`}
function notFound(){return`<h1 class="page-title">暂未找到这一页</h1><p class="page-desc">可以返回知识地图或搜索正文。</p><a class="button" href="#home">返回知识地图</a>`}
function savePosition(){if(current&&!restoring){state.positions[current]=Math.max(0,Math.round(window.scrollY));save()}}
function render(){
 savePosition();closeMenu();const [type='home',id]=location.hash.replace(/^#/,'').split('/');current=null;
 $('#main').className='';$('#toc').className='toc';$('#toc').innerHTML='';
 let content='';
 if(type==='lesson'&&byId.has(id)){const l=byId.get(id);current=id;state.last=id;save();$('#main').classList.add('article-layout');content=article(l);$('#toc').innerHTML='<div class="toc-title">本篇目录</div>'+tocLinks(l);$('#toc').classList.add('visible');document.title=l.title+' · AI产品经理学习笔记'}
 else {document.title='AI产品经理学习笔记 · 成长知识库';if(type==='module')content=modulePage(id);else if(type==='questions')content=questionPage();else if(type==='cases')content=modulePage('17');else if(type==='reading')content=readingPage();else if(type==='sources')content=sourcesPage();else if(type==='glossary')content=glossaryPage();else if(['career','sample','guide'].includes(type))content=reportPage(type);else content=home()}
 $('#main').innerHTML=content;$$('.sidebar a').forEach(a=>a.classList.remove('active'));
 if(current||type==='module'){const mid=current?byId.get(current).module:id;$(`[data-module="${mid}"]`)?.classList.add('active')}else $(`[data-nav="${type}"]`)?.classList.add('active');
 restoring=true;requestAnimationFrame(()=>{const root=document.documentElement,old=root.style.scrollBehavior;root.style.scrollBehavior='auto';window.scrollTo(0,current?(state.positions[current]||0):0);root.style.scrollBehavior=old;requestAnimationFrame(()=>{restoring=false;updateScroll()})});
 if($('#searchDialog').open)$('#searchDialog').close();
}
function updateScroll(){const max=document.documentElement.scrollHeight-innerHeight;$('#readingProgress').style.width=current&&max>0?(100*scrollY/max)+'%':'0';$('#backtop').classList.toggle('visible',scrollY>500);if(current){const heads=$$('.prose h2,.prose h3,.prose h4');let active=heads[0]?.id;for(const h of heads){if(h.getBoundingClientRect().top<155)active=h.id}$$('#toc a').forEach(a=>a.classList.toggle('current',a.dataset.scroll===active))}}
function search(query){
 const q=query.trim().toLowerCase();if(!q){$('#searchResults').innerHTML='<p class="empty">输入一个术语或问题，例如 RAG、工具调用、模型评估、作品集。</p>';return}
 const terms=q.split(/\s+/).filter(Boolean);const results=[];
 for(const l of KB.lessons){const title=l.title.toLowerCase(),body=l.text.toLowerCase(),aliases=l.aliases.join(' ').toLowerCase();let score=0,ok=true;for(const t of terms){const hit=title.includes(t)||body.includes(t)||aliases.includes(t);if(!hit){ok=false;break}score+=(title.includes(t)?12:0)+(aliases.includes(t)?4:0)+Math.min(5,body.split(t).length-1)}if(ok)results.push({l,score})}
 results.sort((a,b)=>b.score-a.score);const limited=results.slice(0,45);
 $('#searchResults').innerHTML=`<div class="search-hint">找到 ${results.length} 篇${results.length>45?' · 显示前 45 篇':''}</div>`+(limited.length?limited.map(({l})=>{const plain=l.text.replace(/[#*`>|]/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\s+/g,' ');const ix=Math.max(0,plain.toLowerCase().indexOf(terms[0]));const snippet=plain.slice(Math.max(0,ix-40),ix+130);return`<a class="search-result" href="#lesson/${l.id}"><small>${esc(l.moduleTitle)} · ${l.id}</small><h3>${highlight(l.title,terms)}</h3><p>${highlight(snippet,terms)}…</p></a>`}).join(''):'<p class="empty">没有找到匹配内容。可尝试更短的术语或中英文别名。</p>');
}
function highlight(s,terms){let v=esc(s);const pattern=terms.map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');if(!pattern)return v;return v.replace(new RegExp('('+pattern+')','ig'),'<mark>$1</mark>')}
function openSearch(){closeMenu();$('#searchDialog').showModal();search($('#searchInput').value);setTimeout(()=>$('#searchInput').focus(),30)}
document.addEventListener('click',async e=>{
 const scroll=e.target.closest('[data-scroll]');if(scroll){e.preventDefault();document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}
 const a=e.target.closest('[data-action]');if(a){const key=a.dataset.action,id=a.dataset.id;if(!byId.has(id)||!['bookmarks','read','revisit'].includes(key))return;state[key]=state[key].includes(id)?state[key].filter(x=>x!==id):[id,...state[key]];save();const pos=scrollY;$('#main').innerHTML=article(byId.get(id));window.scrollTo(0,pos);toast(storageOK?'阅读记录已保存':'当前浏览器无法保存，请及时导出');return}
 const copy=e.target.closest('[data-copy]');if(copy){const url=location.href.split('#')[0]+'#lesson/'+copy.dataset.copy;try{await navigator.clipboard.writeText(url);toast('本篇链接已复制')}catch(err){toast('请复制浏览器地址栏中的本篇链接')}return}
 if(e.target.closest('.search-result')&&e.target.closest('a').hash===location.hash)$('#searchDialog').close();
});

$('#searchBtn').addEventListener('click',openSearch);$('#closeSearch').addEventListener('click',()=>$('#searchDialog').close());$('#searchInput').addEventListener('input',e=>search(e.target.value));$('#searchForm').addEventListener('submit',e=>e.preventDefault());
$('#settingsBtn').addEventListener('click',()=>{$('#settingsDialog').showModal();setFont()});$('#closeSettings').addEventListener('click',()=>$('#settingsDialog').close());
$('#fontMinus').addEventListener('click',()=>{state.font=Math.max(16,state.font-1);setFont();save()});$('#fontPlus').addEventListener('click',()=>{state.font=Math.min(23,state.font+1);setFont();save()});
$('#exportBtn').addEventListener('click',()=>{savePosition();const blob=new Blob([JSON.stringify({format:'ai-pm-reading',version:2,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AI产品经理-阅读记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('阅读记录已导出')});
$('#importInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('文件过大');const raw=JSON.parse(await f.text());if(raw.format!=='ai-pm-reading'||raw.version!==2||!raw.state||typeof raw.state!=='object')throw Error('格式不匹配');const incoming=cleanState(raw.state);savePosition();for(const k of ['bookmarks','read','revisit'])state[k]=[...new Set([...state[k],...incoming[k]])];state.positions={...state.positions,...incoming.positions};state.last=incoming.last||state.last;state.font=incoming.font;save();setFont();$('#importMessage').textContent='已合并阅读记录，原有收藏与标记保留。';toast('阅读记录已合并');if(current){restoring=true;render()}else if(location.hash==='#reading')render()}catch(err){$('#importMessage').textContent='导入失败：'+err.message+'。原有阅读记录未修改。'}finally{e.target.value=''}});
$('#backtop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
$('.skip').addEventListener('click',e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView({behavior:'smooth',block:'start'})});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeMenu()});
window.addEventListener('scroll',()=>{updateScroll();clearTimeout(scrollTimer);scrollTimer=setTimeout(savePosition,300)},{passive:true});window.addEventListener('pagehide',savePosition);window.addEventListener('hashchange',render);
nav();setFont();render();
