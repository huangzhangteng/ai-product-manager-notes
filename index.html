研究结论必须注明原型中哪些环节由人代替、哪些材料经过精选。<\/p><h2 id=\"section-5\">处理小样本与矛盾意见<\/h2><p>早期定性研究适合发现机制和问题，不能凭几次访谈推断市场比例。若不同角色意见相反，先分析他们承担的任务、风险和激励是否不同。业务主管关心产能，执行者关心核对负担，安全负责人关心信息流向；这些诉求可以共同成为产品约束。<\/p><p>最终的研究产物应能说明核心任务、关键障碍、用户分层、判断标准、采用条件与仍未证实的假设。后续每次看到新的行为证据，都可以修订认识。持续维护证据比给需求贴上“已验证”标签更能支撑产品决策。<\/p><h2 id=\"section-6\">把矛盾转成可追踪的问题<\/h2><p>用户有时同时希望助手更主动、又不希望它做多余动作。研究不必急于选择其中一边，而应追问在哪类任务、哪个阶段、什么后果下希望主动。结果可能是允许主动收集资料，但外发前需要确认。情境化的边界比抽象偏好更能指导设计。<\/p><p>对每项重要需求，保留原始材料、观察场景和解释过程，并注意获得适当授权与去除敏感信息。后续当团队发现假设不成立时，能够回看当时证据及适用范围。研究资产的价值在于帮助更新认识，而不是把用户的一句话永久固定成需求。<\/p><h2 id=\"section-7\">研究资料如何沉淀<\/h2><p>每个重要观察可以关联任务、角色、场景、原始记录与分析结论。相同现象出现时，先检查是否来自独立用户与不同条件，避免把一次访谈的多个转述当成多份证据。研究材料公开或跨团队使用时，需要适当授权与脱敏。<\/p><p>产品决策可以直接链接支持它的观察，并列出仍未确认的假设。后续若行为变化，能够定位是用户、流程、技术还是环境改变。这种可追溯方式使研究成为持续资产，也让团队知道何时该重新调查，而不是只在立项前做一次访谈。<\/p><p>资料核验日期：2026-11-14。周报与销售场景为教学构造。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/14-02\">输入引导、上下文提供与澄清<\/a><\/li><li><a href=\"#lesson/13-08\">产品指标体系与持续迭代<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Toolkit 与人机交互设计资源<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Guidelines for Human-AI Interaction<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"把研究对象放回具体场景","level":2},{"id":"section-2","title":"区分几种证据","level":2},{"id":"section-3","title":"AI 场景特有的研究内容","level":2},{"id":"section-4","title":"从假设到验证设计","level":2},{"id":"section-5","title":"处理小样本与矛盾意见","level":2},{"id":"section-6","title":"把矛盾转成可追踪的问题","level":2},{"id":"section-7","title":"研究资料如何沉淀","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 用户研究需要同时观察用户想完成的工作，以及用户如何判断机器的结果。单独询问“是否愿意使用智能助手”容易获得积极但不可靠的回答。更有价值的是还原最近一次真实任务，观察材料、决策、工具切换、错误与返工。\n\n## 把研究对象放回具体场景\n\n访谈可以围绕任务发生前、执行中和结束后三段展开。任务发生前看触发条件、来源和优先级；执行中看查找、判断、沟通与系统操作；结束后看谁接手、如何确认完成、错误怎样被发现。对每一步记录事实与解释，避免把用户的推测当作观察结果。\n\n例如，用户说“写周报很耗时”，实际观察可能发现写作只有十分钟，回溯工作记录占四十分钟，向同事确认状态又耗去二十分钟。这时主要机会可能在信息收集与事实校验，而非让模型把文字写得更长。解决错环节会带来新界面，却未必改善工作。\n\n## 区分几种证据\n\n口头偏好反映态度，行为观察反映实际困难，历史记录反映发生频率，原型使用反映初步可用性，持续使用与结果数据才更接近价值验证。它们回答的问题不同，不应互相替代。一个用户喜欢演示，不能直接推断整个团队会长期采用。\n\n研究记录中可以标注“观察到”“用户陈述”“团队推断”和“尚未验证”。这不是繁琐文档，而是减少争论成本：当团队分歧时，可以回到证据等级，明确下一步需要更多观察、数据还是技术验证。\n\n## AI 场景特有的研究内容\n\n用户对错误的容忍度取决于任务。创意草稿可以接受多种答案，财务数字则需要可追溯依据。还要观察用户能否识别错误、是否会过度信任流畅表达、核对需要多大成本，以及什么时候愿意交出控制权。这些因素会影响交互形态和自动化程度。\n\n资料授权也必须进入研究范围。用户可能愿意让助手整理内容，却没有权限把资料发送到外部服务。组织层面的采购、安全和流程约束，会影响真实采用。应区分个人使用意愿、团队流程可接受性与企业准入条件。\n\n## 从假设到验证设计\n\n一个好的假设包含对象、场景、改变与观察指标。例如：“在相同资料条件下，提供带来源的客户摘要，可减少销售交接时的补充问答。”它比“摘要更智能”更容易被证据支持或推翻。\n\n可以先用人工模拟部分后台流程来观察交互，或使用受控资料展示不同产物，尽早发现价值和理解问题。但这种原型无法证明真实系统的稳定性、成本或规模化能力。研究结论必须注明原型中哪些环节由人代替、哪些材料经过精选。\n\n## 处理小样本与矛盾意见\n\n早期定性研究适合发现机制和问题，不能凭几次访谈推断市场比例。若不同角色意见相反，先分析他们承担的任务、风险和激励是否不同。业务主管关心产能，执行者关心核对负担，安全负责人关心信息流向；这些诉求可以共同成为产品约束。\n\n最终的研究产物应能说明核心任务、关键障碍、用户分层、判断标准、采用条件与仍未证实的假设。后续每次看到新的行为证据，都可以修订认识。持续维护证据比给需求贴上“已验证”标签更能支撑产品决策。\n\n## 把矛盾转成可追踪的问题\n\n用户有时同时希望助手更主动、又不希望它做多余动作。研究不必急于选择其中一边，而应追问在哪类任务、哪个阶段、什么后果下希望主动。结果可能是允许主动收集资料，但外发前需要确认。情境化的边界比抽象偏好更能指导设计。\n\n对每项重要需求，保留原始材料、观察场景和解释过程，并注意获得适当授权与去除敏感信息。后续当团队发现假设不成立时，能够回看当时证据及适用范围。研究资产的价值在于帮助更新认识，而不是把用户的一句话永久固定成需求。\n\n## 研究资料如何沉淀\n\n每个重要观察可以关联任务、角色、场景、原始记录与分析结论。相同现象出现时，先检查是否来自独立用户与不同条件，避免把一次访谈的多个转述当成多份证据。研究材料公开或跨团队使用时，需要适当授权与脱敏。\n\n产品决策可以直接链接支持它的观察，并列出仍未确认的假设。后续若行为变化，能够定位是用户、流程、技术还是环境改变。这种可追溯方式使研究成为持续资产，也让团队知道何时该重新调查，而不是只在立项前做一次访谈。\n\n资料核验日期：2026-11-14。周报与销售场景为教学构造。\n\n### 关联阅读\n\n- [输入引导、上下文提供与澄清](14-02.md)\n- [产品指标体系与持续迭代](13-08.md)\n\n### 资料与延伸阅读\n\n- [Microsoft：HAX Toolkit 与人机交互设计资源](https://www.microsoft.com/en-us/haxtoolkit/)\n- [Microsoft：Guidelines for Human-AI Interaction](https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/)\n","chars":1479,"minutes":6,"summary":"AI 用户研究需要同时观察用户想完成的工作，以及用户如何判断机器的结果。单独询问“是否愿意使用智能助手”容易获得积极但不可靠的回答。更有价值的是还原最近一次真实任务，观察材料、决策、工具切换、错误与返工。"},{"id":"13-04","title":"AI 产品策略、定位与竞争分析","file":"content/13-04.md","level":"工作应用","prerequisites":["13-03"],"aliases":["PRD","需求","产品策略"],"module":"13","moduleTitle":"AI 产品机会与产品设计","html":"<p>AI 产品策略需要明确服务谁、在哪项任务上创造价值，以及凭什么持续做好。把“接入某个模型”当作定位，容易让产品价值随供应商升级而消失。策略应把用户任务、产品能力、数据条件、分发与交付能力连接起来。<\/p><h2 id=\"section-1\">定位从任务与用户分层开始<\/h2><p>“企业 AI 助手”范围很大。面向销售准备客户会议、面向财务核对报销材料、面向管理者理解经营异常，它们的输入、工作流、容错与购买者都不同。越能说明具体任务，越容易比较替代方案与形成产品边界。<\/p><p>定位还需要区分使用者、购买者、管理者和受影响者。员工希望少切换工具，部门负责人希望结果一致，采购方希望成本可预测，安全方希望权限可控。若只为其中一个角色设计价值主张，产品可能在试用时受欢迎，却无法进入组织流程。<\/p><h2 id=\"section-2\">竞争分析要比较完成任务的方式<\/h2><p>竞争者不仅包括同类 AI 产品，还包括现有软件、人工流程、外包服务与用户自己搭建的自动化。比较时固定用户任务和输入条件，观察最终产物、操作步骤、核对负担、失败恢复和总体成本。功能表只能展示“有没有”，不容易展示“是否真的完成”。<\/p><p>技术演示也会造成偏差。某产品展示十分钟完成研究报告，可能使用了预选材料或人工编辑。公开信息不足时，应标注观察条件，不推断隐藏架构。竞品拆解可以提出假设，但需要把可见行为与架构猜测分开。<\/p><h2 id=\"section-3\">差异化来自可积累的能力<\/h2><p>模型能力可以快速扩散，长期优势可能来自任务知识、数据质量、权限与系统连接、评估资产、分发渠道、交付能力和用户工作习惯。这些因素也并非天然构成壁垒：数据必须合法可用且能改善任务，连接器必须可靠维护，用户习惯必须建立在真实价值上。<\/p><p>以教学构造的合同准备助手为例，生成通用摘要容易被替代；能准确定位企业条款、保持版本与权限、连接法务工作流并留下审核记录，才可能形成更强的任务价值。其优势来自系统与组织适配，而非一个提示词。<\/p><h2 id=\"section-4\">在能力边界内安排策略<\/h2><p>市场机会、技术能力与组织资源需要同时匹配。若团队缺少高质量数据，短期可能先做可控资料范围的助手；若缺少可靠执行接口，先提供可编辑建议可能更合理。策略需要说明阶段目标以及解锁下一阶段的条件，而非只写功能发布日期。<\/p><p>还应区分事实、假设和赌注。事实是已观察到的任务负担或可用数据，假设是用户会采用某种交互，赌注是某类模型能力将在可接受成本下改善。不同类型需要不同的验证和监控方式，不能让未来预期伪装成当前能力。<\/p><h2 id=\"section-5\">策略如何落到日常取舍<\/h2><p>当出现新功能建议时，可以问它服务的任务是否属于定位、是否改善关键指标、是否加强可积累能力、是否增加无法承担的交付负担。策略的价值体现在帮助团队做选择。若所有需求都能被解释为“符合 AI 趋势”，说明策略还没有形成足够明确的边界。<\/p><p>策略文档应保留目标用户、核心任务、价值主张、替代方案、能力依赖、竞争依据和复审条件。随着模型与市场变化，具体路径可以调整，用户任务与判断依据仍然需要清楚。<\/p><h2 id=\"section-6\">竞争判断要考虑迁移与维护成本<\/h2><p>用户选择产品时还会考虑历史资料、权限设置、同事协作和切换成本。新产品即使单次结果更好，如果需要重新授权大量系统、改变关键流程或增加管理员负担，也可能难以替换现有工具。因此差异化需要在真实采用条件下成立。<\/p><p>另一方面，过度依赖某个独家接口或模型能力也会形成供应风险。策略应保留关键依赖清单，以及发生价格、许可、服务或接口变化时的替代路径。长期优势不只体现在增长时的速度，也体现在变化发生时能否持续交付任务价值。<\/p><h2 id=\"section-7\">用策略假设连接路线图<\/h2><p>策略可以形成几条明确假设：某类用户有持续任务、当前替代方案负担高、产品能以可承受成本改善、组织愿意采用。路线图中的重要工作应能说明它在加强哪条假设，或者减少哪项未知。<\/p><p>当证据推翻核心假设时，调整定位比继续添加功能更有意义。例如用户真正需要的是可靠查询，而不是自主执行；此时把资源投入来源与权限，可能比多 Agent 更符合策略。策略的稳定性来自判断逻辑清楚，具体方案则应允许变化。<\/p><p>资料核验日期：2026-11-14。合同助手为教学构造。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/16-08\">竞争优势、数据闭环与增长边界<\/a><\/li><li><a href=\"#lesson/18-01\">AI 产品岗位分型与能力要求<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://developers.google.com/machine-learning/guides/rules-of-ml\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Rules of Machine Learning<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"定位从任务与用户分层开始","level":2},{"id":"section-2","title":"竞争分析要比较完成任务的方式","level":2},{"id":"section-3","title":"差异化来自可积累的能力","level":2},{"id":"section-4","title":"在能力边界内安排策略","level":2},{"id":"section-5","title":"策略如何落到日常取舍","level":2},{"id":"section-6","title":"竞争判断要考虑迁移与维护成本","level":2},{"id":"section-7","title":"用策略假设连接路线图","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 产品策略需要明确服务谁、在哪项任务上创造价值，以及凭什么持续做好。把“接入某个模型”当作定位，容易让产品价值随供应商升级而消失。策略应把用户任务、产品能力、数据条件、分发与交付能力连接起来。\n\n## 定位从任务与用户分层开始\n\n“企业 AI 助手”范围很大。面向销售准备客户会议、面向财务核对报销材料、面向管理者理解经营异常，它们的输入、工作流、容错与购买者都不同。越能说明具体任务，越容易比较替代方案与形成产品边界。\n\n定位还需要区分使用者、购买者、管理者和受影响者。员工希望少切换工具，部门负责人希望结果一致，采购方希望成本可预测，安全方希望权限可控。若只为其中一个角色设计价值主张，产品可能在试用时受欢迎，却无法进入组织流程。\n\n## 竞争分析要比较完成任务的方式\n\n竞争者不仅包括同类 AI 产品，还包括现有软件、人工流程、外包服务与用户自己搭建的自动化。比较时固定用户任务和输入条件，观察最终产物、操作步骤、核对负担、失败恢复和总体成本。功能表只能展示“有没有”，不容易展示“是否真的完成”。\n\n技术演示也会造成偏差。某产品展示十分钟完成研究报告，可能使用了预选材料或人工编辑。公开信息不足时，应标注观察条件，不推断隐藏架构。竞品拆解可以提出假设，但需要把可见行为与架构猜测分开。\n\n## 差异化来自可积累的能力\n\n模型能力可以快速扩散，长期优势可能来自任务知识、数据质量、权限与系统连接、评估资产、分发渠道、交付能力和用户工作习惯。这些因素也并非天然构成壁垒：数据必须合法可用且能改善任务，连接器必须可靠维护，用户习惯必须建立在真实价值上。\n\n以教学构造的合同准备助手为例，生成通用摘要容易被替代；能准确定位企业条款、保持版本与权限、连接法务工作流并留下审核记录，才可能形成更强的任务价值。其优势来自系统与组织适配，而非一个提示词。\n\n## 在能力边界内安排策略\n\n市场机会、技术能力与组织资源需要同时匹配。若团队缺少高质量数据，短期可能先做可控资料范围的助手；若缺少可靠执行接口，先提供可编辑建议可能更合理。策略需要说明阶段目标以及解锁下一阶段的条件，而非只写功能发布日期。\n\n还应区分事实、假设和赌注。事实是已观察到的任务负担或可用数据，假设是用户会采用某种交互，赌注是某类模型能力将在可接受成本下改善。不同类型需要不同的验证和监控方式，不能让未来预期伪装成当前能力。\n\n## 策略如何落到日常取舍\n\n当出现新功能建议时，可以问它服务的任务是否属于定位、是否改善关键指标、是否加强可积累能力、是否增加无法承担的交付负担。策略的价值体现在帮助团队做选择。若所有需求都能被解释为“符合 AI 趋势”，说明策略还没有形成足够明确的边界。\n\n策略文档应保留目标用户、核心任务、价值主张、替代方案、能力依赖、竞争依据和复审条件。随着模型与市场变化，具体路径可以调整，用户任务与判断依据仍然需要清楚。\n\n## 竞争判断要考虑迁移与维护成本\n\n用户选择产品时还会考虑历史资料、权限设置、同事协作和切换成本。新产品即使单次结果更好，如果需要重新授权大量系统、改变关键流程或增加管理员负担，也可能难以替换现有工具。因此差异化需要在真实采用条件下成立。\n\n另一方面，过度依赖某个独家接口或模型能力也会形成供应风险。策略应保留关键依赖清单，以及发生价格、许可、服务或接口变化时的替代路径。长期优势不只体现在增长时的速度，也体现在变化发生时能否持续交付任务价值。\n\n## 用策略假设连接路线图\n\n策略可以形成几条明确假设：某类用户有持续任务、当前替代方案负担高、产品能以可承受成本改善、组织愿意采用。路线图中的重要工作应能说明它在加强哪条假设，或者减少哪项未知。\n\n当证据推翻核心假设时，调整定位比继续添加功能更有意义。例如用户真正需要的是可靠查询，而不是自主执行；此时把资源投入来源与权限，可能比多 Agent 更符合策略。策略的稳定性来自判断逻辑清楚，具体方案则应允许变化。\n\n资料核验日期：2026-11-14。合同助手为教学构造。\n\n### 关联阅读\n\n- [竞争优势、数据闭环与增长边界](16-08.md)\n- [AI 产品岗位分型与能力要求](18-01.md)\n\n### 资料与延伸阅读\n\n- [Google：Rules of Machine Learning](https://developers.google.com/machine-learning/guides/rules-of-ml)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1464,"minutes":6,"summary":"AI 产品策略需要明确服务谁、在哪项任务上创造价值，以及凭什么持续做好。把“接入某个模型”当作定位，容易让产品价值随供应商升级而消失。策略应把用户任务、产品能力、数据条件、分发与交付能力连接起来。"},{"id":"13-05","title":"AI PRD：能力、数据、规则与验收","file":"content/13-05.md","level":"工作应用","prerequisites":["13-04"],"aliases":["PRD","需求","产品策略"],"module":"13","moduleTitle":"AI 产品机会与产品设计","html":"<p>AI PRD 的作用是把不确定的模型能力，转化为可以开发、讨论和验收的产品行为。它既需要说明用户体验，也需要说明数据、工具、权限、失败处理和质量标准。只写“模型根据上下文智能回答”，会把关键产品决策留到开发现场。<\/p><figure class=\"concept-diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 602\" role=\"img\" aria-labelledby=\"title-product desc-product\"><title id=\"title-product\">AI 产品的决策闭环<\/title><desc id=\"desc-product\">用户任务：现有流程、瓶颈、收益与错误代价；能力与方案：数据、模型、工具、人工和替代方案；产品定义：流程、交互、权限、异常与验收；验证与上线：原型证据、质量成本、试点与发布；运行与学习：实际使用、反馈、失败与产品迭代<\/desc><rect width=\"360\" height=\"602\" rx=\"15\" fill=\"#f0f4ec\"/><text x=\"24\" y=\"35\" fill=\"#244c3e\" font-size=\"16\" font-family=\"sans-serif\" font-weight=\"600\">AI 产品的决策闭环<\/text><rect x=\"22\" y=\"56\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"80\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"84\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">1<\/text><text x=\"65\" y=\"84\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">用户任务<\/text><text x=\"37\" y=\"109\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">现有流程、瓶颈、收益与错误代价<\/text><path d=\"M180 131 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"148\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"172\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"176\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">2<\/text><text x=\"65\" y=\"176\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">能力与方案<\/text><text x=\"37\" y=\"201\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">数据、模型、工具、人工和替代方案<\/text><path d=\"M180 223 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"240\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"264\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">3<\/text><text x=\"65\" y=\"268\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">产品定义<\/text><text x=\"37\" y=\"293\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">流程、交互、权限、异常与验收<\/text><path d=\"M180 315 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"332\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"356\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"360\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">4<\/text><text x=\"65\" y=\"360\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">验证与上线<\/text><text x=\"37\" y=\"385\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">原型证据、质量成本、试点与发布<\/text><path d=\"M180 407 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"424\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"448\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"452\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">5<\/text><text x=\"65\" y=\"452\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">运行与学习<\/text><text x=\"37\" y=\"477\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">实际使用、反馈、失败与产品迭代<\/text><text x=\"24\" y=\"558\" font-size=\"10.5\" fill=\"#6a816c\" font-family=\"sans-serif\">每一步都有假设，后续证据可以改变前面的选择。<\/text><\/svg><figcaption>AI产品从任务到迭代的闭环 · 本知识库绘制的机制示意<\/figcaption><\/figure><h2 id=\"section-1\">从完整任务定义开始<\/h2><p>首先写清用户、触发条件、可用输入、期望产物与任务完成标准。例如，“根据已授权的订单与政策，为客服生成退款建议，附政策出处；真正退款由客服确认后通过业务接口执行”。这句话同时定义了信息范围、产物、证据、控制权和行动边界。<\/p><p>正常流程之后要描述分支：资料缺失、政策冲突、权限不足、工具超时、用户取消、输出无法校验时怎么办。模型可能提供候选内容，产品必须决定哪些候选可以展示、哪些可以执行、哪些需要转人工。异常流程常比成功演示更能暴露需求是否完整。<\/p><h2 id=\"section-2\">明确系统输入与输出契约<\/h2><p>输入应记录来源、格式、大小、更新时间、权限与保留要求。输出应记录结构、必要字段、引用、允许为空的条件与可编辑性。对于结构化输出，字段合法不等于业务正确，还需要金额范围、状态约束和关联对象等校验。<\/p><p>工具契约至少包括动作名称、参数、前置条件、权限、返回值、副作用和幂等要求。重试一个查询通常问题较小，重试一次付款则可能产生严重后果。需求应区分查询、草稿、审批和实际执行，不能把它们统称为“调用接口”。<\/p><h2 id=\"section-3\">用任务级标准定义质量<\/h2><p>质量标准应贴近用户任务。例如知识助手除了回答是否正确，还需要检查来源是否支持结论、是否遵守权限、是否知道何时拒答。工具 Agent 则要看任务是否完成、是否执行了多余动作、重复执行如何处理，以及失败后是否保持一致状态。<\/p><p>标准还需要说明测量对象与样本。平均成功率会掩盖高风险类别失败，因此可以按任务类型、资料质量、权限层级和异常条件拆分。这里的评测是产品与系统验收方法，不是对学习者安排测验。<\/p><h2 id=\"section-4\">教学构造的需求片段<\/h2><p>对于“创建客户回访任务”，需求可以规定：模型整理客户、回访日期和理由；系统验证客户存在且用户有权限；缺少日期时先澄清；提交前展示摘要；执行接口使用唯一请求标识；成功后返回任务链接；超时后先查询状态，避免直接重复创建。<\/p><p>这段描述并未指定必须使用哪种编排框架，却足以让研发讨论状态、前端展示、工具和测试用例。技术选型仍需要工程评估，产品需求负责说明应达成的行为与约束。<\/p><h2 id=\"section-5\">PRD 的维护方式<\/h2><p>AI 能力和提示经常迭代，因此 PRD 应关联模型与配置版本、评测基线、数据版本和决策记录。一个提示变更若影响输出结构、成本或权限行为，也需要经过适当检查。文档不必记录每个内部实现细节，但应让团队能够追溯当前行为为何如此设计。<\/p><p>一份可用的 AI PRD 能回答：系统承诺什么、依赖什么、如何知道达标、失败时谁做什么。它把模糊的“智能”拆成可讨论的能力与规则，帮助产品、算法、工程、运营和安全围绕同一任务协作。<\/p><h2 id=\"section-6\">验收需要连接体验与后台状态<\/h2><p>前端展示“已完成”必须有后台证据支持。如果接口仅返回“请求已接收”，系统应展示处理中，而不是将其当作执行成功。异步任务的后续结果、取消与超时也需要写进需求。一个状态词会影响用户是否继续等待、重复提交或转向人工。<\/p><p>同样，模型说“我已发送邮件”不构成发送证据；需要工具结果或业务状态支持。需求中把“生成内容”“提交请求”“实际完成”分开，能够减少误导，也使测试与问题定位有明确目标。这些细节通常应由产品与工程共同确认。<\/p><h2 id=\"section-7\">需求中的可追溯关系<\/h2><p>一条关键需求可以关联用户任务、设计规则、技术契约和验收证据。例如“禁止重复创建”关联用户损失、请求身份、状态查询、工具行为及回归场景。这样变更接口时，团队能够找到受影响的体验与标准。<\/p><p>PRD 还应区分产品承诺与当前实验目标。实验可以验证某种能力潜力，正式承诺需要运行与质量证据。若文档没有区分，原型中的临时人工处理或精选数据容易被误认为已经具备的系统能力。<\/p><h2 id=\"section-8\">需求条目的对照示例<\/h2><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>条目<\/th><th>含义与判断<\/th><th>可观察证据<\/th><\/tr><tr><td>资料范围<\/td><td>仅使用当前用户授权的政策与订单<\/td><td>检索与工具返回的对象、权限记录<\/td><\/tr><tr><td>建议产物<\/td><td>明确条件、金额与依据，允许编辑<\/td><td>结构字段、来源片段与用户版本<\/td><\/tr><tr><td>执行动作<\/td><td>确认后提交，避免重复创建<\/td><td>确认对象、请求标识与业务状态<\/td><\/tr><tr><td>异常处理<\/td><td>缺资料时澄清，状态不明先查询<\/td><td>状态轨迹、用户文案与恢复结果<\/td><\/tr><\/table><\/div><p>表格帮助把行为与证据对应，但不能取代完整流程。每个条目仍应说明适用条件和例外，特别是涉及外部系统副作用时。<\/p><p>资料核验日期：2026-11-14。退款与回访流程为教学构造。<\/p><h3 id=\"section-9\">关联阅读<\/h3><ul><li><a href=\"#lesson/08-02\">工具调用的完整生命周期<\/a><\/li><li><a href=\"#lesson/11-01\">从业务目标到 AI 质量指标<\/a><\/li><\/ul><h3 id=\"section-10\">资料与延伸阅读<\/h3><ul><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：Agentic AI 系统设计模式<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/playbook/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Playbook<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"从完整任务定义开始","level":2},{"id":"section-2","title":"明确系统输入与输出契约","level":2},{"id":"section-3","title":"用任务级标准定义质量","level":2},{"id":"section-4","title":"教学构造的需求片段","level":2},{"id":"section-5","title":"PRD 的维护方式","level":2},{"id":"section-6","title":"验收需要连接体验与后台状态","level":2},{"id":"section-7","title":"需求中的可追溯关系","level":2},{"id":"section-8","title":"需求条目的对照示例","level":2},{"id":"section-9","title":"关联阅读","level":3},{"id":"section-10","title":"资料与延伸阅读","level":3}],"text":"AI PRD 的作用是把不确定的模型能力，转化为可以开发、讨论和验收的产品行为。它既需要说明用户体验，也需要说明数据、工具、权限、失败处理和质量标准。只写“模型根据上下文智能回答”，会把关键产品决策留到开发现场。\n\n![AI产品从任务到迭代的闭环](../site/diagrams/product.svg)\n\n## 从完整任务定义开始\n\n首先写清用户、触发条件、可用输入、期望产物与任务完成标准。例如，“根据已授权的订单与政策，为客服生成退款建议，附政策出处；真正退款由客服确认后通过业务接口执行”。这句话同时定义了信息范围、产物、证据、控制权和行动边界。\n\n正常流程之后要描述分支：资料缺失、政策冲突、权限不足、工具超时、用户取消、输出无法校验时怎么办。模型可能提供候选内容，产品必须决定哪些候选可以展示、哪些可以执行、哪些需要转人工。异常流程常比成功演示更能暴露需求是否完整。\n\n## 明确系统输入与输出契约\n\n输入应记录来源、格式、大小、更新时间、权限与保留要求。输出应记录结构、必要字段、引用、允许为空的条件与可编辑性。对于结构化输出，字段合法不等于业务正确，还需要金额范围、状态约束和关联对象等校验。\n\n工具契约至少包括动作名称、参数、前置条件、权限、返回值、副作用和幂等要求。重试一个查询通常问题较小，重试一次付款则可能产生严重后果。需求应区分查询、草稿、审批和实际执行，不能把它们统称为“调用接口”。\n\n## 用任务级标准定义质量\n\n质量标准应贴近用户任务。例如知识助手除了回答是否正确，还需要检查来源是否支持结论、是否遵守权限、是否知道何时拒答。工具 Agent 则要看任务是否完成、是否执行了多余动作、重复执行如何处理，以及失败后是否保持一致状态。\n\n标准还需要说明测量对象与样本。平均成功率会掩盖高风险类别失败，因此可以按任务类型、资料质量、权限层级和异常条件拆分。这里的评测是产品与系统验收方法，不是对学习者安排测验。\n\n## 教学构造的需求片段\n\n对于“创建客户回访任务”，需求可以规定：模型整理客户、回访日期和理由；系统验证客户存在且用户有权限；缺少日期时先澄清；提交前展示摘要；执行接口使用唯一请求标识；成功后返回任务链接；超时后先查询状态，避免直接重复创建。\n\n这段描述并未指定必须使用哪种编排框架，却足以让研发讨论状态、前端展示、工具和测试用例。技术选型仍需要工程评估，产品需求负责说明应达成的行为与约束。\n\n## PRD 的维护方式\n\nAI 能力和提示经常迭代，因此 PRD 应关联模型与配置版本、评测基线、数据版本和决策记录。一个提示变更若影响输出结构、成本或权限行为，也需要经过适当检查。文档不必记录每个内部实现细节，但应让团队能够追溯当前行为为何如此设计。\n\n一份可用的 AI PRD 能回答：系统承诺什么、依赖什么、如何知道达标、失败时谁做什么。它把模糊的“智能”拆成可讨论的能力与规则，帮助产品、算法、工程、运营和安全围绕同一任务协作。\n\n## 验收需要连接体验与后台状态\n\n前端展示“已完成”必须有后台证据支持。如果接口仅返回“请求已接收”，系统应展示处理中，而不是将其当作执行成功。异步任务的后续结果、取消与超时也需要写进需求。一个状态词会影响用户是否继续等待、重复提交或转向人工。\n\n同样，模型说“我已发送邮件”不构成发送证据；需要工具结果或业务状态支持。需求中把“生成内容”“提交请求”“实际完成”分开，能够减少误导，也使测试与问题定位有明确目标。这些细节通常应由产品与工程共同确认。\n\n## 需求中的可追溯关系\n\n一条关键需求可以关联用户任务、设计规则、技术契约和验收证据。例如“禁止重复创建”关联用户损失、请求身份、状态查询、工具行为及回归场景。这样变更接口时，团队能够找到受影响的体验与标准。\n\nPRD 还应区分产品承诺与当前实验目标。实验可以验证某种能力潜力，正式承诺需要运行与质量证据。若文档没有区分，原型中的临时人工处理或精选数据容易被误认为已经具备的系统能力。\n\n## 需求条目的对照示例\n\n| 条目 | 含义与判断 | 可观察证据 |\n|---|---|---|\n| 资料范围 | 仅使用当前用户授权的政策与订单 | 检索与工具返回的对象、权限记录 |\n| 建议产物 | 明确条件、金额与依据，允许编辑 | 结构字段、来源片段与用户版本 |\n| 执行动作 | 确认后提交，避免重复创建 | 确认对象、请求标识与业务状态 |\n| 异常处理 | 缺资料时澄清，状态不明先查询 | 状态轨迹、用户文案与恢复结果 |\n\n表格帮助把行为与证据对应，但不能取代完整流程。每个条目仍应说明适用条件和例外，特别是涉及外部系统副作用时。\n\n资料核验日期：2026-11-14。退款与回访流程为教学构造。\n\n### 关联阅读\n\n- [工具调用的完整生命周期](08-02.md)\n- [从业务目标到 AI 质量指标](11-01.md)\n\n### 资料与延伸阅读\n\n- [Google Cloud：Agentic AI 系统设计模式](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n- [Microsoft：HAX Playbook](https://www.microsoft.com/en-us/haxtoolkit/playbook/)\n","chars":1608,"minutes":6,"summary":"AI PRD 的作用是把不确定的模型能力，转化为可以开发、讨论和验收的产品行为。它既需要说明用户体验，也需要说明数据、工具、权限、失败处理和质量标准。只写“模型根据上下文智能回答”，会把关键产品决策留到开发现场。"},{"id":"13-06","title":"范围、优先级与研发协作","file":"content/13-06.md","level":"工作应用","prerequisites":["13-05"],"aliases":["PRD","需求","产品策略"],"module":"13","moduleTitle":"AI 产品机会与产品设计","html":"<p>AI 产品的范围管理，要控制的不仅是功能数量，还包括输入分布、可执行动作、系统依赖和质量责任。同一个“整理文件”功能，在只支持指定目录与支持全企业资料时，工程和治理复杂度可能相差很大。<\/p><h2 id=\"section-1\">把范围拆成多个维度<\/h2><p>用户范围决定谁使用与谁负责；任务范围决定完成哪些工作；数据范围决定能看见什么；动作范围决定能改变什么；环境范围决定支持哪些系统与条件；质量范围决定承诺什么效果。逐一列出边界，可以发现那些被一句功能描述隐藏的工作。<\/p><p>例如，首阶段只处理用户主动上传的公开文档，下一阶段连接企业知识库，再下一阶段支持跨部门搜索。这些阶段不仅增加连接器，还增加权限映射、增量更新、错误引用和信息隔离等问题。路线图需要反映能力依赖，不能按界面入口数量估算难度。<\/p><h2 id=\"section-2\">优先级连接价值、证据与依赖<\/h2><p>优先考虑能够改善关键任务、证据较充分、依赖可获得的能力。高价值但高不确定的机会，可以先安排小范围技术验证或业务验证，明确其目的。把“建设正式功能”和“减少未知”混在同一列表，会让进度看似缓慢，也容易把验证原型直接上线。<\/p><p>风险是另一个排序依据。必须先解决的权限或数据问题，即使不直接增加可见功能，也可能是整个产品可用的前提。优先级讨论应展示如果不做会影响什么，以及当前接受的替代措施，避免把底层工作全部归为“研发优化”。<\/p><h2 id=\"section-3\">跨职能协作需要共同对象<\/h2><p>产品负责用户任务、范围与行为标准；算法或模型团队分析能力、数据和评估；工程负责系统实现与可靠性；设计负责人机协作体验；业务与运营提供真实流程和反馈。职责可以重叠，但重要决策需要明确承担者。<\/p><p>共同对象可以是一组代表任务、一份数据流、一条执行轨迹和一张指标表。围绕同一条失败任务讨论，通常比争论“模型不够聪明”更有效。问题也许出在检索、权限、接口、状态或用户输入，不能预先把责任归给某个团队。<\/p><h2 id=\"section-4\">教学构造的依赖拆解<\/h2><p>假设要做客户会议准备助手。需求包含汇总客户资料、查询近期动态、生成议程和发送给参会者。可先交付带来源的会议准备草稿，因为它能验证信息整合价值；自动发送则依赖收件人识别、权限、内容确认与发送审计。把发送延后，需要明确仍保留“准备会议”的核心价值。<\/p><p>如果草稿质量取决于 CRM 数据，数据连接与字段解释必须提前完成。把模型提示先做出来并不代表主要工作已经完成。范围评审应检查任务链的关键依赖是否真实可用，而不仅是接口是否存在。<\/p><h2 id=\"section-5\">用决策记录管理变化<\/h2><p>当模型升级、成本变化或新增需求出现时，记录变化原因、备选方案、影响范围和验证结果。明确什么证据会触发扩展或收紧范围。这样团队能够解释为什么某阶段保留人工确认，以及满足哪些条件后才适合增加自主程度。<\/p><p>范围管理的目标是保持任务价值与系统能力之间的匹配。清晰的边界能够让用户形成正确预期，也让研发估算、质量验证和运营支持有稳定依据。<\/p><h2 id=\"section-6\">让验收与交付粒度保持一致<\/h2><p>如果一个功能被拆成检索、生成和展示三个研发任务，产品仍需要确认完整用户任务是否可用。单个接口返回正常，可能掩盖引用错位、权限不一致或交互无法继续等问题。技术拆分服务实现，任务级验收负责连接各个部分。<\/p><p>跨团队依赖还要记录可用环境、数据负责人和变更通知方式。一个被列为“已经接入”的接口，若只能在测试环境使用，不能被当作上线准备完成。范围与进度说明应尽量基于可观察状态，减少笼统的百分比描述。<\/p><h2 id=\"section-7\">处理新增需求的影响范围<\/h2><p>新增一个数据源，可能改变权限、检索质量、上下文、成本和支持；新增一个动作，可能改变确认、审计与恢复。变更评审可以沿信息流逐层检查，而不只估算前端增加多少页面。<\/p><p>对外承诺时间前，确认关键依赖是否已验证、是否存在专业审批与客户环境限制。把不确定性写成条件和验证事项，能够减少后续意外。范围透明也有助于业务理解为何某项看似简单的能力需要更多准备。<\/p><p>资料核验日期：2026-11-14。会议准备案例为教学构造。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/13-07\">试点、灰度与上线决策<\/a><\/li><li><a href=\"#lesson/12-01\">AI 系统架构与研发分工<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"把范围拆成多个维度","level":2},{"id":"section-2","title":"优先级连接价值、证据与依赖","level":2},{"id":"section-3","title":"跨职能协作需要共同对象","level":2},{"id":"section-4","title":"教学构造的依赖拆解","level":2},{"id":"section-5","title":"用决策记录管理变化","level":2},{"id":"section-6","title":"让验收与交付粒度保持一致","level":2},{"id":"section-7","title":"处理新增需求的影响范围","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 产品的范围管理，要控制的不仅是功能数量，还包括输入分布、可执行动作、系统依赖和质量责任。同一个“整理文件”功能，在只支持指定目录与支持全企业资料时，工程和治理复杂度可能相差很大。\n\n## 把范围拆成多个维度\n\n用户范围决定谁使用与谁负责；任务范围决定完成哪些工作；数据范围决定能看见什么；动作范围决定能改变什么；环境范围决定支持哪些系统与条件；质量范围决定承诺什么效果。逐一列出边界，可以发现那些被一句功能描述隐藏的工作。\n\n例如，首阶段只处理用户主动上传的公开文档，下一阶段连接企业知识库，再下一阶段支持跨部门搜索。这些阶段不仅增加连接器，还增加权限映射、增量更新、错误引用和信息隔离等问题。路线图需要反映能力依赖，不能按界面入口数量估算难度。\n\n## 优先级连接价值、证据与依赖\n\n优先考虑能够改善关键任务、证据较充分、依赖可获得的能力。高价值但高不确定的机会，可以先安排小范围技术验证或业务验证，明确其目的。把“建设正式功能”和“减少未知”混在同一列表，会让进度看似缓慢，也容易把验证原型直接上线。\n\n风险是另一个排序依据。必须先解决的权限或数据问题，即使不直接增加可见功能，也可能是整个产品可用的前提。优先级讨论应展示如果不做会影响什么，以及当前接受的替代措施，避免把底层工作全部归为“研发优化”。\n\n## 跨职能协作需要共同对象\n\n产品负责用户任务、范围与行为标准；算法或模型团队分析能力、数据和评估；工程负责系统实现与可靠性；设计负责人机协作体验；业务与运营提供真实流程和反馈。职责可以重叠，但重要决策需要明确承担者。\n\n共同对象可以是一组代表任务、一份数据流、一条执行轨迹和一张指标表。围绕同一条失败任务讨论，通常比争论“模型不够聪明”更有效。问题也许出在检索、权限、接口、状态或用户输入，不能预先把责任归给某个团队。\n\n## 教学构造的依赖拆解\n\n假设要做客户会议准备助手。需求包含汇总客户资料、查询近期动态、生成议程和发送给参会者。可先交付带来源的会议准备草稿，因为它能验证信息整合价值；自动发送则依赖收件人识别、权限、内容确认与发送审计。把发送延后，需要明确仍保留“准备会议”的核心价值。\n\n如果草稿质量取决于 CRM 数据，数据连接与字段解释必须提前完成。把模型提示先做出来并不代表主要工作已经完成。范围评审应检查任务链的关键依赖是否真实可用，而不仅是接口是否存在。\n\n## 用决策记录管理变化\n\n当模型升级、成本变化或新增需求出现时，记录变化原因、备选方案、影响范围和验证结果。明确什么证据会触发扩展或收紧范围。这样团队能够解释为什么某阶段保留人工确认，以及满足哪些条件后才适合增加自主程度。\n\n范围管理的目标是保持任务价值与系统能力之间的匹配。清晰的边界能够让用户形成正确预期，也让研发估算、质量验证和运营支持有稳定依据。\n\n## 让验收与交付粒度保持一致\n\n如果一个功能被拆成检索、生成和展示三个研发任务，产品仍需要确认完整用户任务是否可用。单个接口返回正常，可能掩盖引用错位、权限不一致或交互无法继续等问题。技术拆分服务实现，任务级验收负责连接各个部分。\n\n跨团队依赖还要记录可用环境、数据负责人和变更通知方式。一个被列为“已经接入”的接口，若只能在测试环境使用，不能被当作上线准备完成。范围与进度说明应尽量基于可观察状态，减少笼统的百分比描述。\n\n## 处理新增需求的影响范围\n\n新增一个数据源，可能改变权限、检索质量、上下文、成本和支持；新增一个动作，可能改变确认、审计与恢复。变更评审可以沿信息流逐层检查，而不只估算前端增加多少页面。\n\n对外承诺时间前，确认关键依赖是否已验证、是否存在专业审批与客户环境限制。把不确定性写成条件和验证事项，能够减少后续意外。范围透明也有助于业务理解为何某项看似简单的能力需要更多准备。\n\n资料核验日期：2026-11-14。会议准备案例为教学构造。\n\n### 关联阅读\n\n- [试点、灰度与上线决策](13-07.md)\n- [AI 系统架构与研发分工](12-01.md)\n\n### 资料与延伸阅读\n\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1420,"minutes":5,"summary":"AI 产品的范围管理，要控制的不仅是功能数量，还包括输入分布、可执行动作、系统依赖和质量责任。同一个“整理文件”功能，在只支持指定目录与支持全企业资料时，工程和治理复杂度可能相差很大。"},{"id":"13-07","title":"试点、灰度与上线决策","file":"content/13-07.md","level":"工作应用","prerequisites":["13-06"],"aliases":["PRD","需求","产品策略"],"module":"13","moduleTitle":"AI 产品机会与产品设计","html":"<p>AI 产品上线需要证明的不只是“可以生成结果”，还包括在真实用户、数据和异常条件下，是否能够保持可接受的质量与控制。试点和灰度的价值是逐步增加真实暴露，同时限制影响范围，并持续收集决策所需证据。<\/p><h2 id=\"section-1\">不同阶段回答不同问题<\/h2><p>受控验证主要回答技术与流程能否跑通；小范围试点观察真实任务价值、使用方式与采用障碍；灰度发布观察更广输入分布下的可靠性、成本与支持负担；全面开放则要求团队能持续运营。阶段可以调整，但每阶段的进入与退出标准需要明确。<\/p><p>试点用户也需要具有代表性。如果只选择熟悉系统、愿意容忍错误的内部专家，结果可能无法迁移到普通用户。可以按任务、经验、资料质量和组织角色选择样本，并记录试点与最终用户的差异。<\/p><h2 id=\"section-2\">上线门槛应覆盖四类证据<\/h2><p>任务价值包括完成时间、质量改善与用户负担；系统质量包括准确、权限、稳定、延迟与恢复；经济性包括每次任务成本和维护负担；运营准备包括告知、支持、问题接收、回滚和责任。某一类缺失，会使上线决策偏向演示最强的一面。<\/p><p>对高后果动作，门槛应针对具体错误设置约束。例如外发邮件需要核对收件人与内容，财务操作需要业务校验和授权。一个整体成功率不能替代这些底线。门槛还要说明哪些错误接受、哪些必须阻断，以及接受残余风险的负责人。<\/p><h2 id=\"section-3\">教学构造的灰度设计<\/h2><p>假设知识助手先面向一个部门开放。第一阶段仅回答带可用来源的问题，不执行任何外部动作；记录问题类型、引用质量、拒答情况和用户反馈。进入下一部门前，确认权限映射、知识更新与支持能力，而非仅看首部门活跃人数。<\/p><p>若发现某类旧文档持续导致错误，可以暂时下线该资料集，保留其余能力。灰度单位可以是用户、任务类型、数据源或工具权限，不必只有一个全局开关。细粒度控制能帮助团队在维护价值的同时处理局部风险。<\/p><h2 id=\"section-4\">明确停止、降级和回滚<\/h2><p>停止条件应在发布前定义，例如出现越权读取、重复执行关键动作或成本异常。降级可以是切回只读、增加确认、关闭特定工具或回到人工流程。回滚不仅涉及模型版本，还可能涉及提示、索引、数据与工具配置。<\/p><p>观察窗口也要符合任务周期。日报助手一天可能有多次机会，月度结算助手则需要更长周期才能看到真实表现。不能为了快速宣布成功，选择无法覆盖关键任务的观察时间。<\/p><h2 id=\"section-5\">从上线事件转向持续运行<\/h2><p>模型、外部工具和知识数据都会变化。上线后需要持续记录版本、任务表现、失败类别与用户行为。试点报告应保留成功条件、限制和未解决问题，为后续扩展提供依据。<\/p><p>产品经理要推动的是有证据的开放程度：在价值、质量、成本与运营能力相匹配的范围内提供能力。当证据不足时，补充观察或限制范围，比把不确定性隐藏在“测试中”标签下更有助于建立长期信任。<\/p><h2 id=\"section-6\">试点也要观察未采用者<\/h2><p>持续使用者能提供价值证据，但放弃者常能暴露入口、信任、资料准备和工作流程的问题。试点分析应记录谁获得机会、谁开始、谁继续，以及各阶段退出原因。只访谈满意用户会使结论系统性偏乐观。<\/p><p>上线决策会议可以围绕同一份证据摘要：任务表现、错误分布、成本、用户负担、运营问题和残余风险。不同负责人应明确自己接受的约束，而不是仅以“大家同意上线”结束。决定扩大范围，也应同时说明下一轮重点观察什么。<\/p><h2 id=\"section-7\">上线证据摘要的组织方式<\/h2><p>可以把结果按价值、质量、运行与风险四栏呈现，每栏说明当前证据、适用范围、未解决问题和下一步。关键任务用真实轨迹或脱敏样例支持，整体指标注明样本与周期。这样决策者既看见趋势，也能理解失败机制。<\/p><p>扩大范围时同步确认支持和责任是否扩展。用户增加后，问题量、资料维护和权限请求可能增长；如果服务能力没有跟上，试点成功也未必能持续。上线是进入运营状态的决定，需要同时准备观察、处理和回退。<\/p><p>资料核验日期：2026-11-14。知识助手灰度案例为教学构造。<\/p><h3 id 。试点报告应保留成功条件、限制和未解决问题，为后续扩展提供依据。\n\n产品经理要推动的是有证据的开放程度：在价值、质量、成本与运营能力相匹配的范围内提供能力。当证据不足时，补充观察或限制范围，比把不确定性隐藏在“测试中”标签下更有助于建立长期信任。\n\n## 试点也要观察未采用者\n\n持续使用者能提供价值证据，但放弃者常能暴露入口、信任、资料准备和工作流程的问题。试点分析应记录谁获得机会、谁开始、谁继续，以及各阶段退出原因。只访谈满意用户会使结论系统性偏乐观。\n\n上线决策会议可以围绕同一份证据摘要：任务表现、错误分布、成本、用户负担、运营问题和残余风险。不同负责人应明确自己接受的约束，而不是仅以“大家同意上线”结束。决定扩大范围，也应同时说明下一轮重点观察什么。\n\n## 上线证据摘要的组织方式\n\n可以把结果按价值、质量、运行与风险四栏呈现，每栏说明当前证据、适用范围、未解决问题和下一步。关键任务用真实轨迹或脱敏样例支持，整体指标注明样本与周期。这样决策者既看见趋势，也能理解失败机制。\n\n扩大范围时同步确认支持和责任是否扩展。用户增加后，问题量、资料维护和权限请求可能增长；如果服务能力没有跟上，试点成功也未必能持续。上线是进入运营状态的决定，需要同时准备观察、处理和回退。\n\n资料核验日期：2026-11-14。知识助手灰度案例为教学构造。\n\n### 关联阅读\n\n- [回归评估、版本准入与发布](11-07.md)\n- [安全事件响应与风险验收](15-08.md)\n\n### 资料与延伸阅读\n\n- [Google：Rules of Machine Learning](https://developers.google.com/machine-learning/guides/rules-of-ml)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1385,"minutes":5,"summary":"AI 产品上线需要证明的不只是“可以生成结果”，还包括在真实用户、数据和异常条件下，是否能够保持可接受的质量与控制。试点和灰度的价值是逐步增加真实暴露，同时限制影响范围，并持续收集决策所需证据。"},{"id":"13-08","title":"产品指标体系与持续迭代","file":"content/13-08.md","level":"工作应用","prerequisites":["13-07"],"aliases":["PRD","需求","产品策略"],"module":"13","moduleTitle":"AI 产品机会与产品设计","html":"<p>AI 产品指标需要同时说明用户获得了什么，以及系统为此付出了什么代价。生成次数和调用量可以反映使用，却不能单独证明任务完成或商业价值。指标体系应从用户任务出发，再连接质量、体验、运营和经营结果。<\/p><h2 id=\"section-1\">建立一条可解释的指标链<\/h2><p>可以依次观察触达、开始任务、获得可用产物、完成任务、重复采用和产生业务收益。每一层都有流失原因：用户可能不知道入口，可能无法提供资料，也可能得到结果后仍需大量返工。分层指标帮助定位瓶颈，而非把所有下降都解释为模型质量。<\/p><p>“可用产物”需要业务定义。摘要可能要求事实完整且可核对，执行 Agent 则要求目标状态实际改变。用户点击接受也未必等于正确：他们可能过度信任，或为了继续流程随意点击。因此行为指标应与抽样质量观察和下游结果结合。<\/p><h2 id=\"section-2\">质量、体验与成本需要联看<\/h2><p>质量可以包含正确性、完整性、引用、权限与任务成功；体验可以包含端到端耗时、等待、编辑与核对负担；成本可以包含模型、检索、工具、人工支持和失败重试。一个改动可能提升某项质量，却使完成时间和成本显著上升。<\/p><p>建议把成本放在成功任务的分母上。若一百次任务中六十次成功，总成本为一百二十元，成功任务平均成本是两元，而不是每次调用的一点二元。还要明确“成功”的判断方法，否则降低成功标准也能制造好看的指标。<\/p><h2 id=\"section-3\">教学构造的指标解释<\/h2><p>假设新提示使回答采纳率从百分之五十提升到百分之六十，但每次回答更长，核对时间从两分钟变为四分钟。采纳率改善不能直接证明效率提升。团队需要检查用户是否因为内容看起来更完整而采纳，以及真实完成质量与总时长如何变化。<\/p><p>另一个版本减少拒答，让回答率提高，却增加无依据的确定性陈述。此时回答率与正确性出现冲突。指标设计应保留保护指标，使优化过程不能通过增加风险来获得表面增长。<\/p><h2 id=\"section-4\">分群比总体平均更有解释力<\/h2><p>按任务复杂度、资料质量、新老用户、工具类型或组织角色拆分，能够看到被平均值掩盖的问题。一个系统对简单任务表现很好，对高价值复杂任务失败，整体成功率仍可能很高。分群要有业务意义，并记录每组样本量，避免对很小波动过度解释。<\/p><p>指标变化也需要排查外部因素。模型版本、知识更新、节假日、用户结构和入口变化都可能影响结果。没有随机实验时，结论应保持条件化，说明关联及其他可能原因。<\/p><h2 id=\"section-5\">把指标转为迭代决策<\/h2><p>每个指标应有定义、数据来源、观察周期、负责人和相应动作。若引用错误上升，应能进入检索或资料诊断；若完成时间增加，应区分模型等待、工具等待和用户确认；若成本上升，应分析任务构成与重试。<\/p><p>持续迭代不是不断增加功能，而是围绕任务价值建立“观察—解释—选择—核验”的循环。指标的作用是帮助团队做出更可靠的决策，同时保留对用户真实工作结果的理解。<\/p><h2 id=\"section-6\">指标也需要防止被误用<\/h2><p>当某个指标成为唯一目标，团队可能无意中改变任务定义来获得更好数字。例如只统计简单任务、排除失败重试，或用用户点击代替真实完成。指标说明应明确分母、排除规则和数据缺失，保留失败任务的可见性。<\/p><p>少数关键指标配合能够解释机制的诊断指标，往往比大量看板更有用。每次复盘既看趋势，也抽看真实任务，确认数字仍然代表用户工作。随着产品进入新用户或新任务，原有指标定义也需要重新检查。<\/p><h2 id=\"section-7\">用指标树解释因果假设<\/h2><p>北极星式指标可以概括核心价值，诊断指标解释它为何变化。例如有效完成任务数可以拆成任务机会、开始率、成功率和持续采用；成功率再拆成输入、检索、工具与生成等类别。拆分表达的是假设，需要通过数据与案例检查。<\/p><p>保护指标则防止局部优化伤害其他目标，例如越权、严重错误、账单异常和用户核对时间。指标树不应越画越复杂，重点是每个节点有定义、数据和可行动解释。无法影响决定的数字，可以不放在日常主看板中。<\/p><p>资料核验日期：2026-11-14。本篇数值为教学构造。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/16-04\">激活、采用、留存与行为指标<\/a><\/li><li><a href=\"#lesson/11-01\">从业务目标到 AI 质量指标<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://developers.google.com/machine-learning/guides/rules-of-ml\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Rules of Machine Learning<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Guidelines for Human-AI Interaction<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"建立一条可解释的指标链","level":2},{"id":"section-2","title":"质量、体验与成本需要联看","level":2},{"id":"section-3","title":"教学构造的指标解释","level":2},{"id":"section-4","title":"分群比总体平均更有解释力","level":2},{"id":"section-5","title":"把指标转为迭代决策","level":2},{"id":"section-6","title":"指标也需要防止被误用","level":2},{"id":"section-7","title":"用指标树解释因果假设","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 产品指标需要同时说明用户获得了什么，以及系统为此付出了什么代价。生成次数和调用量可以反映使用，却不能单独证明任务完成或商业价值。指标体系应从用户任务出发，再连接质量、体验、运营和经营结果。\n\n## 建立一条可解释的指标链\n\n可以依次观察触达、开始任务、获得可用产物、完成任务、重复采用和产生业务收益。每一层都有流失原因：用户可能不知道入口，可能无法提供资料，也可能得到结果后仍需大量返工。分层指标帮助定位瓶颈，而非把所有下降都解释为模型质量。\n\n“可用产物”需要业务定义。摘要可能要求事实完整且可核对，执行 Agent 则要求目标状态实际改变。用户点击接受也未必等于正确：他们可能过度信任，或为了继续流程随意点击。因此行为指标应与抽样质量观察和下游结果结合。\n\n## 质量、体验与成本需要联看\n\n质量可以包含正确性、完整性、引用、权限与任务成功；体验可以包含端到端耗时、等待、编辑与核对负担；成本可以包含模型、检索、工具、人工支持和失败重试。一个改动可能提升某项质量，却使完成时间和成本显著上升。\n\n建议把成本放在成功任务的分母上。若一百次任务中六十次成功，总成本为一百二十元，成功任务平均成本是两元，而不是每次调用的一点二元。还要明确“成功”的判断方法，否则降低成功标准也能制造好看的指标。\n\n## 教学构造的指标解释\n\n假设新提示使回答采纳率从百分之五十提升到百分之六十，但每次回答更长，核对时间从两分钟变为四分钟。采纳率改善不能直接证明效率提升。团队需要检查用户是否因为内容看起来更完整而采纳，以及真实完成质量与总时长如何变化。\n\n另一个版本减少拒答，让回答率提高，却增加无依据的确定性陈述。此时回答率与正确性出现冲突。指标设计应保留保护指标，使优化过程不能通过增加风险来获得表面增长。\n\n## 分群比总体平均更有解释力\n\n按任务复杂度、资料质量、新老用户、工具类型或组织角色拆分，能够看到被平均值掩盖的问题。一个系统对简单任务表现很好，对高价值复杂任务失败，整体成功率仍可能很高。分群要有业务意义，并记录每组样本量，避免对很小波动过度解释。\n\n指标变化也需要排查外部因素。模型版本、知识更新、节假日、用户结构和入口变化都可能影响结果。没有随机实验时，结论应保持条件化，说明关联及其他可能原因。\n\n## 把指标转为迭代决策\n\n每个指标应有定义、数据来源、观察周期、负责人和相应动作。若引用错误上升，应能进入检索或资料诊断；若完成时间增加，应区分模型等待、工具等待和用户确认；若成本上升，应分析任务构成与重试。\n\n持续迭代不是不断增加功能，而是围绕任务价值建立“观察—解释—选择—核验”的循环。指标的作用是帮助团队做出更可靠的决策，同时保留对用户真实工作结果的理解。\n\n## 指标也需要防止被误用\n\n当某个指标成为唯一目标，团队可能无意中改变任务定义来获得更好数字。例如只统计简单任务、排除失败重试，或用用户点击代替真实完成。指标说明应明确分母、排除规则和数据缺失，保留失败任务的可见性。\n\n少数关键指标配合能够解释机制的诊断指标，往往比大量看板更有用。每次复盘既看趋势，也抽看真实任务，确认数字仍然代表用户工作。随着产品进入新用户或新任务，原有指标定义也需要重新检查。\n\n## 用指标树解释因果假设\n\n北极星式指标可以概括核心价值，诊断指标解释它为何变化。例如有效完成任务数可以拆成任务机会、开始率、成功率和持续采用；成功率再拆成输入、检索、工具与生成等类别。拆分表达的是假设，需要通过数据与案例检查。\n\n保护指标则防止局部优化伤害其他目标，例如越权、严重错误、账单异常和用户核对时间。指标树不应越画越复杂，重点是每个节点有定义、数据和可行动解释。无法影响决定的数字，可以不放在日常主看板中。\n\n资料核验日期：2026-11-14。本篇数值为教学构造。\n\n### 关联阅读\n\n- [激活、采用、留存与行为指标](16-04.md)\n- [从业务目标到 AI 质量指标](11-01.md)\n\n### 资料与延伸阅读\n\n- [Google：Rules of Machine Learning](https://developers.google.com/machine-learning/guides/rules-of-ml)\n- [Microsoft：Guidelines for Human-AI Interaction](https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/)\n","chars":1390,"minutes":5,"summary":"AI 产品指标需要同时说明用户获得了什么，以及系统为此付出了什么代价。生成次数和调用量可以反映使用，却不能单独证明任务完成或商业价值。指标体系应从用户任务出发，再连接质量、体验、运营和经营结果。"},{"id":"14-01","title":"Chat、Copilot 与 Agent 的交互选择","file":"content/14-01.md","level":"工作应用","prerequisites":["13-01","09-01"],"aliases":["UX","Copilot","HITL"],"module":"14","moduleTitle":"AI 交互与人机协作","html":"<p>交互形态决定用户如何表达目标、观察过程和保留控制权。Chat、Copilot 与 Agent 可以共存，选择应围绕任务结构和自主程度，而不是界面是否显得先进。一个产品也可以在不同阶段采用不同形态。<\/p><h2 id=\"section-1\">三种形态承担的工作<\/h2><p>Chat 适合用户通过语言探索、提问和逐步澄清。用户通常负责判断下一步，系统提供内容。Copilot 常嵌入现有编辑器或工作流，在合适位置提供建议、补全和局部操作。Agent 则承担更完整的目标推进，可能自主选择工具和多步执行，因此需要更多状态、权限和恢复设计。<\/p><p>这不是严格的技术分类。一个聊天框背后也可以执行 Agent，一个嵌入式侧栏也可能只做单次生成。产品分析应观察谁决定下一步、谁执行动作、谁判断完成，以及用户如何干预。界面名称不能替代行为定义。<\/p><h2 id=\"section-2\">任务结构如何影响选择<\/h2><p>目标模糊、需要共同探索时，交谈有助于逐步形成理解；工作对象已经在屏幕上时，直接选中文本并给出局部建议通常比重新描述上下文更省力；任务目标明确但步骤变化大时，可以考虑目标导向的执行界面。频繁重复输入和确认，往往说明形态与任务不匹配。<\/p><p>还要考虑操作密度。修改几十个字段时，纯对话可能难以对比和定位；表格、表单或差异预览更适合承载结构。模型可以帮助理解意图，实际编辑仍然可以使用成熟控件。语言交互与图形界面并不冲突。<\/p><h2 id=\"section-3\">教学构造的会议场景<\/h2><p>用户想了解客户背景，可以通过 Chat 提问；用户正在编辑会议议程，可以由 Copilot 结合当前文档提出建议；用户已经指定会议、资料范围和产物要求，可以让 Agent 收集材料并生成准备包。若还需要外发，系统应把收件人、正文与附件放入可检查的确认视图。<\/p><p>同一个场景采用三种形式，是因为用户控制与任务阶段不同。把所有动作藏在聊天记录里，会增加追踪负担；把所有选择都做成表单，又可能阻碍开放探索。设计应保留任务中最有价值的表达方式。<\/p><h2 id=\"section-4\">自主程度需要可解释<\/h2><p>用户应知道系统目前是在建议、准备草稿、等待确认还是执行。自主程度也可以按动作分层：自动读取已授权资料、生成可编辑草稿、确认后发送、禁止修改关键配置。这样的分层比一个笼统的“自动模式”更容易理解与维护。<\/p><p>当用户切换形态时，应保留相关上下文，并明确哪些授权仍然有效。一次同意生成草稿，不应被解释为同意以后自动发送。控制权的转移需要具体对象与范围。<\/p><h2 id=\"section-5\">用真实工作流评判体验<\/h2><p>比较形态时观察用户完成同一任务需要多少信息重述、多少工具切换、多少核对，以及失败后能否继续。聊天消息数量和按钮数量都不是唯一标准。对复杂任务，清晰的状态与产物组织可能比减少一次点击更重要。<\/p><p>产品经理应画出任务全程，说明每个阶段由人还是系统推进、产物在哪里、用户如何接手。交互选择最终服务于任务完成与可控制性，也应匹配真实能力边界。<\/p><h2 id=\"section-6\">一个可操作的选择比较<\/h2><p>以修改客户资料为例，三种形态可以使用同一数据接口，但交互责任不同。Chat 中用户描述修改意图，系统展示待改字段；Copilot 在已有表单旁指出缺失并建议值；Agent 根据目标整理多个记录，最后提供批量差异清单。需要比较的不是哪种界面更新颖，而是谁更容易发现对象错误、检查字段与恢复修改。<\/p><p>对开放探索，允许用户来回提问通常有价值；对精确编辑，稳定控件和差异对比更有效；对跨系统任务，则需要独立任务视图承载状态。一个实用的组合是“对话确定目标—图形界面核对对象—后台执行—任务列表查看结果”。每部分承担最适合的工作。<\/p><p>这类比较也提醒团队，不要把聊天消息当作唯一数据结构。任务、产物、授权和执行记录应有明确对象身份，界面可以用不同方式展示它们。这样未来更换入口或增加移动端时，不必重建整套业务含义。<\/p><h2 id=\"section-7\">交互形态与产物组织<\/h2><p>聊天适合讨论过程，产物却往往需要独立编辑、版本和分享。把报告、表格或任务计划从消息中提取为明确对象，能够减少来回翻找，也便于跨端继续。对话可以保留产生它的上下文，产物则承担后续工作。<\/p><p>这种分离还帮助处理局部修改。用户说“只改第二段”，系统需要知道当前产物与版本，而不是重新生成整份内容。产品应让用户理解修改范围，并在需要时查看差异，避免语言指令带来不可见的大范围变化。<\/p><p>资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/09-01\">Agent 运行循环：目标、行动与观察<\/a><\/li><li><a href=\"#lesson/13-02\">AI 适配性与替代方案判断<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Guidelines for Human-AI Interaction<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"三种形态承担的工作","level":2},{"id":"section-2","title":"任务结构如何影响选择","level":2},{"id":"section-3","title":"教学构造的会议场景","level":2},{"id":"section-4","title":"自主程度需要可解释","level":2},{"id":"section-5","title":"用真实工作流评判体验","level":2},{"id":"section-6","title":"一个可操作的选择比较","level":2},{"id":"section-7","title":"交互形态与产物组织","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"交互形态决定用户如何表达目标、观察过程和保留控制权。Chat、Copilot 与 Agent 可以共存，选择应围绕任务结构和自主程度，而不是界面是否显得先进。一个产品也可以在不同阶段采用不同形态。\n\n## 三种形态承担的工作\n\nChat 适合用户通过语言探索、提问和逐步澄清。用户通常负责判断下一步，系统提供内容。Copilot 常嵌入现有编辑器或工作流，在合适位置提供建议、补全和局部操作。Agent 则承担更完整的目标推进，可能自主选择工具和多步执行，因此需要更多状态、权限和恢复设计。\n\n这不是严格的技术分类。一个聊天框背后也可以执行 Agent，一个嵌入式侧栏也可能只做单次生成。产品分析应观察谁决定下一步、谁执行动作、谁判断完成，以及用户如何干预。界面名称不能替代行为定义。\n\n## 任务结构如何影响选择\n\n目标模糊、需要共同探索时，交谈有助于逐步形成理解；工作对象已经在屏幕上时，直接选中文本并给出局部建议通常比重新描述上下文更省力；任务目标明确但步骤变化大时，可以考虑目标导向的执行界面。频繁重复输入和确认，往往说明形态与任务不匹配。\n\n还要考虑操作密度。修改几十个字段时，纯对话可能难以对比和定位；表格、表单或差异预览更适合承载结构。模型可以帮助理解意图，实际编辑仍然可以使用成熟控件。语言交互与图形界面并不冲突。\n\n## 教学构造的会议场景\n\n用户想了解客户背景，可以通过 Chat 提问；用户正在编辑会议议程，可以由 Copilot 结合当前文档提出建议；用户已经指定会议、资料范围和产物要求，可以让 Agent 收集材料并生成准备包。若还需要外发，系统应把收件人、正文与附件放入可检查的确认视图。\n\n同一个场景采用三种形式，是因为用户控制与任务阶段不同。把所有动作藏在聊天记录里，会增加追踪负担；把所有选择都做成表单，又可能阻碍开放探索。设计应保留任务中最有价值的表达方式。\n\n## 自主程度需要可解释\n\n用户应知道系统目前是在建议、准备草稿、等待确认还是执行。自主程度也可以按动作分层：自动读取已授权资料、生成可编辑草稿、确认后发送、禁止修改关键配置。这样的分层比一个笼统的“自动模式”更容易理解与维护。\n\n当用户切换形态时，应保留相关上下文，并明确哪些授权仍然有效。一次同意生成草稿，不应被解释为同意以后自动发送。控制权的转移需要具体对象与范围。\n\n## 用真实工作流评判体验\n\n比较形态时观察用户完成同一任务需要多少信息重述、多少工具切换、多少核对，以及失败后能否继续。聊天消息数量和按钮数量都不是唯一标准。对复杂任务，清晰的状态与产物组织可能比减少一次点击更重要。\n\n产品经理应画出任务全程，说明每个阶段由人还是系统推进、产物在哪里、用户如何接手。交互选择最终服务于任务完成与可控制性，也应匹配真实能力边界。\n\n## 一个可操作的选择比较\n\n以修改客户资料为例，三种形态可以使用同一数据接口，但交互责任不同。Chat 中用户描述修改意图，系统展示待改字段；Copilot 在已有表单旁指出缺失并建议值；Agent 根据目标整理多个记录，最后提供批量差异清单。需要比较的不是哪种界面更新颖，而是谁更容易发现对象错误、检查字段与恢复修改。\n\n对开放探索，允许用户来回提问通常有价值；对精确编辑，稳定控件和差异对比更有效；对跨系统任务，则需要独立任务视图承载状态。一个实用的组合是“对话确定目标—图形界面核对对象—后台执行—任务列表查看结果”。每部分承担最适合的工作。\n\n这类比较也提醒团队，不要把聊天消息当作唯一数据结构。任务、产物、授权和执行记录应有明确对象身份，界面可以用不同方式展示它们。这样未来更换入口或增加移动端时，不必重建整套业务含义。\n\n## 交互形态与产物组织\n\n聊天适合讨论过程，产物却往往需要独立编辑、版本和分享。把报告、表格或任务计划从消息中提取为明确对象，能够减少来回翻找，也便于跨端继续。对话可以保留产生它的上下文，产物则承担后续工作。\n\n这种分离还帮助处理局部修改。用户说“只改第二段”，系统需要知道当前产物与版本，而不是重新生成整份内容。产品应让用户理解修改范围，并在需要时查看差异，避免语言指令带来不可见的大范围变化。\n\n资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。\n\n### 关联阅读\n\n- [Agent 运行循环：目标、行动与观察](09-01.md)\n- [AI 适配性与替代方案判断](13-02.md)\n\n### 资料与延伸阅读\n\n- [Microsoft：Guidelines for Human-AI Interaction](https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/)\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n","chars":1510,"minutes":6,"summary":"交互形态决定用户如何表达目标、观察过程和保留控制权。Chat、Copilot 与 Agent 可以共存，选择应围绕任务结构和自主程度，而不是界面是否显得先进。一个产品也可以在不同阶段采用不同形态。"},{"id":"14-02","title":"输入引导、上下文提供与澄清","file":"content/14-02.md","level":"工作应用","prerequisites":["14-01"],"aliases":["UX","Copilot","HITL"],"module":"14","moduleTitle":"AI 交互与人机协作","html":"<p>模型需要的上下文与用户自然提供的信息常常不一致。输入设计的目标是帮助用户以合理负担表达任务，并让系统在关键不确定处及时澄清。一个空白输入框可以很灵活，也可能把大量理解与组织工作留给用户。<\/p><h2 id=\"section-1\">从任务所需信息定义输入<\/h2><p>先列出完成任务不可缺少的信息，再区分可以自动获得、可以推断和必须询问的部分。创建日程可能需要参与人、时间与主题；写草稿可能允许缺少部分背景，但要说明假设。字段并非越多越好，只有会改变行为或结果的重要信息才值得在开始时要求。<\/p><p>当前页面、选中对象、已授权资料和历史偏好可以降低输入成本，但要让用户知道系统看见了什么。若上下文来自错误对象，流畅输出也会偏离目标。可见的资料范围、附件列表和任务对象，有助于用户及时纠正。<\/p><h2 id=\"section-2\">澄清应围绕决策后果<\/h2><p>缺少信息不意味着必须停下来问所有问题。低风险草稿可以在明确假设后继续，无法撤销的行动则可能需要先确认。澄清问题应说明它影响的选择，例如“发送给内部团队还是客户”关系到权限、语气和外发风险。<\/p><p>问题尽量具体、容易回答，并给出必要上下文。让用户重新解释整个需求通常代价很高。对于已提供的信息，系统应保持一致记忆，避免重复询问；如果内容冲突，应指出冲突位置而不是随意选择。<\/p><h2 id=\"section-3\">教学构造的任务输入<\/h2><p>用户说“帮我安排和张经理的会议”。系统如果识别到多位同名人员，应先确认对象；若用户日历中有明确关联线索，可以展示候选及依据。会议时长可以使用可见默认值，发送邀请前仍应允许修改。对象识别错误的代价明显高于草案时长不理想。<\/p><p>输入也可以逐步展开。开始时收集目标与对象，生成初步方案后再询问细节。分阶段澄清能减少用户提前填写尚未理解的信息，但需要保存已输入内容，并允许回到前一步修改。<\/p><h2 id=\"section-4\">引导与示例的作用<\/h2><p>示例输入应体现真实支持范围，帮助用户理解能力与边界。若示例展示产品并不能稳定完成的复杂任务，会产生错误预期。示例还可以说明何种资料有帮助，例如提供订单号或政策版本，而不是要求用户学习提示工程才能使用产品。<\/p><p>表单与自然语言可以结合。用户先用一句话描述，再由系统提取字段并让用户检查，适合同时需要灵活表达与结构化执行的场景。提取结果应允许编辑，不能把模型解释当作用户已经确认。<\/p><h2 id=\"section-5\">处理超长、错误与敏感输入<\/h2><p>资料超出限制时，说明哪些内容没有处理，以及可用的缩小范围或分批方式。解析失败时保留原材料并提供可操作原因。涉及敏感资料时，界面应清楚表达资料流向和使用范围，避免用户在不知道后果时提供不必要信息。<\/p><p>输入体验是否良好，可以从用户能否正确表达、是否反复重述、是否理解默认值及是否发现对象错误来判断。核心是让系统承担合理的组织工作，同时在真正影响任务的地方把选择交还用户。<\/p><h2 id=\"section-6\">默认值与澄清的边界<\/h2><p>默认值应尽量可见、可修改，并符合当前任务。比如会议时长默认三十分钟，可以在草案中直接展示；涉及哪位同名联系人，通常应先确认。两者的差别在于出错后果与用户发现难度。系统可以用候选列表减轻回答负担，候选仍然需要足够的识别信息。<\/p><p>当任务存在多个不确定点，可以优先问会改变整体方向的问题，再延后细节。准备客户报告时，先确定目标客户和报告用途，通常比先确定标题样式更有价值。澄清顺序体现产品对任务的理解。<\/p><p>如果系统采用假设继续，应在结果中保留假设及修改入口。例如“暂按下周一处理，可在发送前调整”。假设不能被静默转成授权，也不能在后续步骤中失去出处。对于需要用户明确决定的关键动作，等待仍然是合理的产品行为。<\/p><h2 id=\"section-7\">输入确认不等于行动授权<\/h2><p>系统把自然语言提取为字段后，展示“识别为客户甲、日期周五”，只是对理解的确认；真正创建、发送或修改还可能需要动作授权。两者可以在同一界面完成，但文案必须清楚，让用户知道点击后会发生什么。<\/p><p>用户修改输入时，后续派生内容可能需要更新。例如更换客户后，旧资料和草稿不能继续沿用。系统应明确哪些结果已失效，避免看似保留工作、实际上混用上下文。输入设计因此需要连接版本与状态。<\/p><p>资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/05-01\">指令、角色与任务边界<\/a><\/li><li><a href=\"#lesson/14-07\">记忆、个性化与用户控制<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.microsoft.com
