prerequisites":["17-01"],"aliases":["案例","AI SCADA","研究助手"],"module":"17","moduleTitle":"产品与项目案例库","html":"<p>延续企业知识助手的教学案例，本篇聚焦一次错误回答如何诊断。系统给出了流畅答案和来源链接，却可能使用旧版本、引用不支持结论或泄露用户无权看到的资料。问题需要按信息流逐段定位。<\/p><h2 id=\"section-1\">先还原任务与证据<\/h2><p>假设员工询问报销标准，助手回答某金额并引用政策。首先记录任务、用户权限、问题时间、模型与配置版本、检索候选、最终片段和回答。诊断依赖可信日志，不能仅追问模型“你为什么答错”。模型可能生成合理但不真实的解释。<\/p><p>同时核对正确答案与适用条件。业务专家也可能引用旧规则，因此需要权威来源及生效时间。若正确标准尚不明确，应先标为资料治理问题，避免拿不稳定答案评判模型。<\/p><h2 id=\"section-2\">分层定位错误<\/h2><p>资料层可能缺少新通知、解析丢失表格或元数据错误；检索层可能没有召回、排序不当或权限过滤失效；上下文层可能截断关键条件；生成层可能忽略限制或拼接不相容片段；展示层可能把引用关联错位置。每层对应不同改进。<\/p><p>例如检索已经拿到正确条款，但模型把“仅适用于经理级”省略，重点在生成与展示；若新通知根本没进入索引，换模型通常无助；若无权文档在检索阶段已被返回，即使最终回答没泄露，也应检查权限链。<\/p><h2 id=\"section-3\">引用质量的完整判断<\/h2><p>引用需要支持具体结论，链接可打开且权限正确，片段与版本适用，重要条件没有遗漏。一个回答可以有多个来源，也可能说明来源冲突。引用数量多不等于可靠，正文无法访问的链接也不能被假装已经核验。<\/p><p>对表格、扫描件和附件，定位方式需要考虑实际格式。只给整份长文档链接，会把寻找依据的负担交回用户。可定位片段、页码或结构化记录能降低核对成本。<\/p><h2 id=\"section-4\">教学构造的修复流程<\/h2><p>发现错误来自旧政策权重过高后，团队补齐生效时间和权威级别，调整检索条件，并要求回答保留适用条件。修复后不能只重跑原问题，还要检查其他地区、日期与员工类型，以及无答案和无权限场景。<\/p><p>若一部分旧资料仍有历史查询价值，不必全部删除，可以明确标记适用时间。否则修复当前问题可能破坏历史任务。知识治理需要同时支持当前与历史事实，而不是简单把最新文件当成全部真相。<\/p><h2 id=\"section-5\">权限与更新的隐蔽风险<\/h2><p>权限变化需要覆盖索引、缓存和已生成产物。员工撤权后，旧会话中的引用与摘要如何处理，需要明确政策。缓存必须包含适当身份或权限条件，避免为了加速把结果跨用户共享。<\/p><p>资料删除也要检查派生内容。原文、分段、向量、摘要和日志可能有不同生命周期，产品应与工程及隐私团队核对。界面中的删除成功，不能自动证明后台全部清理完成。<\/p><h2 id=\"section-6\">把诊断转成长期资产<\/h2><p>记录失败类别、代表问题、正确依据、修复版本与回归结果。它们可以支持以后模型、提示、检索与资料更新。持续质量来自能定位和修复问题的系统，而非一次成功演示。产品经理需要维护任务标准与用户影响，帮助各团队围绕同一条证据链协作。<\/p><h2 id=\"section-7\">用诊断表区分相似症状<\/h2><p>“未找到正确答案”可以进一步区分：库中没有、索引未更新、没有召回、排序靠后、上下文未保留、生成忽略、展示错位。每个类别保留一条代表任务及证据。这样的分类能帮助团队选择数据、检索、提示或交互改进。<\/p><p>权限问题也可以分为源系统权限、同步映射、检索过滤、缓存、引用打开和共享产物。用户看见不应看见的标题，可能已经构成信息暴露，即使正文被阻断。检查需要覆盖实际可见范围。<\/p><h2 id=\"section-8\">诊断中的对照方式<\/h2><p>可以在同一任务上固定资料与模型，只改变检索或上下文；也可以直接给正确片段，观察生成是否仍错误。这样的对照帮助缩小原因，但不能把受控结果直接当作真实流量表现。正式结论还需回到代表任务与运行条件。<\/p><p>资料修订后，记录索引版本与更新时间，确认线上实际使用了新版本。若只在本地测试更新文件，线上仍读取旧缓存，就会出现“已经修复但用户仍报错”的情况。<\/p><h2 id=\"section-9\">向用户解释修复范围<\/h2><p>可以说明旧资料导致某类回答不一致，已更新相关来源与处理方式；其他未核验领域仍需注意。避免笼统保证以后不会再错。清楚的修复范围既帮助用户恢复信任，也为后续反馈保留正确预期。<\/p><p>资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。<\/p><h3 id=\"section-10\">关联阅读<\/h3><ul><li><a href=\"#lesson/07-08\">权限、更新与生产级 RAG 取舍<\/a><\/li><li><a href=\"#lesson/15-04\">数据隐私、敏感信息与隔离<\/a><\/li><\/ul><h3 id=\"section-11\">资料与延伸阅读<\/h3><ul><li><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/rag-engine/rag-overview\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：RAG Engine Overview<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"先还原任务与证据","level":2},{"id":"section-2","title":"分层定位错误","level":2},{"id":"section-3","title":"引用质量的完整判断","level":2},{"id":"section-4","title":"教学构造的修复流程","level":2},{"id":"section-5","title":"权限与更新的隐蔽风险","level":2},{"id":"section-6","title":"把诊断转成长期资产","level":2},{"id":"section-7","title":"用诊断表区分相似症状","level":2},{"id":"section-8","title":"诊断中的对照方式","level":2},{"id":"section-9","title":"向用户解释修复范围","level":2},{"id":"section-10","title":"关联阅读","level":3},{"id":"section-11","title":"资料与延伸阅读","level":3}],"text":"延续企业知识助手的教学案例，本篇聚焦一次错误回答如何诊断。系统给出了流畅答案和来源链接，却可能使用旧版本、引用不支持结论或泄露用户无权看到的资料。问题需要按信息流逐段定位。\n\n## 先还原任务与证据\n\n假设员工询问报销标准，助手回答某金额并引用政策。首先记录任务、用户权限、问题时间、模型与配置版本、检索候选、最终片段和回答。诊断依赖可信日志，不能仅追问模型“你为什么答错”。模型可能生成合理但不真实的解释。\n\n同时核对正确答案与适用条件。业务专家也可能引用旧规则，因此需要权威来源及生效时间。若正确标准尚不明确，应先标为资料治理问题，避免拿不稳定答案评判模型。\n\n## 分层定位错误\n\n资料层可能缺少新通知、解析丢失表格或元数据错误；检索层可能没有召回、排序不当或权限过滤失效；上下文层可能截断关键条件；生成层可能忽略限制或拼接不相容片段；展示层可能把引用关联错位置。每层对应不同改进。\n\n例如检索已经拿到正确条款，但模型把“仅适用于经理级”省略，重点在生成与展示；若新通知根本没进入索引，换模型通常无助；若无权文档在检索阶段已被返回，即使最终回答没泄露，也应检查权限链。\n\n## 引用质量的完整判断\n\n引用需要支持具体结论，链接可打开且权限正确，片段与版本适用，重要条件没有遗漏。一个回答可以有多个来源，也可能说明来源冲突。引用数量多不等于可靠，正文无法访问的链接也不能被假装已经核验。\n\n对表格、扫描件和附件，定位方式需要考虑实际格式。只给整份长文档链接，会把寻找依据的负担交回用户。可定位片段、页码或结构化记录能降低核对成本。\n\n## 教学构造的修复流程\n\n发现错误来自旧政策权重过高后，团队补齐生效时间和权威级别，调整检索条件，并要求回答保留适用条件。修复后不能只重跑原问题，还要检查其他地区、日期与员工类型，以及无答案和无权限场景。\n\n若一部分旧资料仍有历史查询价值，不必全部删除，可以明确标记适用时间。否则修复当前问题可能破坏历史任务。知识治理需要同时支持当前与历史事实，而不是简单把最新文件当成全部真相。\n\n## 权限与更新的隐蔽风险\n\n权限变化需要覆盖索引、缓存和已生成产物。员工撤权后，旧会话中的引用与摘要如何处理，需要明确政策。缓存必须包含适当身份或权限条件，避免为了加速把结果跨用户共享。\n\n资料删除也要检查派生内容。原文、分段、向量、摘要和日志可能有不同生命周期，产品应与工程及隐私团队核对。界面中的删除成功，不能自动证明后台全部清理完成。\n\n## 把诊断转成长期资产\n\n记录失败类别、代表问题、正确依据、修复版本与回归结果。它们可以支持以后模型、提示、检索与资料更新。持续质量来自能定位和修复问题的系统，而非一次成功演示。产品经理需要维护任务标准与用户影响，帮助各团队围绕同一条证据链协作。\n\n## 用诊断表区分相似症状\n\n“未找到正确答案”可以进一步区分：库中没有、索引未更新、没有召回、排序靠后、上下文未保留、生成忽略、展示错位。每个类别保留一条代表任务及证据。这样的分类能帮助团队选择数据、检索、提示或交互改进。\n\n权限问题也可以分为源系统权限、同步映射、检索过滤、缓存、引用打开和共享产物。用户看见不应看见的标题，可能已经构成信息暴露，即使正文被阻断。检查需要覆盖实际可见范围。\n\n## 诊断中的对照方式\n\n可以在同一任务上固定资料与模型，只改变检索或上下文；也可以直接给正确片段，观察生成是否仍错误。这样的对照帮助缩小原因，但不能把受控结果直接当作真实流量表现。正式结论还需回到代表任务与运行条件。\n\n资料修订后，记录索引版本与更新时间，确认线上实际使用了新版本。若只在本地测试更新文件，线上仍读取旧缓存，就会出现“已经修复但用户仍报错”的情况。\n\n## 向用户解释修复范围\n\n可以说明旧资料导致某类回答不一致，已更新相关来源与处理方式；其他未核验领域仍需注意。避免笼统保证以后不会再错。清楚的修复范围既帮助用户恢复信任，也为后续反馈保留正确预期。\n\n资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。\n\n### 关联阅读\n\n- [权限、更新与生产级 RAG 取舍](07-08.md)\n- [数据隐私、敏感信息与隔离](15-04.md)\n\n### 资料与延伸阅读\n\n- [Google Cloud：RAG Engine Overview](https://cloud.google.com/vertex-ai/generative-ai/docs/rag-engine/rag-overview)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1497,"minutes":6,"summary":"延续企业知识助手的教学案例，本篇聚焦一次错误回答如何诊断。系统给出了流畅答案和来源链接，却可能使用旧版本、引用不支持结论或泄露用户无权看到的资料。问题需要按信息流逐段定位。"},{"id":"17-03","title":"工具执行 Agent：契约、流程与状态","file":"content/17-03.md","level":"工作应用","prerequisites":["17-02"],"aliases":["案例","AI SCADA","研究助手"],"module":"17","moduleTitle":"产品与项目案例库","html":"<p>本案例构造一个客户回访 Agent：用户希望根据已授权客户资料创建回访任务，并通知负责同事。任务涉及理解意图、查询、生成草稿、确认与执行。目标是展示工具契约和状态如何让多步行动可控。<\/p><h2 id=\"section-1\">定义目标与授权边界<\/h2><p>用户目标可以表述为“为本月需跟进的指定客户创建回访任务”。需要明确客户范围、日期规则、负责人、通知对象和完成标准。读取资料、创建任务和发送通知是不同动作，授权应分别说明。<\/p><p>如果用户只要求整理建议，系统不能自动创建记录。若用户授权创建，通知是否也包括在内仍需根据任务核对。来自客户资料中的文字没有新增授权资格，不能让外部内容改变目标或扩大动作范围。<\/p><h2 id=\"section-2\">工具契约<\/h2><p>查询客户工具接收客户标识，返回可见字段、状态与资料时间；创建任务工具接收客户、负责人、日期、内容及唯一请求标识，返回任务标识和状态；通知工具接收明确对象与内容，返回发送结果。每个工具还要说明权限、前置条件、副作用和错误。<\/p><p>模型可以提出参数，可信程序负责检查格式和业务条件。例如日期不能早于允许范围，负责人必须存在且有权限，客户必须属于授权集合。结构合法与业务正确应分开验证。<\/p><h2 id=\"section-3\">执行流程与状态<\/h2><p>系统先解析目标并识别缺失信息，再查询客户，形成任务草案与差异预览。用户核对后提交创建，记录每项结果，最后按授权发送通知并给出任务链接。关键状态包括准备、待确认、执行中、部分成功、完成与失败。<\/p><p>“任务完成”应由目标状态支持：所需记录实际存在，通知达到约定状态，未完成部分已清楚说明。模型说自己完成不是证据。对异步接口，收到请求标识只是受理，需要后续查询或回调确认。<\/p><h2 id=\"section-4\">教学构造的一次执行<\/h2><p>用户指定三个客户，系统发现其中一个负责人不明确。可以先准备全部草稿，突出不确定项，向用户询问。确认后创建三条记录，返回各自链接。若仅两条成功，状态应保留，而非把整个任务简单标为失败。<\/p><p>通知内容使用确认后的版本。用户修改负责人或日期后，需要重新检查相关授权与业务条件。确认应绑定实际对象和版本，不能在后台悄悄增加客户或更改内容。<\/p><h2 id=\"section-5\">为什么可能不需要高度自主<\/h2><p>该任务步骤相对明确，可以用受控工作流编排，模型负责理解与内容生成。让模型动态决定所有步骤不一定带来价值，反而增加调试与完成判断难度。只有存在开放变化且有可验证收益时，才考虑更多动态规划。<\/p><p>协议或工具框架可以简化连接，但不能自动解决业务权限、幂等和状态一致性。产品经理需要理解这些责任由哪一层承担，避免把“接入工具”当作完整能力。<\/p><h2 id=\"section-6\">评估与运行<\/h2><p>检查对象识别、参数、权限、确认、实际状态、重复执行和异常恢复。记录任务级成功、用户核对负担、延迟与成本。完整流程应可追踪到工具结果，并保留适当脱敏日志。这个案例的可靠性来自清晰契约与状态，而不是模型永远不犯错。<\/p><h2 id=\"section-7\">契约示例的业务含义<\/h2><p>创建任务的输入可以包含客户标识、负责人标识、截止日期、任务描述和请求标识。日期格式由程序检查，客户与负责人的关系由业务规则检查，请求标识用于识别同一次提交。模型生成这些字段之后，还没有获得执行资格。<\/p><p>返回值可以包含受理状态、业务任务标识、实际创建字段和错误类别。若服务端采用异步处理，应提供可查询标识；若部分字段被业务系统调整，应在结果中反映，而不是继续显示原草案。契约的目标是保持用户理解与真实状态一致。<\/p><h2 id=\"section-8\">确认视图连接授权与版本<\/h2><p>预览展示即将创建的对象、负责人、日期和通知范围，用户可编辑或排除。确认记录绑定最终集合与版本。若确认后客户资料或权限变化，执行前需要根据规则重新核对，必要时重新确认。<\/p><p>这个设计也帮助审计：可以还原用户看见并批准了什么，以及系统实际提交了什么。仅保存“用户点击同意”而没有对应内容，无法解释授权范围。<\/p><h2 id=\"section-9\">完成摘要应可继续工作<\/h2><p>任务结束后列出成功记录与链接、未完成项、通知状态和限制。用户能够直接进入业务系统，而不必从聊天中复制标识。产物与状态成为稳定对象，后续查询与恢复也更容易。<\/p><h2 id=\"section-10\">工具输入的示意结构<\/h2><p>下面是教学构造的数据示意，不是任何平台可直接运行的接口代码：<\/p><pre><code>{\n  &quot;customer_id&quot;: &quot;customer_demo_01&quot;,\n  &quot;owner_id&quot;: &quot;user_demo_02&quot;,\n  &quot;due_date&quot;: &quot;2026-12-01&quot;,\n  &quot;summary&quot;: &quot;回访并确认后续需求&quot;,\n  &quot;request_id&quot;: &quot;task_demo_unique_01&quot;\n}<\/code><\/pre><p>模型可以提出字段值，系统再检查对象存在、用户权限、日期和请求身份。返回的业务任务标识应被记录，用于结果链接、状态查询与恢复。合法 JSON 只证明语法可解析，不证明任务正确或已经授权。<\/p><p>资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。<\/p><h3 id=\"section-11\">关联阅读<\/h3><ul><li><a href=\"#lesson/08-02\">工具调用的完整生命周期<\/a><\/li><li><a href=\"#lesson/09-04\">单 Agent 与多 Agent 的选择<\/a><\/li><\/ul><h3 id=\"section-12\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://modelcontextprotocol.io/docs/learn/architecture\" target=\"_blank\" rel=\"noopener noreferrer\">MCP：Architecture<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"定义目标与授权边界","level":2},{"id":"section-2","title":"工具契约","level":2},{"id":"section-3","title":"执行流程与状态","level":2},{"id":"section-4","title":"教学构造的一次执行","level":2},{"id":"section-5","title":"为什么可能不需要高度自主","level":2},{"id":"section-6","title":"评估与运行","level":2},{"id":"section-7","title":"契约示例的业务含义","level":2},{"id":"section-8","title":"确认视图连接授权与版本","level":2},{"id":"section-9","title":"完成摘要应可继续工作","level":2},{"id":"section-10","title":"工具输入的示意结构","level":2},{"id":"section-11","title":"关联阅读","level":3},{"id":"section-12","title":"资料与延伸阅读","level":3}],"text":"本案例构造一个客户回访 Agent：用户希望根据已授权客户资料创建回访任务，并通知负责同事。任务涉及理解意图、查询、生成草稿、确认与执行。目标是展示工具契约和状态如何让多步行动可控。\n\n## 定义目标与授权边界\n\n用户目标可以表述为“为本月需跟进的指定客户创建回访任务”。需要明确客户范围、日期规则、负责人、通知对象和完成标准。读取资料、创建任务和发送通知是不同动作，授权应分别说明。\n\n如果用户只要求整理建议，系统不能自动创建记录。若用户授权创建，通知是否也包括在内仍需根据任务核对。来自客户资料中的文字没有新增授权资格，不能让外部内容改变目标或扩大动作范围。\n\n## 工具契约\n\n查询客户工具接收客户标识，返回可见字段、状态与资料时间；创建任务工具接收客户、负责人、日期、内容及唯一请求标识，返回任务标识和状态；通知工具接收明确对象与内容，返回发送结果。每个工具还要说明权限、前置条件、副作用和错误。\n\n模型可以提出参数，可信程序负责检查格式和业务条件。例如日期不能早于允许范围，负责人必须存在且有权限，客户必须属于授权集合。结构合法与业务正确应分开验证。\n\n## 执行流程与状态\n\n系统先解析目标并识别缺失信息，再查询客户，形成任务草案与差异预览。用户核对后提交创建，记录每项结果，最后按授权发送通知并给出任务链接。关键状态包括准备、待确认、执行中、部分成功、完成与失败。\n\n“任务完成”应由目标状态支持：所需记录实际存在，通知达到约定状态，未完成部分已清楚说明。模型说自己完成不是证据。对异步接口，收到请求标识只是受理，需要后续查询或回调确认。\n\n## 教学构造的一次执行\n\n用户指定三个客户，系统发现其中一个负责人不明确。可以先准备全部草稿，突出不确定项，向用户询问。确认后创建三条记录，返回各自链接。若仅两条成功，状态应保留，而非把整个任务简单标为失败。\n\n通知内容使用确认后的版本。用户修改负责人或日期后，需要重新检查相关授权与业务条件。确认应绑定实际对象和版本，不能在后台悄悄增加客户或更改内容。\n\n## 为什么可能不需要高度自主\n\n该任务步骤相对明确，可以用受控工作流编排，模型负责理解与内容生成。让模型动态决定所有步骤不一定带来价值，反而增加调试与完成判断难度。只有存在开放变化且有可验证收益时，才考虑更多动态规划。\n\n协议或工具框架可以简化连接，但不能自动解决业务权限、幂等和状态一致性。产品经理需要理解这些责任由哪一层承担，避免把“接入工具”当作完整能力。\n\n## 评估与运行\n\n检查对象识别、参数、权限、确认、实际状态、重复执行和异常恢复。记录任务级成功、用户核对负担、延迟与成本。完整流程应可追踪到工具结果，并保留适当脱敏日志。这个案例的可靠性来自清晰契约与状态，而不是模型永远不犯错。\n\n## 契约示例的业务含义\n\n创建任务的输入可以包含客户标识、负责人标识、截止日期、任务描述和请求标识。日期格式由程序检查，客户与负责人的关系由业务规则检查，请求标识用于识别同一次提交。模型生成这些字段之后，还没有获得执行资格。\n\n返回值可以包含受理状态、业务任务标识、实际创建字段和错误类别。若服务端采用异步处理，应提供可查询标识；若部分字段被业务系统调整，应在结果中反映，而不是继续显示原草案。契约的目标是保持用户理解与真实状态一致。\n\n## 确认视图连接授权与版本\n\n预览展示即将创建的对象、负责人、日期和通知范围，用户可编辑或排除。确认记录绑定最终集合与版本。若确认后客户资料或权限变化，执行前需要根据规则重新核对，必要时重新确认。\n\n这个设计也帮助审计：可以还原用户看见并批准了什么，以及系统实际提交了什么。仅保存“用户点击同意”而没有对应内容，无法解释授权范围。\n\n## 完成摘要应可继续工作\n\n任务结束后列出成功记录与链接、未完成项、通知状态和限制。用户能够直接进入业务系统，而不必从聊天中复制标识。产物与状态成为稳定对象，后续查询与恢复也更容易。\n\n## 工具输入的示意结构\n\n下面是教学构造的数据示意，不是任何平台可直接运行的接口代码：\n\n```json\n{\n  \"customer_id\": \"customer_demo_01\",\n  \"owner_id\": \"user_demo_02\",\n  \"due_date\": \"2026-12-01\",\n  \"summary\": \"回访并确认后续需求\",\n  \"request_id\": \"task_demo_unique_01\"\n}\n```\n\n模型可以提出字段值，系统再检查对象存在、用户权限、日期和请求身份。返回的业务任务标识应被记录，用于结果链接、状态查询与恢复。合法 JSON 只证明语法可解析，不证明任务正确或已经授权。\n\n资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。\n\n### 关联阅读\n\n- [工具调用的完整生命周期](08-02.md)\n- [单 Agent 与多 Agent 的选择](09-04.md)\n\n### 资料与延伸阅读\n\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [MCP：Architecture](https://modelcontextprotocol.io/docs/learn/architecture)\n","chars":1602,"minutes":6,"summary":"本案例构造一个客户回访 Agent：用户希望根据已授权客户资料创建回访任务，并通知负责同事。任务涉及理解意图、查询、生成草稿、确认与执行。目标是展示工具契约和状态如何让多步行动可控。"},{"id":"17-04","title":"工具执行 Agent：重复执行与失败恢复","file":"content/17-04.md","level":"工作应用","prerequisites":["17-03"],"aliases":["案例","AI SCADA","研究助手"],"module":"17","moduleTitle":"产品与项目案例库","html":"<p>延续客户回访 Agent，本篇分析执行中的超时、重复与恢复。工具调用失败有时意味着没有执行，有时只是没有收到回执。若系统一律重试，可能创建重复记录或发送多次通知。恢复需要基于可信状态。<\/p><h2 id=\"section-1\">超时不等于未执行<\/h2><p>客户端提交创建请求后，服务端可能已经完成，只是网络回执丢失。此时重试同一业务动作有风险。可以使用唯一请求标识支持幂等，或先按业务标识查询状态，再决定继续。具体能力取决于接口与系统设计，不能仅靠提示要求模型“不要重复”。<\/p><p>幂等的含义是同一请求重复提交，不应产生额外非预期效果。它需要明确请求身份、保存范围和业务结果。用户明确要求再次创建，与系统因网络重试，是不同情况，不能用粗糙去重阻止合法任务。<\/p><h2 id=\"section-2\">保存检查点与已完成事实<\/h2><p>长流程可以在关键步骤保存任务状态、输入版本、工具结果和未完成事项。恢复时读取检查点，并核对外部状态是否变化。保存状态并不保证任意步骤都能无损重放，涉及外部副作用时尤其需要谨慎。<\/p><p>工具结果应作为事件记录，不能只保存在模型自然语言记忆。模型上下文可能被压缩、丢失或误读，关键业务事实需要可信存储。恢复逻辑可以使用模型辅助分析，但最终动作仍受规则与权限约束。<\/p><h2 id=\"section-3\">教学构造的失败轨迹<\/h2><p>创建甲任务成功并返回标识，创建乙请求超时，丙尚未提交。正确恢复是保留甲，查询乙是否已创建，确认后再处理丙。若通知尚未发送，不能因重启任务而再次创建甲乙。每个步骤有独立状态，才能只重试必要部分。<\/p><p>若乙已存在但内容与草案不同，需要判断是否由其他用户修改。系统不能静默覆盖。可以展示差异并请求选择，或按业务规则停止。恢复不仅是技术续跑，也涉及多人协作与当前事实。<\/p><h2 id=\"section-4\">回滚与补偿<\/h2><p>有些动作可以撤销，如恢复草稿版本；有些只能补偿，如发送更正通知或关闭重复任务。跨系统流程往往没有一个全局事务。需求应明确每个动作的可逆性，以及部分成功时如何处理。<\/p><p>若创建任务成功、发送通知失败，可以允许只补发通知；如果任务本身错误，可能需要用户确认后取消。自动补偿也会改变业务状态，应受权限和后果约束，不能因为名为恢复就默认安全。<\/p><h2 id=\"section-5\">停止条件与人工接管<\/h2><p>连续失败、状态无法确认、权限变化或业务冲突时，系统应停止无效循环。交给用户的内容包括已完成记录、未完成项、错误、资料与下一步选项。用户接管后应避免 Agent 继续并行操作，防止重复或覆盖。<\/p><p>重试次数、时间和预算都需要边界。无限重试不仅消耗资源，还会让用户以为任务持续推进。明确停止与状态说明，比模糊地“继续尝试”更可靠。<\/p><h2 id=\"section-6\">从个案到质量体系<\/h2><p>把超时、重复、部分成功、重启、并发修改和授权撤回纳入代表场景，记录实际状态与最终结果。每次工具或编排变更后回归。产品经理需要能读懂执行轨迹，说明问题在哪一层，并推动针对性修复。<\/p><h2 id=\"section-7\">一条事件轨迹的阅读方法<\/h2><p>可以按时间记录“草案确认—请求提交—超时—状态查询—发现已创建—继续下一项”。关键是区分系统尝试与业务结果。若轨迹只有“调用工具失败”，就缺少判断能否重试的依据。<\/p><p>检查点可以保存当前任务位置，但外部系统可能已变化。因此恢复时需要同时读取内部记录与外部状态。持久执行框架帮助保存和恢复，并不自动保证所有副作用恰好发生一次。工具与业务系统仍需幂等或补偿设计。<\/p><h2 id=\"section-8\">并发与用户重复提交<\/h2><p>用户可能因等待再次点击，或从另一设备发起同样任务。系统可以在合适范围识别正在执行的请求，并显示当前状态。不能只禁用一个前端按钮，因为网络重试与多端操作仍可能发生。<\/p><p>同样，两个不同用户可能合法创建相似任务。去重条件需要业务语义，避免把合法操作误当重复。幂等键与业务重复判断解决不同层的问题，应分别设计。<\/p><h2 id=\"section-9\">恢复证据的保留<\/h2><p>记录原失败、恢复动作、最终状态与是否需要人工处理，有助于观察恢复率和额外成本。若恢复掩盖原错误，团队会误以为流程始终顺利，无法定位高频故障。用户级摘要可以简洁，诊断层保留必要细节。<\/p><h2 id=\"section-10\">教学构造的恢复轨迹<\/h2><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>事件<\/th><th>内部记录<\/th><th>外部证据<\/th><th>下一步<\/th><\/tr><tr><td>创建甲返回成功<\/td><td>已保存任务标识<\/td><td>甲存在<\/td><td>不重复创建<\/td><\/tr><tr><td>创建乙超时<\/td><td>请求身份已保存<\/td><td>状态未知<\/td><td>查询或幂等重试<\/td><\/tr><tr><td>查询乙存在<\/td><td>补全任务标识<\/td><td>乙存在<\/td><td>继续丙<\/td><\/tr><tr><td>通知失败<\/td><td>任务已完成、通知未完成<\/td><td>无发送确认<\/td><td>只恢复通知<\/td><\/tr><\/table><\/div><p>这个轨迹展示为什么需要保存请求与结果。恢复从最后一个可确认事实开始，不能根据一段笼统的失败文案重新执行全部流程。<\/p><p>资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。<\/p><h3 id=\"section-11\">关联阅读<\/h3><ul><li><a href=\"#lesson/08-06\">回滚、补偿与业务一致性<\/a><\/li><li><a href=\"#lesson/12-02\">Trace、日志与可观测性<\/a><\/li><\/ul><h3 id=\"section-12\">资料与延伸阅读<\/h3><ul><li><a href=\"https://docs.langchain.com/oss/python/langgraph/persistence\" target=\"_blank\" rel=\"noopener noreferrer\">LangGraph：Persistence 与检查点<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://docs.stripe.com/api/idempotent_requests\" target=\"_blank\" rel=\"noopener noreferrer\">Stripe：Idempotent requests<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"超时不等于未执行","level":2},{"id":"section-2","title":"保存检查点与已完成事实","level":2},{"id":"section-3","title":"教学构造的失败轨迹","level":2},{"id":"section-4","title":"回滚与补偿","level":2},{"id":"section-5","title":"停止条件与人工接管","level":2},{"id":"section-6","title":"从个案到质量体系","level":2},{"id":"section-7","title":"一条事件轨迹的阅读方法","level":2},{"id":"section-8","title":"并发与用户重复提交","level":2},{"id":"section-9","title":"恢复证据的保留","level":2},{"id":"section-10","title":"教学构造的恢复轨迹","level":2},{"id":"section-11","title":"关联阅读","level":3},{"id":"section-12","title":"资料与延伸阅读","level":3}],"text":"延续客户回访 Agent，本篇分析执行中的超时、重复与恢复。工具调用失败有时意味着没有执行，有时只是没有收到回执。若系统一律重试，可能创建重复记录或发送多次通知。恢复需要基于可信状态。\n\n## 超时不等于未执行\n\n客户端提交创建请求后，服务端可能已经完成，只是网络回执丢失。此时重试同一业务动作有风险。可以使用唯一请求标识支持幂等，或先按业务标识查询状态，再决定继续。具体能力取决于接口与系统设计，不能仅靠提示要求模型“不要重复”。\n\n幂等的含义是同一请求重复提交，不应产生额外非预期效果。它需要明确请求身份、保存范围和业务结果。用户明确要求再次创建，与系统因网络重试，是不同情况，不能用粗糙去重阻止合法任务。\n\n## 保存检查点与已完成事实\n\n长流程可以在关键步骤保存任务状态、输入版本、工具结果和未完成事项。恢复时读取检查点，并核对外部状态是否变化。保存状态并不保证任意步骤都能无损重放，涉及外部副作用时尤其需要谨慎。\n\n工具结果应作为事件记录，不能只保存在模型自然语言记忆。模型上下文可能被压缩、丢失或误读，关键业务事实需要可信存储。恢复逻辑可以使用模型辅助分析，但最终动作仍受规则与权限约束。\n\n## 教学构造的失败轨迹\n\n创建甲任务成功并返回标识，创建乙请求超时，丙尚未提交。正确恢复是保留甲，查询乙是否已创建，确认后再处理丙。若通知尚未发送，不能因重启任务而再次创建甲乙。每个步骤有独立状态，才能只重试必要部分。\n\n若乙已存在但内容与草案不同，需要判断是否由其他用户修改。系统不能静默覆盖。可以展示差异并请求选择，或按业务规则停止。恢复不仅是技术续跑，也涉及多人协作与当前事实。\n\n## 回滚与补偿\n\n有些动作可以撤销，如恢复草稿版本；有些只能补偿，如发送更正通知或关闭重复任务。跨系统流程往往没有一个全局事务。需求应明确每个动作的可逆性，以及部分成功时如何处理。\n\n若创建任务成功、发送通知失败，可以允许只补发通知；如果任务本身错误，可能需要用户确认后取消。自动补偿也会改变业务状态，应受权限和后果约束，不能因为名为恢复就默认安全。\n\n## 停止条件与人工接管\n\n连续失败、状态无法确认、权限变化或业务冲突时，系统应停止无效循环。交给用户的内容包括已完成记录、未完成项、错误、资料与下一步选项。用户接管后应避免 Agent 继续并行操作，防止重复或覆盖。\n\n重试次数、时间和预算都需要边界。无限重试不仅消耗资源，还会让用户以为任务持续推进。明确停止与状态说明，比模糊地“继续尝试”更可靠。\n\n## 从个案到质量体系\n\n把超时、重复、部分成功、重启、并发修改和授权撤回纳入代表场景，记录实际状态与最终结果。每次工具或编排变更后回归。产品经理需要能读懂执行轨迹，说明问题在哪一层，并推动针对性修复。\n\n## 一条事件轨迹的阅读方法\n\n可以按时间记录“草案确认—请求提交—超时—状态查询—发现已创建—继续下一项”。关键是区分系统尝试与业务结果。若轨迹只有“调用工具失败”，就缺少判断能否重试的依据。\n\n检查点可以保存当前任务位置，但外部系统可能已变化。因此恢复时需要同时读取内部记录与外部状态。持久执行框架帮助保存和恢复，并不自动保证所有副作用恰好发生一次。工具与业务系统仍需幂等或补偿设计。\n\n## 并发与用户重复提交\n\n用户可能因等待再次点击，或从另一设备发起同样任务。系统可以在合适范围识别正在执行的请求，并显示当前状态。不能只禁用一个前端按钮，因为网络重试与多端操作仍可能发生。\n\n同样，两个不同用户可能合法创建相似任务。去重条件需要业务语义，避免把合法操作误当重复。幂等键与业务重复判断解决不同层的问题，应分别设计。\n\n## 恢复证据的保留\n\n记录原失败、恢复动作、最终状态与是否需要人工处理，有助于观察恢复率和额外成本。若恢复掩盖原错误，团队会误以为流程始终顺利，无法定位高频故障。用户级摘要可以简洁，诊断层保留必要细节。\n\n## 教学构造的恢复轨迹\n\n| 事件 | 内部记录 | 外部证据 | 下一步 |\n|---|---|---|---|\n| 创建甲返回成功 | 已保存任务标识 | 甲存在 | 不重复创建 |\n| 创建乙超时 | 请求身份已保存 | 状态未知 | 查询或幂等重试 |\n| 查询乙存在 | 补全任务标识 | 乙存在 | 继续丙 |\n| 通知失败 | 任务已完成、通知未完成 | 无发送确认 | 只恢复通知 |\n\n这个轨迹展示为什么需要保存请求与结果。恢复从最后一个可确认事实开始，不能根据一段笼统的失败文案重新执行全部流程。\n\n资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。\n\n### 关联阅读\n\n- [回滚、补偿与业务一致性](08-06.md)\n- [Trace、日志与可观测性](12-02.md)\n\n### 资料与延伸阅读\n\n- [LangGraph：Persistence 与检查点](https://docs.langchain.com/oss/python/langgraph/persistence)\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [Stripe：Idempotent requests](https://docs.stripe.com/api/idempotent_requests)\n","chars":1624,"minutes":6,"summary":"延续客户回访 Agent，本篇分析执行中的超时、重复与恢复。工具调用失败有时意味着没有执行，有时只是没有收到回执。若系统一律重试，可能创建重复记录或发送多次通知。恢复需要基于可信状态。"},{"id":"17-05","title":"研究助手：检索、证据与报告生成","file":"content/17-05.md","level":"工作应用","prerequisites":["17-04"],"aliases":["案例","AI SCADA","研究助手"],"module":"17","moduleTitle":"产品与项目案例库","html":"<p>本案例构造一个研究助手：用户希望了解某类企业工具的能力与选型条件，并获得有依据的报告。任务包含范围定义、检索、阅读、证据整理、比较与写作。可靠性来自证据链，而非报告长度或引用数量。<\/p><h2 id=\"section-1\">先确定研究问题<\/h2><p>需要明确对象、地区、时间、用途和决策标准。例如“比较三类工具在权限、数据接入、任务执行和成本控制上的适用条件”。若直接搜索“最好的 Agent”，很难形成可验证结论。用户目标也决定需要哪些来源和深度。<\/p><p>范围应说明不覆盖什么。公开资料可以支持功能与条款分析，却未必能证明真实稳定性、内部架构或客户收益。缺少实际测试时，结论应保留这些限制，不能用宣传材料推断运行表现。<\/p><h2 id=\"section-2\">从检索到可用证据<\/h2><p>搜索结果是候选，读取正文后才能判断是否支持具体说法。资料记录应包含标题、链接、发布与核验时间、来源类型和相关结论。官方文档适合功能与接口，论文适合方法，用户案例可以提供使用情境，但各有偏差。<\/p><p>研究助手应处理无法访问、过期、重复与冲突。多个转载同一原文并不形成独立证据。模型记忆中的事实也不能冒充本次已核验内容。无法取得正文时，明确标注未核验，而非根据摘要补写细节。<\/p><h2 id=\"section-3\">证据表与报告生成<\/h2><p>可以先建立“问题—结论—证据—限制”的结构，再生成正文。每个重要主张关联真正支持它的来源。事实、分析推断和建议分开表达。报告中的比较条件应一致，例如同一套餐、同一任务或明确说明差异。<\/p><p>来源中若包含要求改变任务的文字，应当作资料内容，不作为授权。研究环境还需限制下载、外发和凭证，防止恶意网页影响后续工具行为。读取公开信息也会涉及安全边界。<\/p><h2 id=\"section-4\">教学构造的一次冲突<\/h2><p>工具文档说明某功能仅支持特定环境，营销页却用更宽泛语言描述。报告应以具体条件解释能力，必要时引用两者并说明范围。不能为了表格整齐，把复杂条件压成简单的“支持”。<\/p><p>若价格只有部分信息，可以列出计费维度和待核实项，避免编造总成本。对尚未测试的延迟或质量，不应给出确定排名。研究价值包括指出未知以及如何进一步验证。<\/p><h2 id=\"section-5\">质量、成本与完成标准<\/h2><p>完成标准可以是覆盖约定问题、主要结论有证据、冲突与缺口已说明、引用可打开且支持主张。搜索次数不构成完成标准。预算与时间限制需要可见，达到限制时交付部分结果并标明范围。<\/p><p>多 Agent 可以分工查找不同主题，但还需要统一来源标准、去重、冲突处理与最终核验。并行提高速度并不自动提高正确性，也可能放大重复与不一致。是否采用应基于任务效果和复杂度取舍。<\/p><p>最终报告应让读者理解结论成立的条件，并能沿链接回到依据。这种可追溯研究方法，可以迁移到竞品、岗位、技术选型和市场分析。<\/p><h2 id=\"section-6\">一张研究证据表的结构<\/h2><p>每条结论可以保存问题、主张、来源、原文位置、发布时间、核验时间、资料类型与限制。例如“支持某种权限”需要具体文档条件，不能仅凭首页标语。分析建议则标为基于这些事实的推断。<\/p><p>检索时还应记录没有找到或无法访问的关键来源。缺失会影响结论覆盖范围，不能因为最终报告没有引用就从过程里消失。若只拿到二手材料，可以说明其性质，并尝试追溯原始资料。<\/p><h2 id=\"section-7\">报告结构如何反映证据<\/h2><p>先给问题与结论，再说明适用条件、比较维度、依据与未知。表格便于比较，但复杂条件需要保留脚注或正文。对不同产品使用不同套餐或发布时间，应清楚标注，避免制造不公平排名。<\/p><p>报告生成后逐项检查引用是否真的支持主张，是否存在未引用却重要的事实，以及推断是否被写成确定结论。自动检查可辅助链接与结构，内容支撑仍需要适当核验。<\/p><h2 id=\"section-8\">完成与停止的区别<\/h2><p>任务因预算耗尽而停止，可能只完成部分研究；覆盖目标问题且限制已说明，才接近约定完成。系统应在产物中反映状态。停止并非失败全部价值，但不能把部分材料包装为全面调研。<\/p><p>资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。<\/p><h3 id=\"section-9\">关联阅读<\/h3><ul><li><a href=\"#lesson/07-06\">引用、可追溯性与回答约束<\/a><\/li><li><a href=\"#lesson/15-02\">提示注入与不可信内容<\/a><\/li><\/ul><h3 id=\"section-10\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://genai.owasp.org/llmrisk/llm01-prompt-injection/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：Prompt Injection<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"先确定研究问题","level":2},{"id":"section-2","title":"从检索到可用证据","level":2},{"id":"section-3","title":"证据表与报告生成","level":2},{"id":"section-4","title":"教学构造的一次冲突","level":2},{"id":"section-5","title":"质量、成本与完成标准","level":2},{"id":"section-6","title":"一张研究证据表的结构","level":2},{"id":"section-7","title":"报告结构如何反映证据","level":2},{"id":"section-8","title":"完成与停止的区别","level":2},{"id":"section-9","title":"关联阅读","level":3},{"id":"section-10","title":"资料与延伸阅读","level":3}],"text":"本案例构造一个研究助手：用户希望了解某类企业工具的能力与选型条件，并获得有依据的报告。任务包含范围定义、检索、阅读、证据整理、比较与写作。可靠性来自证据链，而非报告长度或引用数量。\n\n## 先确定研究问题\n\n需要明确对象、地区、时间、用途和决策标准。例如“比较三类工具在权限、数据接入、任务执行和成本控制上的适用条件”。若直接搜索“最好的 Agent”，很难形成可验证结论。用户目标也决定需要哪些来源和深度。\n\n范围应说明不覆盖什么。公开资料可以支持功能与条款分析，却未必能证明真实稳定性、内部架构或客户收益。缺少实际测试时，结论应保留这些限制，不能用宣传材料推断运行表现。\n\n## 从检索到可用证据\n\n搜索结果是候选，读取正文后才能判断是否支持具体说法。资料记录应包含标题、链接、发布与核验时间、来源类型和相关结论。官方文档适合功能与接口，论文适合方法，用户案例可以提供使用情境，但各有偏差。\n\n研究助手应处理无法访问、过期、重复与冲突。多个转载同一原文并不形成独立证据。模型记忆中的事实也不能冒充本次已核验内容。无法取得正文时，明确标注未核验，而非根据摘要补写细节。\n\n## 证据表与报告生成\n\n可以先建立“问题—结论—证据—限制”的结构，再生成正文。每个重要主张关联真正支持它的来源。事实、分析推断和建议分开表达。报告中的比较条件应一致，例如同一套餐、同一任务或明确说明差异。\n\n来源中若包含要求改变任务的文字，应当作资料内容，不作为授权。研究环境还需限制下载、外发和凭证，防止恶意网页影响后续工具行为。读取公开信息也会涉及安全边界。\n\n## 教学构造的一次冲突\n\n工具文档说明某功能仅支持特定环境，营销页却用更宽泛语言描述。报告应以具体条件解释能力，必要时引用两者并说明范围。不能为了表格整齐，把复杂条件压成简单的“支持”。\n\n若价格只有部分信息，可以列出计费维度和待核实项，避免编造总成本。对尚未测试的延迟或质量，不应给出确定排名。研究价值包括指出未知以及如何进一步验证。\n\n## 质量、成本与完成标准\n\n完成标准可以是覆盖约定问题、主要结论有证据、冲突与缺口已说明、引用可打开且支持主张。搜索次数不构成完成标准。预算与时间限制需要可见，达到限制时交付部分结果并标明范围。\n\n多 Agent 可以分工查找不同主题，但还需要统一来源标准、去重、冲突处理与最终核验。并行提高速度并不自动提高正确性，也可能放大重复与不一致。是否采用应基于任务效果和复杂度取舍。\n\n最终报告应让读者理解结论成立的条件，并能沿链接回到依据。这种可追溯研究方法，可以迁移到竞品、岗位、技术选型和市场分析。\n\n## 一张研究证据表的结构\n\n每条结论可以保存问题、主张、来源、原文位置、发布时间、核验时间、资料类型与限制。例如“支持某种权限”需要具体文档条件，不能仅凭首页标语。分析建议则标为基于这些事实的推断。\n\n检索时还应记录没有找到或无法访问的关键来源。缺失会影响结论覆盖范围，不能因为最终报告没有引用就从过程里消失。若只拿到二手材料，可以说明其性质，并尝试追溯原始资料。\n\n## 报告结构如何反映证据\n\n先给问题与结论，再说明适用条件、比较维度、依据与未知。表格便于比较，但复杂条件需要保留脚注或正文。对不同产品使用不同套餐或发布时间，应清楚标注，避免制造不公平排名。\n\n报告生成后逐项检查引用是否真的支持主张，是否存在未引用却重要的事实，以及推断是否被写成确定结论。自动检查可辅助链接与结构，内容支撑仍需要适当核验。\n\n## 完成与停止的区别\n\n任务因预算耗尽而停止，可能只完成部分研究；覆盖目标问题且限制已说明，才接近约定完成。系统应在产物中反映状态。停止并非失败全部价值，但不能把部分材料包装为全面调研。\n\n资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。\n\n### 关联阅读\n\n- [引用、可追溯性与回答约束](07-06.md)\n- [提示注入与不可信内容](15-02.md)\n\n### 资料与延伸阅读\n\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [OWASP：Prompt Injection](https://genai.owasp.org/llmrisk/llm01-prompt-injection/)\n","chars":1393,"minutes":5,"summary":"本案例构造一个研究助手：用户希望了解某类企业工具的能力与选型条件，并获得有依据的报告。任务包含范围定义、检索、阅读、证据整理、比较与写作。可靠性来自证据链，而非报告长度或引用数量。"},{"id":"17-06","title":"办公 Agent：跨工具执行与人机协作","file":"content/17-06.md","level":"工作应用","prerequisites":["17-05"],"aliases":["案例","AI SCADA","研究助手"],"module":"17","moduleTitle":"产品与项目案例库","html":"<p>本案例构造一个办公 Agent：根据会议纪要创建任务、安排日程并准备通知。它需要跨文档、任务系统、日历与消息工具协作。用户希望减少重复整理，但并不必然希望系统替自己决定所有责任人与外发内容。<\/p><h2 id=\"section-1\">拆分准备与执行<\/h2><p>准备阶段读取已授权纪要，提取事项、责任人、日期和依赖，形成结构化草案。执行阶段才创建记录、发送邀请和通知。两阶段分开，便于用户检查模型解释，也能让低风险工作自动进行。<\/p><p>原文中“下周再看”可能不是明确期限，“张经理负责”可能对应多人。模型可以给出候选与依据，关键对象和日期缺失时应澄清。不能把含糊文字直接变成确定业务动作。<\/p><h2 id=\"section-2\">建立跨工具契约<\/h2><p>每个工具记录身份、权限、输入输出、副作用、异步状态与错误。创建任务与发送通知需要唯一标识与去重；日历需要处理时区、冲突与参与人；文档需要版本与访问范围。工具名称相似，不代表语义相同。<\/p><p>系统还需维护统一任务对象，将纪要段落、草案、确认版本和实际记录关联。否则用户修改草案后，后台可能仍执行旧版本。跨工具可靠性依赖状态与身份，而不仅是连接成功。<\/p><h2 id=\"section-3\">教学构造的协作过程<\/h2><p>纪要中有三项行动。系统提取后发现一项没有负责人，一项日期与团队假期冲突，另一项涉及外部客户。界面突出这些问题，用户修正后确认。系统先创建任务，再准备通知，外发内容单独检查。<\/p><p>若任务创建成功但邀请失败，最终展示应说明部分成功，提供记录链接并只恢复失败步骤。用户接管后，Agent 停止相关动作，保留当前状态，避免双方同时操作。<\/p><h2 id=\"section-4\">权限与隐私<\/h2><p>员工能够读取纪要，不代表能把全部内容发送给外部客户。通知应仅包含必要信息，收件人与附件需要核对。资料中的指令不能扩大原授权，敏感字段也不应进入不必要工具或日志。<\/p><p>长期授权可以降低重复确认，但应有明确范围、有效期和撤回方式。关键行为变化后需要重新评估。用户应知道系统是代表自己还是服务账号执行，以及记录如何审计。<\/p><h2 id=\"section-5\">评价是否真的省工作<\/h2><p>观察从纪要到可用任务的总时间、修改负担、对象和日期错误、重复记录、通知到达及后续处理。生成三条任务草稿很快，但若每条都要重新核对，收益可能有限。引用纪要片段和差异预览可以降低核对成本。<\/p><p>也要看工作流程是否接受自动产物。若团队仍要求在另一系统重复录入，产品需要解决整合而非仅提高生成速度。价值属于完整任务。<\/p><h2 id=\"section-6\">设计选择与边界<\/h2><p>该流程多有确定步骤，可先用工作流加模型提取。开放规划只在确实需要时加入。对高风险或不可逆动作保留控制，明确失败恢复与完成证据。办公 Agent 的成熟度体现在能否持续准确协作，而非能调用多少应用。<\/p><h2 id=\"section-7\">用统一任务对象减少错位<\/h2><p>一项行动可以关联纪要段落、提取字段、用户修改、确认版本、任务系统标识、日历事件和通知标识。统一关联使系统能够解释每个动作来自哪里，也能只恢复失败部分。若各工具各自保存状态而没有关联，问题会难以追踪。<\/p><p>例如用户把截止日从周四改为周五，任务与日历都应使用确认后的日期；通知内容也应保持一致。后台重新生成时不能悄悄覆盖修改。必要时展示差异，并让用户决定如何处理冲突。<\/p><h2 id=\"section-8\">多人协作的额外条件<\/h2><p>纪要作者、任务负责人和日历参与人可能不是同一人。系统需要核对谁有权创建或修改，并明确通知代表谁发出。把“从纪要提取到名字”当作授权，会跨越责任边界。<\/p><p>若他人已经手工完成某项工作，Agent 恢复时需要识别当前状态，避免覆盖或重复。长任务的时间跨度越大，重新核对外部事实越重要。<\/p><h2 id=\"section-9\">产物与工作流整合<\/h2><p>用户应能从结果直接打开任务、日程和草稿，也能查看未完成项。可共享摘要需要过滤敏感来源。最终价值来自让团队继续工作，而不是在一个独立聊天界面中留下更多不可操作文字。<\/p><p>资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。<\/p><h3 id=\"section-10\">关联阅读<\/h3><ul><li><a href=\"#lesson/14-05\">编辑、确认、撤销与人工接管<\/a><\/li><li><a href=\"#lesson/17-04\">工具执行 Agent：重复执行与失败恢复<\/a><\/li><\/ul><h3 id=\"section-11\">资料与延伸阅读<\/h3><ul><li><a href=\"https://modelcontextprotocol.io/docs/learn/architecture\" target=\"_blank\" rel=\"noopener noreferrer\">MCP：Architecture<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Toolkit<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"拆分准备与执行","level":2},{"id":"section-2","title":"建立跨工具契约","level":2},{"id":"section-3","title":"教学构造的协作过程","level":2},{"id":"section-4","title":"权限与隐私","level":2},{"id":"section-5","title":"评价是否真的省工作","level":2},{"id":"section-6","title":"设计选择与边界","level":2},{"id":"section-7","title":"用统一任务对象减少错位","level":2},{"id":"section-8","title":"多人协作的额外条件","level":2},{"id":"section-9","title":"产物与工作流整合","level":2},{"id":"section-10","title":"关联阅读","level":3},{"id":"section-11","title":"资料与延伸阅读","level":3}],"text":"本案例构造一个办公 Agent：根据会议纪要创建任务、安排日程并准备通知。它需要跨文档、任务系统、日历与消息工具协作。用户希望减少重复整理，但并不必然希望系统替自己决定所有责任人与外发内容。\n\n## 拆分准备与执行\n\n准备阶段读取已授权纪要，提取事项、责任人、日期和依赖，形成结构化草案。执行阶段才创建记录、发送邀请和通知。两阶段分开，便于用户检查模型解释，也能让低风险工作自动进行。\n\n原文中“下周再看”可能不是明确期限，“张经理负责”可能对应多人。模型可以给出候选与依据，关键对象和日期缺失时应澄清。不能把含糊文字直接变成确定业务动作。\n\n## 建立跨工具契约\n\n每个工具记录身份、权限、输入输出、副作用、异步状态与错误。创建任务与发送通知需要唯一标识与去重；日历需要处理时区、冲突与参与人；文档需要版本与访问范围。工具名称相似，不代表语义相同。\n\n系统还需维护统一任务对象，将纪要段落、草案、确认版本和实际记录关联。否则用户修改草案后，后台可能仍执行旧版本。跨工具可靠性依赖状态与身份，而不仅是连接成功。\n\n## 教学构造的协作过程\n\n纪要中有三项行动。系统提取后发现一项没有负责人，一项日期与团队假期冲突，另一项涉及外部客户。界面突出这些问题，用户修正后确认。系统先创建任务，再准备通知，外发内容单独检查。\n\n若任务创建成功但邀请失败，最终展示应说明部分成功，提供记录链接并只恢复失败步骤。用户接管后，Agent 停止相关动作，保留当前状态，避免双方同时操作。\n\n## 权限与隐私\n\n员工能够读取纪要，不代表能把全部内容发送给外部客户。通知应仅包含必要信息，收件人与附件需要核对。资料中的指令不能扩大原授权，敏感字段也不应进入不必要工具或日志。\n\n长期授权可以降低重复确认，但应有明确范围、有效期和撤回方式。关键行为变化后需要重新评估。用户应知道系统是代表自己还是服务账号执行，以及记录如何审计。\n\n## 评价是否真的省工作\n\n观察从纪要到可用任务的总时间、修改负担、对象和日期错误、重复记录、通知到达及后续处理。生成三条任务草稿很快，但若每条都要重新核对，收益可能有限。引用纪要片段和差异预览可以降低核对成本。\n\n也要看工作流程是否接受自动产物。若团队仍要求在另一系统重复录入，产品需要解决整合而非仅提高生成速度。价值属于完整任务。\n\n## 设计选择与边界\n\n该流程多有确定步骤，可先用工作流加模型提取。开放规划只在确实需要时加入。对高风险或不可逆动作保留控制，明确失败恢复与完成证据。办公 Agent 的成熟度体现在能否持续准确协作，而非能调用多少应用。\n\n## 用统一任务对象减少错位\n\n一项行动可以关联纪要段落、提取字段、用户修改、确认版本、任务系统标识、日历事件和通知标识。统一关联使系统能够解释每个动作来自哪里，也能只恢复失败部分。若各工具各自保存状态而没有关联，问题会难以追踪。\n\n例如用户把截止日从周四改为周五，任务与日历都应使用确认后的日期；通知内容也应保持一致。后台重新生成时不能悄悄覆盖修改。必要时展示差异，并让用户决定如何处理冲突。\n\n## 多人协作的额外条件\n\n纪要作者、任务负责人和日历参与人可能不是同一人。系统需要核对谁有权创建或修改，并明确通知代表谁发出。把“从纪要提取到名字”当作授权，会跨越责任边界。\n\n若他人已经手工完成某项工作，Agent 恢复时需要识别当前状态，避免覆盖或重复。长任务的时间跨度越大，重新核对外部事实越重要。\n\n## 产物与工作流整合\n\n用户应能从结果直接打开任务、日程和草稿，也能查看未完成项。可共享摘要需要过滤敏感来源。最终价值来自让团队继续工作，而不是在一个独立聊天界面中留下更多不可操作文字。\n\n资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。\n\n### 关联阅读\n\n- [编辑、确认、撤销与人工接管](14-05.md)\n- [工具执行 Agent：重复执行与失败恢复](17-04.md)\n\n### 资料与延伸阅读\n\n- [MCP：Architecture](https://modelcontextprotocol.io/docs/learn/architecture)\n- [Microsoft：HAX Toolkit](https://www.microsoft.com/en-us/haxtoolkit/)\n","chars":1378,"minutes":5,"summary":"本案例构造一个办公 Agent：根据会议纪要创建任务、安排日程并准备通知。它需要跨文档、任务系统、日历与消息工具协作。用户希望减少重复整理，但并不必然希望系统替自己决定所有责任人与外发内容。"},{"id":"17-07","title":"AI SCADA：从工业工具到通用 Agent 的能力迁移","file":"content/17-07.md","level":"工作应用","prerequisites":["17-06"],"aliases":["案例","AI SCADA","研究助手"],"module":"17","moduleTitle":"产品与项目案例库","html":"<p>你正在负责 AI SCADA，这是连接已有工具产品经验与通用 Agent 能力的重要素材。本篇仅构造工业工具场景，帮助理解迁移方法，不假设你已经实现某项功能、取得某组指标或获得生产控制授权。<\/p><h2 id=\"section-1\">从工业界面任务看可迁移能力<\/h2><p>一个教学场景是：用户希望根据设备清单和界面规范，生成监控页面草案。任务需要理解对象、读取规范、选择组件、布局、绑定数据并检查结果。这与通用 Agent 中的目标理解、工具调用、状态、产物验证和人工确认相通。<\/p><p>产品经理可以从真实工作中提炼：如何定义复杂对象、如何组织配置、如何处理权限、如何显示错误、如何验收生成产物。行业名词不同，系统判断方法可以迁移。实际求职表达仍需以你真实承担的工作为依据。<\/p><h2 id=\"section-2\">区分设计态与运行态<\/h2><p>设计页面草案、修改配置和控制真实设备，后果显著不同。教学案例可以让 Agent 在设计环境中生成可编辑页面，并由用户预览和确认；涉及部署、运行参数或设备控制时，需要额外的专业安全、工程与组织授权，不能直接沿用草稿生成策略。<\/p><p>这种边界在通用工具中也存在：生成邮件与发送邮件、起草配置与上线配置、提出采购建议与实际付款。理解动作后果，是 Agent 产品的通用核心能力。<\/p><h2 id=\"section-3\">教学构造的页面生成流程<\/h2><p>系统先读取用户目标、设备对象与页面规范，形成组件和绑定计划；工具创建页面草案；验证器检查对象存在、字段类型、布局和绑定；用户查看预览与差异；确认后按授权保存。若发现数据点不存在，系统应说明未完成绑定，而不是生成一个看似正常的假值。<\/p><p>关键工具契约包括对象、参数、版本、副作用和返回状态。生成过程应保留可编辑产物与变更记录，便于用户修正和回退。模型可以提出布局，确定性检查负责验证规则。<\/p><h2 id=\"section-4\">失败如何诊断<\/h2><p>页面不符合要求，可能来自目标理解、组件知识、工具参数、数据绑定、几何约束或验证遗漏。产品经理应沿执行轨迹定位，而不是统一称为模型效果差。若绑定错误，单纯美化提示无法解决。<\/p><p>可以用教学构造的失败例说明：页面创建成功，但某指标绑定到错误设备。工具返回成功只证明创建动作完成，不证明业务含义正确。验收需要核对对象与用户目标，以及实际预览和绑定证据。<\/p><h2 id=\"section-5\">迁移到通用 Agent 岗位<\/h2><p>可以把工业场景经验翻译为通用能力：复杂工作流抽象、结构化产物、工具契约、约束验证、权限、人机协作和失败恢复。不要只列使用了哪些模型或框架，应解释你为何选择某种自主程度、怎样定义完成、如何权衡质量与成本。<\/p><p>同时补充通用办公、知识服务和企业流程案例，避免把能力只绑定在工业术语上。迁移并不意味着忽略行业差异，而是识别共同机制，再说明新场景增加的约束。<\/p><h2 id=\"section-6\">可展示材料的边界<\/h2><p>真实项目资料需遵守公司要求，客户数据、内部架构和未公开配置应适当处理。可以用公开或重新构造的材料解释方法，并明确标注。诚实区分实际贡献、团队成果与教学示例，比夸大自动化程度更有助于建立专业可信度。<\/p><h2 id=\"section-7\">设计态产物的验证层次<\/h2><p>可以分别检查结构、语义与呈现。结构验证确保组件、字段和引用合法；语义验证确保设备、数据点和用户目标对应；呈现验证通过预览检查布局、可读性与交互。某层通过不代表其他层已经达标。<\/p><p>例如组件树合法、页面可渲染，但单位错误或绑定到另一设备，仍不满足任务。生成工具返回成功只说明某个动作完成，产品验收需要覆盖实际业务含义。规则能确定检查的部分优先程序化，开放判断再由模型或人辅助。<\/p><h2 id=\"section-8\">版本与变更范围<\/h2><p>页面编辑应保留当前版本、变更集合和必要回退。用户要求调整某区域时，系统应限制影响范围，避免重新生成整页导致其他配置变化。差异预览可以展示新增、修改和删除，帮助用户低成本核对。<\/p><p>若源设备清单或规范变化，旧草案可能失效。恢复任务前需要重新核对依赖，尤其是绑定与权限。这个问题与通用办公 Agent 中草稿过期、对象变化本质相通。<\/p><h2 id=\"section-9\">职业迁移的表达重点<\/h2><p>可以围绕实际承担的任务说清如何建立对象模型、约束、工具和验证，并明确技术团队负责部分。行业经验提供复杂度与责任意识，通用知识帮助把它翻译成其他产品团队能够理解的系统能力。<\/p><p>资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。<\/p><h3 id=\"section-10\">关联阅读<\/h3><ul><li><a href=\"#lesson/08-02\">工具调用的完整生命周期<\/a><\/li><li><a href=\"#lesson/18-02\">个人能力迁移与差距判断<\/a><\/li><\/ul><h3 id=\"section-11\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"从工业界面任务看可迁移能力","level":2},{"id":"section-2","title":"区分设计态与运行态","level":2},{"id":"section-3","title":"教学构造的页面生成流程","level":2},{"id":"section-4","title":"失败如何诊断","level":2},{"id":"section-5","title":"迁移到通用 Agent 岗位","level":2},{"id":"section-6","title":"可展示材料的边界","level":2},{"id":"section-7","title":"设计态产物的验证层次","level":2},{"id":"section-8","title":"版本与变更范围","level":2},{"id":"section-9","title":"职业迁移的表达重点","level":2},{"id":"section-10","title":"关联阅读","level":3},{"id":"section-11","title":"资料与延伸阅读","level":3}],"text":"你正在负责 AI SCADA，这是连接已有工具产品经验与通用 Agent 能力的重要素材。本篇仅构造工业工具场景，帮助理解迁移方法，不假设你已经实现某项功能、取得某组指标或获得生产控制授权。\n\n## 从工业界面任务看可迁移能力\n\n一个教学场景是：用户希望根据设备清单和界面规范，生成监控页面草案。任务需要理解对象、读取规范、选择组件、布局、绑定数据并检查结果。这与通用 Agent 中的目标理解、工具调用、状态、产物验证和人工确认相通。\n\n产品经理可以从真实工作中提炼：如何定义复杂对象、如何组织配置、如何处理权限、如何显示错误、如何验收生成产物。行业名词不同，系统判断方法可以迁移。实际求职表达仍需以你真实承担的工作为依据。\n\n## 区分设计态与运行态\n\n设计页面草案、修改配置和控制真实设备，后果显著不同。教学案例可以让 Agent 在设计环境中生成可编辑页面，并由用户预览和确认；涉及部署、运行参数或设备控制时，需要额外的专业安全、工程与组织授权，不能直接沿用草稿生成策略。\n\n这种边界在通用工具中也存在：生成邮件与发送邮件、起草配置与上线配置、提出采购建议与实际付款。理解动作后果，是 Agent 产品的通用核心能力。\n\n## 教学构造的页面生成流程\n\n系统先读取用户目标、设备对象与页面规范，形成组件和绑定计划；工具创建页面草案；验证器检查对象存在、字段类型、布局和绑定；用户查看预览与差异；确认后按授权保存。若发现数据点不存在，系统应说明未完成绑定，而不是生成一个看似正常的假值。\n\n关键工具契约包括对象、参数、版本、副作用和返回状态。生成过程应保留可编辑产物与变更记录，便于用户修正和回退。模型可以提出布局，确定性检查负责验证规则。\n\n## 失败如何诊断\n\n页面不符合要求，可能来自目标理解、组件知识、工具参数、数据绑定、几何约束或验证遗漏。产品经理应沿执行轨迹定位，而不是统一称为模型效果差。若绑定错误，单纯美化提示无法解决。\n\n可以用教学构造的失败例说明：页面创建成功，但某指标绑定到错误设备。工具返回成功只证明创建动作完成，不证明业务含义正确。验收需要核对对象与用户目标，以及实际预览和绑定证据。\n\n## 迁移到通用 Agent 岗位\n\n可以把工业场景经验翻译为通用能力：复杂工作流抽象、结构化产物、工具契约、约束验证、权限、人机协作和失败恢复。不要只列使用了哪些模型或框架，应解释你为何选择某种自主程度、怎样定义完成、如何权衡质量与成本。\n\n同时补充通用办公、知识服务和企业流程案例，避免把能力只绑定在工业术语上。迁移并不意味着忽略行业差异，而是识别共同机制，再说明新场景增加的约束。\n\n## 可展示材料的边界\n\n真实项目资料需遵守公司要求，客户数据、内部架构和未公开配置应适当处理。可以用公开或重新构造的材料解释方法，并明确标注。诚实区分实际贡献、团队成果与教学示例，比夸大自动化程度更有助于建立专业可信度。\n\n## 设计态产物的验证层次\n\n可以分别检查结构、语义与呈现。结构验证确保组件、字段和引用合法；语义验证确保设备、数据点和用户目标对应；呈现验证通过预览检查布局、可读性与交互。某层通过不代表其他层已经达标。\n\n例如组件树合法、页面可渲染，但单位错误或绑定到另一设备，仍不满足任务。生成工具返回成功只说明某个动作完成，产品验收需要覆盖实际业务含义。规则能确定检查的部分优先程序化，开放判断再由模型或人辅助。\n\n## 版本与变更范围\n\n页面编辑应保留当前版本、变更集合和必要回退。用户要求调整某区域时，系统应限制影响范围，避免重新生成整页导致其他配置变化。差异预览可以展示新增、修改和删除，帮助用户低成本核对。\n\n若源设备清单或规范变化，旧草案可能失效。恢复任务前需要重新核对依赖，尤其是绑定与权限。这个问题与通用办公 Agent 中草稿过期、对象变化本质相通。\n\n## 职业迁移的表达重点\n\n可以围绕实际承担的任务说清如何建立对象模型、约束、工具和验证，并明确技术团队负责部分。行业经验提供复杂度与责任意识，通用知识帮助把它翻译成其他产品团队能够理解的系统能力。\n\n资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。\n\n### 关联阅读\n\n- [工具调用的完整生命周期](08-02.md)\n- [个人能力迁移与差距判断](18-02.md)\n\n### 资料与延伸阅读\n\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1501,"minutes":6,"summary":"你正在负责 AI SCADA，这是连接已有工具产品经验与通用 Agent 能力的重要素材。本篇仅构造工业工具场景，帮助理解迁移方法，不假设你已经实现某项功能、取得某组指标或获得生产控制授权。"},{"id":"17-08","title":"案例综合复盘：价值、质量、成本与边界","file":"content/17-08.md","level":"工作应用","prerequisites":["17-07"],"aliases":["案例","AI SCADA","研究助手"],"module":"17","moduleTitle":"产品与项目案例库","html":"<p>把知识助手、工具 Agent、研究助手和工业设计工具放在一起，可以看到 AI 产品的共同结构：用户任务、资料、模型、工具、控制、评估和运营。它们的具体风险与价值不同，因此不能用同一指标或自主程度评价全部产品。<\/p><h2 id=\"section-1\">比较任务完成的含义<\/h2><p>知识助手完成的是有依据的理解与回答，工具 Agent 需要外部目标状态真实改变，研究助手需要覆盖问题并建立证据链，设计工具需要产生符合规则且可编辑的产物。完成标准必须来自任务，不能统一简化为模型输出成功。<\/p><p>这也决定了验证方式。知识问答检查事实、引用与权限；执行任务检查状态、幂等与多余动作；研究检查来源与推断；页面设计检查对象、布局、绑定与预览。不同验证可以共享方法，但需要保留业务特征。<\/p><h2 id=\"section-2\">一个教学构造的综合数据表<\/h2><p>假设甲版本一百次任务成功七十次，成本一百四十元；乙版本成功八十次，成本二百元。甲的成功任务平均成本为两元，乙为两点五元。乙是否更好，要看新增成功任务的价值、延迟和风险，不能只看成功率或调用价格。<\/p><p>如果乙减少了拒答却增加严重错误，成功定义需要重新检查。如果甲让用户核对时间更长，低成本也可能没有转化为收益。所有数值都应与任务条件、样本和判断方法一起说明。<\/p><h2 id=\"section-3\">识别系统性根因<\/h2><p>多个案例中反复出现的问题包括资料不可靠、权限边界不清、状态缺失、完成标准模糊和用户无法恢复。它们不一定通过更大模型解决。复盘应分别看模型能力、系统设计、产品规则和组织流程。<\/p><p>例如重复创建任务涉及幂等；旧政策回答涉及知识版本；研究结论无依据涉及证据链；页面绑定错误涉及对象校验。准确分类能让迭代集中在真正起作用的环节。<\/p><h2 id=\"section-4\">从原型到持续服务<\/h2><p>原型可以证明某条理想路径有潜力，持续服务需要面对输入变化、并发、供应商变化、资料更新和支持。正式产品还需要监控、预算、治理与交付。演示速度与规模化成熟度之间，应保留明确区分。<\/p><p>同样，复杂度不天然代表先进。可预定义流程先用工作流，单次调用足够时无需多 Agent。增加规划、并行或记忆，应说明改善什么，并用任务证据检验代价。<\/p><h2 id=\"section-5\">形成可解释的决策记录<\/h2><p>一份有用复盘可以说明任务背景、关键选择、替代方案、证据、失败、改进与残余限制。它帮助团队持续学习，也能成为职业表达材料。实际结果、估算和教学构造需要清楚标注，避免把方法分析写成真实业绩。<\/p><p>复盘还应关注用户负担是否转移。系统替用户生成内容后，可能增加核对、纠错与协调；组织收益需要看上下游。把价值、质量、成本、延迟与风险联在一起，才能形成更成熟的产品判断。<\/p><h2 id=\"section-6\">案例库如何持续扩展<\/h2><p>新增案例应接入已有原理与方法，解释它带来了什么新条件，而不是只增加产品名称。可以按任务、工具、失败类型和决策主题索引，方便遇到工作问题时查阅。案例库的长期价值在于帮助识别可迁移机制及其边界。<\/p><h2 id=\"section-7\">综合复盘的记录结构<\/h2><p>一份复盘可按任务、价值假设、系统方案、关键决策、证据、失败、改进与剩余限制组织。关键是把决定与依据连接：为何采用该资料范围，为什么保留确认，为什么不用更复杂编排。这样后来换模型或扩展场景时，能知道哪些理由仍成立。<\/p><p>结果需要区分用户行为、系统质量与商业收益。某版本的任务成功增加，不代表留存一定改善；成本下降也不代表总体 ROI 上升。不同层通过机制假设相连，需要观察，而不是自动推导。<\/p><h2 id=\"section-8\">跨案例的共用检查<\/h2><p>可以沿“输入是否可用—证据是否可靠—动作是否授权—状态是否真实—结果是否满足目标—用户能否恢复”逐段分析。这条路径适用于多种工具产品，但每段具体标准仍由业务决定。<\/p><p>当出现新型 Agent，可以用同一路径理解它改变哪部分，以及新增哪些依赖。框架有助于学习和比较，却不能替代具体测试。保持共性与差异同时可见，能够防止把一个成功案例简单复制到所有场景。<\/p><h2 id=\"section-9\">持续更新案例结论<\/h2><p>资料、工具和用户流程变化后，原案例可能需要修订。保留版本与适用条件，把失效部分标出来，而不是悄悄删除历史判断。案例库因此既能解释当前方法，也能展示取舍如何随证据变化。<\/p><p>资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。<\/p><h3 id=\"section-10\">关联阅读<\/h3><ul><li><a href=\"#lesson/11-01\">从业务目标到 AI 质量指标<\/a><\/li><li><a href=\"#lesson/16-03\">单位经济性与成本结构<\/a><\/li><\/ul><h3 id=\"section-11\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"比较任务完成的含义","level":2},{"id":"section-2","title":"一个教学构造的综合数据表","level":2},{"id":"section-3","title":"识别系统性根因","level":2},{"id":"section-4","title":"从原型到持续服务","level":2},{"id":"section-5","title":"形成可解释的决策记录","level":2},{"id":"section-6","title":"案例库如何持续扩展","level":2},{"id":"section-7","title":"综合复盘的记录结构","level":2},{"id":"section-8","title":"跨案例的共用检查","level":2},{"id":"section-9","title":"持续更新案例结论","level":2},{"id":"section-10","title":"关联阅读","level":3},{"id":"section-11","title":"资料与延伸阅读","level":3}],"text":"把知识助手、工具 Agent、研究助手和工业设计工具放在一起，可以看到 AI 产品的共同结构：用户任务、资料、模型、工具、控制、评估和运营。它们的具体风险与价值不同，因此不能用同一指标或自主程度评价全部产品。\n\n## 比较任务完成的含义\n\n知识助手完成的是有依据的理解与回答，工具 Agent 需要外部目标状态真实改变，研究助手需要覆盖问题并建立证据链，设计工具需要产生符合规则且可编辑的产物。完成标准必须来自任务，不能统一简化为模型输出成功。\n\n这也决定了验证方式。知识问答检查事实、引用与权限；执行任务检查状态、幂等与多余动作；研究检查来源与推断；页面设计检查对象、布局、绑定与预览。不同验证可以共享方法，但需要保留业务特征。\n\n## 一个教学构造的综合数据表\n\n假设甲版本一百次任务成功七十次，成本一百四十元；乙版本成功八十次，成本二百元。甲的成功任务平均成本为两元，乙为两点五元。乙是否更好，要看新增成功任务的价值、延迟和风险，不能只看成功率或调用价格。\n\n如果乙减少了拒答却增加严重错误，成功定义需要重新检查。如果甲让用户核对时间更长，低成本也可能没有转化为收益。所有数值都应与任务条件、样本和判断方法一起说明。\n\n## 识别系统性根因\n\n多个案例中反复出现的问题包括资料不可靠、权限边界不清、状态缺失、完成标准模糊和用户无法恢复。它们不一定通过更大模型解决。复盘应分别看模型能力、系统设计、产品规则和组织流程。\n\n例如重复创建任务涉及幂等；旧政策回答涉及知识版本；研究结论无依据涉及证据链；页面绑定错误涉及对象校验。准确分类能让迭代集中在真正起作用的环节。\n\n## 从原型到持续服务\n\n原型可以证明某条理想路径有潜力，持续服务需要面对输入变化、并发、供应商变化、资料更新和支持。正式产品还需要监控、预算、治理与交付。演示速度与规模化成熟度之间，应保留明确区分。\n\n同样，复杂度不天然代表先进。可预定义流程先用工作流，单次调用足够时无需多 Agent。增加规划、并行或记忆，应说明改善什么，并用任务证据检验代价。\n\n## 形成可解释的决策记录\n\n一份有用复盘可以说明任务背景、关键选择、替代方案、证据、失败、改进与残余限制。它帮助团队持续学习，也能成为职业表达材料。实际结果、估算和教学构造需要清楚标注，避免把方法分析写成真实业绩。\n\n复盘还应关注用户负担是否转移。系统替用户生成内容后，可能增加核对、纠错与协调；组织收益需要看上下游。把价值、质量、成本、延迟与风险联在一起，才能形成更成熟的产品判断。\n\n## 案例库如何持续扩展\n\n新增案例应接入已有原理与方法，解释它带来了什么新条件，而不是只增加产品名称。可以按任务、工具、失败类型和决策主题索引，方便遇到工作问题时查阅。案例库的长期价值在于帮助识别可迁移机制及其边界。\n\n## 综合复盘的记录结构\n\n一份复盘可按任务、价值假设、系统方案、关键决策、证据、失败、改进与剩余限制组织。关键是把决定与依据连接：为何采用该资料范围，为什么保留确认，为什么不用更复杂编排。这样后来换模型或扩展场景时，能知道哪些理由仍成立。\n\n结果需要区分用户行为、系统质量与商业收益。某版本的任务成功增加，不代表留存一定改善；成本下降也不代表总体 ROI 上升。不同层通过机制假设相连，需要观察，而不是自动推导。\n\n## 跨案例的共用检查\n\n可以沿“输入是否可用—证据是否可靠—动作是否授权—状态是否真实—结果是否满足目标—用户能否恢复”逐段分析。这条路径适用于多种工具产品，但每段具体标准仍由业务决定。\n\n当出现新型 Agent，可以用同一路径理解它改变哪部分，以及新增哪些依赖。框架有助于学习和比较，却不能替代具体测试。保持共性与差异同时可见，能够防止把一个成功案例简单复制到所有场景。\n\n## 持续更新案例结论\n\n资料、工具和用户流程变化后，原案例可能需要修订。保留版本与适用条件，把失效部分标出来，而不是悄悄删除历史判断。案例库因此既能解释当前方法，也能展示取舍如何随证据变化。\n\n资料核验日期：2026-11-14。全部案例、系统方案与数值为教学构造，未宣称真实上线效果，也未实际部署本文系统。\n\n### 关联阅读\n\n- [从业务目标到 AI 质量指标](11-01.md)\n- [单位经济性与成本结构](16-03.md)\n\n### 资料与延伸阅读\n\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1473,"minutes":6,"summary":"把知识助手、工具 Agent、研究助手和工业设计工具放在一起，可以看到 AI 产品的共同结构：用户任务、资料、模型、工具、控制、评估和运营。它们的具体风险与价值不同，因此不能用同一指标或自主程度评价全部产品。"},{"id":"18-01","title":"AI 产品岗位分型与能力要求","file":"content/18-01.md","level":"工作应用","prerequisites":[],"aliases":["岗位","职业","作品集","面试"],"module":"18","moduleTitle":"岗位能力与职业发展","html":"<p>“AI 产品经理”不是要求完全相同的一种岗位。用户应用、企业工具、Agent 平台、开发者产品、模型与基础设施、安全治理，都可能使用类似名称。判断机会时需要读取真实职责、服务对象、技术门槛和结果责任。<\/p><h2 id=\"section-1\">按产品对象理解岗位差异<\/h2><p>应用型岗位更关注用户任务、体验、采用和业务结果；平台型岗位需要理解连接、权限、配置与可复用能力；开发者产品关注 API、SDK、调试、文档与工作流；模型或推理平台则可能要求更深入技术、成本和系统理解。安全、行业或研究方向还会增加专业条件。<\/p><p>这些类别可以重叠。一个企业 Agent 岗位可能同时负责用户体验、工具平台与交付。岗位名称只能作为检索入口，真正需要比较的是每天做什么、与谁协作、对什么结果负责。<\/p><h2 id=\"section-2\">本项目招聘样本说明了什么<\/h2><p>本项目核验了三十个目的性样本，中文样本集中于腾讯，国际样本偏模型与工具企业。样本支持识别能力类型，不代表全市场比例、薪资或录用概率。岗位在核验时可获取，也不保证未来仍开放。<\/p><p>例如腾讯高级 AI 产品岗位连接 RAG、Agent、评测以及质量、成本和延迟取舍；LangSmith 岗位关注可观察性、评估与复杂 Agent 调试；Perplexity 平台岗位涉及 API、数据流与故障模式。它们共同提示技术判断与产品方法需要结合，具体深度仍不同。<\/p><h2 id=\"section-3\">区分必需、优先与特有条件<\/h2><p>相关学历、代码能力、行业经验、语言和地区条件可能是明确门槛，也可能只是加分项。不能把某一岗位的要求推广为所有 AI 产品经理标准。投递前逐项核对原文，并区分自己已有证据、可迁移经验与尚需补充部分。<\/p><p>某岗位允许使用 AI 辅助原型，不意味着完全不需要理解技术；某岗位要求研究背景，也不意味着应用产品全部要求同等条件。理解行为、验证结果和说明取舍，是跨岗位有价值的基础。<\/p><h2 id=\"section-4\">结合你的发展方向<\/h2><p>你拥有八年互联网产品经历，目前负责工具类 Agent 产品，主攻通用 AI／Agent。初步可以重点理解企业效率工具、知识工作助手和通用任务应用，再根据技术兴趣深入平台方向。具体适配还需看实际项目贡献、用户复杂度和结果证据。<\/p><p>任职年限不自动等于 AI 资深度，也不意味着需要从初级产品重新开始。已有用户研究、抽象、优先级和交付经验可能迁移，新增知识帮助你解释模型与系统的取舍。二者需要在真实任务中结合。<\/p><h2 id=\"section-5\">岗位研究如何持续维护<\/h2><p>保留岗位链接、核验日期、职责、门槛、加分项与能力域映射。定期对照新岗位，识别稳定能力与短期工具热词。知识库中的职业内容用于帮助判断，不应形成统一评分或就业承诺。最终选择应结合你的兴趣、经验与真实机会。<\/p><h2 id=\"section-6\">阅读岗位原文的方法<\/h2><p>先看服务对象与产品，再看日常职责和成功结果，最后看门槛与优先条件。将“熟悉某框架”放回它服务的能力，例如调试、评估、工具编排或交付。这样即使工具名称变化，也能识别稳定要求。<\/p><p>岗位中的模糊词需要进一步核实。“技术型”可能指能阅读接口与原型，也可能要求深入系统设计；“负责 AI 战略”可能包含商业与组织工作，未必是模型研发。面试沟通可以确认团队分工、产品阶段和你将直接承担的决定。<\/p><h2 id=\"section-7\">对齐机会而非追逐所有条件<\/h2><p>可以按核心匹配、可迁移和明显不匹配整理机会。核心匹配需要真实证据，可迁移部分需要解释机制，明确硬门槛则应尊重。不是每项加分条件都要先满足，也不应忽略岗位明示的学历、地区或专业要求。<\/p><p>知识库覆盖广，是为了提供完整理解与后续扩展；职业选择仍可以聚焦。通用 Agent 应用与企业效率工具能够连接你现有工作，平台和模型方向则可以按兴趣与实际机会继续深入。岗位资料会变化，投递前重新读取原文。<\/p><p>资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/18-02\">个人能力迁移与差距判断<\/a><\/li><li><a href=\"#lesson/13-04\">AI 产品策略、定位与竞争分析<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://careers.tencent.com/jobdesc.html?postId=2110569968142827520\" target=\"_blank\" rel=\"noopener noreferrer\">腾讯：高级 AI 产品经理岗位<\/a><\/li><li><a href=\"https://jobs.ashbyhq.com/langchain/27af5f96-b287-4bcc-8679-f96686dc7c8d\" target=\"_blank\" rel=\"noopener noreferrer\">LangChain：Product Manager, LangSmith<\/a><\/li><li><a href=\"https://jobs.ashbyhq.com/Perplexity/a8c79425-eb48-40e0-8557-93460fa67097\" target=\"_blank\" rel=\"noopener noreferrer\">Perplexity：Product Manager, Platform<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"按产品对象理解岗位差异","level":2},{"id":"section-2","title":"本项目招聘样本说明了什么","level":2},{"id":"section-3","title":"区分必需、优先与特有条件","level":2},{"id":"section-4","title":"结合你的发展方向","level":2},{"id":"section-5","title":"岗位研究如何持续维护","level":2},{"id":"section-6","title":"阅读岗位原文的方法","level":2},{"id":"section-7","title":"对齐机会而非追逐所有条件","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"“AI 产品经理”不是要求完全相同的一种岗位。用户应用、企业工具、Agent 平台、开发者产品、模型与基础设施、安全治理，都可能使用类似名称。判断机会时需要读取真实职责、服务对象、技术门槛和结果责任。\n\n## 按产品对象理解岗位差异\n\n应用型岗位更关注用户任务、体验、采用和业务结果；平台型岗位需要理解连接、权限、配置与可复用能力；开发者产品关注 API、SDK、调试、文档与工作流；模型或推理平台则可能要求更深入技术、成本和系统理解。安全、行业或研究方向还会增加专业条件。\n\n这些类别可以重叠。一个企业 Agent 岗位可能同时负责用户体验、工具平台与交付。岗位名称只能作为检索入口，真正需要比较的是每天做什么、与谁协作、对什么结果负责。\n\n## 本项目招聘样本说明了什么\n\n本项目核验了三十个目的性样本，中文样本集中于腾讯，国际样本偏模型与工具企业。样本支持识别能力类型，不代表全市场比例、薪资或录用概率。岗位在核验时可获取，也不保证未来仍开放。\n\n例如腾讯高级 AI 产品岗位连接 RAG、Agent、评测以及质量、成本和延迟取舍；LangSmith 岗位关注可观察性、评估与复杂 Agent 调试；Perplexity 平台岗位涉及 API、数据流与故障模式。它们共同提示技术判断与产品方法需要结合，具体深度仍不同。\n\n## 区分必需、优先与特有条件\n\n相关学历、代码能力、行业经验、语言和地区条件可能是明确门槛，也可能只是加分项。不能把某一岗位的要求推广为所有 AI 产品经理标准。投递前逐项核对原文，并区分自己已有证据、可迁移经验与尚需补充部分。\n\n某岗位允许使用 AI 辅助原型，不意味着完全不需要理解技术；某岗位要求研究背景，也不意味着应用产品全部要求同等条件。理解行为、验证结果和说明取舍，是跨岗位有价值的基础。\n\n## 结合你的发展方向\n\n你拥有八年互联网产品经历，目前负责工具类 Agent 产品，主攻通用 AI／Agent。初步可以重点理解企业效率工具、知识工作助手和通用任务应用，再根据技术兴趣深入平台方向。具体适配还需看实际项目贡献、用户复杂度和结果证据。\n\n任职年限不自动等于 AI 资深度，也不意味着需要从初级产品重新开始。已有用户研究、抽象、优先级和交付经验可能迁移，新增知识帮助你解释模型与系统的取舍。二者需要在真实任务中结合。\n\n## 岗位研究如何持续维护\n\n保留岗位链接、核验日期、职责、门槛、加分项与能力域映射。定期对照新岗位，识别稳定能力与短期工具热词。知识库中的职业内容用于帮助判断，不应形成统一评分或就业承诺。最终选择应结合你的兴趣、经验与真实机会。\n\n## 阅读岗位原文的方法\n\n先看服务对象与产品，再看日常职责和成功结果，最后看门槛与优先条件。将“熟悉某框架”放回它服务的能力，例如调试、评估、工具编排或交付。这样即使工具名称变化，也能识别稳定要求。\n\n岗位中的模糊词需要进一步核实。“技术型”可能指能阅读接口与原型，也可能要求深入系统设计；“负责 AI 战略”可能包含商业与组织工作，未必是模型研发。面试沟通可以确认团队分工、产品阶段和你将直接承担的决定。\n\n## 对齐机会而非追逐所有条件\n\n可以按核心匹配、可迁移和明显不匹配整理机会。核心匹配需要真实证据，可迁移部分需要解释机制，明确硬门槛则应尊重。不是每项加分条件都要先满足，也不应忽略岗位明示的学历、地区或专业要求。\n\n知识库覆盖广，是为了提供完整理解与后续扩展；职业选择仍可以聚焦。通用 Agent 应用与企业效率工具能够连接你现有工作，平台和模型方向则可以按兴趣与实际机会继续深入。岗位资料会变化，投递前重新读取原文。\n\n资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。\n\n### 关联阅读\n\n- [个人能力迁移与差距判断](18-02.md)\n- [AI 产品策略、定位与竞争分析](13-04.md)\n\n### 资料与延伸阅读\n\n- [腾讯：高级 AI 产品经理岗位](https://careers.tencent.com/jobdesc.html?postId=2110569968142827520)\n- [LangChain：Product Manager, LangSmith](https://jobs.ashbyhq.com/langchain/27af5f96-b287-4bcc-8679-f96686dc7c8d)\n- [Perplexity：Product Manager, Platform](https://jobs.ashbyhq.com/Perplexity/a8c79425-eb48-40e0-8557-93460fa67097)\n","chars":1314,"minutes":5,"summary":"“AI 产品经理”不是要求完全相同的一种岗位。用户应用、企业工具、Agent 平台、开发者产品、模型与基础设施、安全治理，都可能使用类似名称。判断机会时需要读取真实职责、服务对象、技术门槛和结果责任。"},{"id":"18-02","title":"个人能力迁移与差距判断","file":"content/18-02.md","level":"工作应用","prerequisites":["18-01"],"aliases":["岗位","职业","作品集","面试"],"module":"18","moduleTitle":"岗位能力与职业发展","html":"<p>个人能力分析需要区分事实、推断与未知。你已明确有八年互联网产品经验，正在负责 AI SCADA，没有技术背景且自述 AI 理解不深入。这足以提出补充方向，却不足以给你的具体能力打分或认定某项已经达标。<\/p><h2 id=\"section-1\">把已有经验翻译为能力<\/h2><p>传统产品经验可能包含需求发现、任务抽象、流程设计、优先级、研发协作与交付。工具产品还可能涉及复杂对象、配置、权限和专业用户。要判断这些是否构成强项，需要真实项目中的决策与结果，而非只看年限和职称。<\/p><p>可以把每段经历拆成用户问题、你承担的责任、关键选择、合作方式、验证与结果。这样既能识别可迁移能力，也能发现哪些工作主要由他人完成。清楚的贡献边界有助于形成可信表达。<\/p><h2 id=\"section-2\">AI 新增的能力连接点<\/h2><p>需求需要包含模型边界、数据与异常；技术沟通需要理解 API、JSON、状态与日志；方案设计需要比较 Prompt、RAG、微调、工作流和 Agent；验收需要任务评估与失败分类；运营需要质量、成本、采用与安全共同观察。<\/p><p>这些内容并不是与产品基本功分离的第二套工作。它们改变了产品方法的具体使用条件。学习基础原理的价值，是让你能解释为何采用某种设计，而非只能转述技术团队结论。<\/p><h2 id=\"section-3\">教学构造的迁移示例<\/h2><p>如果你真实负责过页面配置工具，可以说明如何定义对象、规则与验收，再连接到 Agent 的工具契约和约束验证。若你没有负责底层模型，就不应把模型训练写成个人成果。可以清楚说明你如何与技术团队共同决定能力边界。<\/p><p>AI SCADA 的工业背景既是差异化素材，也可能使面试者难以理解。先用通用语言说明任务、工作流、权限与失败恢复，再解释行业特有约束，能够帮助对方看到可迁移部分。<\/p><h2 id=\"section-4\">知识缺口与证据缺口不同<\/h2><p>知识缺口是尚未理解某种机制，可以通过正文和资料补充；证据缺口是还没有材料证明能把知识用于工作。阅读本身能够改善理解，但不能自动证明实际交付能力。知识库提供方法与案例，由你自主决定如何在工作中应用。<\/p><p>还要识别岗位特有缺口。例如开发者平台要求更深入接口和工程体验，行业产品要求领域理解。无需为了“全能”同时追逐所有方向，可先形成通用判断，再按机会深化。<\/p><h2 id=\"section-5\">用能力地图保持连续学习<\/h2><p>每个能力记录已有事实、当前理解、相关项目和待深入问题。无需强制分数或固定期限。随着工作与知识变化更新地图，便能看到哪些问题已经能解释，哪些仍依赖他人。成熟的自我认识既包括优势，也包括清楚的边界和继续学习的方法。<\/p><h2 id=\"section-6\">一张不打分的能力记录<\/h2><p>可以为每项能力写四栏：已知事实、可支持的项目材料、当前未知和相关知识。比如技术沟通的事实是无技术背景，是否已有接口协作经验仍未知；不能因此直接判断能力弱。记录能够帮助你发现需要补知识还是需要整理经验。<\/p><p>同一经历也可能支持多项能力，但避免重复夸大。一份真实的失败复盘可以体现系统理解、跨团队协作和结果责任，关键是说明你实际做了什么。能力地图应服务清楚认识，而不是追求每格都填满。<\/p><h2 id=\"section-7\">保留发展弹性<\/h2><p>随着学习，你可能发现更喜欢交互、平台、评估或商业方向。系统知识提供共同底座，深化方向可以调整。没有固定求职期限意味着可以围绕理解与工作问题推进，不必为了完成日程快速掠过基础。<\/p><p>同时，也不必等待所有知识完备才观察岗位。持续读取真实职责，能够让你识别学习内容怎样连接机会。职业发展是一组持续判断，知识库负责提供可查阅的基础与方法，实际选择仍由你掌握。<\/p><p>资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/17-07\">AI SCADA：从工业工具到通用 Agent 的能力迁移<\/a><\/li><li><a href=\"#lesson/18-05\">作品集：用证据讲清 AI 项目<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://careers.tencent.com/jobdesc.html?postId=2110569968142827520\" target=\"_blank\" rel=\"noopener noreferrer\">腾讯：高级 AI 产品经理岗位<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Toolkit<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"把已有经验翻译为能力","level":2},{"id":"section-2","title":"AI 新增的能力连接点","level":2},{"id":"section-3","title":"教学构造的迁移示例","level":2},{"id":"section-4","title":"知识缺口与证据缺口不同","level":2},{"id":"section-5","title":"用能力地图保持连续学习","level":2},{"id":"section-6","title":"一张不打分的能力记录","level":2},{"id":"section-7","title":"保留发展弹性","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"个人能力分析需要区分事实、推断与未知。你已明确有八年互联网产品经验，正在负责 AI SCADA，没有技术背景且自述 AI 理解不深入。这足以提出补充方向，却不足以给你的具体能力打分或认定某项已经达标。\n\n## 把已有经验翻译为能力\n\n传统产品经验可能包含需求发现、任务抽象、流程设计、优先级、研发协作与交付。工具产品还可能涉及复杂对象、配置、权限和专业用户。要判断这些是否构成强项，需要真实项目中的决策与结果，而非只看年限和职称。\n\n可以把每段经历拆成用户问题、你承担的责任、关键选择、合作方式、验证与结果。这样既能识别可迁移能力，也能发现哪些工作主要由他人完成。清楚的贡献边界有助于形成可信表达。\n\n## AI 新增的能力连接点\n\n需求需要包含模型边界、数据与异常；技术沟通需要理解 API、JSON、状态与日志；方案设计需要比较 Prompt、RAG、微调、工作流和 Agent；验收需要任务评估与失败分类；运营需要质量、成本、采用与安全共同观察。\n\n这些内容并不是与产品基本功分离的第二套工作。它们改变了产品方法的具体使用条件。学习基础原理的价值，是让你能解释为何采用某种设计，而非只能转述技术团队结论。\n\n## 教学构造的迁移示例\n\n如果你真实负责过页面配置工具，可以说明如何定义对象、规则与验收，再连接到 Agent 的工具契约和约束验证。若你没有负责底层模型，就不应把模型训练写成个人成果。可以清楚说明你如何与技术团队共同决定能力边界。\n\nAI SCADA 的工业背景既是差异化素材，也可能使面试者难以理解。先用通用语言说明任务、工作流、权限与失败恢复，再解释行业特有约束，能够帮助对方看到可迁移部分。\n\n## 知识缺口与证据缺口不同\n\n知识缺口是尚未理解某种机制，可以通过正文和资料补充；证据缺口是还没有材料证明能把知识用于工作。阅读本身能够改善理解，但不能自动证明实际交付能力。知识库提供方法与案例，由你自主决定如何在工作中应用。\n\n还要识别岗位特有缺口。例如开发者平台要求更深入接口和工程体验，行业产品要求领域理解。无需为了“全能”同时追逐所有方向，可先形成通用判断，再按机会深化。\n\n## 用能力地图保持连续学习\n\n每个能力记录已有事实、当前理解、相关项目和待深入问题。无需强制分数或固定期限。随着工作与知识变化更新地图，便能看到哪些问题已经能解释，哪些仍依赖他人。成熟的自我认识既包括优势，也包括清楚的边界和继续学习的方法。\n\n## 一张不打分的能力记录\n\n可以为每项能力写四栏：已知事实、可支持的项目材料、当前未知和相关知识。比如技术沟通的事实是无技术背景，是否已有接口协作经验仍未知；不能因此直接判断能力弱。记录能够帮助你发现需要补知识还是需要整理经验。\n\n同一经历也可能支持多项能力，但避免重复夸大。一份真实的失败复盘可以体现系统理解、跨团队协作和结果责任，关键是说明你实际做了什么。能力地图应服务清楚认识，而不是追求每格都填满。\n\n## 保留发展弹性\n\n随着学习，你可能发现更喜欢交互、平台、评估或商业方向。系统知识提供共同底座，深化方向可以调整。没有固定求职期限意味着可以围绕理解与工作问题推进，不必为了完成日程快速掠过基础。\n\n同时，也不必等待所有知识完备才观察岗位。持续读取真实职责，能够让你识别学习内容怎样连接机会。职业发展是一组持续判断，知识库负责提供可查阅的基础与方法，实际选择仍由你掌握。\n\n资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。\n\n### 关联阅读\n\n- [AI SCADA：从工业工具到通用 Agent 的能力迁移](17-07.md)\n- [作品集：用证据讲清 AI 项目](18-05.md)\n\n### 资料与延伸阅读\n\n- [腾讯：高级 AI 产品经理岗位](https://careers.tencent.com/jobdesc.html?postId=2110569968142827520)\n- [Microsoft：HAX Toolkit](https://www.microsoft.com/en-us/haxtoolkit/)\n","chars":1285,"minutes":5,"summary":"个人能力分析需要区分事实、推断与未知。你已明确有八年互联网产品经验，正在负责 AI SCADA，没有技术背景且自述 AI 理解不深入。这足以提出补充方向，却不足以给你的具体能力打分或认定某项已经达标。"},{"id":"18-03","title":"产品、算法、工程与业务协作","file":"content/18-03.md","level":"工作应用","prerequisites":["18-02"],"aliases":["岗位","职业","作品集","面试"],"module":"18","moduleTitle":"岗位能力与职业发展","html":"<p>AI 产品跨越业务、模型、数据、工程、设计和运营。协作效率取决于团队是否围绕同一任务、证据和责任讨论。笼统地要求“算法提高准确率”或“研发实现智能化”，通常难以形成可执行工作。<\/p><h2 id=\"section-1\">建立共同任务对象<\/h2><p>代表任务、数据流、执行轨迹和质量标准可以成为共同语言。业务解释任务价值与错误后果，产品定义用户行为与范围，模型团队分析能力与数据，工程保障工具和运行，设计处理人机协作，运营反馈真实问题。<\/p><p>职责可以重叠，但关键决策需要承担者。例如谁确认正确答案、谁批准权限、谁决定上线、谁处理事件。模糊责任会让问题在团队之间流转，也会使产品承诺超出实际能力。<\/p><h2 id=\"section-2\">把问题拆到可定位层<\/h2><p>一个错误回答可能来自资料、检索、上下文、模型、规则或展示；一个执行失败可能来自参数、权限、业务状态或网络。协作时先还原输入与事件，再讨论根因。自然语言症状不等于技术原因。<\/p><p>产品经理不必独自诊断全部实现，但需要能够提供用户目标、复现条件、预期、实际结果与影响。工程与模型团队补充证据，共同确定下一步。这样的描述比“效果不好”更节省时间。<\/p><h2 id=\"section-3\">教学构造的一次质量讨论<\/h2><p>知识助手回答旧政策，业务认为模型不可靠。团队查看资料与检索后发现新通知没有进入索引。修复重点是数据同步与版本，而不是调模型。产品还需改善来源日期展示和资料更新状态，让用户知道适用范围。<\/p><p>若正确片段已经进入上下文，模型却遗漏关键条件，则需要检查生成约束、展示与评估。相同用户反馈，技术路径可能不同。共同证据能减少凭团队边界归责。<\/p><h2 id=\"section-4\">协作中的取舍与冲突<\/h2><p>业务希望更多自动化，安全希望减少权限，工程担心复杂度，用户希望少确认。产品经理需要把冲突放回任务后果与证据：哪些准备可以自动、哪些动作需要确认、哪些范围暂时不支持。不能只靠折中增加一堆开关。<\/p><p>质量、延迟和成本也常冲突。可以围绕代表任务比较方案，让各方看到代价。决策记录说明选择、依据、剩余限制与复审条件，避免以后重复争论。<\/p><h2 id=\"section-5\">持续运行需要组织闭环<\/h2><p>模型、数据和工具都会变化，团队要有发布、监控、反馈、事件和回滚路径。运营问题进入产品，产品变化进入评估，技术限制进入用户说明。协作不只发生在开发阶段。<\/p><p>资深产品经理的价值之一，是让不同专业围绕用户结果形成清楚决定。技术知识帮助你问对问题，产品经验帮助你组织选择，诚实的边界帮助团队保持信任。<\/p><h2 id=\"section-6\">协作会议的有效产物<\/h2><p>会议可以结束于明确问题、已有证据、决定、负责人和下一步核验。若结论只是“继续优化”，很难跟踪进展。对于暂时无法决定的事项，记录缺少什么信息及由谁补充，比强行形成一致意见更有用。<\/p><p>共同术语也需要维护。成功、准确、完成和上线等词，团队成员可能理解不同。用具体任务与状态解释，可以减少隐性分歧。产品经理在此承担连接业务语言和系统行为的作用。<\/p><h2 id=\"section-7\">避免协作中的两种偏差<\/h2><p>一种是完全依赖技术团队判断用户价值，另一种是忽视工程限制直接承诺。前者丢失产品责任，后者增加交付风险。有效协作需要产品理解技术后果，工程理解用户任务，双方共同讨论可行替代方案。<\/p><p>对高后果领域，专业人员的判断不可被模型或产品意见替代。可以通过明确角色和升级路径，让决策在适当专业范围内完成。清楚分工并不降低产品价值，反而提高交付可信度。<\/p><p>资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/13-06\">范围、优先级与研发协作<\/a><\/li><li><a href=\"#lesson/12-02\">Trace、日志与可观测性<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Toolkit<\/a><\/li><li><a href=\"https://developers.google.com/machine-learning/guides/rules-of-ml\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Rules of Machine Learning<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"建立共同任务对象","level":2},{"id":"section-2","title":"把问题拆到可定位层","level":2},{"id":"section-3","title":"教学构造的一次质量讨论","level":2},{"id":"section-4","title":"协作中的取舍与冲突","level":2},{"id":"section-5","title":"持续运行需要组织闭环","level":2},{"id":"section-6","title":"协作会议的有效产物","level":2},{"id":"section-7","title":"避免协作中的两种偏差","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 产品跨越业务、模型、数据、工程、设计和运营。协作效率取决于团队是否围绕同一任务、证据和责任讨论。笼统地要求“算法提高准确率”或“研发实现智能化”，通常难以形成可执行工作。\n\n## 建立共同任务对象\n\n代表任务、数据流、执行轨迹和质量标准可以成为共同语言。业务解释任务价值与错误后果，产品定义用户行为与范围，模型团队分析能力与数据，工程保障工具和运行，设计处理人机协作，运营反馈真实问题。\n\n职责可以重叠，但关键决策需要承担者。例如谁确认正确答案、谁批准权限、谁决定上线、谁处理事件。模糊责任会让问题在团队之间流转，也会使产品承诺超出实际能力。\n\n## 把问题拆到可定位层\n\n一个错误回答可能来自资料、检索、上下文、模型、规则或展示；一个执行失败可能来自参数、权限、业务状态或网络。协作时先还原输入与事件，再讨论根因。自然语言症状不等于技术原因。\n\n产品经理不必独自诊断全部实现，但需要能够提供用户目标、复现条件、预期、实际结果与影响。工程与模型团队补充证据，共同确定下一步。这样的描述比“效果不好”更节省时间。\n\n## 教学构造的一次质量讨论\n\n知识助手回答旧政策，业务认为模型不可靠。团队查看资料与检索后发现新通知没有进入索引。修复重点是数据同步与版本，而不是调模型。产品还需改善来源日期展示和资料更新状态，让用户知道适用范围。\n\n若正确片段已经进入上下文，模型却遗漏关键条件，则需要检查生成约束、展示与评估。相同用户反馈，技术路径可能不同。共同证据能减少凭团队边界归责。\n\n## 协作中的取舍与冲突\n\n业务希望更多自动化，安全希望减少权限，工程担心复杂度，用户希望少确认。产品经理需要把冲突放回任务后果与证据：哪些准备可以自动、哪些动作需要确认、哪些范围暂时不支持。不能只靠折中增加一堆开关。\n\n质量、延迟和成本也常冲突。可以围绕代表任务比较方案，让各方看到代价。决策记录说明选择、依据、剩余限制与复审条件，避免以后重复争论。\n\n## 持续运行需要组织闭环\n\n模型、数据和工具都会变化，团队要有发布、监控、反馈、事件和回滚路径。运营问题进入产品，产品变化进入评估，技术限制进入用户说明。协作不只发生在开发阶段。\n\n资深产品经理的价值之一，是让不同专业围绕用户结果形成清楚决定。技术知识帮助你问对问题，产品经验帮助你组织选择，诚实的边界帮助团队保持信任。\n\n## 协作会议的有效产物\n\n会议可以结束于明确问题、已有证据、决定、负责人和下一步核验。若结论只是“继续优化”，很难跟踪进展。对于暂时无法决定的事项，记录缺少什么信息及由谁补充，比强行形成一致意见更有用。\n\n共同术语也需要维护。成功、准确、完成和上线等词，团队成员可能理解不同。用具体任务与状态解释，可以减少隐性分歧。产品经理在此承担连接业务语言和系统行为的作用。\n\n## 避免协作中的两种偏差\n\n一种是完全依赖技术团队判断用户价值，另一种是忽视工程限制直接承诺。前者丢失产品责任，后者增加交付风险。有效协作需要产品理解技术后果，工程理解用户任务，双方共同讨论可行替代方案。\n\n对高后果领域，专业人员的判断不可被模型或产品意见替代。可以通过明确角色和升级路径，让决策在适当专业范围内完成。清楚分工并不降低产品价值，反而提高交付可信度。\n\n资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。\n\n### 关联阅读\n\n- [范围、优先级与研发协作](13-06.md)\n- [Trace、日志与可观测性](12-02.md)\n\n### 资料与延伸阅读\n\n- [Microsoft：HAX Toolkit](https://www.microsoft.com/en-us/haxtoolkit/)\n- [Google：Rules of Machine Learning](https://developers.google.com/machine-learning/guides/rules-of-ml)\n","chars":1237,"minutes":5,"summary":"AI 产品跨越业务、模型、数据、工程、设计和运营。协作效率取决于团队是否围绕同一任务、证据和责任讨论。笼统地要求“算法提高准确率”或“研发实现智能化”，通常难以形成可执行工作。"},{"id":"18-04","title":"技术沟通：问对问题与说明取舍","file":"content/18-04.md","level":"工作应用","prerequisites":["18-03"],"aliases":["岗位","职业","作品集","面试"],"module":"18","moduleTitle":"岗位能力与职业发展","html":"<p>技术沟通的目标是形成正确决策，而不是在会议上使用更多术语。对非技术背景产品经理，最有价值的能力是理解系统输入输出、关键依赖和失败后果，并用证据讨论可行性与取舍。<\/p><h2 id=\"section-1\">从数据流理解系统<\/h2><p>可以依次问：用户提交什么，资料从哪里来，如何筛选，模型得到什么，输出交给谁，工具如何执行，结果在哪里验证。把这些连接成流程，就能发现缺失的权限、状态和检查。<\/p><p>API 是系统间约定，JSON 是常见结构，模型输出可能需要解析与业务校验。读懂这些基础，能够帮助你解释一个请求为何失败，以及需求中的字段是否真实可用。无需先掌握复杂算法，才能开始有效讨论。<\/p><h2 id=\"section-2\">问题围绕选择与证据<\/h2><p>讨论模型时问它在什么任务和输入条件下改善、如何测量、有哪些失败；讨论 RAG 时问资料、更新、检索与引用；讨论 Agent 时问工具、状态、停止和恢复；讨论上线时问成本、监控、权限与回滚。问题越具体，越容易获得可行动答案。<\/p><p>不要把“能不能做”停留在二选一。可以进一步询问最短路径、依赖、风险、替代方案和验证方法。工程可能给出多个不同成本与可靠性的方案，产品需要说明用户价值和可接受边界。<\/p><h2 id=\"section-3\">教学构造的工具讨论<\/h2><p>需求是“自动创建客户任务”。产品可以问：接口是否支持幂等、超时后如何查状态、用户权限如何沿用、批量中部分失败怎么办、确认对应哪个版本。每个问题都连接用户后果，而不是为了展示技术词汇。<\/p><p>如果接口没有幂等能力，可以讨论业务唯一标识、查询检查和限制范围，但不能假设提示能保证不重复。技术方案由工程评估，产品负责明确重复记录对用户的影响与验收要求。<\/p><h2 id=\"section-4\">清楚表达未知<\/h2><p>听不懂某个概念时，可以请对方用输入、过程、输出和例子解释。把自己的理解复述出来，确认有没有遗漏。承认不确定比假装理解更能避免后续错误承诺。<\/p><p>同样，对外沟通不要把实验结果说成稳定能力。可以说明已验证范围、仍待确认条件和下一步证据。术语准确需要与适用条件一起表达。<\/p><h2 id=\"section-5\">把沟通沉淀为工作资料<\/h2><p>保留关键架构图、术语解释、决策记录和代表失败。每次问题可以链接到知识库主题，逐步建立个人系统理解。资料应随着实际实现更新，避免仅保存初次会议截图。<\/p><p>成熟技术沟通能让团队更快发现假设、明确责任和选择方案。它服务产品判断，不要求产品经理替代工程师，也不允许把所有技术决定完全外包给他人而不理解影响。<\/p><h2 id=\"section-6\">用一个小例子校准理解<\/h2><p>讨论结构化输出时，可以拿一个具体请求、返回字段与错误说明，确认每个字段来自哪里、允许为空吗、怎样校验、谁使用。比起抽象讨论“模型可靠性”，小例子更容易暴露假设。<\/p><p>讨论性能时，也要区分模型生成、网络、工具、排队和用户确认。总时长增加可能与模型无关。能把指标拆回数据流，就能提出更有针对性的问题。技术沟通的深度来自这种可解释关系。<\/p><h2 id=\"section-7\">说明取舍的表达方式<\/h2><p>可以采用“目标与约束—候选方案—证据—选择—代价—复审条件”的结构。它既适合技术评审，也适合向业务解释。明确代价并不代表方案不好，而是让团队知道选择意味着接受什么。<\/p><p>对于未经验证的结论，使用适当条件描述。公开榜单、供应商材料与团队实验回答不同问题。问清样本、版本与环境，能够防止把局部结果误当成普遍能力。<\/p><p>技术沟通也要面向非技术同事。将机制翻译为用户影响、成本和可选路径，可以帮助业务理解限制。保持准确与可理解同时成立，才能让技术知识真正进入产品决策。<\/p><p>资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/03-02\">HTTP 与 API：一次请求发生了什么<\/a><\/li><li><a href=\"#lesson/08-02\">工具调用的完整生命周期<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://jobs.ashbyhq.com/Perplexity/a8c79425-eb48-40e0-8557-93460fa67097\" target=\"_blank\" rel=\"noopener noreferrer\">Perplexity：Product Manager, Platform<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"从数据流理解系统","level":2},{"id":"section-2","title":"问题围绕选择与证据","level":2},{"id":"section-3","title":"教学构造的工具讨论","level":2},{"id":"section-4","title":"清楚表达未知","level":2},{"id":"section-5","title":"把沟通沉淀为工作资料","level":2},{"id":"section-6","title":"用一个小例子校准理解","level":2},{"id":"section-7","title":"说明取舍的表达方式","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"技术沟通的目标是形成正确决策，而不是在会议上使用更多术语。对非技术背景产品经理，最有价值的能力是理解系统输入输出、关键依赖和失败后果，并用证据讨论可行性与取舍。\n\n## 从数据流理解系统\n\n可以依次问：用户提交什么，资料从哪里来，如何筛选，模型得到什么，输出交给谁，工具如何执行，结果在哪里验证。把这些连接成流程，就能发现缺失的权限、状态和检查。\n\nAPI 是系统间约定，JSON 是常见结构，模型输出可能需要解析与业务校验。读懂这些基础，能够帮助你解释一个请求为何失败，以及需求中的字段是否真实可用。无需先掌握复杂算法，才能开始有效讨论。\n\n## 问题围绕选择与证据\n\n讨论模型时问它在什么任务和输入条件下改善、如何测量、有哪些失败；讨论 RAG 时问资料、更新、检索与引用；讨论 Agent 时问工具、状态、停止和恢复；讨论上线时问成本、监控、权限与回滚。问题越具体，越容易获得可行动答案。\n\n不要把“能不能做”停留在二选一。可以进一步询问最短路径、依赖、风险、替代方案和验证方法。工程可能给出多个不同成本与可靠性的方案，产品需要说明用户价值和可接受边界。\n\n## 教学构造的工具讨论\n\n需求是“自动创建客户任务”。产品可以问：接口是否支持幂等、超时后如何查状态、用户权限如何沿用、批量中部分失败怎么办、确认对应哪个版本。每个问题都连接用户后果，而不是为了展示技术词汇。\n\n如果接口没有幂等能力，可以讨论业务唯一标识、查询检查和限制范围，但不能假设提示能保证不重复。技术方案由工程评估，产品负责明确重复记录对用户的影响与验收要求。\n\n## 清楚表达未知\n\n听不懂某个概念时，可以请对方用输入、过程、输出和例子解释。把自己的理解复述出来，确认有没有遗漏。承认不确定比假装理解更能避免后续错误承诺。\n\n同样，对外沟通不要把实验结果说成稳定能力。可以说明已验证范围、仍待确认条件和下一步证据。术语准确需要与适用条件一起表达。\n\n## 把沟通沉淀为工作资料\n\n保留关键架构图、术语解释、决策记录和代表失败。每次问题可以链接到知识库主题，逐步建立个人系统理解。资料应随着实际实现更新，避免仅保存初次会议截图。\n\n成熟技术沟通能让团队更快发现假设、明确责任和选择方案。它服务产品判断，不要求产品经理替代工程师，也不允许把所有技术决定完全外包给他人而不理解影响。\n\n## 用一个小例子校准理解\n\n讨论结构化输出时，可以拿一个具体请求、返回字段与错误说明，确认每个字段来自哪里、允许为空吗、怎样校验、谁使用。比起抽象讨论“模型可靠性”，小例子更容易暴露假设。\n\n讨论性能时，也要区分模型生成、网络、工具、排队和用户确认。总时长增加可能与模型无关。能把指标拆回数据流，就能提出更有针对性的问题。技术沟通的深度来自这种可解释关系。\n\n## 说明取舍的表达方式\n\n可以采用“目标与约束—候选方案—证据—选择—代价—复审条件”的结构。它既适合技术评审，也适合向业务解释。明确代价并不代表方案不好，而是让团队知道选择意味着接受什么。\n\n对于未经验证的结论，使用适当条件描述。公开榜单、供应商材料与团队实验回答不同问题。问清样本、版本与环境，能够防止把局部结果误当成普遍能力。\n\n技术沟通也要面向非技术同事。将机制翻译为用户影响、成本和可选路径，可以帮助业务理解限制。保持准确与可理解同时成立，才能让技术知识真正进入产品决策。\n\n资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。\n\n### 关联阅读\n\n- [HTTP 与 API：一次请求发生了什么](03-02.md)\n- [工具调用的完整生命周期](08-02.md)\n\n### 资料与延伸阅读\n\n- [Perplexity：Product Manager, Platform](https://jobs.ashbyhq.com/Perplexity/a8c79425-eb48-40e0-8557-93460fa67097)\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n","chars":1267,"minutes":5,"summary":"技术沟通的目标是形成正确决策，而不是在会议上使用更多术语。对非技术背景产品经理，最有价值的能力是理解系统输入输出、关键依赖和失败后果，并用证据讨论可行性与取舍。"},{"id":"18-05","title":"作品集：用证据讲清 AI 项目","file":"content/18-05.md","level":"工作应用","prerequisites":["18-04"],"aliases":["岗位","职业","作品集","面试"],"module":"18","moduleTitle":"岗位能力与职业发展","html":"<p>AI 项目作品集需要让读者看见你如何理解问题、做出选择、验证结果和处理限制。产品界面截图与模型演示能够说明产物，却不足以说明你的判断和贡献。可信作品应有证据链和清楚的角色边界。<\/p><h2 id=\"section-1\">围绕一个完整任务组织<\/h2><p>先说明用户、场景、当前障碍与目标，再展示范围、系统流程、交互、数据和工具。选择少数关键决策深入解释，例如为何使用 RAG、为何保留确认、如何定义任务完成。读者需要理解取舍，而不只是看到功能列表。<\/p><p>替代方案同样有价值。说明为什么没有选择更复杂的 Agent、没有微调或没有自动外发，能够体现约束与判断。决策应连接当时证据和资源，而不是事后把所有选择包装成唯一正确。<\/p><h2 id=\"section-2\">展示质量与失败<\/h2><p>记录评估对象、样本、标准、版本与结果。可以展示执行轨迹、错误分类、改进前后比较和残余限制。没有真实线上数据时，明确是受控验证、教学构造或原型，不要补造业务收益。<\/p><p>一次失败复盘往往比成功截图更能体现能力。比如发现重复执行来自状态管理，如何定位、选择修复并验证。复盘需要说明你承担了什么，以及工程或业务伙伴的贡献。<\/p><h2 id=\"section-3\">教学构造的材料结构<\/h2><p>一个知识助手案例可以包含任务说明、资料与权限流程、回答和引用界面、代表失败、评估摘要、成本延迟与上线边界。工具 Agent 则增加工具契约、确认、状态和恢复。材料可以分为简短阅读版与深入附件，便于不同读者使用。<\/p><p>不要把全部内部 PRD 原样公开。可以重新绘制通用流程、替换数据、去除客户和架构敏感信息，并清楚标注脱敏或构造。公开权限需要遵守公司与合作方要求。<\/p><h2 id=\"section-4\">个人贡献如何表达<\/h2><p>可以分别说明负责、共同决策、参与和了解。团队结果不必全部归于个人，你的价值可以是定义问题、推动方案选择、建立评估或组织交付。清楚边界更方便面试深入追问，也更能保持专业可信度。<\/p><p>结果表述区分观测、估算和假设。例如“在一组受控任务中观察到”与“上线后全量提升”是不同结论。样本、条件和局限应可解释。<\/p><h2 id=\"section-5\">让作品集持续维护<\/h2><p>随着项目变化，更新版本、关键决策和结果。保留旧版有助于展示学习过程，但要说明哪些内容已失效。作品集不是对知识库的考试，而是你选择呈现实际经验的一种方式。<\/p><p>对你的 AI SCADA 经历，可以先翻译为通用任务与 Agent 机制，再补充行业差异。已有工具产品经验与新增 AI 判断连接起来，通常比罗列热门框架更能说明发展方向。<\/p><h2 id=\"section-6\">作品材料中的证据分层<\/h2><p>主页面保留任务、个人责任、关键决定和结果摘要；深入附件提供流程、评估、失败和版本。读者可以按时间与兴趣选择深度。不要要求所有人先读完长篇技术说明才能理解价值。<\/p><p>证据可以是经授权的指标、脱敏用户反馈、任务轨迹、决策记录和交付物。不同证据支持不同结论：截图支持界面存在，运行记录支持某次行为，长期数据才更接近持续效果。需要避免用弱证据支撑过强主张。<\/p><h2 id=\"section-7\">展示限制也能体现判断<\/h2><p>明确哪些任务不支持、哪些结论仅来自受控资料，以及为什么保留人工确认，能体现对实际能力的理解。作品集无需把产品描绘为无所不能。对失败与边界的成熟解释，往往更容易体现资深责任。<\/p><p>如果使用教学构造资料，应在显著位置说明，并把重点放在方法分析。构造案例可以帮助展示认知，但不能作为真实商业业绩或客户采用证据。二者保持区分，才能长期可信。<\/p><p>材料的组织应方便复查。稳定目录、版本日期与证据链接能让读者快速找到依据，避免把大量截图堆成无法验证的故事。内容清楚比视觉包装更能支撑深入交流。<\/p><p>资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/17-08\">案例综合复盘：价值、质量、成本与边界<\/a><\/li><li><a href=\"#lesson/18-06\">简历与项目叙事的组织方法<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://jobs.ashbyhq.com/langchain/27af5f96-b287-4bcc-8679-f96686dc7c8d\" target=\"_blank\" rel=\"noopener noreferrer\">LangChain：Product Manager, LangSmith<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Toolkit<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"围绕一个完整任务组织","level":2},{"id":"section-2","title":"展示质量与失败","level":2},{"id":"section-3","title":"教学构造的材料结构","level":2},{"id":"section-4","title":"个人贡献如何表达","level":2},{"id":"section-5","title":"让作品集持续维护","level":2},{"id":"section-6","title":"作品材料中的证据分层","level":2},{"id":"section-7","title":"展示限制也能体现判断","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 项目作品集需要让读者看见你如何理解问题、做出选择、验证结果和处理限制。产品界面截图与模型演示能够说明产物，却不足以说明你的判断和贡献。可信作品应有证据链和清楚的角色边界。\n\n## 围绕一个完整任务组织\n\n先说明用户、场景、当前障碍与目标，再展示范围、系统流程、交互、数据和工具。选择少数关键决策深入解释，例如为何使用 RAG、为何保留确认、如何定义任务完成。读者需要理解取舍，而不只是看到功能列表。\n\n替代方案同样有价值。说明为什么没有选择更复杂的 Agent、没有微调或没有自动外发，能够体现约束与判断。决策应连接当时证据和资源，而不是事后把所有选择包装成唯一正确。\n\n## 展示质量与失败\n\n记录评估对象、样本、标准、版本与结果。可以展示执行轨迹、错误分类、改进前后比较和残余限制。没有真实线上数据时，明确是受控验证、教学构造或原型，不要补造业务收益。\n\n一次失败复盘往往比成功截图更能体现能力。比如发现重复执行来自状态管理，如何定位、选择修复并验证。复盘需要说明你承担了什么，以及工程或业务伙伴的贡献。\n\n## 教学构造的材料结构\n\n一个知识助手案例可以包含任务说明、资料与权限流程、回答和引用界面、代表失败、评估摘要、成本延迟与上线边界。工具 Agent 则增加工具契约、确认、状态和恢复。材料可以分为简短阅读版与深入附件，便于不同读者使用。\n\n不要把全部内部 PRD 原样公开。可以重新绘制通用流程、替换数据、去除客户和架构敏感信息，并清楚标注脱敏或构造。公开权限需要遵守公司与合作方要求。\n\n## 个人贡献如何表达\n\n可以分别说明负责、共同决策、参与和了解。团队结果不必全部归于个人，你的价值可以是定义问题、推动方案选择、建立评估或组织交付。清楚边界更方便面试深入追问，也更能保持专业可信度。\n\n结果表述区分观测、估算和假设。例如“在一组受控任务中观察到”与“上线后全量提升”是不同结论。样本、条件和局限应可解释。\n\n## 让作品集持续维护\n\n随着项目变化，更新版本、关键决策和结果。保留旧版有助于展示学习过程，但要说明哪些内容已失效。作品集不是对知识库的考试，而是你选择呈现实际经验的一种方式。\n\n对你的 AI SCADA 经历，可以先翻译为通用任务与 Agent 机制，再补充行业差异。已有工具产品经验与新增 AI 判断连接起来，通常比罗列热门框架更能说明发展方向。\n\n## 作品材料中的证据分层\n\n主页面保留任务、个人责任、关键决定和结果摘要；深入附件提供流程、评估、失败和版本。读者可以按时间与兴趣选择深度。不要要求所有人先读完长篇技术说明才能理解价值。\n\n证据可以是经授权的指标、脱敏用户反馈、任务轨迹、决策记录和交付物。不同证据支持不同结论：截图支持界面存在，运行记录支持某次行为，长期数据才更接近持续效果。需要避免用弱证据支撑过强主张。\n\n## 展示限制也能体现判断\n\n明确哪些任务不支持、哪些结论仅来自受控资料，以及为什么保留人工确认，能体现对实际能力的理解。作品集无需把产品描绘为无所不能。对失败与边界的成熟解释，往往更容易体现资深责任。\n\n如果使用教学构造资料，应在显著位置说明，并把重点放在方法分析。构造案例可以帮助展示认知，但不能作为真实商业业绩或客户采用证据。二者保持区分，才能长期可信。\n\n材料的组织应方便复查。稳定目录、版本日期与证据链接能让读者快速找到依据，避免把大量截图堆成无法验证的故事。内容清楚比视觉包装更能支撑深入交流。\n\n资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。\n\n### 关联阅读\n\n- [案例综合复盘：价值、质量、成本与边界](17-08.md)\n- [简历与项目叙事的组织方法](18-06.md)\n\n### 资料与延伸阅读\n\n- [LangChain：Product Manager, LangSmith](https://jobs.ashbyhq.com/langchain/27af5f96-b287-4bcc-8679-f96686dc7c8d)\n- [Microsoft：HAX Toolkit](https://www.microsoft.com/en-us/haxtoolkit/)\n","chars":1295,"minutes":5,"summary":"AI 项目作品集需要让读者看见你如何理解问题、做出选择、验证结果和处理限制。产品界面截图与模型演示能够说明产物，却不足以说明你的判断和贡献。可信作品应有证据链和清楚的角色边界。"},{"id":"18-06","title":"简历与项目叙事的组织方法","file":"content/18-06.md","level":"工作应用","prerequisites":["18-05"],"aliases":["岗位","职业","作品集","面试"],"module":"18","moduleTitle":"岗位能力与职业发展","html":"<p>简历的目标是让招聘方快速理解你做过什么、贡献是什么、与目标岗位有何关系。AI 项目表述需要避免把团队使用的所有技术都列为个人能力，也不能用“赋能”“智能化”等词替代真实任务和结果。<\/p><h2 id=\"section-1\">项目叙事的基本结构<\/h2><p>可以用背景、责任、关键决策和结果组织。背景说明用户任务与障碍，责任明确你的范围，决策展示取舍，结果给出可核验影响与限制。篇幅有限时保留最能证明岗位相关能力的信息。<\/p><p>例如“负责某工具的 Agent 能力”还不够，可以进一步说明定义了哪些任务、推动何种流程、如何处理权限与失败、用什么证据验收。具体内容只能来自真实经历，不能用本知识库教学案例替代。<\/p><h2 id=\"section-2\">技术词汇要有工作含义<\/h2><p>写 RAG、MCP、Agent 或评测时，最好能解释它们在项目中解决什么问题。若只是接触过某框架，可以写了解或参与，不要写精通。面试通常会追问数据流、工具行为与失败，你需要能够说明边界。<\/p><p>代码或模型训练经历也应准确。使用 AI 辅助搭建原型可以体现验证能力，但不等于独立完成完整工程系统。清楚说明原型范围、依赖与验证，仍然有价值。<\/p><h2 id=\"section-3\">结果与数字的使用<\/h2><p>真实数字应有定义、时间、样本和口径。提升百分比需要知道基线、分母与其他变化因素。没有数字时，可以说明可观察的交付、流程变化、决策或用户证据，不必编造量化成果。<\/p><p>估算需标为估算，受控验证需标为验证。对敏感数据可以使用经允许的区间、比例或方法描述，但应避免用脱敏作为无法解释数字的理由。若不能公开，直接说明可讨论的范围。<\/p><h2 id=\"section-4\">教学构造的表达比较<\/h2><p>“主导 AI 智能化，显著提升效率”过于抽象。更有信息的结构是“围绕某用户任务，负责需求与交互；推动模型、工具与权限方案；建立任务验收和失败分类；结果按实际证据说明”。这里给的是写作结构，不是可直接替换成你的业绩。<\/p><p>针对不同岗位，可以调整信息顺序。应用岗先展示用户与价值，平台岗突出 API、配置与可靠性，企业岗强调集成、采用和交付。内容仍需保持事实一致。<\/p><h2 id=\"section-5\">保持简历与深入材料一致<\/h2><p>简历、作品集和面试叙事应使用一致的任务、角色、数字与时间。若项目发生变化，及时更新。可以准备更详细的决策说明与脱敏材料，帮助对方理解，而不是在简历里塞满所有细节。<\/p><p>你的八年经验需要以实际成果承载，AI 知识帮助解释新的系统取舍。职业表达的可信度来自事实、判断和边界共同成立，不是技术词数量。<\/p><h2 id=\"section-6\">针对岗位调整而不改变事实<\/h2><p>阅读目标岗位后，优先呈现与其用户、任务和责任相关的经历。平台岗位可以前置接口、配置与可靠性，应用岗位前置用户问题与采用。调整顺序和细节可以，不能改变项目事实、时间和个人角色。<\/p><p>简历中的技能列表最好有项目支撑。若某知识来自近期学习，可以在交流时准确说明理解程度，不必包装为多年经验。熟悉概念、运行过原型与负责正式交付，是不同层次。<\/p><h2 id=\"section-7\">敏感材料与背景核验<\/h2><p>公开前检查客户名、内部数字、未发布功能和合同限制。经允许可以重绘流程或使用构造数据，同时标注处理方式。不要直接上传内部文档到公开作品集或外部工具。<\/p><p>项目叙事还应能与团队分工和可核验记录一致。夸大个人贡献可能在深入讨论中形成矛盾，真实地说明组织协作反而更符合复杂 AI 产品的实际工作方式。<\/p><p>在简历更新记录中保留目标岗位和调整原因，有助于保持事实一致。每次新增技能或结果，都确认自己能说明来源、角色和适用条件，避免旧版本留下过强表述。<\/p><p>资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/18-01\">AI 产品岗位分型与能力要求<\/a><\/li><li><a href=\"#lesson/18-05\">作品集：用证据讲清 AI 项目<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://careers.tencent.com/jobdesc.html?postId=2110569968142827520\" target=\"_blank\" rel=\"noopener noreferrer\">腾讯：高级 AI 产品经理岗位<\/a><\/li><li><a href=\"https://jobs.ashbyhq.com/Perplexity/a8c79425-eb48-40e0-8557-93460fa67097\" target=\"_blank\" rel=\"noopener noreferrer\">Perplexity：Product Manager, Platform<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"项目叙事的基本结构","level":2},{"id":"section-2","title":"技术词汇要有工作含义","level":2},{"id":"section-3","title":"结果与数字的使用","level":2},{"id":"section-4","title":"教学构造的表达比较","level":2},{"id":"section-5","title":"保持简历与深入材料一致","level":2},{"id":"section-6","title":"针对岗位调整而不改变事实","level":2},{"id":"section-7","title":"敏感材料与背景核验","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"简历的目标是让招聘方快速理解你做过什么、贡献是什么、与目标岗位有何关系。AI 项目表述需要避免把团队使用的所有技术都列为个人能力，也不能用“赋能”“智能化”等词替代真实任务和结果。\n\n## 项目叙事的基本结构\n\n可以用背景、责任、关键决策和结果组织。背景说明用户任务与障碍，责任明确你的范围，决策展示取舍，结果给出可核验影响与限制。篇幅有限时保留最能证明岗位相关能力的信息。\n\n例如“负责某工具的 Agent 能力”还不够，可以进一步说明定义了哪些任务、推动何种流程、如何处理权限与失败、用什么证据验收。具体内容只能来自真实经历，不能用本知识库教学案例替代。\n\n## 技术词汇要有工作含义\n\n写 RAG、MCP、Agent 或评测时，最好能解释它们在项目中解决什么问题。若只是接触过某框架，可以写了解或参与，不要写精通。面试通常会追问数据流、工具行为与失败，你需要能够说明边界。\n\n代码或模型训练经历也应准确。使用 AI 辅助搭建原型可以体现验证能力，但不等于独立完成完整工程系统。清楚说明原型范围、依赖与验证，仍然有价值。\n\n## 结果与数字的使用\n\n真实数字应有定义、时间、样本和口径。提升百分比需要知道基线、分母与其他变化因素。没有数字时，可以说明可观察的交付、流程变化、决策或用户证据，不必编造量化成果。\n\n估算需标为估算，受控验证需标为验证。对敏感数据可以使用经允许的区间、比例或方法描述，但应避免用脱敏作为无法解释数字的理由。若不能公开，直接说明可讨论的范围。\n\n## 教学构造的表达比较\n\n“主导 AI 智能化，显著提升效率”过于抽象。更有信息的结构是“围绕某用户任务，负责需求与交互；推动模型、工具与权限方案；建立任务验收和失败分类；结果按实际证据说明”。这里给的是写作结构，不是可直接替换成你的业绩。\n\n针对不同岗位，可以调整信息顺序。应用岗先展示用户与价值，平台岗突出 API、配置与可靠性，企业岗强调集成、采用和交付。内容仍需保持事实一致。\n\n## 保持简历与深入材料一致\n\n简历、作品集和面试叙事应使用一致的任务、角色、数字与时间。若项目发生变化，及时更新。可以准备更详细的决策说明与脱敏材料，帮助对方理解，而不是在简历里塞满所有细节。\n\n你的八年经验需要以实际成果承载，AI 知识帮助解释新的系统取舍。职业表达的可信度来自事实、判断和边界共同成立，不是技术词数量。\n\n## 针对岗位调整而不改变事实\n\n阅读目标岗位后，优先呈现与其用户、任务和责任相关的经历。平台岗位可以前置接口、配置与可靠性，应用岗位前置用户问题与采用。调整顺序和细节可以，不能改变项目事实、时间和个人角色。\n\n简历中的技能列表最好有项目支撑。若某知识来自近期学习，可以在交流时准确说明理解程度，不必包装为多年经验。熟悉概念、运行过原型与负责正式交付，是不同层次。\n\n## 敏感材料与背景核验\n\n公开前检查客户名、内部数字、未发布功能和合同限制。经允许可以重绘流程或使用构造数据，同时标注处理方式。不要直接上传内部文档到公开作品集或外部工具。\n\n项目叙事还应能与团队分工和可核验记录一致。夸大个人贡献可能在深入讨论中形成矛盾，真实地说明组织协作反而更符合复杂 AI 产品的实际工作方式。\n\n在简历更新记录中保留目标岗位和调整原因，有助于保持事实一致。每次新增技能或结果，都确认自己能说明来源、角色和适用条件，避免旧版本留下过强表述。\n\n资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。\n\n### 关联阅读\n\n- [AI 产品岗位分型与能力要求](18-01.md)\n- [作品集：用证据讲清 AI 项目](18-05.md)\n\n### 资料与延伸阅读\n\n- [腾讯：高级 AI 产品经理岗位](https://careers.tencent.com/jobdesc.html?postId=2110569968142827520)\n- [Perplexity：Product Manager, Platform](https://jobs.ashbyhq.com/Perplexity/a8c79425-eb48-40e0-8557-93460fa67097)\n","chars":1276,"minutes":5,"summary":"简历的目标是让招聘方快速理解你做过什么、贡献是什么、与目标岗位有何关系。AI 项目表述需要避免把团队使用的所有技术都列为个人能力，也不能用“赋能”“智能化”等词替代真实任务和结果。"},{"id":"18-07","title":"面试中的产品与技术判断","file":"content/18-07.md","level":"工作应用","prerequisites":["18-06"],"aliases":["岗位","职业","作品集","面试"],"module":"18","moduleTitle":"岗位能力与职业发展","html":"<p>AI 产品面试可能同时观察业务理解、产品判断、技术沟通与结果责任。准备的核心是形成清楚的分析方法和真实项目叙事，而不是背诵一套万能回答。不同岗位的技术与领域深度需要另行核对。<\/p><h2 id=\"section-1\">面对产品问题先建立条件<\/h2><p>先明确用户、任务、场景、目标和约束，再讨论 AI 是否适合、数据与工具是否可得、如何设计体验与验证。直接提出“用多 Agent”容易跳过关键判断。一个合理方案需要说明替代路径和选择理由。<\/p><p>当信息不足时，可以提出具体澄清或明确假设。假设应影响后续选择，例如是否允许外发、用户是否有专业核对能力、资料是否更新。不能用大量问题拖延分析，也不能把未知偷偷当作事实。<\/p><h2 id=\"section-2\">技术判断关注系统机制<\/h2><p>解释 RAG 时，应能说明资料、切分、检索、重排、上下文、生成和引用；解释 Agent 时，应能说明工具、状态、停止、权限与恢复。概念定义只是起点，面试者更可能追问失败发生在哪里、如何验证和何时不用该方案。<\/p><p>无技术背景不意味着不能讨论这些内容。你可以用输入输出、数据流与业务后果解释，同时明确实现细节需与工程合作。对于不知道的部分，说明理解范围与核验路径。<\/p><h2 id=\"section-3\">项目追问需要有证据<\/h2><p>准备讲清任务背景、你的责任、关键取舍、团队协作、评估、结果与限制。面对“为什么这样选”，回到当时条件与证据。面对失败，说明如何发现、定位、改进及之后的变化，避免全部归因给模型或其他团队。<\/p><p>如果项目没有上线，也可以准确说明原型验证了什么、没有证明什么。真实的条件化结论，通常比无法支撑的宏大成果更能承受深入讨论。<\/p><h2 id=\"section-4\">教学构造的判断路径<\/h2><p>若被问如何改善 Agent 重复创建任务，可以先确认何时重复、接口是否幂等、超时与重试、状态保存和用户重复提交。再比较修复位置，并说明如何用执行记录和代表场景验证。重点是形成可定位问题的路径，不是立即给出一个框架名称。<\/p><p>若被问如何衡量价值，连接任务成功、总时长、核对负担、成本与业务结果，并说明样本与口径。避免只列一串指标，却无法解释怎样影响决策。<\/p><h2 id=\"section-5\">面试也是双向判断<\/h2><p>了解岗位真正负责的产品、用户、团队分工、上线责任、数据条件与评价方式。某岗位名称相同，实际可能偏售前、项目交付或模型研究。你需要判断它是否符合通用 AI／Agent 的发展目标。<\/p><p>持续学习可以帮助扩大理解，但不需要等到掌握整个 AI 领域才开始观察机会。你自主决定节奏，重点是让自己的事实、能力边界和发展方向越来越清楚。<\/p><h2 id=\"section-6\">区分知识问答与决策讨论<\/h2><p>概念问题可以清楚解释定义和机制，方案问题则需要条件、目标和取舍。若对方问“是否需要 RAG”，不能只重复 RAG 的组成，应分析资料更新、规模、权限、上下文和任务证据。答案可以是条件化的选择。<\/p><p>对于开放问题，说明分析边界后推进一个合理方案，再指出需要验证的关键未知。既不要假装确定所有细节，也不要停留在无限澄清。资深判断体现在能在不完整信息下形成可复查决定。<\/p><h2 id=\"section-7\">从交流中识别岗位真实性<\/h2><p>可以了解团队如何定义成功、谁承担模型与工程实现、是否已有资料与工具、产品处于原型还是规模运行、如何处理失败。回答能够帮助你判断岗位需要的能力与你想发展的方向是否一致。<\/p><p>面试中的反馈也可以进入个人知识地图：哪些问题涉及基础缺口，哪些涉及项目证据，哪些只是岗位不匹配。无需把每次结果都解释为个人整体能力评价，保留具体问题更有助于持续提升。<\/p><p>资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/13-02\">AI 适配性与替代方案判断<\/a><\/li><li><a href=\"#lesson/17-04\">工具执行 Agent：重复执行与失败恢复<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://jobs.ashbyhq.com/langchain/27af5f96-b287-4bcc-8679-f96686dc7c8d\" target=\"_blank\" rel=\"noopener noreferrer\">LangChain：Product Manager, LangSmith<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"面对产品问题先建立条件","level":2},{"id":"section-2","title":"技术判断关注系统机制","level":2},{"id":"section-3","title":"项目追问需要有证据","level":2},{"id":"section-4","title":"教学构造的判断路径","level":2},{"id":"section-5","title":"面试也是双向判断","level":2},{"id":"section-6","title":"区分知识问答与决策讨论","level":2},{"id":"section-7","title":"从交流中识别岗位真实性","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 产品面试可能同时观 :"content/18-08.md","level":"工作应用","prerequisites":["18-07"],"aliases":["岗位","职业","作品集","面试"],"module":"18","moduleTitle":"岗位能力与职业发展","html":"<p>持续学习需要把不断变化的信息接到稳定知识体系上。每天看到模型新闻和工具更新，并不自动形成系统理解。个人知识管理可以帮助区分原理、实现、产品功能和未经验证观点，避免知识随热点碎片化。<\/p><h2 id=\"section-1\">先区分知识的变化速度<\/h2><p>概率、向量、训练与泛化等基础相对稳定；RAG、Agent 和评估方法会持续发展；模型能力、价格、接口、套餐和招聘状态变化更快。不同内容需要不同核验频率，不能把旧文章中的平台功能当作永久事实。<\/p><p>阅读时记录来源、日期、适用条件和结论类型。官方文档说明特定产品，论文说明特定方法与实验，案例说明特定环境，个人观点则提供一种解释。它们都有价值，但不能互相替代。<\/p><h2 id=\"section-2\">把新信息接入已有问题<\/h2><p>看到一种新 Agent 架构，可以问它改善哪个任务、改变哪个环节、有什么证据与代价，再连接工具、状态、评估或成本主题。这样新知识成为体系的一部分，而不是孤立收藏。<\/p><p>如果新说法与已有认识冲突，先检查任务条件、版本和概念定义是否不同。争论“某技术是否有效”常常遗漏了适用范围。保留冲突与未知，有助于以后补充核验。<\/p><h2 id=\"section-3\">资料选择与阅读层次<\/h2><p>先通过概览建立地图，再读原理与流程，必要时深入原始资料。面向工程师的课程可能有 Python 或深度学习先修要求，可以把它们作为后续深入材料，而非直接作为无技术背景的唯一入口。<\/p><p>对复杂技术，用小例子、图解和输入输出帮助理解。数学与代码不必一次学完，遇到影响产品判断的概念时逐步补充。学习路径可以往返，不需要等待所有基础完美才阅读工作案例。<\/p><h2 id=\"section-4\">教学构造的资料更新<\/h2><p>知识库中某篇介绍模型上下文能力。新版本发布后，应核对官方条件、更新日期和原有案例是否仍适用，再修改正文、目录与关联链接。不能只把新数字加在顶部，却保留后文过时结论。<\/p><p>对于尚未复现的技术示例，标为示意或未验证。对价格与法律适用，说明核验时间与条件。诚实的状态记录能够让知识库长期可信。<\/p><h2 id=\"section-5\">自主节奏与连续性<\/h2><p>你每天约一小时，进度自主且无期限。可以按推荐关系系统阅读，也可以从工作问题进入，再回到原理。继续阅读、收藏和关联跳转用于降低中断成本，不代表必须完成某种课程任务。<\/p><p>阅读标记可以说明读过或需要重读，不能自动证明掌握。是否把知识用于工作、是否进一步运行示例，由你决定。知识库应提供足够完整的解释和方法，支持这种自主选择。<\/p><h2 id=\"section-6\">知识库如何持续扩充<\/h2><p>新增主题应有明确位置、前置关系、正文、案例、来源与更新记录。定期检查术语一致性、链接和重复内容，保留版本变化。长期目标是建立可查阅、可理解、可更新的判断基础，让新工具和新机会能够被放进更完整的认知中。<\/p><h2 id=\"section-7\">知识更新的最小流程<\/h2><p>发现新问题后，先确定它属于哪个专题，再核验资料、修订正文、检查术语与关联、更新索引和版本。若只追加一篇新笔记而不连接旧内容，长期会出现重复、矛盾和难以检索。<\/p><p>更新记录可以说明新增什么、修正什么、哪些结论失效及依据。稳定锚点与来源索引有助于保持链接可用。对未完成扩展明确状态，避免目录给人已经覆盖的错觉。<\/p><h2 id=\"section-8\">用问题连接广度与深度<\/h2><p>系统阅读帮助建立地图，工作问题帮助选择深入位置。例如排查重复执行会连接工具、状态、幂等、交互和评估。一个问题跨越多个主题，正是知识体系价值的体现。<\/p><p>资料收藏不必无限增加。优先保留能解释机制、支持决策和提供原始依据的内容，并定期清理失效链接与重复材料。长期知识库应越来越清楚，而不仅是越来越大。<\/p><p>资料核验日期：2026-11-14。职业建议为结合用户背景与岗位样本的分析；不构成任职资格认定或录用承诺。文中结构示例不代表用户真实业绩。<\/p><h3 id=\"section-9\">关联阅读<\/h3><ul><li><a href=\"#lesson/01-01\">AI、机器学习与生成式 AI：建立知识地图<\/a><\/li><li><a href=\"#lesson/18-01\">AI 产品岗位分型与能力要求<\/a><\/li><\/ul><h3 id=\"section-10\">资料与延伸阅读<\/h3><ul><li><a href=\"https://huggingface.co/learn/llm-course/chapter1/1\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：LLM Course Introduction<\/a><\/li><li><a href=\"https://developers.google.com/machine-learning/guides/rules-of-ml\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Rules of Machine Learning<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"先区分知识的变化速度","level":2},{"id":"section-2","title":"把新信息接入已有问题","level":2},{"id":"section-3","title":"资料选择与阅读层次","level":2},{"id":"section-4","title":"教学构造的资料更新","level":2},{"id":"section-5","title":"自主节奏与连续性","level":2},{"id":"section-6","title":"知识库如何持续扩充","level":2},{"id":"section-7","title":"知识更新的最小流程","level":2},{"id":"section-8","title":"用问题连接广度与深度","level":2},{"id":"section-9","title":"关联阅读","level":3},{"id":"section-10","title":"资料与延伸阅读","level":3}],"text":"持续学习需要把不断变化的信息接到稳定知识体系上。每天看到模型新闻和工具更新，并不自动形成系统理解。个人知识管理可以帮助区分原理、实现、产品功能和未经验证观点，避免知识随热点碎片化。\n\n## 先区分知识的变化速度\n\n概率、向量、训练与泛化等基础相对稳定；RAG、Agent 和评估方法会持续发展；模型能力、价格、接口、套餐和招聘状态变化更快。不同内容需要不同核验频率，不能把旧文章中的平台功能当作永久事实。\n\n阅读时记录来源、日期、适用条件和结论类型。官方文档说明特定产品，论文说明特定方法与实验，案例说明特定环境，个人观点则提供一种解释。它们都有价值，但不能互相替代。\n\n## 把新信息接入已有问题\n\n看到一种新 Agent 架构，可以问它改善哪个任务、改变哪个环节、有什么证据与代价，再连接工具、状态、评估或成本主题。这样新知识成为体系的一部分，而不是孤立收藏。\n\n如果新说法与已有认识冲突，先检查任务条件、版本和概念定义是否不同。争论“某技术是否有效”常常遗漏了适用范围。保留冲突与未知，有助于以后补充核验。\n\n## 资料选择与阅读层次\n\n先通过概览建立地图，再读原理与流程，必要时深入原始资料。面向工程师的课程可能有 Python 或深度学习先修要求，可以把它们作为后续深入材料，而非直接作为无技术背景的唯一入口。\n\n对复杂技术，用小例子、图解和输入输出帮助理解。数学与代码不必一次学完，遇到影响产品判断的概念时逐步补充。学习路径可以往返，不需要等待所有基础完美才阅读工作案例。\n\n## 教学构造的资料更新\n\n知识库中某篇介绍模型上下文能力。新版本发布后，应核对官方条件、更新日期和原有案例是否仍适用，再修改正文、目录与关联链接。不能只把新数字加在顶部，却保留后文过时结论。\n\n对于尚未复现的技术示例，标为示意或未验证。对价格与法律适用，说明核验时间与条件。诚实的状态记录能够让知识库长期可信。\n\n## 自主节奏与连续性\n\n你每天约一小时，进度自主且无期限。可以按推荐关系系统阅读，也可以从工作问题进入，再回到原理。继续阅读、收藏和关联跳转用于降低中断成本，不代表必须完成某种课程任务。\n\n阅读标记可以说明读过或需要重读，不能自动证明掌握。是否把知识用于工作、是否进一步运行示例，由你决定。知识库应提供足够完整的解释和方法，支持这种自主选择。\n\n## 知识库如何持续扩充\n\n新增主题应有明确位置、前置关系、正文、案例、来
