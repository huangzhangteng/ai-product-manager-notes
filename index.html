。比如会议时长默认三十分钟，可以在草案中直接展示；涉及哪位同名联系人，通常应先确认。两者的差别在于出错后果与用户发现难度。系统可以用候选列表减轻回答负担，候选仍然需要足够的识别信息。\n\n当任务存在多个不确定点，可以优先问会改变整体方向的问题，再延后细节。准备客户报告时，先确定目标客户和报告用途，通常比先确定标题样式更有价值。澄清顺序体现产品对任务的理解。\n\n如果系统采用假设继续，应在结果中保留假设及修改入口。例如“暂按下周一处理，可在发送前调整”。假设不能被静默转成授权，也不能在后续步骤中失去出处。对于需要用户明确决定的关键动作，等待仍然是合理的产品行为。\n\n## 输入确认不等于行动授权\n\n系统把自然语言提取为字段后，展示“识别为客户甲、日期周五”，只是对理解的确认；真正创建、发送或修改还可能需要动作授权。两者可以在同一界面完成，但文案必须清楚，让用户知道点击后会发生什么。\n\n用户修改输入时，后续派生内容可能需要更新。例如更换客户后，旧资料和草稿不能继续沿用。系统应明确哪些结果已失效，避免看似保留工作、实际上混用上下文。输入设计因此需要连接版本与状态。\n\n资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。\n\n### 关联阅读\n\n- [指令、角色与任务边界](05-01.md)\n- [记忆、个性化与用户控制](14-07.md)\n\n### 资料与延伸阅读\n\n- [Microsoft：Guidelines for Human-AI Interaction](https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/)\n- [Microsoft：Copilot Application Card](https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-transparency-note)\n","chars":1511,"minutes":6,"summary":"模型需要的上下文与用户自然提供的信息常常不一致。输入设计的目标是帮助用户以合理负担表达任务，并让系统在关键不确定处及时澄清。一个空白输入框可以很灵活，也可能把大量理解与组织工作留给用户。"},{"id":"14-03","title":"执行计划、状态与过程可见性","file":"content/14-03.md","level":"工作应用","prerequisites":["14-02"],"aliases":["UX","Copilot","HITL"],"module":"14","moduleTitle":"AI 交互与人机协作","html":"<p>Agent 可以在后台执行多步任务，用户却未必知道它在做什么、做到哪里、还需要多久。过程可见性的目标是帮助用户理解状态与采取行动。展示大量内部文字不一定有帮助，尤其不能把推测或计划伪装成已完成事实。<\/p><h2 id=\"section-1\">区分计划、进展和结果<\/h2><p>计划描述准备如何完成任务，进展描述已经发生的可证实事件，结果描述最终产物与目标状态。三者应在文案和视觉上区分。“准备查询客户资料”“已读取三份授权文档”“已生成草稿”等状态，比持续展示“正在思考”更有信息。<\/p><p>模型生成的计划可能在执行中调整。系统可以展示用户需要理解的任务步骤、依赖与关键动作，但不应承诺所有步骤都固定，也无需暴露隐藏推理内容。可见计划、工具执行记录和结果证据足以支持多数产品场景的解释。<\/p><h2 id=\"section-2\">状态应来自系统证据<\/h2><p>调用工具不等于成功。请求可能被接受、排队、部分完成、失败或超时。前端状态应映射真实的执行状态机。例如发送任务在邮件服务返回确认后才可标为已发送；如果回执不明确，应展示状态待确认并查询，而非让模型自行宣布成功。<\/p><p>一个可用状态模型可以包含等待输入、排队、执行、等待确认、部分完成、成功、失败与取消。不是每个产品都需要展示全部状态，但后台需要能区分会影响用户决策的差异。状态变化还应记录时间和当前可用动作。<\/p><h2 id=\"section-3\">让用户知道何时需要参与<\/h2><p>对需要确认的动作，应明确说明确认对象、影响和是否可撤销。对阻塞问题，应告诉用户提供什么才能继续。对于无需参与的后台步骤，可以提供简洁摘要，并允许展开查看，避免用户一直守在页面前。<\/p><p>预计剩余时间应有依据。缺少稳定估计时，可以说明当前步骤和已耗时，而不是展示虚假的精确倒计时。长任务还需要处理离开页面、重新进入和通知方式，确保用户能找到最终产物与未完成部分。<\/p><h2 id=\"section-4\">教学构造的资料研究过程<\/h2><p>研究助手先检索十个候选来源，再筛选可读取正文，随后提取证据和生成报告。用户更关心覆盖范围、哪些来源失败、是否存在冲突及何时得到结果。显示“搜索完成”还不够，因为正文读取与证据核对可能尚未结束。<\/p><p>若部分来源不可访问，系统可以继续其余来源，并在报告中说明限制。过程界面应展示已完成与受限部分，避免用户把部分成功误解为全面覆盖。最终报告应链接真实使用的材料，而非所有检索候选。<\/p><h2 id=\"section-5\">减少噪声，保留可追溯性<\/h2><p>用户界面通常需要任务级摘要，问题诊断则需要更细的执行记录。两者可以分层提供。公开日志前要过滤敏感数据、密钥和不必要内部信息。可见性不能成为新的信息泄露渠道。<\/p><p>产品经理应定义每个状态对应的事实、用户文案、允许动作和失败路径。过程透明的价值在于形成可靠预期，让用户知道何时等待、何时确认、何时接管，以及最终结果是否真的完成。<\/p><h2 id=\"section-6\">状态与操作应形成对应关系<\/h2><p>“等待确认”状态应允许确认、修改或取消；“执行中”可能允许暂停，但要说明哪些外部请求无法停止；“部分完成”应允许查看成功产物与重试未完成部分。若界面始终只显示一个停止按钮，用户很难知道它的真实效果。<\/p><p>执行记录还应区分意图与事件。模型提出“接下来创建任务”属于计划；接口提交属于请求；业务系统返回任务标识属于结果。把这三个事件混为一个日志，会使错误排查和用户解释都失去依据。对关键动作，应使用系统状态而非自然语言猜测作为展示基础。<\/p><p>对于复杂长任务，可把已验证的里程碑作为摘要，例如“资料收集完成，五个来源可用，两个无法访问”。这种信息能帮助用户判断是否继续扩大搜索，也能在任务中断后提供恢复起点。过程可见性因此直接连接可控性和恢复能力。<\/p><h2 id=\"section-7\">过程展示也需要权限<\/h2><p>工具日志可能包含内部路径、客户字段或错误堆栈，不能直接全部暴露。用户级视图应提供足够判断任务的信息，管理和诊断视图按角色开放。对外共享任务时，还要检查共享者是否有权展示来源与执行细节。<\/p><p>过程信息更新应稳定，避免反复改写已完成事件。计划可以调整，但历史事实应保留。这样用户与支持人员能够理解系统从哪里开始偏离，后续恢复也有可靠起点。<\/p><h2 id=\"section-8\">状态与用户动作的对照<\/h2><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>状态<\/th><th>应说明的事实<\/th><th>可能的用户动作<\/th><\/tr><tr><td>准备中<\/td><td>正在读取哪些许可资料<\/td><td>调整范围、取消<\/td><\/tr><tr><td>等待确认<\/td><td>即将执行的对象与影响<\/td><td>修改、确认、拒绝<\/td><\/tr><tr><td>执行中<\/td><td>已提交与尚未提交的步骤<\/td><td>查看详情、按能力暂停<\/td><\/tr><tr><td>部分完成<\/td><td>成功对象与未完成原因<\/td><td>只恢复失败项、接管<\/td><\/tr><tr><td>完成<\/td><td>真实结果与产物位置<\/td><td>打开、继续后续工作<\/td><\/tr><\/table><\/div><p>状态名称可以随产品调整，关键是它与后台事实一致。取消、暂停和撤销也应说明不同效果。<\/p><p>资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。<\/p><h3 id=\"section-9\">关联阅读<\/h3><ul><li><a href=\"#lesson/09-04\">单 Agent 与多 Agent 的选择<\/a><\/li><li><a href=\"#lesson/12-02\">Trace、日志与可观测性<\/a><\/li><\/ul><h3 id=\"section-10\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/playbook/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Playbook<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"区分计划、进展和结果","level":2},{"id":"section-2","title":"状态应来自系统证据","level":2},{"id":"section-3","title":"让用户知道何时需要参与","level":2},{"id":"section-4","title":"教学构造的资料研究过程","level":2},{"id":"section-5","title":"减少噪声，保留可追溯性","level":2},{"id":"section-6","title":"状态与操作应形成对应关系","level":2},{"id":"section-7","title":"过程展示也需要权限","level":2},{"id":"section-8","title":"状态与用户动作的对照","level":2},{"id":"section-9","title":"关联阅读","level":3},{"id":"section-10","title":"资料与延伸阅读","level":3}],"text":"Agent 可以在后台执行多步任务，用户却未必知道它在做什么、做到哪里、还需要多久。过程可见性的目标是帮助用户理解状态与采取行动。展示大量内部文字不一定有帮助，尤其不能把推测或计划伪装成已完成事实。\n\n## 区分计划、进展和结果\n\n计划描述准备如何完成任务，进展描述已经发生的可证实事件，结果描述最终产物与目标状态。三者应在文案和视觉上区分。“准备查询客户资料”“已读取三份授权文档”“已生成草稿”等状态，比持续展示“正在思考”更有信息。\n\n模型生成的计划可能在执行中调整。系统可以展示用户需要理解的任务步骤、依赖与关键动作，但不应承诺所有步骤都固定，也无需暴露隐藏推理内容。可见计划、工具执行记录和结果证据足以支持多数产品场景的解释。\n\n## 状态应来自系统证据\n\n调用工具不等于成功。请求可能被接受、排队、部分完成、失败或超时。前端状态应映射真实的执行状态机。例如发送任务在邮件服务返回确认后才可标为已发送；如果回执不明确，应展示状态待确认并查询，而非让模型自行宣布成功。\n\n一个可用状态模型可以包含等待输入、排队、执行、等待确认、部分完成、成功、失败与取消。不是每个产品都需要展示全部状态，但后台需要能区分会影响用户决策的差异。状态变化还应记录时间和当前可用动作。\n\n## 让用户知道何时需要参与\n\n对需要确认的动作，应明确说明确认对象、影响和是否可撤销。对阻塞问题，应告诉用户提供什么才能继续。对于无需参与的后台步骤，可以提供简洁摘要，并允许展开查看，避免用户一直守在页面前。\n\n预计剩余时间应有依据。缺少稳定估计时，可以说明当前步骤和已耗时，而不是展示虚假的精确倒计时。长任务还需要处理离开页面、重新进入和通知方式，确保用户能找到最终产物与未完成部分。\n\n## 教学构造的资料研究过程\n\n研究助手先检索十个候选来源，再筛选可读取正文，随后提取证据和生成报告。用户更关心覆盖范围、哪些来源失败、是否存在冲突及何时得到结果。显示“搜索完成”还不够，因为正文读取与证据核对可能尚未结束。\n\n若部分来源不可访问，系统可以继续其余来源，并在报告中说明限制。过程界面应展示已完成与受限部分，避免用户把部分成功误解为全面覆盖。最终报告应链接真实使用的材料，而非所有检索候选。\n\n## 减少噪声，保留可追溯性\n\n用户界面通常需要任务级摘要，问题诊断则需要更细的执行记录。两者可以分层提供。公开日志前要过滤敏感数据、密钥和不必要内部信息。可见性不能成为新的信息泄露渠道。\n\n产品经理应定义每个状态对应的事实、用户文案、允许动作和失败路径。过程透明的价值在于形成可靠预期，让用户知道何时等待、何时确认、何时接管，以及最终结果是否真的完成。\n\n## 状态与操作应形成对应关系\n\n“等待确认”状态应允许确认、修改或取消；“执行中”可能允许暂停，但要说明哪些外部请求无法停止；“部分完成”应允许查看成功产物与重试未完成部分。若界面始终只显示一个停止按钮，用户很难知道它的真实效果。\n\n执行记录还应区分意图与事件。模型提出“接下来创建任务”属于计划；接口提交属于请求；业务系统返回任务标识属于结果。把这三个事件混为一个日志，会使错误排查和用户解释都失去依据。对关键动作，应使用系统状态而非自然语言猜测作为展示基础。\n\n对于复杂长任务，可把已验证的里程碑作为摘要，例如“资料收集完成，五个来源可用，两个无法访问”。这种信息能帮助用户判断是否继续扩大搜索，也能在任务中断后提供恢复起点。过程可见性因此直接连接可控性和恢复能力。\n\n## 过程展示也需要权限\n\n工具日志可能包含内部路径、客户字段或错误堆栈，不能直接全部暴露。用户级视图应提供足够判断任务的信息，管理和诊断视图按角色开放。对外共享任务时，还要检查共享者是否有权展示来源与执行细节。\n\n过程信息更新应稳定，避免反复改写已完成事件。计划可以调整，但历史事实应保留。这样用户与支持人员能够理解系统从哪里开始偏离，后续恢复也有可靠起点。\n\n## 状态与用户动作的对照\n\n| 状态 | 应说明的事实 | 可能的用户动作 |\n|---|---|---|\n| 准备中 | 正在读取哪些许可资料 | 调整范围、取消 |\n| 等待确认 | 即将执行的对象与影响 | 修改、确认、拒绝 |\n| 执行中 | 已提交与尚未提交的步骤 | 查看详情、按能力暂停 |\n| 部分完成 | 成功对象与未完成原因 | 只恢复失败项、接管 |\n| 完成 | 真实结果与产物位置 | 打开、继续后续工作 |\n\n状态名称可以随产品调整，关键是它与后台事实一致。取消、暂停和撤销也应说明不同效果。\n\n资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。\n\n### 关联阅读\n\n- [单 Agent 与多 Agent 的选择](09-04.md)\n- [Trace、日志与可观测性](12-02.md)\n\n### 资料与延伸阅读\n\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [Microsoft：HAX Playbook](https://www.microsoft.com/en-us/haxtoolkit/playbook/)\n","chars":1639,"minutes":6,"summary":"Agent 可以在后台执行多步任务，用户却未必知道它在做什么、做到哪里、还需要多久。过程可见性的目标是帮助用户理解状态与采取行动。展示大量内部文字不一定有帮助，尤其不能把推测或计划伪装成已完成事实。"},{"id":"14-04","title":"引用、解释与信任校准","file":"content/14-04.md","level":"工作应用","prerequisites":["14-03"],"aliases":["UX","Copilot","HITL"],"module":"14","moduleTitle":"AI 交互与人机协作","html":"<p>用户容易把表达流畅与结论可靠联系起来。AI 产品需要帮助用户形成与实际能力相匹配的信任。引用、解释和不确定性提示可以提供支持，但它们本身也需要可验证，不能成为装饰性的可信标记。<\/p><h2 id=\"section-1\">引用要支持具体结论<\/h2><p>一个来源链接只说明存在某份材料，不证明它支持旁边的说法。引用应尽量靠近相关结论，并允许用户定位到实际段落、页码或记录。文档版本、发布时间和权限也会影响依据是否适用。<\/p><p>知识助手可能检索到正确文档，却引用了不能支持结论的片段。也可能引用过期政策，或者在多个来源冲突时只选其中一个。因此引用质量需要从“有链接”进一步检查相关性、支撑关系、时效和覆盖范围。<\/p><h2 id=\"section-2\">解释应回答用户的判断需要<\/h2><p>用户通常需要知道依据来自哪里、采用了哪些条件、有哪些限制以及下一步可做什么。解释可以展示资料、规则、计算步骤和执行结果，无需提供模型隐藏的内部推理。看似详尽的推理文字也可能是事后生成，不能自动当作事实依据。<\/p><p>对推荐结果，可以说明使用了哪些明确条件，例如时间、权限与资料范围。对失败结果，可以说明未获得哪项必要证据。解释应当帮助用户检查与修正，而不是用更多术语增加权威感。<\/p><h2 id=\"section-3\">不确定性需要具体表达<\/h2><p>“结果可能不准确”过于宽泛。更有帮助的是说明当前缺口：“未找到本季度政策”“两个来源的生效日期不同”“该数据无法访问”。具体不确定性告诉用户应核对什么，也有助于系统选择拒答、提供候选或请求补充资料。<\/p><p>如果展示置信度，需要解释它测量什么、如何得到和何时有效。模型自己输出的百分比不等于经过校准的正确概率。没有可靠依据时，明确的证据状态通常比精确数字更合适。<\/p><h2 id=\"section-4\">教学构造的政策问答<\/h2><p>用户询问某员工是否符合补贴条件。助手找到了旧政策与新通知，但员工岗位信息缺失。可靠回答可以列出已确认的规则、版本冲突和缺失字段，并避免直接给出最终资格判断。界面同时允许打开来源与补充资料。<\/p><p>若系统为了提高回答率而忽略这些缺口，可能短期显得更有用，却让用户在重要任务上形成过度信任。信任校准要求在能回答时提供依据，在不能回答时清楚说明原因与可继续路径。<\/p><h2 id=\"section-5\">让信任与实际表现持续匹配<\/h2><p>初次使用时说明支持范围，出现错误时允许纠正，长期使用时告知会影响行为的变化。用户的信任会受到一致性、可控性和恢复体验影响，不只是一次回答的准确性。过度拟人化或绝对化表达也可能放大用户预期。<\/p><p>产品经理应把引用和解释视为任务的一部分：它们是否降低核对成本，是否揭示限制，是否支持用户作出正确选择。最终目标是让用户知道何时可以依赖系统、何时需要核验，并保留足够的证据进行判断。<\/p><h2 id=\"section-6\">引用的粒度影响核对成本<\/h2><p>如果一段回答包含三个事实，却只在段尾附一个长文档链接，用户仍需自行寻找支撑关系。可以把不同结论分别关联片段，并标注资料日期。若某条内容是推断而非原文事实，应清楚说明推断依据与限制，避免引用制造错误确定性。<\/p><p>来源之间出现冲突时，系统可以并列展示差异、版本与生效条件，必要时请求用户选择适用环境。直接平均两个数字或选择更新的网页，未必符合业务规则。知识来源的权威性与适用性需要结合任务判断。<\/p><p>对于敏感资料，引用本身也需要权限检查。用户能看到结论，不应自动获得无权访问的原文链接或标题。产品要同时处理“证明结论”和“保护资料”，必要时展示可见范围内的依据说明，并提供正式申请访问的路径。<\/p><h2 id=\"section-7\">信任提示需要避免误导<\/h2><p>绿色标记、认证图标或“已核验”文字容易被理解为全面保证。若只验证格式，就应说明是格式检查；若只核对某些来源，不应暗示所有事实均已确认。标签的含义必须与后台证据一致。<\/p><p>解释也可以允许用户提出纠正，并把纠正关联到具体结论。系统应区分用户提供的新事实与未经验证的意见，避免为了表现顺从而立即重写权威资料。可信协作既需要听取反馈，也需要保持证据标准。<\/p><p>资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/07-06\">引用、可追溯性与回答约束<\/a><\/li><li><a href=\"#lesson/11-04\">模型裁判：校准、偏差与限制<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-transparency-note\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Copilot Application Card<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Guidelines for Human-AI Interaction<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"引用要支持具体结论","level":2},{"id":"section-2","title":"解释应回答用户的判断需要","level":2},{"id":"section-3","title":"不确定性需要具体表达","level":2},{"id":"section-4","title":"教学构造的政策问答","level":2},{"id":"section-5","title":"让信任与实际表现持续匹配","level":2},{"id":"section-6","title":"引用的粒度影响核对成本","level":2},{"id":"section-7","title":"信任提示需要避免误导","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"用户容易把表达流畅与结论可靠联系起来。AI 产品需要帮助用户形成与实际能力相匹配的信任。引用、解释和不确定性提示可以提供支持，但它们本身也需要可验证，不能成为装饰性的可信标记。\n\n## 引用要支持具体结论\n\n一个来源链接只说明存在某份材料，不证明它支持旁边的说法。引用应尽量靠近相关结论，并允许用户定位到实际段落、页码或记录。文档版本、发布时间和权限也会影响依据是否适用。\n\n知识助手可能检索到正确文档，却引用了不能支持结论的片段。也可能引用过期政策，或者在多个来源冲突时只选其中一个。因此引用质量需要从“有链接”进一步检查相关性、支撑关系、时效和覆盖范围。\n\n## 解释应回答用户的判断需要\n\n用户通常需要知道依据来自哪里、采用了哪些条件、有哪些限制以及下一步可做什么。解释可以展示资料、规则、计算步骤和执行结果，无需提供模型隐藏的内部推理。看似详尽的推理文字也可能是事后生成，不能自动当作事实依据。\n\n对推荐结果，可以说明使用了哪些明确条件，例如时间、权限与资料范围。对失败结果，可以说明未获得哪项必要证据。解释应当帮助用户检查与修正，而不是用更多术语增加权威感。\n\n## 不确定性需要具体表达\n\n“结果可能不准确”过于宽泛。更有帮助的是说明当前缺口：“未找到本季度政策”“两个来源的生效日期不同”“该数据无法访问”。具体不确定性告诉用户应核对什么，也有助于系统选择拒答、提供候选或请求补充资料。\n\n如果展示置信度，需要解释它测量什么、如何得到和何时有效。模型自己输出的百分比不等于经过校准的正确概率。没有可靠依据时，明确的证据状态通常比精确数字更合适。\n\n## 教学构造的政策问答\n\n用户询问某员工是否符合补贴条件。助手找到了旧政策与新通知，但员工岗位信息缺失。可靠回答可以列出已确认的规则、版本冲突和缺失字段，并避免直接给出最终资格判断。界面同时允许打开来源与补充资料。\n\n若系统为了提高回答率而忽略这些缺口，可能短期显得更有用，却让用户在重要任务上形成过度信任。信任校准要求在能回答时提供依据，在不能回答时清楚说明原因与可继续路径。\n\n## 让信任与实际表现持续匹配\n\n初次使用时说明支持范围，出现错误时允许纠正，长期使用时告知会影响行为的变化。用户的信任会受到一致性、可控性和恢复体验影响，不只是一次回答的准确性。过度拟人化或绝对化表达也可能放大用户预期。\n\n产品经理应把引用和解释视为任务的一部分：它们是否降低核对成本，是否揭示限制，是否支持用户作出正确选择。最终目标是让用户知道何时可以依赖系统、何时需要核验，并保留足够的证据进行判断。\n\n## 引用的粒度影响核对成本\n\n如果一段回答包含三个事实，却只在段尾附一个长文档链接，用户仍需自行寻找支撑关系。可以把不同结论分别关联片段，并标注资料日期。若某条内容是推断而非原文事实，应清楚说明推断依据与限制，避免引用制造错误确定性。\n\n来源之间出现冲突时，系统可以并列展示差异、版本与生效条件，必要时请求用户选择适用环境。直接平均两个数字或选择更新的网页，未必符合业务规则。知识来源的权威性与适用性需要结合任务判断。\n\n对于敏感资料，引用本身也需要权限检查。用户能看到结论，不应自动获得无权访问的原文链接或标题。产品要同时处理“证明结论”和“保护资料”，必要时展示可见范围内的依据说明，并提供正式申请访问的路径。\n\n## 信任提示需要避免误导\n\n绿色标记、认证图标或“已核验”文字容易被理解为全面保证。若只验证格式，就应说明是格式检查；若只核对某些来源，不应暗示所有事实均已确认。标签的含义必须与后台证据一致。\n\n解释也可以允许用户提出纠正，并把纠正关联到具体结论。系统应区分用户提供的新事实与未经验证的意见，避免为了表现顺从而立即重写权威资料。可信协作既需要听取反馈，也需要保持证据标准。\n\n资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。\n\n### 关联阅读\n\n- [引用、可追溯性与回答约束](07-06.md)\n- [模型裁判：校准、偏差与限制](11-04.md)\n\n### 资料与延伸阅读\n\n- [Microsoft：Copilot Application Card](https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-transparency-note)\n- [Microsoft：Guidelines for Human-AI Interaction](https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/)\n","chars":1444,"minutes":6,"summary":"用户容易把表达流畅与结论可靠联系起来。AI 产品需要帮助用户形成与实际能力相匹配的信任。引用、解释和不确定性提示可以提供支持，但它们本身也需要可验证，不能成为装饰性的可信标记。"},{"id":"14-05","title":"编辑、确认、撤销与人工接管","file":"content/14-05.md","level":"工作应用","prerequisites":["14-04"],"aliases":["UX","Copilot","HITL"],"module":"14","moduleTitle":"AI 交互与人机协作","html":"<p>人机协作需要明确控制权如何转移。编辑、确认、撤销和接管分别处理不同问题：编辑改变产物，确认授权某个动作，撤销恢复已发生的改变，接管则由人继续推进。把它们合成一个“用户可控”标签，容易遗漏真实流程。<\/p><h2 id=\"section-1\">把控制点放在有后果的位置<\/h2><p>生成草稿和发送邮件的后果不同，查询记录和修改记录的后果也不同。可以让低风险准备自动进行，把确认放在外发、提交、删除或关键修改之前。确认不必出现在每个步骤，否则用户会习惯性点击，降低它的实际价值。<\/p><p>确认视图应展示动作、对象、关键内容、影响与可撤销性。按钮上的“继续”往往不如“发送给三位收件人”清楚。用户确认后若关键参数改变，应重新检查授权是否仍然有效，不能把原确认无限延伸。<\/p><h2 id=\"section-2\">编辑需要保持一致状态<\/h2><p>用户修改了草稿，系统应使用修改后的版本继续。若后台仍拿旧内容发送，就会形成严重的不一致。产品需要定义版本、保存、并发编辑和确认对象。差异预览可以帮助用户关注实际改变，而不必反复阅读全文。<\/p><p>对结构化内容，允许用户定位字段、查看依据和修正。模型解释的字段与业务系统中的值应对应，避免同一概念在不同页面含义不同。编辑后如果影响计算或规则，应重新校验相关结果。<\/p><h2 id=\"section-3\">撤销要区分真实可逆与补偿<\/h2><p>本地草稿可以恢复旧版本，已经发送的消息通常不能保证从对方系统消失，已经执行的支付也不能简单视为删除记录。产品应说明真正可逆的范围，以及只能采用补偿动作的情况。补偿可能是发送更正、创建退款或重新审批。<\/p><p>“撤销”按钮背后需要有明确业务能力支持。如果系统仅隐藏界面，却没有恢复后台状态，会误导用户。撤销还可能触发权限、时间窗口和关联任务变化，需要在设计时确认。<\/p><h2 id=\"section-4\">教学构造的办公执行<\/h2><p>助手准备把会议纪要转为任务并通知成员。用户可以先编辑责任人与日期，再查看即将创建的任务及通知对象，确认后执行。若部分任务创建成功、通知失败，系统应保留成功状态并提供重发通知，避免重新创建全部任务。<\/p><p>如果用户选择接管，界面应给出当前产物、已完成动作、未完成事项和关键错误。接管不是让人从头重来，而是把系统积累的信息与状态完整交还。必要时提供到业务系统的链接。<\/p><h2 id=\"section-5\">控制权也需要长期治理<\/h2><p>授权范围应能查看和撤回，长期任务可以暂停或终止。暂停意味着停止后续动作，但已经提交的外部请求可能仍在完成；系统应清楚说明这种边界。多端操作时还要避免一个端显示已取消、另一端继续执行。<\/p><p>产品经理需要与工程共同定义控制动作的真实效果，并用任务状态来验证。良好的控制设计能够降低出错后果，同时帮助用户在理解范围内逐步接受更高自主程度。<\/p><h2 id=\"section-6\">防止确认成为形式<\/h2><p>当确认界面充满无关细节，或每次都要求点击，用户会逐渐忽略内容。可以突出实际变化、动作对象与高后果字段，并将重复、低风险的准备步骤收在摘要中。确认不是把责任推给用户，而是为真实选择提供足够信息。<\/p><p>授权还应绑定版本。用户确认发送草稿甲后，若后台又改写成草稿乙，原来的确认就不能直接适用。对于批量操作，可以说明总量、异常项与可展开明细，让用户理解批准范围。未经展示的新对象，不应被悄悄加入已确认集合。<\/p><p>接管时也要终止不必要的并行执行。若用户已经在业务系统手工处理，Agent 仍继续提交，可能产生冲突。系统需要明确由谁持有当前任务控制权，以及何时能重新交回自动流程。这是人机协作状态管理的一部分。<\/p><h2 id=\"section-7\">批量动作的控制设计<\/h2><p>大量对象不能只提供一个笼统确认。可以先展示总量、异常项、影响类别与可展开明细，支持用户排除个别对象。系统需要保留最终确认集合，并在执行前核对是否变化。<\/p><p>取消批量任务时，说明已经完成、正在提交与尚未开始的部分。真实停止能力可能有延迟，界面应据实显示。用户理解边界后，才能决定是否需要到业务系统继续处理，而不会误以为所有改变已经撤销。<\/p><p>资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/15-03\">工具权限、最小授权与沙箱<\/a><\/li><li><a href=\"#lesson/08-06\">回滚、补偿与业务一致性<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://genai.owasp.org/llmrisk/llm062025-excessive-agency/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：Excessive Agency<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Guidelines for Human-AI Interaction<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"把控制点放在有后果的位置","level":2},{"id":"section-2","title":"编辑需要保持一致状态","level":2},{"id":"section-3","title":"撤销要区分真实可逆与补偿","level":2},{"id":"section-4","title":"教学构造的办公执行","level":2},{"id":"section-5","title":"控制权也需要长期治理","level":2},{"id":"section-6","title":"防止确认成为形式","level":2},{"id":"section-7","title":"批量动作的控制设计","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"人机协作需要明确控制权如何转移。编辑、确认、撤销和接管分别处理不同问题：编辑改变产物，确认授权某个动作，撤销恢复已发生的改变，接管则由人继续推进。把它们合成一个“用户可控”标签，容易遗漏真实流程。\n\n## 把控制点放在有后果的位置\n\n生成草稿和发送邮件的后果不同，查询记录和修改记录的后果也不同。可以让低风险准备自动进行，把确认放在外发、提交、删除或关键修改之前。确认不必出现在每个步骤，否则用户会习惯性点击，降低它的实际价值。\n\n确认视图应展示动作、对象、关键内容、影响与可撤销性。按钮上的“继续”往往不如“发送给三位收件人”清楚。用户确认后若关键参数改变，应重新检查授权是否仍然有效，不能把原确认无限延伸。\n\n## 编辑需要保持一致状态\n\n用户修改了草稿，系统应使用修改后的版本继续。若后台仍拿旧内容发送，就会形成严重的不一致。产品需要定义版本、保存、并发编辑和确认对象。差异预览可以帮助用户关注实际改变，而不必反复阅读全文。\n\n对结构化内容，允许用户定位字段、查看依据和修正。模型解释的字段与业务系统中的值应对应，避免同一概念在不同页面含义不同。编辑后如果影响计算或规则，应重新校验相关结果。\n\n## 撤销要区分真实可逆与补偿\n\n本地草稿可以恢复旧版本，已经发送的消息通常不能保证从对方系统消失，已经执行的支付也不能简单视为删除记录。产品应说明真正可逆的范围，以及只能采用补偿动作的情况。补偿可能是发送更正、创建退款或重新审批。\n\n“撤销”按钮背后需要有明确业务能力支持。如果系统仅隐藏界面，却没有恢复后台状态，会误导用户。撤销还可能触发权限、时间窗口和关联任务变化，需要在设计时确认。\n\n## 教学构造的办公执行\n\n助手准备把会议纪要转为任务并通知成员。用户可以先编辑责任人与日期，再查看即将创建的任务及通知对象，确认后执行。若部分任务创建成功、通知失败，系统应保留成功状态并提供重发通知，避免重新创建全部任务。\n\n如果用户选择接管，界面应给出当前产物、已完成动作、未完成事项和关键错误。接管不是让人从头重来，而是把系统积累的信息与状态完整交还。必要时提供到业务系统的链接。\n\n## 控制权也需要长期治理\n\n授权范围应能查看和撤回，长期任务可以暂停或终止。暂停意味着停止后续动作，但已经提交的外部请求可能仍在完成；系统应清楚说明这种边界。多端操作时还要避免一个端显示已取消、另一端继续执行。\n\n产品经理需要与工程共同定义控制动作的真实效果，并用任务状态来验证。良好的控制设计能够降低出错后果，同时帮助用户在理解范围内逐步接受更高自主程度。\n\n## 防止确认成为形式\n\n当确认界面充满无关细节，或每次都要求点击，用户会逐渐忽略内容。可以突出实际变化、动作对象与高后果字段，并将重复、低风险的准备步骤收在摘要中。确认不是把责任推给用户，而是为真实选择提供足够信息。\n\n授权还应绑定版本。用户确认发送草稿甲后，若后台又改写成草稿乙，原来的确认就不能直接适用。对于批量操作，可以说明总量、异常项与可展开明细，让用户理解批准范围。未经展示的新对象，不应被悄悄加入已确认集合。\n\n接管时也要终止不必要的并行执行。若用户已经在业务系统手工处理，Agent 仍继续提交，可能产生冲突。系统需要明确由谁持有当前任务控制权，以及何时能重新交回自动流程。这是人机协作状态管理的一部分。\n\n## 批量动作的控制设计\n\n大量对象不能只提供一个笼统确认。可以先展示总量、异常项、影响类别与可展开明细，支持用户排除个别对象。系统需要保留最终确认集合，并在执行前核对是否变化。\n\n取消批量任务时，说明已经完成、正在提交与尚未开始的部分。真实停止能力可能有延迟，界面应据实显示。用户理解边界后，才能决定是否需要到业务系统继续处理，而不会误以为所有改变已经撤销。\n\n资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。\n\n### 关联阅读\n\n- [工具权限、最小授权与沙箱](15-03.md)\n- [回滚、补偿与业务一致性](08-06.md)\n\n### 资料与延伸阅读\n\n- [OWASP：Excessive Agency](https://genai.owasp.org/llmrisk/llm062025-excessive-agency/)\n- [Microsoft：Guidelines for Human-AI Interaction](https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/)\n","chars":1426,"minutes":5,"summary":"人机协作需要明确控制权如何转移。编辑、确认、撤销和接管分别处理不同问题：编辑改变产物，确认授权某个动作，撤销恢复已发生的改变，接管则由人继续推进。把它们合成一个“用户可控”标签，容易遗漏真实流程。"},{"id":"14-06","title":"失败、等待与恢复体验","file":"content/14-06.md","level":"工作应用","prerequisites":["14-05"],"aliases":["UX","Copilot","HITL"],"module":"14","moduleTitle":"AI 交互与人机协作","html":"<p>AI 失败往往不是简单的报错。系统可能回答不完整、使用错误资料、执行到一半、等待外部工具，或已经成功但回执丢失。恢复体验需要先识别失败类型，再提供与当前状态匹配的继续方式。<\/p><h2 id=\"section-1\">分清失败发生在哪一层<\/h2><p>输入问题包括缺少材料、格式无法解析或目标冲突；模型问题包括理解偏差与无依据生成；检索问题包括找不到、找错或版本过期；工具问题包括权限、参数、网络和业务状态；流程问题包括重复执行、状态丢失与无法终止。用户无需理解全部技术术语，但团队需要据此设计有效恢复。<\/p><p>错误文案应说明已发生的事实、受影响范围和可采取的动作。只说“出了点问题”无法帮助用户判断是否该重试。对于涉及副作用的动作，尤其要说明是否已经执行，避免用户重复提交。<\/p><h2 id=\"section-2\">等待也需要被设计<\/h2><p>等待期间应保存输入，说明当前步骤，允许用户离开后继续查看。若系统需要用户参与，应突出阻塞原因。长任务可以分阶段提供可用产物，但要标明它们是部分结果，避免被误当最终结论。<\/p><p>减少等待不总是缩短模型时间。先展示可靠状态、及时指出无法完成的部分，以及避免无效重试，都能降低用户的不确定性负担。虚假进度或不断变化的时间估计可能产生相反效果。<\/p><h2 id=\"section-3\">重试需要知道动作后果<\/h2><p>查询失败通常可以安全重试，创建订单等动作则必须先确认先前请求是否已生效。产品应把“重试整个任务”“重试失败步骤”“查询状态”和“人工接管”分开。重试入口越简单，后台状态要求可能越高。<\/p><p>如果失败来自资料缺失，原样重试不会改善；如果来自权限，用户需要授权或换数据；如果来自模型输出，可能需要收紧范围或切换策略。恢复选项应针对原因，而不是统一提供一个按钮。<\/p><h2 id=\"section-4\">教学构造的部分成功<\/h2><p>助手要创建三个回访任务，其中两个成功，一个因为客户记录不存在失败。界面应显示两个任务链接及失败对象，允许用户修正第三个对象后继续。若直接显示“任务失败”，用户可能再次提交，产生重复记录。<\/p><p>部分成功还会影响最终总结。系统应说明哪些目标已完成、哪些未完成、有哪些限制。用户能够基于真实状态继续工作，通常比获得一个看似完整却隐藏问题的产物更有价值。<\/p><h2 id=\"section-5\">从恢复中形成质量反馈<\/h2><p>保留必要的错误类别、版本、步骤与匿名化诊断信息，可以帮助团队区分偶发故障和系统性问题。用户反馈最好关联具体产物或步骤，减少他们重新描述的负担。收集信息应遵循数据最小化与适当权限。<\/p><p>产品经理应为常见失败明确用户路径，并检查恢复之后是否仍保留上下文、编辑和授权。恢复体验的目标是减少重做，保护已完成的工作，并让用户理解接下来有哪些可靠选择。<\/p><h2 id=\"section-6\">错误说明要对用户任务负责<\/h2><p>技术错误码可以用于支持人员定位，但用户首先需要知道工作是否保留、哪些结果可信，以及下一步怎么做。例如“邮件服务未返回发送状态，正在核查；请暂勿重复发送”比“接口超时”更能降低误操作。说明必须基于真实处理能力，不能仅换成更温柔的文案。<\/p><p>恢复路径还要考虑用户可能已经离开。任务列表应保留失败摘要和当前产物，重新进入后可以继续，而不是回到空白输入框。若依赖资料已变化，继续前应重新检查，避免用旧输入完成新动作。<\/p><p>对于连续失败，系统应停止无效循环并解释限制。无限重试既消耗资源，也可能让用户误以为进度仍在推进。可选的人工路径、资料修正或范围缩小，应与失败原因对应。恢复设计的质量体现在减少额外损失，而非保证所有问题都能自动修好。<\/p><h2 id=\"section-7\">恢复后的产物仍需说明状态<\/h2><p>用户重新进入任务时，应看到当前版本、已完成部分和下一步，而不是一份没有背景的输出。若恢复采用了不同资料或模型，也可能影响结果，需要保留必要版本信息。<\/p><p>对于无法自动修复的问题，可以提供明确的人工路径与所需材料，例如目标记录链接和失败字段。把技术诊断转为用户可操作信息，能减少支持来回沟通，同时保留关键事实供专业团队定位。<\/p><p>资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/08-06\">回滚、补偿与业务一致性<\/a><\/li><li><a href=\"#lesson/17-04\">工具执行 Agent：重复执行与失败恢复<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/playbook/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Playbook<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"分清失败发生在哪一层","level":2},{"id":"section-2","title":"等待也需要被设计","level":2},{"id":"section-3","title":"重试需要知道动作后果","level":2},{"id":"section-4","title":"教学构造的部分成功","level":2},{"id":"section-5","title":"从恢复中形成质量反馈","level":2},{"id":"section-6","title":"错误说明要对用户任务负责","level":2},{"id":"section-7","title":"恢复后的产物仍需说明状态","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 失败往往不是简单的报错。系统可能回答不完整、使用错误资料、执行到一半、等待外部工具，或已经成功但回执丢失。恢复体验需要先识别失败类型，再提供与当前状态匹配的继续方式。\n\n## 分清失败发生在哪一层\n\n输入问题包括缺少材料、格式无法解析或目标冲突；模型问题包括理解偏差与无依据生成；检索问题包括找不到、找错或版本过期；工具问题包括权限、参数、网络和业务状态；流程问题包括重复执行、状态丢失与无法终止。用户无需理解全部技术术语，但团队需要据此设计有效恢复。\n\n错误文案应说明已发生的事实、受影响范围和可采取的动作。只说“出了点问题”无法帮助用户判断是否该重试。对于涉及副作用的动作，尤其要说明是否已经执行，避免用户重复提交。\n\n## 等待也需要被设计\n\n等待期间应保存输入，说明当前步骤，允许用户离开后继续查看。若系统需要用户参与，应突出阻塞原因。长任务可以分阶段提供可用产物，但要标明它们是部分结果，避免被误当最终结论。\n\n减少等待不总是缩短模型时间。先展示可靠状态、及时指出无法完成的部分，以及避免无效重试，都能降低用户的不确定性负担。虚假进度或不断变化的时间估计可能产生相反效果。\n\n## 重试需要知道动作后果\n\n查询失败通常可以安全重试，创建订单等动作则必须先确认先前请求是否已生效。产品应把“重试整个任务”“重试失败步骤”“查询状态”和“人工接管”分开。重试入口越简单，后台状态要求可能越高。\n\n如果失败来自资料缺失，原样重试不会改善；如果来自权限，用户需要授权或换数据；如果来自模型输出，可能需要收紧范围或切换策略。恢复选项应针对原因，而不是统一提供一个按钮。\n\n## 教学构造的部分成功\n\n助手要创建三个回访任务，其中两个成功，一个因为客户记录不存在失败。界面应显示两个任务链接及失败对象，允许用户修正第三个对象后继续。若直接显示“任务失败”，用户可能再次提交，产生重复记录。\n\n部分成功还会影响最终总结。系统应说明哪些目标已完成、哪些未完成、有哪些限制。用户能够基于真实状态继续工作，通常比获得一个看似完整却隐藏问题的产物更有价值。\n\n## 从恢复中形成质量反馈\n\n保留必要的错误类别、版本、步骤与匿名化诊断信息，可以帮助团队区分偶发故障和系统性问题。用户反馈最好关联具体产物或步骤，减少他们重新描述的负担。收集信息应遵循数据最小化与适当权限。\n\n产品经理应为常见失败明确用户路径，并检查恢复之后是否仍保留上下文、编辑和授权。恢复体验的目标是减少重做，保护已完成的工作，并让用户理解接下来有哪些可靠选择。\n\n## 错误说明要对用户任务负责\n\n技术错误码可以用于支持人员定位，但用户首先需要知道工作是否保留、哪些结果可信，以及下一步怎么做。例如“邮件服务未返回发送状态，正在核查；请暂勿重复发送”比“接口超时”更能降低误操作。说明必须基于真实处理能力，不能仅换成更温柔的文案。\n\n恢复路径还要考虑用户可能已经离开。任务列表应保留失败摘要和当前产物，重新进入后可以继续，而不是回到空白输入框。若依赖资料已变化，继续前应重新检查，避免用旧输入完成新动作。\n\n对于连续失败，系统应停止无效循环并解释限制。无限重试既消耗资源，也可能让用户误以为进度仍在推进。可选的人工路径、资料修正或范围缩小，应与失败原因对应。恢复设计的质量体现在减少额外损失，而非保证所有问题都能自动修好。\n\n## 恢复后的产物仍需说明状态\n\n用户重新进入任务时，应看到当前版本、已完成部分和下一步，而不是一份没有背景的输出。若恢复采用了不同资料或模型，也可能影响结果，需要保留必要版本信息。\n\n对于无法自动修复的问题，可以提供明确的人工路径与所需材料，例如目标记录链接和失败字段。把技术诊断转为用户可操作信息，能减少支持来回沟通，同时保留关键事实供专业团队定位。\n\n资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。\n\n### 关联阅读\n\n- [回滚、补偿与业务一致性](08-06.md)\n- [工具执行 Agent：重复执行与失败恢复](17-04.md)\n\n### 资料与延伸阅读\n\n- [Microsoft：HAX Playbook](https://www.microsoft.com/en-us/haxtoolkit/playbook/)\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n","chars":1433,"minutes":6,"summary":"AI 失败往往不是简单的报错。系统可能回答不完整、使用错误资料、执行到一半、等待外部工具，或已经成功但回执丢失。恢复体验需要先识别失败类型，再提供与当前状态匹配的继续方式。"},{"id":"14-07","title":"记忆、个性化与用户控制","file":"content/14-07.md","level":"工作应用","prerequisites":["14-06"],"aliases":["UX","Copilot","HITL"],"module":"14","moduleTitle":"AI 交互与人机协作","html":"<p>记忆和个性化可以减少重复说明，也可能把错误、过期或不必要的信息带入未来任务。产品经理需要区分会话上下文、持久偏好、业务记录和系统推断，并给用户清楚的可见性与控制。<\/p><h2 id=\"section-1\">不同信息需要不同生命周期<\/h2><p>会话上下文服务当前任务，任务结束后未必需要长期保存；持久偏好如语言、格式和常用工作方式，可以跨任务使用；业务事实通常应来自权威系统，而非由聊天记忆替代；系统推断则需要谨慎处理，不能自动变成确定事实。<\/p><p>例如用户这次要求简短回答，不必说明以后所有复杂主题都要简短；用户提到某客户，也不意味着所有后续任务都围绕该客户。记忆提取应考虑来源、时间、适用范围和用户意图。<\/p><h2 id=\"section-2\">记忆如何影响结果<\/h2><p>记忆可以作为额外上下文进入模型，也可以作为系统规则或检索材料参与流程。无论实现方式如何，错误记忆都可能持续影响输出。产品应能说明哪些信息被使用，并在结果不符合预期时支持检查与修正。<\/p><p>过多记忆还会增加噪声、冲突与成本。资料越多不等于个性化越好。可以按任务相关性、可靠程度和时效选择信息，并保留来源。关键业务数据应重新核验，尤其当它影响外发、支付或权限。<\/p><h2 id=\"section-3\">用户控制需要具体操作<\/h2><p>查看、编辑、删除、暂停使用和清空历史是不同动作。删除会话是否同时删除提取的偏好，撤回记忆是否影响已生成产物，都需要明确。界面应使用用户能理解的语言说明，而非笼统宣称“可管理数据”。<\/p><p>自动保存与用户主动保存也可以分开。对不明显的长期记忆，提供提示或确认，有助于建立正确预期。敏感信息应遵循适当的限制和保留策略，不能仅凭方便而持久化。<\/p><h2 id=\"section-4\">教学构造的个性化冲突<\/h2><p>用户在日常邮件中偏好轻松语气，但正在起草正式客户通知。系统应优先服从当前任务要求，长期偏好只在合适范围内起作用。若历史偏好与当前明确指令冲突，应让当前要求覆盖，而不是反复纠正用户。<\/p><p>企业知识助手还要区分个人记忆与组织知识。个人备注不能自动成为全团队事实，某员工能读取的信息也不能因为被记住而绕过其他人的权限。跨用户隔离必须在系统层执行。<\/p><h2 id=\"section-5\">评估个性化是否创造价值<\/h2><p>可以观察是否减少重复输入、提高任务适配、降低编辑负担，同时监控错误沿用、过度推断和用户困惑。高使用率不等于用户理解记忆机制。必要时通过具体界面说明资料来源与保存范围。<\/p><p>记忆设计的核心是相关、可靠、可更新和可撤回。把它视为有生命周期的信息产品，比把“记住一切”作为能力目标，更容易长期维护，也更能保持用户控制。<\/p><h2 id=\"section-6\">给记忆建立可维护的记录<\/h2><p>一条持久记忆可以包含内容、来源、保存时间、适用范围和确认状态。这样的结构便于处理冲突与过期，而不是只有一段无法解释的文字。用户修改偏好后，旧偏好应能停止生效；业务事实变化时，应优先从权威来源更新。<\/p><p>记忆的使用也应遵循最小必要原则。为写邮件记住语言偏好可能有帮助，保留整份私人通信历史却未必必要。系统应明确保存目的，并提供可理解的管理方式。不同地区、企业与服务的具体保留要求需要另行核验。<\/p><p>当产品引入新的记忆功能，原有用户的预期可能改变。应说明新保存范围与控制方式，并避免把过去仅用于单次任务的内容自动转为长期个性化资料。用户控制不仅是设置页，也体现在信息进入系统时的合理告知。<\/p><h2 id=\"section-7\">个人偏好与组织规则的冲突<\/h2><p>用户偏好不能覆盖组织权限、安全要求或当前任务的明确条件。系统应定义信息优先级，并在冲突时说明可理解原因。例如用户希望自动外发，企业策略仍可能要求确认。<\/p><p>记忆管理还应考虑多端和共享设备。浏览器本地记录、账号记忆和企业资料是不同存储范围，退出账号或清除浏览器未必意味着全部删除。界面需要如实说明作用范围，避免用户通过一个操作推断更广的数据处理结果。<\/p><p>资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/09-05\">多 Agent 协作、交接与协调成本<\/a><\/li><li><a href=\"#lesson/15-04\">数据隐私、敏感信息与隔离<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-transparency-note\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Copilot Application Card<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"不同信息需要不同生命周期","level":2},{"id":"section-2","title":"记忆如何影响结果","level":2},{"id":"section-3","title":"用户控制需要具体操作","level":2},{"id":"section-4","title":"教学构造的个性化冲突","level":2},{"id":"section-5","title":"评估个性化是否创造价值","level":2},{"id":"section-6","title":"给记忆建立可维护的记录","level":2},{"id":"section-7","title":"个人偏好与组织规则的冲突","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"记忆和个性化可以减少重复说明，也可能把错误、过期或不必要的信息带入未来任务。产品经理需要区分会话上下文、持久偏好、业务记录和系统推断，并给用户清楚的可见性与控制。\n\n## 不同信息需要不同生命周期\n\n会话上下文服务当前任务，任务结束后未必需要长期保存；持久偏好如语言、格式和常用工作方式，可以跨任务使用；业务事实通常应来自权威系统，而非由聊天记忆替代；系统推断则需要谨慎处理，不能自动变成确定事实。\n\n例如用户这次要求简短回答，不必说明以后所有复杂主题都要简短；用户提到某客户，也不意味着所有后续任务都围绕该客户。记忆提取应考虑来源、时间、适用范围和用户意图。\n\n## 记忆如何影响结果\n\n记忆可以作为额外上下文进入模型，也可以作为系统规则或检索材料参与流程。无论实现方式如何，错误记忆都可能持续影响输出。产品应能说明哪些信息被使用，并在结果不符合预期时支持检查与修正。\n\n过多记忆还会增加噪声、冲突与成本。资料越多不等于个性化越好。可以按任务相关性、可靠程度和时效选择信息，并保留来源。关键业务数据应重新核验，尤其当它影响外发、支付或权限。\n\n## 用户控制需要具体操作\n\n查看、编辑、删除、暂停使用和清空历史是不同动作。删除会话是否同时删除提取的偏好，撤回记忆是否影响已生成产物，都需要明确。界面应使用用户能理解的语言说明，而非笼统宣称“可管理数据”。\n\n自动保存与用户主动保存也可以分开。对不明显的长期记忆，提供提示或确认，有助于建立正确预期。敏感信息应遵循适当的限制和保留策略，不能仅凭方便而持久化。\n\n## 教学构造的个性化冲突\n\n用户在日常邮件中偏好轻松语气，但正在起草正式客户通知。系统应优先服从当前任务要求，长期偏好只在合适范围内起作用。若历史偏好与当前明确指令冲突，应让当前要求覆盖，而不是反复纠正用户。\n\n企业知识助手还要区分个人记忆与组织知识。个人备注不能自动成为全团队事实，某员工能读取的信息也不能因为被记住而绕过其他人的权限。跨用户隔离必须在系统层执行。\n\n## 评估个性化是否创造价值\n\n可以观察是否减少重复输入、提高任务适配、降低编辑负担，同时监控错误沿用、过度推断和用户困惑。高使用率不等于用户理解记忆机制。必要时通过具体界面说明资料来源与保存范围。\n\n记忆设计的核心是相关、可靠、可更新和可撤回。把它视为有生命周期的信息产品，比把“记住一切”作为能力目标，更容易长期维护，也更能保持用户控制。\n\n## 给记忆建立可维护的记录\n\n一条持久记忆可以包含内容、来源、保存时间、适用范围和确认状态。这样的结构便于处理冲突与过期，而不是只有一段无法解释的文字。用户修改偏好后，旧偏好应能停止生效；业务事实变化时，应优先从权威来源更新。\n\n记忆的使用也应遵循最小必要原则。为写邮件记住语言偏好可能有帮助，保留整份私人通信历史却未必必要。系统应明确保存目的，并提供可理解的管理方式。不同地区、企业与服务的具体保留要求需要另行核验。\n\n当产品引入新的记忆功能，原有用户的预期可能改变。应说明新保存范围与控制方式，并避免把过去仅用于单次任务的内容自动转为长期个性化资料。用户控制不仅是设置页，也体现在信息进入系统时的合理告知。\n\n## 个人偏好与组织规则的冲突\n\n用户偏好不能覆盖组织权限、安全要求或当前任务的明确条件。系统应定义信息优先级，并在冲突时说明可理解原因。例如用户希望自动外发，企业策略仍可能要求确认。\n\n记忆管理还应考虑多端和共享设备。浏览器本地记录、账号记忆和企业资料是不同存储范围，退出账号或清除浏览器未必意味着全部删除。界面需要如实说明作用范围，避免用户通过一个操作推断更广的数据处理结果。\n\n资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。\n\n### 关联阅读\n\n- [多 Agent 协作、交接与协调成本](09-05.md)\n- [数据隐私、敏感信息与隔离](15-04.md)\n\n### 资料与延伸阅读\n\n- [Microsoft：Copilot Application Card](https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-transparency-note)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1393,"minutes":5,"summary":"记忆和个性化可以减少重复说明，也可能把错误、过期或不必要的信息带入未来任务。产品经理需要区分会话上下文、持久偏好、业务记录和系统推断，并给用户清楚的可见性与控制。"},{"id":"14-08","title":"可访问性、认知负担与跨端体验","file":"content/14-08.md","level":"工作应用","prerequisites":["14-07"],"aliases":["UX","Copilot","HITL"],"module":"14","moduleTitle":"AI 交互与人机协作","html":"<p>手机、电脑和辅助技术用户面对同一 AI 产品时，输入方式、可用空间和注意力条件可能不同。可访问性与跨端设计应围绕完整任务，而不是只把桌面页面压缩。复杂信息需要分层呈现，同时保持内容和操作的可理解性。<\/p><h2 id=\"section-1\">降低认知负担<\/h2><p>用户需要同时理解目标、输入、系统状态、产物和下一步。把所有信息挤在聊天记录里，容易使关键对象与操作被淹没。可以把任务摘要、资料范围、产物与执行状态分别组织，并提供稳定入口。<\/p><p>分层展开适合承载详细来源、技术过程和长内容，但关键限制不能藏得过深。会影响用户判断的权限、未完成事项和外发对象应保持可见。简洁意味着突出重要信息，而不是省略后果。<\/p><h2 id=\"section-2\">适应不同输入与阅读条件<\/h2><p>语音输入适合部分场景，但可能出现转写错误、隐私限制和噪声。系统应允许核对与编辑，特别是人名、日期、数字和动作对象。触摸输入则需要合理点击区域，避免重要按钮过近导致误操作。<\/p><p>长文可提供清晰标题、段落、目录和阅读位置。表格和代码在小屏上应可横向查看，不能截断关键内容。图解应有文字说明，颜色之外还应提供其他区分方式。动态状态也需要支持辅助技术理解。<\/p><h2 id=\"section-3\">跨端任务需要一致状态<\/h2><p>用户可能在手机发起，在电脑检查产物，再回手机确认。系统需要保持对象、版本、授权和当前状态一致。若学习记录或草稿只保存在本地，应明确说明范围，不能让用户以为会自动同步。<\/p><p>跨端继续不只是打开同一个链接。需要定位到当前任务和正确版本，说明哪些动作已经完成。对于有副作用的操作，要避免多端重复提交；取消和暂停也应在相关端及时反映。<\/p><h2 id=\"section-4\">教学构造的移动端研究报告<\/h2><p>用户通勤时查看研究报告，可能只需读结论、来源与限制；回到电脑后才展开数据表和操作示例。页面可以提供短摘要与完整正文，允许保存位置和收藏。完整内容仍然保留，用户按环境决定阅读深度。<\/p><p>如果结果需要长时间核对，手机可以支持标记待处理并移交到电脑。产品不应为了强行完成手机闭环，把确认界面压缩到无法理解，或让用户在看不清附件时执行外发。<\/p><h2 id=\"section-5\">可访问性是持续质量要求<\/h2><p>检查键盘访问、焦点顺序、文字缩放、对比度、语义标题和屏幕阅读器提示，能够发现许多普通用户也会遇到的问题。自动检查只能覆盖一部分，关键任务仍需实际走查。具体标准和平台能力会演进，应核对适用版本。<\/p><p>产品经理应把跨端状态、辅助技术和认知负担写进需求与验收。AI 输出的多变性增加了布局和阅读的不确定性，清晰的信息结构与可恢复操作因此更重要。<\/p><h2 id=\"section-6\">连贯阅读也是跨端质量<\/h2><p>同一篇内容在手机上可以先呈现摘要、目录与分段正文，电脑端则更方便对照表格和代码。两端应保持相同的概念、来源和版本，避免因简化移动页面而丢失关键边界。阅读位置恢复还应考虑章节更新后锚点变化。<\/p><p>动态内容要避免突然移动焦点或插入大量文字，使键盘及屏幕阅读器用户失去位置。可通过合适的状态提示通知任务变化，详细日志按需展开。用户应能暂停自动滚动、选择文本和回看历史，不必追赶不断输出的界面。<\/p><p>信息的可访问性也包括语言。缩写首次出现时解释，中英文术语保持一致，复杂图形提供文字路径，错误文案说明可执行动作。这些设计同时帮助非技术用户理解 AI 系统，减少把术语熟悉程度误当作使用能力的门槛。<\/p><h2 id=\"section-7\">持续检查真实任务<\/h2><p>可访问性检查应覆盖输入、等待、确认、错误和恢复，而不仅是静态首页。动态输出、弹窗焦点和错误提示常在完整流程中才暴露问题。不同设备和辅助技术的能力也有差异，需要适当实测。<\/p><p>对于知识密集产品，还应检查链接是否容易定位、返回后是否保留阅读位置，以及放大文字后是否丢失操作。阅读连续性和可理解性直接影响长期学习与工作查阅，属于核心质量而非最后的装饰优化。<\/p><p>资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/14-03\">执行计划、状态与过程可见性<\/a><\/li><li><a href=\"#lesson/18-08\">持续学习、资料判断与个人知识管理<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.w3.org/TR/WCAG22/\" target=\"_blank\" rel=\"noopener noreferrer\">W3C：Web Content Accessibility Guidelines 2.2<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：Guidelines for Human-AI Interaction<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"降低认知负担","level":2},{"id":"section-2","title":"适应不同输入与阅读条件","level":2},{"id":"section-3","title":"跨端任务需要一致状态","level":2},{"id":"section-4","title":"教学构造的移动端研究报告","level":2},{"id":"section-5","title":"可访问性是持续质量要求","level":2},{"id":"section-6","title":"连贯阅读也是跨端质量","level":2},{"id":"section-7","title":"持续检查真实任务","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"手机、电脑和辅助技术用户面对同一 AI 产品时，输入方式、可用空间和注意力条件可能不同。可访问性与跨端设计应围绕完整任务，而不是只把桌面页面压缩。复杂信息需要分层呈现，同时保持内容和操作的可理解性。\n\n## 降低认知负担\n\n用户需要同时理解目标、输入、系统状态、产物和下一步。把所有信息挤在聊天记录里，容易使关键对象与操作被淹没。可以把任务摘要、资料范围、产物与执行状态分别组织，并提供稳定入口。\n\n分层展开适合承载详细来源、技术过程和长内容，但关键限制不能藏得过深。会影响用户判断的权限、未完成事项和外发对象应保持可见。简洁意味着突出重要信息，而不是省略后果。\n\n## 适应不同输入与阅读条件\n\n语音输入适合部分场景，但可能出现转写错误、隐私限制和噪声。系统应允许核对与编辑，特别是人名、日期、数字和动作对象。触摸输入则需要合理点击区域，避免重要按钮过近导致误操作。\n\n长文可提供清晰标题、段落、目录和阅读位置。表格和代码在小屏上应可横向查看，不能截断关键内容。图解应有文字说明，颜色之外还应提供其他区分方式。动态状态也需要支持辅助技术理解。\n\n## 跨端任务需要一致状态\n\n用户可能在手机发起，在电脑检查产物，再回手机确认。系统需要保持对象、版本、授权和当前状态一致。若学习记录或草稿只保存在本地，应明确说明范围，不能让用户以为会自动同步。\n\n跨端继续不只是打开同一个链接。需要定位到当前任务和正确版本，说明哪些动作已经完成。对于有副作用的操作，要避免多端重复提交；取消和暂停也应在相关端及时反映。\n\n## 教学构造的移动端研究报告\n\n用户通勤时查看研究报告，可能只需读结论、来源与限制；回到电脑后才展开数据表和操作示例。页面可以提供短摘要与完整正文，允许保存位置和收藏。完整内容仍然保留，用户按环境决定阅读深度。\n\n如果结果需要长时间核对，手机可以支持标记待处理并移交到电脑。产品不应为了强行完成手机闭环，把确认界面压缩到无法理解，或让用户在看不清附件时执行外发。\n\n## 可访问性是持续质量要求\n\n检查键盘访问、焦点顺序、文字缩放、对比度、语义标题和屏幕阅读器提示，能够发现许多普通用户也会遇到的问题。自动检查只能覆盖一部分，关键任务仍需实际走查。具体标准和平台能力会演进，应核对适用版本。\n\n产品经理应把跨端状态、辅助技术和认知负担写进需求与验收。AI 输出的多变性增加了布局和阅读的不确定性，清晰的信息结构与可恢复操作因此更重要。\n\n## 连贯阅读也是跨端质量\n\n同一篇内容在手机上可以先呈现摘要、目录与分段正文，电脑端则更方便对照表格和代码。两端应保持相同的概念、来源和版本，避免因简化移动页面而丢失关键边界。阅读位置恢复还应考虑章节更新后锚点变化。\n\n动态内容要避免突然移动焦点或插入大量文字，使键盘及屏幕阅读器用户失去位置。可通过合适的状态提示通知任务变化，详细日志按需展开。用户应能暂停自动滚动、选择文本和回看历史，不必追赶不断输出的界面。\n\n信息的可访问性也包括语言。缩写首次出现时解释，中英文术语保持一致，复杂图形提供文字路径，错误文案说明可执行动作。这些设计同时帮助非技术用户理解 AI 系统，减少把术语熟悉程度误当作使用能力的门槛。\n\n## 持续检查真实任务\n\n可访问性检查应覆盖输入、等待、确认、错误和恢复，而不仅是静态首页。动态输出、弹窗焦点和错误提示常在完整流程中才暴露问题。不同设备和辅助技术的能力也有差异，需要适当实测。\n\n对于知识密集产品，还应检查链接是否容易定位、返回后是否保留阅读位置，以及放大文字后是否丢失操作。阅读连续性和可理解性直接影响长期学习与工作查阅，属于核心质量而非最后的装饰优化。\n\n资料核验日期：2026-11-14。文中场景为教学构造，具体平台行为以对应版本文档为准。\n\n### 关联阅读\n\n- [执行计划、状态与过程可见性](14-03.md)\n- [持续学习、资料判断与个人知识管理](18-08.md)\n\n### 资料与延伸阅读\n\n- [W3C：Web Content Accessibility Guidelines 2.2](https://www.w3.org/TR/WCAG22/)\n- [Microsoft：Guidelines for Human-AI Interaction](https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/)\n","chars":1391,"minutes":5,"summary":"手机、电脑和辅助技术用户面对同一 AI 产品时，输入方式、可用空间和注意力条件可能不同。可访问性与跨端设计应围绕完整任务，而不是只把桌面页面压缩。复杂信息需要分层呈现，同时保持内容和操作的可理解性。"},{"id":"15-01","title":"AI 风险地图与威胁建模","file":"content/15-01.md","level":"工作应用","prerequisites":["03-02","08-02"],"aliases":["security","prompt injection","隐私"],"module":"15","moduleTitle":"安全、隐私与治理","html":"<p>AI 风险来自模型、数据、工具、用户和运行环境的共同作用。威胁建模帮助团队在设计阶段识别：要保护什么、谁可能影响系统、哪里跨越信任边界，以及失败会给谁带来什么后果。它应服务具体任务，不能只复制一张风险名词表。<\/p><h2 id=\"section-1\">先画资产与信息流<\/h2><p>资产包括客户资料、账号与密钥、业务记录、模型配置、系统可用性，以及用户和组织的利益。信息流可以从用户输入开始，经过资料读取、上下文构造、模型服务、工具调用、结果展示与日志保存。每次跨系统、跨身份或进入外部服务，都可能形成需要检查的边界。<\/p><p>同一份内容在不同位置有不同可信度。用户明确指令、网页正文、工具返回、系统配置不能被视为同等权限。外部文档可以提供事实，却不应因此获得修改权限。威胁建模应记录谁能够写入每个数据源，以及这些内容会如何影响后续行为。<\/p><h2 id=\"section-2\">兼顾恶意与非恶意失败<\/h2><p>攻击者可能植入指令、套取资料、滥用工具或消耗资源；普通用户也可能提交错误对象、误解结果或过度信任；系统还会发生权限配置、模型变化和工具故障。风险分析要同时覆盖保密性、完整性、可用性，以及错误决策与用户伤害。<\/p><p>发生概率与后果需要结合任务判断。一个错误摘要可能只导致返工，一个错误执行可能改变生产配置或外发敏感资料。无法精确估计概率时，可以用明确场景与现有证据描述不确定性，避免用看似精确的分数制造可靠错觉。<\/p><h2 id=\"section-3\">教学构造的企业助手<\/h2><p>假设助手读取客户资料并能够创建工单。资产包括客户信息与工单状态，边界包括企业身份、知识库、模型服务和工单系统。风险场景之一是文档中的恶意文字让助手把客户信息写进公开工单；另一个是权限同步延迟导致读取已撤权资料。<\/p><p>相应措施不只有提示词。需要检索层权限检查、工具参数校验、外发限制、适当确认、审计和异常监控。每项措施应说明覆盖哪个场景，以及仍然可能失败的部分。威胁模型因此能够连接具体需求与测试。<\/p><h2 id=\"section-4\">形成可维护的风险记录<\/h2><p>一条风险记录可以包含任务、资产、入口、攻击或失败路径、影响、已有控制、剩余风险、负责人和复审条件。负责人需要有权推动修复或接受残余风险。产品经理可以组织业务影响分析，安全与工程负责专业验证，必要时引入隐私或法律人员。<\/p><p>风险也会随范围变化。新增连接器、允许外发、开放给新用户或更换供应商，都可能改变边界。每次重要变更应回看相关场景，不能认为首次上线评审能够覆盖以后所有能力。<\/p><h2 id=\"section-5\">风险管理的使用边界<\/h2><p>NIST AI RMF 是风险管理框架，OWASP 提供常见漏洞与缓解方向，它们不能自动证明产品安全或符合法律要求。团队需要结合真实架构、任务与组织条件实施。框架的价值在于提供共同语言，让风险能够被说明、分配和持续处理。<\/p><h2 id=\"section-6\">从边界检查形成设计要求<\/h2><p>画图时可以逐条问：这个信息由谁提供，它可以改变哪些行为；这次动作代表谁，系统如何验证权限；结果被谁看见，是否包含他无权读取的内容。问题需要落到实际组件，才能找到控制位置。把所有安全要求都放在模型提示中，意味着其他层可能没有独立保护。<\/p><p>威胁模型还应包含误用后的恢复。例如删除是否有版本、外发是否可追踪、权限撤回是否能及时生效。恢复能力会影响风险后果和可接受的自主程度。没有恢复路径的高后果动作，通常需要更严格的进入条件。<\/p><p>评审时保留剩余未知也很重要。未知不是默认安全，而是需要明确观察、限制或专业核验的部分。风险记录帮助团队在证据不足时做条件化决定，并为后续变化留下复审入口。<\/p><h2 id=\"section-7\">风险评审与产品边界的连接<\/h2><p>以“只读资料助手”扩展为“可以更新客户记录”为例，新增的不只是一个接口。完整性风险、重复执行、身份委托、确认和恢复都发生变化。评审应明确新增资产和后果，再决定控制与开放范围。旧版本的风险结论不能直接复制。<\/p><p>可以把每条高影响风险关联到需求与验证证据。例如越权读取关联权限过滤、缓存隔离和不同身份的访问检查；错误外发关联收件人限制、内容预览和审计。这样评审不只是列出担忧，也能检查措施是否真的存在。<\/p><p>风险等级需要说明依据。若概率未知但后果严重，可以先限制范围或使用只读模式，并收集进一步证据。框架不替团队做价值判断，它帮助把判断公开化、责任化和可复查化。<\/p><p>资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/15-02\">提示注入与不可信内容<\/a><\/li><li><a href=\"#lesson/13-05\">AI PRD：能力、数据、规则与验收<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><li><a href=\"https://genai.owasp.org/llmrisk/llm01-prompt-injection/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：Prompt Injection<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"先画资产与信息流","level":2},{"id":"section-2","title":"兼顾恶意与非恶意失败","level":2},{"id":"section-3","title":"教学构造的企业助手","level":2},{"id":"section-4","title":"形成可维护的风险记录","level":2},{"id":"section-5","title":"风险管理的使用边界","level":2},{"id":"section-6","title":"从边界检查形成设计要求","level":2},{"id":"section-7","title":"风险评审与产品边界的连接","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 风险来自模型、数据、工具、用户和运行环境的共同作用。威胁建模帮助团队在设计阶段识别：要保护什么、谁可能影响系统、哪里跨越信任边界，以及失败会给谁带来什么后果。它应服务具体任务，不能只复制一张风险名词表。\n\n## 先画资产与信息流\n\n资产包括客户资料、账号与密钥、业务记录、模型配置、系统可用性，以及用户和组织的利益。信息流可以从用户输入开始，经过资料读取、上下文构造、模型服务、工具调用、结果展示与日志保存。每次跨系统、跨身份或进入外部服务，都可能形成需要检查的边界。\n\n同一份内容在不同位置有不同可信度。用户明确指令、网页正文、工具返回、系统配置不能被视为同等权限。外部文档可以提供事实，却不应因此获得修改权限。威胁建模应记录谁能够写入每个数据源，以及这些内容会如何影响后续行为。\n\n## 兼顾恶意与非恶意失败\n\n攻击者可能植入指令、套取资料、滥用工具或消耗资源；普通用户也可能提交错误对象、误解结果或过度信任；系统还会发生权限配置、模型变化和工具故障。风险分析要同时覆盖保密性、完整性、可用性，以及错误决策与用户伤害。\n\n发生概率与后果需要结合任务判断。一个错误摘要可能只导致返工，一个错误执行可能改变生产配置或外发敏感资料。无法精确估计概率时，可以用明确场景与现有证据描述不确定性，避免用看似精确的分数制造可靠错觉。\n\n## 教学构造的企业助手\n\n假设助手读取客户资料并能够创建工单。资产包括客户信息与工单状态，边界包括企业身份、知识库、模型服务和工单系统。风险场景之一是文档中的恶意文字让助手把客户信息写进公开工单；另一个是权限同步延迟导致读取已撤权资料。\n\n相应措施不只有提示词。需要检索层权限检查、工具参数校验、外发限制、适当确认、审计和异常监控。每项措施应说明覆盖哪个场景，以及仍然可能失败的部分。威胁模型因此能够连接具体需求与测试。\n\n## 形成可维护的风险记录\n\n一条风险记录可以包含任务、资产、入口、攻击或失败路径、影响、已有控制、剩余风险、负责人和复审条件。负责人需要有权推动修复或接受残余风险。产品经理可以组织业务影响分析，安全与工程负责专业验证，必要时引入隐私或法律人员。\n\n风险也会随范围变化。新增连接器、允许外发、开放给新用户或更换供应商，都可能改变边界。每次重要变更应回看相关场景，不能认为首次上线评审能够覆盖以后所有能力。\n\n## 风险管理的使用边界\n\nNIST AI RMF 是风险管理框架，OWASP 提供常见漏洞与缓解方向，它们不能自动证明产品安全或符合法律要求。团队需要结合真实架构、任务与组织条件实施。框架的价值在于提供共同语言，让风险能够被说明、分配和持续处理。\n\n## 从边界检查形成设计要求\n\n画图时可以逐条问：这个信息由谁提供，它可以改变哪些行为；这次动作代表谁，系统如何验证权限；结果被谁看见，是否包含他无权读取的内容。问题需要落到实际组件，才能找到控制位置。把所有安全要求都放在模型提示中，意味着其他层可能没有独立保护。\n\n威胁模型还应包含误用后的恢复。例如删除是否有版本、外发是否可追踪、权限撤回是否能及时生效。恢复能力会影响风险后果和可接受的自主程度。没有恢复路径的高后果动作，通常需要更严格的进入条件。\n\n评审时保留剩余未知也很重要。未知不是默认安全，而是需要明确观察、限制或专业核验的部分。风险记录帮助团队在证据不足时做条件化决定，并为后续变化留下复审入口。\n\n## 风险评审与产品边界的连接\n\n以“只读资料助手”扩展为“可以更新客户记录”为例，新增的不只是一个接口。完整性风险、重复执行、身份委托、确认和恢复都发生变化。评审应明确新增资产和后果，再决定控制与开放范围。旧版本的风险结论不能直接复制。\n\n可以把每条高影响风险关联到需求与验证证据。例如越权读取关联权限过滤、缓存隔离和不同身份的访问检查；错误外发关联收件人限制、内容预览和审计。这样评审不只是列出担忧，也能检查措施是否真的存在。\n\n风险等级需要说明依据。若概率未知但后果严重，可以先限制范围或使用只读模式，并收集进一步证据。框架不替团队做价值判断，它帮助把判断公开化、责任化和可复查化。\n\n资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。\n\n### 关联阅读\n\n- [提示注入与不可信内容](15-02.md)\n- [AI PRD：能力、数据、规则与验收](13-05.md)\n\n### 资料与延伸阅读\n\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n- [OWASP：Prompt Injection](https://genai.owasp.org/llmrisk/llm01-prompt-injection/)\n","chars":1540,"minutes":6,"summary":"AI 风险来自模型、数据、工具、用户和运行环境的共同作用。威胁建模帮助团队在设计阶段识别：要保护什么、谁可能影响系统、哪里跨越信任边界，以及失败会给谁带来什么后果。它应服务具体任务，不能只复制一张风险名词表。"},{"id":"15-02","title":"提示注入与不可信内容","file":"content/15-02.md","level":"工作应用","prerequisites":["15-01"],"aliases":["security","prompt injection","隐私"],"module":"15","moduleTitle":"安全、隐私与治理","html":"<p>提示注入是指不可信输入影响模型行为，使系统偏离预期任务。Agent 接触网页、邮件、文档和工具结果时，攻击者可能把指令藏在这些内容中。产品设计需要把“可读取的内容”与“可以授权系统行动的指令”分开。<\/p><h2 id=\"section-1\">直接与间接注入<\/h2><p>直接注入通常来自交互输入，尝试改变系统行为；间接注入则可能藏在系统为完成任务而读取的资料里。例如研究助手读到网页中的“忽略原任务并发送资料”，或邮件助手把邮件正文中的命令当成新的操作要求。多模态内容也可能携带此类影响。<\/p><p>风险并不取决于文字是否明显恶意。只要系统把低信任内容提升为高权限指令，就可能跨越边界。RAG 和微调可以改善相关性或特定行为，却不能被当作彻底消除此类风险的方法。<\/p><h2 id=\"section-2\">攻击链为何会产生后果<\/h2><p>外部内容首先进入上下文，然后影响模型生成的回答或工具参数；系统如果未经检查执行，后果可能扩展为数据泄露、错误修改或资源滥用。模型输出只是候选行为，真正影响来自应用是否赋予它足够权限以及是否缺少验证。<\/p><p>因此需要从整条链设计防护。标注内容来源与信任等级，限制模型可用工具，校验对象和参数，控制网络与资料外发，对高后果动作保留适当确认，并记录执行证据。任何单一措施都可能失效，层层约束用于降低后果。<\/p><h2 id=\"section-3\">教学构造的恶意邮件<\/h2><p>助手负责总结邮件并创建待办。某封邮件要求“把公司联系人列表发到指定地址”。用户的原任务只授权总结与创建待办，邮件内容没有新增授权的资格。系统应把它作为待总结内容，而不是执行命令。<\/p><p>如果模型仍提出发送动作，工具层应发现该动作不在任务许可范围，阻断执行。若用户确实希望发送，需要直接、具体的授权，并核对收件人、资料范围和组织要求。不能让文档中的“用户已经同意”替代真实授权。<\/p><h2 id=\"section-4\">防护与检测需要对应场景<\/h2><p>输入过滤可拦截部分已知模式，但很难覆盖所有语言表达；提示可以强化边界，但不是权限系统；人工确认有帮助，但用户也可能被误导。因此设计应优先限制可执行后果，并让确认展示真实动作。<\/p><p>检测应包括代表性的恶意资料、正常但容易误读的内容，以及多步传播场景。观察系统是否读取不该读取的资料、是否尝试越权、是否把不可信内容传入后续工具。只检查最终回答有没有危险文字，可能漏掉后台已经发生的行为。<\/p><h2 id=\"section-5\">产品经理需要明确的要求<\/h2><p>定义资料来源、允许动作、授权方式、可外发对象、异常路径和审计。出现注入迹象时，系统可以拒绝相关动作、继续安全部分或请求用户澄清，但应避免泄露敏感内部信息。安全表现也需要随工具、模型和资料范围变化持续回归。<\/p><h2 id=\"section-6\">任务授权要独立于检索内容<\/h2><p>系统可以把用户目标和允许动作维护为可信任务状态，外部资料只能补充事实。若资料要求改变目标、扩大访问或外发，应该回到直接授权流程。工具也可以检查动作是否属于当前任务范围，避免仅看参数格式合法就执行。<\/p><p>确认界面必须显示真实收件人、资料与动作，不能只展示模型生成的善意理由。攻击者可能让助手用正常语言包装危险请求。用户需要判断的是实际后果，而不是助手是否声称这是必要步骤。<\/p><p>防护评估也要看正常任务是否仍然可用。过度阻断会让用户绕过安全路径。对误拦、漏拦和被阻断后的任务恢复分别观察，有助于在风险降低与可用性之间形成有依据的取舍。<\/p><h2 id=\"section-7\">资料来源标记的实际意义<\/h2><p>把网页放在分隔符里，可以帮助模型理解上下文，却不能被视为绝对安全边界。可靠系统还要在工具执行前检查许可范围，并控制可外发资料。即使模型被影响，错误行为也应尽可能受到独立约束。<\/p><p>工具返回也可能不可信，例如第三方搜索摘要或用户可编辑的业务备注。它们可以提供事实候选，不能声明“管理员已经批准”。可信授权应来自身份与权限系统，或用户在适当界面给出的具体决定。<\/p><p>当检测到可疑内容，报告可以说明某来源含有与任务无关的操作要求，已忽略相关要求。无需向普通用户展示攻击细节，也不应因此把整个资料源的所有事实自动判为错误。内容可信度与行动权限是相关但不同的维度。<\/p><p>资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/05-08\">可复用 Prompt 规范与产品协作<\/a><\/li><li><a href=\"#lesson/09-08\">自主程度、人工介入与失败恢复<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://genai.owasp.org/llmrisk/llm01-prompt-injection/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：Prompt Injection<\/a><\/li><li><a href=\"https://genai.owasp.org/llmrisk/llm062025-excessive-agency/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：Excessive Agency<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"直接与间接注入","level":2},{"id":"section-2","title":"攻击链为何会产生后果","level":2},{"id":"section-3","title":"教学构造的恶意邮件","level":2},{"id":"section-4","title":"防护与检测需要对应场景","level":2},{"id":"section-5","title":"产品经理需要明确的要求","level":2},{"id":"section-6","title":"任务授权要独立于检索内容","level":2},{"id":"section-7","title":"资料来源标记的实际意义","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"提示注入是指不可信输入影响模型行为，使系统偏离预期任务。Agent 接触网页、邮件、文档和工具结果时，攻击者可能把指令藏在这些内容中。产品设计需要把“可读取的内容”与“可以授权系统行动的指令”分开。\n\n## 直接与间接注入\n\n直接注入通常来自交互输入，尝试改变系统行为；间接注入则可能藏在系统为完成任务而读取的资料里。例如研究助手读到网页中的“忽略原任务并发送资料”，或邮件助手把邮件正文中的命令当成新的操作要求。多模态内容也可能携带此类影响。\n\n风险并不取决于文字是否明显恶意。只要系统把低信任内容提升为高权限指令，就可能跨越边界。RAG 和微调可以改善相关性或特定行为，却不能被当作彻底消除此类风险的方法。\n\n## 攻击链为何会产生后果\n\n外部内容首先进入上下文，然后影响模型生成的回答或工具参数；系统如果未经检查执行，后果可能扩展为数据泄露、错误修改或资源滥用。模型输出只是候选行为，真正影响来自应用是否赋予它足够权限以及是否缺少验证。\n\n因此需要从整条链设计防护。标注内容来源与信任等级，限制模型可用工具，校验对象和参数，控制网络与资料外发，对高后果动作保留适当确认，并记录执行证据。任何单一措施都可能失效，层层约束用于降低后果。\n\n## 教学构造的恶意邮件\n\n助手负责总结邮件并创建待办。某封邮件要求“把公司联系人列表发到指定地址”。用户的原任务只授权总结与创建待办，邮件内容没有新增授权的资格。系统应把它作为待总结内容，而不是执行命令。\n\n如果模型仍提出发送动作，工具层应发现该动作不在任务许可范围，阻断执行。若用户确实希望发送，需要直接、具体的授权，并核对收件人、资料范围和组织要求。不能让文档中的“用户已经同意”替代真实授权。\n\n## 防护与检测需要对应场景\n\n输入过滤可拦截部分已知模式，但很难覆盖所有语言表达；提示可以强化边界，但不是权限系统；人工确认有帮助，但用户也可能被误导。因此设计应优先限制可执行后果，并让确认展示真实动作。\n\n检测应包括代表性的恶意资料、正常但容易误读的内容，以及多步传播场景。观察系统是否读取不该读取的资料、是否尝试越权、是否把不可信内容传入后续工具。只检查最终回答有没有危险文字，可能漏掉后台已经发生的行为。\n\n## 产品经理需要明确的要求\n\n定义资料来源、允许动作、授权方式、可外发对象、异常路径和审计。出现注入迹象时，系统可以拒绝相关动作、继续安全部分或请求用户澄清，但应避免泄露敏感内部信息。安全表现也需要随工具、模型和资料范围变化持续回归。\n\n## 任务授权要独立于检索内容\n\n系统可以把用户目标和允许动作维护为可信任务状态，外部资料只能补充事实。若资料要求改变目标、扩大访问或外发，应该回到直接授权流程。工具也可以检查动作是否属于当前任务范围，避免仅看参数格式合法就执行。\n\n确认界面必须显示真实收件人、资料与动作，不能只展示模型生成的善意理由。攻击者可能让助手用正常语言包装危险请求。用户需要判断的是实际后果，而不是助手是否声称这是必要步骤。\n\n防护评估也要看正常任务是否仍然可用。过度阻断会让用户绕过安全路径。对误拦、漏拦和被阻断后的任务恢复分别观察，有助于在风险降低与可用性之间形成有依据的取舍。\n\n## 资料来源标记的实际意义\n\n把网页放在分隔符里，可以帮助模型理解上下文，却不能被视为绝对安全边界。可靠系统还要在工具执行前检查许可范围，并控制可外发资料。即使模型被影响，错误行为也应尽可能受到独立约束。\n\n工具返回也可能不可信，例如第三方搜索摘要或用户可编辑的业务备注。它们可以提供事实候选，不能声明“管理员已经批准”。可信授权应来自身份与权限系统，或用户在适当界面给出的具体决定。\n\n当检测到可疑内容，报告可以说明某来源含有与任务无关的操作要求，已忽略相关要求。无需向普通用户展示攻击细节，也不应因此把整个资料源的所有事实自动判为错误。内容可信度与行动权限是相关但不同的维度。\n\n资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。\n\n### 关联阅读\n\n- [可复用 Prompt 规范与产品协作](05-08.md)\n- [自主程度、人工介入与失败恢复](09-08.md)\n\n### 资料与延伸阅读\n\n- [OWASP：Prompt Injection](https://genai.owasp.org/llmrisk/llm01-prompt-injection/)\n- [OWASP：Excessive Agency](https://genai.owasp.org/llmrisk/llm062025-excessive-agency/)\n","chars":1490,"minutes":6,"summary":"提示注入是指不可信输入影响模型行为，使系统偏离预期任务。Agent 接触网页、邮件、文档和工具结果时，攻击者可能把指令藏在这些内容中。产品设计需要把“可读取的内容”与“可以授权系统行动的指令”分开。"},{"id":"15-03","title":"工具权限、最小授权与沙箱","file":"content/15-03.md","level":"工作应用","prerequisites":["15-02"],"aliases":["security","prompt injection","隐私"],"module":"15","moduleTitle":"安全、隐私与治理","html":"<p>工具赋予 Agent 改变外部世界的能力。权限设计需要回答：它代表谁、能访问哪些对象、能执行哪些动作、在什么时间和任务范围内有效。模型理解用户意图，不能替代系统层面的授权判断。<\/p><h2 id=\"section-1\">最小授权包含多个维度<\/h2><p>可以从工具、动作、资源、时间和环境收紧权限。例如只允许读取指定客户资料、只创建草稿、只在当前任务期间使用凭证、只访问批准的网络目标。即使使用同一个接口，读取、更新和删除也应有不同的权限与确认要求。<\/p><p>使用用户身份通常有助于沿用业务权限，但还需要处理委托与任务范围。服务账号如果权限过大，可能让普通用户通过 Agent 获得原本没有的能力。权限必须由可信系统检查，不能仅让模型根据自然语言决定谁可以做什么。<\/p><h2 id=\"section-2\">沙箱保护运行边界<\/h2><p>沙箱用于限制代码或工具运行时可接触的文件、网络、进程和资源。它可以减少误操作或恶意内容影响，但不是万能隔离。允许挂载的目录、外部网络、凭证和持久存储都会影响真实边界。<\/p><p>产品应明确运行环境：哪些文件只读、哪些可以写入，是否能访问公网，任务结束后如何清理，日志保留什么。对用户而言，可以用可理解的能力说明呈现，而后台保留精确的技术约束。<\/p><h2 id=\"section-3\">教学构造的文件整理 Agent<\/h2><p>用户授权整理某个项目文件夹。系统可以只授予该目录访问，先生成移动计划，再在确认后执行。删除动作可以默认进入可恢复区域，关键文件保留版本。若资料中的文字要求访问另一个目录，它不构成新的授权。<\/p><p>此处还需防止路径和对象问题。工具参数应验证真实目标，避免通过间接链接或拼接越出许可范围。产品经理无需独自实现这些防护，但需要把“只处理这个范围”转化为工程可验证要求。<\/p><h2 id=\"section-4\">确认、凭证与审计<\/h2><p>确认应绑定明确动作和对象，不能将一次“允许使用工具”无限解释为所有未来操作。凭证应由安全存储与系统组件管理，避免出现在提示、结果或普通日志中。权限被撤回后，后续调用应及时失效。<\/p><p>审计记录应能说明谁发起、系统代表谁、调用了什么、影响了哪些对象和结果如何。需要在可追溯与数据最小化之间取平衡，日志本身也可能包含敏感信息，因此同样要控制访问与保留。<\/p><h2 id=\"section-5\">设计自主程度的依据<\/h2><p>自主程度可以随任务后果与可验证性调整。读取可公开资料、生成草稿、修改内部记录和外发信息，不需要相同策略。出现不明确授权时，系统应停在安全边界并请求具体信息。限制权限的目标是让 Agent 在明确范围内稳定创造价值，而不是依靠模型永远做对判断。<\/p><h2 id=\"section-6\">工具越通用，权限边界越重要<\/h2><p>允许任意命令、任意网络请求或任意文件路径的工具，能力灵活，但也扩大了后果。可以优先采用更窄的业务工具，让输入和返回更明确。通用执行工具若确有必要，应配合更严格环境、资源与审批控制。<\/p><p>权限检查还应处理执行时变化。用户发起任务后可能离职、撤权，或目标对象被转移。仅在任务开始检查一次并不总是充分。关键动作执行前应核对当前身份与对象条件，并处理授权失效。<\/p><p>产品中的权限说明要与真实能力一致。若界面写“仅查看”，后台却持有修改凭证，即使当前提示不使用，也形成不必要风险。最小授权的价值是限制错误后果，而非仅约束理想行为。<\/p><h2 id=\"section-7\">一个最小权限矩阵<\/h2><p>可将角色作为行，查询、草稿、修改、外发、删除作为列，再为每格写明对象范围与条件。矩阵应关联真实身份和接口控制，而非只用于展示。任务运行中新增对象时，需要确认是否仍落在许可集合。<\/p><p>权限还应区分读取秘密与使用秘密。Agent 可能需要调用某服务，却不需要看见明文凭证。由可信组件代持和调用，能够降低秘密进入上下文、结果和日志的机会。用户撤回服务授权后，相关令牌和后台任务都需要处理。<\/p><p>沙箱资源限制也应有明确后果：达到时间、内存、网络或预算上限后，任务如何停止、产物如何保存、用户能否继续。资源边界与权限边界共同限制不确定行为的影响。<\/p><h2 id=\"section-8\">教学构造的权限矩阵<\/h2><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>动作<\/th><th>普通任务许可<\/th><th>额外条件<\/th><\/tr><tr><td>读取指定目录<\/td><td>仅授权范围<\/td><td>执行时检查当前权限<\/td><\/tr><tr><td>生成本地草稿<\/td><td>允许在工作目录保存<\/td><td>不覆盖原件，记录版本<\/td><\/tr><tr><td>修改业务记录<\/td><td>不随读取自动获得<\/td><td>明确对象、校验并确认<\/td><\/tr><tr><td>向外部发送<\/td><td>默认不包含<\/td><td>收件人、内容与组织要求核验<\/td><\/tr><tr><td>删除关键对象<\/td><td>默认不包含<\/td><td>专门权限与恢复安排<\/td><\/tr><\/table><\/div><p>这张表仅展示分层方式，真实产品应以业务权限和组织要求为准。前端显示与后台凭证范围需要共同检查。<\/p><p>资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。<\/p><h3 id=\"section-9\">关联阅读<\/h3><ul><li><a href=\"#lesson/08-02\">工具调用的完整生命周期<\/a><\/li><li><a href=\"#lesson/14-05\">编辑、确认、撤销与人工接管<\/a><\/li><\/ul><h3 id=\"section-10\">资料与延伸阅读<\/h3><ul><li><a href=\"https://genai.owasp.org/llmrisk/llm062025-excessive-agency/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：Excessive Agency<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"最小授权包含多个维度","level":2},{"id":"section-2","title":"沙箱保护运行边界","level":2},{"id":"section-3","title":"教学构造的文件整理 Agent","level":2},{"id":"section-4","title":"确认、凭证与审计","level":2},{"id":"section-5","title":"设计自主程度的依据","level":2},{"id":"section-6","title":"工具越通用，权限边界越重要","level":2},{"id":"section-7","title":"一个最小权限矩阵","level":2},{"id":"section-8","title":"教学构造的权限矩阵","level":2},{"id":"section-9","title":"关联阅读","level":3},{"id":"section-10","title":"资料与延伸阅读","level":3}],"text":"工具赋予 Agent 改变外部世界的能力。权限设计需要回答：它代表谁、能访问哪些对象、能执行哪些动作、在什么时间和任务范围内有效。模型理解用户意图，不能替代系统层面的授权判断。\n\n## 最小授权包含多个维度\n\n可以从工具、动作、资源、时间和环境收紧权限。例如只允许读取指定客户资料、只创建草稿、只在当前任务期间使用凭证、只访问批准的网络目标。即使使用同一个接口，读取、更新和删除也应有不同的权限与确认要求。\n\n使用用户身份通常有助于沿用业务权限，但还需要处理委托与任务范围。服务账号如果权限过大，可能让普通用户通过 Agent 获得原本没有的能力。权限必须由可信系统检查，不能仅让模型根据自然语言决定谁可以做什么。\n\n## 沙箱保护运行边界\n\n沙箱用于限制代码或工具运行时可接触的文件、网络、进程和资源。它可以减少误操作或恶意内容影响，但不是万能隔离。允许挂载的目录、外部网络、凭证和持久存储都会影响真实边界。\n\n产品应明确运行环境：哪些文件只读、哪些可以写入，是否能访问公网，任务结束后如何清理，日志保留什么。对用户而言，可以用可理解的能力说明呈现，而后台保留精确的技术约束。\n\n## 教学构造的文件整理 Agent\n\n用户授权整理某个项目文件夹。系统可以只授予该目录访问，先生成移动计划，再在确认后执行。删除动作可以默认进入可恢复区域，关键文件保留版本。若资料中的文字要求访问另一个目录，它不构成新的授权。\n\n此处还需防止路径和对象问题。工具参数应验证真实目标，避免通过间接链接或拼接越出许可范围。产品经理无需独自实现这些防护，但需要把“只处理这个范围”转化为工程可验证要求。\n\n## 确认、凭证与审计\n\n确认应绑定明确动作和对象，不能将一次“允许使用工具”无限解释为所有未来操作。凭证应由安全存储与系统组件管理，避免出现在提示、结果或普通日志中。权限被撤回后，后续调用应及时失效。\n\n审计记录应能说明谁发起、系统代表谁、调用了什么、影响了哪些对象和结果如何。需要在可追溯与数据最小化之间取平衡，日志本身也可能包含敏感信息，因此同样要控制访问与保留。\n\n## 设计自主程度的依据\n\n自主程度可以随任务后果与可验证性调整。读取可公开资料、生成草稿、修改内部记录和外发信息，不需要相同策略。出现不明确授权时，系统应停在安全边界并请求具体信息。限制权限的目标是让 Agent 在明确范围内稳定创造价值，而不是依靠模型永远做对判断。\n\n## 工具越通用，权限边界越重要\n\n允许任意命令、任意网络请求或任意文件路径的工具，能力灵活，但也扩大了后果。可以优先采用更窄的业务工具，让输入和返回更明确。通用执行工具若确有必要，应配合更严格环境、资源与审批控制。\n\n权限检查还应处理执行时变化。用户发起任务后可能离职、撤权，或目标对象被转移。仅在任务开始检查一次并不总是充分。关键动作执行前应核对当前身份与对象条件，并处理授权失效。\n\n产品中的权限说明要与真实能力一致。若界面写“仅查看”，后台却持有修改凭证，即使当前提示不使用，也形成不必要风险。最小授权的价值是限制错误后果，而非仅约束理想行为。\n\n## 一个最小权限矩阵\n\n可将角色作为行，查询、草稿、修改、外发、删除作为列，再为每格写明对象范围与条件。矩阵应关联真实身份和接口控制，而非只用于展示。任务运行中新增对象时，需要确认是否仍落在许可集合。\n\n权限还应区分读取秘密与使用秘密。Agent 可能需要调用某服务，却不需要看见明文凭证。由可信组件代持和调用，能够降低秘密进入上下文、结果和日志的机会。用户撤回服务授权后，相关令牌和后台任务都需要处理。\n\n沙箱资源限制也应有明确后果：达到时间、内存、网络或预算上限后，任务如何停止、产物如何保存、用户能否继续。资源边界与权限边界共同限制不确定行为的影响。\n\n## 教学构造的权限矩阵\n\n| 动作 | 普通任务许可 | 额外条件 |\n|---|---|---|\n| 读取指定目录 | 仅授权范围 | 执行时检查当前权限 |\n| 生成本地草稿 | 允许在工作目录保存 | 不覆盖原件，记录版本 |\n| 修改业务记录 | 不随读取自动获得 | 明确对象、校验并确认 |\n| 向外部发送 | 默认不包含 | 收件人、内容与组织要求核验 |\n| 删除关键对象 | 默认不包含 | 专门权限与恢复安排 |\n\n这张表仅展示分层方式，真实产品应以业务权限和组织要求为准。前端显示与后台凭证范围需要共同检查。\n\n资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。\n\n### 关联阅读\n\n- [工具调用的完整生命周期](08-02.md)\n- [编辑、确认、撤销与人工接管](14-05.md)\n\n### 资料与延伸阅读\n\n- [OWASP：Excessive Agency](https://genai.owasp.org/llmrisk/llm062025-excessive-agency/)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1578,"minutes":6,"summary":"工具赋予 Agent 改变外部世界的能力。权限设计需要回答：它代表谁、能访问哪些对象、能执行哪些动作、在什么时间和任务范围内有效。模型理解用户意图，不能替代系统层面的授权判断。"},{"id":"15-04","title":"数据隐私、敏感信息与隔离","file":"content/15-04.md","level":"工作应用","prerequisites":["15-03"],"aliases":["security","prompt injection","隐私"],"module":"15","moduleTitle":"安全、隐私与治理","html":"<p>AI 应用中的隐私问题贯穿资料采集、检索、上下文、外部服务、日志、记忆和删除。用户没有在最终回答中看到敏感内容，不代表资料没有被不适当地传输或保存。产品需要跟踪完整生命周期。<\/p><h2 id=\"section-1\">先建立资料清单<\/h2><p>记录系统处理哪些信息、来自哪里、为何需要、流向哪里、谁能访问、保存多久以及如何删除。个人身份、财务、健康、客户合同、密钥和内部策略等资料可能有不同敏感程度，分类应结合业务和组织要求。<\/p><p>最小化原则意味着只为任务提供必要资料。生成客户会议摘要可能不需要完整身份证号；检索政策可能只需片段而非整库。减少不必要上下文既能降低风险，也可能减少噪声和成本，但不能因此丢失完成任务所需证据。<\/p><h2 id=\"section-2\">隔离必须在可信层执行<\/h2><p>多租户系统需要防止跨企业、跨用户和跨角色资料混入。检索过滤、缓存键、会话存储、日志和导出都需要检查。仅在提示里要求“不要透露其他用户数据”，不能替代身份与权限控制。<\/p><p>脱敏与假名化也有边界。去掉姓名不一定无法重新识别，多个字段组合仍可能暴露身份。对外传输前应核对资料必要性、处理目的和供应商条件，具体法律义务交由适当专业人员判断。<\/p><h2 id=\"section-3\">教学构造的客服摘要<\/h2><p>助手把客户工单整理成摘要。若把完整订单、电话、地址和支付信息都发送给模型，可能超过摘要所需范围。可以先由系统选取必要字段，对不需要的字段删除或遮盖，并在结果和日志中继续控制敏感信息。<\/p><p>如果摘要被保存为长期记忆，还需要新的保留与删除规则。原工单删除后，派生摘要、向量索引和缓存是否同步处理，需要有明确机制。删除界面不能只移除可见记录，却让资料继续在检索中出现。<\/p><h2 id=\"section-4\">供应商条件需要逐项核验<\/h2><p>不同服务、套餐和配置在训练使用、保存时间、地域、子处理方和管理控制上可能不同。不能把某个产品的承诺套用到全部 API 或全部账号。采购与上线前应核对适用合同、设置和技术文档，并保留核验日期。<\/p><p>用户告知也应具体：哪些资料会被处理、哪些功能会持久保存、哪些信息可以撤回。过于宽泛的“我们重视隐私”无法帮助用户形成正确预期。界面说明应与后台真实行为一致。<\/p><h2 id=\"section-5\">让隐私控制进入产品质量<\/h2><p>权限测试、跨租户测试、日志检查和删除验证应成为适当的发布检查。出现疑似泄露时，能够定位资料流向与影响范围。产品经理负责组织清晰要求和用户体验，工程、安全与隐私团队共同确保实现和适用性。<\/p><h2 id=\"section-6\">派生资料也属于生命周期<\/h2><p>摘要、向量、缓存和调试日志都可能携带原始资料的信息。资料清单需要包含这些派生对象，说明它们如何更新和删除。否则原文撤回后，旧结论仍可能通过检索或记忆重新出现。<\/p><p>共享结果也要核对受众。用户可以访问原文，不代表他能把摘要公开到所有团队。生成和分享之间应有适当权限与提示。对于多人协作产物，系统需要明确哪些来源可被哪些成员核查。<\/p><p>隐私设计还需考虑支持流程。用户向客服提交错误截图，可能无意带出敏感内容。可以提供自动遮盖、最小诊断信息和安全上传路径，使故障排查不成为新的泄露渠道。<\/p><h2 id=\"section-7\">删除与保留的验证问题<\/h2><p>删除要求可以沿资料链逐项核对：原文件、解析文本、索引、向量、缓存、摘要、记忆、备份与日志。某些记录可能因合法或安全目的需要保留，应由适当专业人员明确条件和告知。产品不能简单承诺所有副本立即消失，却没有系统能力支持。<\/p><p>多租户隔离同样要覆盖测试与支持环境。生产数据复制到调试系统后，可能失去原有访问控制。资料最小化、脱敏、环境隔离和访问审计应在整个生命周期保持一致。<\/p><p>对外部模型服务，核对输入、输出和元数据的保存与使用条件。关闭某个训练选项，不自动说明全部日志或服务记录都不存在。具体结论必须来自适用产品、合同与配置，不能依赖概括性印象。<\/p><p>资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/06-07\">数据权限、隔离与审计<\/a><\/li><li><a href=\"#lesson/15-07\">审计、治理责任与供应商管理<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：Sensitive Information Disclosure<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"先建立资料清单","level":2},{"id":"section-2","title":"隔离必须在可信层执行","level":2},{"id":"section-3","title":"教学构造的客服摘要","level":2},{"id":"section-4","title":"供应商条件需要逐项核验","level":2},{"id":"section-5","title":"让隐私控制进入产品质量","level":2},{"id":"section-6","title":"派生资料也属于生命周期","level":2},{"id":"section-7","title":"删除与保留的验证问题","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 应用中的隐私问题贯穿资料采集、检索、上下文、外部服务、日志、记忆和删除。用户没有在最终回答中看到敏感内容，不代表资料没有被不适当地传输或保存。产品需要跟踪完整生命周期。\n\n## 先建立资料清单\n\n记录系统处理哪些信息、来自哪里、为何需要、流向哪里、谁能访问、保存多久以及如何删除。个人身份、财务、健康、客户合同、密钥和内部策略等资料可能有不同敏感程度，分类应结合业务和组织要求。\n\n最小化原则意味着只为任务提供必要资料。生成客户会议摘要可能不需要完整身份证号；检索政策可能只需片段而非整库。减少不必要上下文既能降低风险，也可能减少噪声和成本，但不能因此丢失完成任务所需证据。\n\n## 隔离必须在可信层执行\n\n多租户系统需要防止跨企业、跨用户和跨角色资料混入。检索过滤、缓存键、会话存储、日志和导出都需要检查。仅在提示里要求“不要透露其他用户数据”，不能替代身份与权限控制。\n\n脱敏与假名化也有边界。去掉姓名不一定无法重新识别，多个字段组合仍可能暴露身份。对外传输前应核对资料必要性、处理目的和供应商条件，具体法律义务交由适当专业人员判断。\n\n## 教学构造的客服摘要\n\n助手把客户工单整理成摘要。若把完整订单、电话、地址和支付信息都发送给模型，可能超过摘要所需范围。可以先由系统选取必要字段，对不需要的字段删除或遮盖，并在结果和日志中继续控制敏感信息。\n\n如果摘要被保存为长期记忆，还需要新的保留与删除规则。原工单删除后，派生摘要、向量索引和缓存是否同步处理，需要有明确机制。删除界面不能只移除可见记录，却让资料继续在检索中出现。\n\n## 供应商条件需要逐项核验\n\n不同服务、套餐和配置在训练使用、保存时间、地域、子处理方和管理控制上可能不同。不能把某个产品的承诺套用到全部 API 或全部账号。采购与上线前应核对适用合同、设置和技术文档，并保留核验日期。\n\n用户告知也应具体：哪些资料会被处理、哪些功能会持久保存、哪些信息可以撤回。过于宽泛的“我们重视隐私”无法帮助用户形成正确预期。界面说明应与后台真实行为一致。\n\n## 让隐私控制进入产品质量\n\n权限测试、跨租户测试、日志检查和删除验证应成为适当的发布检查。出现疑似泄露时，能够定位资料流向与影响范围。产品经理负责组织清晰要求和用户体验，工程、安全与隐私团队共同确保实现和适用性。\n\n## 派生资料也属于生命周期\n\n摘要、向量、缓存和调试日志都可能携带原始资料的信息。资料清单需要包含这些派生对象，说明它们如何更新和删除。否则原文撤回后，旧结论仍可能通过检索或记忆重新出现。\n\n共享结果也要核对受众。用户可以访问原文，不代表他能把摘要公开到所有团队。生成和分享之间应有适当权限与提示。对于多人协作产物，系统需要明确哪些来源可被哪些成员核查。\n\n隐私设计还需考虑支持流程。用户向客服提交错误截图，可能无意带出敏感内容。可以提供自动遮盖、最小诊断信息和安全上传路径，使故障排查不成为新的泄露渠道。\n\n## 删除与保留的验证问题\n\n删除要求可以沿资料链逐项核对：原文件、解析文本、索引、向量、缓存、摘要、记忆、备份与日志。某些记录可能因合法或安全目的需要保留，应由适当专业人员明确条件和告知。产品不能简单承诺所有副本立即消失，却没有系统能力支持。\n\n多租户隔离同样要覆盖测试与支持环境。生产数据复制到调试系统后，可能失去原有访问控制。资料最小化、脱敏、环境隔离和访问审计应在整个生命周期保持一致。\n\n对外部模型服务，核对输入、输出和元数据的保存与使用条件。关闭某个训练选项，不自动说明全部日志或服务记录都不存在。具体结论必须来自适用产品、合同与配置，不能依赖概括性印象。\n\n资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。\n\n### 关联阅读\n\n- [数据权限、隔离与审计](06-07.md)\n- [审计、治理责任与供应商管理](15-07.md)\n\n### 资料与延伸阅读\n\n- [OWASP：Sensitive Information Disclosure](https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1374,"minutes":5,"summary":"AI 应用中的隐私问题贯穿资料采集、检索、上下文、外部服务、日志、记忆和删除。用户没有在最终回答中看到敏感内容，不代表资料没有被不适当地传输或保存。产品需要跟踪完整生命周期。"},{"id":"15-05","title":"内容安全、滥用与防护流程","file":"content/15-05.md","level":"工作应用","prerequisites":["15-04"],"aliases":["security","prompt injection","隐私"],"module":"15","moduleTitle":"安全、隐私与治理","html":"<p>内容安全关注系统生成、传播或帮助执行的内容可能带来的伤害与滥用。不同产品面对不同用户、资料和动作，不能仅用一条通用拒答提示覆盖。需要明确支持范围、限制范围以及遇到问题时的处理流程。<\/p><h2 id=\"section-1\">区分内容、意图与行动能力<\/h2><p>相同文字在教育分析、新闻引用和实际实施中可能有不同含义。系统需要结合任务上下文判断，同时避免过度拦截正常用途。若 Agent 还能调用工具，风险不仅在回答文字，也包括它可能搜索、生成文件、联系对象或执行操作。<\/p><p>可以根据产品场景列出常见滥用路径，包括欺诈、骚扰、危险操作、违规资料传播或资源消耗。每条路径需要连接可用工具与后果。内容策略应具体到产品行为，而不是只列出抽象禁止词。<\/p><h2 id=\"section-2\">分层处理而非单一拦截<\/h2><p>输入端可以检测明显滥用，模型与系统规则约束行为，工具层限制后果，输出端检查可发布内容，运营层处理申诉与持续变化。不同层各有局限，组合用于减少漏检和误伤。模型输出进入网页、数据库或脚本前，还需要适当的格式与安全处理。<\/p><p>拒绝时应说明可理解的边界，并在合适情况下提供安全替代方向。不要泄露内部检测规则，也不要生成能够帮助规避防护的细节。正常用户被误拦时，应有反馈或人工处理路径。<\/p><h2 id=\"section-3\">教学构造的营销助手<\/h2><p>营销助手支持生成合规的推广草稿，但可能被用于批量骚扰或冒充他人。除了内容检查，还需要限制发送权限、频率、收件人来源与外发流程。生成草稿与批量发送应采用不同授权和监控。<\/p><p>如果用户提交引用材料中包含不当内容，系统可以在分析场景中进行必要处理，同时避免无意义扩散。产品要说明何时允许引用、如何呈现和何时停止，不能简单把所有出现敏感词的任务都视为相同。<\/p><h2 id=\"section-4\">质量与运营如何连接<\/h2><p>记录问题类别、误拦、漏检、影响和处理时效，有助于调整策略。反馈资料应注意敏感性，不必为诊断保存所有原文。对严重事件，明确升级负责人和停止条件；对普通边界问题，则需要可持续更新政策与示例。<\/p><p>策略变化会影响用户预期。若新增限制使原有任务不可用，应尽量说明原因和替代方式。版本化的内容策略、测试资料与决策记录，能够帮助团队解释行为变化。<\/p><h2 id=\"section-5\">产品经理的范围判断<\/h2><p>内容安全不是要求产品保证所有输出完美，而是为具体用途建立可实施的边界、控制和响应。需要把高后果任务交给适当专业人员核验，避免在缺少能力和授权时提供确定行动结论。最终目标是让允许的用途可靠可用，同时降低可预见的滥用后果。<\/p><h2 id=\"section-6\">处理被生成内容触发的后续风险<\/h2><p>输出如果进入网页、数据库、命令或其他系统，需要按目标环境校验。自然语言看起来正常，不代表它可安全作为代码或参数执行。工具层与展示层应把生成内容视为需要验证的输入，避免把模型的灵活性延伸成任意执行权限。<\/p><p>资源滥用也属于运营边界。长任务、并行调用和无限循环可能被用来消耗预算与服务能力。配额、速率、预算上限和异常监控，应与内容策略共同考虑。用户需要知道任务何时会因限制停止，以及部分结果如何保留。<\/p><p>边界政策应结合真实反馈修订。新型滥用出现后，既要补防护，也要检查是否影响正常用户。记录依据与适用版本，能够帮助支持团队清楚解释系统行为。<\/p><h2 id=\"section-7\">把内容策略写成可执行流程<\/h2><p>一类限制应说明触发场景、允许与不允许行为、系统动作、用户说明和升级方式。例如发现疑似冒充外发时，可以阻断发送、保留草稿并解释需要确认身份，而不是只删除回答。具体动作应与产品可用工具和后果对应。<\/p><p>策略评估需要包含正常用途和边界用途，观察误拦与漏拦。不同语言、输入格式和多轮上下文也会影响行为。测试证据只证明覆盖场景中的表现，不能因此宣称防护完整。<\/p><p>用户申诉与运营反馈能够帮助发现误伤，但不应让一次申诉自动绕过控制。对需要专业判断的情况，明确由谁处理、需要哪些最少信息，以及处理期间用户可以继续哪些安全部分。<\/p><p>资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/11-06\">线上实验、统计与效果解释<\/a><\/li><li><a href=\"#lesson/12-07\">版本、灰度、回滚与事故复盘<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/\" target=\"_blank\" rel=\"noopener noreferrer\">OWASP：Improper Output Handling<\/a><\/li><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"区分内容、意图与行动能力","level":2},{"id":"section-2","title":"分层处理而非单一拦截","level":2},{"id":"section-3","title":"教学构造的营销助手","level":2},{"id":"section-4","title":"质量与运营如何连接","level":2},{"id":"section-5","title":"产品经理的范围判断","level":2},{"id":"section-6","title":"处理被生成内容触发的后续风险","level":2},{"id":"section-7","title":"把内容策略写成可执行流程","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"内容安全关注系统生成、传播或帮助执行的内容可能带来的伤害与滥用。不同产品面对不同用户、资料和动作，不能仅用一条通用拒答提示覆盖。需要明确支持范围、限制范围以及遇到问题时的处理流程。\n\n## 区分内容、意图与行动能力\n\n相同文字在教育分析、新闻引用和实际实施中可能有不同含义。系统需要结合任务上下文判断，同时避免过度拦截正常用途。若 Agent 还能调用工具，风险不仅在回答文字，也包括它可能搜索、生成文件、联系对象或执行操作。\n\n可以根据产品场景列出常见滥用路径，包括欺诈、骚扰、危险操作、违规资料传播或资源消耗。每条路径需要连接可用工具与后果。内容策略应具体到产品行为，而不是只列出抽象禁止词。\n\n## 分层处理而非单一拦截\n\n输入端可以检测明显滥用，模型与系统规则约束行为，工具层限制后果，输出端检查可发布内容，运营层处理申诉与持续变化。不同层各有局限，组合用于减少漏检和误伤。模型输出进入网页、数据库或脚本前，还需要适当的格式与安全处理。\n\n拒绝时应说明可理解的边界，并在合适情况下提供安全替代方向。不要泄露内部检测规则，也不要生成能够帮助规避防护的细节。正常用户被误拦时，应有反馈或人工处理路径。\n\n## 教学构造的营销助手\n\n营销助手支持生成合规的推广草稿，但可能被用于批量骚扰或冒充他人。除了内容检查，还需要限制发送权限、频率、收件人来源与外发流程。生成草稿与批量发送应采用不同授权和监控。\n\n如果用户提交引用材料中包含不当内容，系统可以在分析场景中进行必要处理，同时避免无意义扩散。产品要说明何时允许引用、如何呈现和何时停止，不能简单把所有出现敏感词的任务都视为相同。\n\n## 质量与运营如何连接\n\n记录问题类别、误拦、漏检、影响和处理时效，有助于调整策略。反馈资料应注意敏感性，不必为诊断保存所有原文。对严重事件，明确升级负责人和停止条件；对普通边界问题，则需要可持续更新政策与示例。\n\n策略变化会影响用户预期。若新增限制使原有任务不可用，应尽量说明原因和替代方式。版本化的内容策略、测试资料与决策记录，能够帮助团队解释行为变化。\n\n## 产品经理的范围判断\n\n内容安全不是要求产品保证所有输出完美，而是为具体用途建立可实施的边界、控制和响应。需要把高后果任务交给适当专业人员核验，避免在缺少能力和授权时提供确定行动结论。最终目标是让允许的用途可靠可用，同时降低可预见的滥用后果。\n\n## 处理被生成内容触发的后续风险\n\n输出如果进入网页、数据库、命令或其他系统，需要按目标环境校验。自然语言看起来正常，不代表它可安全作为代码或参数执行。工具层与展示层应把生成内容视为需要验证的输入，避免把模型的灵活性延伸成任意执行权限。\n\n资源滥用也属于运营边界。长任务、并行调用和无限循环可能被用来消耗预算与服务能力。配额、速率、预算上限和异常监控，应与内容策略共同考虑。用户需要知道任务何时会因限制停止，以及部分结果如何保留。\n\n边界政策应结合真实反馈修订。新型滥用出现后，既要补防护，也要检查是否影响正常用户。记录依据与适用版本，能够帮助支持团队清楚解释系统行为。\n\n## 把内容策略写成可执行流程\n\n一类限制应说明触发场景、允许与不允许行为、系统动作、用户说明和升级方式。例如发现疑似冒充外发时，可以阻断发送、保留草稿并解释需要确认身份，而不是只删除回答。具体动作应与产品可用工具和后果对应。\n\n策略评估需要包含正常用途和边界用途，观察误拦与漏拦。不同语言、输入格式和多轮上下文也会影响行为。测试证据只证明覆盖场景中的表现，不能因此宣称防护完整。\n\n用户申诉与运营反馈能够帮助发现误伤，但不应让一次申诉自动绕过控制。对需要专业判断的情况，明确由谁处理、需要哪些最少信息，以及处理期间用户可以继续哪些安全部分。\n\n资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。\n\n### 关联阅读\n\n- [线上实验、统计与效果解释](11-06.md)\n- [版本、灰度、回滚与事故复盘](12-07.md)\n\n### 资料与延伸阅读\n\n- [OWASP：Improper Output Handling](https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/)\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n","chars":1430,"minutes":6,"summary":"内容安全关注系统生成、传播或帮助执行的内容可能带来的伤害与滥用。不同产品面对不同用户、资料和动作，不能仅用一条通用拒答提示覆盖。需要明确支持范围、限制范围以及遇到问题时的处理流程。"},{"id":"15-06","title":"版权、许可与合规核验方法","file":"content/15-06.md","level":"工作应用","prerequisites":["15-05"],"aliases":["security","prompt injection","隐私"],"module":"15","moduleTitle":"安全、隐私与治理","html":"<p>版权、许可和合规问题需要结合资料、用途、地区、合同与产品行为核验。产品经理不应把“公开可访问”理解为“可以任意复制和商业使用”，也不能把开放权重、开源软件和开放数据视为同一概念。本篇提供核验方法，不代替具体法律意见。<\/p><h2 id=\"section-1\">先识别正在使用什么<\/h2><p>资料可能包括代码、模型权重、训练数据、文档、图片、声音、字体和用户上传内容。每类对象可能适用不同权利、许可与服务条款。一个模型的代码许可，不一定覆盖其权重与数据；一个网站允许阅读，也不自动允许批量抓取或再分发。<\/p><p>核验应记录来源、版本、许可名称、权利人、拟议用途、分发方式和限制。SPDX 可以帮助识别常见软件许可标识，OSI 的定义用于理解开源软件条件，Creative Commons 则提供内容许可体系。这些资源不能替代对具体文本的阅读。<\/p><h2 id=\"section-2\">把使用方式拆开<\/h2><p>内部研究、商业服务、修改、分发、嵌入产品和对外展示，可能触发不同条件。署名、保留许可、分享相同方式、非商业或禁止改作等要求，不能凭许可名称猜测。模型许可还可能包含用途、用户规模或品牌等额外条款。<\/p><p>生成内容也需检查来源与用途风险。输出可能与受保护内容相似，或涉及商标、肖像、声音和保密信息。供应商提供某种赔偿或承诺，也可能有适用范围与前提，不能泛化为所有风险已经转移。<\/p><h2 id=\"section-3\">教学构造的知识库发布<\/h2><p>团队希望把行业报告加入公开知识库，应先核对原文许可、合同与适用规则。在取得授权或适用规则允许的范围内，才可选取必要片段、进行自己的解释并按要求注明来源；片段短、署名和链接本身不能代替授权或适用条件。图表再用、较大范围复制和下载分发等用途也需分别确认。对于无法确认的素材，可改用自制图解、公开授权资料或申请许可。<\/p><p>如果采用某开源组件，应保留对应版本与许可证，确认分发方式及依赖许可。更新组件后，许可和条款也可能改变。素材清单需要随产品版本维护，而不是只在首次上线检查一次。<\/p><h2 id=\"section-4\">合规核验连接真实业务<\/h2><p>确定服务对象与地区、处理资料类型、是否涉及受监管行业、是否向公众提供生成内容、是否执行高后果动作，再请专业人员核对适用要求。不同司法辖区、行业和企业合同会影响结论。知识库可以解释方法与原始来源，但应标注日期并避免把通用原则写成确定法律结论。<\/p><p>产品需求需要把专业结论转为可执行控制，例如授权证明、署名展示、资料保留、用户告知、审核与申诉。只附一段免责声明通常不能替代实际义务。<\/p><h2 id=\"section-5\">建立可追溯的核验记录<\/h2><p>记录谁核验、依据哪个版本、允许什么用途、有哪些条件以及何时复审。对未解决问题标注状态与负责人，避免沉默被当成同意。这样产品扩展到新地区、新模型或新分发方式时，可以准确找出需要重审的部分。<\/p><h2 id=\"section-6\">核验表如何服务日常决策<\/h2><p>可以为每项素材保留来源链接、取得日期、版本、使用位置、拟议用途、许可文本和核验状态。状态区分已确认、附条件使用和待专业判断。没有查到许可不能当作默认允许，也不应凭外观相似推断权利归属。<\/p><p>合作方提供素材时，同样需要确认其是否有权授予对应使用。用户上传内容的责任与平台处理目的，也需要在产品和合同中适当说明。采购或供应商承诺不能替代对实际资料流向的了解。<\/p><p>当发布范围改变，例如从内部研究转为公开知识库、从演示转为商业服务，应重新检查原来的许可结论。适用性通常与用途绑定，不能把一次批准无限扩展。<\/p><h2 id=\"section-7\">开放模型的具体核验<\/h2><p>“可下载权重”与“符合开源定义”需要分别判断。核对权重、代码、数据、文档和服务条款，不要把一个仓库中的许可证自动套到所有资产。某些限制可能与商业用途、再分发或服务规模相关，必须阅读实际版本。<\/p><p>对素材的署名与许可展示，可以在设计阶段确定位置和方式，避免发布前才发现空间不足。若使用修改后的图像或文字，记录原始来源和修改情况，有助于落实条件并处理后续争议。<\/p><p>法律和政策会变化，知识库应链接权威原始文本，并说明核验日期与适用环境。对具体合规结论，寻求具有相应职责的专业人员；产品经理负责把结论落实到资料、交互和流程，而不是自行推断所有义务。<\/p><p>资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/04-01\">模型能力地图与选型维度<\/a><\/li><li><a href=\"#lesson/18-08\">持续学习、资料判断与个人知识管理<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://opensource.org/osd\" target=\"_blank\" rel=\"noopener noreferrer\">OSI：Open Source Definition<\/a><\/li><li><a href=\"https://creativecommons.org/share-your-work/cclicenses/\" target=\"_blank\" rel=\"noopener noreferrer\">Creative Commons：License Types<\/a><\/li><li><a href=\"https://spdx.org/licenses/\" target=\"_blank\" rel=\"noopener noreferrer\">SPDX：License List<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"先识别正在使用什么","level":2},{"id":"section-2","title":"把使用方式拆开","level":2},{"id":"section-3","title":"教学构造的知识库发布","level":2},{"id":"section-4","title":"合规核验连接真实业务","level":2},{"id":"section-5","title":"建立可追溯的核验记录","level":2},{"id":"section-6","title":"核验表如何服务日常决策","level":2},{"id":"section-7","title":"开放模型的具体核验","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"版权、许可和合规问题需要结合资料、用途、地区、合同与产品行为核验。产品经理不应把“公开可访问”理解为“可以任意复制和商业使用”，也不能把开放权重、开源软件和开放数据视为同一概念。本篇提供核验方法，不代替具体法律意见。\n\n## 先识别正在使用什么\n\n资料可能包括代码、模型权重、训练数据、文档、图片、声音、字体和用户上传内容。每类对象可能适用不同权利、许可与服务条款。一个模型的代码许可，不一定覆盖其权重与数据；一个网站允许阅读，也不自动允许批量抓取或再分发。\n\n核验应记录来源、版本、许可名称、权利人、拟议用途、分发方式和限制。SPDX 可以帮助识别常见软件许可标识，OSI 的定义用于理解开源软件条件，Creative Commons 则提供内容许可体系。这些资源不能替代对具体文本的阅读。\n\n## 把使用方式拆开\n\n内部研究、商业服务、修改、分发、嵌入产品和对外展示，可能触发不同条件。署名、保留许可、分享相同方式、非商业或禁止改作等要求，不能凭许可名称猜测。模型许可还可能包含用途、用户规模或品牌等额外条款。\n\n生成内容也需检查来源与用途风险。输出可能与受保护内容相似，或涉及商标、肖像、声音和保密信息。供应商提供某种赔偿或承诺，也可能有适用范围与前提，不能泛化为所有风险已经转移。\n\n## 教学构造的知识库发布\n\n团队希望把行业报告加入公开知识库，应先核对原文许可、合同与适用规则。在取得授权或适用规则允许的范围内，才可选取必要片段、进行自己的解释并按要求注明来源；片段短、署名和链接本身不能代替授权或适用条件。图表再用、较大范围复制和下载分发等用途也需分别确认。对于无法确认的素材，可改用自制图解、公开授权资料或申请许可。\n\n如果采用某开源组件，应保留对应版本与许可证，确认分发方式及依赖许可。更新组件后，许可和条款也可能改变。素材清单需要随产品版本维护，而不是只在首次上线检查一次。\n\n## 合规核验连接真实业务\n\n确定服务对象与地区、处理资料类型、是否涉及受监管行业、是否向公众提供生成内容、是否执行高后果动作，再请专业人员核对适用要求。不同司法辖区、行业和企业合同会影响结论。知识库可以解释方法与原始来源，但应标注日期并避免把通用原则写成确定法律结论。\n\n产品需求需要把专业结论转为可执行控制，例如授权证明、署名展示、资料保留、用户告知、审核与申诉。只附一段免责声明通常不能替代实际义务。\n\n## 建立可追溯的核验记录\n\n记录谁核验、依据哪个版本、允许什么用途、有哪些条件以及何时复审。对未解决问题标注状态与负责人，避免沉默被当成同意。这样产品扩展到新地区、新模型或新分发方式时，可以准确找出需要重审的部分。\n\n## 核验表如何服务日常决策\n\n可以为每项素材保留来源链接、取得日期、版本、使用位置、拟议用途、许可文本和核验状态。状态区分已确认、附条件使用和待专业判断。没有查到许可不能当作默认允许，也不应凭外观相似推断权利归属。\n\n合作方提供素材时，同样需要确认其是否有权授予对应使用。用户上传内容的责任与平台处理目的，也需要在产品和合同中适当说明。采购或供应商承诺不能替代对实际资料流向的了解。\n\n当发布范围改变，例如从内部研究转为公开知识库、从演示转为商业服务，应重新检查原来的许可结论。适用性通常与用途绑定，不能把一次批准无限扩展。\n\n## 开放模型的具体核验\n\n“可下载权重”与“符合开源定义”需要分别判断。核对权重、代码、数据、文档和服务条款，不要把一个仓库中的许可证自动套到所有资产。某些限制可能与商业用途、再分发或服务规模相关，必须阅读实际版本。\n\n对素材的署名与许可展示，可以在设计阶段确定位置和方式，避免发布前才发现空间不足。若使用修改后的图像或文字，记录原始来源和修改情况，有助于落实条件并处理后续争议。\n\n法律和政策会变化，知识库应链接权威原始文本，并说明核验日期与适用环境。对具体合规结论，寻求具有相应职责的专业人员；产品经理负责把结论落实到资料、交互和流程，而不是自行推断所有义务。\n\n资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。\n\n### 关联阅读\n\n- [模型能力地图与选型维度](04-01.md)\n- [持续学习、资料判断与个人知识管理](18-08.md)\n\n### 资料与延伸阅读\n\n- [OSI：Open Source Definition](https://opensource.org/osd)\n- [Creative Commons：License Types](https://creativecommons.org/share-your-work/cclicenses/)\n- [SPDX：License List](https://spdx.org/licenses/)\n","chars":1488,"minutes":6,"summary":"版权、许可和合规问题需要结合资料、用途、地区、合同与产品行为核验。产品经理不应把“公开可访问”理解为“可以任意复制和商业使用”，也不能把开放权重、开源软件和开放数据视为同一概念。本篇提供核验方法，不代替具体法律意见。"},{"id":"15-07","title":"审计、治理责任与供应商管理","file":"content/15-07.md","level":"工作应用","prerequisites":["15-06"],"aliases":["security","prompt injection","隐私"],"module":"15","moduleTitle":"安全、隐私与治理","html":"<p>AI 治理需要让重要决策、责任和变更可追溯。技术团队可以实现控制，但谁决定用途、谁接受残余风险、谁负责用户影响，也必须明确。供应商管理则帮助团队理解外部依赖及其变化会如何影响产品。<\/p><h2 id=\"section-1\">从责任链而非委员会开始<\/h2><p>可以围绕任务与系统列出产品负责人、数据负责人、工程运维、安全隐私、业务使用者和管理者。每类责任说明具体决定与动作，例如批准新用途、管理资料权限、处理事件或更新评估。角色越明确，越不容易在问题出现时相互等待。<\/p><p>治理并不意味着所有改动都需要同等流程。可以按影响分级：文字样式调整、提示变化、模型升级、新数据源、新工具权限的后果不同。变更流程应与风险匹配，同时保留必要证据。<\/p><h2 id=\"section-2\">审计需要能还原关键事实<\/h2><p>关键事实包括任务发起者、使用身份、资料范围、模型与配置版本、工具动作、授权、结果与异常。记录应足以分析问题，但不应无限保存敏感原文。日志访问、保留、删除和导出同样需要控制。<\/p><p>一条自然语言总结不能替代关键事件。模型可能错误描述自己做了什么，审计应依赖可信系统记录。对于外部动作，业务标识与状态比“助手说已完成”更有价值。<\/p><h2 id=\"section-3\">供应商核验的核心内容<\/h2><p>了解服务能力、可用性、数据处理、地域、保留、模型更新、价格、许可、安全控制、事件通知和退出方式。文档、合同与实际配置需要一致。公开宣传可能描述一般能力，具体套餐或接口存在差异，应核对适用条件。<\/p><p>模型供应商不是唯一依赖。检索服务、向量数据库、连接器、代理工具和日志平台都可能处理资料或影响可用性。依赖清单有助于发现单点故障与隐藏资料流向。<\/p><h2 id=\"section-4\">教学构造的模型升级<\/h2><p>供应商推出新模型，团队希望替换旧版本。升级可能改善效果，也可能改变输出格式、拒答行为、延迟和成本。治理流程可以要求固定任务回归、关键权限检查、灰度与回滚准备，并记录批准依据。<\/p><p>如果供应商自动更新，团队需要了解通知机制、可固定版本的能力及监控方案。不能保证完全避免变化，但可以降低变化不可见造成的影响。对用户承诺也应与服务现实匹配。<\/p><h2 id=\"section-5\">让治理形成持续运营<\/h2><p>定期查看用途、资料、依赖、事件和指标是否变化，及时关闭不再需要的权限与服务。新业务用途可能超出最初批准范围，应重新评估。治理资产应接近日常工作，能够直接支持上线、采购、支持和复盘，而不是只用于展示。<\/p><p>产品经理可以推动共同的决策记录和责任分配，使团队在质量、成本、速度与风险之间做出清楚选择。可靠治理的表现，是重要问题有证据、有承担者、有动作和可复查的结果。<\/p><h2 id=\"section-6\">退出和替代也是治理能力<\/h2><p>团队应了解资料、配置、提示、评估资产和日志能否导出，以及迁移到替代服务需要什么。对关键依赖保留替代路径和负责人，可以降低服务变化带来的被动。退出计划不必预设立即更换供应商，但要知道不可替代部分在哪里。<\/p><p>治理材料也要避免过时。部署地区、保留设置、工具权限或负责人变化后，应更新记录。文档中的理想架构与实际配置不一致，会使评审失去意义。适当的配置检查和运行证据能够连接二者。<\/p><p>管理层需要看到的通常是用途、价值、风险和重要变化摘要，而专业团队需要具体技术证据。分层报告既能支持决策，也能避免把所有细节堆在同一张表中。<\/p><h2 id=\"section-7\">治理记录的最小结构<\/h2><p>一次重要变更可记录目的、影响任务、数据和工具变化、评估结果、风险、批准者、发布与回滚。记录不必很长，但要能回答为什么当时认为可以上线。事后发现问题时，这些证据有助于区分判断不足、实现偏差与环境变化。<\/p><p>供应商评估也应分清承诺与观测。服务文档说明能力，合同说明责任，实际监控说明运行情况。三者可能不完全一致，需要在采购和持续运行中共同检查。对关键服务，保留事件联系人与升级路径。<\/p><p>治理不应只看风险，还要看控制是否过度增加用户负担。适当分级和可复用标准能够让低风险改动高效推进，同时将专业注意力集中到高后果变化。<\/p><p>资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/12-06\">降级、容错与服务可靠性<\/a><\/li><li><a href=\"#lesson/15-08\">安全事件响应与风险验收<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.nist.gov/itl/ai-risk-management-framework\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI Risk Management Framework<\/a><\/li><li><a href=\"https://airc.nist.gov/airmf-resources/playbook/\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：AI RMF Playbook<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"从责任链而非委员会开始","level":2},{"id":"section-2","title":"审计需要能还原关键事实","level":2},{"id":"section-3","title":"供应商核验的核心内容","level":2},{"id":"section-4","title":"教学构造的模型升级","level":2},{"id":"section-5","title":"让治理形成持续运营","level":2},{"id":"section-6","title":"退出和替代也是治理能力","level":2},{"id":"section-7","title":"治理记录的最小结构","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 治理需要让重要决策、责任和变更可追溯。技术团队可以实现控制，但谁决定用途、谁接受残余风险、谁负责用户影响，也必须明确。供应商管理则帮助团队理解外部依赖及其变化会如何影响产品。\n\n## 从责任链而非委员会开始\n\n可以围绕任务与系统列出产品负责人、数据负责人、工程运维、安全隐私、业务使用者和管理者。每类责任说明具体决定与动作，例如批准新用途、管理资料权限、处理事件或更新评估。角色越明确，越不容易在问题出现时相互等待。\n\n治理并不意味着所有改动都需要同等流程。可以按影响分级：文字样式调整、提示变化、模型升级、新数据源、新工具权限的后果不同。变更流程应与风险匹配，同时保留必要证据。\n\n## 审计需要能还原关键事实\n\n关键事实包括任务发起者、使用身份、资料范围、模型与配置版本、工具动作、授权、结果与异常。记录应足以分析问题，但不应无限保存敏感原文。日志访问、保留、删除和导出同样需要控制。\n\n一条自然语言总结不能替代关键事件。模型可能错误描述自己做了什么，审计应依赖可信系统记录。对于外部动作，业务标识与状态比“助手说已完成”更有价值。\n\n## 供应商核验的核心内容\n\n了解服务能力、可用性、数据处理、地域、保留、模型更新、价格、许可、安全控制、事件通知和退出方式。文档、合同与实际配置需要一致。公开宣传可能描述一般能力，具体套餐或接口存在差异，应核对适用条件。\n\n模型供应商不是唯一依赖。检索服务、向量数据库、连接器、代理工具和日志平台都可能处理资料或影响可用性。依赖清单有助于发现单点故障与隐藏资料流向。\n\n## 教学构造的模型升级\n\n供应商推出新模型，团队希望替换旧版本。升级可能改善效果，也可能改变输出格式、拒答行为、延迟和成本。治理流程可以要求固定任务回归、关键权限检查、灰度与回滚准备，并记录批准依据。\n\n如果供应商自动更新，团队需要了解通知机制、可固定版本的能力及监控方案。不能保证完全避免变化，但可以降低变化不可见造成的影响。对用户承诺也应与服务现实匹配。\n\n## 让治理形成持续运营\n\n定期查看用途、资料、依赖、事件和指标是否变化，及时关闭不再需要的权限与服务。新业务用途可能超出最初批准范围，应重新评估。治理资产应接近日常工作，能够直接支持上线、采购、支持和复盘，而不是只用于展示。\n\n产品经理可以推动共同的决策记录和责任分配，使团队在质量、成本、速度与风险之间做出清楚选择。可靠治理的表现，是重要问题有证据、有承担者、有动作和可复查的结果。\n\n## 退出和替代也是治理能力\n\n团队应了解资料、配置、提示、评估资产和日志能否导出，以及迁移到替代服务需要什么。对关键依赖保留替代路径和负责人，可以降低服务变化带来的被动。退出计划不必预设立即更换供应商，但要知道不可替代部分在哪里。\n\n治理材料也要避免过时。部署地区、保留设置、工具权限或负责人变化后，应更新记录。文档中的理想架构与实际配置不一致，会使评审失去意义。适当的配置检查和运行证据能够连接二者。\n\n管理层需要看到的通常是用途、价值、风险和重要变化摘要，而专业团队需要具体技术证据。分层报告既能支持决策，也能避免把所有细节堆在同一张表中。\n\n## 治理记录的最小结构\n\n一次重要变更可记录目的、影响任务、数据和工具变化、评估结果、风险、批准者、发布与回滚。记录不必很长，但要能回答为什么当时认为可以上线。事后发现问题时，这些证据有助于区分判断不足、实现偏差与环境变化。\n\n供应商评估也应分清承诺与观测。服务文档说明能力，合同说明责任，实际监控说明运行情况。三者可能不完全一致，需要在采购和持续运行中共同检查。对关键服务，保留事件联系人与升级路径。\n\n治理不应只看风险，还要看控制是否过度增加用户负担。适当分级和可复用标准能够让低风险改动高效推进，同时将专业注意力集中到高后果变化。\n\n资料核验日期：2026-11-14。案例为教学构造；具体法律、合同和行业适用性需另行专业核验。\n\n### 关联阅读\n\n- [降级、容错与服务可靠性](12-06.md)\n- [安全事件响应与风险验收](15-08.md)\n\n### 资料与延伸阅读\n\n- [NIST：AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)\n- [NIST：AI RMF Playbook](https://airc.nist.gov/airmf-resources/playbook/)\n","chars":1423,"minutes":5,"summary":"AI 治理需要让重要决策、责任和变更可追溯。技术团队可以实现控制，但谁决定用途、谁接受残余风险、谁负责用户影响，也必须明确。供应商管理则帮助团队理解外部依赖及其变化会如何影响产品。"},{"id":"15-08","title":"安全事件响应与风险验收","file":"content/15-08.md","level":"工作应用","prerequisites":["15-07"],"aliases":["security","prompt injection","隐私"],"module":"15","moduleTitle":"安全、隐私与治理","html":"<p>安全事件响应的目标是限制影响、恢复服务、保护证据并防止再次发生。AI 事件可能表现为资料泄露、越权动作、恶意内容传播、成本异常或持续错误决策。团队需要在上线前明确发现、升级、停止和恢复的路径。<\/p><h2 id=\"section-1\">发现后先确认事实与范围<\/h2><p>记录何时发现、涉及哪些用户与任务、哪些资料和工具可能受影响、目前是否仍在发生。不要仅凭模型解释判断影响。可信日志、业务状态和服务记录可以帮助还原事件，必要时由专业团队进一步调查。<\/p><p>区分已确认事实、合理怀疑和未知部分，有助于减少错误传播。过早宣布“没有影响”或“已经彻底解决”，可能让团队错过持续风险。内部沟通与对外说明都应与证据一致，并遵循适用流程。<\/p><h2 id=\"section-2\">限制影响需要可执行开关<\/h2><p>可以暂停高风险工具、撤回凭证、限制数据源、切回只读、关闭特定用户或任务入口。控制粒度应能保护安全部分的价值，同时阻断事件路径。若只有关闭整个产品一个选项，恢复与业务影响会更难平衡。<\/p><p>停止 Agent 也不一定能撤回已提交的外部动作，需要核对实际业务状态。对已外发或已修改的内容，可能需要补偿、通知或业务处理。产品界面应反映真实状态，避免再次误导。<\/p><h2 id=\"section-3\">教学构造的疑似外泄<\/h2><p>研究助手读取恶意网页后尝试把内部资料发送到外部地址。若工具层阻断，仍需检查是否有其他路径成功、哪些资料进入上下文，以及相关任务是否持续运行。不能因为最终回答未展示资料就判定没有风险。<\/p><p>团队可以先关闭相关外发能力，保留必要记录，核验授权与网络限制，再修复边界并做针对性回归。恢复时说明范围、条件和监控重点，而不是只更新提示就立即全量开放。<\/p><h2 id=\"section-4\">风险验收需要明确承担者<\/h2><p>没有系统能够证明绝对零风险。上线或恢复决策应说明已经采取的控制、证据、剩余风险、接受理由与负责人。对高后果风险，可能需要更专业的评估与更严格门槛。接受风险不应由最接近实现的人被动承担。<\/p><p>验收也应有复审条件，例如新增工具、扩大资料范围、出现类似事件或供应商行为变化。风险结论适用于特定版本和用途，不能无限延伸。<\/p><h2 id=\"section-5\">从事件转为改进<\/h2><p>复盘需要分析直接原因、放大因素、检测为何迟到、响应哪里受阻，以及后续措施是否完成。避免把问题简单归结为“模型犯错”或“用户误用”。真正可改进的部分可能包括权限、任务设计、日志、确认和组织责任。<\/p><p>产品经理负责把事件经验转化为用户流程、能力边界和验收要求，安全与工程负责专业修复和核验。闭环的终点是措施在真实系统中生效，并有证据说明影响已经得到适当处理。<\/p><h2 id=\"section-6\">恢复要有分阶段证据<\/h2><p>修复完成后，可以先在受控任务验证，再小范围开放，并监控原事件路径和相关变体。只验证原始触发文本可能漏掉同类问题。恢复条件应包括控制已生效、关键功能可用、监控与响应准备就绪。<\/p><p>事件沟通还需说明用户能采取什么行动，例如检查某些结果、暂停特定流程或重新授权。具体通知义务和时间要求应由适当专业人员核验。产品文案需要基于已确认事实，避免技术团队与客户支持各说一套。<\/p><p>复盘行动应有负责人、期限或触发条件及验证方式。关闭一个问题单不等于风险已降低，关键是系统行为是否改变、相关人员是否理解新流程，以及后续是否仍有复发迹象。<\/p><h2 id=\"section-7\">事件分级与信息最小化<\/h2><p>分级可以参考影响资料、用户数量、外部动作、持续性和业务后果。少量用户的高敏感泄露可能比大量普通错误更严重，不能只按数量排序。分级依据需要与组织响应流程一致。<\/p><p>调查资料应保留必要证据并控制访问。为了排查而把全部对话广泛复制，可能制造二次风险。可以使用任务标识、时间、版本和脱敏片段，在专业授权范围内进一步取证。<\/p><p>恢复后还应检查补偿与用户影响是否处理。技术漏洞修复不代表错误记录、外发信息或客户工作已经恢复。事件闭环需要业务、安全、支持和产品共同确认，形成完整的影响处理与防复发证据。<\/p><p>资料核验日期
