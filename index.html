口失败后仍说“已创建”。不同形式对应不同修复方式，不能统一归为模型不够聪明。\n\n信息缺失、训练材料中的错误、上下文冲突、任务诱导和系统反馈不足，都可能导致不可靠输出。即使加入“不要编造”指令，也无法消除所有问题。需要将证据获取、答案约束和结果校验组合起来，并在无法确认时提供合适的下一步。\n\n## 检索与工具怎样改变边界\n\nRAG 可以提供外部资料，但检索可能命中错版本或遗漏关键条款。工具可以提供实时状态，但调用可能超时或返回不完整。模型能访问工具，并不代表它总会选择正确工具或正确解读结果。因此必须分别检查资料、调用与生成三层。\n\n教学构造例子：用户询问设备是否可恢复运行。模型找到相似型号手册并给出步骤，语言上非常专业，但型号不一致可能导致严重问题。正确路径应先确认型号、资料版本和现场条件，再决定是否能给出建议。高风险场景还需要专业判断与明确控制边界。\n\n## 如何判断需要更强模型还是更好系统\n\n如果错误来自复杂约束理解，可以比较更适配模型；来自知识缺失则检查检索与数据；来自工具结果未回填则修复流程；来自执行后未核验则补充完成判定。先做失败分类，才能避免用更昂贵模型掩盖系统缺陷。\n\n评估应覆盖真实任务、长尾和失败条件，并记录模型版本、输入、工具状态与结果。对同一任务多次运行，可以观察稳定性；对关键错误应单独报告，避免被平均成功率掩盖。推理预算增加后的收益，也需要与延迟和成本一起衡量。\n\n## 面向用户的可靠性设计\n\n提供来源、明确缺失条件、允许编辑与接管，并在关键动作前确认，能够让用户合理依赖系统。承诺应围绕经过验证的能力范围。持续改进的重点是减少特定失败、扩大可验证任务范围，而不是宣称模型已经不会幻觉。\n\n## 资料与延伸阅读\n\n- [InstructGPT 原论文](https://arxiv.org/abs/2203.02155)\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [Anthropic：Effective context engineering](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n\n核验日期：2026-11-14。采购与设备情境为教学构造，不代表具体模型的实测结论。\n","chars":1221,"minutes":5,"summary":"推理能力指模型处理多步关系、约束和问题求解的表现；幻觉通常指生成了缺乏依据、与事实不符或与给定资料冲突的内容。二者并不互相排斥：模型可以在复杂问题中表现出色，也可能在简单事实或执行结果上犯错。产品需要分别理解能力和可靠性。"},{"id":"03-01","title":"客户端、服务端与系统数据流","file":"content/03-01.md","level":"基础理解","prerequisites":[],"aliases":["API","HTTP","JSON","SQL","Python","Git"],"module":"03","moduleTitle":"产品经理技术基础","html":"<p>理解 AI 系统不必先学会完整开发，但需要看懂信息从哪里来、经过谁处理、存到哪里，以及哪个环节有权执行动作。客户端、服务端和外部服务构成一条数据链路。画清这条链路，可以把模糊的“助手出错”转化为可定位的问题。<\/p><h2 id=\"section-1\">客户端与服务端分别承担什么<\/h2><p>客户端是用户直接操作的界面，例如手机网页、桌面软件或浏览器。它负责输入、展示、部分交互状态和本地处理。服务端运行在提供服务的计算环境中，处理业务逻辑、权限、数据库访问和其他服务调用。实际产品可以有多层服务，边界取决于架构，而不是一个固定模板。<\/p><p>界面展示一个按钮，不代表按钮背后的操作一定被允许。服务端需要独立校验用户身份、权限和业务条件，因为客户端代码和请求可以被修改。模型提出某个动作也同样不能绕过校验。将权限只写在提示词或隐藏按钮中，不能形成可靠的执行边界。<\/p><h2 id=\"section-2\">一次 AI 请求的数据流<\/h2><p>教学构造例子：用户在网页中询问工单进展。客户端将问题与会话标识发给应用服务；应用验证身份，读取用户可见工单，再组合指令与资料调用模型；模型可能请求进一步工具查询；应用执行工具并返回结果；最后把答案逐步显示给用户。每一步都有输入、输出、失败和时间成本。<\/p><p>模型服务通常不应直接获得全部数据库权限。应用可以提供范围明确的工具，例如仅查询指定工单，并限制字段与操作。这样即使模型理解错误，也有机会在系统层阻止越权或无效参数。清晰的数据流帮助产品定义授权与错误提示。<\/p><h2 id=\"section-3\">状态与数据存储<\/h2><p>临时界面状态、会话历史、业务记录和长期用户偏好是不同数据。刷新页面后丢失的输入，可能只存在客户端内存；已提交的业务任务则应由服务端持久保存。用户看到“正在处理”，不代表后台任务仍然存活，需要实际任务状态支撑。<\/p><p>长任务应有稳定标识、状态和结果位置，方便断线后恢复。客户端可以重连并读取已有任务，而不是自动创建新任务。若用户反复点击按钮，服务端还需要防止重复执行，尤其是发邮件、创建订单或修改配置等有副作用的操作。<\/p><h2 id=\"section-4\">同步与异步的区别<\/h2><p>同步处理通常让请求等待结果后返回，适合耗时较短的流程。异步处理先创建任务并返回标识，后台继续工作，客户端再查询或接收通知。异步并不自动更快，而是改变等待与资源组织方式。产品需要定义排队、运行、等待用户、失败和完成等状态。<\/p><p>若任务依赖外部工具，其状态还可能是部分成功。比如报告已经生成，但上传失败。将整个任务压成单一成功或失败，会丢失用户恢复操作需要的信息。任务模型应保留阶段结果，说明哪些动作已实际发生。<\/p><h2 id=\"section-5\">信任边界与数据最小化<\/h2><p>资料从数据库进入应用，再进入模型或第三方工具时，跨越了不同处理边界。需要明确哪些字段必要、是否包含敏感内容、谁会保留日志，以及是否能删除。把无关个人信息全部加入提示，不仅增加成本，也扩大暴露范围。<\/p><p>教学构造例子：查询设备故障手册通常不需要客户私人手机号。可以在应用层选择必要字段，并将用户身份用于权限判断而非直接交给模型。这样既减少上下文噪声，也让数据使用更容易解释和审计。<\/p><h2 id=\"section-6\">产品经理如何描述架构<\/h2><p>先画用户、界面、应用服务、数据、模型和工具六类节点，再标出请求方向和关键状态。每条线说明传什么、由谁授权、失败怎样表现。你不需要先决定所有技术框架，却应能让团队对业务行为形成一致理解。<\/p><p>当用户反馈错误时，先确认发生在哪一阶段：输入未提交、资料未读取、模型未返回、工具失败还是展示错误。保留任务标识和时间，可以让研发快速定位。技术基础的价值就在于把用户问题与系统证据连接起来。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：Overview of HTTP<\/a><\/li><li><a href=\"https://opentelemetry.io/docs/concepts/signals/logs/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenTelemetry：Logs<\/a><\/li><\/ul><p>核验日期：2026-11-14。工单流程为教学构造架构；具体部署与数据处理范围以实际系统为准。<\/p>","toc":[{"id":"section-1","title":"客户端与服务端分别承担什么","level":2},{"id":"section-2","title":"一次 AI 请求的数据流","level":2},{"id":"section-3","title":"状态与数据存储","level":2},{"id":"section-4","title":"同步与异步的区别","level":2},{"id":"section-5","title":"信任边界与数据最小化","level":2},{"id":"section-6","title":"产品经理如何描述架构","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"理解 AI 系统不必先学会完整开发，但需要看懂信息从哪里来、经过谁处理、存到哪里，以及哪个环节有权执行动作。客户端、服务端和外部服务构成一条数据链路。画清这条链路，可以把模糊的“助手出错”转化为可定位的问题。\n\n## 客户端与服务端分别承担什么\n\n客户端是用户直接操作的界面，例如手机网页、桌面软件或浏览器。它负责输入、展示、部分交互状态和本地处理。服务端运行在提供服务的计算环境中，处理业务逻辑、权限、数据库访问和其他服务调用。实际产品可以有多层服务，边界取决于架构，而不是一个固定模板。\n\n界面展示一个按钮，不代表按钮背后的操作一定被允许。服务端需要独立校验用户身份、权限和业务条件，因为客户端代码和请求可以被修改。模型提出某个动作也同样不能绕过校验。将权限只写在提示词或隐藏按钮中，不能形成可靠的执行边界。\n\n## 一次 AI 请求的数据流\n\n教学构造例子：用户在网页中询问工单进展。客户端将问题与会话标识发给应用服务；应用验证身份，读取用户可见工单，再组合指令与资料调用模型；模型可能请求进一步工具查询；应用执行工具并返回结果；最后把答案逐步显示给用户。每一步都有输入、输出、失败和时间成本。\n\n模型服务通常不应直接获得全部数据库权限。应用可以提供范围明确的工具，例如仅查询指定工单，并限制字段与操作。这样即使模型理解错误，也有机会在系统层阻止越权或无效参数。清晰的数据流帮助产品定义授权与错误提示。\n\n## 状态与数据存储\n\n临时界面状态、会话历史、业务记录和长期用户偏好是不同数据。刷新页面后丢失的输入，可能只存在客户端内存；已提交的业务任务则应由服务端持久保存。用户看到“正在处理”，不代表后台任务仍然存活，需要实际任务状态支撑。\n\n长任务应有稳定标识、状态和结果位置，方便断线后恢复。客户端可以重连并读取已有任务，而不是自动创建新任务。若用户反复点击按钮，服务端还需要防止重复执行，尤其是发邮件、创建订单或修改配置等有副作用的操作。\n\n## 同步与异步的区别\n\n同步处理通常让请求等待结果后返回，适合耗时较短的流程。异步处理先创建任务并返回标识，后台继续工作，客户端再查询或接收通知。异步并不自动更快，而是改变等待与资源组织方式。产品需要定义排队、运行、等待用户、失败和完成等状态。\n\n若任务依赖外部工具，其状态还可能是部分成功。比如报告已经生成，但上传失败。将整个任务压成单一成功或失败，会丢失用户恢复操作需要的信息。任务模型应保留阶段结果，说明哪些动作已实际发生。\n\n## 信任边界与数据最小化\n\n资料从数据库进入应用，再进入模型或第三方工具时，跨越了不同处理边界。需要明确哪些字段必要、是否包含敏感内容、谁会保留日志，以及是否能删除。把无关个人信息全部加入提示，不仅增加成本，也扩大暴露范围。\n\n教学构造例子：查询设备故障手册通常不需要客户私人手机号。可以在应用层选择必要字段，并将用户身份用于权限判断而非直接交给模型。这样既减少上下文噪声，也让数据使用更容易解释和审计。\n\n## 产品经理如何描述架构\n\n先画用户、界面、应用服务、数据、模型和工具六类节点，再标出请求方向和关键状态。每条线说明传什么、由谁授权、失败怎样表现。你不需要先决定所有技术框架，却应能让团队对业务行为形成一致理解。\n\n当用户反馈错误时，先确认发生在哪一阶段：输入未提交、资料未读取、模型未返回、工具失败还是展示错误。保留任务标识和时间，可以让研发快速定位。技术基础的价值就在于把用户问题与系统证据连接起来。\n\n## 资料与延伸阅读\n\n- [MDN：Overview of HTTP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview)\n- [OpenTelemetry：Logs](https://opentelemetry.io/docs/concepts/signals/logs/)\n\n核验日期：2026-11-14。工单流程为教学构造架构；具体部署与数据处理范围以实际系统为准。\n","chars":1304,"minutes":5,"summary":"理解 AI 系统不必先学会完整开发，但需要看懂信息从哪里来、经过谁处理、存到哪里，以及哪个环节有权执行动作。客户端、服务端和外部服务构成一条数据链路。画清这条链路，可以把模糊的“助手出错”转化为可定位的问题。"},{"id":"03-02","title":"HTTP 与 API：一次请求发生了什么","file":"content/03-02.md","level":"基础理解","prerequisites":["03-01"],"aliases":["API","HTTP","JSON","SQL","Python","Git"],"module":"03","moduleTitle":"产品经理技术基础","html":"<p>API 是系统之间约定的调用方式；HTTP 是 Web 中常用的通信协议。一份清楚的 API 契约说明调用什么资源、传哪些参数、身份怎样验证、返回什么，以及失败如何表达。对 Agent 产品而言，工具本质上也需要这样的明确契约。<\/p><h2 id=\"section-1\">一次请求的组成<\/h2><p>HTTP 请求通常包含方法、地址、请求头和可选请求体。GET 常用于读取资源，POST 常用于提交处理或创建，其他方法也有各自语义。请求头可以携带内容类型、授权信息和追踪标识；请求体常使用 JSON。具体接口行为仍由服务文档定义，不能仅凭方法名推断全部副作用。<\/p><p>教学构造例子：读取工单可以调用 <code>GET /tickets/T100<\/code>；创建任务可以向 <code>POST /tasks<\/code> 提交目标和参数。返回内容可能包括任务编号、状态和结果地址。产品经理应能看懂字段含义与必填条件，无需记住每种协议细节，但不能把接口当成只有名称的黑盒。<\/p><h2 id=\"section-2\">状态码与业务结果分开看<\/h2><p>HTTP 状态码提供协议层面的结果线索，例如成功、客户端请求问题或服务端问题。业务是否完成还要查看返回体。有些接口即使返回成功状态，也可能表示任务已受理、仍在排队；还有些旧系统把业务错误放在正常响应里。客户端需要依据具体契约处理。<\/p><p>接口超时尤其容易被误解。调用方没有及时收到结果，不代表服务端没有执行。若因此直接再次提交，可能产生重复邮件或订单。可以使用幂等标识、任务查询和结果确认来区分“未完成”与“结果未知”。这对 Agent 的自动重试非常重要。<\/p><h2 id=\"section-3\">认证与授权<\/h2><p>认证回答“你是谁”，授权回答“你能做什么”。API Key、令牌和会话都是可能的认证方式，但具体保护机制各不相同。密钥不应放入公开网页或提示内容，也不应完整写入日志。用户拥有应用访问权，不代表自动拥有全部工具资源权限。<\/p><p>教学构造例子：Agent 接到“删除团队文档”的要求，工具调用需要检查当前用户是否具有对应文档权限，以及产品是否允许自动删除。模型判断用户语气明确，不能代替真实授权。服务端应依据实际资源和身份校验，而不是信任模型生成的“已授权”字段。<\/p><h2 id=\"section-4\">限流、分页与版本<\/h2><p>接口可能限制单位时间请求量、单次返回条数和负载大小。分页意味着第一次返回不一定包含全部记录；忽略后续页会让 Agent 误以为数据完整。限流则需要排队、退避或提示用户等待，盲目重试可能使拥塞更严重。<\/p><p>接口版本变化可能影响字段、默认值或行为。模型工具描述、参数校验与底层接口应同步更新。若文档已变但提示仍保留旧参数，系统可能持续生成无效请求。因此 API 版本属于产品可用性与维护的一部分。<\/p><h2 id=\"section-5\">错误怎样变成用户可理解的信息<\/h2><p>接口错误信息通常为开发者设计，用户需要的是影响与恢复方式。可以把“缺少必填参数”转成需要补充的具体信息，把暂时不可用转成重试或稍后继续的路径。不要将所有错误都包装成“网络异常”，这会让用户反复尝试而无法解决。<\/p><p>保留请求标识、时间、接口名和脱敏参数，有助于研发排查；界面只展示必要内容。对于部分执行的任务，还应说明已经发生的动作，避免用户误以为完全没有影响。错误处理应在需求阶段定义，而不是等上线后逐条补文案。<\/p><h2 id=\"section-6\">从接口到工具产品<\/h2><p>把一个 API 暴露给模型时，还需要清楚的工具描述、输入 Schema、返回结构与副作用说明。模型会依据这些信息选择工具，模糊命名和重叠功能可能增加误用。接口设计影响的不只是研发效率，也影响 Agent 能否正确理解和完成用户任务。<\/p><h3 id=\"section-7\">一个请求的可读说明<\/h3><p>例如创建报告任务时，请求体只需任务目标、允许资料与输出格式，用户身份由可信认证机制确定。返回任务编号后，客户端继续查询该编号。不要让模型在请求体里随意填写管理员身份，再由服务端直接信任。字段看似相同，来源的可信程度却不同。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：Overview of HTTP<\/a><\/li><li><a href=\"https://json-schema.org/understanding-json-schema\" target=\"_blank\" rel=\"noopener noreferrer\">JSON Schema Reference<\/a><\/li><\/ul><p>核验日期：2026-11-14。接口路径为教学构造；HTTP 方法、状态与业务契约应结合实际实现解读。<\/p>","toc":[{"id":"section-1","title":"一次请求的组成","level":2},{"id":"section-2","title":"状态码与业务结果分开看","level":2},{"id":"section-3","title":"认证与授权","level":2},{"id":"section-4","title":"限流、分页与版本","level":2},{"id":"section-5","title":"错误怎样变成用户可理解的信息","level":2},{"id":"section-6","title":"从接口到工具产品","level":2},{"id":"section-7","title":"一个请求的可读说明","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"API 是系统之间约定的调用方式；HTTP 是 Web 中常用的通信协议。一份清楚的 API 契约说明调用什么资源、传哪些参数、身份怎样验证、返回什么，以及失败如何表达。对 Agent 产品而言，工具本质上也需要这样的明确契约。\n\n## 一次请求的组成\n\nHTTP 请求通常包含方法、地址、请求头和可选请求体。GET 常用于读取资源，POST 常用于提交处理或创建，其他方法也有各自语义。请求头可以携带内容类型、授权信息和追踪标识；请求体常使用 JSON。具体接口行为仍由服务文档定义，不能仅凭方法名推断全部副作用。\n\n教学构造例子：读取工单可以调用 `GET /tickets/T100`；创建任务可以向 `POST /tasks` 提交目标和参数。返回内容可能包括任务编号、状态和结果地址。产品经理应能看懂字段含义与必填条件，无需记住每种协议细节，但不能把接口当成只有名称的黑盒。\n\n## 状态码与业务结果分开看\n\nHTTP 状态码提供协议层面的结果线索，例如成功、客户端请求问题或服务端问题。业务是否完成还要查看返回体。有些接口即使返回成功状态，也可能表示任务已受理、仍在排队；还有些旧系统把业务错误放在正常响应里。客户端需要依据具体契约处理。\n\n接口超时尤其容易被误解。调用方没有及时收到结果，不代表服务端没有执行。若因此直接再次提交，可能产生重复邮件或订单。可以使用幂等标识、任务查询和结果确认来区分“未完成”与“结果未知”。这对 Agent 的自动重试非常重要。\n\n## 认证与授权\n\n认证回答“你是谁”，授权回答“你能做什么”。API Key、令牌和会话都是可能的认证方式，但具体保护机制各不相同。密钥不应放入公开网页或提示内容，也不应完整写入日志。用户拥有应用访问权，不代表自动拥有全部工具资源权限。\n\n教学构造例子：Agent 接到“删除团队文档”的要求，工具调用需要检查当前用户是否具有对应文档权限，以及产品是否允许自动删除。模型判断用户语气明确，不能代替真实授权。服务端应依据实际资源和身份校验，而不是信任模型生成的“已授权”字段。\n\n## 限流、分页与版本\n\n接口可能限制单位时间请求量、单次返回条数和负载大小。分页意味着第一次返回不一定包含全部记录；忽略后续页会让 Agent 误以为数据完整。限流则需要排队、退避或提示用户等待，盲目重试可能使拥塞更严重。\n\n接口版本变化可能影响字段、默认值或行为。模型工具描述、参数校验与底层接口应同步更新。若文档已变但提示仍保留旧参数，系统可能持续生成无效请求。因此 API 版本属于产品可用性与维护的一部分。\n\n## 错误怎样变成用户可理解的信息\n\n接口错误信息通常为开发者设计，用户需要的是影响与恢复方式。可以把“缺少必填参数”转成需要补充的具体信息，把暂时不可用转成重试或稍后继续的路径。不要将所有错误都包装成“网络异常”，这会让用户反复尝试而无法解决。\n\n保留请求标识、时间、接口名和脱敏参数，有助于研发排查；界面只展示必要内容。对于部分执行的任务，还应说明已经发生的动作，避免用户误以为完全没有影响。错误处理应在需求阶段定义，而不是等上线后逐条补文案。\n\n## 从接口到工具产品\n\n把一个 API 暴露给模型时，还需要清楚的工具描述、输入 Schema、返回结构与副作用说明。模型会依据这些信息选择工具，模糊命名和重叠功能可能增加误用。接口设计影响的不只是研发效率，也影响 Agent 能否正确理解和完成用户任务。\n\n### 一个请求的可读说明\n\n例如创建报告任务时，请求体只需任务目标、允许资料与输出格式，用户身份由可信认证机制确定。返回任务编号后，客户端继续查询该编号。不要让模型在请求体里随意填写管理员身份，再由服务端直接信任。字段看似相同，来源的可信程度却不同。\n\n## 资料与延伸阅读\n\n- [MDN：Overview of HTTP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview)\n- [JSON Schema Reference](https://json-schema.org/understanding-json-schema)\n\n核验日期：2026-11-14。接口路径为教学构造；HTTP 方法、状态与业务契约应结合实际实现解读。\n","chars":1287,"minutes":5,"summary":"API 是系统之间约定的调用方式；HTTP 是 Web 中常用的通信协议。一份清楚的 API 契约说明调用什么资源、传哪些参数、身份怎样验证、返回什么，以及失败如何表达。对 Agent 产品而言，工具本质上也需要这样的明确契约。"},{"id":"03-03","title":"JSON、Schema 与结构化数据契约","file":"content/03-03.md","level":"基础理解","prerequisites":["03-02"],"aliases":["API","HTTP","JSON","SQL","Python","Git"],"module":"03","moduleTitle":"产品经理技术基础","html":"<p>JSON 是系统交换结构化数据的常见格式，Schema 用于说明和验证数据结构。理解二者，可以帮助你把自然语言需求转成清楚的字段契约，也能理解为什么“模型输出了合法 JSON”仍不等于业务正确。<\/p><h2 id=\"section-1\">JSON 的基本组成<\/h2><p>JSON 支持对象、数组、字符串、数字、布尔值和空值。对象由键值对组成，数组是有顺序的元素集合。字符串使用双引号，数字不应混入单位文字。<code>null<\/code> 表示空值，但其业务含义需要另行定义；缺少字段与字段值为空也可能有不同含义。<\/p><p>教学构造例子：一条任务数据可以包含 <code>task_id<\/code>、<code>status<\/code> 和 <code>items<\/code>。若把温度写成字符串“36℃”，程序不能直接按数字计算；若字段规定为数字并单独给出单位，后续处理更清楚。格式设计应服务于系统消费，而不是只追求看起来整齐。<\/p><h2 id=\"section-2\">Schema 描述允许的数据<\/h2><p>Schema 可以规定字段类型、必填项、枚举、数值范围和嵌套结构。例如状态只能为排队、运行、完成或失败，金额必须为非负数。它把隐含约定变成机器可检查的规则，也帮助工具使用者理解怎样构造请求。<\/p><p>但不同平台支持的 Schema 范围可能不同，复杂条件不能假设都可用。版本也影响语义。需要明确采用的规范版本，以及生成端和验证端是否一致。只在提示里放一个示例，不等于已经建立完整契约。<\/p><h2 id=\"section-3\">三层正确性<\/h2><p>第一层是语法合法，数据能够解析。第二层是结构符合契约，例如字段齐全、类型正确。第三层是语义与业务正确，例如工单编号真实存在、用户拥有权限、金额与订单一致。前两层可以借助解析器与 Schema，第三层还需要数据查询和业务校验。<\/p><p>教学构造例子：模型输出了格式正确的 <code>customer_id<\/code>，但编号属于另一个客户。JSON 没有错，Schema 也可能通过，操作仍然越权。不能因为平台提供“结构化输出”就省略服务端校验。结构约束降低某些失败，不负责证明所有内容真实。<\/p><h2 id=\"section-4\">缺失、未知与不适用<\/h2><p>字段设计应区分没有提供、暂时未知、不适用和明确为空。如果一律填空字符串，后续系统无法判断需要追问还是可以继续。对于抽取任务，可以允许 <code>null<\/code> 并附证据定位，而不是要求模型在资料缺失时强行猜出一个值。<\/p><p>枚举同样需要覆盖真实边界。若只有“成功”和“失败”，长任务的等待用户、部分完成和取消都难以表达。状态集合需要与业务流程对应，并说明允许的转换关系。清楚的结构可以减少模型与客户端各自猜测。<\/p><h2 id=\"section-5\">契约如何演进<\/h2><p>新增可选字段通常比改变已有字段含义更容易兼容，但实际影响仍要检查消费者。改变单位、枚举或字段类型，即使名字未变，也可能破坏逻辑。版本、迁移说明和回退策略应与工具及模型提示同步维护。<\/p><p>对于生成结果，可以先验证再执行。验证失败时，应保留原因并决定是修复格式、补充信息还是结束任务。自动把任何无效输出反复交给模型重写，可能增加成本而掩盖业务错误。恢复策略要根据失败层级选择。<\/p><h2 id=\"section-6\">产品经理的工作方式<\/h2><p>写字段说明时，应包括含义、类型、单位、来源、必填条件、允许值、缺失处理和示例。还要说明哪些字段由用户输入、模型推断、工具返回或系统生成。来源不同，可信程度与校验方式也不同。<\/p><p>这种契约思维可用于 AI 抽取、工具调用、配置生成和任务状态。你不必亲自编写所有 Schema，也应能评审字段是否完整、模糊情况是否可表达，以及错误能否被定位。结构化数据是把语言能力连接到可靠系统的重要桥梁。<\/p><h3 id=\"section-7\">一个最小结构示例<\/h3><pre><code>{&quot;task_id&quot;:&quot;T100&quot;,&quot;status&quot;:&quot;running&quot;,&quot;result&quot;:null}<\/code><\/pre><p>这里状态说明尚未完成，结果为空不是失败。若客户端把空值解释为没有任何发现，就会提前产生错误结论。字段解释、状态转换和展示规则需要共同定义，不能只交付一段 JSON。<\/p><h2 id=\"section-8\">把业务条件放在哪一层<\/h2><p>Schema 可以要求温度为数字，但“此型号是否允许这个温度”通常依赖型号与规则表。Schema 可以要求订单号非空，但订单归属需要查询。把复杂业务条件全部塞进字段约束，可能难以维护；完全不写约束，又把明显错误留到后面。合理做法是分层处理并让错误可定位。<\/p><p>接口返回可以区分 <code>invalid_format<\/code>、<code>missing_information<\/code>、<code>not_authorized<\/code> 和 <code>business_conflict<\/code> 等类别，具体命名由团队约定。不同类别决定模型应修复格式、追问用户、停止还是重新获取状态。错误契约越清楚，Agent 越不需要猜测失败含义，也更容易避免无意义重试。<\/p><h2 id=\"section-9\">一个 Schema 片段的含义<\/h2><pre><code>{\n  &quot;type&quot;: &quot;object&quot;,\n  &quot;properties&quot;: {\n    &quot;status&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;enum&quot;: [&quot;running&quot;, &quot;done&quot;]}\n  },\n  &quot;required&quot;: [&quot;status&quot;]\n}<\/code><\/pre><p>这个片段要求存在状态字段，并将取值限制在两个字符串中。它没有说明任务怎样从运行进入完成，也没有检查完成是否真实。后者需要状态机与结果证据。实际设计还应考虑失败、取消与等待，不宜直接复制这个为解释而简化的范围。<\/p><h2 id=\"section-10\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.rfc-editor.org/rfc/rfc8259\" target=\"_blank\" rel=\"noopener noreferrer\">RFC 8259：JSON 数据交换格式<\/a><\/li><li><a href=\"https://json-schema.org/understanding-json-schema\" target=\"_blank\" rel=\"noopener noreferrer\">JSON Schema Reference<\/a><\/li><\/ul><p>核验日期：2026-11-14。任务与客户字段为教学构造；具体结构化输出能力需按使用平台的支持范围核验。<\/p>","toc":[{"id":"section-1","title":"JSON 的基本组成","level":2},{"id":"section-2","title":"Schema 描述允许的数据","level":2},{"id":"section-3","title":"三层正确性","level":2},{"id":"section-4","title":"缺失、未知与不适用","level":2},{"id":"section-5","title":"契约如何演进","level":2},{"id":"section-6","title":"产品经理的工作方式","level":2},{"id":"section-7","title":"一个最小结构示例","level":3},{"id":"section-8","title":"把业务条件放在哪一层","level":2},{"id":"section-9","title":"一个 Schema 片段的含义","level":2},{"id":"section-10","title":"资料与延伸阅读","level":2}],"text":"JSON 是系统交换结构化数据的常见格式，Schema 用于说明和验证数据结构。理解二者，可以帮助你把自然语言需求转成清楚的字段契约，也能理解为什么“模型输出了合法 JSON”仍不等于业务正确。\n\n## JSON 的基本组成\n\nJSON 支持对象、数组、字符串、数字、布尔值和空值。对象由键值对组成，数组是有顺序的元素集合。字符串使用双引号，数字不应混入单位文字。`null` 表示空值，但其业务含义需要另行定义；缺少字段与字段值为空也可能有不同含义。\n\n教学构造例子：一条任务数据可以包含 `task_id`、`status` 和 `items`。若把温度写成字符串“36℃”，程序不能直接按数字计算；若字段规定为数字并单独给出单位，后续处理更清楚。格式设计应服务于系统消费，而不是只追求看起来整齐。\n\n## Schema 描述允许的数据\n\nSchema 可以规定字段类型、必填项、枚举、数值范围和嵌套结构。例如状态只能为排队、运行、完成或失败，金额必须为非负数。它把隐含约定变成机器可检查的规则，也帮助工具使用者理解怎样构造请求。\n\n但不同平台支持的 Schema 范围可能不同，复杂条件不能假设都可用。版本也影响语义。需要明确采用的规范版本，以及生成端和验证端是否一致。只在提示里放一个示例，不等于已经建立完整契约。\n\n## 三层正确性\n\n第一层是语法合法，数据能够解析。第二层是结构符合契约，例如字段齐全、类型正确。第三层是语义与业务正确，例如工单编号真实存在、用户拥有权限、金额与订单一致。前两层可以借助解析器与 Schema，第三层还需要数据查询和业务校验。\n\n教学构造例子：模型输出了格式正确的 `customer_id`，但编号属于另一个客户。JSON 没有错，Schema 也可能通过，操作仍然越权。不能因为平台提供“结构化输出”就省略服务端校验。结构约束降低某些失败，不负责证明所有内容真实。\n\n## 缺失、未知与不适用\n\n字段设计应区分没有提供、暂时未知、不适用和明确为空。如果一律填空字符串，后续系统无法判断需要追问还是可以继续。对于抽取任务，可以允许 `null` 并附证据定位，而不是要求模型在资料缺失时强行猜出一个值。\n\n枚举同样需要覆盖真实边界。若只有“成功”和“失败”，长任务的等待用户、部分完成和取消都难以表达。状态集合需要与业务流程对应，并说明允许的转换关系。清楚的结构可以减少模型与客户端各自猜测。\n\n## 契约如何演进\n\n新增可选字段通常比改变已有字段含义更容易兼容，但实际影响仍要检查消费者。改变单位、枚举或字段类型，即使名字未变，也可能破坏逻辑。版本、迁移说明和回退策略应与工具及模型提示同步维护。\n\n对于生成结果，可以先验证再执行。验证失败时，应保留原因并决定是修复格式、补充信息还是结束任务。自动把任何无效输出反复交给模型重写，可能增加成本而掩盖业务错误。恢复策略要根据失败层级选择。\n\n## 产品经理的工作方式\n\n写字段说明时，应包括含义、类型、单位、来源、必填条件、允许值、缺失处理和示例。还要说明哪些字段由用户输入、模型推断、工具返回或系统生成。来源不同，可信程度与校验方式也不同。\n\n这种契约思维可用于 AI 抽取、工具调用、配置生成和任务状态。你不必亲自编写所有 Schema，也应能评审字段是否完整、模糊情况是否可表达，以及错误能否被定位。结构化数据是把语言能力连接到可靠系统的重要桥梁。\n\n### 一个最小结构示例\n\n```json\n{\"task_id\":\"T100\",\"status\":\"running\",\"result\":null}\n```\n\n这里状态说明尚未完成，结果为空不是失败。若客户端把空值解释为没有任何发现，就会提前产生错误结论。字段解释、状态转换和展示规则需要共同定义，不能只交付一段 JSON。\n\n## 把业务条件放在哪一层\n\nSchema 可以要求温度为数字，但“此型号是否允许这个温度”通常依赖型号与规则表。Schema 可以要求订单号非空，但订单归属需要查询。把复杂业务条件全部塞进字段约束，可能难以维护；完全不写约束，又把明显错误留到后面。合理做法是分层处理并让错误可定位。\n\n接口返回可以区分 `invalid_format`、`missing_information`、`not_authorized` 和 `business_conflict` 等类别，具体命名由团队约定。不同类别决定模型应修复格式、追问用户、停止还是重新获取状态。错误契约越清楚，Agent 越不需要猜测失败含义，也更容易避免无意义重试。\n\n## 一个 Schema 片段的含义\n\n```json\n{\n  \"type\": \"object\",\n  \"properties\": {\n    \"status\": {\"type\": \"string\", \"enum\": [\"running\", \"done\"]}\n  },\n  \"required\": [\"status\"]\n}\n```\n\n这个片段要求存在状态字段，并将取值限制在两个字符串中。它没有说明任务怎样从运行进入完成，也没有检查完成是否真实。后者需要状态机与结果证据。实际设计还应考虑失败、取消与等待，不宜直接复制这个为解释而简化的范围。\n\n## 资料与延伸阅读\n\n- [RFC 8259：JSON 数据交换格式](https://www.rfc-editor.org/rfc/rfc8259)\n- [JSON Schema Reference](https://json-schema.org/understanding-json-schema)\n\n核验日期：2026-11-14。任务与客户字段为教学构造；具体结构化输出能力需按使用平台的支持范围核验。\n","chars":1527,"minutes":6,"summary":"JSON 是系统交换结构化数据的常见格式，Schema 用于说明和验证数据结构。理解二者，可以帮助你把自然语言需求转成清楚的字段契约，也能理解为什么“模型输出了合法 JSON”仍不等于业务正确。"},{"id":"03-04","title":"流式响应、异步任务与状态轮询","file":"content/03-04.md","level":"基础理解","prerequisites":["03-03"],"aliases":["API","HTTP","JSON","SQL","Python","Git"],"module":"03","moduleTitle":"产品经理技术基础","html":"<p>AI 生成可能持续数秒，多步 Agent 可能运行更久。流式响应与异步任务解决不同问题：前者让结果逐步到达，后者让长任务脱离单次连接持续执行。理解两者，可以避免把“文字正在出现”误认为“业务已经完成”。<\/p><h2 id=\"section-1\">流式输出改变的是交付方式<\/h2><p>流式响应将内容分段发送，客户端收到后逐步显示。这样可以缩短用户看到首段结果的等待，但不一定缩短总完成时间。文本流中的早期内容可能还不完整，结构化对象也可能尚未闭合，因此不能随意将每个片段作为最终结果执行。<\/p><p>教学构造例子：模型正在生成一份配置，前半段字段看似正确，末尾却因达到限制而缺失。产品需要识别正常结束、错误和截断，并在完整校验后允许使用。对关键操作，还应把生成草稿与实际应用分开。<\/p><h2 id=\"section-2\">SSE 与连接状态<\/h2><p>服务端发送事件是一种常见的单向更新方式，客户端可持续接收事件。事件可以承载文本增量，也可以承载阶段状态。连接断开后是否重连、从哪里恢复以及是否会重复收到事件，均需结合应用协议设计，不能只依赖浏览器自动行为。<\/p><p>网络中断与后台任务停止是两件事。用户锁屏或切换网络后，任务可能继续运行，也可能被取消，取决于服务实现。界面应基于真实任务状态恢复，而不是一直显示本地动画。对于不可重复执行的任务，需要稳定任务标识来避免重连时再次启动。<\/p><h2 id=\"section-3\">异步任务的生命周期<\/h2><p>异步接口通常先受理请求，返回任务编号，再由后台排队并运行。客户端可以轮询状态，或通过事件、回调获得更新。状态应表达排队、运行、等待用户、成功、失败、取消及必要的部分完成。每个状态都应有明确含义和可允许的下一步。<\/p><p>长任务还需要持久化关键进度，使执行进程重启后可以恢复或清楚失败。任务编号不只是界面元素，也是日志、结果、取消和人工处理的共同索引。没有持久状态的长任务，容易在断线后失去结果或重复执行。<\/p><h2 id=\"section-4\">轮询、推送与混合方式<\/h2><p>轮询由客户端定期查询，简单但会增加请求；推送能够更及时地传递变化，但需要处理连接与重放。实际系统可以组合使用：推送用于实时展示，轮询用于断线恢复和最终确认。产品需求应说明可接受的更新延迟，而不是先指定某种技术。<\/p><p>轮询间隔应考虑任务长度与服务压力。过于频繁并不会让后台更快，只会增加负担。超时提示也应区分“仍在运行”和“已确定失败”。如果结果未知，可提供稍后查看与任务历史，而不是诱导用户重复提交。<\/p><h2 id=\"section-5\">取消与停止的真实含义<\/h2><p>停止生成文字、取消后台任务和撤销已发生动作不同。用户点击停止后，系统可能已发送邮件或创建资源，这些副作用未必能自动恢复。界面应说明取消作用于哪个阶段，以及是否需要补偿操作。<\/p><p>教学构造例子：研究 Agent 已下载资料并生成报告，但还未发送。取消可以阻止后续发送，却不等于删除已生成文件。任务设计应记录每一步完成情况，使用户知道已经发生什么，也让后续恢复有依据。<\/p><h2 id=\"section-6\">好的状态表达<\/h2><p>向用户展示实际可观察的阶段，如“正在检索资料”“等待确认发送”，而非虚构精确百分比。没有可靠进度依据时，可以提供阶段、耗时和可采取的动作。完成状态必须基于结果验证，而不只是模型生成了一句“已完成”。<\/p><p>流式与异步都是可靠交付体验的一部分。产品经理需要定义状态、断线、取消、重试和恢复，技术团队再选择具体实现。把这些条件提前写清，往往比上线后修复重复任务和丢失结果更有效。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：Using server-sent events<\/a><\/li><li><a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview\" target=\"_blank\" rel=\"noopener noreferrer\">MDN：Overview of HTTP<\/a><\/li><\/ul><p>核验日期：2026-11-14。配置与研究任务为教学构造；事件恢复和取消语义需由实际服务契约确定。<\/p>","toc":[{"id":"section-1","title":"流式输出改变的是交付方式","level":2},{"id":"section-2","title":"SSE 与连接状态","level":2},{"id":"section-3","title":"异步任务的生命周期","level":2},{"id":"section-4","title":"轮询、推送与混合方式","level":2},{"id":"section-5","title":"取消与停止的真实含义","level":2},{"id":"section-6","title":"好的状态表达","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"AI 生成可能持续数秒，多步 Agent 可能运行更久。流式响应与异步任务解决不同问题：前者让结果逐步到达，后者让长任务脱离单次连接持续执行。理解两者，可以避免把“文字正在出现”误认为“业务已经完成”。\n\n## 流式输出改变的是交付方式\n\n流式响应将内容分段发送，客户端收到后逐步显示。这样可以缩短用户看到首段结果的等待，但不一定缩短总完成时间。文本流中的早期内容可能还不完整，结构化对象也可能尚未闭合，因此不能随意将每个片段作为最终结果执行。\n\n教学构造例子：模型正在生成一份配置，前半段字段看似正确，末尾却因达到限制而缺失。产品需要识别正常结束、错误和截断，并在完整校验后允许使用。对关键操作，还应把生成草稿与实际应用分开。\n\n## SSE 与连接状态\n\n服务端发送事件是一种常见的单向更新方式，客户端可持续接收事件。事件可以承载文本增量，也可以承载阶段状态。连接断开后是否重连、从哪里恢复以及是否会重复收到事件，均需结合应用协议设计，不能只依赖浏览器自动行为。\n\n网络中断与后台任务停止是两件事。用户锁屏或切换网络后，任务可能继续运行，也可能被取消，取决于服务实现。界面应基于真实任务状态恢复，而不是一直显示本地动画。对于不可重复执行的任务，需要稳定任务标识来避免重连时再次启动。\n\n## 异步任务的生命周期\n\n异步接口通常先受理请求，返回任务编号，再由后台排队并运行。客户端可以轮询状态，或通过事件、回调获得更新。状态应表达排队、运行、等待用户、成功、失败、取消及必要的部分完成。每个状态都应有明确含义和可允许的下一步。\n\n长任务还需要持久化关键进度，使执行进程重启后可以恢复或清楚失败。任务编号不只是界面元素，也是日志、结果、取消和人工处理的共同索引。没有持久状态的长任务，容易在断线后失去结果或重复执行。\n\n## 轮询、推送与混合方式\n\n轮询由客户端定期查询，简单但会增加请求；推送能够更及时地传递变化，但需要处理连接与重放。实际系统可以组合使用：推送用于实时展示，轮询用于断线恢复和最终确认。产品需求应说明可接受的更新延迟，而不是先指定某种技术。\n\n轮询间隔应考虑任务长度与服务压力。过于频繁并不会让后台更快，只会增加负担。超时提示也应区分“仍在运行”和“已确定失败”。如果结果未知，可提供稍后查看与任务历史，而不是诱导用户重复提交。\n\n## 取消与停止的真实含义\n\n停止生成文字、取消后台任务和撤销已发生动作不同。用户点击停止后，系统可能已发送邮件或创建资源，这些副作用未必能自动恢复。界面应说明取消作用于哪个阶段，以及是否需要补偿操作。\n\n教学构造例子：研究 Agent 已下载资料并生成报告，但还未发送。取消可以阻止后续发送，却不等于删除已生成文件。任务设计应记录每一步完成情况，使用户知道已经发生什么，也让后续恢复有依据。\n\n## 好的状态表达\n\n向用户展示实际可观察的阶段，如“正在检索资料”“等待确认发送”，而非虚构精确百分比。没有可靠进度依据时，可以提供阶段、耗时和可采取的动作。完成状态必须基于结果验证，而不只是模型生成了一句“已完成”。\n\n流式与异步都是可靠交付体验的一部分。产品经理需要定义状态、断线、取消、重试和恢复，技术团队再选择具体实现。把这些条件提前写清，往往比上线后修复重复任务和丢失结果更有效。\n\n## 资料与延伸阅读\n\n- [MDN：Using server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events)\n- [MDN：Overview of HTTP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview)\n\n核验日期：2026-11-14。配置与研究任务为教学构造；事件恢复和取消语义需由实际服务契约确定。\n","chars":1214,"minutes":5,"summary":"AI 生成可能持续数秒，多步 Agent 可能运行更久。流式响应与异步任务解决不同问题：前者让结果逐步到达，后者让长任务脱离单次连接持续执行。理解两者，可以避免把“文字正在出现”误认为“业务已经完成”。"},{"id":"03-05","title":"数据库与 SQL：如何理解业务数据","file":"content/03-05.md","level":"基础理解","prerequisites":["03-04"],"aliases":["API","HTTP","JSON","SQL","Python","Git"],"module":"03","moduleTitle":"产品经理技术基础","html":"<p>数据库保存可查询、可更新的业务状态，SQL 是关系数据库中常用的操作语言。理解表、键、连接和聚合，可以帮助产品经理判断指标口径、数据可用性，以及 Agent 查询结果是否完整。模型能够写 SQL，也仍需要权限与结果验证。<\/p><h2 id=\"section-1\">表与记录的含义<\/h2><p>一张表通常描述一类实体或事件，每行是一条记录，每列有确定含义。主键用来唯一识别记录，外键表达表之间的关系。客户、工单和处理事件可以分别存储，再通过标识关联。若一张表混合多种粒度，统计时容易重复计算。<\/p><p>教学构造例子：工单表每行一张工单，事件表每行一次处理动作。将两表连接后，一张有三次处理的工单会出现三行。若直接统计行数，就会把工单量算成处理事件量。先确认每行代表什么，是理解 SQL 比记忆语法更重要的起点。<\/p><h2 id=\"section-2\">查询的基本步骤<\/h2><p><code>SELECT<\/code> 选择字段，<code>FROM<\/code> 指定来源，<code>WHERE<\/code> 过滤记录，<code>GROUP BY<\/code> 按维度分组，聚合函数计算数量或平均值，<code>ORDER BY<\/code> 排序，<code>LIMIT<\/code> 限制返回条数。语句执行的实际顺序与书写顺序不完全相同，但产品理解可先围绕这些角色建立。<\/p><p>例如“上月每个部门已关闭工单数”需要确定时间字段、关闭状态和部门归属。使用创建时间还是关闭时间，会得到不同结论；部门是当前所属还是关闭时所属，也会影响历史解释。SQL 能精确执行条件，却不能替你决定业务口径。<\/p><h2 id=\"section-3\">连接与缺失记录<\/h2><p>内连接只保留符合关联条件的记录；外连接可保留一侧没有匹配的记录。错误的连接键或重复键会扩大结果，遗漏关联则可能丢失数据。没有结果不一定意味着业务事件不存在，也可能是权限、时间范围或连接条件错误。<\/p><p>空值需要特别处理。空值与零、空字符串不同，在比较和聚合中的行为也有具体规则。把没有评分的用户当作零分，可能严重拉低平均值。指标说明应明确是否排除缺失、怎样填补以及分母是什么。<\/p><h2 id=\"section-4\">事务与一致性<\/h2><p>事务把一组操作作为整体处理，帮助维护数据一致性。例如创建订单与扣减库存需要协调，避免只完成一半。具体隔离与并发行为由数据库和应用策略决定。AI 工具如果执行多步写入，应考虑中途失败、重复调用和并发更新，而不是只验证最后一句回复。<\/p><p>数据读取也存在时点问题。报表库可能延迟于业务库，多个接口返回的状态也可能不是同一时刻。模型看到的“当前库存”需要注明来源与更新时间。对于关键动作，应在执行时重新检查必要条件。<\/p><h2 id=\"section-5\">自然语言查数的边界<\/h2><p>让模型生成 SQL 可以降低门槛，但模型可能误解表关系、口径和日期。更稳妥的做法是提供受控数据目录、字段说明、允许的查询范围与示例，并使用只读权限、资源限制和结果检查。不要将完整生产写权限交给自由生成的 SQL。<\/p><p>教学构造例子：“最活跃客户”可以按登录、任务完成、付费或协作人数定义。系统应先澄清或展示采用的口径，再执行查询。答案最好附带时间范围、过滤条件和数据更新时间，让用户能判断结论是否适用。<\/p><h2 id=\"section-6\">产品经理如何参与<\/h2><p>理解业务实体、数据粒度与指标口径，可以让你有效评审数据需求和 AI 查数方案。你不必成为数据库管理员，但应能检查查询是否回答了真正问题、结果是否包含重复，以及空值和权限怎样处理。数据结构知识也会在评测集、日志分析与成本统计中反复使用。<\/p><h3 id=\"section-7\">阅读一条聚合查询<\/h3><pre><code>SELECT department_id, COUNT(*) AS closed_count\nFROM tickets\nWHERE status = &#x27;closed&#x27;\nGROUP BY department_id;<\/code><\/pre><p>这条查询统计当前状态为关闭的工单，并不等于上月关闭量，因为没有时间条件。它也假设工单表每行一张工单。读懂代码之后仍需核对口径，才能知道数字究竟回答了什么问题。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.postgresql.org/docs/current/tutorial-sql.html\" target=\"_blank\" rel=\"noopener noreferrer\">PostgreSQL：The SQL Language<\/a><\/li><li><a href=\"https://www.postgresql.org/docs/current/\" target=\"_blank\" rel=\"noopener noreferrer\">PostgreSQL 官方文档<\/a><\/li><\/ul><p>核验日期：2026-11-14。工单与订单为教学构造；不同数据库在语法及事务行为上存在差异。<\/p>","toc":[{"id":"section-1","title":"表与记录的含义","level":2},{"id":"section-2","title":"查询的基本步骤","level":2},{"id":"section-3","title":"连接与缺失记录","level":2},{"id":"section-4","title":"事务与一致性","level":2},{"id":"section-5","title":"自然语言查数的边界","level":2},{"id":"section-6","title":"产品经理如何参与","level":2},{"id":"section-7","title":"阅读一条聚合查询","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"数据库保存可查询、可更新的业务状态，SQL 是关系数据库中常用的操作语言。理解表、键、连接和聚合，可以帮助产品经理判断指标口径、数据可用性，以及 Agent 查询结果是否完整。模型能够写 SQL，也仍需要权限与结果验证。\n\n## 表与记录的含义\n\n一张表通常描述一类实体或事件，每行是一条记录，每列有确定含义。主键用来唯一识别记录，外键表达表之间的关系。客户、工单和处理事件可以分别存储，再通过标识关联。若一张表混合多种粒度，统计时容易重复计算。\n\n教学构造例子：工单表每行一张工单，事件表每行一次处理动作。将两表连接后，一张有三次处理的工单会出现三行。若直接统计行数，就会把工单量算成处理事件量。先确认每行代表什么，是理解 SQL 比记忆语法更重要的起点。\n\n## 查询的基本步骤\n\n`SELECT` 选择字段，`FROM` 指定来源，`WHERE` 过滤记录，`GROUP BY` 按维度分组，聚合函数计算数量或平均值，`ORDER BY` 排序，`LIMIT` 限制返回条数。语句执行的实际顺序与书写顺序不完全相同，但产品理解可先围绕这些角色建立。\n\n例如“上月每个部门已关闭工单数”需要确定时间字段、关闭状态和部门归属。使用创建时间还是关闭时间，会得到不同结论；部门是当前所属还是关闭时所属，也会影响历史解释。SQL 能精确执行条件，却不能替你决定业务口径。\n\n## 连接与缺失记录\n\n内连接只保留符合关联条件的记录；外连接可保留一侧没有匹配的记录。错误的连接键或重复键会扩大结果，遗漏关联则可能丢失数据。没有结果不一定意味着业务事件不存在，也可能是权限、时间范围或连接条件错误。\n\n空值需要特别处理。空值与零、空字符串不同，在比较和聚合中的行为也有具体规则。把没有评分的用户当作零分，可能严重拉低平均值。指标说明应明确是否排除缺失、怎样填补以及分母是什么。\n\n## 事务与一致性\n\n事务把一组操作作为整体处理，帮助维护数据一致性。例如创建订单与扣减库存需要协调，避免只完成一半。具体隔离与并发行为由数据库和应用策略决定。AI 工具如果执行多步写入，应考虑中途失败、重复调用和并发更新，而不是只验证最后一句回复。\n\n数据读取也存在时点问题。报表库可能延迟于业务库，多个接口返回的状态也可能不是同一时刻。模型看到的“当前库存”需要注明来源与更新时间。对于关键动作，应在执行时重新检查必要条件。\n\n## 自然语言查数的边界\n\n让模型生成 SQL 可以降低门槛，但模型可能误解表关系、口径和日期。更稳妥的做法是提供受控数据目录、字段说明、允许的查询范围与示例，并使用只读权限、资源限制和结果检查。不要将完整生产写权限交给自由生成的 SQL。\n\n教学构造例子：“最活跃客户”可以按登录、任务完成、付费或协作人数定义。系统应先澄清或展示采用的口径，再执行查询。答案最好附带时间范围、过滤条件和数据更新时间，让用户能判断结论是否适用。\n\n## 产品经理如何参与\n\n理解业务实体、数据粒度与指标口径，可以让你有效评审数据需求和 AI 查数方案。你不必成为数据库管理员，但应能检查查询是否回答了真正问题、结果是否包含重复，以及空值和权限怎样处理。数据结构知识也会在评测集、日志分析与成本统计中反复使用。\n\n### 阅读一条聚合查询\n\n```sql\nSELECT department_id, COUNT(*) AS closed_count\nFROM tickets\nWHERE status = 'closed'\nGROUP BY department_id;\n```\n\n这条查询统计当前状态为关闭的工单，并不等于上月关闭量，因为没有时间条件。它也假设工单表每行一张工单。读懂代码之后仍需核对口径，才能知道数字究竟回答了什么问题。\n\n## 资料与延伸阅读\n\n- [PostgreSQL：The SQL Language](https://www.postgresql.org/docs/current/tutorial-sql.html)\n- [PostgreSQL 官方文档](https://www.postgresql.org/docs/current/)\n\n核验日期：2026-11-14。工单与订单为教学构造；不同数据库在语法及事务行为上存在差异。\n","chars":1215,"minutes":5,"summary":"数据库保存可查询、可更新的业务状态，SQL 是关系数据库中常用的操作语言。理解表、键、连接和聚合，可以帮助产品经理判断指标口径、数据可用性，以及 Agent 查询结果是否完整。模型能够写 SQL，也仍需要权限与结果验证。"},{"id":"03-06","title":"Python 入门：读懂与修改数据处理代码","file":"content/03-06.md","level":"基础理解","prerequisites":["03-05"],"aliases":["API","HTTP","JSON","SQL","Python","Git"],"module":"03","moduleTitle":"产品经理技术基础","html":"<p>Python 常用于数据处理、API 调用和快速原型。对非技术产品经理，合理起点是读懂数据如何流动、知道代码改变了什么，并能验证结果。AI 可以帮助编写代码，但理解输入、依赖、输出和错误仍是使用者的责任。<\/p><h2 id=\"section-1\">从变量与数据结构开始<\/h2><p>变量为某个值提供名称，值可以是数字、字符串、布尔值或复合结构。列表保存有顺序的一组元素，字典保存键与值的映射。它们与 JSON 数组、对象有相近之处，但 Python 语法与 JSON 并不完全相同，不能随意互换。<\/p><p>教学构造例子：一组任务记录是列表，每条记录是字典，包含状态和耗时。代码遍历列表，筛出完成任务，再计算平均耗时。你应能确认：哪些记录被排除，耗时单位是什么，空值怎样处理。即使代码能运行，这些口径错误也不会自动报错。<\/p><h2 id=\"section-2\">条件、循环与函数<\/h2><p>条件语句决定在何种情况下执行某段逻辑；循环对一组数据重复处理；函数把一段逻辑封装为可复用单元。理解这些结构，就能看懂许多数据清洗和请求处理代码。函数的输入、返回值和副作用，应像接口契约一样清楚。<\/p><p>例如函数名叫“统计成功率”，仍需检查成功怎样定义、分母是否含取消任务、重复任务是否去重。名称可以帮助理解，但不能证明实现正确。阅读代码时可以逐步追踪一个小样本，观察每一步数据变化，而不必一开始就读完整项目。<\/p><h2 id=\"section-3\">文件、接口与环境<\/h2><p>程序读取文件需要正确路径和编码，调用 API 需要地址、参数及授权。依赖包提供额外能力，但版本差异可能改变行为。虚拟环境帮助隔离不同项目的依赖，减少互相影响。能在某台电脑运行，不代表其他环境一定具备相同条件。<\/p><p>密钥应通过适当配置读取，而非直接写入公开代码或截图。文件写入路径也需要检查，避免覆盖重要材料。AI 生成代码中出现下载、删除或外部请求时，应理解其作用与范围后再运行，特别是处理真实业务数据时。<\/p><h2 id=\"section-4\">错误与异常<\/h2><p>语法错误让代码无法按语言规则解析；运行时错误发生在执行过程中，例如文件不存在；逻辑错误则可能完全不报错，却产生错误结果。异常处理可以捕获已知问题并提供恢复，但把所有异常忽略会掩盖失败，让后续结果看似正常。<\/p><p>教学构造例子：API 调用失败后返回空列表，统计程序继续计算得到“没有异常工单”。这是把“数据未取得”误当成“取得数据且没有异常”。应区分成功空结果、调用失败和部分数据，必要时停止后续分析。<\/p><h2 id=\"section-5\">使用 AI 辅助开发的方式<\/h2><p>先说明任务、输入格式、预期输出和约束，再让 AI 给出最小可理解实现。要求解释关键步骤、依赖和可能副作用，并用小型样本检查。发现问题时提供具体错误、输入和期望，而不是只说“不好用”。逐步修改通常比一次生成庞大系统更容易验证。<\/p><p>代码生成后，应核对数据口径、边界、权限与保存位置。对于金额、日期和业务状态，尤其需要明确单位、时区和缺失规则。AI 能加快实现，但不能替代这些产品判断。复制运行成功仅说明某次执行未失败，并不证明所有结果可靠。<\/p><h2 id=\"section-6\">到什么程度足够<\/h2><p>能够解释一段脚本的输入、处理、输出，识别关键依赖和错误，并修改少量字段或筛选条件，已经能显著改善技术沟通。进一步可以学习接口调用、数据分析和简单原型。是否走向完整工程开发，取决于职业方向，无需作为理解 AI 产品的先决条件。<\/p><h3 id=\"section-7\">一个可读的数据处理例子<\/h3><pre><code>records = [{&quot;status&quot;: &quot;done&quot;, &quot;seconds&quot;: 12},\n           {&quot;status&quot;: &quot;failed&quot;, &quot;seconds&quot;: 8}]\ncompleted = [r for r in records if r[&quot;status&quot;] == &quot;done&quot;]\ntotal = sum(r[&quot;seconds&quot;] for r in completed)\naverage = total / len(completed) if completed else None\nprint(average)<\/code><\/pre><p>示例输出为十二，单位是秒。它只统计完成任务，不包含失败消耗；因此不能拿它表示所有请求的平均耗时。条件分支让没有完成任务时返回空值，而不是错误地报告零秒。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://docs.python.org/3/tutorial/\" target=\"_blank\" rel=\"noopener noreferrer\">Python 官方教程<\/a><\/li><li><a href=\"https://docs.python.org/3/\" target=\"_blank\" rel=\"noopener noreferrer\">Python 官方文档<\/a><\/li><\/ul><p>核验日期：2026-11-14。官方教程假设读者已有一定编程经验，本文先提供概念桥梁；任务统计为教学构造。<\/p>","toc":[{"id":"section-1","title":"从变量与数据结构开始","level":2},{"id":"section-2","title":"条件、循环与函数","level":2},{"id":"section-3","title":"文件、接口与环境","level":2},{"id":"section-4","title":"错误与异常","level":2},{"id":"section-5","title":"使用 AI 辅助开发的方式","level":2},{"id":"section-6","title":"到什么程度足够","level":2},{"id":"section-7","title":"一个可读的数据处理例子","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"Python 常用于数据处理、API 调用和快速原型。对非技术产品经理，合理起点是读懂数据如何流动、知道代码改变了什么，并能验证结果。AI 可以帮助编写代码，但理解输入、依赖、输出和错误仍是使用者的责任。\n\n## 从变量与数据结构开始\n\n变量为某个值提供名称，值可以是数字、字符串、布尔值或复合结构。列表保存有顺序的一组元素，字典保存键与值的映射。它们与 JSON 数组、对象有相近之处，但 Python 语法与 JSON 并不完全相同，不能随意互换。\n\n教学构造例子：一组任务记录是列表，每条记录是字典，包含状态和耗时。代码遍历列表，筛出完成任务，再计算平均耗时。你应能确认：哪些记录被排除，耗时单位是什么，空值怎样处理。即使代码能运行，这些口径错误也不会自动报错。\n\n## 条件、循环与函数\n\n条件语句决定在何种情况下执行某段逻辑；循环对一组数据重复处理；函数把一段逻辑封装为可复用单元。理解这些结构，就能看懂许多数据清洗和请求处理代码。函数的输入、返回值和副作用，应像接口契约一样清楚。\n\n例如函数名叫“统计成功率”，仍需检查成功怎样定义、分母是否含取消任务、重复任务是否去重。名称可以帮助理解，但不能证明实现正确。阅读代码时可以逐步追踪一个小样本，观察每一步数据变化，而不必一开始就读完整项目。\n\n## 文件、接口与环境\n\n程序读取文件需要正确路径和编码，调用 API 需要地址、参数及授权。依赖包提供额外能力，但版本差异可能改变行为。虚拟环境帮助隔离不同项目的依赖，减少互相影响。能在某台电脑运行，不代表其他环境一定具备相同条件。\n\n密钥应通过适当配置读取，而非直接写入公开代码或截图。文件写入路径也需要检查，避免覆盖重要材料。AI 生成代码中出现下载、删除或外部请求时，应理解其作用与范围后再运行，特别是处理真实业务数据时。\n\n## 错误与异常\n\n语法错误让代码无法按语言规则解析；运行时错误发生在执行过程中，例如文件不存在；逻辑错误则可能完全不报错，却产生错误结果。异常处理可以捕获已知问题并提供恢复，但把所有异常忽略会掩盖失败，让后续结果看似正常。\n\n教学构造例子：API 调用失败后返回空列表，统计程序继续计算得到“没有异常工单”。这是把“数据未取得”误当成“取得数据且没有异常”。应区分成功空结果、调用失败和部分数据，必要时停止后续分析。\n\n## 使用 AI 辅助开发的方式\n\n先说明任务、输入格式、预期输出和约束，再让 AI 给出最小可理解实现。要求解释关键步骤、依赖和可能副作用，并用小型样本检查。发现问题时提供具体错误、输入和期望，而不是只说“不好用”。逐步修改通常比一次生成庞大系统更容易验证。\n\n代码生成后，应核对数据口径、边界、权限与保存位置。对于金额、日期和业务状态，尤其需要明确单位、时区和缺失规则。AI 能加快实现，但不能替代这些产品判断。复制运行成功仅说明某次执行未失败，并不证明所有结果可靠。\n\n## 到什么程度足够\n\n能够解释一段脚本的输入、处理、输出，识别关键依赖和错误，并修改少量字段或筛选条件，已经能显著改善技术沟通。进一步可以学习接口调用、数据分析和简单原型。是否走向完整工程开发，取决于职业方向，无需作为理解 AI 产品的先决条件。\n\n### 一个可读的数据处理例子\n\n```python\nrecords = [{\"status\": \"done\", \"seconds\": 12},\n           {\"status\": \"failed\", \"seconds\": 8}]\ncompleted = [r for r in records if r[\"status\"] == \"done\"]\ntotal = sum(r[\"seconds\"] for r in completed)\naverage = total / len(completed) if completed else None\nprint(average)\n```\n\n示例输出为十二，单位是秒。它只统计完成任务，不包含失败消耗；因此不能拿它表示所有请求的平均耗时。条件分支让没有完成任务时返回空值，而不是错误地报告零秒。\n\n## 资料与延伸阅读\n\n- [Python 官方教程](https://docs.python.org/3/tutorial/)\n- [Python 官方文档](https://docs.python.org/3/)\n\n核验日期：2026-11-14。官方教程假设读者已有一定编程经验，本文先提供概念桥梁；任务统计为教学构造。\n","chars":1235,"minutes":5,"summary":"Python 常用于数据处理、API 调用和快速原型。对非技术产品经理，合理起点是读懂数据如何流动、知道代码改变了什么，并能验证结果。AI 可以帮助编写代码，但理解输入、依赖、输出和错误仍是使用者的责任。"},{"id":"03-07","title":"日志、错误与调试：把问题变成证据","file":"content/03-07.md","level":"基础理解","prerequisites":["03-06"],"aliases":["API","HTTP","JSON","SQL","Python","Git"],"module":"03","moduleTitle":"产品经理技术基础","html":"<p>“回答不对”“一直转圈”“工具没生效”是用户体验描述，研发排查需要更具体的证据。日志记录事件，指标汇总趋势，Trace 关联一次任务跨环节的执行过程。产品经理理解这些对象，可以提高问题报告和优先级判断的质量。<\/p><h2 id=\"section-1\">日志记录发生了什么<\/h2><p>日志可以包含时间、级别、模块、任务标识和事件信息。结构化日志把字段分开保存，更方便过滤和统计。关键不是记录越多越好，而是能回答问题：输入是否到达，调用是否发生，返回什么状态，哪一步失败，以及失败后是否继续执行。<\/p><p>教学构造例子：用户说“工单未创建”。需要先找到任务标识，检查模型是否提出创建、参数是否通过验证、接口是否成功、返回编号是否保存。若只记录最终对话，可能无法分辨模型误报与接口失败。执行证据比自然语言总结更可靠。<\/p><h2 id=\"section-2\">Trace 连接多个环节<\/h2><p>一次 Agent 任务可能调用模型、检索、多个工具和数据库。Trace 使用关联标识将这些步骤连接，展示父子关系、耗时和结果。这样可以区分总等待来自模型、搜索还是外部系统。单个日志片段缺少上下文，容易误判因果。<\/p><p>Trace 也应记录版本信息，例如模型、提示、工具与索引版本。相同问题在升级后出现变化，才能比较真实差异。数据量较大时可能采用采样，报告应说明哪些任务有完整记录，避免把未记录误认为未发生。<\/p><h2 id=\"section-3\">指标与具体样本互相补充<\/h2><p>成功率、错误率和延迟等指标帮助发现趋势，但无法单独解释原因。具体样本揭示机制，却不一定代表整体。可以先从指标发现某类异常，再查看对应 Trace 和输入输出，形成从现象到根因的链路。<\/p><p>例如总体成功率下降，可能是某个工具故障，也可能是新增复杂任务占比提高。需要按任务类型、版本和时间分组，而不是立即认定模型变差。错误分类应尽量与可采取的改进对应，例如资料缺失、参数错误、权限不足和完成判定错误。<\/p><h2 id=\"section-4\">错误报告怎样写<\/h2><p>记录发生时间、任务标识、用户目标、实际行为、期望行为、影响范围与可复现条件。附上必要截图和脱敏输入，不需要把完整个人资料或密钥放进问题单。若动作已经部分发生，应说明哪些结果已确认，哪些状态未知。<\/p><p>教学构造例子：“发送超时后用户重试，收件人收到两封邮件”比“邮件功能不稳定”更有用。它揭示结果未知和重复执行的关系，能够引导团队检查幂等与查询机制。问题报告越接近可观察事实，越容易共同判断。<\/p><h2 id=\"section-5\">不要让日志造成新的风险<\/h2><p>模型输入输出可能包含敏感信息，日志系统的访问和保留需要控制。常见做法包括最小化记录、脱敏、权限隔离和保留期限。完全删除内容会降低排查能力，全部记录又扩大暴露面，应按任务和风险权衡。<\/p><p>日志本身也不是绝对真相：时间可能不同步，记录可能延迟或丢失，错误路径可能没有覆盖。需要结合接口状态、数据库和用户实际结果交叉验证。审计关键动作时，更应使用可靠的业务记录，而非仅依赖临时调试文本。<\/p><h2 id=\"section-6\">从排查到持续改进<\/h2><p>修复后应回到原失败样本确认行为，再检查相邻场景是否受影响。将问题转成回归材料，有助于避免下次重复发生。对高频问题，可以调整产品流程、工具描述或数据质量；对罕见严重问题，也可能需要独立保护措施。<\/p><p>掌握日志和 Trace 的目的，是与研发共享一套证据语言。你仍然从用户任务出发，但能把体验问题连接到系统环节，并将技术修复重新验证为用户结果。<\/p><h3 id=\"section-7\">事实与推断分开记录<\/h3><p>“接口返回超时”是观测，“服务端没有创建资源”则可能只是推断。问题单应保留这种区别，并通过查询结果进一步核验。否则团队可能在错误前提上重试，引发重复写入。证据不足时明确状态未知，有助于选择更合适的恢复方式。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://opentelemetry.io/docs/concepts/signals/logs/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenTelemetry：Logs<\/a><\/li><li><a href=\"https://opentelemetry.io/docs/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenTelemetry 官方文档<\/a><\/li><\/ul><p>核验日期：2026-11-14。工单与邮件事件为教学构造；具体遥测字段和采样策略应结合系统设计。<\/p>","toc":[{"id":"section-1","title":"日志记录发生了什么","level":2},{"id":"section-2","title":"Trace 连接多个环节","level":2},{"id":"section-3","title":"指标与具体样本互相补充","level":2},{"id":"section-4","title":"错误报告怎样写","level":2},{"id":"section-5","title":"不要让日志造成新的风险","level":2},{"id":"section-6","title":"从排查到持续改进","level":2},{"id":"section-7","title":"事实与推断分开记录","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"“回答不对”“一直转圈”“工具没生效”是用户体验描述，研发排查需要更具体的证据。日志记录事件，指标汇总趋势，Trace 关联一次任务跨环节的执行过程。产品经理理解这些对象，可以提高问题报告和优先级判断的质量。\n\n## 日志记录发生了什么\n\n日志可以包含时间、级别、模块、任务标识和事件信息。结构化日志把字段分开保存，更方便过滤和统计。关键不是记录越多越好，而是能回答问题：输入是否到达，调用是否发生，返回什么状态，哪一步失败，以及失败后是否继续执行。\n\n教学构造例子：用户说“工单未创建”。需要先找到任务标识，检查模型是否提出创建、参数是否通过验证、接口是否成功、返回编号是否保存。若只记录最终对话，可能无法分辨模型误报与接口失败。执行证据比自然语言总结更可靠。\n\n## Trace 连接多个环节\n\n一次 Agent 任务可能调用模型、检索、多个工具和数据库。Trace 使用关联标识将这些步骤连接，展示父子关系、耗时和结果。这样可以区分总等待来自模型、搜索还是外部系统。单个日志片段缺少上下文，容易误判因果。\n\nTrace 也应记录版本信息，例如模型、提示、工具与索引版本。相同问题在升级后出现变化，才能比较真实差异。数据量较大时可能采用采样，报告应说明哪些任务有完整记录，避免把未记录误认为未发生。\n\n## 指标与具体样本互相补充\n\n成功率、错误率和延迟等指标帮助发现趋势，但无法单独解释原因。具体样本揭示机制，却不一定代表整体。可以先从指标发现某类异常，再查看对应 Trace 和输入输出，形成从现象到根因的链路。\n\n例如总体成功率下降，可能是某个工具故障，也可能是新增复杂任务占比提高。需要按任务类型、版本和时间分组，而不是立即认定模型变差。错误分类应尽量与可采取的改进对应，例如资料缺失、参数错误、权限不足和完成判定错误。\n\n## 错误报告怎样写\n\n记录发生时间、任务标识、用户目标、实际行为、期望行为、影响范围与可复现条件。附上必要截图和脱敏输入，不需要把完整个人资料或密钥放进问题单。若动作已经部分发生，应说明哪些结果已确认，哪些状态未知。\n\n教学构造例子：“发送超时后用户重试，收件人收到两封邮件”比“邮件功能不稳定”更有用。它揭示结果未知和重复执行的关系，能够引导团队检查幂等与查询机制。问题报告越接近可观察事实，越容易共同判断。\n\n## 不要让日志造成新的风险\n\n模型输入输出可能包含敏感信息，日志系统的访问和保留需要控制。常见做法包括最小化记录、脱敏、权限隔离和保留期限。完全删除内容会降低排查能力，全部记录又扩大暴露面，应按任务和风险权衡。\n\n日志本身也不是绝对真相：时间可能不同步，记录可能延迟或丢失，错误路径可能没有覆盖。需要结合接口状态、数据库和用户实际结果交叉验证。审计关键动作时，更应使用可靠的业务记录，而非仅依赖临时调试文本。\n\n## 从排查到持续改进\n\n修复后应回到原失败样本确认行为，再检查相邻场景是否受影响。将问题转成回归材料，有助于避免下次重复发生。对高频问题，可以调整产品流程、工具描述或数据质量；对罕见严重问题，也可能需要独立保护措施。\n\n掌握日志和 Trace 的目的，是与研发共享一套证据语言。你仍然从用户任务出发，但能把体验问题连接到系统环节，并将技术修复重新验证为用户结果。\n\n### 事实与推断分开记录\n\n“接口返回超时”是观测，“服务端没有创建资源”则可能只是推断。问题单应保留这种区别，并通过查询结果进一步核验。否则团队可能在错误前提上重试，引发重复写入。证据不足时明确状态未知，有助于选择更合适的恢复方式。\n\n## 资料与延伸阅读\n\n- [OpenTelemetry：Logs](https://opentelemetry.io/docs/concepts/signals/logs/)\n- [OpenTelemetry 官方文档](https://opentelemetry.io/docs/)\n\n核验日期：2026-11-14。工单与邮件事件为教学构造；具体遥测字段和采样策略应结合系统设计。\n","chars":1283,"minutes":5,"summary":"“回答不对”“一直转圈”“工具没生效”是用户体验描述，研发排查需要更具体的证据。日志记录事件，指标汇总趋势，Trace 关联一次任务跨环节的执行过程。产品经理理解这些对象，可以提高问题报告和优先级判断的质量。"},{"id":"03-08","title":"Git、环境与 AI 辅助开发的工作方式","file":"content/03-08.md","level":"基础理解","prerequisites":["03-07"],"aliases":["API","HTTP","JSON","SQL","Python","Git"],"module":"03","moduleTitle":"产品经理技术基础","html":"<p>Git 用于记录文件版本与协作修改，运行环境决定代码依赖和配置。对于借助 AI 构建原型的产品经理，这两类知识能帮助你保留可恢复的工作状态、理解改动范围，并避免“昨天能用，今天不知道哪里变了”。<\/p><h2 id=\"section-1\">版本控制记录什么<\/h2><p>Git 记录文件内容的变化及其历史。提交是一个可命名、可追溯的版本节点；分支允许并行开展不同工作；差异展示两个版本之间具体改了什么。它适合代码、配置和文本，但并不意味着所有敏感内容都应该进入仓库。<\/p><p>教学构造例子：修改 Agent 提示后效果变差，如果提示、工具描述和评估材料都有版本，可以回到旧版本比较。若只在聊天中保留“优化过的版本”，团队很难还原实际部署内容。一次改动的说明应表达问题、行为变化和验证结果，而非只写“优化”。<\/p><h2 id=\"section-2\">工作区、暂存与提交<\/h2><p>工作区是当前文件，暂存区用于选择下一次提交的内容，提交则形成历史记录。文件保存不等于已经提交，提交也不等于已经发布。远程推送让其他协作者获得版本，部署还可能有单独流程。区分这些状态，可以避免误以为本地修复已经对用户生效。<\/p><p>分支与合并允许多人协作，但同一位置的不同修改可能冲突。解决冲突需要理解双方意图，不能机械保留最新一边。对于产品文档和提示，也要检查规则是否一致、是否遗漏旧约束。版本工具能显示差异，不能替团队做业务判断。<\/p><h2 id=\"section-3\">环境包含哪些条件<\/h2><p>解释器、依赖包、系统工具、环境变量和外部服务配置共同构成运行环境。依赖版本不同，接口和默认行为可能变化。使用独立环境及依赖清单，可以减少“在我电脑上正常”的差异。密钥、账号与私有数据则应采用适当配置方式管理。<\/p><p>教学构造例子：本地脚本使用某版本库，服务器升级后参数不再支持。错误不一定来自模型或提示，而是环境变化。问题记录需要包含版本和配置条件，但不应暴露密钥。能复现输入与环境，是可靠排查的基础。<\/p><h2 id=\"section-4\">AI 辅助开发的协作循环<\/h2><p>先明确目标、输入输出和约束，让 AI 解释相关文件与建议改动，再检查差异并运行合适验证。每次尽量保持改动可理解、可回退。对于真实系统，新增依赖、数据迁移和外部写操作应单独看清影响，而不是因为代码由 AI 生成就降低审查。<\/p><p>AI 可能生成不存在的接口、过期用法或看似合理的错误逻辑。官方文档、实际运行和结果检查可以提供证据。对低风险文字调整不需要复杂测试；对权限、金额、数据写入和任务执行，则需要与影响相匹配的验证。<\/p><h2 id=\"section-5\">从原型到可交付结果<\/h2><p>原型能展示核心流程，但上线还需要身份、权限、状态、异常、成本和运维。不要把一段演示成功代码直接视为完整产品。可以记录哪些部分真实连接，哪些是模拟，数据从何而来，以及尚未验证的条件。明确状态反而更有利于团队评估下一步。<\/p><p>发布时，应知道当前代码版本、配置、模型与提示版本。出现问题才能回滚或比较。仅恢复代码但继续使用新提示、索引或模型，可能无法恢复原行为，因此 AI 产品的版本对象比普通页面更丰富。<\/p><h2 id=\"section-6\">产品经理的合理边界<\/h2><p>你可以通过 Git 差异理解 AI 改了什么，通过环境说明判断怎样运行，通过结果验证判断是否满足需求。无需立即掌握复杂分支策略，但应保留重要版本、避免提交秘密，并在操作前理解副作用。这些习惯能让 AI 辅助开发成为可靠工具，而不是难以维护的代码堆积。<\/p><h3 id=\"section-7\">评审差异而非整份重读<\/h3><p>当 AI 修改文件，可以先查看新增、删除与改动位置，再沿依赖检查影响。小步修改有助于理解，但文件少不代表风险小；一个权限条件也可能影响全部用户。验证力度应依据行为影响，而不是代码行数决定。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control\" target=\"_blank\" rel=\"noopener noreferrer\">Pro Git：About Version Control<\/a><\/li><li><a href=\"https://docs.python.org/3/tutorial/\" target=\"_blank\" rel=\"noopener noreferrer\">Python 官方教程<\/a><\/li><\/ul><p>核验日期：2026-11-14。提示与依赖变更为教学构造示例；具体协作规范应遵循项目约定。<\/p>","toc":[{"id":"section-1","title":"版本控制记录什么","level":2},{"id":"section-2","title":"工作区、暂存与提交","level":2},{"id":"section-3","title":"环境包含哪些条件","level":2},{"id":"section-4","title":"AI 辅助开发的协作循环","level":2},{"id":"section-5","title":"从原型到可交付结果","level":2},{"id":"section-6","title":"产品经理的合理边界","level":2},{"id":"section-7","title":"评审差异而非整份重读","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"Git 用于记录文件版本与协作修改，运行环境决定代码依赖和配置。对于借助 AI 构建原型的产品经理，这两类知识能帮助你保留可恢复的工作状态、理解改动范围，并避免“昨天能用，今天不知道哪里变了”。\n\n## 版本控制记录什么\n\nGit 记录文件内容的变化及其历史。提交是一个可命名、可追溯的版本节点；分支允许并行开展不同工作；差异展示两个版本之间具体改了什么。它适合代码、配置和文本，但并不意味着所有敏感内容都应该进入仓库。\n\n教学构造例子：修改 Agent 提示后效果变差，如果提示、工具描述和评估材料都有版本，可以回到旧版本比较。若只在聊天中保留“优化过的版本”，团队很难还原实际部署内容。一次改动的说明应表达问题、行为变化和验证结果，而非只写“优化”。\n\n## 工作区、暂存与提交\n\n工作区是当前文件，暂存区用于选择下一次提交的内容，提交则形成历史记录。文件保存不等于已经提交，提交也不等于已经发布。远程推送让其他协作者获得版本，部署还可能有单独流程。区分这些状态，可以避免误以为本地修复已经对用户生效。\n\n分支与合并允许多人协作，但同一位置的不同修改可能冲突。解决冲突需要理解双方意图，不能机械保留最新一边。对于产品文档和提示，也要检查规则是否一致、是否遗漏旧约束。版本工具能显示差异，不能替团队做业务判断。\n\n## 环境包含哪些条件\n\n解释器、依赖包、系统工具、环境变量和外部服务配置共同构成运行环境。依赖版本不同，接口和默认行为可能变化。使用独立环境及依赖清单，可以减少“在我电脑上正常”的差异。密钥、账号与私有数据则应采用适当配置方式管理。\n\n教学构造例子：本地脚本使用某版本库，服务器升级后参数不再支持。错误不一定来自模型或提示，而是环境变化。问题记录需要包含版本和配置条件，但不应暴露密钥。能复现输入与环境，是可靠排查的基础。\n\n## AI 辅助开发的协作循环\n\n先明确目标、输入输出和约束，让 AI 解释相关文件与建议改动，再检查差异并运行合适验证。每次尽量保持改动可理解、可回退。对于真实系统，新增依赖、数据迁移和外部写操作应单独看清影响，而不是因为代码由 AI 生成就降低审查。\n\nAI 可能生成不存在的接口、过期用法或看似合理的错误逻辑。官方文档、实际运行和结果检查可以提供证据。对低风险文字调整不需要复杂测试；对权限、金额、数据写入和任务执行，则需要与影响相匹配的验证。\n\n## 从原型到可交付结果\n\n原型能展示核心流程，但上线还需要身份、权限、状态、异常、成本和运维。不要把一段演示成功代码直接视为完整产品。可以记录哪些部分真实连接，哪些是模拟，数据从何而来，以及尚未验证的条件。明确状态反而更有利于团队评估下一步。\n\n发布时，应知道当前代码版本、配置、模型与提示版本。出现问题才能回滚或比较。仅恢复代码但继续使用新提示、索引或模型，可能无法恢复原行为，因此 AI 产品的版本对象比普通页面更丰富。\n\n## 产品经理的合理边界\n\n你可以通过 Git 差异理解 AI 改了什么，通过环境说明判断怎样运行，通过结果验证判断是否满足需求。无需立即掌握复杂分支策略，但应保留重要版本、避免提交秘密，并在操作前理解副作用。这些习惯能让 AI 辅助开发成为可靠工具，而不是难以维护的代码堆积。\n\n### 评审差异而非整份重读\n\n当 AI 修改文件，可以先查看新增、删除与改动位置，再沿依赖检查影响。小步修改有助于理解，但文件少不代表风险小；一个权限条件也可能影响全部用户。验证力度应依据行为影响，而不是代码行数决定。\n\n## 资料与延伸阅读\n\n- [Pro Git：About Version Control](https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control)\n- [Python 官方教程](https://docs.python.org/3/tutorial/)\n\n核验日期：2026-11-14。提示与依赖变更为教学构造示例；具体协作规范应遵循项目约定。\n","chars":1264,"minutes":5,"summary":"Git 用于记录文件版本与协作修改，运行环境决定代码依赖和配置。对于借助 AI 构建原型的产品经理，这两类知识能帮助你保留可恢复的工作状态、理解改动范围，并避免“昨天能用，今天不知道哪里变了”。"},{"id":"04-01","title":"模型能力地图与选型维度","file":"content/04-01.md","level":"工作应用","prerequisites":["02-08","03-02"],"aliases":["LoRA","SFT","量化","模型选型"],"module":"04","moduleTitle":"模型选择、定制与部署","html":"<p>模型选型不是寻找一个在所有方面最强的名字，而是为明确任务选择合适能力与成本组合。通用对话、结构化抽取、代码、多模态和工具执行的要求不同。产品经理首先需要建立任务能力地图，再让候选模型在相同条件下接受比较。<\/p><h2 id=\"section-1\">从用户任务拆出能力要求<\/h2><p>“做一个办公助手”过于宽泛。可以拆成阅读文档、理解指令、检索资料、提取字段、生成草稿、调用工具和核验结果。每个环节对模型的要求不同，也可能由不同组件承担。模型不必独自完成全部工作，确定性计算、搜索和业务规则可以发挥各自优势。<\/p><p>教学构造例子：合同助手需要准确定位条款、保持主体与金额一致、解释适用条件。写作流畅只是其中一项。若核心瓶颈是扫描件识别，换一个纯文本推理更强的模型未必解决问题；若资料已准确解析，复杂条件比较能力才可能成为主要差异。<\/p><h2 id=\"section-2\">能力之外的约束<\/h2><p>上下文、输入模态、结构化输出、工具调用、语言覆盖和拒答行为都影响可用性。服务侧还包括延迟、并发、限流、可用地区、数据处理和版本策略。模型能在演示中完成，不意味着其服务能满足高峰期业务。许可和部署条件也需要在实际使用前核验。<\/p><p>不同约束应分成硬门槛与可权衡项。必须支持某类文件、必须满足特定数据边界，可能直接排除候选；轻微延迟差异则可以与质量和成本共同权衡。先明确门槛，可以减少无意义的榜单比较。<\/p><h2 id=\"section-3\">通用榜单的作用与局限<\/h2><p>榜单有助于发现候选和观察某些能力，但结果依赖任务、提示、评分和计算设置。模型可能对公开题型适配良好，却在企业长尾问题上失效。排名接近也不意味着目标任务表现接近。模型卡与技术报告应一起阅读，重点看适用范围与限制。<\/p><p>比较时还应确认是否允许搜索、代码和额外推理预算。同一个模型在不同工具条件下可能相差很大。若产品实际不能提供相同工具，就不能直接套用相关成绩。对供应商自报数据，应保留来源与条件，结合独立任务验证。<\/p><h2 id=\"section-4\">建立多维能力档案<\/h2><p>可以为候选记录：典型成功任务、主要失败类型、输入限制、质量分布、时延分位数、任务成本及运营条件。不要只给一个总分。关键场景表现与平均表现应分开，严重错误也应单独展示。这样团队才能看见选择代价。<\/p><p>教学构造例子：模型甲在普通摘要上便宜且快速，模型乙在复杂条款分析上更稳。若复杂任务可被可靠识别，可以考虑路由；若识别本身不稳定，路由又引入新的错误。选型应覆盖整个方案，而不只是模型单次调用。<\/p><h2 id=\"section-5\">个体任务与组合系统<\/h2><p>某些模型在严格格式任务较好，另一些在开放分析上更有优势。组合可以提高适配性，却增加维护、调用和排查成本。更复杂方案只有在收益足够且可验证时才值得采用。单模型基线往往能帮助判断额外组件的实际价值。<\/p><p>模型更新后，旧档案需要复核。新版本可能改善某项能力，却改变输出风格、工具参数或拒答行为。产品应能固定和追踪版本，并准备回退。把选型作为持续运营机制，比一次采购决策更符合 AI 产品现实。<\/p><h2 id=\"section-6\">产品经理应输出什么<\/h2><p>清楚的任务定义、约束、样本范围、候选比较及推荐理由，比“建议用最先进模型”更有说服力。结论可以是某个模型、模型组合，或暂时不采用 AI。只要证据与用户价值一致，都是有效的产品判断。<\/p><h3 id=\"section-7\">能力要求需要优先级<\/h3><p>可以先区分必须满足、希望改善和暂不需要的能力。若核心任务是精确抽取，写作风格应放在较低优先级；若核心任务是创意协作，多样性又可能更重要。权重应来自用户任务与失败代价，并保留为什么这样排序的依据，避免团队按各自偏好投票选模型。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/1810.03993\" target=\"_blank\" rel=\"noopener noreferrer\">Model Cards for Model Reporting<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><\/ul><p>核验日期：2026-11-14。合同与模型比较为教学构造，不含实时厂商排名或价格结论。<\/p>","toc":[{"id":"section-1","title":"从用户任务拆出能力要求","level":2},{"id":"section-2","title":"能力之外的约束","level":2},{"id":"section-3","title":"通用榜单的作用与局限","level":2},{"id":"section-4","title":"建立多维能力档案","level":2},{"id":"section-5","title":"个体任务与组合系统","level":2},{"id":"section-6","title":"产品经理应输出什么","level":2},{"id":"section-7","title":"能力要求需要优先级","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"模型选型不是寻找一个在所有方面最强的名字，而是为明确任务选择合适能力与成本组合。通用对话、结构化抽取、代码、多模态和工具执行的要求不同。产品经理首先需要建立任务能力地图，再让候选模型在相同条件下接受比较。\n\n## 从用户任务拆出能力要求\n\n“做一个办公助手”过于宽泛。可以拆成阅读文档、理解指令、检索资料、提取字段、生成草稿、调用工具和核验结果。每个环节对模型的要求不同，也可能由不同组件承担。模型不必独自完成全部工作，确定性计算、搜索和业务规则可以发挥各自优势。\n\n教学构造例子：合同助手需要准确定位条款、保持主体与金额一致、解释适用条件。写作流畅只是其中一项。若核心瓶颈是扫描件识别，换一个纯文本推理更强的模型未必解决问题；若资料已准确解析，复杂条件比较能力才可能成为主要差异。\n\n## 能力之外的约束\n\n上下文、输入模态、结构化输出、工具调用、语言覆盖和拒答行为都影响可用性。服务侧还包括延迟、并发、限流、可用地区、数据处理和版本策略。模型能在演示中完成，不意味着其服务能满足高峰期业务。许可和部署条件也需要在实际使用前核验。\n\n不同约束应分成硬门槛与可权衡项。必须支持某类文件、必须满足特定数据边界，可能直接排除候选；轻微延迟差异则可以与质量和成本共同权衡。先明确门槛，可以减少无意义的榜单比较。\n\n## 通用榜单的作用与局限\n\n榜单有助于发现候选和观察某些能力，但结果依赖任务、提示、评分和计算设置。模型可能对公开题型适配良好，却在企业长尾问题上失效。排名接近也不意味着目标任务表现接近。模型卡与技术报告应一起阅读，重点看适用范围与限制。\n\n比较时还应确认是否允许搜索、代码和额外推理预算。同一个模型在不同工具条件下可能相差很大。若产品实际不能提供相同工具，就不能直接套用相关成绩。对供应商自报数据，应保留来源与条件，结合独立任务验证。\n\n## 建立多维能力档案\n\n可以为候选记录：典型成功任务、主要失败类型、输入限制、质量分布、时延分位数、任务成本及运营条件。不要只给一个总分。关键场景表现与平均表现应分开，严重错误也应单独展示。这样团队才能看见选择代价。\n\n教学构造例子：模型甲在普通摘要上便宜且快速，模型乙在复杂条款分析上更稳。若复杂任务可被可靠识别，可以考虑路由；若识别本身不稳定，路由又引入新的错误。选型应覆盖整个方案，而不只是模型单次调用。\n\n## 个体任务与组合系统\n\n某些模型在严格格式任务较好，另一些在开放分析上更有优势。组合可以提高适配性，却增加维护、调用和排查成本。更复杂方案只有在收益足够且可验证时才值得采用。单模型基线往往能帮助判断额外组件的实际价值。\n\n模型更新后，旧档案需要复核。新版本可能改善某项能力，却改变输出风格、工具参数或拒答行为。产品应能固定和追踪版本，并准备回退。把选型作为持续运营机制，比一次采购决策更符合 AI 产品现实。\n\n## 产品经理应输出什么\n\n清楚的任务定义、约束、样本范围、候选比较及推荐理由，比“建议用最先进模型”更有说服力。结论可以是某个模型、模型组合，或暂时不采用 AI。只要证据与用户价值一致，都是有效的产品判断。\n\n### 能力要求需要优先级\n\n可以先区分必须满足、希望改善和暂不需要的能力。若核心任务是精确抽取，写作风格应放在较低优先级；若核心任务是创意协作，多样性又可能更重要。权重应来自用户任务与失败代价，并保留为什么这样排序的依据，避免团队按各自偏好投票选模型。\n\n## 资料与延伸阅读\n\n- [Model Cards for Model Reporting](https://arxiv.org/abs/1810.03993)\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n\n核验日期：2026-11-14。合同与模型比较为教学构造，不含实时厂商排名或价格结论。\n","chars":1268,"minutes":5,"summary":"模型选型不是寻找一个在所有方面最强的名字，而是为明确任务选择合适能力与成本组合。通用对话、结构化抽取、代码、多模态和工具执行的要求不同。产品经理首先需要建立任务能力地图，再让候选模型在相同条件下接受比较。"},{"id":"04-02","title":"开放权重、闭源服务与模型许可","file":"content/04-02.md","level":"工作应用","prerequisites":["04-01"],"aliases":["LoRA","SFT","量化","模型选型"],"module":"04","moduleTitle":"模型选择、定制与部署","html":"<p>开放权重表示可以获得模型参数，不必然意味着训练数据、训练代码、使用权限和衍生模型规则全部开放。闭源服务通常通过接口提供能力，但其数据、服务和价格条件也各不相同。产品选择应基于具体权利与责任，而非只看“开源”两个字。<\/p><h2 id=\"section-1\">四个需要分别核对的对象<\/h2><p>模型权重、推理代码、训练代码与训练数据可以采用不同开放方式和许可。一个仓库公开，不代表其中所有资产可自由商业使用；能下载权重，也不代表可以按任意方式分发或提供服务。模型卡、许可文本和使用政策需要一起阅读。<\/p><p>教学构造例子：团队准备将模型集成到面向客户的设备软件中，涉及复制、分发和商业部署；内部研究仅调用一次接口则是不同场景。适用条件取决于具体模型版本和用途，不能把某个模型家族的印象套到全部版本。<\/p><h2 id=\"section-2\">闭源 API 提供什么<\/h2><p>使用托管服务通常省去部分硬件、推理优化和模型运维，但仍需要管理接口依赖、数据流、限流与成本。服务方可能更新版本或调整政策。需要确认数据是否保留、是否用于其他目的、可用地区和服务承诺，具体以当前条款及合同为准。<\/p><p>闭源并不自动更安全或更不安全。安全取决于真实部署、权限、日志和数据处理。一个管理薄弱的自托管模型也可能暴露资料；受控托管服务可能提供特定企业治理能力。评价应沿着实际数据链路展开。<\/p><h2 id=\"section-3\">自托管的控制与成本<\/h2><p>获得权重后，团队可以在许可范围内控制部署和某些定制，但需要承担硬件、推理引擎、升级、安全、监控与故障处理。模型下载成功不等于具备生产服务能力。显存、吞吐、并发和峰值需求会决定实际资源。<\/p><p>教学构造例子：每月只有少量复杂请求的团队，自建专用硬件可能利用率很低；请求量稳定且数据边界明确的组织，则可能有不同经济性。需要比较总拥有成本，而非只比较每次 API 费用与模型“免费下载”。<\/p><h2 id=\"section-4\">许可如何进入产品流程<\/h2><p>建立模型清单，记录准确名称、版本、来源、许可、使用场景和责任人。发生升级、再分发、微调或对外提供能力时，重新核验相关条件。模型卡说明能力与用途，许可规定权利义务，二者不能互相替代。<\/p><p>法律适用往往还涉及地区、客户合同和数据来源。产品经理可以负责收集事实、识别需核验的问题，再与法务或相关负责人确认。知识库提供核验方法，不应把某个简短标签当作完整法律结论。<\/p><h2 id=\"section-5\">供应链与可追溯性<\/h2><p>模型文件、依赖和容器来自不同来源，需要确认来源可信、版本固定及完整性。下载第三方改造权重时，还要核对基模型许可与额外修改说明。仅有一个文件名不足以证明来源。部署记录应能追溯到实际使用资产。<\/p><p>代码执行能力、插件和模型加载方式也可能带来额外风险。某些模型仓库包含自定义代码，运行前需要理解其行为。产品采购或技术试验应把这些依赖视为软件供应链的一部分，而非单纯数据文件。<\/p><h2 id=\"section-6\">如何形成选择结论<\/h2><p>将质量、数据边界、控制需求、运维能力、许可和总成本放在同一表中。若需要强控制但团队缺少运维资源，可以研究混合方案或托管专有环境；若先验证需求，接口服务可能更适合快速比较。结论应由任务条件决定，并留下未来迁移路径。<\/p><h3 id=\"section-7\">模型资产也需要退役<\/h3><p>停止使用时，需要知道权重、适配器、缓存和部署镜像在哪里，哪些可保留、哪些应移除。曾经允许的使用方式也可能因新用途而需要重新核验。资产清单与责任人能帮助组织持续管理，而不是采购时检查一次后永久忽略。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/1810.03993\" target=\"_blank\" rel=\"noopener noreferrer\">Model Cards for Model Reporting<\/a><\/li><li><a href=\"https://huggingface.co/learn/llm-course/chapter1/1\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：LLM Course<\/a><\/li><\/ul><p>核验日期：2026-11-14。本文提供核验框架，不对某个模型的商业许可作具体判断；使用前须核对准确版本与当前条款。<\/p>","toc":[{"id":"section-1","title":"四个需要分别核对的对象","level":2},{"id":"section-2","title":"闭源 API 提供什么","level":2},{"id":"section-3","title":"自托管的控制与成本","level":2},{"id":"section-4","title":"许可如何进入产品流程","level":2},{"id":"section-5","title":"供应链与可追溯性","level":2},{"id":"section-6","title":"如何形成选择结论","level":2},{"id":"section-7","title":"模型资产也需要退役","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"开放权重表示可以获得模型参数，不必然意味着训练数据、训练代码、使用权限和衍生模型规则全部开放。闭源服务通常通过接口提供能力，但其数据、服务和价格条件也各不相同。产品选择应基于具体权利与责任，而非只看“开源”两个字。\n\n## 四个需要分别核对的对象\n\n模型权重、推理代码、训练代码与训练数据可以采用不同开放方式和许可。一个仓库公开，不代表其中所有资产可自由商业使用；能下载权重，也不代表可以按任意方式分发或提供服务。模型卡、许可文本和使用政策需要一起阅读。\n\n教学构造例子：团队准备将模型集成到面向客户的设备软件中，涉及复制、分发和商业部署；内部研究仅调用一次接口则是不同场景。适用条件取决于具体模型版本和用途，不能把某个模型家族的印象套到全部版本。\n\n## 闭源 API 提供什么\n\n使用托管服务通常省去部分硬件、推理优化和模型运维，但仍需要管理接口依赖、数据流、限流与成本。服务方可能更新版本或调整政策。需要确认数据是否保留、是否用于其他目的、可用地区和服务承诺，具体以当前条款及合同为准。\n\n闭源并不自动更安全或更不安全。安全取决于真实部署、权限、日志和数据处理。一个管理薄弱的自托管模型也可能暴露资料；受控托管服务可能提供特定企业治理能力。评价应沿着实际数据链路展开。\n\n## 自托管的控制与成本\n\n获得权重后，团队可以在许可范围内控制部署和某些定制，但需要承担硬件、推理引擎、升级、安全、监控与故障处理。模型下载成功不等于具备生产服务能力。显存、吞吐、并发和峰值需求会决定实际资源。\n\n教学构造例子：每月只有少量复杂请求的团队，自建专用硬件可能利用率很低；请求量稳定且数据边界明确的组织，则可能有不同经济性。需要比较总拥有成本，而非只比较每次 API 费用与模型“免费下载”。\n\n## 许可如何进入产品流程\n\n建立模型清单，记录准确名称、版本、来源、许可、使用场景和责任人。发生升级、再分发、微调或对外提供能力时，重新核验相关条件。模型卡说明能力与用途，许可规定权利义务，二者不能互相替代。\n\n法律适用往往还涉及地区、客户合同和数据来源。产品经理可以负责收集事实、识别需核验的问题，再与法务或相关负责人确认。知识库提供核验方法，不应把某个简短标签当作完整法律结论。\n\n## 供应链与可追溯性\n\n模型文件、依赖和容器来自不同来源，需要确认来源可信、版本固定及完整性。下载第三方改造权重时，还要核对基模型许可与额外修改说明。仅有一个文件名不足以证明来源。部署记录应能追溯到实际使用资产。\n\n代码执行能力、插件和模型加载方式也可能带来额外风险。某些模型仓库包含自定义代码，运行前需要理解其行为。产品采购或技术试验应把这些依赖视为软件供应链的一部分，而非单纯数据文件。\n\n## 如何形成选择结论\n\n将质量、数据边界、控制需求、运维能力、许可和总成本放在同一表中。若需要强控制但团队缺少运维资源，可以研究混合方案或托管专有环境；若先验证需求，接口服务可能更适合快速比较。结论应由任务条件决定，并留下未来迁移路径。\n\n### 模型资产也需要退役\n\n停止使用时，需要知道权重、适配器、缓存和部署镜像在哪里，哪些可保留、哪些应移除。曾经允许的使用方式也可能因新用途而需要重新核验。资产清单与责任人能帮助组织持续管理，而不是采购时检查一次后永久忽略。\n\n## 资料与延伸阅读\n\n- [Model Cards for Model Reporting](https://arxiv.org/abs/1810.03993)\n- [Hugging Face：LLM Course](https://huggingface.co/learn/llm-course/chapter1/1)\n\n核验日期：2026-11-14。本文提供核验框架，不对某个模型的商业许可作具体判断；使用前须核对准确版本与当前条款。\n","chars":1232,"minutes":5,"summary":"开放权重表示可以获得模型参数，不必然意味着训练数据、训练代码、使用权限和衍生模型规则全部开放。闭源服务通常通过接口提供能力，但其数据、服务和价格条件也各不相同。产品选择应基于具体权利与责任，而非只看“开源”两个字。"},{"id":"04-03","title":"任务选型：建立基线和候选比较","file":"content/04-03.md","level":"工作应用","prerequisites":["04-02"],"aliases":["LoRA","SFT","量化","模型选型"],"module":"04","moduleTitle":"模型选择、定制与部署","html":"<p>任务选型把抽象能力比较转成可重复的证据。目标是知道哪个方案在什么条件下更适合用户，而非挑选一次最漂亮的回答。基线、代表性样本、统一条件和失败分析构成比较的基础。<\/p><h2 id=\"section-1\">基线可以非常简单<\/h2><p>基线是用于判断新增价值的参照，可以是当前人工流程、规则、搜索、旧模型或单次模型调用。没有基线，很难知道复杂 Agent 是否真的改善任务。基线也应记录成本、时间和错误，而不是假设人工总是正确或现有流程毫无价值。<\/p><p>教学构造例子：希望自动整理客户反馈，先比较人工分类、关键词规则和简单模型提示，再研究更复杂的多步分析。若主要问题是标签标准不清，增加模型和编排可能只会扩大不一致。简单基线有助于暴露需求与数据问题。<\/p><h2 id=\"section-2\">样本应模拟真实任务<\/h2><p>样本包含输入、必要上下文、期望结果或评分标准，以及任务类型和风险标记。覆盖常见与长尾、完整与缺失资料、正常与异常路径。演示样本可以帮助讲解，但不应成为唯一选型依据。重复文档和相关用户应避免不合理泄漏。<\/p><p>样本来源与时间需要记录。用户真实任务、公开案例和教学构造可以组合，但应分开标注。构造样本适合测试边界，不一定代表真实频率。报告总体分数时，应说明权重与样本构成，避免把设计比例误当市场分布。<\/p><h2 id=\"section-3\">保持比较条件清楚<\/h2><p>模型版本、提示、工具、检索资料、解码设置和计算预算都会影响表现。可以比较同提示下的模型，也可以比较各自合理优化后的方案，但两种问题不同，需要明确。不能让一个候选使用搜索，另一个禁止工具，再把差异全归因于基础能力。<\/p><p>随机输出任务可能需要重复运行。评分也应有标准，主观评价可以使用清楚量表和多方校准。若用模型裁判，要检查其偏差与人类判断的一致性。自动评分提高规模，不代表不需要人工抽查。<\/p><h2 id=\"section-4\">结果不只是一张总分表<\/h2><p>按任务类型展示成功、错误、拒答和不确定情况，并记录关键失败。延迟看典型与尾部，成本看完整成功任务。严重错误应单独分析，即使总体平均表现良好。对于不同候选的分数差异，还需考虑样本波动与实际业务意义。<\/p><p>教学构造例子：模型甲摘要质量略高，但经常错误填写订单号；模型乙文字稍简略却能稳定保留字段。若系统目标是业务操作，后者可能更适合，或需要将字段提取交给其他环节。权重来自任务价值，而不是对文字的个人偏好。<\/p><h2 id=\"section-5\">从失败中选择下一步<\/h2><p>把错误分为理解、知识、检索、格式、工具、权限、计算和完成判定。模型换代可能改善理解，却无法修复接口失败。通过小范围修改比较，可以检验瓶颈究竟在哪。若每次同时改变模型、提示和检索，就很难解释收益来源。<\/p><p>候选也可能在不同子任务占优。是否采用路由，需要再评估任务识别、额外调用和维护成本。先证明收益，再增加复杂性。更强模型可以作为分析上限的参照，但未必是最终全量方案。<\/p><h2 id=\"section-6\">输出可复核的选型结论<\/h2><p>报告应包含任务、约束、样本、条件、结果、失败、成本与推荐理由，并说明未覆盖范围。决策可以附带复核触发条件，例如模型版本变更、任务分布变化或成本上升。这样选型成为可更新的产品资产，而不是一次性结论。<\/p><h3 id=\"section-7\">比较中保留“不确定”<\/h3><p>当候选差异小、样本不足或评分分歧较大时，可以明确暂未证明谁更好。下一步可以补充关键任务、增加重复运行或检查评分标准。为了给出明确推荐而隐藏不确定性，会让后续团队误解证据强度。选型结论应与实际覆盖范围一样具体。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/1810.03993\" target=\"_blank\" rel=\"noopener noreferrer\">Model Cards for Model Reporting<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/modules/cross_validation.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Cross-validation<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><\/ul><p>核验日期：2026-11-14。反馈与订单比较为教学构造；本文不提供具体厂商优劣排名。<\/p>","toc":[{"id":"section-1","title":"基线可以非常简单","level":2},{"id":"section-2","title":"样本应模拟真实任务","level":2},{"id":"section-3","title":"保持比较条件清楚","level":2},{"id":"section-4","title":"结果不只是一张总分表","level":2},{"id":"section-5","title":"从失败中选择下一步","level":2},{"id":"section-6","title":"输出可复核的选型结论","level":2},{"id":"section-7","title":"比较中保留“不确定”","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"任务选型把抽象能力比较转成可重复的证据。目标是知道哪个方案在什么条件下更适合用户，而非挑选一次最漂亮的回答。基线、代表性样本、统一条件和失败分析构成比较的基础。\n\n## 基线可以非常简单\n\n基线是用于判断新增价值的参照，可以是当前人工流程、规则、搜索、旧模型或单次模型调用。没有基线，很难知道复杂 Agent 是否真的改善任务。基线也应记录成本、时间和错误，而不是假设人工总是正确或现有流程毫无价值。\n\n教学构造例子：希望自动整理客户反馈，先比较人工分类、关键词规则和简单模型提示，再研究更复杂的多步分析。若主要问题是标签标准不清，增加模型和编排可能只会扩大不一致。简单基线有助于暴露需求与数据问题。\n\n## 样本应模拟真实任务\n\n样本包含输入、必要上下文、期望结果或评分标准，以及任务类型和风险标记。覆盖常见与长尾、完整与缺失资料、正常与异常路径。演示样本可以帮助讲解，但不应成为唯一选型依据。重复文档和相关用户应避免不合理泄漏。\n\n样本来源与时间需要记录。用户真实任务、公开案例和教学构造可以组合，但应分开标注。构造样本适合测试边界，不一定代表真实频率。报告总体分数时，应说明权重与样本构成，避免把设计比例误当市场分布。\n\n## 保持比较条件清楚\n\n模型版本、提示、工具、检索资料、解码设置和计算预算都会影响表现。可以比较同提示下的模型，也可以比较各自合理优化后的方案，但两种问题不同，需要明确。不能让一个候选使用搜索，另一个禁止工具，再把差异全归因于基础能力。\n\n随机输出任务可能需要重复运行。评分也应有标准，主观评价可以使用清楚量表和多方校准。若用模型裁判，要检查其偏差与人类判断的一致性。自动评分提高规模，不代表不需要人工抽查。\n\n## 结果不只是一张总分表\n\n按任务类型展示成功、错误、拒答和不确定情况，并记录关键失败。延迟看典型与尾部，成本看完整成功任务。严重错误应单独分析，即使总体平均表现良好。对于不同候选的分数差异，还需考虑样本波动与实际业务意义。\n\n教学构造例子：模型甲摘要质量略高，但经常错误填写订单号；模型乙文字稍简略却能稳定保留字段。若系统目标是业务操作，后者可能更适合，或需要将字段提取交给其他环节。权重来自任务价值，而不是对文字的个人偏好。\n\n## 从失败中选择下一步\n\n把错误分为理解、知识、检索、格式、工具、权限、计算和完成判定。模型换代可能改善理解，却无法修复接口失败。通过小范围修改比较，可以检验瓶颈究竟在哪。若每次同时改变模型、提示和检索，就很难解释收益来源。\n\n候选也可能在不同子任务占优。是否采用路由，需要再评估任务识别、额外调用和维护成本。先证明收益，再增加复杂性。更强模型可以作为分析上限的参照，但未必是最终全量方案。\n\n## 输出可复核的选型结论\n\n报告应包含任务、约束、样本、条件、结果、失败、成本与推荐理由，并说明未覆盖范围。决策可以附带复核触发条件，例如模型版本变更、任务分布变化或成本上升。这样选型成为可更新的产品资产，而不是一次性结论。\n\n### 比较中保留“不确定”\n\n当候选差异小、样本不足或评分分歧较大时，可以明确暂未证明谁更好。下一步可以补充关键任务、增加重复运行或检查评分标准。为了给出明确推荐而隐藏不确定性，会让后续团队误解证据强度。选型结论应与实际覆盖范围一样具体。\n\n## 资料与延伸阅读\n\n- [Model Cards for Model Reporting](https://arxiv.org/abs/1810.03993)\n- [scikit-learn：Cross-validation](https://scikit-learn.org/stable/modules/cross_validation.html)\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n\n核验日期：2026-11-14。反馈与订单比较为教学构造；本文不提供具体厂商优劣排名。\n","chars":1214,"minutes":5,"summary":"任务选型把抽象能力比较转成可重复的证据。目标是知道哪个方案在什么条件下更适合用户，而非挑选一次最漂亮的回答。基线、代表性样本、统一条件和失败分析构成比较的基础。"},{"id":"04-04","title":"Prompt、RAG 与微调如何取舍","file":"content/04-04.md","level":"工作应用","prerequisites":["04-03"],"aliases":["LoRA","SFT","量化","模型选型"],"module":"04","moduleTitle":"模型选择、定制与部署","html":"<p>Prompt、RAG 与微调解决的问题不同。Prompt 改变当前任务的表达和上下文；RAG 在运行时寻找外部资料；微调通过数据更新模型参数。它们可以组合，但应先找到失败原因，再选择投入方向。<\/p><h2 id=\"section-1\">Prompt 适合先解决什么<\/h2><p>当任务目标、输出要求或边界不清楚时，明确指令、示例和结构往往是低成本的第一步。Prompt 可以告诉模型使用哪些资料、怎样表达和何时追问，但不能凭空提供缺失事实，也不能真正授予业务权限。复杂度不断增长时，还要关注指令冲突与维护成本。<\/p><p>教学构造例子：助手摘要遗漏“待确认条件”，可以先明确字段并给出合格示例。如果资料根本没有设备型号，提示不能可靠生成真实型号。应允许缺失并追问，而不是持续加强“必须准确填写”的措辞。<\/p><h2 id=\"section-2\">RAG 提供外部证据<\/h2><p>RAG 通过检索把相关材料加入当前输入，适合知识更新、企业私有资料和需要引用来源的任务。它把资料管理与模型参数分开，便于更新与追溯。但检索、解析、切分、权限和排序都可能失败，生成端也可能误读证据。<\/p><p>若答案依赖实时库存或订单状态，通常还需要结构化接口，而非仅搜索文档。RAG 是证据获取路径之一，不是所有外部信息访问的统称。数据类型与一致性要求决定更适合文档检索、数据库查询还是业务工具。<\/p><h2 id=\"section-3\">微调改变行为分布<\/h2><p>微调可用于适配稳定格式、专业表达、任务模式或某些能力，但需要高质量数据、训练与评估。它不是随时更新事实的数据库，也不能保证精确记住所有样本。知识变化频繁、需要逐条引用或删除时，单靠参数更新往往难以管理。<\/p><p>教学构造例子：大量工单都要求相同领域分类与表达规范，且现有模型在清楚提示后仍不稳定，可以研究微调；最新维修手册每周更新，则更应设计资料更新和检索路径。两种需求可以同时存在，对应不同组件。<\/p><h2 id=\"section-4\">一条合理的诊断路径<\/h2><p>先确认输入与期望是否明确，再检查模型是否具备基础能力、所需资料是否可获得、工具是否返回正确数据、流程是否正确执行。若补齐上下文即可改善，先优化上下文；若持续行为问题有足够数据，再比较定制。不要把“效果不好”直接翻译成“需要训练”。<\/p><p>成本比较还要看维护。长提示可能增加每次调用成本，RAG 增加数据管道与检索运维，微调增加数据准备、训练和版本验证。最便宜的单次调用未必拥有最低总成本。应基于任务量、变化频率和团队能力评估。<\/p><h2 id=\"section-5\">组合方案如何避免过度复杂<\/h2><p>一个常见组合是明确 Prompt 规定行为，RAG 提供证据，模型生成结构化候选，程序校验并执行工具。必要时再通过定制提升稳定性。每个组件都应有清楚责任，避免检索、提示与微调重复承担同一个模糊目标。<\/p><p>如果增加组件，应能够说明其改善哪个失败、通过什么证据确认。否则系统虽然更“完整”，排查却更困难。保留简单基线、版本与分层指标，有助于判断哪些复杂度值得保留。<\/p><h2 id=\"section-6\">产品经理怎样表达取舍<\/h2><p>可以围绕四个问题组织结论：问题是知识缺失还是行为不适配，知识变化多快，是否需要来源与权限，是否有足够高质量数据和维护能力。再结合质量、延迟和成本比较。这样技术方案能够连接到业务条件，而不是成为术语选择。<\/p><p>最终产品还需要异常和人工参与。任何路径都可能在资料不足、模型误判或工具失败时无法完成。明确服务边界与恢复方式，是方案的一部分，也能防止把单一技术当作万能答案。<\/p><h3 id=\"section-7\">知识与流程同时变化时<\/h3><p>新业务规则可能既改变资料，也改变允许动作。此时只更新知识库不够，还需同步工具校验、用户确认和验收。模型能够复述新规则，不代表系统已按新规则执行。方案取舍应覆盖完整业务链路，避免只在生成端修补。<\/p><h2 id=\"section-8\">同一个需求的三种诊断<\/h2><p>用户说“回答不像我们公司的表达”，可能指语气、业务知识或处理规则。语气可以先用明确要求与示例表达；公司知识需要可靠资料；处理规则可能需要确定性流程和工具校验。如果没有澄清含义就微调，团队可能投入大量标注，却仍无法解决用户真正的不满。<\/p><p>同样，“模型不懂产品型号”可能是文本未解析、型号检索不准、缺少适用表，或模型在生成中改写实体。不同原因可以分别通过解析校验、关键词检索、补数据和结构化字段解决。一个问题表面涉及知识，并不意味着必须更新参数。先追踪输入到结果的完整过程，是选择路径的前提。<\/p><h2 id=\"section-9\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Effective context engineering<\/a><\/li><li><a href=\"https://arxiv.org/abs/2106.09685\" target=\"_blank\" rel=\"noopener noreferrer\">LoRA 原论文<\/a><\/li><li><a href=\"https://arxiv.org/abs/2203.02155\" target=\"_blank\" rel=\"noopener noreferrer\">InstructGPT 原论文<\/a><\/li><\/ul><p>核验日期：2026-11-14。工单与手册为教学构造情境；具体改进效果需用目标任务验证。<\/p>","toc":[{"id":"section-1","title":"Prompt 适合先解决什么","level":2},{"id":"section-2","title":"RAG 提供外部证据","level":2},{"id":"section-3","title":"微调改变行为分布","level":2},{"id":"section-4","title":"一条合理的诊断路径","level":2},{"id":"section-5","title":"组合方案如何避免过度复杂","level":2},{"id":"section-6","title":"产品经理怎样表达取舍","level":2},{"id":"section-7","title":"知识与流程同时变化时","level":3},{"id":"section-8","title":"同一个需求的三种诊断","level":2},{"id":"section-9","title":"资料与延伸阅读","level":2}],"text":"Prompt、RAG 与微调解决的问题不同。Prompt 改变当前任务的表达和上下文；RAG 在运行时寻找外部资料；微调通过数据更新模型参数。它们可以组合，但应先找到失败原因，再选择投入方向。\n\n## Prompt 适合先解决什么\n\n当任务目标、输出要求或边界不清楚时，明确指令、示例和结构往往是低成本的第一步。Prompt 可以告诉模型使用哪些资料、怎样表达和何时追问，但不能凭空提供缺失事实，也不能真正授予业务权限。复杂度不断增长时，还要关注指令冲突与维护成本。\n\n教学构造例子：助手摘要遗漏“待确认条件”，可以先明确字段并给出合格示例。如果资料根本没有设备型号，提示不能可靠生成真实型号。应允许缺失并追问，而不是持续加强“必须准确填写”的措辞。\n\n## RAG 提供外部证据\n\nRAG 通过检索把相关材料加入当前输入，适合知识更新、企业私有资料和需要引用来源的任务。它把资料管理与模型参数分开，便于更新与追溯。但检索、解析、切分、权限和排序都可能失败，生成端也可能误读证据。\n\n若答案依赖实时库存或订单状态，通常还需要结构化接口，而非仅搜索文档。RAG 是证据获取路径之一，不是所有外部信息访问的统称。数据类型与一致性要求决定更适合文档检索、数据库查询还是业务工具。\n\n## 微调改变行为分布\n\n微调可用于适配稳定格式、专业表达、任务模式或某些能力，但需要高质量数据、训练与评估。它不是随时更新事实的数据库，也不能保证精确记住所有样本。知识变化频繁、需要逐条引用或删除时，单靠参数更新往往难以管理。\n\n教学构造例子：大量工单都要求相同领域分类与表达规范，且现有模型在清楚提示后仍不稳定，可以研究微调；最新维修手册每周更新，则更应设计资料更新和检索路径。两种需求可以同时存在，对应不同组件。\n\n## 一条合理的诊断路径\n\n先确认输入与期望是否明确，再检查模型是否具备基础能力、所需资料是否可获得、工具是否返回正确数据、流程是否正确执行。若补齐上下文即可改善，先优化上下文；若持续行为问题有足够数据，再比较定制。不要把“效果不好”直接翻译成“需要训练”。\n\n成本比较还要看维护。长提示可能增加每次调用成本，RAG 增加数据管道与检索运维，微调增加数据准备、训练和版本验证。最便宜的单次调用未必拥有最低总成本。应基于任务量、变化频率和团队能力评估。\n\n## 组合方案如何避免过度复杂\n\n一个常见组合是明确 Prompt 规定行为，RAG 提供证据，模型生成结构化候选，程序校验并执行工具。必要时再通过定制提升稳定性。每个组件都应有清楚责任，避免检索、提示与微调重复承担同一个模糊目标。\n\n如果增加组件，应能够说明其改善哪个失败、通过什么证据确认。否则系统虽然更“完整”，排查却更困难。保留简单基线、版本与分层指标，有助于判断哪些复杂度值得保留。\n\n## 产品经理怎样表达取舍\n\n可以围绕四个问题组织结论：问题是知识缺失还是行为不适配，知识变化多快，是否需要来源与权限，是否有足够高质量数据和维护能力。再结合质量、延迟和成本比较。这样技术方案能够连接到业务条件，而不是成为术语选择。\n\n最终产品还需要异常和人工参与。任何路径都可能在资料不足、模型误判或工具失败时无法完成。明确服务边界与恢复方式，是方案的一部分，也能防止把单一技术当作万能答案。\n\n### 知识与流程同时变化时\n\n新业务规则可能既改变资料，也改变允许动作。此时只更新知识库不够，还需同步工具校验、用户确认和验收。模型能够复述新规则，不代表系统已按新规则执行。方案取舍应覆盖完整业务链路，避免只在生成端修补。\n\n## 同一个需求的三种诊断\n\n用户说“回答不像我们公司的表达”，可能指语气、业务知识或处理规则。语气可以先用明确要求与示例表达；公司知识需要可靠资料；处理规则可能需要确定性流程和工具校验。如果没有澄清含义就微调，团队可能投入大量标注，却仍无法解决用户真正的不满。\n\n同样，“模型不懂产品型号”可能是文本未解析、型号检索不准、缺少适用表，或模型在生成中改写实体。不同原因可以分别通过解析校验、关键词检索、补数据和结构化字段解决。一个问题表面涉及知识，并不意味着必须更新参数。先追踪输入到结果的完整过程，是选择路径的前提。\n\n## 资料与延伸阅读\n\n- [Anthropic：Effective context engineering](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n- [LoRA 原论文](https://arxiv.org/abs/2106.09685)\n- [InstructGPT 原论文](https://arxiv.org/abs/2203.02155)\n\n核验日期：2026-11-14。工单与手册为教学构造情境；具体改进效果需用目标任务验证。\n","chars":1502,"minutes":6,"summary":"Prompt、RAG 与微调解决的问题不同。Prompt 改变当前任务的表达和上下文；RAG 在运行时寻找外部资料；微调通过数据更新模型参数。它们可以组合，但应先找到失败原因，再选择投入方向。"},{"id":"04-05","title":"SFT 与 LoRA：定制模型的过程与边界","file":"content/04-05.md","level":"工作应用","prerequisites":["04-04"],"aliases":["LoRA","SFT","量化","模型选型"],"module":"04","moduleTitle":"模型选择、定制与部署","html":"<p>SFT 是使用输入与期望输出继续训练模型，LoRA 是减少需要训练参数的一种适配方法。二者不处于相同层级：可以用 LoRA 实施某类监督微调，也可以用其他参数更新方式。理解过程与责任，比把缩写记成固定套餐更重要。<\/p><h2 id=\"section-1\">定制从问题与数据开始<\/h2><p>先确定希望改变的行为，例如稳定分类、遵循行业表达或生成特定结构。再准备代表性输入和高质量输出，保留独立评估材料。数据应覆盖真实变化与边界，而非只收集最理想的成功样本。若业务标准未统一，模型会学习混合要求。<\/p><p>教学构造例子：故障摘要要求保留现象、证据和未知条件。示范若总把未知值补成猜测，微调可能强化这种习惯。标注规范需要说明缺失、冲突和不适用如何表达，数据质量比单纯扩大条数更先影响结果。<\/p><h2 id=\"section-2\">全量微调与参数高效方法<\/h2><p>全量微调更新模型大量或全部参数，通常需要较多显存和存储。LoRA 冻结基础权重，通过低秩适配矩阵学习调整，减少可训练参数与某些资源需求。低秩可以直观理解为用较紧凑方式表达更新，但是否适合某任务仍需验证。<\/p><p>LoRA 并不意味着无需计算、无需基础模型或永远没有效果损失。训练、部署和合并方式影响资源与行为；多个适配器的管理也增加版本复杂度。许可与基础模型依赖仍然存在，不能把一个小适配文件看作完全独立模型。<\/p><h2 id=\"section-3\">训练过程需要监控什么<\/h2><p>训练损失反映对训练目标的拟合，但最终要看独立任务表现。验证损失、过拟合、格式、事实性和关键失败都需要观察。增加轮次可能改善也可能回退。数据量、学习率和其他超参数应由实验支持，不存在适合所有项目的固定数值。<\/p><p>还要关注数据泄漏。评估样本若与训练内容重复，结果可能高估真实收益。同一文档的不同片段、同一用户的相似模板也可能造成隐性重叠。数据划分应模拟部署场景，并保留来源和处理记录。<\/p><h2 id=\"section-4\">能改善什么，不能保证什么<\/h2><p>微调可能让目标行为更常出现，但不保证每次输出正确。它也可能改变通用能力、拒答和表达风格。训练后需要回归评估，而非只检查目标样本。对金额、权限和真实执行结果，仍应使用程序与工具验证。<\/p><p>知识注入也存在边界。模型可能记住一些材料，却难以逐条追溯、更新或删除。若用户需要最新文档引用，检索通常仍有价值。可以通过微调学习使用资料的方式，而让实际知识继续从可更新来源进入。<\/p><h2 id=\"section-5\">从实验到部署<\/h2><p>记录基础模型、数据版本、训练配置、适配器和评估结果。部署时还要确认推理引擎、硬件与加载方式支持相应方案。实验环境成功不等于生产并发、延迟和故障处理已经满足要求。发布与回退需要覆盖模型和配套提示。<\/p><p>教学构造例子：新适配器改善了摘要，却让某些工具调用字段变得不稳定。可以暂缓全量切换、限定适用任务，或重新调整数据。不能只看总体平均分掩盖关键业务回退。版本记录让团队能明确选择与恢复。<\/p><h2 id=\"section-6\">产品经理应参与的决策<\/h2><p>你需要负责目标行为、数据标准、范围和验收，与技术团队共同判断训练投入是否值得。成本包含标注、训练、评估、部署和后续更新。若收益主要来自更清楚的任务定义，应先修复定义；若有稳定、可重复的数据价值，再推进定制会更有依据。<\/p><h3 id=\"section-7\">训练数据与评估数据分工<\/h3><p>目标样本可以指导团队理解问题，但用于持续调参后就不再完全独立。应保留未参与开发的材料，并注明每批数据的来源和用途。上线后收集的新失败还需审核，不能直接将用户任何纠正当作训练真值，尤其是涉及权限和专业判断时。<\/p><h2 id=\"section-8\">低秩为什么减少参数<\/h2><p>用简化线性层说明：一个 <code>d×d<\/code> 权重矩阵包含 <code>d²<\/code> 个数；若更新近似分解为 <code>d×r<\/code> 与 <code>r×d<\/code> 两个矩阵，新增可训练参数约为 <code>2dr<\/code>，当 <code>r<\/code> 远小于 <code>d<\/code> 时明显更少。这只是直觉示意，实际 LoRA 还涉及应用位置、缩放、多个模块与训练配置。<\/p><p>更低秩意味着更紧凑，但不等于任务一定达到相同性能。选择需要通过数据与实验判断。减少可训练参数也不会消除基础模型推理所需资源，部署仍要加载相应基础权重或合并后的权重。应分别计算训练开销、适配器存储和生产推理成本。<\/p><h2 id=\"section-9\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/2106.09685\" target=\"_blank\" rel=\"noopener noreferrer\">LoRA：Low-Rank Adaptation of Large Language Models<\/a><\/li><li><a href=\"https://arxiv.org/abs/2203.02155\" target=\"_blank\" rel=\"noopener noreferrer\">Training language models to follow instructions with human feedback<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/modules/cross_validation.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Cross-validation<\/a><\/li><\/ul><p>核验日期：2026-11-14。故障摘要为教学构造；资源节省与性能取决于具体模型、配置和任务。<\/p>","toc":[{"id":"section-1","title":"定制从问题与数据开始","level":2},{"id":"section-2","title":"全量微调与参数高效方法","level":2},{"id":"section-3","title":"训练过程需要监控什么","level":2},{"id":"section-4","title":"能改善什么，不能保证什么","level":2},{"id":"section-5","title":"从实验到部署","level":2},{"id":"section-6","title":"产品经理应参与的决策","level":2},{"id":"section-7","title":"训练数据与评估数据分工","level":3},{"id":"section-8","title":"低秩为什么减少参数","level":2},{"id":"section-9","title":"资料与延伸阅读","level":2}],"text":"SFT 是使用输入与期望输出继续训练模型，LoRA 是减少需要训练参数的一种适配方法。二者不处于相同层级：可以用 LoRA 实施某类监督微调，也可以用其他参数更新方式。理解过程与责任，比把缩写记成固定套餐更重要。\n\n## 定制从问题与数据开始\n\n先确定希望改变的行为，例如稳定分类、遵循行业表达或生成特定结构。再准备代表性输入和高质量输出，保留独立评估材料。数据应覆盖真实变化与边界，而非只收集最理想的成功样本。若业务标准未统一，模型会学习混合要求。\n\n教学构造例子：故障摘要要求保留现象、证据和未知条件。示范若总把未知值补成猜测，微调可能强化这种习惯。标注规范需要说明缺失、冲突和不适用如何表达，数据质量比单纯扩大条数更先影响结果。\n\n## 全量微调与参数高效方法\n\n全量微调更新模型大量或全部参数，通常需要较多显存和存储。LoRA 冻结基础权重，通过低秩适配矩阵学习调整，减少可训练参数与某些资源需求。低秩可以直观理解为用较紧凑方式表达更新，但是否适合某任务仍需验证。\n\nLoRA 并不意味着无需计算、无需基础模型或永远没有效果损失。训练、部署和合并方式影响资源与行为；多个适配器的管理也增加版本复杂度。许可与基础模型依赖仍然存在，不能把一个小适配文件看作完全独立模型。\n\n## 训练过程需要监控什么\n\n训练损失反映对训练目标的拟合，但最终要看独立任务表现。验证损失、过拟合、格式、事实性和关键失败都需要观察。增加轮次可能改善也可能回退。数据量、学习率和其他超参数应由实验支持，不存在适合所有项目的固定数值。\n\n还要关注数据泄漏。评估样本若与训练内容重复，结果可能高估真实收益。同一文档的不同片段、同一用户的相似模板也可能造成隐性重叠。数据划分应模拟部署场景，并保留来源和处理记录。\n\n## 能改善什么，不能保证什么\n\n微调可能让目标行为更常出现，但不保证每次输出正确。它也可能改变通用能力、拒答和表达风格。训练后需要回归评估，而非只检查目标样本。对金额、权限和真实执行结果，仍应使用程序与工具验证。\n\n知识注入也存在边界。模型可能记住一些材料，却难以逐条追溯、更新或删除。若用户需要最新文档引用，检索通常仍有价值。可以通过微调学习使用资料的方式，而让实际知识继续从可更新来源进入。\n\n## 从实验到部署\n\n记录基础模型、数据版本、训练配置、适配器和评估结果。部署时还要确认推理引擎、硬件与加载方式支持相应方案。实验环境成功不等于生产并发、延迟和故障处理已经满足要求。发布与回退需要覆盖模型和配套提示。\n\n教学构造例子：新适配器改善了摘要，却让某些工具调用字段变得不稳定。可以暂缓全量切换、限定适用任务，或重新调整数据。不能只看总体平均分掩盖关键业务回退。版本记录让团队能明确选择与恢复。\n\n## 产品经理应参与的决策\n\n你需要负责目标行为、数据标准、范围和验收，与技术团队共同判断训练投入是否值得。成本包含标注、训练、评估、部署和后续更新。若收益主要来自更清楚的任务定义，应先修复定义；若有稳定、可重复的数据价值，再推进定制会更有依据。\n\n### 训练数据与评估数据分工\n\n目标样本可以指导团队理解问题，但用于持续调参后就不再完全独立。应保留未参与开发的材料，并注明每批数据的来源和用途。上线后收集的新失败还需审核，不能直接将用户任何纠正当作训练真值，尤其是涉及权限和专业判断时。\n\n## 低秩为什么减少参数\n\n用简化线性层说明：一个 `d×d` 权重矩阵包含 `d²` 个数；若更新近似分解为 `d×r` 与 `r×d` 两个矩阵，新增可训练参数约为 `2dr`，当 `r` 远小于 `d` 时明显更少。这只是直觉示意，实际 LoRA 还涉及应用位置、缩放、多个模块与训练配置。\n\n更低秩意味着更紧凑，但不等于任务一定达到相同性能。选择需要通过数据与实验判断。减少可训练参数也不会消除基础模型推理所需资源，部署仍要加载相应基础权重或合并后的权重。应分别计算训练开销、适配器存储和生产推理成本。\n\n## 资料与延伸阅读\n\n- [LoRA：Low-Rank Adaptation of Large Language Models](https://arxiv.org/abs/2106.09685)\n- [Training language models to follow instructions with human feedback](https://arxiv.org/abs/2203.02155)\n- [scikit-learn：Cross-validation](https://scikit-learn.org/stable/modules/cross_validation.html)\n\n核验日期：2026-11-14。故障摘要为教学构造；资源节省与性能取决于具体模型、配置和任务。\n","chars":1420,"minutes":5,"summary":"SFT 是使用输入与期望输出继续训练模型，LoRA 是减少需要训练参数的一种适配方法。二者不处于相同层级：可以用 LoRA 实施某类监督微调，也可以用其他参数更新方式。理解过程与责任，比把缩写记成固定套餐更重要。"},{"id":"04-06","title":"蒸馏、量化与推理优化","file":"content/04-06.md","level":"深入阅读","prerequisites":["04-05"],"aliases":["LoRA","SFT","量化","模型选型"],"module":"04","moduleTitle":"模型选择、定制与部署","html":"<p>蒸馏、量化和推理优化经常一起出现，但改变的对象不同。蒸馏让一个模型学习另一个模型或系统的行为；量化用更低精度表示某些数值；推理优化则改善计算、内存和服务组织。它们共同服务于质量、成本与速度的取舍，不能只以“压缩模型”概括。<\/p><h2 id=\"section-1\">蒸馏传递什么<\/h2><p>教师模型提供输出分布、示范或其他监督信号，学生模型据此训练。目标可以是用较小模型近似某类行为，或把多个系统的能力压缩到一个模型。学生能够学到多少，取决于容量、数据覆盖、教师质量和训练目标，不保证完整复制教师能力。<\/p><p>教学构造例子：用强模型为工单分类生成高质量示范，再训练较小模型服务高频任务。若示范只包含简单问题，学生在长尾上仍可能失败。教师错误也会传播，因此需要抽查、过滤与独立评估。生成数据的成本与使用条件同样需要纳入。<\/p><h2 id=\"section-2\">量化改变数值表示<\/h2><p>模型权重和计算使用一定数值精度。量化将某些数值映射到较低位宽，以减少存储和内存带宽需求。它可能在训练后实施，也可能结合训练。不同方法、层和硬件的效果不同，不能把某个位数直接等同于固定速度或质量。<\/p><p>量化有可能影响小差异敏感的任务、长上下文或特定输入。压缩后的模型仍需在真实任务上验证，尤其是数字、工具参数和罕见类别。文件变小不必然意味着端到端更快，因为实际性能还受内核、硬件、批量和数据搬运影响。<\/p><h2 id=\"section-3\">推理优化不只在模型内部<\/h2><p>缓存可复用已有计算或结果，批处理提高硬件利用，并发与调度影响吞吐和等待。某些技术优化生成过程，另一些减少重复输入。系统还可能使用路由，让不同任务使用不同模型。每种方法都有条件与额外复杂度。<\/p><p>教学构造例子：批处理能提高总吞吐，却可能让单个实时用户等到批次形成。缓存可以节省重复计算，但资料更新和用户权限变化后必须正确失效。优化某项工程指标时，需要检查是否伤害用户体验或数据边界。<\/p><h2 id=\"section-4\">内存、吞吐与延迟<\/h2><p>模型权重只是内存的一部分，运行时状态、上下文缓存和并发任务也占用资源。更长上下文或更多用户可能显著增加需求。吞吐衡量单位时间处理量，延迟衡量单任务等待，两者不等价。产品高峰期需要看尾部延迟和失败率。<\/p><p>因此估算部署资源时，应使用真实输入长度、输出长度和并发模式。实验室单请求速度无法代表生产负载。硬件价格、服务计费和软件支持变化较快，具体预算应在采购或部署前核验。<\/p><h2 id=\"section-5\">如何判断优化是否值得<\/h2><p>先建立未优化基线，再在相同任务下比较质量、总时延、资源和成本。关键错误不能被小幅平均分下降掩盖；节省成本也应按成功任务计算。若重试和人工复核增加，表面更便宜的模型可能反而更贵。<\/p><p>优化应逐项验证，避免同时替换模型、量化、缓存和提示而无法解释结果。记录硬件、软件、模型与配置，保留回退。部署收益是系统层结论，需要完整链路证据，而非只引用某篇论文的加速倍数。<\/p><h2 id=\"section-6\">产品经理的角色<\/h2><p>明确用户可接受的质量边界、等待时间与成本目标，技术团队据此选择优化路径。对高风险任务可保留更强方案，对低风险高频任务研究压缩与路由。合理选择应解释哪些能力被保留、哪些场景需要升级处理，以及如何发现回退。<\/p><h3 id=\"section-7\">优化结果需要单位<\/h3><p>报告应说明每秒处理的是请求、Token 还是完整任务，硬件资源是否相同，是否包含排队与工具等待。只写“速度翻倍”容易产生误解。端到端收益往往小于某个算子的加速，应以用户实际等待和成功任务成本作为最终比较依据。<\/p><h2 id=\"section-8\">一个内存估算的直觉<\/h2><p>仅看权重，七十亿参数若每个用两字节表示，约为一百四十亿字节；若平均压到四比特，理想化权重存储约为其四分之一。这个计算不包含量化元数据、运行时激活、上下文缓存、框架和并发开销，也不保证硬件直接支持相应运算。它适合估算数量级，不能替代实际部署测试。<\/p><p>生成长序列时，运行时缓存可能成为重要部分，因此同一模型在不同上下文和并发下，所需内存与吞吐并不相同。面向实时用户与离线批量作业，可以有不同调度策略。产品需求需要说明负载形态，技术团队才能给出有依据的资源与成本估算。<\/p><h2 id=\"section-9\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/1503.02531\" target=\"_blank\" rel=\"noopener noreferrer\">Distilling the Knowledge in a Neural Network<\/a><\/li><li><a href=\"https://arxiv.org/abs/2210.17323\" target=\"_blank\" rel=\"noopener noreferrer\">GPTQ：Accurate Post-Training Quantization<\/a><\/li><li><a href=\"https://huggingface.co/docs/transformers/main_classes/text_generation\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：Generation documentation<\/a><\/li><\/ul><p>核验日期：2026-11-14。工单、缓存和批处理为教学构造；不将论文特定实验收益泛化为所有部署结果。<\/p>","toc":[{"id":"section-1","title":"蒸馏传递什么","level":2},{"id":"section-2","title":"量化改变数值表示","level":2},{"id":"section-3","title":"推理优化不只在模型内部","level":2},{"id":"section-4","title":"内存、吞吐与延迟","level":2},{"id":"section-5","title":"如何判断优化是否值得","level":2},{"id":"section-6","title":"产品经理的角色","level":2},{"id":"section-7","title":"优化结果需要单位","level":3},{"id":"section-8","title":"一个内存估算的直觉","level":2},{"id":"section-9","title":"资料与延伸阅读","level":2}],"text":"蒸馏、量化和推理优化经常一起出现，但改变的对象不同。蒸馏让一个模型学习另一个模型或系统的行为；量化用更低精度表示某些数值；推理优化则改善计算、内存和服务组织。它们共同服务于质量、成本与速度的取舍，不能只以“压缩模型”概括。\n\n## 蒸馏传递什么\n\n教师模型提供输出分布、示范或其他监督信号，学生模型据此训练。目标可以是用较小模型近似某类行为，或把多个系统的能力压缩到一个模型。学生能够学到多少，取决于容量、数据覆盖、教师质量和训练目标，不保证完整复制教师能力。\n\n教学构造例子：用强模型为工单分类生成高质量示范，再训练较小模型服务高频任务。若示范只包含简单问题，学生在长尾上仍可能失败。教师错误也会传播，因此需要抽查、过滤与独立评估。生成数据的成本与使用条件同样需要纳入。\n\n## 量化改变数值表示\n\n模型权重和计算使用一定数值精度。量化将某些数值映射到较低位宽，以减少存储和内存带宽需求。它可能在训练后实施，也可能结合训练。不同方法、层和硬件的效果不同，不能把某个位数直接等同于固定速度或质量。\n\n量化有可能影响小差异敏感的任务、长上下文或特定输入。压缩后的模型仍需在真实任务上验证，尤其是数字、工具参数和罕见类别。文件变小不必然意味着端到端更快，因为实际性能还受内核、硬件、批量和数据搬运影响。\n\n## 推理优化不只在模型内部\n\n缓存可复用已有计算或结果，批处理提高硬件利用，并发与调度影响吞吐和等待。某些技术优化生成过程，另一些减少重复输入。系统还可能使用路由，让不同任务使用不同模型。每种方法都有条件与额外复杂度。\n\n教学构造例子：批处理能提高总吞吐，却可能让单个实时用户等到批次形成。缓存可以节省重复计算，但资料更新和用户权限变化后必须正确失效。优化某项工程指标时，需要检查是否伤害用户体验或数据边界。\n\n## 内存、吞吐与延迟\n\n模型权重只是内存的一部分，运行时状态、上下文缓存和并发任务也占用资源。更长上下文或更多用户可能显著增加需求。吞吐衡量单位时间处理量，延迟衡量单任务等待，两者不等价。产品高峰期需要看尾部延迟和失败率。\n\n因此估算部署资源时，应使用真实输入长度、输出长度和并发模式。实验室单请求速度无法代表生产负载。硬件价格、服务计费和软件支持变化较快，具体预算应在采购或部署前核验。\n\n## 如何判断优化是否值得\n\n先建立未优化基线，再在相同任务下比较质量、总时延、资源和成本。关键错误不能被小幅平均分下降掩盖；节省成本也应按成功任务计算。若重试和人工复核增加，表面更便宜的模型可能反而更贵。\n\n优化应逐项验证，避免同时替换模型、量化、缓存和提示而无法解释结果。记录硬件、软件、模型与配置，保留回退。部署收益是系统层结论，需要完整链路证据，而非只引用某篇论文的加速倍数。\n\n## 产品经理的角色\n\n明确用户可接受的质量边界、等待时间与成本目标，技术团队据此选择优化路径。对高风险任务可保留更强方案，对低风险高频任务研究压缩与路由。合理选择应解释哪些能力被保留、哪些场景需要升级处理，以及如何发现回退。\n\n### 优化结果需要单位\n\n报告应说明每秒处理的是请求、Token 还是完整任务，硬件资源是否相同，是否包含排队与工具等待。只写“速度翻倍”容易产生误解。端到端收益往往小于某个算子的加速，应以用户实际等待和成功任务成本作为最终比较依据。\n\n## 一个内存估算的直觉\n\n仅看权重，七十亿参数若每个用两字节表示，约为一百四十亿字节；若平均压到四比特，理想化权重存储约为其四分之一。这个计算不包含量化元数据、运行时激活、上下文缓存、框架和并发开销，也不保证硬件直接支持相应运算。它适合估算数量级，不能替代实际部署测试。\n\n生成长序列时，运行时缓存可能成为重要部分，因此同一模型在不同上下文和并发下，所需内存与吞吐并不相同。面向实时用户与离线批量作业，可以有不同调度策略。产品需求需要说明负载形态，技术团队才能给出有依据的资源与成本估算。\n\n## 资料与延伸阅读\n\n- [Distilling the Knowledge in a Neural Network](https://arxiv.org/abs/1503.02531)\n- [GPTQ：Accurate Post-Training Quantization](https://arxiv.org/abs/2210.17323)\n- [Hugging Face：Generation documentation](https://huggingface.co/docs/transformers/main_classes/text_generation)\n\n核验日期：2026-11-14。工单、缓存和批处理为教学构造；不将论文特定实验收益泛化为所有部署结果。\n","chars":1462,"minutes":6,"summary":"蒸馏、量化和推理优化经常一起出现，但改变的对象不同。蒸馏让一个模型学习另一个模型或系统的行为；量化用更低精度表示某些数值；推理优化则改善计算、内存和服务组织。它们共同服务于质量、成本与速度的取舍，不能只以“压缩模型”概括。"},{"id":"04-07","title":"云端、本地与混合部署","file":"content/04-07.md","level":"工作应用","prerequisites":["04-06"],"aliases":["LoRA","SFT","量化","模型选型"],"module":"04","moduleTitle":"模型选择、定制与部署","html":"<p>云端、本地和混合部署描述模型与相关组件运行的位置及责任分配。选择不仅涉及数据是否离开设备，还涉及硬件利用、网络、维护、服务连续性和成本。需要沿完整数据链路评估，而不是只看模型位于哪里。<\/p><h2 id=\"section-1\">云端托管与自建环境<\/h2><p>托管 API 由服务方运行模型，应用通过接口调用。云上自建则由团队在云资源上部署和维护模型。两者都在云端，但责任、控制与费用结构不同。本地部署也可能指个人设备、企业机房或隔离网络，不应混为一个方案。<\/p><p>教学构造例子：企业要求某类资料不进入公共服务，可以研究受控环境部署；但仍需检查日志、监控、更新和外部工具是否向外传输信息。模型在内网并不自动意味着全部数据留在内网，外围组件同样需要审查。<\/p><h2 id=\"section-2\">网络与离线能力<\/h2><p>云端能力依赖网络和服务可用性，边缘或设备端模型可能在断网时继续处理有限任务。但本地模型需要适配算力、内存、电量与更新方式。离线可用通常是明确范围内的能力，不代表能访问实时外部数据或完成所有工具操作。<\/p><p>在现场工具产品中，可以将关键规则和基本操作保留在本地，将复杂分析交给远程服务。网络中断时说明哪些能力仍可用、哪些等待恢复。降级行为应提前设计，而不是出现故障后简单显示“请联网”。<\/p><h2 id=\"section-3\">数据边界与权限<\/h2><p>部署选择需要明确原始文件、检索片段、向量、日志和生成结果分别在哪里处理与保存。向量不应自动视为无敏感信息，摘要也可能保留机密。跨环境传递时，应选择必要字段并保留权限与来源。<\/p><p>教学构造例子：本地检索企业手册，再把片段发送到云模型，仍然发生资料外传。若规则限制此行为，混合方案需要调整为本地生成、脱敏或仅传递允许的信息。架构图应画出实际数据，而不是只画服务名称。<\/p><h2 id=\"section-4\">总拥有成本<\/h2><p>自托管成本包括硬件或租赁、运维、优化、安全、升级、监控和人员时间。API 费用更接近按使用计量，但还要考虑高峰限流、失败重试和供应商依赖。稳定高利用率与稀疏请求的经济性可能完全不同，应结合真实任务量测算。<\/p><p>不能用模型文件大小直接推算全部资源。并发、上下文、输出与缓存都会占用内存。满足单人演示的设备，未必能支撑团队高峰使用。容量规划应以服务目标和负载测试为依据。<\/p><h2 id=\"section-5\">混合部署的协调成本<\/h2><p>混合方案可以根据任务、数据等级和网络选择路径，但需要统一身份、版本、监控和结果格式。跨环境状态同步可能引入延迟或不一致。路由逻辑本身也需要验证，尤其不能把敏感任务错误发送到不允许的环境。<\/p><p>模型与数据更新需要计划。离线设备可能长期无法更新，资料版本和能力边界应可见。若云端与本地模型行为不同，交互应解释可能差异，并保留必要的人工处理方式。<\/p><h2 id=\"section-6\">产品经理如何组织决策<\/h2><p>先列硬约束：数据边界、网络、响应时间、设备条件和服务目标；再比较质量、总成本、维护与迁移。方案结论可以是分阶段或分任务部署，但应清楚说明原因与责任。架构不是一次选择结束，而是随用户规模和能力变化持续复核。<\/p><h3 id=\"section-7\">部署还影响交付责任<\/h3><p>企业客户可能需要升级窗口、故障响应、备份和恢复说明。本地部署把部分责任移给客户，也增加环境差异；托管服务则需要明确服务承诺与依赖。产品报价和交付文档应反映这些工作，而不是只包含模型推理费用。责任没有定义时，故障容易在供应方与客户之间反复转交。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/1810.03993\" target=\"_blank\" rel=\"noopener noreferrer\">Model Cards for Model Reporting<\/a><\/li><li><a href=\"https://arxiv.org/abs/2210.17323\" target=\"_blank\" rel=\"noopener noreferrer\">GPTQ：Accurate Post-Training Quantization<\/a><\/li><li><a href=\"https://opentelemetry.io/docs/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenTelemetry 官方文档<\/a><\/li><\/ul><p>核验日期：2026-11-14。部署情境为教学构造；数据与许可的具体适用性应结合组织规则和当前合同核验。<\/p>","toc":[{"id":"section-1","title":"云端托管与自建环境","level":2},{"id":"section-2","title":"网络与离线能力","level":2},{"id":"section-3","title":"数据边界与权限","level":2},{"id":"section-4","title":"总拥有成本","level":2},{"id":"section-5","title":"混合部署的协调成本","level":2},{"id":"section-6","title":"产品经理如何组织决策","level":2},{"id":"section-7","title":"部署还影响交付责任","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"云端、本地和混合部署描述模型与相关组件运行的位置及责任分配。选择不仅涉及数据是否离开设备，还涉及硬件利用、网络、维护、服务连续性和成本。需要沿完整数据链路评估，而不是只看模型位于哪里。\n\n## 云端托管与自建环境\n\n托管 API 由服务方运行模型，应用通过接口调用。云上自建则由团队在云资源上部署和维护模型。两者都在云端，但责任、控制与费用结构不同。本地部署也可能指个人设备、企业机房或隔离网络，不应混为一个方案。\n\n教学构造例子：企业要求某类资料不进入公共服务，可以研究受控环境部署；但仍需检查日志、监控、更新和外部工具是否向外传输信息。模型在内网并不自动意味着全部数据留在内网，外围组件同样需要审查。\n\n## 网络与离线能力\n\n云端能力依赖网络和服务可用性，边缘或设备端模型可能在断网时继续处理有限任务。但本地模型需要适配算力、内存、电量与更新方式。离线可用通常是明确范围内的能力，不代表能访问实时外部数据或完成所有工具操作。\n\n在现场工具产品中，可以将关键规则和基本操作保留在本地，将复杂分析交给远程服务。网络中断时说明哪些能力仍可用、哪些等待恢复。降级行为应提前设计，而不是出现故障后简单显示“请联网”。\n\n## 数据边界与权限\n\n部署选择需要明确原始文件、检索片段、向量、日志和生成结果分别在哪里处理与保存。向量不应自动视为无敏感信息，摘要也可能保留机密。跨环境传递时，应选择必要字段并保留权限与来源。\n\n教学构造例子：本地检索企业手册，再把片段发送到云模型，仍然发生资料外传。若规则限制此行为，混合方案需要调整为本地生成、脱敏或仅传递允许的信息。架构图应画出实际数据，而不是只画服务名称。\n\n## 总拥有成本\n\n自托管成本包括硬件或租赁、运维、优化、安全、升级、监控和人员时间。API 费用更接近按使用计量，但还要考虑高峰限流、失败重试和供应商依赖。稳定高利用率与稀疏请求的经济性可能完全不同，应结合真实任务量测算。\n\n不能用模型文件大小直接推算全部资源。并发、上下文、输出与缓存都会占用内存。满足单人演示的设备，未必能支撑团队高峰使用。容量规划应以服务目标和负载测试为依据。\n\n## 混合部署的协调成本\n\n混合方案可以根据任务、数据等级和网络选择路径，但需要统一身份、版本、监控和结果格式。跨环境状态同步可能引入延迟或不一致。路由逻辑本身也需要验证，尤其不能把敏感任务错误发送到不允许的环境。\n\n模型与数据更新需要计划。离线设备可能长期无法更新，资料版本和能力边界应可见。若云端与本地模型行为不同，交互应解释可能差异，并保留必要的人工处理方式。\n\n## 产品经理如何组织决策\n\n先列硬约束：数据边界、网络、响应时间、设备条件和服务目标；再比较质量、总成本、维护与迁移。方案结论可以是分阶段或分任务部署，但应清楚说明原因与责任。架构不是一次选择结束，而是随用户规模和能力变化持续复核。\n\n### 部署还影响交付责任\n\n企业客户可能需要升级窗口、故障响应、备份和恢复说明。本地部署把部分责任移给客户，也增加环境差异；托管服务则需要明确服务承诺与依赖。产品报价和交付文档应反映这些工作，而不是只包含模型推理费用。责任没有定义时，故障容易在供应方与客户之间反复转交。\n\n## 资料与延伸阅读\n\n- [Model Cards for Model Reporting](https://arxiv.org/abs/1810.03993)\n- [GPTQ：Accurate Post-Training Quantization](https://arxiv.org/abs/2210.17323)\n- [OpenTelemetry 官方文档](https://opentelemetry.io/docs/)\n\n核验日期：2026-11-14。部署情境为教学构造；数据与许可的具体适用性应结合组织规则和当前合同核验。\n","chars":1203,"minutes":5,"summary":"云端、本地和混合部署描述模型与相关组件运行的位置及责任分配。选择不仅涉及数据是否离开设备，还涉及硬件利用、网络、维护、服务连续性和成本。需要沿完整数据链路评估，而不是只看模型位于哪里。"},{"id":"04-08","title":"模型路由、迁移与供应商依赖","file":"content/04-08.md","level":"工作应用","prerequisites":["04-07"],"aliases":["LoRA","SFT","量化","模型选型"],"module":"04","moduleTitle":"模型选择、定制与部署","html":"<p>模型路由根据任务与条件选择不同模型或路径；模型迁移将产品从一个版本或供应商切换到另一个。它们可以控制成本、增加弹性，也会引入新的分类、兼容和运维问题。产品需要为选择逻辑与切换过程提供证据。<\/p><h2 id=\"section-1\">路由依据是什么<\/h2><p>可以按任务类型、输入模态、长度、风险、语言、成本或服务状态选择。规则路由较容易理解；模型判断路由可能更灵活，却增加调用与误判。路由不是免费的优化，必须检查识别错误如何影响最终任务。<\/p><p>教学构造例子：普通摘要走较快模型，复杂条款比较走更强模型。若系统把复杂任务误分为普通摘要，成本下降却增加关键错误。可以设置明确升级条件、让用户切换或对低把握任务采用保守路径。收益应按完整成功任务计算。<\/p><h2 id=\"section-2\">升级与回退路径<\/h2><p>一种方案先尝试便宜路径，再根据校验失败升级，但校验器必须能发现真正问题。只检查输出是否有 JSON，无法发现内容错误。另一种方案并行生成再选择，可能提高质量，也可能显著增加成本和延迟。选择取决于可检测性和业务代价。<\/p><p>服务故障时的回退还要关注能力差异。备用模型可能不支持相同工具或上下文，不能仅替换模型名称。对于无法保证安全执行的情况，返回草稿、限制功能或转人工，可能比继续自动操作更合适。<\/p><h2 id=\"section-3\">供应商依赖有哪些层次<\/h2><p>接口格式只是表层。工具调用语义、结构化输出、提示角色、缓存、文件处理和安全行为可能不同。即使应用封装统一接口，也不代表行为兼容。供应商迁移需要任务回归，而不只是代码能连接。<\/p><p>模型特有提示和数据资产也形成依赖。过度针对某版本优化后，迁移可能出现风格、拒答或格式变化。可通过保留任务定义、独立评测集、标准工具契约和可追溯资料，降低不必要耦合，但不能完全消除迁移成本。<\/p><h2 id=\"section-4\">迁移如何分阶段验证<\/h2><p>先在离线样本比较，再用受控流量观察，确认质量、时延、成本与风险。记录新旧模型版本、提示、工具和索引，避免同时改变过多变量。必要时保留用户选择和快速回退。所谓灰度，是有观察和停止条件的受控发布，而非随机少放一些用户。<\/p><p>教学构造例子：新模型摘要更好，却在长工具返回后遗漏授权限制。应暂停相应任务切换、分析上下文与规则，而不能因为平均评分上涨就全量上线。关键路径的回退要比总体分数更受关注。<\/p><h2 id=\"section-5\">版本与退役管理<\/h2><p>供应商可能调整服务或停止旧版本，产品应知道依赖清单和替代路径。固定版本有助于复现，但不能假设可永久使用；自动升级方便维护，却增加行为变化。需要根据服务策略建立提前验证和迁移机制。<\/p><p>配置、模型、提示、工具和数据版本共同影响行为。回滚仅恢复其中一个，未必重现旧表现。发布记录应能够关联全部关键对象，并保存变更原因与验证结果。<\/p><h2 id=\"section-6\">产品经理的判断框架<\/h2><p>当多模型方案带来的收益超过路由与维护成本，且失败可被有效控制时，路由才值得采用。迁移则需要清楚的收益、约束和风险计划。用户最终不关心后台使用多少模型，而关心任务能否稳定完成、费用是否合理，以及结果是否可信。<\/p><h3 id=\"section-7\">路由本身也有版本<\/h3><p>任务规则、分类器、阈值和备用路径都可能改变最终行为，应与模型一起记录。分析某次失败时，需要知道请求为何走到该路径。路由可解释性不必向用户暴露全部技术细节，但内部应有足够证据，使团队能够区分分流错误与模型执行错误。<\/p><p>实际切换前还应确认客服与运营知道新旧路径差异，避免用户反馈被错误归类。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://arxiv.org/abs/1810.03993\" target=\"_blank\" rel=\"noopener noreferrer\">Model Cards for Model Reporting<\/a><\/li><li><a href=\"https://opentelemetry.io/docs/concepts/signals/logs/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenTelemetry：Logs<\/a><\/li><\/ul><p>核验日期：2026-11-14。路由和迁移情境为教学构造；不包含对特定供应商兼容性的实时承诺。<\/p>","toc":[{"id":"section-1","title":"路由依据是什么","level":2},{"id":"section-2","title":"升级与回退路径","level":2},{"id":"section-3","title":"供应商依赖有哪些层次","level":2},{"id":"section-4","title":"迁移如何分阶段验证","level":2},{"id":"section-5","title":"版本与退役管理","level":2},{"id":"section-6","title":"产品经理的判断框架","level":2},{"id":"section-7","title":"路由本身也有版本","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"模型路由根据任务与条件选择不同模型或路径；模型迁移将产品从一个版本或供应商切换到另一个。它们可以控制成本、增加弹性，也会引入新的分类、兼容和运维问题。产品需要为选择逻辑与切换过程提供证据。\n\n## 路由依据是什么\n\n可以按任务类型、输入模态、长度、风险、语言、成本或服务状态选择。规则路由较容易理解；模型判断路由可能更灵活，却增加调用与误判。路由不是免费的优化，必须检查识别错误如何影响最终任务。\n\n教学构造例子：普通摘要走较快模型，复杂条款比较走更强模型。若系统把复杂任务误分为普通摘要，成本下降却增加关键错误。可以设置明确升级条件、让用户切换或对低把握任务采用保守路径。收益应按完整成功任务计算。\n\n## 升级与回退路径\n\n一种方案先尝试便宜路径，再根据校验失败升级，但校验器必须能发现真正问题。只检查输出是否有 JSON，无法发现内容错误。另一种方案并行生成再选择，可能提高质量，也可能显著增加成本和延迟。选择取决于可检测性和业务代价。\n\n服务故障时的回退还要关注能力差异。备用模型可能不支持相同工具或上下文，不能仅替换模型名称。对于无法保证安全执行的情况，返回草稿、限制功能或转人工，可能比继续自动操作更合适。\n\n## 供应商依赖有哪些层次\n\n接口格式只是表层。工具调用语义、结构化输出、提示角色、缓存、文件处理和安全行为可能不同。即使应用封装统一接口，也不代表行为兼容。供应商迁移需要任务回归，而不只是代码能连接。\n\n模型特有提示和数据资产也形成依赖。过度针对某版本优化后，迁移可能出现风格、拒答或格式变化。可通过保留任务定义、独立评测集、标准工具契约和可追溯资料，降低不必要耦合，但不能完全消除迁移成本。\n\n## 迁移如何分阶段验证\n\n先在离线样本比较，再用受控流量观察，确认质量、时延、成本与风险。记录新旧模型版本、提示、工具和索引，避免同时改变过多变量。必要时保留用户选择和快速回退。所谓灰度，是有观察和停止条件的受控发布，而非随机少放一些用户。\n\n教学构造例子：新模型摘要更好，却在长工具返回后遗漏授权限制。应暂停相应任务切换、分析上下文与规则，而不能因为平均评分上涨就全量上线。关键路径的回退要比总体分数更受关注。\n\n## 版本与退役管理\n\n供应商可能调整服务或停止旧版本，产品应知道依赖清单和替代路径。固定版本有助于复现，但不能假设可永久使用；自动升级方便维护，却增加行为变化。需要根据服务策略建立提前验证和迁移机制。\n\n配置、模型、提示、工具和数据版本共同影响行为。回滚仅恢复其中一个，未必重现旧表现。发布记录应能够关联全部关键对象，并保存变更原因与验证结果。\n\n## 产品经理的判断框架\n\n当多模型方案带来的收益超过路由与维护成本，且失败可被有效控制时，路由才值得采用。迁移则需要清楚的收益、约束和风险计划。用户最终不关心后台使用多少模型，而关心任务能否稳定完成、费用是否合理，以及结果是否可信。\n\n### 路由本身也有版本\n\n任务规则、分类器、阈值和备用路径都可能改变最终行为，应与模型一起记录。分析某次失败时，需要知道请求为何走到该路径。路由可解释性不必向用户暴露全部技术细节，但内部应有足够证据，使团队能够区分分流错误与模型执行错误。\n\n实际切换前还应确认客服与运营知道新旧路径差异，避免用户反馈被错误归类。\n\n## 资料与延伸阅读\n\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [Model Cards for Model Reporting](https://arxiv.org/abs/1810.03993)\n- [OpenTelemetry：Logs](https://opentelemetry.io/docs/concepts/signals/logs/)\n\n核验日期：2026-11-14。路由和迁移情境为教学构造；不包含对特定供应商兼容性的实时承诺。\n","chars":1227,"minutes":5,"summary":"模型路由根据任务与条件选择不同模型或路径；模型迁移将产品从一个版本或供应商切换到另一个。它们可以控制成本、增加弹性，也会引入新的分类、兼容和运维问题。产品需要为选择逻辑与切换过程提供证据。"},{"id":"05-01","title":"指令、角色与任务边界","file":"content/05-01.md","level":"工作应用","prerequisites":["02-06","02-07"],"aliases":["Prompt","Context","上下文工程","提示词"],"module":"05","moduleTitle":"Prompt 与上下文设计","html":"<p>Prompt 是应用交给模型的任务表达，其中包含目标、输入、约束和输出要求。角色可以帮助建立语境，但“你是一位专家”并不能替代清楚任务。好的指令让模型知道要完成什么、依据什么、哪些信息不足，以及如何交付结果。<\/p><h2 id=\"section-1\">从愿望改写为任务<\/h2><p>“分析一下这份报告”存在多种解释：摘要、找风险、比较数据或提出行动。可以明确用户是谁、希望支持什么决策、需要哪些字段，以及分析范围。输出要求应连接实际使用场景，而不是只规定字数和语气。<\/p><p>教学构造例子：面向设备运维人员，要求“根据提供的报警记录与指定手册，整理故障现象、可能原因、依据和待确认条件；没有依据的部分标为未知”。这比“你是顶级设备
