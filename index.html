款、费用异常 | 是否存在不可接受代价 |\n\n总体成功率可能掩盖关键人群或任务失败。应按语言、任务复杂度、资料类型、用户角色、工具和错误风险分层。一个系统在简单问答上很好，却在退款和权限问题上不稳定，不能靠大量简单样本稀释风险。\n\n教学构造：一百个任务成功九十个，若失败都集中在十个高价值企业客户，产品意义与随机分布完全不同。还要关注错误严重度和人工恢复成本。质量决策通常不是单一分数排序，而是多维证据与业务优先级的结合。\n\n## 成功定义需要防止投机\n\n如果只奖励用户点赞，系统可能更迎合；只看回答率，系统可能减少合理拒答；只看完成速度，系统可能省略验证。指标会影响团队优化方向，因此需要考虑是否存在看似提升、实际伤害任务的捷径。\n\n可以同时观察正确拒答、错误拒答、无依据回答和用户后续行为。Agent任务还应区分“宣称成功”与“验证成功”。结果由可信系统状态或明确产物证明，避免模型通过一段自信回复满足表面指标。\n\n## 产品需求中的指标契约\n\n指标定义应写清分母、样本范围、判定规则、数据来源、时间窗口和责任人。比如“任务成功率”是否包含用户取消、外部服务故障和人工接管，需要一致约定。不同口径无法直接比较，也容易在汇报中产生误解。\n\n上线前可以建立基线，说明当前人工流程或旧版本表现；上线后再连接使用、留存和成本。技术质量改善只有在真实任务中产生价值，才值得持续投入。产品经理应把评估当作设计的一部分，尽早确定系统要证明什么，而不是完成后才寻找有利数字。\n\n## 指标与服务质量共同管理\n\n内容正确但响应过慢，用户可能放弃；服务在线但总给无用答案，也不能视为可靠。可以分别定义可用性、延迟与内容质量，再观察它们的组合。某个指标达到目标不代表所有能力达标，应保留不同维度的限制和适用条件。\n\n## 补充的判断方法\n\n指标之间有时存在真实冲突。系统更保守可能减少无依据回答，却增加错误拒答；允许更多自主执行可能减少人工操作，却放大单次错误影响。产品经理需要明确当前阶段优先保护什么，并用护栏限制代价。不能把所有指标都写成“越高越好”，而应说明取舍和适用范围。评价标准也要随用户任务演进，定期检查指标是否仍代表真实价值。\n\n## 资料与延伸阅读\n\n- [Anthropic：Agent评估结构与评判方式](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n- [Google SRE：从用户关切定义服务指标](https://sre.google/sre-book/service-level-objectives/)\n\n资料核验：2026-11-14。客服和样本数字为教学构造，不是行业标准或实际业务表现。\n","chars":1438,"minutes":6,"summary":"“回答更准确”不足以指导产品建设。AI质量指标需要从用户任务出发，连接业务价值、系统行为与不可接受风险。模型基准可以帮助了解能力，却不能直接证明一个具体产品能让用户完成工作。"},{"id":"11-02","title":"评测集、基线与代表性","file":"content/11-02.md","level":"工作应用","prerequisites":["11-01"],"aliases":["evals","评测","LLM judge","A/B"],"module":"11","moduleTitle":"评估与实验","html":"<p>评测集是一组有明确判定依据的任务样本，用来比较系统表现。它不是随手收集的一些好回答，也不能只由团队最熟悉的问题组成。样本覆盖什么，评估结论就主要能支持什么范围。<\/p><h2 id=\"section-1\">样本从哪里来<\/h2><p>可以使用脱敏真实请求、用户访谈中的典型任务、业务规则边界、历史失败和人工构造挑战。真实数据更接近使用分布，构造数据有助于覆盖罕见高风险情况。两者应标明来源，不能把刻意困难的挑战集结果直接当作全部线上用户的平均体验。<\/p><p>教学构造：企业知识助手有政策查询、跨文档比较、无答案问题和权限问题。若评测集只有简单政策查询，无法证明系统擅长跨文档或安全处理。可以按任务类别、复杂度、语言、文档类型和风险建立覆盖表，发现空白后再补样本。<\/p><h2 id=\"section-2\">一条样本需要什么<\/h2><p>通常包括输入、必要上下文、数据与权限状态、预期行为和判定依据。开放任务不一定需要唯一标准句子，可以提供关键事实、允许范围与不可接受错误。Agent任务还需要初始环境、可用工具和最终状态要求，确保重复运行时条件可比。<\/p><p>资料会更新，因此样本也需要版本和有效日期。某个政策答案昨天正确，今天可能失效。若不维护，系统改用新资料反而可能被旧评测误判。评测集本身是一种产品资产，需要负责人、变更记录和失效管理。<\/p><h2 id=\"section-3\">基线的作用<\/h2><p>基线可以是人工流程、旧系统、简单提示、单模型或固定工作流。它提供改善参照，也帮助判断复杂方案是否值得。多Agent系统看似强大，若与简单基线在相同条件下没有实际收益，架构复杂度就需要重新论证。<\/p><p>比较应尽量保持输入、资料、环境、预算和判定一致。若新方案使用更多数据或更高预算，需要明确说明，否则无法知道差异来自什么。某些场景也应比较不同成本档位下的效果，而不是只比较一次最高配置运行。<\/p><h2 id=\"section-4\">防止过拟合与泄漏<\/h2><p>团队反复查看同一批样本并调整提示，可能只学会这些题的特征。可以区分用于开发的样本、保留验证样本和持续新增线上样本。公开基准也可能进入模型训练数据，结果不一定代表对新业务的泛化能力。<\/p><p>评测输入不应意外包含答案或目标状态。例如把人工结论直接放进检索上下文，再声称系统独立分析成功。数据划分还需按用户、时间或业务对象避免近重复泄漏，具体方式取决于任务。一个高分必须能解释样本如何获得与隔离。<\/p><h2 id=\"section-5\">代表性与风险覆盖的平衡<\/h2><p>可以同时维护贴近线上比例的代表集和针对安全、长尾的挑战集。前者估计总体体验，后者寻找不可接受弱点。两组结果分别报告，不强行合成一个看似精确的总分。对高风险失败，即使出现频率低，也可能形成发布阻断。<\/p><p>样本数量不是唯一质量标准。少量清楚定义的样本可以先发现明显问题，随着产品成熟再扩充；但小样本差异应保留不确定性。产品经理应关注覆盖与判定质量，避免只用“大规模评测”这个名称替代方法说明。<\/p><h2 id=\"section-6\">补充的判断方法<\/h2><p>重复运行的样本还应有初始状态清单。测试订单是否已存在、账户是否有权限、文件是否已被修改，都可能影响结果。若第二次运行直接使用第一次留下的成果，会高估系统能力。相反，测试数据完全脱离现实也会低估或误估某些能力。环境重置、样本版本和真实限制应同时记录，结论才能被其他团队复查与复现。<\/p><h2 id=\"section-7\">延伸的工作判断<\/h2><p>样本中还应记录允许使用的外部信息。如果某任务要求仅依据给定文件，系统借助网络找到正确答案仍可能违反任务边界。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：能力评估与回归评估<\/a><\/li><li><a href=\"https://www.itl.nist.gov/div898/handbook/prc/section2/prc241.htm\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：比例估计与置信区间<\/a><\/li><\/ul><p>资料核验：2026-11-14。知识助手类别为教学构造；评测范围应随真实产品分布持续更新。<\/p>","toc":[{"id":"section-1","title":"样本从哪里来","level":2},{"id":"section-2","title":"一条样本需要什么","level":2},{"id":"section-3","title":"基线的作用","level":2},{"id":"section-4","title":"防止过拟合与泄漏","level":2},{"id":"section-5","title":"代表性与风险覆盖的平衡","level":2},{"id":"section-6","title":"补充的判断方法","level":2},{"id":"section-7","title":"延伸的工作判断","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"评测集是一组有明确判定依据的任务样本，用来比较系统表现。它不是随手收集的一些好回答，也不能只由团队最熟悉的问题组成。样本覆盖什么，评估结论就主要能支持什么范围。\n\n## 样本从哪里来\n\n可以使用脱敏真实请求、用户访谈中的典型任务、业务规则边界、历史失败和人工构造挑战。真实数据更接近使用分布，构造数据有助于覆盖罕见高风险情况。两者应标明来源，不能把刻意困难的挑战集结果直接当作全部线上用户的平均体验。\n\n教学构造：企业知识助手有政策查询、跨文档比较、无答案问题和权限问题。若评测集只有简单政策查询，无法证明系统擅长跨文档或安全处理。可以按任务类别、复杂度、语言、文档类型和风险建立覆盖表，发现空白后再补样本。\n\n## 一条样本需要什么\n\n通常包括输入、必要上下文、数据与权限状态、预期行为和判定依据。开放任务不一定需要唯一标准句子，可以提供关键事实、允许范围与不可接受错误。Agent任务还需要初始环境、可用工具和最终状态要求，确保重复运行时条件可比。\n\n资料会更新，因此样本也需要版本和有效日期。某个政策答案昨天正确，今天可能失效。若不维护，系统改用新资料反而可能被旧评测误判。评测集本身是一种产品资产，需要负责人、变更记录和失效管理。\n\n## 基线的作用\n\n基线可以是人工流程、旧系统、简单提示、单模型或固定工作流。它提供改善参照，也帮助判断复杂方案是否值得。多Agent系统看似强大，若与简单基线在相同条件下没有实际收益，架构复杂度就需要重新论证。\n\n比较应尽量保持输入、资料、环境、预算和判定一致。若新方案使用更多数据或更高预算，需要明确说明，否则无法知道差异来自什么。某些场景也应比较不同成本档位下的效果，而不是只比较一次最高配置运行。\n\n## 防止过拟合与泄漏\n\n团队反复查看同一批样本并调整提示，可能只学会这些题的特征。可以区分用于开发的样本、保留验证样本和持续新增线上样本。公开基准也可能进入模型训练数据，结果不一定代表对新业务的泛化能力。\n\n评测输入不应意外包含答案或目标状态。例如把人工结论直接放进检索上下文，再声称系统独立分析成功。数据划分还需按用户、时间或业务对象避免近重复泄漏，具体方式取决于任务。一个高分必须能解释样本如何获得与隔离。\n\n## 代表性与风险覆盖的平衡\n\n可以同时维护贴近线上比例的代表集和针对安全、长尾的挑战集。前者估计总体体验，后者寻找不可接受弱点。两组结果分别报告，不强行合成一个看似精确的总分。对高风险失败，即使出现频率低，也可能形成发布阻断。\n\n样本数量不是唯一质量标准。少量清楚定义的样本可以先发现明显问题，随着产品成熟再扩充；但小样本差异应保留不确定性。产品经理应关注覆盖与判定质量，避免只用“大规模评测”这个名称替代方法说明。\n\n## 补充的判断方法\n\n重复运行的样本还应有初始状态清单。测试订单是否已存在、账户是否有权限、文件是否已被修改，都可能影响结果。若第二次运行直接使用第一次留下的成果，会高估系统能力。相反，测试数据完全脱离现实也会低估或误估某些能力。环境重置、样本版本和真实限制应同时记录，结论才能被其他团队复查与复现。\n\n## 延伸的工作判断\n\n样本中还应记录允许使用的外部信息。如果某任务要求仅依据给定文件，系统借助网络找到正确答案仍可能违反任务边界。\n\n## 资料与延伸阅读\n\n- [Anthropic：能力评估与回归评估](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n- [NIST：比例估计与置信区间](https://www.itl.nist.gov/div898/handbook/prc/section2/prc241.htm)\n\n资料核验：2026-11-14。知识助手类别为教学构造；评测范围应随真实产品分布持续更新。\n","chars":1243,"minutes":5,"summary":"评测集是一组有明确判定依据的任务样本，用来比较系统表现。它不是随手收集的一些好回答，也不能只由团队最熟悉的问题组成。样本覆盖什么，评估结论就主要能支持什么范围。"},{"id":"11-03","title":"人工评审、量表与一致性","file":"content/11-03.md","level":"工作应用","prerequisites":["11-02"],"aliases":["evals","评测","LLM judge","A/B"],"module":"11","moduleTitle":"评估与实验","html":"<p>开放式AI输出常需要人工判断。人工评审并非天然客观：评审者可能理解标准不同、偏好不同，或被语气和格式影响。量表、标注流程与一致性分析帮助团队把个人感觉转为可讨论的质量证据。<\/p><h2 id=\"section-1\">先定义评什么<\/h2><p>可以将正确性、完整性、引用支持、表达和安全分别评价，避免一个总分掩盖缺陷。每个维度需要描述等级的实际含义，并提供边界案例。比如“部分正确”应说明哪些遗漏仍可接受，哪些关键错误必须判失败，而不是只给一到五分。<\/p><p>教学构造：研究摘要事实准确，但遗漏用户要求的一个竞争对手。它的事实性可以较好，任务完整性却失败。若只打整体印象分，流畅表达可能掩盖遗漏。拆分维度有助于指出改进位置，也让不同模型的优势更清楚。<\/p><h2 id=\"section-2\">绝对评分与成对比较<\/h2><p>绝对评分适合判断是否达到标准，成对比较适合选择哪个结果更符合任务。成对比较也需要允许平局、两者都不合格或无法判断，避免强迫产生没有意义的赢家。评分方式应与决策目的对应：发布准入和候选排序不是同一问题。<\/p><p>展示顺序、模型名称和样式可能影响判断。可以隐藏来源、随机顺序、统一必要格式，但不应为了统一而删除真正重要的信息。评审者最好能看到任务与必要证据，而不是只读一段脱离上下文的答案。<\/p><h2 id=\"section-3\">评审者需要哪些背景<\/h2><p>业务正确性可能需要领域专家，普通用户更适合评价可理解性和使用体验。一个人不必评价所有维度。对于合同、设备操作等专业内容，要明确谁具备判断资格，无法核实应允许标记未知，而不是让评审者凭常识猜测。<\/p><p>正式评审前可以用一批样本讨论标准，识别歧义并修订量表。量表修订后应考虑旧结果是否仍可比。若团队一直通过口头解释补充规则，却没有写入文档，新评审者就很难保持一致。<\/p><h2 id=\"section-4\">一致性意味着什么<\/h2><p>可以观察不同评审者对同一样本的同意程度，并分析分歧类型。高一致性不自动保证正确，可能所有人共享同一个误解；低一致性则可能说明标准模糊、任务确有主观性或资料不足。统计指标需要结合具体分歧阅读，不能单凭一个数决定评审质量。<\/p><p>重要分歧可以由第三方裁决或回到原始证据讨论。保留初始评分与最终结论，有助于理解标准演进。若总是由某个资深成员口头决定，却不更新依据，团队依赖仍然没有减少。<\/p><h2 id=\"section-5\">成本与抽样<\/h2><p>人工评审成本高，可以按风险、任务类别和自动评估不确定性抽样。关键事实与高影响行为需要更严格覆盖，格式错误等可用规则检查。模型裁判可以辅助扩大范围，但需要人工校准，并保留其偏差与限制。<\/p><p>产品经理应把量表与用户价值连接，避免评价者奖励“像专业报告”却忽略任务是否完成。评审记录还应控制敏感资料访问和保存。人工评价是一套可维护流程，不是临时拉几位同事看答案后给出一句“感觉不错”。<\/p><h2 id=\"section-6\">补充的判断方法<\/h2><p>分歧案例尤其值得保留。例如两位评审分别认为“缺一个条件仍可使用”和“可能误导用户必须失败”，它反映的是风险容忍度差异。产品负责人应回到用户任务确定标准，而不是简单取平均。对于确实主观的审美和语气，可以保留分布和人群差异。把所有意见压成一个统一分数，反而会丢掉重要信息。评审过程也应避免让模型名称或团队归属影响结论。<\/p><h2 id=\"section-7\">延伸的工作判断<\/h2><p>评审者疲劳也会影响结果，可以控制单次工作量并设置必要复核。人工判断的生产流程同样需要质量管理。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：代码、模型与人工评判方式<\/a><\/li><li><a href=\"https://arxiv.org/abs/2306.05685\" target=\"_blank\" rel=\"noopener noreferrer\">MT-Bench原论文：人类偏好与模型裁判研究<\/a><\/li><\/ul><p>资料核验：2026-11-14。研究摘要情境为教学构造；量表与一致性方法应按任务选择。<\/p>","toc":[{"id":"section-1","title":"先定义评什么","level":2},{"id":"section-2","title":"绝对评分与成对比较","level":2},{"id":"section-3","title":"评审者需要哪些背景","level":2},{"id":"section-4","title":"一致性意味着什么","level":2},{"id":"section-5","title":"成本与抽样","level":2},{"id":"section-6","title":"补充的判断方法","level":2},{"id":"section-7","title":"延伸的工作判断","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"开放式AI输出常需要人工判断。人工评审并非天然客观：评审者可能理解标准不同、偏好不同，或被语气和格式影响。量表、标注流程与一致性分析帮助团队把个人感觉转为可讨论的质量证据。\n\n## 先定义评什么\n\n可以将正确性、完整性、引用支持、表达和安全分别评价，避免一个总分掩盖缺陷。每个维度需要描述等级的实际含义，并提供边界案例。比如“部分正确”应说明哪些遗漏仍可接受，哪些关键错误必须判失败，而不是只给一到五分。\n\n教学构造：研究摘要事实准确，但遗漏用户要求的一个竞争对手。它的事实性可以较好，任务完整性却失败。若只打整体印象分，流畅表达可能掩盖遗漏。拆分维度有助于指出改进位置，也让不同模型的优势更清楚。\n\n## 绝对评分与成对比较\n\n绝对评分适合判断是否达到标准，成对比较适合选择哪个结果更符合任务。成对比较也需要允许平局、两者都不合格或无法判断，避免强迫产生没有意义的赢家。评分方式应与决策目的对应：发布准入和候选排序不是同一问题。\n\n展示顺序、模型名称和样式可能影响判断。可以隐藏来源、随机顺序、统一必要格式，但不应为了统一而删除真正重要的信息。评审者最好能看到任务与必要证据，而不是只读一段脱离上下文的答案。\n\n## 评审者需要哪些背景\n\n业务正确性可能需要领域专家，普通用户更适合评价可理解性和使用体验。一个人不必评价所有维度。对于合同、设备操作等专业内容，要明确谁具备判断资格，无法核实应允许标记未知，而不是让评审者凭常识猜测。\n\n正式评审前可以用一批样本讨论标准，识别歧义并修订量表。量表修订后应考虑旧结果是否仍可比。若团队一直通过口头解释补充规则，却没有写入文档，新评审者就很难保持一致。\n\n## 一致性意味着什么\n\n可以观察不同评审者对同一样本的同意程度，并分析分歧类型。高一致性不自动保证正确，可能所有人共享同一个误解；低一致性则可能说明标准模糊、任务确有主观性或资料不足。统计指标需要结合具体分歧阅读，不能单凭一个数决定评审质量。\n\n重要分歧可以由第三方裁决或回到原始证据讨论。保留初始评分与最终结论，有助于理解标准演进。若总是由某个资深成员口头决定，却不更新依据，团队依赖仍然没有减少。\n\n## 成本与抽样\n\n人工评审成本高，可以按风险、任务类别和自动评估不确定性抽样。关键事实与高影响行为需要更严格覆盖，格式错误等可用规则检查。模型裁判可以辅助扩大范围，但需要人工校准，并保留其偏差与限制。\n\n产品经理应把量表与用户价值连接，避免评价者奖励“像专业报告”却忽略任务是否完成。评审记录还应控制敏感资料访问和保存。人工评价是一套可维护流程，不是临时拉几位同事看答案后给出一句“感觉不错”。\n\n## 补充的判断方法\n\n分歧案例尤其值得保留。例如两位评审分别认为“缺一个条件仍可使用”和“可能误导用户必须失败”，它反映的是风险容忍度差异。产品负责人应回到用户任务确定标准，而不是简单取平均。对于确实主观的审美和语气，可以保留分布和人群差异。把所有意见压成一个统一分数，反而会丢掉重要信息。评审过程也应避免让模型名称或团队归属影响结论。\n\n## 延伸的工作判断\n\n评审者疲劳也会影响结果，可以控制单次工作量并设置必要复核。人工判断的生产流程同样需要质量管理。\n\n## 资料与延伸阅读\n\n- [Anthropic：代码、模型与人工评判方式](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n- [MT-Bench原论文：人类偏好与模型裁判研究](https://arxiv.org/abs/2306.05685)\n\n资料核验：2026-11-14。研究摘要情境为教学构造；量表与一致性方法应按任务选择。\n","chars":1229,"minutes":5,"summary":"开放式AI输出常需要人工判断。人工评审并非天然客观：评审者可能理解标准不同、偏好不同，或被语气和格式影响。量表、标注流程与一致性分析帮助团队把个人感觉转为可讨论的质量证据。"},{"id":"11-04","title":"模型裁判：校准、偏差与限制","file":"content/11-04.md","level":"深入阅读","prerequisites":["11-03"],"aliases":["evals","评测","LLM judge","A/B"],"module":"11","moduleTitle":"评估与实验","html":"<p>模型裁判使用一个模型评价另一个系统的输出，可以降低部分开放任务的评估成本。它的结果仍然是模型判断，需要标准、证据和人工校准。不能因为裁判模型更强，就把分数视为客观真值。<\/p><h2 id=\"section-1\">裁判需要看到什么<\/h2><p>通常包括用户任务、必要上下文、候选结果、评价量表与参考资料。某些维度需要标准答案或证据，另一些可以评价表达和任务覆盖。裁判提示应明确判断什么、如何处理未知与冲突，并要求输出可解析结果及支持判断的证据摘要。<\/p><p>不应让裁判在缺少资料时凭自身知识评价公司私有事实。教学构造：裁判没有当前报销制度，却根据常见公司规则把正确答案判错。解决方向是提供权威资料与明确标准，而不是只换一个参数更多的裁判模型。<\/p><h2 id=\"section-2\">常见偏差<\/h2><p>研究发现过位置偏差、冗长偏好和自我偏好等问题。裁判可能偏爱排在前面的答案，或把更长、更自信的表达当作更好。它也可能在复杂推理上犯错，无法发现表面流畅答案中的细节问题。不同模型和任务的偏差程度需要实际测量。<\/p><p>可以随机或交换候选顺序、限制无关格式影响、分别评价维度，并抽样人工复核。交换顺序后结论变化，说明判断不稳定；但即使结论一致，也不能证明事实正确。缓解手段降低部分偏差，不会消除全部限制。<\/p><h2 id=\"section-3\">校准而非盲目信任<\/h2><p>先建立一批人工确认样本，比较模型裁判与人工判断在哪些类别一致、哪些类别分歧。尤其关注高风险错误是否被漏判。一个总体一致率可能掩盖少数严重问题，应该按任务和错误类型分层分析。<\/p><p>裁判模型、提示或量表更新后，校准结果可能失效。需要保留版本和重新比较，避免评分上涨只是裁判变宽松。被评系统也不宜针对固定裁判措辞过度优化，否则可能学会取悦裁判，而非满足用户。<\/p><h2 id=\"section-4\">规则、代码和模型的组合<\/h2><p>格式、字段存在、数值计算和外部状态可以优先使用确定性检查；事实支持和开放表达可以使用模型辅助；关键业务结论保留人工复核。不同评判方式负责自己擅长的部分，比让一个裁判一次给总分更可解释。<\/p><p>Agent还需要检查过程和环境。最终回复说“邮件已发送”，裁判只读文字可能判成功，但真实邮件系统未执行。应通过可信状态或工具记录判断动作结果，模型可以辅助解释过程，却不能替代执行证据。<\/p><h2 id=\"section-5\">裁判自身的安全与成本<\/h2><p>被评价内容可能包含提示注入，试图要求裁判给高分。裁判应将候选文本视为待评价资料，而非指令。敏感输入发送给外部裁判模型也构成数据流，需要符合权限和保留要求。扩大评估规模前，应考虑费用、延迟和数据边界。<\/p><p>产品经理应能够解释裁判分数能支持什么决策，不能证明什么。适合的用法是帮助筛查、比较和发现问题，再与人工、规则和线上证据组合。自动化评估越广泛，越需要清楚的校准与版本管理，避免把大批自动分数误认为高质量证据。<\/p><h2 id=\"section-6\">补充的判断方法<\/h2><p>裁判的解释同样需要核查。它可能给出听起来合理但与候选内容不符的理由，因此最好要求指出具体问题位置或引用支持片段。多个裁判投票可以发现分歧，却不自动构成独立证据，尤其使用相近模型时。对临界发布决策，应重点人工复查分歧与严重错误，而不是仅增加调用次数取得一个稳定平均分。<\/p><h2 id=\"section-7\">延伸的工作判断<\/h2><p>在评估报告中，应说明哪些维度由模型裁判、哪些由规则或人工确认，并保留校准样本范围，避免自动分数被误读为全部事实已验证。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/2306.05685\" target=\"_blank\" rel=\"noopener noreferrer\">原论文：Judging LLM-as-a-Judge<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：模型评判及其适用场景<\/a><\/li><\/ul><p>资料核验：2026-11-14。报销例子为教学构造；原论文在特定条件下的结果不代表任意裁判都可靠。<\/p>","toc":[{"id":"section-1","title":"裁判需要看到什么","level":2},{"id":"section-2","title":"常见偏差","level":2},{"id":"section-3","title":"校准而非盲目信任","level":2},{"id":"section-4","title":"规则、代码和模型的组合","level":2},{"id":"section-5","title":"裁判自身的安全与成本","level":2},{"id":"section-6","title":"补充的判断方法","level":2},{"id":"section-7","title":"延伸的工作判断","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"模型裁判使用一个模型评价另一个系统的输出，可以降低部分开放任务的评估成本。它的结果仍然是模型判断，需要标准、证据和人工校准。不能因为裁判模型更强，就把分数视为客观真值。\n\n## 裁判需要看到什么\n\n通常包括用户任务、必要上下文、候选结果、评价量表与参考资料。某些维度需要标准答案或证据，另一些可以评价表达和任务覆盖。裁判提示应明确判断什么、如何处理未知与冲突，并要求输出可解析结果及支持判断的证据摘要。\n\n不应让裁判在缺少资料时凭自身知识评价公司私有事实。教学构造：裁判没有当前报销制度，却根据常见公司规则把正确答案判错。解决方向是提供权威资料与明确标准，而不是只换一个参数更多的裁判模型。\n\n## 常见偏差\n\n研究发现过位置偏差、冗长偏好和自我偏好等问题。裁判可能偏爱排在前面的答案，或把更长、更自信的表达当作更好。它也可能在复杂推理上犯错，无法发现表面流畅答案中的细节问题。不同模型和任务的偏差程度需要实际测量。\n\n可以随机或交换候选顺序、限制无关格式影响、分别评价维度，并抽样人工复核。交换顺序后结论变化，说明判断不稳定；但即使结论一致，也不能证明事实正确。缓解手段降低部分偏差，不会消除全部限制。\n\n## 校准而非盲目信任\n\n先建立一批人工确认样本，比较模型裁判与人工判断在哪些类别一致、哪些类别分歧。尤其关注高风险错误是否被漏判。一个总体一致率可能掩盖少数严重问题，应该按任务和错误类型分层分析。\n\n裁判模型、提示或量表更新后，校准结果可能失效。需要保留版本和重新比较，避免评分上涨只是裁判变宽松。被评系统也不宜针对固定裁判措辞过度优化，否则可能学会取悦裁判，而非满足用户。\n\n## 规则、代码和模型的组合\n\n格式、字段存在、数值计算和外部状态可以优先使用确定性检查；事实支持和开放表达可以使用模型辅助；关键业务结论保留人工复核。不同评判方式负责自己擅长的部分，比让一个裁判一次给总分更可解释。\n\nAgent还需要检查过程和环境。最终回复说“邮件已发送”，裁判只读文字可能判成功，但真实邮件系统未执行。应通过可信状态或工具记录判断动作结果，模型可以辅助解释过程，却不能替代执行证据。\n\n## 裁判自身的安全与成本\n\n被评价内容可能包含提示注入，试图要求裁判给高分。裁判应将候选文本视为待评价资料，而非指令。敏感输入发送给外部裁判模型也构成数据流，需要符合权限和保留要求。扩大评估规模前，应考虑费用、延迟和数据边界。\n\n产品经理应能够解释裁判分数能支持什么决策，不能证明什么。适合的用法是帮助筛查、比较和发现问题，再与人工、规则和线上证据组合。自动化评估越广泛，越需要清楚的校准与版本管理，避免把大批自动分数误认为高质量证据。\n\n## 补充的判断方法\n\n裁判的解释同样需要核查。它可能给出听起来合理但与候选内容不符的理由，因此最好要求指出具体问题位置或引用支持片段。多个裁判投票可以发现分歧，却不自动构成独立证据，尤其使用相近模型时。对临界发布决策，应重点人工复查分歧与严重错误，而不是仅增加调用次数取得一个稳定平均分。\n\n## 延伸的工作判断\n\n在评估报告中，应说明哪些维度由模型裁判、哪些由规则或人工确认，并保留校准样本范围，避免自动分数被误读为全部事实已验证。\n\n## 资料与延伸阅读\n\n- [原论文：Judging LLM-as-a-Judge](https://arxiv.org/abs/2306.05685)\n- [Anthropic：模型评判及其适用场景](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n\n资料核验：2026-11-14。报销例子为教学构造；原论文在特定条件下的结果不代表任意裁判都可靠。\n","chars":1225,"minutes":5,"summary":"模型裁判使用一个模型评价另一个系统的输出，可以降低部分开放任务的评估成本。它的结果仍然是模型判断，需要标准、证据和人工校准。不能因为裁判模型更强，就把分数视为客观真值。"},{"id":"11-05","title":"RAG、工具与 Agent 的专项评估","file":"content/11-05.md","level":"工作应用","prerequisites":["11-04"],"aliases":["evals","评测","LLM judge","A/B"],"module":"11","moduleTitle":"评估与实验","html":"<p>RAG、工具调用和Agent有不同的失败结构，因此专项评估需要分别检查证据、动作和最终任务。只给最终文字打分，会漏掉检索错误、越权与重复执行；只看工具调用成功，又无法判断用户目标是否真正完成。<\/p><h2 id=\"section-1\">RAG：证据与答案分层<\/h2><p>先检查所需资料是否存在、正确证据是否被召回、是否进入上下文，再看回答是否忠实、完整并正确引用。无答案问题需要评价合理拒答，权限问题需要确认不该出现的内容没有泄露。检索指标和最终答案指标应分别保存，便于定位改进方向。<\/p><p>教学构造：模型回答政策金额正确，却引用了旧文档。事实性可能暂时通过，但版本与可追溯性不合格。另一答案引用正确却遗漏适用条件，也不能判完整成功。专项评价使这些差异不会被一个总分掩盖。<\/p><h2 id=\"section-2\">工具：选择、参数与执行<\/h2><p>工具评估可以检查是否选对工具、参数是否准确、必要前提是否满足、权限是否正确，以及返回错误后如何处理。格式正确不代表业务语义正确，工具返回成功也可能只是受理请求。执行验证应回到真实对象状态或可信测试环境。<\/p><p>写入动作还需检查重复、幂等、取消与部分失败。一次任务最终成功，却多发了一封邮件，也应记录过程错误。安全评估不能只关注模型是否说出危险内容，还要关注它是否实际触发不允许的动作。<\/p><h2 id=\"section-3\">Agent：任务、轨迹与环境<\/h2><p>任务评估关心最终产物或状态是否满足目标；轨迹评估关心执行是否遵守约束、是否高效、是否出现风险。并不要求每次都走唯一固定路径，开放任务可以有多种合理方法。标准应约束必要行为与不可接受行为，避免把某种参考操作序列当成唯一正确答案。<\/p><p>Agent具有随机性，可以对同一任务运行多次观察稳定性。一次成功说明存在可行路径，不代表用户每次使用都成功。重复运行应保留相同环境与预算，必要时在每次后重置外部状态，避免前一次结果污染下一次。<\/p><h2 id=\"section-4\">环境与评判工具的限制<\/h2><p>测试环境需要足够接近真实任务，同时控制副作用。模拟服务便于重复，却可能省略真实错误、权限和延迟；真实环境更有代表性，却更难重置和保护。结果应明确环境范围，不能把理想模拟中的高分直接作为生产承诺。<\/p><p>评判器也可能漏检。例如只检查文件存在，不检查内容；只检查页面文本，不检查后台状态；只检查最终数据库值，不发现中途泄露。评价设计需要从业务风险倒推证据，确认每个检查真正覆盖了相关要求。<\/p><h2 id=\"section-5\">指标组合与决策<\/h2><p>可以同时报告任务成功、关键约束违反、人工接管、步骤数、延迟和成功任务成本。效率指标应在质量可接受前提下解释，少走步骤但省略必要验证不算改进。重大安全问题可以作为独立阻断条件，而非让高平均成功率抵消。<\/p><p>产品经理应与研发和业务共同定义任务、环境、判定和失败分类。专项评估的价值是解释系统为什么成功或失败，再指导数据、工具、模型与流程的改进。它是AI产品核心知识，与学习者是否做题无关，应在知识库中深入保留。<\/p><h2 id=\"section-6\">补充的判断方法<\/h2><p>重复运行可以产生不同统计口径。例如某任务五次中至少成功一次，说明存在成功路径；五次全部成功，则更接近稳定性要求。两者不能混用，也不能把一次最好的结果当作用户每次体验。报告应说明运行次数、环境、预算和聚合方式。对于实际使用，用户通常只经历其中一次，因此稳定成功和失败恢复往往比偶尔达到很高上限更重要。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：不同Agent类型的评估方法<\/a><\/li><li><a href=\"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：RAG系统挑战<\/a><\/li><\/ul><p>资料核验：2026-11-14。政策情境为教学构造；评估结论仅适用于实际覆盖的任务与环境。<\/p>","toc":[{"id":"section-1","title":"RAG：证据与答案分层","level":2},{"id":"section-2","title":"工具：选择、参数与执行","level":2},{"id":"section-3","title":"Agent：任务、轨迹与环境","level":2},{"id":"section-4","title":"环境与评判工具的限制","level":2},{"id":"section-5","title":"指标组合与决策","level":2},{"id":"section-6","title":"补充的判断方法","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"RAG、工具调用和Agent有不同的失败结构，因此专项评估需要分别检查证据、动作和最终任务。只给最终文字打分，会漏掉检索错误、越权与重复执行；只看工具调用成功，又无法判断用户目标是否真正完成。\n\n## RAG：证据与答案分层\n\n先检查所需资料是否存在、正确证据是否被召回、是否进入上下文，再看回答是否忠实、完整并正确引用。无答案问题需要评价合理拒答，权限问题需要确认不该出现的内容没有泄露。检索指标和最终答案指标应分别保存，便于定位改进方向。\n\n教学构造：模型回答政策金额正确，却引用了旧文档。事实性可能暂时通过，但版本与可追溯性不合格。另一答案引用正确却遗漏适用条件，也不能判完整成功。专项评价使这些差异不会被一个总分掩盖。\n\n## 工具：选择、参数与执行\n\n工具评估可以检查是否选对工具、参数是否准确、必要前提是否满足、权限是否正确，以及返回错误后如何处理。格式正确不代表业务语义正确，工具返回成功也可能只是受理请求。执行验证应回到真实对象状态或可信测试环境。\n\n写入动作还需检查重复、幂等、取消与部分失败。一次任务最终成功，却多发了一封邮件，也应记录过程错误。安全评估不能只关注模型是否说出危险内容，还要关注它是否实际触发不允许的动作。\n\n## Agent：任务、轨迹与环境\n\n任务评估关心最终产物或状态是否满足目标；轨迹评估关心执行是否遵守约束、是否高效、是否出现风险。并不要求每次都走唯一固定路径，开放任务可以有多种合理方法。标准应约束必要行为与不可接受行为，避免把某种参考操作序列当成唯一正确答案。\n\nAgent具有随机性，可以对同一任务运行多次观察稳定性。一次成功说明存在可行路径，不代表用户每次使用都成功。重复运行应保留相同环境与预算，必要时在每次后重置外部状态，避免前一次结果污染下一次。\n\n## 环境与评判工具的限制\n\n测试环境需要足够接近真实任务，同时控制副作用。模拟服务便于重复，却可能省略真实错误、权限和延迟；真实环境更有代表性，却更难重置和保护。结果应明确环境范围，不能把理想模拟中的高分直接作为生产承诺。\n\n评判器也可能漏检。例如只检查文件存在，不检查内容；只检查页面文本，不检查后台状态；只检查最终数据库值，不发现中途泄露。评价设计需要从业务风险倒推证据，确认每个检查真正覆盖了相关要求。\n\n## 指标组合与决策\n\n可以同时报告任务成功、关键约束违反、人工接管、步骤数、延迟和成功任务成本。效率指标应在质量可接受前提下解释，少走步骤但省略必要验证不算改进。重大安全问题可以作为独立阻断条件，而非让高平均成功率抵消。\n\n产品经理应与研发和业务共同定义任务、环境、判定和失败分类。专项评估的价值是解释系统为什么成功或失败，再指导数据、工具、模型与流程的改进。它是AI产品核心知识，与学习者是否做题无关，应在知识库中深入保留。\n\n## 补充的判断方法\n\n重复运行可以产生不同统计口径。例如某任务五次中至少成功一次，说明存在成功路径；五次全部成功，则更接近稳定性要求。两者不能混用，也不能把一次最好的结果当作用户每次体验。报告应说明运行次数、环境、预算和聚合方式。对于实际使用，用户通常只经历其中一次，因此稳定成功和失败恢复往往比偶尔达到很高上限更重要。\n\n## 资料与延伸阅读\n\n- [Anthropic：不同Agent类型的评估方法](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n- [Microsoft：RAG系统挑战](https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview)\n\n资料核验：2026-11-14。政策情境为教学构造；评估结论仅适用于实际覆盖的任务与环境。\n","chars":1203,"minutes":5,"summary":"RAG、工具调用和Agent有不同的失败结构，因此专项评估需要分别检查证据、动作和最终任务。只给最终文字打分，会漏掉检索错误、越权与重复执行；只看工具调用成功，又无法判断用户目标是否真正完成。"},{"id":"11-06","title":"线上实验、统计与效果解释","file":"content/11-06.md","level":"工作应用","prerequisites":["11-05"],"aliases":["evals","评测","LLM judge","A/B"],"module":"11","moduleTitle":"评估与实验","html":"<p>离线评估说明系统在一组已知任务中的表现，线上实验则观察真实用户环境中的变化。使用率、任务成功、留存和成本受到多种因素影响，不能看到一个数字上涨就断言由AI改动造成。<\/p><h2 id=\"section-1\">先区分相关与因果<\/h2><p>教学构造：新模型上线后，用户完成率提高，但同一天也简化了注册流程，并增加了营销流量。前后比较无法单独分离这些影响。随机分组在条件允许时可以帮助构造可比对照，控制其他变化，但实验仍需要正确分流、埋点和指标定义。<\/p><p>分组单位可能是用户、组织或任务。企业协作场景中，同一组织成员可能互相影响，按单次请求随机切换也可能造成体验混乱。选择需要考虑干扰、长期效应和实际使用方式，不能机械地把传统按钮实验方法套到所有Agent产品。<\/p><h2 id=\"section-2\">主指标与护栏提前确定<\/h2><p>可以选择任务成功、有效解决或完成时间为主指标，同时观察安全、投诉、成本和延迟护栏。实验开始前说明分母、时间窗口、样本范围和停止条件，能减少看到结果后临时挑选有利指标的偏差。多个指标反复比较也会增加偶然发现的机会。<\/p><p>还要验证分流与埋点本身。用户是否真的接触新方案、两组流量比例是否异常、失败事件是否漏记，都可能让结果失真。技术故障造成的缺失不能简单当作无影响数据，数据质量需要与模型质量一起核对。<\/p><h2 id=\"section-3\">样本量与不确定性<\/h2><p>观察到的比例只是样本估计。以下为教学构造：十次任务中成功九次，与一千次中成功九百次，点估计都为九成，但不确定性不同。在频率学派解释下，真实总体成功率视为固定而未知。若反复按相同方法抽样并计算区间，95%置信水平表示这些区间约有95%覆盖真实值；它不是对已经得到的某一个区间赋予95%的后验概率。解释依赖抽样与方法假设。<\/p><p>采用Wilson比例区间作教学计算，9/10的95%区间约为59.6%—98.2%，900/1000约为88.0%—91.7%。更大的样本使随机不确定性较小，但若一千条都来自不具代表性的简单任务，窄区间仍不能证明复杂任务上的表现。区间、样本构成与业务口径应一起报告。<\/p><p>小样本或极少失败时，简单正态近似可能不合适；可以使用更适合比例的区间方法。产品经理不必手算所有统计公式，但应理解方法假设、样本独立性和实际影响大小。统计显著也不自动代表商业价值足够大。<\/p><h2 id=\"section-4\">避免提前停止与选择偏差<\/h2><p>每天看结果、第一次出现有利差异就停止，会改变误报风险。应采用预先约定的分析计划或合适的序贯方法。实验时间还需要覆盖周期效应，例如工作日与周末、月末报销与普通时段。短期新鲜感也可能不代表长期留存。<\/p><p>无法随机实验时，可以使用其他观察方法，但应明确限制与混杂因素。用户访谈、执行记录和业务反馈能解释现象，却不能自动证明因果。多种证据相互补充，比用一个模糊的“提升百分之多少”更可信。<\/p><h2 id=\"section-5\">AI实验中的特殊问题<\/h2><p>模型更新、资料变化和外部工具故障可能在实验期间改变系统行为。版本需要固定或记录，避免两组条件不断漂移。某个方案成本更高时，要比较额外收益与费用；若自动化让用户少点击，传统点击率可能下降，却不一定是坏事。<\/p><p>产品经理应把统计结果翻译为决策：谁受益、幅度多大、是否稳定、有什么代价，以及还不能确定什么。结论需要匹配证据范围，不能把短期少量用户实验泛化到全部客户和未来使用。<\/p><h2 id=\"section-6\">补充的判断方法<\/h2><p>还要区分百分点与相对增幅。教学构造：成功率从五成到六成，增加十个百分点，相对提高两成；两种说法描述同一变化，但给人的感受不同。汇报应同时交代基线、样本量和区间，不只展示相对百分比。若新增收益集中在少数高频用户，还应检查其他用户是否退化，避免总体平均掩盖分配差异。<\/p><h2 id=\"section-7\">延伸的工作判断<\/h2><p>若实验受到组织间传播或用户自行选择影响，应在结论中标注，而不能继续把两组差异当作完全随机条件下的因果估计。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.itl.nist.gov/div898/handbook/prc/section2/prc241.htm\" target=\"_blank\" rel=\"noopener noreferrer\">NIST：比例置信区间及小样本限制<\/a><\/li><li><a href=\"https://sre.google/workbook/implementing-slos/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE：指标、目标与时间窗口<\/a><\/li><\/ul><p>资料核验：2026-11-14。本文数值为教学构造；统计方法应按实验设计与数据条件选择。<\/p>","toc":[{"id":"section-1","title":"先区分相关与因果","level":2},{"id":"section-2","title":"主指标与护栏提前确定","level":2},{"id":"section-3","title":"样本量与不确定性","level":2},{"id":"section-4","title":"避免提前停止与选择偏差","level":2},{"id":"section-5","title":"AI实验中的特殊问题","level":2},{"id":"section-6","title":"补充的判断方法","level":2},{"id":"section-7","title":"延伸的工作判断","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"离线评估说明系统在一组已知任务中的表现，线上实验则观察真实用户环境中的变化。使用率、任务成功、留存和成本受到多种因素影响，不能看到一个数字上涨就断言由AI改动造成。\n\n## 先区分相关与因果\n\n教学构造：新模型上线后，用户完成率提高，但同一天也简化了注册流程，并增加了营销流量。前后比较无法单独分离这些影响。随机分组在条件允许时可以帮助构造可比对照，控制其他变化，但实验仍需要正确分流、埋点和指标定义。\n\n分组单位可能是用户、组织或任务。企业协作场景中，同一组织成员可能互相影响，按单次请求随机切换也可能造成体验混乱。选择需要考虑干扰、长期效应和实际使用方式，不能机械地把传统按钮实验方法套到所有Agent产品。\n\n## 主指标与护栏提前确定\n\n可以选择任务成功、有效解决或完成时间为主指标，同时观察安全、投诉、成本和延迟护栏。实验开始前说明分母、时间窗口、样本范围和停止条件，能减少看到结果后临时挑选有利指标的偏差。多个指标反复比较也会增加偶然发现的机会。\n\n还要验证分流与埋点本身。用户是否真的接触新方案、两组流量比例是否异常、失败事件是否漏记，都可能让结果失真。技术故障造成的缺失不能简单当作无影响数据，数据质量需要与模型质量一起核对。\n\n## 样本量与不确定性\n\n观察到的比例只是样本估计。以下为教学构造：十次任务中成功九次，与一千次中成功九百次，点估计都为九成，但不确定性不同。在频率学派解释下，真实总体成功率视为固定而未知。若反复按相同方法抽样并计算区间，95%置信水平表示这些区间约有95%覆盖真实值；它不是对已经得到的某一个区间赋予95%的后验概率。解释依赖抽样与方法假设。\n\n采用Wilson比例区间作教学计算，9/10的95%区间约为59.6%—98.2%，900/1000约为88.0%—91.7%。更大的样本使随机不确定性较小，但若一千条都来自不具代表性的简单任务，窄区间仍不能证明复杂任务上的表现。区间、样本构成与业务口径应一起报告。\n\n小样本或极少失败时，简单正态近似可能不合适；可以使用更适合比例的区间方法。产品经理不必手算所有统计公式，但应理解方法假设、样本独立性和实际影响大小。统计显著也不自动代表商业价值足够大。\n\n## 避免提前停止与选择偏差\n\n每天看结果、第一次出现有利差异就停止，会改变误报风险。应采用预先约定的分析计划或合适的序贯方法。实验时间还需要覆盖周期效应，例如工作日与周末、月末报销与普通时段。短期新鲜感也可能不代表长期留存。\n\n无法随机实验时，可以使用其他观察方法，但应明确限制与混杂因素。用户访谈、执行记录和业务反馈能解释现象，却不能自动证明因果。多种证据相互补充，比用一个模糊的“提升百分之多少”更可信。\n\n## AI实验中的特殊问题\n\n模型更新、资料变化和外部工具故障可能在实验期间改变系统行为。版本需要固定或记录，避免两组条件不断漂移。某个方案成本更高时，要比较额外收益与费用；若自动化让用户少点击，传统点击率可能下降，却不一定是坏事。\n\n产品经理应把统计结果翻译为决策：谁受益、幅度多大、是否稳定、有什么代价，以及还不能确定什么。结论需要匹配证据范围，不能把短期少量用户实验泛化到全部客户和未来使用。\n\n## 补充的判断方法\n\n还要区分百分点与相对增幅。教学构造：成功率从五成到六成，增加十个百分点，相对提高两成；两种说法描述同一变化，但给人的感受不同。汇报应同时交代基线、样本量和区间，不只展示相对百分比。若新增收益集中在少数高频用户，还应检查其他用户是否退化，避免总体平均掩盖分配差异。\n\n## 延伸的工作判断\n\n若实验受到组织间传播或用户自行选择影响，应在结论中标注，而不能继续把两组差异当作完全随机条件下的因果估计。\n\n## 资料与延伸阅读\n\n- [NIST：比例置信区间及小样本限制](https://www.itl.nist.gov/div898/handbook/prc/section2/prc241.htm)\n- [Google SRE：指标、目标与时间窗口](https://sre.google/workbook/implementing-slos/)\n\n资料核验：2026-11-14。本文数值为教学构造；统计方法应按实验设计与数据条件选择。\n","chars":1361,"minutes":5,"summary":"离线评估说明系统在一组已知任务中的表现，线上实验则观察真实用户环境中的变化。使用率、任务成功、留存和成本受到多种因素影响，不能看到一个数字上涨就断言由AI改动造成。"},{"id":"11-07","title":"回归评估、版本准入与发布","file":"content/11-07.md","level":"工作应用","prerequisites":["11-06"],"aliases":["evals","评测","LLM judge","A/B"],"module":"11","moduleTitle":"评估与实验","html":"<p>AI系统的提示、模型、工具、数据或检索参数任何一项变化，都可能改善一类任务同时破坏另一类。回归评估用于发现已具备能力是否退化，版本准入与发布机制则把评估结果转为可执行的上线决策。<\/p><h2 id=\"section-1\">能力评估与回归评估<\/h2><p>能力评估探索系统能否完成新的或更难任务，回归评估检查过去重要任务是否保持。两者需要不同样本与阈值。挑战集上提升不能抵消基本功能退化，也不能因为现有回归全部通过就断言新场景已经可靠。<\/p><p>教学构造：新提示让Agent更积极调用工具，复杂任务成功率提高，却在普通咨询时未经请求创建工单。若只评价复杂任务，产品可能错误上线。回归集应包含正常、边界、拒绝、权限和历史事故样本，尤其覆盖不可接受行为。<\/p><h2 id=\"section-2\">版本不只是模型名称<\/h2><p>一个可复现版本通常包括模型、提示、工具契约、代码、检索策略、数据索引与配置。外部服务可能无法完全固定，也应记录其版本或观测时间。缺少这些信息，结果变化就难以归因，事故时也难以恢复到已知状态。<\/p><p>可以使用版本清单关联评估结果、变更说明和发布记录。样本与裁判也要记录版本，否则分数变化可能来自评估标准本身。可重复性不是要求世界永不改变，而是让团队知道哪些条件固定、哪些发生了变化。<\/p><h2 id=\"section-3\">准入条件如何定义<\/h2><p>可以设定关键任务最低表现、重大风险零容忍样本、延迟与成本上限，以及人工复核要求。阈值需基于业务价值与风险，而不是任意选一个漂亮分数。关键规则失败应能阻断发布，不能被大量低风险成功样本平均掉。<\/p><p>统计不确定性也应考虑。小样本的一次改善可能是随机波动，关键任务可以重复运行或扩大样本。对没有覆盖的场景明确限制，必要时先小范围试用。通过离线准入只是上线条件之一，不代表无需线上观察。<\/p><h2 id=\"section-4\">灰度与回滚<\/h2><p>可以先内部用户，再小比例真实流量，逐步扩大。每阶段观察质量、错误、成本、延迟和投诉，明确谁有权暂停。回滚需要恢复合适组件，若工具已经写入业务数据，代码回退不会自动撤销副作用，还需状态核对或补偿。<\/p><p>某些数据更新不能简单回退，例如撤回敏感文档后不应重新启用旧权限。版本恢复必须遵守当前安全与业务要求。产品经理应与工程团队区分技术回滚、资料恢复和业务补偿，避免用一个“可回滚”掩盖不同能力。<\/p><h2 id=\"section-5\">把线上反馈转回资产<\/h2><p>新失败经确认后可以加入回归集，标明原因和修复目标。不是每条用户不满意都直接成为唯一标准，应核对任务、证据和合理性。评测集需要定期清理过时规则，避免历史行为阻碍必要改进。<\/p><p>成熟发布流程能够解释为什么这个版本值得上线、有哪些风险、如何监测和恢复。对AI产品经理而言，这连接质量判断与交付能力，也是从功能负责人走向资深产品角色的重要部分。可靠性来自持续管理，而非一次发布前的大规模演示。<\/p><h2 id=\"section-6\">补充的判断方法<\/h2><p>准入标准需要说明例外如何处理。某个样本失败若确认是旧规则失效，可以更新样本与理由；若只是为了让版本通过而删除难题，就破坏了评估作用。变更应留下可审查记录，并由合适负责人决定。历史事故样本尤其应保留问题背景，让后来成员知道它保护什么风险，而不是把它当作一条莫名其妙的固定答案。<\/p><h2 id=\"section-7\">延伸的工作判断<\/h2><p>发布负责人还应确认监控与回退开关已经可用。评估结果再好，如果异常无法及时发现和止损，仍缺少完整上线条件。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：能力与回归评估及持续使用<\/a><\/li><li><a href=\"https://sre.google/workbook/implementing-slos/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE：服务目标与错误预算<\/a><\/li><\/ul><p>资料核验：2026-11-14。工单情境为教学构造；发布阈值需结合具体任务风险确定。<\/p>","toc":[{"id":"section-1","title":"能力评估与回归评估","level":2},{"id":"section-2","title":"版本不只是模型名称","level":2},{"id":"section-3","title":"准入条件如何定义","level":2},{"id":"section-4","title":"灰度与回滚","level":2},{"id":"section-5","title":"把线上反馈转回资产","level":2},{"id":"section-6","title":"补充的判断方法","level":2},{"id":"section-7","title":"延伸的工作判断","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"AI系统的提示、模型、工具、数据或检索参数任何一项变化，都可能改善一类任务同时破坏另一类。回归评估用于发现已具备能力是否退化，版本准入与发布机制则把评估结果转为可执行的上线决策。\n\n## 能力评估与回归评估\n\n能力评估探索系统能否完成新的或更难任务，回归评估检查过去重要任务是否保持。两者需要不同样本与阈值。挑战集上提升不能抵消基本功能退化，也不能因为现有回归全部通过就断言新场景已经可靠。\n\n教学构造：新提示让Agent更积极调用工具，复杂任务成功率提高，却在普通咨询时未经请求创建工单。若只评价复杂任务，产品可能错误上线。回归集应包含正常、边界、拒绝、权限和历史事故样本，尤其覆盖不可接受行为。\n\n## 版本不只是模型名称\n\n一个可复现版本通常包括模型、提示、工具契约、代码、检索策略、数据索引与配置。外部服务可能无法完全固定，也应记录其版本或观测时间。缺少这些信息，结果变化就难以归因，事故时也难以恢复到已知状态。\n\n可以使用版本清单关联评估结果、变更说明和发布记录。样本与裁判也要记录版本，否则分数变化可能来自评估标准本身。可重复性不是要求世界永不改变，而是让团队知道哪些条件固定、哪些发生了变化。\n\n## 准入条件如何定义\n\n可以设定关键任务最低表现、重大风险零容忍样本、延迟与成本上限，以及人工复核要求。阈值需基于业务价值与风险，而不是任意选一个漂亮分数。关键规则失败应能阻断发布，不能被大量低风险成功样本平均掉。\n\n统计不确定性也应考虑。小样本的一次改善可能是随机波动，关键任务可以重复运行或扩大样本。对没有覆盖的场景明确限制，必要时先小范围试用。通过离线准入只是上线条件之一，不代表无需线上观察。\n\n## 灰度与回滚\n\n可以先内部用户，再小比例真实流量，逐步扩大。每阶段观察质量、错误、成本、延迟和投诉，明确谁有权暂停。回滚需要恢复合适组件，若工具已经写入业务数据，代码回退不会自动撤销副作用，还需状态核对或补偿。\n\n某些数据更新不能简单回退，例如撤回敏感文档后不应重新启用旧权限。版本恢复必须遵守当前安全与业务要求。产品经理应与工程团队区分技术回滚、资料恢复和业务补偿，避免用一个“可回滚”掩盖不同能力。\n\n## 把线上反馈转回资产\n\n新失败经确认后可以加入回归集，标明原因和修复目标。不是每条用户不满意都直接成为唯一标准，应核对任务、证据和合理性。评测集需要定期清理过时规则，避免历史行为阻碍必要改进。\n\n成熟发布流程能够解释为什么这个版本值得上线、有哪些风险、如何监测和恢复。对AI产品经理而言，这连接质量判断与交付能力，也是从功能负责人走向资深产品角色的重要部分。可靠性来自持续管理，而非一次发布前的大规模演示。\n\n## 补充的判断方法\n\n准入标准需要说明例外如何处理。某个样本失败若确认是旧规则失效，可以更新样本与理由；若只是为了让版本通过而删除难题，就破坏了评估作用。变更应留下可审查记录，并由合适负责人决定。历史事故样本尤其应保留问题背景，让后来成员知道它保护什么风险，而不是把它当作一条莫名其妙的固定答案。\n\n## 延伸的工作判断\n\n发布负责人还应确认监控与回退开关已经可用。评估结果再好，如果异常无法及时发现和止损，仍缺少完整上线条件。\n\n## 资料与延伸阅读\n\n- [Anthropic：能力与回归评估及持续使用](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n- [Google SRE：服务目标与错误预算](https://sre.google/workbook/implementing-slos/)\n\n资料核验：2026-11-14。工单情境为教学构造；发布阈值需结合具体任务风险确定。\n","chars":1218,"minutes":5,"summary":"AI系统的提示、模型、工具、数据或检索参数任何一项变化，都可能改善一类任务同时破坏另一类。回归评估用于发现已具备能力是否退化，版本准入与发布机制则把评估结果转为可执行的上线决策。"},{"id":"11-08","title":"失败分类、根因分析与改进优先级","file":"content/11-08.md","level":"工作应用","prerequisites":["11-07"],"aliases":["evals","评测","LLM judge","A/B"],"module":"11","moduleTitle":"评估与实验","html":"<p>失败分析的目标是找到可改变的原因，而不是给结果贴一个“模型幻觉”标签。AI系统包含数据、模型、工具、权限、界面和用户理解，多层因素可能共同造成同一现象。好的分类能把反馈变成可验证的改进。<\/p><h2 id=\"section-1\">先描述现象再解释原因<\/h2><p>记录用户目标、实际输入、系统版本、执行过程、结果与预期差异。先区分事实和推断，例如“重复创建两张申请”是现象，“模型不懂业务”只是可能解释。没有执行记录时，应明确证据缺口，而不是凭最终回复猜测全部过程。<\/p><p>教学构造：Agent声称文件已保存，用户找不到。可能是保存工具未调用、路径错误、工具失败被忽略、文件写入其他账户，或界面链接指错。不同根因对应不同修复。只改一句“必须保存文件”可能暂时影响行为，却没有解决真正问题。<\/p><h2 id=\"section-2\">建立有行动意义的分类<\/h2><p>可以按任务理解、资料覆盖、检索、上下文、模型生成、工具选择、参数、执行、权限、状态、引用和交互分类。还可以标记严重度、影响用户、是否可恢复和是否重复。分类粒度应帮助确定负责人，不必追求完美理论体系。<\/p><p>一个问题可能有多个原因，应标出首先阻断正确结果的环节，以及后续放大的因素。例如错误资料被检索，模型未识别冲突，界面又没有引用；修复可以有多层，但要知道哪一层改善解决什么问题。<\/p><h2 id=\"section-3\">根因需要可检验假设<\/h2><p>提出假设后，尽量通过重放、替换组件或检查状态验证。给模型理想证据后恢复正确，说明检索可能是重要因素；直接调用工具也失败，说明问题不只在模型。每次只改变少量条件，更容易理解因果，必要时再测试组合影响。<\/p><p>重现失败时注意随机性和环境变化。一次没再出现不代表问题已经消失，外部服务、数据版本与权限状态也可能不同。保留最小可复现场景与关键日志，有助于跨团队协作，同时要脱敏并控制敏感内容访问。<\/p><h2 id=\"section-4\">优先级结合风险与收益<\/h2><p>可以比较发生频率、影响程度、覆盖用户、修复成本和可预防性。高频轻微措辞问题容易被注意，但低频越权或错误业务操作可能更紧急。严重问题可以先止损、限制功能，再深入修复；不一定等待完整根因报告后才控制影响。<\/p><p>改善应连接明确指标和回归样本。若修复重复提交，应验证重复效果减少，并观察是否导致正常请求被错误阻断。每个补丁都可能有代价，尤其在增加拒答、确认和校验时，需平衡任务成功与控制。<\/p><h2 id=\"section-5\">从单次故障到系统改进<\/h2><p>事故复盘可以讨论检测为何晚、影响为何扩大、恢复为何困难，以及流程如何预防。重点是系统条件与行动，而不是把责任归结为某个同事或某个模型。数据负责人、工具开发者、产品与运维需要共同理解链路。<\/p><p>将典型失败写入案例库和回归集，可以形成组织知识。对于用户反馈，也应说明处理状态和实际修复范围，避免承诺所有类似问题都已解决。资深AI产品经理的能力体现在把不确定失败变成清楚问题、证据和优先行动。<\/p><h2 id=\"section-6\">补充的判断方法<\/h2><p>用户反馈还要考虑暴露机会。一个低使用率功能投诉少，不代表质量高；一个自动完成的动作可能出错却暂时无人发现。可以结合任务量、监控和抽查估计风险，避免只按工单数量排序。修复之后也要核对历史受影响对象是否需要补救，而不仅让未来请求变好。产品责任同时覆盖预防、发现和恢复。<\/p><h2 id=\"section-7\">延伸的工作判断<\/h2><p>对同一失败可以保留现象标签和根因标签。前者便于用户反馈归类，后者支持技术改进；二者不必强行一一对应，也不应混用。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：评估与失败模式分析<\/a><\/li><li><a href=\"https://opentelemetry.io/docs/concepts/signals/traces/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenTelemetry：请求链路与Span<\/a><\/li><\/ul><p>资料核验：2026-11-14。文件保存情境为教学构造；根因结论必须由实际执行证据支持。<\/p>","toc":[{"id":"section-1","title":"先描述现象再解释原因","level":2},{"id":"section-2","title":"建立有行动意义的分类","level":2},{"id":"section-3","title":"根因需要可检验假设","level":2},{"id":"section-4","title":"优先级结合风险与收益","level":2},{"id":"section-5","title":"从单次故障到系统改进","level":2},{"id":"section-6","title":"补充的判断方法","level":2},{"id":"section-7","title":"延伸的工作判断","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"失败分析的目标是找到可改变的原因，而不是给结果贴一个“模型幻觉”标签。AI系统包含数据、模型、工具、权限、界面和用户理解，多层因素可能共同造成同一现象。好的分类能把反馈变成可验证的改进。\n\n## 先描述现象再解释原因\n\n记录用户目标、实际输入、系统版本、执行过程、结果与预期差异。先区分事实和推断，例如“重复创建两张申请”是现象，“模型不懂业务”只是可能解释。没有执行记录时，应明确证据缺口，而不是凭最终回复猜测全部过程。\n\n教学构造：Agent声称文件已保存，用户找不到。可能是保存工具未调用、路径错误、工具失败被忽略、文件写入其他账户，或界面链接指错。不同根因对应不同修复。只改一句“必须保存文件”可能暂时影响行为，却没有解决真正问题。\n\n## 建立有行动意义的分类\n\n可以按任务理解、资料覆盖、检索、上下文、模型生成、工具选择、参数、执行、权限、状态、引用和交互分类。还可以标记严重度、影响用户、是否可恢复和是否重复。分类粒度应帮助确定负责人，不必追求完美理论体系。\n\n一个问题可能有多个原因，应标出首先阻断正确结果的环节，以及后续放大的因素。例如错误资料被检索，模型未识别冲突，界面又没有引用；修复可以有多层，但要知道哪一层改善解决什么问题。\n\n## 根因需要可检验假设\n\n提出假设后，尽量通过重放、替换组件或检查状态验证。给模型理想证据后恢复正确，说明检索可能是重要因素；直接调用工具也失败，说明问题不只在模型。每次只改变少量条件，更容易理解因果，必要时再测试组合影响。\n\n重现失败时注意随机性和环境变化。一次没再出现不代表问题已经消失，外部服务、数据版本与权限状态也可能不同。保留最小可复现场景与关键日志，有助于跨团队协作，同时要脱敏并控制敏感内容访问。\n\n## 优先级结合风险与收益\n\n可以比较发生频率、影响程度、覆盖用户、修复成本和可预防性。高频轻微措辞问题容易被注意，但低频越权或错误业务操作可能更紧急。严重问题可以先止损、限制功能，再深入修复；不一定等待完整根因报告后才控制影响。\n\n改善应连接明确指标和回归样本。若修复重复提交，应验证重复效果减少，并观察是否导致正常请求被错误阻断。每个补丁都可能有代价，尤其在增加拒答、确认和校验时，需平衡任务成功与控制。\n\n## 从单次故障到系统改进\n\n事故复盘可以讨论检测为何晚、影响为何扩大、恢复为何困难，以及流程如何预防。重点是系统条件与行动，而不是把责任归结为某个同事或某个模型。数据负责人、工具开发者、产品与运维需要共同理解链路。\n\n将典型失败写入案例库和回归集，可以形成组织知识。对于用户反馈，也应说明处理状态和实际修复范围，避免承诺所有类似问题都已解决。资深AI产品经理的能力体现在把不确定失败变成清楚问题、证据和优先行动。\n\n## 补充的判断方法\n\n用户反馈还要考虑暴露机会。一个低使用率功能投诉少，不代表质量高；一个自动完成的动作可能出错却暂时无人发现。可以结合任务量、监控和抽查估计风险，避免只按工单数量排序。修复之后也要核对历史受影响对象是否需要补救，而不仅让未来请求变好。产品责任同时覆盖预防、发现和恢复。\n\n## 延伸的工作判断\n\n对同一失败可以保留现象标签和根因标签。前者便于用户反馈归类，后者支持技术改进；二者不必强行一一对应，也不应混用。\n\n## 资料与延伸阅读\n\n- [Anthropic：评估与失败模式分析](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n- [OpenTelemetry：请求链路与Span](https://opentelemetry.io/docs/concepts/signals/traces/)\n\n资料核验：2026-11-14。文件保存情境为教学构造；根因结论必须由实际执行证据支持。\n","chars":1217,"minutes":5,"summary":"失败分析的目标是找到可改变的原因，而不是给结果贴一个“模型幻觉”标签。AI系统包含数据、模型、工具、权限、界面和用户理解，多层因素可能共同造成同一现象。好的分类能把反馈变成可验证的改进。"},{"id":"12-01","title":"AI 系统架构与研发分工","file":"content/12-01.md","level":"工作应用","prerequisites":["03-01","03-07","11-01"],"aliases":["LLMOps","trace","latency","缓存"],"module":"12","moduleTitle":"工程协作、可靠性与成本","html":"<p>AI产品的架构不只是一个模型接口。用户身份、数据、业务系统、检索、模型、工具、状态和监控共同决定结果。非技术产品经理不必独立实现全部组件，但需要看懂数据和责任如何流动，才能与研发讨论可行性、风险和取舍。<\/p><h2 id=\"section-1\">以一次请求理解系统<\/h2><p>用户在客户端输入目标，请求到达应用服务；服务确认身份与权限，读取任务状态，按需要查询知识或业务数据，组织模型输入，再处理模型提出的工具请求。工具结果返回后继续生成或执行，最终把结果与产物展示给用户，同时记录必要诊断信息。<\/p><p>这些环节可能由一个程序完成，也可能分布在多个服务。架构图中的每个方框应说明输入、输出、依赖和数据边界。模型供应商只负责其中一部分，应用仍需处理用户状态、授权、业务校验和结果验证。接入强模型不等于获得完整Agent系统。<\/p><h2 id=\"section-2\">业务数据与模型上下文<\/h2><p>数据库保存权威业务事实，模型上下文用于本次理解与决策，两者职责不同。教学构造：订单数量应来自订单系统，而不是从过去聊天摘要推断。模型可以把“再买两台”转成结构化意图，真正数量、库存和支付状态仍需业务系统校验。<\/p><p>检索系统提供相关知识，工具接口提供可执行能力，状态存储维护任务进展。把这些职责分清，有助于定位错误：资料过时、授权失败、模型理解错误和工具执行异常，不应都交给同一提示词修复。<\/p><h2 id=\"section-3\">常见团队角色<\/h2><p>产品负责用户任务、范围、规则、体验与价值；业务专家确认领域事实和流程；算法或AI工程负责模型与应用策略；后端负责接口、状态和服务；前端负责交互；数据团队处理数据与质量；安全、测试和运维各自管理专业边界。具体组织可能一人多职，责任仍需明确。<\/p><p>资深产品经理需要推动共同定义验收，而不是替每个角色做所有技术决策。可以要求研发解释哪些约束来自模型、哪些来自现有系统、哪些需要新增工程。业务则应说明错误代价与允许的流程变化，避免技术团队凭猜测制定产品规则。<\/p><h2 id=\"section-4\">原型与生产架构的差别<\/h2><p>原型可以验证用户价值和主要路径，生产还需多用户隔离、权限、并发、重试、监控、成本、版本和故障恢复。演示成功通常只证明一个场景可行，不能直接推算大规模稳定性。需求评审应明确当前验证的是价值、能力还是交付条件。<\/p><p>选择自建或采购时，也要比较集成、维护、数据治理和退出成本。一个平台提供很多组件，不代表业务规则自然适配；自建更灵活，也需要团队长期维护。供应商依赖应记录在架构和风险中，尤其是数据格式、模型接口与工具生态。<\/p><h2 id=\"section-5\">如何开展有效技术沟通<\/h2><p>产品可以用具体任务与异常场景提问：结果从哪里验证，权限在哪一层执行，超时会不会重复，资料更新多久生效，故障时用户看到什么。这样的讨论比笼统要求“智能一点、稳定一点”更容易得到可执行方案。<\/p><p>图中还应标出敏感数据在哪里保存、发送到哪里、保留多久。技术理解的目标是能追踪事实与影响，识别需要进一步确认的问题。不会写复杂代码，并不妨碍建立这种系统视角；但需要持续学习接口、状态、数据流和质量证据。<\/p><h2 id=\"section-6\">延伸的工作判断<\/h2><p>还应把非功能要求翻译成可讨论约束。日常请求量、峰值并发、资料规模、可接受延迟、预算与数据保留都会影响架构。若只描述理想用户路径，研发容易基于不同假设估算。产品不必先规定某个数据库或框架，但应提供真实范围，并标明尚待验证的假设。这样能减少技术选型争论，也使原型到生产的差距更清楚。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：Agent系统模式与组成<\/a><\/li><li><a href=\"https://modelcontextprotocol.io/docs/learn/architecture\" target=\"_blank\" rel=\"noopener noreferrer\">MCP：主机、客户端、服务端的边界<\/a><\/li><\/ul><p>资料核验：2026-11-14。订单流程为教学构造；角色分工需结合真实团队调整。<\/p>","toc":[{"id":"section-1","title":"以一次请求理解系统","level":2},{"id":"section-2","title":"业务数据与模型上下文","level":2},{"id":"section-3","title":"常见团队角色","level":2},{"id":"section-4","title":"原型与生产架构的差别","level":2},{"id":"section-5","title":"如何开展有效技术沟通","level":2},{"id":"section-6","title":"延伸的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"AI产品的架构不只是一个模型接口。用户身份、数据、业务系统、检索、模型、工具、状态和监控共同决定结果。非技术产品经理不必独立实现全部组件，但需要看懂数据和责任如何流动，才能与研发讨论可行性、风险和取舍。\n\n## 以一次请求理解系统\n\n用户在客户端输入目标，请求到达应用服务；服务确认身份与权限，读取任务状态，按需要查询知识或业务数据，组织模型输入，再处理模型提出的工具请求。工具结果返回后继续生成或执行，最终把结果与产物展示给用户，同时记录必要诊断信息。\n\n这些环节可能由一个程序完成，也可能分布在多个服务。架构图中的每个方框应说明输入、输出、依赖和数据边界。模型供应商只负责其中一部分，应用仍需处理用户状态、授权、业务校验和结果验证。接入强模型不等于获得完整Agent系统。\n\n## 业务数据与模型上下文\n\n数据库保存权威业务事实，模型上下文用于本次理解与决策，两者职责不同。教学构造：订单数量应来自订单系统，而不是从过去聊天摘要推断。模型可以把“再买两台”转成结构化意图，真正数量、库存和支付状态仍需业务系统校验。\n\n检索系统提供相关知识，工具接口提供可执行能力，状态存储维护任务进展。把这些职责分清，有助于定位错误：资料过时、授权失败、模型理解错误和工具执行异常，不应都交给同一提示词修复。\n\n## 常见团队角色\n\n产品负责用户任务、范围、规则、体验与价值；业务专家确认领域事实和流程；算法或AI工程负责模型与应用策略；后端负责接口、状态和服务；前端负责交互；数据团队处理数据与质量；安全、测试和运维各自管理专业边界。具体组织可能一人多职，责任仍需明确。\n\n资深产品经理需要推动共同定义验收，而不是替每个角色做所有技术决策。可以要求研发解释哪些约束来自模型、哪些来自现有系统、哪些需要新增工程。业务则应说明错误代价与允许的流程变化，避免技术团队凭猜测制定产品规则。\n\n## 原型与生产架构的差别\n\n原型可以验证用户价值和主要路径，生产还需多用户隔离、权限、并发、重试、监控、成本、版本和故障恢复。演示成功通常只证明一个场景可行，不能直接推算大规模稳定性。需求评审应明确当前验证的是价值、能力还是交付条件。\n\n选择自建或采购时，也要比较集成、维护、数据治理和退出成本。一个平台提供很多组件，不代表业务规则自然适配；自建更灵活，也需要团队长期维护。供应商依赖应记录在架构和风险中，尤其是数据格式、模型接口与工具生态。\n\n## 如何开展有效技术沟通\n\n产品可以用具体任务与异常场景提问：结果从哪里验证，权限在哪一层执行，超时会不会重复，资料更新多久生效，故障时用户看到什么。这样的讨论比笼统要求“智能一点、稳定一点”更容易得到可执行方案。\n\n图中还应标出敏感数据在哪里保存、发送到哪里、保留多久。技术理解的目标是能追踪事实与影响，识别需要进一步确认的问题。不会写复杂代码，并不妨碍建立这种系统视角；但需要持续学习接口、状态、数据流和质量证据。\n\n## 延伸的工作判断\n\n还应把非功能要求翻译成可讨论约束。日常请求量、峰值并发、资料规模、可接受延迟、预算与数据保留都会影响架构。若只描述理想用户路径，研发容易基于不同假设估算。产品不必先规定某个数据库或框架，但应提供真实范围，并标明尚待验证的假设。这样能减少技术选型争论，也使原型到生产的差距更清楚。\n\n## 资料与延伸阅读\n\n- [Google Cloud：Agent系统模式与组成](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n- [MCP：主机、客户端、服务端的边界](https://modelcontextprotocol.io/docs/learn/architecture)\n\n资料核验：2026-11-14。订单流程为教学构造；角色分工需结合真实团队调整。\n","chars":1235,"minutes":5,"summary":"AI产品的架构不只是一个模型接口。用户身份、数据、业务系统、检索、模型、工具、状态和监控共同决定结果。非技术产品经理不必独立实现全部组件，但需要看懂数据和责任如何流动，才能与研发讨论可行性、风险和取舍。"},{"id":"12-02","title":"Trace、日志与可观测性","file":"content/12-02.md","level":"工作应用","prerequisites":["12-01"],"aliases":["LLMOps","trace","latency","缓存"],"module":"12","moduleTitle":"工程协作、可靠性与成本","html":"<p>用户说“这次Agent很慢，而且最后做错了”，最终回答无法解释发生了什么。可观测性让团队从系统输出推断内部执行情况。Trace、日志和指标分别提供路径、事件与总体变化，组合起来才能定位复杂AI任务。<\/p><h2 id=\"section-1\">三类信息如何分工<\/h2><p>指标是聚合数字，如请求量、错误率、延迟和费用，适合发现趋势与告警。日志记录某个时间发生的事件与上下文，适合查具体错误。Trace把一次请求经过的多个步骤关联起来，展示检索、模型、工具和业务服务之间的路径与耗时。<\/p><p>OpenTelemetry使用Span表示一段操作，多个Span通过上下级关系形成Trace。产品经理可以把它理解为一次任务的执行树：总任务下有检索、模型调用、工具执行等节点。异步或多Agent流程也需要关联标识，才能知道某个结果属于哪次任务。<\/p><h2 id=\"section-2\">AI链路需要特别记录什么<\/h2><p>可以记录模型与提示版本、输入输出Token、检索文档标识、工具名称、参数摘要、状态、耗时、重试与错误。还应关联任务目标、业务对象和最终结果。完整原文不一定都要保存，诊断价值与敏感数据风险需要权衡。<\/p><p>教学构造：一次请求耗时三十秒，模型生成只占五秒，工具限流重试占二十秒。若没有分段Trace，团队可能错误地更换更快模型。另一次任务回答错误，Trace显示检索取到旧版本，则应先处理知识更新，而不是继续改提示。<\/p><h2 id=\"section-3\">相关标识与结构化事件<\/h2><p>用户、会话、任务、调用和业务对象的标识应区分，并按权限关联。日志可以使用结构化字段，便于搜索和统计，而不只是长段自然语言。错误码、状态和版本也应有一致含义，避免各服务都写“失败”却无法汇总原因。<\/p><p>时间信息需要考虑跨服务时钟与异步任务。任务总耗时不一定等于所有Span耗时相加，因为可能并行；某些等待也可能发生在队列中。读图时应理解路径和依赖，避免把累计计算时间误当成用户实际等待。<\/p><h2 id=\"section-4\">隐私与安全边界<\/h2><p>提示、工具参数和截图可能包含个人信息、客户资料和凭证。可观测系统应控制采集、脱敏、访问、保留和删除。把全部用户数据永久复制到第三方日志平台，不是理所当然的诊断做法。重要字段可以记录标识、摘要或受控引用。<\/p><p>还要防止日志泄露与越权查询。客服可能需要查看任务状态，却不应看到全部敏感原文；开发者排查时也应遵循最小必要范围。生产数据与测试数据使用边界应明确，尤其在复现用户问题时。<\/p><h2 id=\"section-5\">从发现问题到产品动作<\/h2><p>监控可以先发现总体异常，再用Trace定位受影响任务，结合日志解释具体原因。产品侧可以观察失败类别、人工接管、成本异常和资料更新积压，并转化为优先级。指标仪表盘不应只展示漂亮数字，还要支持找到可行动的问题。<\/p><p>可观测性也有成本，采样和保留策略需与业务风险匹配。高风险动作可能需要更完整审计，普通读取可以适度采样。成熟方案能够说明哪些行为有证据、哪些仍不可见，避免因为“接入了监控平台”就认为系统已经完全可解释。<\/p><h2 id=\"section-6\">延伸的工作判断<\/h2><p>监控数据还需要与用户反馈关联。用户提交问题时，可以附上受控任务编号，支持团队找到对应Trace，而不必要求用户复制全部敏感内容。分析发现某类工具失败增多后，还要核对是否影响真正任务，避免把正常拒绝也计为故障。可观测性帮助提出假设，最终根因仍需结合业务证据验证。日志越多并不自动等于理解越深。<\/p><p>Trace与业务审计还需区分。前者帮助性能与故障诊断，后者可能要求完整记录关键动作、身份和授权依据。采样掉普通请求可以降低成本，但不应因此丢失必须保留的审计事件。两套需求可以关联，却不能简单互相替代。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://opentelemetry.io/docs/concepts/signals/traces/\" target=\"_blank\" rel=\"noopener noreferrer\">OpenTelemetry：Trace、Span与关联<\/a><\/li><li><a href=\"https://sre.google/sre-book/service-level-objectives/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE：服务指标与用户关切<\/a><\/li><\/ul><p>资料核验：2026-11-14。耗时数字为教学构造；实际采集字段需结合隐私与业务要求确定。<\/p>","toc":[{"id":"section-1","title":"三类信息如何分工","level":2},{"id":"section-2","title":"AI链路需要特别记录什么","level":2},{"id":"section-3","title":"相关标识与结构化事件","level":2},{"id":"section-4","title":"隐私与安全边界","level":2},{"id":"section-5","title":"从发现问题到产品动作","level":2},{"id":"section-6","title":"延伸的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"用户说“这次Agent很慢，而且最后做错了”，最终回答无法解释发生了什么。可观测性让团队从系统输出推断内部执行情况。Trace、日志和指标分别提供路径、事件与总体变化，组合起来才能定位复杂AI任务。\n\n## 三类信息如何分工\n\n指标是聚合数字，如请求量、错误率、延迟和费用，适合发现趋势与告警。日志记录某个时间发生的事件与上下文，适合查具体错误。Trace把一次请求经过的多个步骤关联起来，展示检索、模型、工具和业务服务之间的路径与耗时。\n\nOpenTelemetry使用Span表示一段操作，多个Span通过上下级关系形成Trace。产品经理可以把它理解为一次任务的执行树：总任务下有检索、模型调用、工具执行等节点。异步或多Agent流程也需要关联标识，才能知道某个结果属于哪次任务。\n\n## AI链路需要特别记录什么\n\n可以记录模型与提示版本、输入输出Token、检索文档标识、工具名称、参数摘要、状态、耗时、重试与错误。还应关联任务目标、业务对象和最终结果。完整原文不一定都要保存，诊断价值与敏感数据风险需要权衡。\n\n教学构造：一次请求耗时三十秒，模型生成只占五秒，工具限流重试占二十秒。若没有分段Trace，团队可能错误地更换更快模型。另一次任务回答错误，Trace显示检索取到旧版本，则应先处理知识更新，而不是继续改提示。\n\n## 相关标识与结构化事件\n\n用户、会话、任务、调用和业务对象的标识应区分，并按权限关联。日志可以使用结构化字段，便于搜索和统计，而不只是长段自然语言。错误码、状态和版本也应有一致含义，避免各服务都写“失败”却无法汇总原因。\n\n时间信息需要考虑跨服务时钟与异步任务。任务总耗时不一定等于所有Span耗时相加，因为可能并行；某些等待也可能发生在队列中。读图时应理解路径和依赖，避免把累计计算时间误当成用户实际等待。\n\n## 隐私与安全边界\n\n提示、工具参数和截图可能包含个人信息、客户资料和凭证。可观测系统应控制采集、脱敏、访问、保留和删除。把全部用户数据永久复制到第三方日志平台，不是理所当然的诊断做法。重要字段可以记录标识、摘要或受控引用。\n\n还要防止日志泄露与越权查询。客服可能需要查看任务状态，却不应看到全部敏感原文；开发者排查时也应遵循最小必要范围。生产数据与测试数据使用边界应明确，尤其在复现用户问题时。\n\n## 从发现问题到产品动作\n\n监控可以先发现总体异常，再用Trace定位受影响任务，结合日志解释具体原因。产品侧可以观察失败类别、人工接管、成本异常和资料更新积压，并转化为优先级。指标仪表盘不应只展示漂亮数字，还要支持找到可行动的问题。\n\n可观测性也有成本，采样和保留策略需与业务风险匹配。高风险动作可能需要更完整审计，普通读取可以适度采样。成熟方案能够说明哪些行为有证据、哪些仍不可见，避免因为“接入了监控平台”就认为系统已经完全可解释。\n\n## 延伸的工作判断\n\n监控数据还需要与用户反馈关联。用户提交问题时，可以附上受控任务编号，支持团队找到对应Trace，而不必要求用户复制全部敏感内容。分析发现某类工具失败增多后，还要核对是否影响真正任务，避免把正常拒绝也计为故障。可观测性帮助提出假设，最终根因仍需结合业务证据验证。日志越多并不自动等于理解越深。\n\nTrace与业务审计还需区分。前者帮助性能与故障诊断，后者可能要求完整记录关键动作、身份和授权依据。采样掉普通请求可以降低成本，但不应因此丢失必须保留的审计事件。两套需求可以关联，却不能简单互相替代。\n\n## 资料与延伸阅读\n\n- [OpenTelemetry：Trace、Span与关联](https://opentelemetry.io/docs/concepts/signals/traces/)\n- [Google SRE：服务指标与用户关切](https://sre.google/sre-book/service-level-objectives/)\n\n资料核验：2026-11-14。耗时数字为教学构造；实际采集字段需结合隐私与业务要求确定。\n","chars":1246,"minutes":5,"summary":"用户说“这次Agent很慢，而且最后做错了”，最终回答无法解释发生了什么。可观测性让团队从系统输出推断内部执行情况。Trace、日志和指标分别提供路径、事件与总体变化，组合起来才能定位复杂AI任务。"},{"id":"12-03","title":"延迟、吞吐与用户等待体验","file":"content/12-03.md","level":"工作应用","prerequisites":["12-02"],"aliases":["LLMOps","trace","latency","缓存"],"module":"12","moduleTitle":"工程协作、可靠性与成本","html":"<p>AI产品的等待不只来自模型生成。上传、排队、检索、工具、网络和结果验证都可能占用时间。延迟描述单个任务需要多久，吞吐描述单位时间处理多少任务，两者相关却不是同一个指标。<\/p><h2 id=\"section-1\">把端到端等待拆开<\/h2><p>可以记录请求接收、开始处理、首个有效输出、关键步骤完成与最终结果的时间。首Token快不代表任务快，尤其Agent需要多轮工具调用。流式输出可以降低感知等待，但如果先输出大量空话，用户并未更早得到有用信息。<\/p><p>教学构造：系统两秒开始说“正在分析”，一分钟后才返回可用文件；另一个系统十秒无输出，随后直接交付文件。哪个更好取决于任务与反馈质量，不能只按首Token延迟排序。应同时观察用户获得首个有用结果和完成目标的时间。<\/p><h2 id=\"section-2\">为什么要看分位数<\/h2><p>平均值会掩盖少数特别慢的请求。中位数描述典型体验，较高分位数帮助观察长尾。比如大多数请求很快，但某些复杂任务因重试等待很久，平均值可能仍不错。不同任务类型应分别看，不能把短问答和长报告混在一起设统一目标。<\/p><p>分位数也需要足够样本与清楚时间窗口。低流量场景的极端值波动大，应结合个案分析。服务指标应与用户容忍度连接：实时语音、交互编辑、后台研究对等待的要求明显不同。<\/p><h2 id=\"section-3\">吞吐、并发与队列<\/h2><p>并发是同时处理的任务数，吞吐是完成速率。增加并发可能提高资源利用，也可能触发限流、内存不足或延迟上升。请求到达速度长期超过处理能力，会形成队列，用户等待增长。系统需要容量规划、排队策略和负载控制。<\/p><p>可以区分交互请求与后台批任务，为重要实时任务保留资源。任务优先级与公平性也需要产品规则，不能让少数长任务占满全部能力。用户应知道任务是否排队、能否后台继续以及取消是否释放资源。<\/p><h2 id=\"section-4\">优化应从瓶颈出发<\/h2><p>检索慢可以研究索引与候选，工具慢可以改接口或并行独立读取，模型慢可以比较输出长度、模型档位与推理配置。减少不必要调用往往比单次调用提速更有效。依赖关系不允许并行的步骤，不能仅为追求速度强行同时执行。<\/p><p>缓存和预计算可以改善重复任务，但需要保证资料版本、用户权限与上下文匹配。提前生成结果也可能浪费资源。优化方案应测量整体任务，不要只改善某个局部数字，最后却增加失败重试和用户修订。<\/p><h2 id=\"section-5\">等待体验也是产品设计<\/h2><p>短等待可以直接反馈，长任务适合阶段进展、可取消与后台通知。进度应基于真实状态，无法估计百分比时，展示已完成事项更诚实。错误与超时应说明下一步，不要让用户在不确定状态下重复提交。<\/p><p>等待中的控制感很重要：用户能补充信息、查看部分结果或转去做别的事。对资深AI产品经理而言，延迟既是工程指标也是任务体验，需要与质量、成本和可靠性共同管理。更快但错误更多，通常不能简单称为产品改善。<\/p><h2 id=\"section-6\">延伸的工作判断<\/h2><p>输出长度也影响等待。要求模型先给结论和必要依据，可能比生成冗长说明更适合交互，但不应删掉关键限制。对于研究报告，可以先交付已核验概要，再继续完成附录；前提是状态明确，用户不会把阶段结果当作最终版本。速度优化需要与信息架构结合，减少无用工作，而不是只把相同内容更早流出来。<\/p><p>队列时间与执行时间可以分别展示。若等待主要来自容量不足，换更短提示未必有效；若请求已开始却卡在外部工具，需要看依赖服务。分层测量能避免团队反复优化并非瓶颈的环节，也更容易解释扩容是否值得。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://sre.google/sre-book/service-level-objectives/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE：延迟与服务指标<\/a><\/li><li><a href=\"https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS：超时与重试对系统行为的影响<\/a><\/li><\/ul><p>资料核验：2026-11-14。等待时间为教学构造；实际目标需按任务和用户研究制定。<\/p>","toc":[{"id":"section-1","title":"把端到端等待拆开","level":2},{"id":"section-2","title":"为什么要看分位数","level":2},{"id":"section-3","title":"吞吐、并发与队列","level":2},{"id":"section-4","title":"优化应从瓶颈出发","level":2},{"id":"section-5","title":"等待体验也是产品设计","level":2},{"id":"section-6","title":"延伸的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"AI产品的等待不只来自模型生成。上传、排队、检索、工具、网络和结果验证都可能占用时间。延迟描述单个任务需要多久，吞吐描述单位时间处理多少任务，两者相关却不是同一个指标。\n\n## 把端到端等待拆开\n\n可以记录请求接收、开始处理、首个有效输出、关键步骤完成与最终结果的时间。首Token快不代表任务快，尤其Agent需要多轮工具调用。流式输出可以降低感知等待，但如果先输出大量空话，用户并未更早得到有用信息。\n\n教学构造：系统两秒开始说“正在分析”，一分钟后才返回可用文件；另一个系统十秒无输出，随后直接交付文件。哪个更好取决于任务与反馈质量，不能只按首Token延迟排序。应同时观察用户获得首个有用结果和完成目标的时间。\n\n## 为什么要看分位数\n\n平均值会掩盖少数特别慢的请求。中位数描述典型体验，较高分位数帮助观察长尾。比如大多数请求很快，但某些复杂任务因重试等待很久，平均值可能仍不错。不同任务类型应分别看，不能把短问答和长报告混在一起设统一目标。\n\n分位数也需要足够样本与清楚时间窗口。低流量场景的极端值波动大，应结合个案分析。服务指标应与用户容忍度连接：实时语音、交互编辑、后台研究对等待的要求明显不同。\n\n## 吞吐、并发与队列\n\n并发是同时处理的任务数，吞吐是完成速率。增加并发可能提高资源利用，也可能触发限流、内存不足或延迟上升。请求到达速度长期超过处理能力，会形成队列，用户等待增长。系统需要容量规划、排队策略和负载控制。\n\n可以区分交互请求与后台批任务，为重要实时任务保留资源。任务优先级与公平性也需要产品规则，不能让少数长任务占满全部能力。用户应知道任务是否排队、能否后台继续以及取消是否释放资源。\n\n## 优化应从瓶颈出发\n\n检索慢可以研究索引与候选，工具慢可以改接口或并行独立读取，模型慢可以比较输出长度、模型档位与推理配置。减少不必要调用往往比单次调用提速更有效。依赖关系不允许并行的步骤，不能仅为追求速度强行同时执行。\n\n缓存和预计算可以改善重复任务，但需要保证资料版本、用户权限与上下文匹配。提前生成结果也可能浪费资源。优化方案应测量整体任务，不要只改善某个局部数字，最后却增加失败重试和用户修订。\n\n## 等待体验也是产品设计\n\n短等待可以直接反馈，长任务适合阶段进展、可取消与后台通知。进度应基于真实状态，无法估计百分比时，展示已完成事项更诚实。错误与超时应说明下一步，不要让用户在不确定状态下重复提交。\n\n等待中的控制感很重要：用户能补充信息、查看部分结果或转去做别的事。对资深AI产品经理而言，延迟既是工程指标也是任务体验，需要与质量、成本和可靠性共同管理。更快但错误更多，通常不能简单称为产品改善。\n\n## 延伸的工作判断\n\n输出长度也影响等待。要求模型先给结论和必要依据，可能比生成冗长说明更适合交互，但不应删掉关键限制。对于研究报告，可以先交付已核验概要，再继续完成附录；前提是状态明确，用户不会把阶段结果当作最终版本。速度优化需要与信息架构结合，减少无用工作，而不是只把相同内容更早流出来。\n\n队列时间与执行时间可以分别展示。若等待主要来自容量不足，换更短提示未必有效；若请求已开始却卡在外部工具，需要看依赖服务。分层测量能避免团队反复优化并非瓶颈的环节，也更容易解释扩容是否值得。\n\n## 资料与延伸阅读\n\n- [Google SRE：延迟与服务指标](https://sre.google/sre-book/service-level-objectives/)\n- [AWS：超时与重试对系统行为的影响](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/)\n\n资料核验：2026-11-14。等待时间为教学构造；实际目标需按任务和用户研究制定。\n","chars":1236,"minutes":5,"summary":"AI产品的等待不只来自模型生成。上传、排队、检索、工具、网络和结果验证都可能占用时间。延迟描述单个任务需要多久，吞吐描述单位时间处理多少任务，两者相关却不是同一个指标。"},{"id":"12-04","title":"Token 成本与成功任务成本","file":"content/12-04.md","level":"工作应用","prerequisites":["12-03"],"aliases":["LLMOps","trace","latency","缓存"],"module":"12","moduleTitle":"工程协作、可靠性与成本","html":"<p>模型接口通常按输入、输出或其他计算单位计费，但AI产品的经营成本远大于一次调用价格。Agent会多轮执行、重试和调用外部工具，因此需要从Token成本进一步理解请求成本与成功任务成本。<\/p><h2 id=\"section-1\">一次请求包含哪些费用<\/h2><p>可能包括模型输入、输出、缓存、推理资源、Embedding、检索、重排、工具、存储、网络和人工处理。多模态还可能按图像、音频或视频计费。不同服务计价口径不同，比较前要核对单位、地区、模型版本和价格日期。<\/p><p>上下文越长，通常需要处理更多输入，但价格和计算方式依服务而异。输出长度、调用次数和内部推理也可能影响费用或延迟。产品应依据实际账单与用量记录测量，而不是用屏幕显示字数粗略推算全部成本。<\/p><h2 id=\"section-2\">一个可复核的教学计算<\/h2><p>假设某模型每百万输入Token收费两元，每百万输出Token收费八元。一次调用输入一万、输出一千，则模型费用为一万除以一百万乘两元，加一千除以一百万乘八元，合计零点零二八元。该数值仅为教学构造，不是任何服务报价。<\/p><p>如果一个Agent平均调用五次，不能简单乘五，因后续上下文可能更长，部分调用也可能使用不同模型。还要加入检索、工具与失败重试。最好按任务关联每次调用，得到真实成本分布，而不是只看全账户月账单。<\/p><h2 id=\"section-3\">成功任务成本为什么更有用<\/h2><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>费用层<\/th><th>典型项目<\/th><th>记录方式<\/th><\/tr><tr><td>模型<\/td><td>输入、输出、缓存或推理资源<\/td><td>关联任务的调用用量<\/td><\/tr><tr><td>知识<\/td><td>解析、编码、存储、检索与重排<\/td><td>区分准备与查询费用<\/td><\/tr><tr><td>行动<\/td><td>搜索、浏览器、业务工具<\/td><td>调用次数与服务计量<\/td><\/tr><tr><td>基础设施<\/td><td>网络、计算与监控<\/td><td>按功能或任务分摊<\/td><\/tr><tr><td>人工<\/td><td>修订、接管、实施与支持<\/td><td>明确时间和成本口径<\/td><\/tr><\/table><\/div><p>可以用某类任务总成本除以验证成功数量，估计取得一个成功结果的平均成本。若便宜模型失败更多并需要人工修订，最终成本可能更高。分母应明确是否包含人工接管、部分成功和用户取消，避免口径变化制造虚假改善。<\/p><p>教学构造：方案A每次成本一角、成功率一半，方案B每次两角、成功率九成。在简单独立重试假设下，两者成功任务成本分别约两角与零点二二元，但真实任务还受重试、用户流失和人工成本影响。这个例子说明不能只看单价，也不能把粗略公式当作完整经营模型。<\/p><h2 id=\"section-4\">优化路径与质量代价<\/h2><p>可以减少无关上下文、合并重复查询、使用适合任务的模型、缓存稳定结果、限制无进展循环，或把确定性计算交给代码。优化后要检查质量是否退化，尤其是删除背景导致漏条件、缩短输出导致遗漏，或换便宜模型导致更多工具误用。<\/p><p>路由可以让简单任务用较低成本路径，困难任务升级，但路由判断也有费用和错误。若分类错误把高风险任务送入低能力路径，节约可能得不偿失。应按任务分层比较，明确升级与失败恢复规则。<\/p><h2 id=\"section-5\">预算与商业价值连接<\/h2><p>企业可能接受高价值任务较高成本，但要求可预测和可解释。可以设组织、用户、任务的预算与告警，显示预计范围和实际用量。预算耗尽后要定义停止、降级或请求扩展，而不是继续后台无限执行。<\/p><p>产品经理应把成本与用户节省时间、收入、质量收益和交付费用连接。内部推理成本低，不代表商业模式成立；用户是否愿意付费、企业部署和支持成本也很重要。知识库保留计算方法，具体价格以使用时核验为准，避免长期传播过时报价。<\/p><h2 id=\"section-6\">延伸的工作判断<\/h2><p>还要防止成本归因不清。多个用户共用一个服务账户时，需要按组织、任务和功能打标，才能知道哪类功能消耗资源。异常循环、失败重试和滥用应有单独统计。账单增长可能来自用户价值增长，也可能来自系统退化，两者需要不同处理。用量可解释，才有条件设计套餐、预算和经营策略。<\/p><p>人工成本也需明确计入方式。用户自己编辑草稿的时间、客服处理失败的时间和企业实施人员的支持成本属于不同口径。比较方案时可以分别报告，避免把成本转嫁给用户后称为系统节约，也避免把所有企业固定成本错误归因于一次模型调用。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Agent复杂度、延迟与成本取舍<\/a><\/li><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：按任务选择系统模式<\/a><\/li><\/ul><p>资料核验：2026-11-14。本文所有价格与成功率均为教学构造，不构成采购或财务建议。<\/p>","toc":[{"id":"section-1","title":"一次请求包含哪些费用","level":2},{"id":"section-2","title":"一个可复核的教学计算","level":2},{"id":"section-3","title":"成功任务成本为什么更有用","level":2},{"id":"section-4","title":"优化路径与质量代价","level":2},{"id":"section-5","title":"预算与商业价值连接","level":2},{"id":"section-6","title":"延伸的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"模型接口通常按输入、输出或其他计算单位计费，但AI产品的经营成本远大于一次调用价格。Agent会多轮执行、重试和调用外部工具，因此需要从Token成本进一步理解请求成本与成功任务成本。\n\n## 一次请求包含哪些费用\n\n可能包括模型输入、输出、缓存、推理资源、Embedding、检索、重排、工具、存储、网络和人工处理。多模态还可能按图像、音频或视频计费。不同服务计价口径不同，比较前要核对单位、地区、模型版本和价格日期。\n\n上下文越长，通常需要处理更多输入，但价格和计算方式依服务而异。输出长度、调用次数和内部推理也可能影响费用或延迟。产品应依据实际账单与用量记录测量，而不是用屏幕显示字数粗略推算全部成本。\n\n## 一个可复核的教学计算\n\n假设某模型每百万输入Token收费两元，每百万输出Token收费八元。一次调用输入一万、输出一千，则模型费用为一万除以一百万乘两元，加一千除以一百万乘八元，合计零点零二八元。该数值仅为教学构造，不是任何服务报价。\n\n如果一个Agent平均调用五次，不能简单乘五，因后续上下文可能更长，部分调用也可能使用不同模型。还要加入检索、工具与失败重试。最好按任务关联每次调用，得到真实成本分布，而不是只看全账户月账单。\n\n## 成功任务成本为什么更有用\n\n| 费用层 | 典型项目 | 记录方式 |\n|---|---|---|\n| 模型 | 输入、输出、缓存或推理资源 | 关联任务的调用用量 |\n| 知识 | 解析、编码、存储、检索与重排 | 区分准备与查询费用 |\n| 行动 | 搜索、浏览器、业务工具 | 调用次数与服务计量 |\n| 基础设施 | 网络、计算与监控 | 按功能或任务分摊 |\n| 人工 | 修订、接管、实施与支持 | 明确时间和成本口径 |\n\n可以用某类任务总成本除以验证成功数量，估计取得一个成功结果的平均成本。若便宜模型失败更多并需要人工修订，最终成本可能更高。分母应明确是否包含人工接管、部分成功和用户取消，避免口径变化制造虚假改善。\n\n教学构造：方案A每次成本一角、成功率一半，方案B每次两角、成功率九成。在简单独立重试假设下，两者成功任务成本分别约两角与零点二二元，但真实任务还受重试、用户流失和人工成本影响。这个例子说明不能只看单价，也不能把粗略公式当作完整经营模型。\n\n## 优化路径与质量代价\n\n可以减少无关上下文、合并重复查询、使用适合任务的模型、缓存稳定结果、限制无进展循环，或把确定性计算交给代码。优化后要检查质量是否退化，尤其是删除背景导致漏条件、缩短输出导致遗漏，或换便宜模型导致更多工具误用。\n\n路由可以让简单任务用较低成本路径，困难任务升级，但路由判断也有费用和错误。若分类错误把高风险任务送入低能力路径，节约可能得不偿失。应按任务分层比较，明确升级与失败恢复规则。\n\n## 预算与商业价值连接\n\n企业可能接受高价值任务较高成本，但要求可预测和可解释。可以设组织、用户、任务的预算与告警，显示预计范围和实际用量。预算耗尽后要定义停止、降级或请求扩展，而不是继续后台无限执行。\n\n产品经理应把成本与用户节省时间、收入、质量收益和交付费用连接。内部推理成本低，不代表商业模式成立；用户是否愿意付费、企业部署和支持成本也很重要。知识库保留计算方法，具体价格以使用时核验为准，避免长期传播过时报价。\n\n## 延伸的工作判断\n\n还要防止成本归因不清。多个用户共用一个服务账户时，需要按组织、任务和功能打标，才能知道哪类功能消耗资源。异常循环、失败重试和滥用应有单独统计。账单增长可能来自用户价值增长，也可能来自系统退化，两者需要不同处理。用量可解释，才有条件设计套餐、预算和经营策略。\n\n人工成本也需明确计入方式。用户自己编辑草稿的时间、客服处理失败的时间和企业实施人员的支持成本属于不同口径。比较方案时可以分别报告，避免把成本转嫁给用户后称为系统节约，也避免把所有企业固定成本错误归因于一次模型调用。\n\n## 资料与延伸阅读\n\n- [Anthropic：Agent复杂度、延迟与成本取舍](https://www.anthropic.com/engineering/building-effective-agents)\n- [Google Cloud：按任务选择系统模式](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n\n资料核验：2026-11-14。本文所有价格与成功率均为教学构造，不构成采购或财务建议。\n","chars":1391,"minutes":5,"summary":"模型接口通常按输入、输出或其他计算单位计费，但AI产品的经营成本远大于一次调用价格。Agent会多轮执行、重试和调用外部工具，因此需要从Token成本进一步理解请求成本与成功任务成本。"},{"id":"12-05","title":"缓存、批处理、并发与限流","file":"content/12-05.md","level":"工作应用","prerequisites":["12-04"],"aliases":["LLMOps","trace","latency","缓存"],"module":"12","moduleTitle":"工程协作、可靠性与成本","html":"<p>缓存、批处理和并发常被用来降低AI系统成本与等待，但它们也会引入过期结果、权限混用和负载问题。理解这些机制的适用条件，能够帮助产品经理评估优化方案，而不是只接受“会更快更便宜”的笼统承诺。<\/p><h2 id=\"section-1\">缓存复用什么<\/h2><p>可以缓存模型输入前缀、检索结果、工具查询或最终回答。不同层缓存的正确性条件不同。最终答案可能依赖用户、资料版本、时间和对话上下文，仅凭问题文字相同就复用，可能得到过期或越权答案。缓存键与失效规则因此是产品正确性的一部分。<\/p><p>教学构造：两名员工都问“我的剩余假期是多少”，文本完全相同，答案却属于不同用户。另一个问题“公司差旅上限”也可能因地区与职级不同而变化。复用前必须考虑身份和适用条件，不能只靠语义相似度判断。<\/p><h2 id=\"section-2\">缓存失效与更新<\/h2><p>资料更新、权限变化和业务状态改变，都可能使缓存失效。可以使用版本号、过期时间或主动清除，但各有代价。过期时间短可能降低命中，长则增加陈旧风险。关键实时事实应从权威系统核对，必要时展示获取时间。<\/p><p>语义缓存允许近似问题复用结果，更需要防止细小条件被忽略。比如“可以报销”与“不可以报销”的词很接近，却不能混用。高风险任务可以限定缓存范围或增加验证，避免把性能优化变成事实错误来源。<\/p><h2 id=\"section-3\">批处理适合什么任务<\/h2><p>批处理把多个任务集中处理，可能提高资源利用或适配服务优惠，但会增加等待。夜间资料编码、历史文档分析和非实时评估较适合；实时语音或交互确认通常不宜等待长批次。任务失败时还需定位哪些成功、哪些需要重做。<\/p><p>批量输入也要管理大小、顺序和结果映射。若一百份文档只返回九十九份结果，系统需要知道缺哪一份；重复执行也要避免重复写入。产品应提供任务状态和部分失败报告，而不是只显示整批成功或失败。<\/p><h2 id=\"section-4\">并发与限流如何配合<\/h2><p>并发可以同时执行独立任务，但受供应商限额、设备资源和下游承载能力限制。超额可能触发错误与重试，最终更慢。限流控制请求速率，队列安排等待，背压让上游知道不能继续无限提交。它们共同保护系统稳定。<\/p><p>多层重试可能造成请求放大，随机退避可以降低同时冲击。用户与组织之间还需要公平分配，防止一个批量任务占满资源。任务优先级应有业务依据，关键交互与后台工作可以采用不同资源策略。<\/p><h2 id=\"section-5\">优化需要观测真实结果<\/h2><p>可以同时观察缓存命中、过期错误、吞吐、排队、失败、延迟和总费用。命中率高不代表产品更好，如果用户拿到旧答案，仍是退化。批处理费用下降也要比较等待和人工补救成本，不能只看供应商单价。<\/p><p>产品经理可以要求解释每个优化复用什么、何时失效、对权限有什么影响、故障后怎样恢复。把适用条件写清楚，性能策略才能长期维护。优化不是独立于业务正确性的后台细节，而是用户体验和可信度的一部分。<\/p><h2 id=\"section-6\">延伸的工作判断<\/h2><p>限流后的反馈也应体现业务语义。临时繁忙可以排队或稍后重试，用户额度用尽则需要说明预算和可选路径，两者不应都显示网络错误。请求排队期间，资料或业务状态可能改变，真正执行前仍需校验。高影响动作不能因为已经排过队，就跳过当前权限与状态检查。<\/p><p>限流单位也可能不同：每分钟请求、每分钟Token、并发任务或组织额度。相同请求量下，长上下文可能更快触达Token限制。容量评估应使用真实任务长度分布，而不是假设每次请求消耗相同。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/\" target=\"_blank\" rel=\"noopener noreferrer\">AWS：重试、退避、负载与随机抖动<\/a><\/li><li><a href=\"https://sre.google/sre-book/service-level-objectives/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE：服务目标与容量相关判断<\/a><\/li><\/ul><p>资料核验：2026-11-14。假期与批量文档情境为教学构造；具体缓存及批处理支持需核验平台版本。<\/p>","toc":[{"id":"section-1","title":"缓存复用什么","level":2},{"id":"section-2","title":"缓存失效与更新","level":2},{"id":"section-3","title":"批处理适合什么任务","level":2},{"id":"section-4","title":"并发与限流如何配合","level":2},{"id":"section-5","title":"优化需要观测真实结果","level":2},{"id":"section-6","title":"延伸的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"缓存、批处理和并发常被用来降低AI系统成本与等待，但它们也会引入过期结果、权限混用和负载问题。理解这些机制的适用条件，能够帮助产品经理评估优化方案，而不是只接受“会更快更便宜”的笼统承诺。\n\n## 缓存复用什么\n\n可以缓存模型输入前缀、检索结果、工具查询或最终回答。不同层缓存的正确性条件不同。最终答案可能依赖用户、资料版本、时间和对话上下文，仅凭问题文字相同就复用，可能得到过期或越权答案。缓存键与失效规则因此是产品正确性的一部分。\n\n教学构造：两名员工都问“我的剩余假期是多少”，文本完全相同，答案却属于不同用户。另一个问题“公司差旅上限”也可能因地区与职级不同而变化。复用前必须考虑身份和适用条件，不能只靠语义相似度判断。\n\n## 缓存失效与更新\n\n资料更新、权限变化和业务状态改变，都可能使缓存失效。可以使用版本号、过期时间或主动清除，但各有代价。过期时间短可能降低命中，长则增加陈旧风险。关键实时事实应从权威系统核对，必要时展示获取时间。\n\n语义缓存允许近似问题复用结果，更需要防止细小条件被忽略。比如“可以报销”与“不可以报销”的词很接近，却不能混用。高风险任务可以限定缓存范围或增加验证，避免把性能优化变成事实错误来源。\n\n## 批处理适合什么任务\n\n批处理把多个任务集中处理，可能提高资源利用或适配服务优惠，但会增加等待。夜间资料编码、历史文档分析和非实时评估较适合；实时语音或交互确认通常不宜等待长批次。任务失败时还需定位哪些成功、哪些需要重做。\n\n批量输入也要管理大小、顺序和结果映射。若一百份文档只返回九十九份结果，系统需要知道缺哪一份；重复执行也要避免重复写入。产品应提供任务状态和部分失败报告，而不是只显示整批成功或失败。\n\n## 并发与限流如何配合\n\n并发可以同时执行独立任务，但受供应商限额、设备资源和下游承载能力限制。超额可能触发错误与重试，最终更慢。限流控制请求速率，队列安排等待，背压让上游知道不能继续无限提交。它们共同保护系统稳定。\n\n多层重试可能造成请求放大，随机退避可以降低同时冲击。用户与组织之间还需要公平分配，防止一个批量任务占满资源。任务优先级应有业务依据，关键交互与后台工作可以采用不同资源策略。\n\n## 优化需要观测真实结果\n\n可以同时观察缓存命中、过期错误、吞吐、排队、失败、延迟和总费用。命中率高不代表产品更好，如果用户拿到旧答案，仍是退化。批处理费用下降也要比较等待和人工补救成本，不能只看供应商单价。\n\n产品经理可以要求解释每个优化复用什么、何时失效、对权限有什么影响、故障后怎样恢复。把适用条件写清楚，性能策略才能长期维护。优化不是独立于业务正确性的后台细节，而是用户体验和可信度的一部分。\n\n## 延伸的工作判断\n\n限流后的反馈也应体现业务语义。临时繁忙可以排队或稍后重试，用户额度用尽则需要说明预算和可选路径，两者不应都显示网络错误。请求排队期间，资料或业务状态可能改变，真正执行前仍需校验。高影响动作不能因为已经排过队，就跳过当前权限与状态检查。\n\n限流单位也可能不同：每分钟请求、每分钟Token、并发任务或组织额度。相同请求量下，长上下文可能更快触达Token限制。容量评估应使用真实任务长度分布，而不是假设每次请求消耗相同。\n\n## 资料与延伸阅读\n\n- [AWS：重试、退避、负载与随机抖动](https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/)\n- [Google SRE：服务目标与容量相关判断](https://sre.google/sre-book/service-level-objectives/)\n\n资料核验：2026-11-14。假期与批量文档情境为教学构造；具体缓存及批处理支持需核验平台版本。\n","chars":1231,"minutes":5,"summary":"缓存、批处理和并发常被用来降低AI系统成本与等待，但它们也会引入过期结果、权限混用和负载问题。理解这些机制的适用条件，能够帮助产品经理评估优化方案，而不是只接受“会更快更便宜”的笼统承诺。"},{"id":"12-06","title":"降级、容错与服务可靠性","file":"content/12-06.md","level":"工作应用","prerequisites":["12-05"],"aliases":["LLMOps","trace","latency","缓存"],"module":"12","moduleTitle":"工程协作、可靠性与成本","html":"<p>AI系统依赖模型服务、检索、工具、网络和业务系统，任一环节都可能故障。可靠性不意味着永远不出错，而是明确用户需要什么服务水平，及时发现异常，并在限制内提供合理降级与恢复。<\/p><h2 id=\"section-1\">可用不等于有用<\/h2><p>接口返回成功，只说明某种技术请求完成，内容可能错误或无关。可以分别定义服务可用性、延迟、任务成功和关键风险。服务级指标用于测量，服务级目标描述希望达到的水平；服务协议则可能包含对外责任，三者不应混用。<\/p><p>教学构造：知识助手接口在线率很好，但检索索引停更一周，用户持续获得旧政策。技术可用性达标，任务质量仍然不可靠。AI产品需要把数据新鲜度、引用与结果质量纳入整体观察，不能只监控服务器是否在线。<\/p><h2 id=\"section-2\">降级应保留核心价值<\/h2><p>模型不可用时，可以提供传统搜索；重排超时时，可以返回未经重排但明确标注的检索结果；复杂Agent失败时，可以交付已确认的部分结果。降级方式需与任务风险匹配，不能在关键校验不可用时默默跳过并继续执行。<\/p><p>用户应知道当前能力限制和下一步。比如“当前只能查询资料，无法提交申请”，比保持相同按钮却不断失败更清楚。降级不一定降低模型档位，也可能缩小自动执行范围、增加人工确认或暂停写入动作。<\/p><h2 id=\"section-3\">容错与依赖隔离<\/h2><p>可以对短暂失败有限重试，对持续故障停止继续冲击，并限制故障在服务间传播。独立来源可以提供替代证据，但替代服务的权限、质量与成本要重新核对。自动切换到另一模型也不保证行为完全相同，尤其涉及工具格式和安全规则。<\/p><p>队列和超时需要整体预算，防止用户请求长时间挂起。任务取消与后台执行状态也应一致。对于结果未知的写入，应先核对业务状态，不能因为系统进入故障模式就重复提交。可靠性与幂等、补偿密切相连。<\/p><h2 id=\"section-4\">服务目标与错误预算<\/h2><p>服务目标应根据用户容忍和业务价值制定，而非统一追求最高数字。更高可靠性通常需要额外资源，目标过低又会伤害体验。错误预算可以帮助团队在功能迭代与稳定性投入之间做决定，但具体政策需要组织共识与可靠数据。<\/p><p>对于内容质量，不能简单套用全部传统可用性方法。严重越权不能因为剩余预算足够就接受，部分风险需要独立护栏。产品经理应区分可统计优化的问题和必须禁止的行为，避免所有质量都被一个平均成功率管理。<\/p><h2 id=\"section-5\">故障检测与用户影响<\/h2><p>告警需要对应行动：谁处理、何时升级、能否暂停功能、怎样识别受影响用户。过多无效告警会造成疲劳，过少则发现太晚。除了系统指标，还可观察异常拒答、重复工具调用和人工接管骤增，这些可能更早反映AI链路问题。<\/p><p>恢复后要核对积压任务、重复动作与错误产物是否需要修复。系统重新在线不等于用户影响已经结束。可靠性工作贯穿预防、检测、止损、恢复与复盘，产品角色需要把技术状态翻译成用户和业务影响。<\/p><h2 id=\"section-6\">延伸的工作判断<\/h2><p>可靠性演练可以主动模拟模型不可用、知识源停更、权限服务失败或工具超时，核对降级路径是否真实有效。演练应在受控环境中进行，并记录哪些用户价值仍可保留。某个备用模型虽然连通，却可能不支持相同工具格式，只有验证完整任务才能发现差异。备用方案存在于架构图上，与故障时能工作是两件事。<\/p><p>依赖故障时还应保护数据一致性。权限检查服务不可用，不能默认所有请求允许；审计写入失败时，高影响动作是否继续，需要明确规则。某些系统可以容忍延迟记录，另一些必须失败关闭，具体选择取决于业务风险。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://sre.google/sre-book/service-level-objectives/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE：服务目标、指标与协议<\/a><\/li><li><a href=\"https://sre.google/workbook/implementing-slos/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE Workbook：实施SLO与错误预算<\/a><\/li><\/ul><p>资料核验：2026-11-14。知识助手故障为教学构造；目标与护栏需结合真实用户和风险确定。<\/p>","toc":[{"id":"section-1","title":"可用不等于有用","level":2},{"id":"section-2","title":"降级应保留核心价值","level":2},{"id":"section-3","title":"容错与依赖隔离","level":2},{"id":"section-4","title":"服务目标与错误预算","level":2},{"id":"section-5","title":"故障检测与用户影响","level":2},{"id":"section-6","title":"延伸的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"AI系统依赖模型服务、检索、工具、网络和业务系统，任一环节都可能故障。可靠性不意味着永远不出错，而是明确用户需要什么服务水平，及时发现异常，并在限制内提供合理降级与恢复。\n\n## 可用不等于有用\n\n接口返回成功，只说明某种技术请求完成，内容可能错误或无关。可以分别定义服务可用性、延迟、任务成功和关键风险。服务级指标用于测量，服务级目标描述希望达到的水平；服务协议则可能包含对外责任，三者不应混用。\n\n教学构造：知识助手接口在线率很好，但检索索引停更一周，用户持续获得旧政策。技术可用性达标，任务质量仍然不可靠。AI产品需要把数据新鲜度、引用与结果质量纳入整体观察，不能只监控服务器是否在线。\n\n## 降级应保留核心价值\n\n模型不可用时，可以提供传统搜索；重排超时时，可以返回未经重排但明确标注的检索结果；复杂Agent失败时，可以交付已确认的部分结果。降级方式需与任务风险匹配，不能在关键校验不可用时默默跳过并继续执行。\n\n用户应知道当前能力限制和下一步。比如“当前只能查询资料，无法提交申请”，比保持相同按钮却不断失败更清楚。降级不一定降低模型档位，也可能缩小自动执行范围、增加人工确认或暂停写入动作。\n\n## 容错与依赖隔离\n\n可以对短暂失败有限重试，对持续故障停止继续冲击，并限制故障在服务间传播。独立来源可以提供替代证据，但替代服务的权限、质量与成本要重新核对。自动切换到另一模型也不保证行为完全相同，尤其涉及工具格式和安全规则。\n\n队列和超时需要整体预算，防止用户请求长时间挂起。任务取消与后台执行状态也应一致。对于结果未知的写入，应先核对业务状态，不能因为系统进入故障模式就重复提交。可靠性与幂等、补偿密切相连。\n\n## 服务目标与错误预算\n\n服务目标应根据用户容忍和业务价值制定，而非统一追求最高数字。更高可靠性通常需要额外资源，目标过低又会伤害体验。错误预算可以帮助团队在功能迭代与稳定性投入之间做决定，但具体政策需要组织共识与可靠数据。\n\n对于内容质量，不能简单套用全部传统可用性方法。严重越权不能因为剩余预算足够就接受，部分风险需要独立护栏。产品经理应区分可统计优化的问题和必须禁止的行为，避免所有质量都被一个平均成功率管理。\n\n## 故障检测与用户影响\n\n告警需要对应行动：谁处理、何时升级、能否暂停功能、怎样识别受影响用户。过多无效告警会造成疲劳，过少则发现太晚。除了系统指标，还可观察异常拒答、重复工具调用和人工接管骤增，这些可能更早反映AI链路问题。\n\n恢复后要核对积压任务、重复动作与错误产物是否需要修复。系统重新在线不等于用户影响已经结束。可靠性工作贯穿预防、检测、止损、恢复与复盘，产品角色需要把技术状态翻译成用户和业务影响。\n\n## 延伸的工作判断\n\n可靠性演练可以主动模拟模型不可用、知识源停更、权限服务失败或工具超时，核对降级路径是否真实有效。演练应在受控环境中进行，并记录哪些用户价值仍可保留。某个备用模型虽然连通，却可能不支持相同工具格式，只有验证完整任务才能发现差异。备用方案存在于架构图上，与故障时能工作是两件事。\n\n依赖故障时还应保护数据一致性。权限检查服务不可用，不能默认所有请求允许；审计写入失败时，高影响动作是否继续，需要明确规则。某些系统可以容忍延迟记录，另一些必须失败关闭，具体选择取决于业务风险。\n\n## 资料与延伸阅读\n\n- [Google SRE：服务目标、指标与协议](https://sre.google/sre-book/service-level-objectives/)\n- [Google SRE Workbook：实施SLO与错误预算](https://sre.google/workbook/implementing-slos/)\n\n资料核验：2026-11-14。知识助手故障为教学构造；目标与护栏需结合真实用户和风险确定。\n","chars":1258,"minutes":5,"summary":"AI系统依赖模型服务、检索、工具、网络和业务系统，任一环节都可能故障。可靠性不意味着永远不出错，而是明确用户需要什么服务水平，及时发现异常，并在限制内提供合理降级与恢复。"},{"id":"12-07","title":"版本、灰度、回滚与事故复盘","file":"content/12-07.md","level":"工作应用","prerequisites":["12-06"],"aliases":["LLMOps","trace","latency","缓存"],"module":"12","moduleTitle":"工程协作、可靠性与成本","html":"<p>AI版本变化可能来自模型、提示、知识、工具或代码，发布后也可能出现难以预见的行为。版本管理、灰度、回滚与事故复盘帮助团队把变化控制在可理解范围内，并在问题出现时降低用户影响。<\/p><h2 id=\"section-1\">用版本清单描述一个系统<\/h2><p>记录模型标识、提示版本、工具契约、应用代码、检索配置、索引与关键策略，可以把评估和线上行为关联起来。外部服务若自动更新，需要记录观察时间与可见版本信息，必要时增加监测。只知道“用了某家模型”，不足以解释几周后的变化。<\/p><p>知识与权限也属于版本范围，但它们可能有独立生命周期。撤回敏感文件后，不应为恢复旧模型效果而重新开放资料。版本管理需要区分可回退配置、必须保持当前的业务事实，以及不可逆外部动作。<\/p><h2 id=\"section-2\">灰度发布如何降低影响<\/h2><p>先在内部、特定用户或小比例流量运行，可以尽早发现真实环境问题。需要预先定义观察窗口、指标、护栏和暂停条件，并确保新旧版本可区分。用户或组织分组要避免相互污染，也要考虑不同数据与任务分布。<\/p><p>教学构造：新Agent工具路由先开放给少量内部用户，发现它在工具错误时反复重试。此时可以停止扩大、回退策略并检查是否已有重复写入。若只观察最终回复满意度，问题可能被暂时掩盖，直到外部客户受到影响。<\/p><h2 id=\"section-3\">回滚不是万能撤销<\/h2><p>回退代码或提示可以影响未来请求，但不会自动删除已发出的邮件、恢复错误订单或修正已分享报告。业务副作用需要核对与补偿，历史产物可能需要标记或重新生成。产品应明确技术恢复与用户影响修复的不同工作。<\/p><p>回滚路径本身也要验证。旧模型可能下线，旧索引可能已删除，新数据结构可能不兼容。发布前应确认恢复条件与保存范围，而不是出事故后才寻找旧配置。某些变化适合向前修复，具体选择取决于风险与恢复时间。<\/p><h2 id=\"section-4\">事故处理中先止损<\/h2><p>发现高影响问题时，可以限制功能、暂停写入、缩小权限或切换明确降级路径。需要确定负责人和沟通方式，记录时间线与决定。原因未完全查明也可以采取保守措施，但应说明依据和影响，避免仓促扩大故障。<\/p><p>用户沟通应围绕实际影响、当前状态和需要采取的动作。不能把“服务已恢复”当作所有错误结果已修正，也不应把未经确认原因当作事实。对外通知与承诺应由授权流程处理，内部则需保留清楚记录。<\/p><h2 id=\"section-5\">复盘如何形成改进<\/h2><p>复盘可以分析触发因素、系统弱点、检测延迟、扩大路径与恢复障碍。每项行动应有负责人、范围和验证方式，例如新增某类回归样本、改进幂等、增加监控或调整工具契约。笼统写“加强测试、提高责任心”难以证明改变。<\/p><p>AI事故也可能暴露评价盲区：裁判只看文字，未检查实际动作；数据集缺少权限场景；模型更新没有固定版本。把这些转回评估和发布机制，能减少相似问题重复出现。成熟产品团队追求可持续改进，而不是把每次事故视为不可解释的模型偶然性。<\/p><h2 id=\"section-6\">延伸的工作判断<\/h2><p>跨团队依赖变化也需要沟通。工具服务调整错误码、业务系统修改字段或供应商更新模型，都可能让原评估失效。可以建立接口变更通知与兼容检查，让关键依赖变化进入发布流程。复盘中若发现责任边界不清，应补充契约和负责人，而不是仅增加一条提示，要求Agent更小心。<\/p><p>灰度观察还需覆盖足够任务类型。只让内部专家试用，可能看不到新用户误解或真实客户资料结构问题。扩展用户时应分层观察，并保留主动反馈入口，避免把内部顺畅体验直接推断为外部全面可用。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://sre.google/workbook/implementing-slos/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE：实施服务目标与改进决策<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：回归评估与Agent行为变化<\/a><\/li><\/ul><p>资料核验：2026-11-14。灰度路由情境为教学构造；实际发布与事故流程需结合组织要求。<\/p>","toc":[{"id":"section-1","title":"用版本清单描述一个系统","level":2},{"id":"section-2","title":"灰度发布如何降低影响","level":2},{"id":"section-3","title":"回滚不是万能撤销","level":2},{"id":"section-4","title":"事故处理中先止损","level":2},{"id":"section-5","title":"复盘如何形成改进","level":2},{"id":"section-6","title":"延伸的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"AI版本变化可能来自模型、提示、知识、工具或代码，发布后也可能出现难以预见的行为。版本管理、灰度、回滚与事故复盘帮助团队把变化控制在可理解范围内，并在问题出现时降低用户影响。\n\n## 用版本清单描述一个系统\n\n记录模型标识、提示版本、工具契约、应用代码、检索配置、索引与关键策略，可以把评估和线上行为关联起来。外部服务若自动更新，需要记录观察时间与可见版本信息，必要时增加监测。只知道“用了某家模型”，不足以解释几周后的变化。\n\n知识与权限也属于版本范围，但它们可能有独立生命周期。撤回敏感文件后，不应为恢复旧模型效果而重新开放资料。版本管理需要区分可回退配置、必须保持当前的业务事实，以及不可逆外部动作。\n\n## 灰度发布如何降低影响\n\n先在内部、特定用户或小比例流量运行，可以尽早发现真实环境问题。需要预先定义观察窗口、指标、护栏和暂停条件，并确保新旧版本可区分。用户或组织分组要避免相互污染，也要考虑不同数据与任务分布。\n\n教学构造：新Agent工具路由先开放给少量内部用户，发现它在工具错误时反复重试。此时可以停止扩大、回退策略并检查是否已有重复写入。若只观察最终回复满意度，问题可能被暂时掩盖，直到外部客户受到影响。\n\n## 回滚不是万能撤销\n\n回退代码或提示可以影响未来请求，但不会自动删除已发出的邮件、恢复错误订单或修正已分享报告。业务副作用需要核对与补偿，历史产物可能需要标记或重新生成。产品应明确技术恢复与用户影响修复的不同工作。\n\n回滚路径本身也要验证。旧模型可能下线，旧索引可能已删除，新数据结构可能不兼容。发布前应确认恢复条件与保存范围，而不是出事故后才寻找旧配置。某些变化适合向前修复，具体选择取决于风险与恢复时间。\n\n## 事故处理中先止损\n\n发现高影响问题时，可以限制功能、暂停写入、缩小权限或切换明确降级路径。需要确定负责人和沟通方式，记录时间线与决定。原因未完全查明也可以采取保守措施，但应说明依据和影响，避免仓促扩大故障。\n\n用户沟通应围绕实际影响、当前状态和需要采取的动作。不能把“服务已恢复”当作所有错误结果已修正，也不应把未经确认原因当作事实。对外通知与承诺应由授权流程处理，内部则需保留清楚记录。\n\n## 复盘如何形成改进\n\n复盘可以分析触发因素、系统弱点、检测延迟、扩大路径与恢复障碍。每项行动应有负责人、范围和验证方式，例如新增某类回归样本、改进幂等、增加监控或调整工具契约。笼统写“加强测试、提高责任心”难以证明改变。\n\nAI事故也可能暴露评价盲区：裁判只看文字，未检查实际动作；数据集缺少权限场景；模型更新没有固定版本。把这些转回评估和发布机制，能减少相似问题重复出现。成熟产品团队追求可持续改进，而不是把每次事故视为不可解释的模型偶然性。\n\n## 延伸的工作判断\n\n跨团队依赖变化也需要沟通。工具服务调整错误码、业务系统修改字段或供应商更新模型，都可能让原评估失效。可以建立接口变更通知与兼容检查，让关键依赖变化进入发布流程。复盘中若发现责任边界不清，应补充契约和负责人，而不是仅增加一条提示，要求Agent更小心。\n\n灰度观察还需覆盖足够任务类型。只让内部专家试用，可能看不到新用户误解或真实客户资料结构问题。扩展用户时应分层观察，并保留主动反馈入口，避免把内部顺畅体验直接推断为外部全面可用。\n\n## 资料与延伸阅读\n\n- [Google SRE：实施服务目标与改进决策](https://sre.google/workbook/implementing-slos/)\n- [Anthropic：回归评估与Agent行为变化](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n\n资料核验：2026-11-14。灰度路由情境为教学构造；实际发布与事故流程需结合组织要求。\n","chars":1249,"minutes":5,"summary":"AI版本变化可能来自模型、提示、知识、工具或代码，发布后也可能出现难以预见的行为。版本管理、灰度、回滚与事故复盘帮助团队把变化控制在可理解范围内，并在问题出现时降低用户影响。"},{"id":"12-08","title":"质量、成本与速度的综合决策","file":"content/12-08.md","level":"工作应用","prerequisites":["12-07"],"aliases":["LLMOps","trace","latency","缓存"],"module":"12","moduleTitle":"工程协作、可靠性与成本","html":"<p>AI方案经常同时追求高质量、低成本和低延迟，但三者不总能一起改善。资深产品经理需要把技术比较转为任务层面的取舍：哪些质量是底线，哪些等待可以接受，额外成本换来了什么价值，以及证据是否充分。<\/p><h2 id=\"section-1\">先定义可接受范围<\/h2><p>可以把必须满足的权限、安全和关键正确性作为护栏，再比较护栏内的方案。对于草稿生成，用户可编辑可能允许部分瑕疵；自动业务执行则需要更严格验证。不同任务不能使用同一条质量线，也不能用低价格抵消不可接受风险。<\/p><p>教学构造：模型A更快便宜，但复杂工具任务经常需要人工接管；模型B较慢，却更稳定。用户每天执行大量高价值任务时，B可能更划算；简单标题生成则可能适合A。选择应按任务分层，而非为整个产品永久绑定唯一最强或最便宜模型。<\/p><h2 id=\"section-2\">用可比实验建立决策表<\/h2><p>保持任务、资料、权限、预算和评判一致，记录质量、失败类型、总延迟、成功任务成本与人工修订。还应说明样本范围和不确定性。若某方案使用更多上下文或多次尝试，其成本与效果应完整计算，不能只展示最好一次结果。<\/p><p>可以画出不同配置的质量、速度和成本关系，识别明显被另一方案全面超过的选项，以及各有优势的选项。后者没有统一答案，需要结合用户价值决定。参数更多或架构更复杂，并不天然位于更好的取舍位置。<\/p><h2 id=\"section-3\">路由与分层策略<\/h2><p>简单任务走快速路径，复杂任务升级，更高风险任务增加验证，是常见组合。路由需要清楚条件与失败恢复，分类本身也会犯错。可以使用规则、模型或用户选择，但要观察误路由的影响，而不只是总体费用下降。<\/p><p>某些任务可以先给可用草稿，再后台补充；某些必须等验证完成才能展示。分阶段结果可能改善体验，也可能让用户过早依赖未核实内容。产品应标记状态，并明确哪些信息已经确认、哪些仍在处理，避免速度优化伤害信任。<\/p><h2 id=\"section-4\">价值与成本不能只看接口<\/h2><p>总成本包括模型、工具、数据、运维、人工处理和企业交付；价值包括节省时间、提高质量、减少风险与创造收入。用户愿意付费的对象可能是稳定结果，而不是Token消耗。成功任务成本与用户收益之间的关系，是商业判断的重要基础。<\/p><p>对于工作流与多Agent，尤其要观察额外复杂度是否带来真实增益。若多个角色重复同样信息，优化可能是减少协调；若主要问题是资料缺失，换模型可能收益有限。正确的改进位置来自失败证据，而不是市场上最新的技术名称。<\/p><h2 id=\"section-5\">决策需要留下适用条件<\/h2><p>记录选择理由、样本、护栏、已知限制和重新评估触发条件。例如流量增长、价格变化、模型升级、任务分布改变或安全要求提高，都可能让旧选择失效。一个当时合理的方案不必永远最佳，关键是能够解释何时需要调整。<\/p><p>产品汇报可以先说明用户结果，再呈现取舍与证据。避免只展示一个总分或费用下降百分比，而不交代基线与质量代价。成熟判断既能推动行动，也能清楚表达尚未确定的部分，让业务与研发共同承担透明的选择。<\/p><h2 id=\"section-6\">延伸的工作判断<\/h2><p>决策记录可以采用问题、候选、证据、选择、代价与复查条件的结构。它帮助未来团队理解当时为何如此设计，也方便新模型出现后快速重评。没有记录时，架构容易被惯性维持，或因新的演示被轻易推翻。资深产品判断应既能基于证据做选择，也能在条件变化时主动修订。<\/p><p>当证据不足时，可以选择受控试用并明确待验证假设。这样的决定仍然是行动，但应有观察范围、停止条件和复查时间，而不是用无限期试用掩盖尚未解决的质量问题。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：复杂度、效果、延迟与成本<\/a><\/li><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：按需求选择Agent系统模式<\/a><\/li><\/ul><p>资料核验：2026-11-14。模型A/B为教学构造；具体采购与部署需使用当时的实际测试和报价。<\/p>","toc":[{"id":"section-1","title":"先定义可接受范围","level":2},{"id":"section-2","title":"用可比实验建立决策表","level":2},{"id":"section-3","title":"路由与分层策略","level":2},{"id":"section-4","title":"价值与成本不能只看接口","level":2},{"id":"section-5","title":"决策需要留下适用条件","level":2},{"id":"section-6","title":"延伸的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"AI方案经常同时追求高质量、低成本和低延迟，但三者不总能一起改善。资深产品经理需要把技术比较转为任务层面的取舍：哪些质量是底线，哪些等待可以接受，额外成本换来了什么价值，以及证据是否充分。\n\n## 先定义可接受范围\n\n可以把必须满足的权限、安全和关键正确性作为护栏，再比较护栏内的方案。对于草稿生成，用户可编辑可能允许部分瑕疵；自动业务执行则需要更严格验证。不同任务不能使用同一条质量线，也不能用低价格抵消不可接受风险。\n\n教学构造：模型A更快便宜，但复杂工具任务经常需要人工接管；模型B较慢，却更稳定。用户每天执行大量高价值任务时，B可能更划算；简单标题生成则可能适合A。选择应按任务分层，而非为整个产品永久绑定唯一最强或最便宜模型。\n\n## 用可比实验建立决策表\n\n保持任务、资料、权限、预算和评判一致，记录质量、失败类型、总延迟、成功任务成本与人工修订。还应说明样本范围和不确定性。若某方案使用更多上下文或多次尝试，其成本与效果应完整计算，不能只展示最好一次结果。\n\n可以画出不同配置的质量、速度和成本关系，识别明显被另一方案全面超过的选项，以及各有优势的选项。后者没有统一答案，需要结合用户价值决定。参数更多或架构更复杂，并不天然位于更好的取舍位置。\n\n## 路由与分层策略\n\n简单任务走快速路径，复杂任务升级，更高风险任务增加验证，是常见组合。路由需要清楚条件与失败恢复，分类本身也会犯错。可以使用规则、模型或用户选择，但要观察误路由的影响，而不只是总体费用下降。\n\n某些任务可以先给可用草稿，再后台补充；某些必须等验证完成才能展示。分阶段结果可能改善体验，也可能让用户过早依赖未核实内容。产品应标记状态，并明确哪些信息已经确认、哪些仍在处理，避免速度优化伤害信任。\n\n## 价值与成本不能只看接口\n\n总成本包括模型、工具、数据、运维、人工处理和企业交付；价值包括节省时间、提高质量、减少风险与创造收入。用户愿意付费的对象可能是稳定结果，而不是Token消耗。成功任务成本与用户收益之间的关系，是商业判断的重要基础。\n\n对于工作流与多Agent，尤其要观察额外复杂度是否带来真实增益。若多个角色重复同样信息，优化可能是减少协调；若主要问题是资料缺失，换模型可能收益有限。正确的改进位置来自失败证据，而不是市场上最新的技术名称。\n\n## 决策需要留下适用条件\n\n记录选择理由、样本、护栏、已知限制和重新评估触发条件。例如流量增长、价格变化、模型升级、任务分布改变或安全要求提高，都可能让旧选择失效。一个当时合理的方案不必永远最佳，关键是能够解释何时需要调整。\n\n产品汇报可以先说明用户结果，再呈现取舍与证据。避免只展示一个总分或费用下降百分比，而不交代基线与质量代价。成熟判断既能推动行动，也能清楚表达尚未确定的部分，让业务与研发共同承担透明的选择。\n\n## 延伸的工作判断\n\n决策记录可以采用问题、候选、证据、选择、代价与复查条件的结构。它帮助未来团队理解当时为何如此设计，也方便新模型出现后快速重评。没有记录时，架构容易被惯性维持，或因新的演示被轻易推翻。资深产品判断应既能基于证据做选择，也能在条件变化时主动修订。\n\n当证据不足时，可以选择受控试用并明确待验证假设。这样的决定仍然是行动，但应有观察范围、停止条件和复查时间，而不是用无限期试用掩盖尚未解决的质量问题。\n\n## 资料与延伸阅读\n\n- [Anthropic：复杂度、效果、延迟与成本](https://www.anthropic.com/engineering/building-effective-agents)\n- [Google Cloud：按需求选择Agent系统模式](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n\n资料核验：2026-11-14。模型A/B为教学构造；具体采购与部署需使用当时的实际测试和报价。\n","chars":1256,"minutes":5,"summary":"AI方案经常同时追求高质量、低成本和低延迟，但三者不总能一起改善。资深产品经理需要把技术比较转为任务层面的取舍：哪些质量是底线，哪些等待可以接受，额外成本换来了什么价值，以及证据是否充分。"},{"id":"13-01","title":"AI 机会识别与任务分析","file":"content/13-01.md","level":"工作应用","prerequisites":[],"aliases":["PRD","需求","产品策略"],"module":"13","moduleTitle":"AI 产品机会与产品设计","html":"<p>AI 机会识别首先要回答：哪一项工作值得改变，改变之后谁能得到什么收益。对有经验的产品经理来说，新增的难点是把业务任务与模型可承担的部分对应起来。模型能生成一段内容，并不自动说明它能替用户完成一项工作。<\/p><h2 id=\"section-1\">从功能愿望回到用户任务<\/h2><p>“做一个智能助手”描述的是产品形态。“客服收到一个退款争议后，需要找到订单、核对规则、形成建议并留下处理记录”才接近可以分析的任务。任务有触发条件、输入材料、处理过程、产物、完成标准和承担责任的人。机会分析应先画清这些要素，再讨论要不要加入聊天入口或自主执行。<\/p><p>把一次工作分成信息获取、理解、判断、生成、行动和核验，能看见 AI 可能改善的具体环节。客服案例里，检索政策可以使用搜索与权限过滤；整理争议事实可以使用模型；退款金额计算应按明确规则执行；真正退款需要业务权限与适当确认。一个用户任务往往需要多种技术共同完成。<\/p><h2 id=\"section-2\">看频率、负担、可验证性和后果<\/h2><p>频率决定改善是否能形成持续价值，当前负担决定用户是否愿意换流程，可验证性决定结果能否被信任，错误后果决定可开放的自主程度。这四个因素应一起看。低频但高风险的任务可能值得做辅助分析，却不适合立即自动执行；高频且结果容易核对的整理任务，可能更适合作为初始切口。<\/p><p>还要区分“花时间”与“消耗关键资源”。一个流程每次等待两小时，其中只有十分钟由人操作，AI 缩短写作可能只省五分钟，真正瓶颈在审批队列。若仅展示生成速度，产品会夸大端到端收益。任务分析应记录实际工作时间、等待时间、返工时间和下游接手成本。<\/p><h2 id=\"section-3\">一个教学构造的机会比较<\/h2><p>假设团队每月处理一千次客户资料整理，每次人工十五分钟。若助手让整理与核对合计变为七分钟，理论可节约约一百三十三小时。这个数字尚未扣除设置、维护与例外处理，也不等于企业可以减少同等工时的人员成本，但能帮助识别值得验证的机会。<\/p><p>同一团队另有每月二十次高价值合同判断，每次两小时。即使模型能生成建议，用户仍可能需要逐条核对，且错误代价很大。它的价值可能来自发现遗漏和改善准备质量，而非直接减少处理人数。两项机会需要不同的价值假设和完成标准。<\/p><h2 id=\"section-4\">把模糊机会写成可讨论的陈述<\/h2><p>一个可用的机会陈述应包含用户、任务、当前障碍、拟改变环节、预期收益、必要输入和主要不确定性。例如：“为一线客服整理争议事实与相关政策，减少跨系统查找和转述，保持最终退款决定由授权员工作出；优先验证政策引用正确率和处理总时长。”这类陈述比“提升客服智能化水平”更容易推动研发、运营和业务形成共同理解。<\/p><p>机会记录也要保留反例：哪些用户不需要、哪些资料不可得、什么情况下人工更快。反例能帮助收紧范围，防止把所有需求都归为一个通用 Agent。不同任务可以共用底层工具，却未必适合共用同一交互流程。<\/p><h2 id=\"section-5\">产品经理的判断重点<\/h2><p>先寻找一个有明确起止点的任务，再解释 AI 改善哪一步，以及改善后是否把更多核对工作转嫁给用户。产物应是一张任务流程与机会说明，能够连接后续适配性判断、数据要求、交互选择和评估方案。用户说“想用 AI”是研究起点，真实的任务收益才是产品立项依据。<\/p><h2 id=\"section-6\">留意任务周围的组织变化<\/h2><p>某一步加速以后，工作不一定按原来的方式分配。客服若更快形成建议，主管的审核队列可能成为新瓶颈；销售若能批量生成资料，客户可能收到更多重复信息。机会分析需要看任务上下游，以及其他角色承担的额外成本。局部效率提高与组织整体收益之间，需要经过流程与责任的衔接。<\/p><p>还可以把任务按信息稳定程度拆开。稳定规则适合沉淀为程序和明确检查，变化快的资料需要更新机制，开放判断则需要解释与人工参与。这种拆法帮助团队建立分层能力，也使机会能够从单一场景逐渐迁移，而不是每次重新做一个孤立助手。<\/p><h2 id=\"section-7\">机会地图的记录方法<\/h2><p>可以用一行记录一个任务，字段包括触发、角色、输入、当前步骤、产物、频率、总负担、错误后果和证据来源。再标注模型可能承担的环节与必须确定执行的环节。此表用于发现共性与依赖，不需要把所有字段换算成统一分数。<\/p><p>比较时保留三种结果：适合进一步验证、需要先解决基础条件、暂时缺少价值依据。第二类并不等于技术不可行，例如资料权属未清或组织责任未定；第三类也不代表永远不做。记录复审条件，可以让机会研究随证据变化，而不是形成永久的主观排序。<\/p><p>资料核验日期：2026-11-14。案例数值为教学构造。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/13-02\">AI 适配性与替代方案判断<\/a><\/li><li><a href=\"#lesson/16-01\">用户价值、任务收益与 ROI<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://developers.google.com/machine-learning/guides/rules-of-ml\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Rules of Machine Learning<\/a><\/li><li><a href=\"https://www.microsoft.com/en-us/haxtoolkit/\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：HAX Toolkit<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"从功能愿望回到用户任务","level":2},{"id":"section-2","title":"看频率、负担、可验证性和后果","level":2},{"id":"section-3","title":"一个教学构造的机会比较","level":2},{"id":"section-4","title":"把模糊机会写成可讨论的陈述","level":2},{"id":"section-5","title":"产品经理的判断重点","level":2},{"id":"section-6","title":"留意任务周围的组织变化","level":2},{"id":"section-7","title":"机会地图的记录方法","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"AI 机会识别首先要回答：哪一项工作值得改变，改变之后谁能得到什么收益。对有经验的产品经理来说，新增的难点是把业务任务与模型可承担的部分对应起来。模型能生成一段内容，并不自动说明它能替用户完成一项工作。\n\n## 从功能愿望回到用户任务\n\n“做一个智能助手”描述的是产品形态。“客服收到一个退款争议后，需要找到订单、核对规则、形成建议并留下处理记录”才接近可以分析的任务。任务有触发条件、输入材料、处理过程、产物、完成标准和承担责任的人。机会分析应先画清这些要素，再讨论要不要加入聊天入口或自主执行。\n\n把一次工作分成信息获取、理解、判断、生成、行动和核验，能看见 AI 可能改善的具体环节。客服案例里，检索政策可以使用搜索与权限过滤；整理争议事实可以使用模型；退款金额计算应按明确规则执行；真正退款需要业务权限与适当确认。一个用户任务往往需要多种技术共同完成。\n\n## 看频率、负担、可验证性和后果\n\n频率决定改善是否能形成持续价值，当前负担决定用户是否愿意换流程，可验证性决定结果能否被信任，错误后果决定可开放的自主程度。这四个因素应一起看。低频但高风险的任务可能值得做辅助分析，却不适合立即自动执行；高频且结果容易核对的整理任务，可能更适合作为初始切口。\n\n还要区分“花时间”与“消耗关键资源”。一个流程每次等待两小时，其中只有十分钟由人操作，AI 缩短写作可能只省五分钟，真正瓶颈在审批队列。若仅展示生成速度，产品会夸大端到端收益。任务分析应记录实际工作时间、等待时间、返工时间和下游接手成本。\n\n## 一个教学构造的机会比较\n\n假设团队每月处理一千次客户资料整理，每次人工十五分钟。若助手让整理与核对合计变为七分钟，理论可节约约一百三十三小时。这个数字尚未扣除设置、维护与例外处理，也不等于企业可以减少同等工时的人员成本，但能帮助识别值得验证的机会。\n\n同一团队另有每月二十次高价值合同判断，每次两小时。即使模型能生成建议，用户仍可能需要逐条核对，且错误代价很大。它的价值可能来自发现遗漏和改善准备质量，而非直接减少处理人数。两项机会需要不同的价值假设和完成标准。\n\n## 把模糊机会写成可讨论的陈述\n\n一个可用的机会陈述应包含用户、任务、当前障碍、拟改变环节、预期收益、必要输入和主要不确定性。例如：“为一线客服整理争议事实与相关政策，减少跨系统查找和转述，保持最终退款决定由授权员工作出；优先验证政策引用正确率和处理总时长。”这类陈述比“提升客服智能化水平”更容易推动研发、运营和业务形成共同理解。\n\n机会记录也要保留反例：哪些用户不需要、哪些资料不可得、什么情况下人工更快。反例能帮助收紧范围，防止把所有需求都归为一个通用 Agent。不同任务可以共用底层工具，却未必适合共用同一交互流程。\n\n## 产品经理的判断重点\n\n先寻找一个有明确起止点的任务，再解释 AI 改善哪一步，以及改善后是否把更多核对工作转嫁给用户。产物应是一张任务流程与机会说明，能够连接后续适配性判断、数据要求、交互选择和评估方案。用户说“想用 AI”是研究起点，真实的任务收益才是产品立项依据。\n\n## 留意任务周围的组织变化\n\n某一步加速以后，工作不一定按原来的方式分配。客服若更快形成建议，主管的审核队列可能成为新瓶颈；销售若能批量生成资料，客户可能收到更多重复信息。机会分析需要看任务上下游，以及其他角色承担的额外成本。局部效率提高与组织整体收益之间，需要经过流程与责任的衔接。\n\n还可以把任务按信息稳定程度拆开。稳定规则适合沉淀为程序和明确检查，变化快的资料需要更新机制，开放判断则需要解释与人工参与。这种拆法帮助团队建立分层能力，也使机会能够从单一场景逐渐迁移，而不是每次重新做一个孤立助手。\n\n## 机会地图的记录方法\n\n可以用一行记录一个任务，字段包括触发、角色、输入、当前步骤、产物、频率、总负担、错误后果和证据来源。再标注模型可能承担的环节与必须确定执行的环节。此表用于发现共性与依赖，不需要把所有字段换算成统一分数。\n\n比较时保留三种结果：适合进一步验证、需要先解决基础条件、暂时缺少价值依据。第二类并不等于技术不可行，例如资料权属未清或组织责任未定；第三类也不代表永远不做。记录复审条件，可以让机会研究随证据变化，而不是形成永久的主观排序。\n\n资料核验日期：2026-11-14。案例数值为教学构造。\n\n### 关联阅读\n\n- [AI 适配性与替代方案判断](13-02.md)\n- [用户价值、任务收益与 ROI](16-01.md)\n\n### 资料与延伸阅读\n\n- [Google：Rules of Machine Learning](https://developers.google.com/machine-learning/guides/rules-of-ml)\n- [Microsoft：HAX Toolkit](https://www.microsoft.com/en-us/haxtoolkit/)\n","chars":1585,"minutes":6,"summary":"AI 机会识别首先要回答：哪一项工作值得改变，改变之后谁能得到什么收益。对有经验的产品经理来说，新增的难点是把业务任务与模型可承担的部分对应起来。模型能生成一段内容，并不自动说明它能替用户完成一项工作。"},{"id":"13-02","title":"AI 适配性与替代方案判断","file":"content/13-02.md","level":"工作应用","prerequisites":["13-01"],"aliases":["PRD","需求","产品策略"],"module":"13","moduleTitle":"AI 产品机会与产品设计","html":"<p>判断任务是否适合 AI，需要同时比较价值与实现路径。最强的模型并不总是最合适的方案，模型生成也不应替代已经能够准确计算的业务规则。产品经理的职责是识别不确定性放在哪里，哪些部分必须保持确定。<\/p><h2 id=\"section-1\">先建立可以比较的替代方案<\/h2><p>面对“自动处理客户邮件”，至少可以比较人工优化、关键词规则、传统分类模型、单次大模型调用、检索增强和多步 Agent。比较的单位应是完成同一用户任务的整体方案，而非某个技术名词。若一个规则就能准确识别固定格式的通知，引入 Agent 可能增加延迟、成本和故障点。<\/p><p>传统软件擅长确定规则、精确计算和稳定执行。模型擅长处理语言变化、非结构化材料和模式泛化，但其输出需要在具体任务条件下验证。组合方式通常是让模型理解与提出候选，让程序负责计算、验证和权限执行。边界越清晰，越容易解释系统为何可靠。<\/p><h2 id=\"section-2\">用四组条件判断适配性<\/h2><p>第一组是输入与数据：材料是否能获得、是否有权限、是否足够清晰、是否随时间更新。第二组是输出与判断：结果有没有可说明的标准，是否允许多个合理答案，用户能否发现错误。第三组是行动后果：错误能否撤销，是否涉及金钱、外发内容或关键系统。第四组是运行条件：可接受的成本、延迟、吞吐与维护能力。<\/p><p>这些条件不会机械地产生一个分数。它们帮助团队发现最先需要解决的阻碍。例如，无权读取客户合同是权限问题；无法判断摘要遗漏是否重要是评估问题；付款操作不能重复则涉及幂等与业务流程。更换模型不一定能解决这些问题。<\/p><h2 id=\"section-3\">教学案例：选择一条最短有效路径<\/h2><p>假设用户希望把发票中的金额录入财务系统。固定版式可先用成熟 OCR 与字段规则，再进行金额和税额校验；版式变化大时可以增加文档理解模型。只有当任务还需要查供应商、处理异常、申请审批和更新多个系统，才有理由讨论多步执行。<\/p><p>如果错误录入能在提交前预览，系统可以先提供“建议字段”，让用户确认后执行。若希望全自动提交，则需要更严格的验证、权限与异常队列。这里决定自主程度的因素包括业务后果与验证能力，不只是识别模型的平均准确率。<\/p><h2 id=\"section-4\">区分可行、可用与值得做<\/h2><p>可行说明某个示例能够跑通；可用要求在真实输入分布、失败条件和系统约束下保持可接受体验；值得做还要求收益覆盖成本，并符合组织流程。演示只展示最理想路径，难以证明后两项。<\/p><p>比较方案时可固定一组具有代表性的任务，记录成功定义、质量、总耗时、用户核对负担和总成本。若简单方案已满足要求，就把复杂度留给明确的缺口。若所有方案都难以达到底线，应回到任务与范围，而非持续叠加提示或 Agent 数量。<\/p><h2 id=\"section-5\">何时收紧范围<\/h2><p>输入来源少、动作受限、完成标准明确的系统，通常更容易建立可靠性。把“自主完成所有办公工作”收紧为“根据已授权的会议信息生成日程草案”，可以保留用户价值，同时降低状态、权限和错误恢复的复杂度。范围收紧应说明保留了哪项价值，而非只删掉功能。<\/p><p>产品经理最终应给出选择理由、替代方案、关键依赖和残余风险。这样的判断能够帮助团队解释为什么此处使用规则、此处使用检索、此处使用模型，以及为什么某一步保留人工确认。<\/p><h2 id=\"section-6\">适配性判断需要保留失效条件<\/h2><p>今天有效的路径可能因数据量、用户结构或供应商行为变化而失效。选择方案时，应说明在何种条件下需要重新评估：例如资料超过可处理范围、关键工具不再稳定、错误后果发生变化，或模型能力与成本出现明显变化。这样选择理由可以被维护，而不是变成一次性的技术偏好。<\/p><p>判断还应包括用户能力。专业用户能识别某类错误，普通用户却可能把流畅表达当成可靠结论。相同模型、相同准确率，在不同用户群中可能需要不同程度的引用、确认与限制。适配性最终属于“任务、用户、系统和环境”的组合。<\/p><h2 id=\"section-7\">一份方案比较应包含的内容<\/h2><p>对每个候选路径，说明预期任务效果、资料依赖、权限、延迟、成本、维护与失败方式。先确定不可妥协的底线，再在满足底线的方案间比较。例如不能跨客户泄露资料是约束，不应与稍快的生成速度简单加权抵消。<\/p><p>比较还可以区分可通过设计缓解的问题与当前无法控制的问题。输出格式可以用程序校验，业务事实需要证据，供应商服务变化需要监控与替代路径。清楚指出控制位置，能够让团队更准确估计实现工作与剩余风险。<\/p><p>资料核验日期：2026-11-14。发票流程为教学构造。<\/p><h3 id=\"section-8\">关联阅读<\/h3><ul><li><a href=\"#lesson/08-01\">工作流、Agent 与确定性规则如何分工<\/a><\/li><li><a href=\"#lesson/04-01\">模型能力地图与选型维度<\/a><\/li><\/ul><h3 id=\"section-9\">资料与延伸阅读<\/h3><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：Choose a design pattern for your agentic AI system<\/a><\/li><\/ul>","toc":[{"id":"section-1","title":"先建立可以比较的替代方案","level":2},{"id":"section-2","title":"用四组条件判断适配性","level":2},{"id":"section-3","title":"教学案例：选择一条最短有效路径","level":2},{"id":"section-4","title":"区分可行、可用与值得做","level":2},{"id":"section-5","title":"何时收紧范围","level":2},{"id":"section-6","title":"适配性判断需要保留失效条件","level":2},{"id":"section-7","title":"一份方案比较应包含的内容","level":2},{"id":"section-8","title":"关联阅读","level":3},{"id":"section-9","title":"资料与延伸阅读","level":3}],"text":"判断任务是否适合 AI，需要同时比较价值与实现路径。最强的模型并不总是最合适的方案，模型生成也不应替代已经能够准确计算的业务规则。产品经理的职责是识别不确定性放在哪里，哪些部分必须保持确定。\n\n## 先建立可以比较的替代方案\n\n面对“自动处理客户邮件”，至少可以比较人工优化、关键词规则、传统分类模型、单次大模型调用、检索增强和多步 Agent。比较的单位应是完成同一用户任务的整体方案，而非某个技术名词。若一个规则就能准确识别固定格式的通知，引入 Agent 可能增加延迟、成本和故障点。\n\n传统软件擅长确定规则、精确计算和稳定执行。模型擅长处理语言变化、非结构化材料和模式泛化，但其输出需要在具体任务条件下验证。组合方式通常是让模型理解与提出候选，让程序负责计算、验证和权限执行。边界越清晰，越容易解释系统为何可靠。\n\n## 用四组条件判断适配性\n\n第一组是输入与数据：材料是否能获得、是否有权限、是否足够清晰、是否随时间更新。第二组是输出与判断：结果有没有可说明的标准，是否允许多个合理答案，用户能否发现错误。第三组是行动后果：错误能否撤销，是否涉及金钱、外发内容或关键系统。第四组是运行条件：可接受的成本、延迟、吞吐与维护能力。\n\n这些条件不会机械地产生一个分数。它们帮助团队发现最先需要解决的阻碍。例如，无权读取客户合同是权限问题；无法判断摘要遗漏是否重要是评估问题；付款操作不能重复则涉及幂等与业务流程。更换模型不一定能解决这些问题。\n\n## 教学案例：选择一条最短有效路径\n\n假设用户希望把发票中的金额录入财务系统。固定版式可先用成熟 OCR 与字段规则，再进行金额和税额校验；版式变化大时可以增加文档理解模型。只有当任务还需要查供应商、处理异常、申请审批和更新多个系统，才有理由讨论多步执行。\n\n如果错误录入能在提交前预览，系统可以先提供“建议字段”，让用户确认后执行。若希望全自动提交，则需要更严格的验证、权限与异常队列。这里决定自主程度的因素包括业务后果与验证能力，不只是识别模型的平均准确率。\n\n## 区分可行、可用与值得做\n\n可行说明某个示例能够跑通；可用要求在真实输入分布、失败条件和系统约束下保持可接受体验；值得做还要求收益覆盖成本，并符合组织流程。演示只展示最理想路径，难以证明后两项。\n\n比较方案时可固定一组具有代表性的任务，记录成功定义、质量、总耗时、用户核对负担和总成本。若简单方案已满足要求，就把复杂度留给明确的缺口。若所有方案都难以达到底线，应回到任务与范围，而非持续叠加提示或 Agent 数量。\n\n## 何时收紧范围\n\n输入来源少、动作受限、完成标准明确的系统，通常更容易建立可靠性。把“自主完成所有办公工作”收紧为“根据已授权的会议信息生成日程草案”，可以保留用户价值，同时降低状态、权限和错误恢复的复杂度。范围收紧应说明保留了哪项价值，而非只删掉功能。\n\n产品经理最终应给出选择理由、替代方案、关键依赖和残余风险。这样的判断能够帮助团队解释为什么此处使用规则、此处使用检索、此处使用模型，以及为什么某一步保留人工确认。\n\n## 适配性判断需要保留失效条件\n\n今天有效的路径可能因数据量、用户结构或供应商行为变化而失效。选择方案时，应说明在何种条件下需要重新评估：例如资料超过可处理范围、关键工具不再稳定、错误后果发生变化，或模型能力与成本出现明显变化。这样选择理由可以被维护，而不是变成一次性的技术偏好。\n\n判断还应包括用户能力。专业用户能识别某类错误，普通用户却可能把流畅表达当成可靠结论。相同模型、相同准确率，在不同用户群中可能需要不同程度的引用、确认与限制。适配性最终属于“任务、用户、系统和环境”的组合。\n\n## 一份方案比较应包含的内容\n\n对每个候选路径，说明预期任务效果、资料依赖、权限、延迟、成本、维护与失败方式。先确定不可妥协的底线，再在满足底线的方案间比较。例如不能跨客户泄露资料是约束，不应与稍快的生成速度简单加权抵消。\n\n比较还可以区分可通过设计缓解的问题与当前无法控制的问题。输出格式可以用程序校验，业务事实需要证据，供应商服务变化需要监控与替代路径。清楚指出控制位置，能够让团队更准确估计实现工作与剩余风险。\n\n资料核验日期：2026-11-14。发票流程为教学构造。\n\n### 关联阅读\n\n- [工作流、Agent 与确定性规则如何分工](08-01.md)\n- [模型能力地图与选型维度](04-01.md)\n\n### 资料与延伸阅读\n\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n- [Google Cloud：Choose a design pattern for your agentic AI system](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n","chars":1550,"minutes":6,"summary":"判断任务是否适合 AI，需要同时比较价值与实现路径。最强的模型并不总是最合适的方案，模型生成也不应替代已经能够准确计算的业务规则。产品经理的职责是识别不确定性放在哪里，哪些部分必须保持确定。"},{"id":"13-03","title":"用户研究、需求验证与证据","file":"content/13-03.md","level":"工作应用","prerequisites":["13-02"],"aliases":["PRD","需求","产品策略"],"module":"13","moduleTitle":"AI 产品机会与产品设计","html":"<p>AI 用户研究需要同时观察用户想完成的工作，以及用户如何判断机器的结果。单独询问“是否愿意使用智能助手”容易获得积极但不可靠的回答。更有价值的是还原最近一次真实任务，观察材料、决策、工具切换、错误与返工。<\/p><h2 id=\"section-1\">把研究对象放回具体场景<\/h2><p>访谈可以围绕任务发生前、执行中和结束后三段展开。任务发生前看触发条件、来源和优先级；执行中看查找、判断、沟通与系统操作；结束后看谁接手、如何确认完成、错误怎样被发现。对每一步记录事实与解释，避免把用户的推测当作观察结果。<\/p><p>例如，用户说“写周报很耗时”，实际观察可能发现写作只有十分钟，回溯工作记录占四十分钟，向同事确认状态又耗去二十分钟。这时主要机会可能在信息收集与事实校验，而非让模型把文字写得更长。解决错环节会带来新界面，却未必改善工作。<\/p><h2 id=\"section-2\">区分几种证据<\/h2><p>口头偏好反映态度，行为观察反映实际困难，历史记录反映发生频率，原型使用反映初步可用性，持续使用与结果数据才更接近价值验证。它们回答的问题不同，不应互相替代。一个用户喜欢演示，不能直接推断整个团队会长期采用。<\/p><p>研究记录中可以标注“观察到”“用户陈述”“团队推断”和“尚未验证”。这不是繁琐文档，而是减少争论成本：当团队分歧时，可以回到证据等级，明确下一步需要更多观察、数据还是技术验证。<\/p><h2 id=\"section-3\">AI 场景特有的研究内容<\/h2><p>用户对错误的容忍度取决于任务。创意草稿可以接受多种答案，财务数字则需要可追溯依据。还要观察用户能否识别错误、是否会过度信任流畅表达、核对需要多大成本，以及什么时候愿意交出控制权。这些因素会影响交互形态和自动化程度。<\/p><p>资料授权也必须进入研究范围。用户可能愿意让助手整理内容，却没有权限把资料发送到外部服务。组织层面的采购、安全和流程约束，会影响真实采用。应区分个人使用意愿、团队流程可接受性与企业准入条件。<\/p><h2 id=\"section-4\">从假设到验证设计<\/h2><p>一个好的假设包含对象、场景、改变与观察指标。例如：“在相同资料条件下，提供带来源的客户摘要，可减少销售交接时的补充问答。”它比“摘要更智能”更容易被证据支持或推翻。<\/p><p>可以先用人工模拟部分后台流程来观察交互，或使用受控资料展示不同产物，尽早发现价值和理解问题。但这种原型无法证明真实系统的稳定性、成本或规模化能力。
