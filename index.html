力的方法，产品仍需要清楚的用户、输入、输出与价值标准。本篇建立整个知识库的概念地图，帮助你把已有的产品分析经验连接到技术讨论中。<\/p><h2 id=\"section-1\">从大范围到具体能力<\/h2><p>人工智能关注让计算机完成通常需要智能的任务。机器学习是其中的一类方法：利用数据学习输入和输出之间的规律，而非逐条编写全部规则。深度学习又是机器学习中的一类方法，使用多层神经网络学习表示。生成式 AI 强调产生文本、图像、音频等新内容；大语言模型是其中处理语言及相关任务的一种重要模型。<\/p><p>这些词并不处于完全相同的分类维度。“深度学习”描述方法，“生成式”描述能力，“Agent”描述系统如何围绕目标组织模型、工具和状态。一个 Agent 可以使用大语言模型，也可以包含搜索、数据库、传统分类器和人工审批。把 Agent 直接等同于某个模型，会遗漏执行系统中大量决定产品质量的部分。<\/p><h2 id=\"section-2\">先分清四类业务问题<\/h2><p>识别与分类回答“这是什么”，如工单属于哪个部门。预测与排序回答“什么可能发生、哪个更值得展示”，如设备故障概率或搜索结果排序。生成回答“根据输入构造什么内容”，如报告草稿。行动回答“为了达到目标，需要完成什么步骤”，如读取工单、检查库存并创建采购申请。这四类问题可以组合，但评估和风险并不相同。<\/p><p>教学构造例子：一个售后助手先把来信分类，再从知识库检索保修规则，生成回复草稿，最后经坐席确认发送。分类可能由小模型完成；检索依赖搜索系统；生成由语言模型完成；发送依赖业务接口和权限。用户看到的是一个助手，研发面对的是多个可分别验证和替换的环节。<\/p><h2 id=\"section-3\">能力、系统与产品分别看什么<\/h2><p>模型层关注给定输入下的输出表现，例如是否正确识别意图。系统层关注数据、模型、工具和流程的组合，例如检索是否拿到正确版本。产品层关注用户是否完成任务、是否愿意持续使用，以及收益是否超过成本。模型测评成绩好，并不能单独证明整体产品有效；系统表现不好，也不一定需要更换模型。<\/p><p>假设售后助手的回答错误，可能是模型未理解问题、知识库过期、检索命中错文档、提示未说明适用地区，或者用户没有提供购买日期。每一种原因对应不同改进：换模型、更新数据、调整检索、补充上下文或改变交互。先画出从用户输入到最终业务结果的链路，通常比立即讨论模型参数更有帮助。<\/p><h2 id=\"section-4\">规则、机器学习与大模型如何选择<\/h2><p>稳定、边界清楚、可穷举的约束适合规则，例如金额上限和审批人权限。有大量结构化历史数据、目标明确且输出空间有限的任务，可以考虑传统机器学习，例如流失预测。语言表达多样、需要理解或生成内容的任务适合评估大模型。开放、多步且路径难以预定义的任务，再考虑提高系统自主程度。<\/p><p>这并非技术优劣排序。规则的价值在于可解释和可确定执行，模型的价值在于从复杂输入中归纳规律。成熟产品常将两者组合：模型提出候选动作，规则验证条件，用户确认关键步骤，系统记录执行证据。选择依据应是目标、数据、失败代价和维护成本，而不是概念是否新。<\/p><h2 id=\"section-5\">产品经理如何使用这张地图<\/h2><p>写需求时，把“AI 自动处理”拆成可观察的行为：从哪些资料读取什么信息，输出哪些字段，何时调用什么工具，出现哪些情况需要停止。再为每个环节指定正确性标准和责任边界。这样可以讨论可行性、拆分交付，也能判断问题应该由模型、数据、工程还是交互来解决。<\/p><p>可以从 AI SCADA 的实际工作中梳理用户流程与工具产品经验，再把你已经承担的部分迁移到这类分析：先理解操作者的目标和当前工作方式，再明确自动化边界。接下来阅读机器学习、模型原理和 Agent 系统时，始终把概念放回这条业务链路，知识就会逐渐形成可用于决策的结构。<\/p><h2 id=\"section-6\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><\/ul><p>核验日期：2026-11-14。本文的售后流程为教学构造案例；技术分类用于建立认知，不代表唯一的学术分类体系。<\/p>","toc":[{"id":"section-1","title":"从大范围到具体能力","level":2},{"id":"section-2","title":"先分清四类业务问题","level":2},{"id":"section-3","title":"能力、系统与产品分别看什么","level":2},{"id":"section-4","title":"规则、机器学习与大模型如何选择","level":2},{"id":"section-5","title":"产品经理如何使用这张地图","level":2},{"id":"section-6","title":"资料与延伸阅读","level":2}],"text":"当你讨论“给产品加入 AI”时，首先需要确定要改变哪一个业务环节：识别信息、预测结果、生成内容，还是执行行动。AI 是一组实现能力的方法，产品仍需要清楚的用户、输入、输出与价值标准。本篇建立整个知识库的概念地图，帮助你把已有的产品分析经验连接到技术讨论中。\n\n## 从大范围到具体能力\n\n人工智能关注让计算机完成通常需要智能的任务。机器学习是其中的一类方法：利用数据学习输入和输出之间的规律，而非逐条编写全部规则。深度学习又是机器学习中的一类方法，使用多层神经网络学习表示。生成式 AI 强调产生文本、图像、音频等新内容；大语言模型是其中处理语言及相关任务的一种重要模型。\n\n这些词并不处于完全相同的分类维度。“深度学习”描述方法，“生成式”描述能力，“Agent”描述系统如何围绕目标组织模型、工具和状态。一个 Agent 可以使用大语言模型，也可以包含搜索、数据库、传统分类器和人工审批。把 Agent 直接等同于某个模型，会遗漏执行系统中大量决定产品质量的部分。\n\n## 先分清四类业务问题\n\n识别与分类回答“这是什么”，如工单属于哪个部门。预测与排序回答“什么可能发生、哪个更值得展示”，如设备故障概率或搜索结果排序。生成回答“根据输入构造什么内容”，如报告草稿。行动回答“为了达到目标，需要完成什么步骤”，如读取工单、检查库存并创建采购申请。这四类问题可以组合，但评估和风险并不相同。\n\n教学构造例子：一个售后助手先把来信分类，再从知识库检索保修规则，生成回复草稿，最后经坐席确认发送。分类可能由小模型完成；检索依赖搜索系统；生成由语言模型完成；发送依赖业务接口和权限。用户看到的是一个助手，研发面对的是多个可分别验证和替换的环节。\n\n## 能力、系统与产品分别看什么\n\n模型层关注给定输入下的输出表现，例如是否正确识别意图。系统层关注数据、模型、工具和流程的组合，例如检索是否拿到正确版本。产品层关注用户是否完成任务、是否愿意持续使用，以及收益是否超过成本。模型测评成绩好，并不能单独证明整体产品有效；系统表现不好，也不一定需要更换模型。\n\n假设售后助手的回答错误，可能是模型未理解问题、知识库过期、检索命中错文档、提示未说明适用地区，或者用户没有提供购买日期。每一种原因对应不同改进：换模型、更新数据、调整检索、补充上下文或改变交互。先画出从用户输入到最终业务结果的链路，通常比立即讨论模型参数更有帮助。\n\n## 规则、机器学习与大模型如何选择\n\n稳定、边界清楚、可穷举的约束适合规则，例如金额上限和审批人权限。有大量结构化历史数据、目标明确且输出空间有限的任务，可以考虑传统机器学习，例如流失预测。语言表达多样、需要理解或生成内容的任务适合评估大模型。开放、多步且路径难以预定义的任务，再考虑提高系统自主程度。\n\n这并非技术优劣排序。规则的价值在于可解释和可确定执行，模型的价值在于从复杂输入中归纳规律。成熟产品常将两者组合：模型提出候选动作，规则验证条件，用户确认关键步骤，系统记录执行证据。选择依据应是目标、数据、失败代价和维护成本，而不是概念是否新。\n\n## 产品经理如何使用这张地图\n\n写需求时，把“AI 自动处理”拆成可观察的行为：从哪些资料读取什么信息，输出哪些字段，何时调用什么工具，出现哪些情况需要停止。再为每个环节指定正确性标准和责任边界。这样可以讨论可行性、拆分交付，也能判断问题应该由模型、数据、工程还是交互来解决。\n\n可以从 AI SCADA 的实际工作中梳理用户流程与工具产品经验，再把你已经承担的部分迁移到这类分析：先理解操作者的目标和当前工作方式，再明确自动化边界。接下来阅读机器学习、模型原理和 Agent 系统时，始终把概念放回这条业务链路，知识就会逐渐形成可用于决策的结构。\n\n## 资料与延伸阅读\n\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n- [Anthropic：Building effective agents](https://www.anthropic.com/engineering/building-effective-agents)\n\n核验日期：2026-11-14。本文的售后流程为教学构造案例；技术分类用于建立认知，不代表唯一的学术分类体系。\n","chars":1368,"minutes":5,"summary":"当你讨论“给产品加入 AI”时，首先需要确定要改变哪一个业务环节：识别信息、预测结果、生成内容，还是执行行动。AI 是一组实现能力的方法，产品仍需要清楚的用户、输入、输出与价值标准。本篇建立整个知识库的概念地图，帮助你把已有的产品分析经验连接到技术讨论中。"},{"id":"01-02","title":"分类、回归、聚类与推荐：任务如何定义","file":"content/01-02.md","level":"基础理解","prerequisites":["01-01"],"aliases":["AI","ML","DL","机器学习","概率","统计"],"module":"01","moduleTitle":"AI 全景与基础认知","html":"<p>“让机器从数据中学习”仍然过于宽泛。理解监督学习、无监督学习和强化学习的差别，可以帮助产品经理判断项目需要什么数据、目标是否可表达，以及团队所说的“训练”具体指什么。三者的核心差异在于学习信号从哪里来。<\/p><h2 id=\"section-1\">监督学习：有示范结果的归纳<\/h2><p>监督学习使用带有目标答案的数据。输入可以是一封工单，标签是“设备故障”；也可以是一组设备读数，目标是剩余寿命。分类预测离散类别，回归预测连续数值。训练过程寻找一种映射，使模型对样本的预测尽量接近标签，并希望这种规律对未见过的新样本仍有效。<\/p><p>产品经理需要关注标签的含义。把“最终转交部门”作为工单标签，可能把组织中的错误转交也当成正确答案。把“客户点击”作为满意度标签，则可能让系统学习标题吸引力，而非内容帮助程度。数据中的结果是某种可观测信号，是否等于用户真正需要的目标，需要单独论证。<\/p><h2 id=\"section-2\">无监督学习：从数据结构寻找模式<\/h2><p>无监督学习不依赖每条样本都有人工指定的目标答案，常见任务包括聚类、降维和表示学习。聚类根据相似性把样本分组，例如从海量反馈中寻找主题；降维用较少维度保留重要结构，方便分析或后续建模。但算法发现的“相似”取决于表示方法、距离和参数，并不天然等于业务上的同一类。<\/p><p>教学构造例子：用户反馈被聚成“页面慢”和“操作复杂”两组，可以辅助分析；若把这两组直接命名为“性能问题”和“新手问题”，就已经加入了人的解释。聚类本身不会自动证明原因。低频但严重的安全问题也可能被当作离群点，因此不能只看大簇就决定优先级。<\/p><h2 id=\"section-3\">自监督学习：答案由数据本身构造<\/h2><p>现代大模型常用自监督任务从大量未逐条人工标注的数据中学习。例如给定一段文本的前半部分，预测后续 Token；目标来自原文本本身。它在训练形式上仍有输入与目标，但目标不需要人工为每条记录单独撰写。自监督学习应与“完全没有训练目标”区分。<\/p><p>这解释了为什么模型能从海量文本中获得广泛的语言规律，却不能保证每一个输出真实可靠。训练目标可能是预测文本，而用户希望它准确回答、正确调用工具并遵守业务规则，两者之间需要后训练、上下文设计、系统约束和评估来连接。<\/p><h2 id=\"section-4\">强化学习：根据行动后果调整策略<\/h2><p>强化学习通常描述一个智能体与环境交互：观察状态、选择动作、获得奖励，再调整策略以提高长期回报。奖励可以延迟出现，因此需要考虑当前动作对后续结果的影响。例如游戏中的一步操作可能不立即得分，却影响最终胜负。训练中的探索会尝试不确定的行动，这与线上产品的安全运行是不同的问题。<\/p><p>产品中的“Agent”不等于每次使用时都在进行强化学习。一个调用大模型和工具的助手，可以在固定参数下完成任务，完全不更新模型。用户反馈也不会自动转化为训练，除非系统明确收集、处理并用于更新策略。描述产品能力时，需要把运行时执行与离线训练分开。<\/p><h2 id=\"section-5\">目标选错，比方法选错更难修复<\/h2><p>教学构造例子：客服 Agent 的奖励若只看“尽快结束会话”，可能倾向于过早关闭问题；只看客户点赞，可能倾向于无条件答应请求。目标应组合任务完成、正确性、用户体验和约束，并考虑被优化后的副作用。指标一旦成为优化目标，人或模型都可能找到偏离真实价值的路径。<\/p><p>讨论方案时，可先问四件事：预测的目标是什么，训练信号怎样获得，能否代表真正需求，哪些错误不能由平均分掩盖。这样即使不训练模型，也能有效参与数据和评估决策。随后再考虑成本、数据量和适用方法，技术选择就有了清楚的业务依据。<\/p><h2 id=\"section-6\">分类、回归与推荐的产品区别<\/h2><p>分类的目标是类别，例如“紧急、普通”；回归预测数量，例如预计处理时长。评价分类要看不同错误的代价，评价回归要关注误差大小、方向和业务容忍范围。推荐通常还涉及候选召回、排序和展示策略，其目标不只是猜中下一次点击，还可能涉及多样性、新内容探索和长期价值。相同数据可以支持不同任务，但目标改变后，训练标签与上线反馈也必须重新设计。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/supervised_learning.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Supervised learning<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/modules/clustering.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Clustering<\/a><\/li><\/ul><p>核验日期：2026-11-14。案例为教学构造，方法之间存在组合与交叉，本文按产品判断所需的核心区别展开。<\/p>","toc":[{"id":"section-1","title":"监督学习：有示范结果的归纳","level":2},{"id":"section-2","title":"无监督学习：从数据结构寻找模式","level":2},{"id":"section-3","title":"自监督学习：答案由数据本身构造","level":2},{"id":"section-4","title":"强化学习：根据行动后果调整策略","level":2},{"id":"section-5","title":"目标选错，比方法选错更难修复","level":2},{"id":"section-6","title":"分类、回归与推荐的产品区别","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"“让机器从数据中学习”仍然过于宽泛。理解监督学习、无监督学习和强化学习的差别，可以帮助产品经理判断项目需要什么数据、目标是否可表达，以及团队所说的“训练”具体指什么。三者的核心差异在于学习信号从哪里来。\n\n## 监督学习：有示范结果的归纳\n\n监督学习使用带有目标答案的数据。输入可以是一封工单，标签是“设备故障”；也可以是一组设备读数，目标是剩余寿命。分类预测离散类别，回归预测连续数值。训练过程寻找一种映射，使模型对样本的预测尽量接近标签，并希望这种规律对未见过的新样本仍有效。\n\n产品经理需要关注标签的含义。把“最终转交部门”作为工单标签，可能把组织中的错误转交也当成正确答案。把“客户点击”作为满意度标签，则可能让系统学习标题吸引力，而非内容帮助程度。数据中的结果是某种可观测信号，是否等于用户真正需要的目标，需要单独论证。\n\n## 无监督学习：从数据结构寻找模式\n\n无监督学习不依赖每条样本都有人工指定的目标答案，常见任务包括聚类、降维和表示学习。聚类根据相似性把样本分组，例如从海量反馈中寻找主题；降维用较少维度保留重要结构，方便分析或后续建模。但算法发现的“相似”取决于表示方法、距离和参数，并不天然等于业务上的同一类。\n\n教学构造例子：用户反馈被聚成“页面慢”和“操作复杂”两组，可以辅助分析；若把这两组直接命名为“性能问题”和“新手问题”，就已经加入了人的解释。聚类本身不会自动证明原因。低频但严重的安全问题也可能被当作离群点，因此不能只看大簇就决定优先级。\n\n## 自监督学习：答案由数据本身构造\n\n现代大模型常用自监督任务从大量未逐条人工标注的数据中学习。例如给定一段文本的前半部分，预测后续 Token；目标来自原文本本身。它在训练形式上仍有输入与目标，但目标不需要人工为每条记录单独撰写。自监督学习应与“完全没有训练目标”区分。\n\n这解释了为什么模型能从海量文本中获得广泛的语言规律，却不能保证每一个输出真实可靠。训练目标可能是预测文本，而用户希望它准确回答、正确调用工具并遵守业务规则，两者之间需要后训练、上下文设计、系统约束和评估来连接。\n\n## 强化学习：根据行动后果调整策略\n\n强化学习通常描述一个智能体与环境交互：观察状态、选择动作、获得奖励，再调整策略以提高长期回报。奖励可以延迟出现，因此需要考虑当前动作对后续结果的影响。例如游戏中的一步操作可能不立即得分，却影响最终胜负。训练中的探索会尝试不确定的行动，这与线上产品的安全运行是不同的问题。\n\n产品中的“Agent”不等于每次使用时都在进行强化学习。一个调用大模型和工具的助手，可以在固定参数下完成任务，完全不更新模型。用户反馈也不会自动转化为训练，除非系统明确收集、处理并用于更新策略。描述产品能力时，需要把运行时执行与离线训练分开。\n\n## 目标选错，比方法选错更难修复\n\n教学构造例子：客服 Agent 的奖励若只看“尽快结束会话”，可能倾向于过早关闭问题；只看客户点赞，可能倾向于无条件答应请求。目标应组合任务完成、正确性、用户体验和约束，并考虑被优化后的副作用。指标一旦成为优化目标，人或模型都可能找到偏离真实价值的路径。\n\n讨论方案时，可先问四件事：预测的目标是什么，训练信号怎样获得，能否代表真正需求，哪些错误不能由平均分掩盖。这样即使不训练模型，也能有效参与数据和评估决策。随后再考虑成本、数据量和适用方法，技术选择就有了清楚的业务依据。\n\n## 分类、回归与推荐的产品区别\n\n分类的目标是类别，例如“紧急、普通”；回归预测数量，例如预计处理时长。评价分类要看不同错误的代价，评价回归要关注误差大小、方向和业务容忍范围。推荐通常还涉及候选召回、排序和展示策略，其目标不只是猜中下一次点击，还可能涉及多样性、新内容探索和长期价值。相同数据可以支持不同任务，但目标改变后，训练标签与上线反馈也必须重新设计。\n\n## 资料与延伸阅读\n\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n- [scikit-learn：Supervised learning](https://scikit-learn.org/stable/supervised_learning.html)\n- [scikit-learn：Clustering](https://scikit-learn.org/stable/modules/clustering.html)\n\n核验日期：2026-11-14。案例为教学构造，方法之间存在组合与交叉，本文按产品判断所需的核心区别展开。\n","chars":1428,"minutes":5,"summary":"“让机器从数据中学习”仍然过于宽泛。理解监督学习、无监督学习和强化学习的差别，可以帮助产品经理判断项目需要什么数据、目标是否可表达，以及团队所说的“训练”具体指什么。三者的核心差异在于学习信号从哪里来。"},{"id":"01-03","title":"训练、验证与泛化：模型怎样学会规律","file":"content/01-03.md","level":"基础理解","prerequisites":["01-02"],"aliases":["AI","ML","DL","机器学习","概率","统计"],"module":"01","moduleTitle":"AI 全景与基础认知","html":"<p>训练集上表现优秀，只能说明模型适应了见过的数据。产品上线面对的是新的用户、时间和输入，真正需要的是泛化：学到可迁移的规律。过拟合、欠拟合与分布变化解释了许多“测试时很好、使用时很差”的现象。<\/p><h2 id=\"section-1\">过拟合如何发生<\/h2><p>假设你根据少量历史工单制定规则。记住每一条工单的措辞，可以完美解释过去，却未必理解新客户的表达。模型也可能利用偶然相关或噪声降低训练损失。模型容量过大、样本不足、训练过久或数据过于单一，都可能加剧这种问题。训练表现与未见数据表现之间的差距，是需要关注的信号。<\/p><p>欠拟合则表示模型连训练数据中的主要规律也未充分学到，原因可能是表达能力不足、输入信息不够、训练不充分或特征处理不合理。二者不能只凭一个分数区分，需要同时观察训练和验证表现，并检查数据过程。若标签本身高度不一致，任何模型都可能难以达到期望。<\/p><h2 id=\"section-2\">为什么要分训练、验证和测试<\/h2><p>训练集用于更新参数；验证集用于选择模型、超参数和方案；测试集用于在方案确定后估计未见数据表现。如果反复根据测试集结果修改方案，测试集也逐渐变成了开发材料，最终分数会偏乐观。一次真正的独立评估需要保护样本及其使用流程。<\/p><p>教学构造例子：同一客户的多封相似工单被随机分到训练和测试两边，模型可能凭客户模板取得高分。实际目标若是服务新客户，应按客户分组切分。预测未来表现则可能需要时间切分，避免使用未来信息。这说明切分方式应模拟真实部署条件，而不是机械地随机分成几个百分比。<\/p><h2 id=\"section-3\">交叉验证能解决什么<\/h2><p>交叉验证通过多次划分训练与验证部分，观察模型在不同样本上的表现，有助于减少单次划分偶然性的影响。但它不能自动修复泄漏、样本偏差或错误任务定义。时间序列、用户分组和重复文档仍需要对应的划分策略。计算多次平均分，不等于获得多个完全独立的真实世界实验。<\/p><p>正则化、提前停止和数据扩充等方法可以限制过度拟合；它们各有条件。数据扩充若改变了标签含义，就会制造噪声。为了让模型“更稳”而过强限制能力，也可能导致欠拟合。需要通过与业务相符的验证集比较效果，而不是把某个技巧当作通用配方。<\/p><h2 id=\"section-4\">分布变化是上线后的持续问题<\/h2><p>即使离线评估可靠，线上输入仍可能变化。新客户使用不同术语，季节改变设备工况，新版本改变界面和业务规则，都可能使历史规律不再适用。输入分布变化与目标关系变化并不相同：客户构成变了，不一定意味着模型失效；规则变了，即使输入外观相似，也可能需要调整。<\/p><p>因此上线监控应结合数据与结果。观察输入长度、类别和缺失率可以发现变化，但仍需要用户反馈、抽样审查和任务指标判断实际影响。没有及时标签时，可以采用延迟回收和重点抽样，并明确结论的不确定性。<\/p><h2 id=\"section-5\">把泛化写进产品决策<\/h2><p>报告中应说明模型对什么用户、什么时间和什么输入有效，哪些场景覆盖不足。对于覆盖外输入，可以设计补充信息、人工接管或明确的服务边界。限制范围不是评估失败后的补丁，而是让能力和承诺保持一致的方法。<\/p><p>大模型应用同样需要这种思路。提示词在十个演示问题上有效，不能证明面对真实任务仍可靠；知识库加入新部门资料，也可能改变检索行为。保留独立样本、版本化评测集和分组结果，才能判断改进是否真实以及是否产生回退。<\/p><h2 id=\"section-6\">训练曲线怎样帮助区分问题<\/h2><p>若训练与验证都很差，可以检查输入是否包含足够信息、标签是否一致、模型是否表达得出规律以及训练是否充分；若训练持续变好而验证停止改善，可以研究过拟合与数据差异。这些是诊断线索，不是仅凭曲线就能确定根因的规则。验证集本身有偏差，也会误导判断。<\/p><p>提前停止根据验证表现选择训练阶段，正则化限制某些过于复杂的参数配置，数据扩充增加合理变化。这些手段都在控制拟合与泛化的关系。真正需要的不是让训练分数最高，而是在目标部署条件下保持可靠。产品报告应解释选择哪一版以及关键失败如何变化。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://scikit-learn.org/stable/modules/cross_validation.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Cross-validation<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/common_pitfalls.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Common pitfalls<\/a><\/li><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><\/ul><p>核验日期：2026-11-14。工单划分为教学构造例子；数据切分应结合实际任务和依赖结构设计。<\/p>","toc":[{"id":"section-1","title":"过拟合如何发生","level":2},{"id":"section-2","title":"为什么要分训练、验证和测试","level":2},{"id":"section-3","title":"交叉验证能解决什么","level":2},{"id":"section-4","title":"分布变化是上线后的持续问题","level":2},{"id":"section-5","title":"把泛化写进产品决策","level":2},{"id":"section-6","title":"训练曲线怎样帮助区分问题","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"训练集上表现优秀，只能说明模型适应了见过的数据。产品上线面对的是新的用户、时间和输入，真正需要的是泛化：学到可迁移的规律。过拟合、欠拟合与分布变化解释了许多“测试时很好、使用时很差”的现象。\n\n## 过拟合如何发生\n\n假设你根据少量历史工单制定规则。记住每一条工单的措辞，可以完美解释过去，却未必理解新客户的表达。模型也可能利用偶然相关或噪声降低训练损失。模型容量过大、样本不足、训练过久或数据过于单一，都可能加剧这种问题。训练表现与未见数据表现之间的差距，是需要关注的信号。\n\n欠拟合则表示模型连训练数据中的主要规律也未充分学到，原因可能是表达能力不足、输入信息不够、训练不充分或特征处理不合理。二者不能只凭一个分数区分，需要同时观察训练和验证表现，并检查数据过程。若标签本身高度不一致，任何模型都可能难以达到期望。\n\n## 为什么要分训练、验证和测试\n\n训练集用于更新参数；验证集用于选择模型、超参数和方案；测试集用于在方案确定后估计未见数据表现。如果反复根据测试集结果修改方案，测试集也逐渐变成了开发材料，最终分数会偏乐观。一次真正的独立评估需要保护样本及其使用流程。\n\n教学构造例子：同一客户的多封相似工单被随机分到训练和测试两边，模型可能凭客户模板取得高分。实际目标若是服务新客户，应按客户分组切分。预测未来表现则可能需要时间切分，避免使用未来信息。这说明切分方式应模拟真实部署条件，而不是机械地随机分成几个百分比。\n\n## 交叉验证能解决什么\n\n交叉验证通过多次划分训练与验证部分，观察模型在不同样本上的表现，有助于减少单次划分偶然性的影响。但它不能自动修复泄漏、样本偏差或错误任务定义。时间序列、用户分组和重复文档仍需要对应的划分策略。计算多次平均分，不等于获得多个完全独立的真实世界实验。\n\n正则化、提前停止和数据扩充等方法可以限制过度拟合；它们各有条件。数据扩充若改变了标签含义，就会制造噪声。为了让模型“更稳”而过强限制能力，也可能导致欠拟合。需要通过与业务相符的验证集比较效果，而不是把某个技巧当作通用配方。\n\n## 分布变化是上线后的持续问题\n\n即使离线评估可靠，线上输入仍可能变化。新客户使用不同术语，季节改变设备工况，新版本改变界面和业务规则，都可能使历史规律不再适用。输入分布变化与目标关系变化并不相同：客户构成变了，不一定意味着模型失效；规则变了，即使输入外观相似，也可能需要调整。\n\n因此上线监控应结合数据与结果。观察输入长度、类别和缺失率可以发现变化，但仍需要用户反馈、抽样审查和任务指标判断实际影响。没有及时标签时，可以采用延迟回收和重点抽样，并明确结论的不确定性。\n\n## 把泛化写进产品决策\n\n报告中应说明模型对什么用户、什么时间和什么输入有效，哪些场景覆盖不足。对于覆盖外输入，可以设计补充信息、人工接管或明确的服务边界。限制范围不是评估失败后的补丁，而是让能力和承诺保持一致的方法。\n\n大模型应用同样需要这种思路。提示词在十个演示问题上有效，不能证明面对真实任务仍可靠；知识库加入新部门资料，也可能改变检索行为。保留独立样本、版本化评测集和分组结果，才能判断改进是否真实以及是否产生回退。\n\n## 训练曲线怎样帮助区分问题\n\n若训练与验证都很差，可以检查输入是否包含足够信息、标签是否一致、模型是否表达得出规律以及训练是否充分；若训练持续变好而验证停止改善，可以研究过拟合与数据差异。这些是诊断线索，不是仅凭曲线就能确定根因的规则。验证集本身有偏差，也会误导判断。\n\n提前停止根据验证表现选择训练阶段，正则化限制某些过于复杂的参数配置，数据扩充增加合理变化。这些手段都在控制拟合与泛化的关系。真正需要的不是让训练分数最高，而是在目标部署条件下保持可靠。产品报告应解释选择哪一版以及关键失败如何变化。\n\n## 资料与延伸阅读\n\n- [scikit-learn：Cross-validation](https://scikit-learn.org/stable/modules/cross_validation.html)\n- [scikit-learn：Common pitfalls](https://scikit-learn.org/stable/common_pitfalls.html)\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n\n核验日期：2026-11-14。工单划分为教学构造例子；数据切分应结合实际任务和依赖结构设计。\n","chars":1436,"minutes":6,"summary":"训练集上表现优秀，只能说明模型适应了见过的数据。产品上线面对的是新的用户、时间和输入，真正需要的是泛化：学到可迁移的规律。过拟合、欠拟合与分布变化解释了许多“测试时很好、使用时很差”的现象。"},{"id":"01-04","title":"神经网络、损失与梯度：深度学习的直觉","file":"content/01-04.md","level":"基础理解","prerequisites":["01-03"],"aliases":["AI","ML","DL","机器学习","概率","统计"],"module":"01","moduleTitle":"AI 全景与基础认知","html":"<p>模型训练可以理解为：先定义一种可调整的预测方法，再用数据反复修正它。参数决定当前模型怎样输出，损失衡量输出与训练目标的差距，优化算法决定参数如何更新。理解这条链路，比记住某个算法名称更有助于与技术团队沟通。<\/p><h2 id=\"section-1\">用一个小模型看清流程<\/h2><p>教学构造例子：用运行时长预测设备耗电量，先设模型为“耗电量＝系数×时长＋偏移量”。系数和偏移量就是参数。给定真实样本后，模型产生预测；预测与实际值的差距形成误差。选择平方误差作为损失时，大误差会受到更重惩罚。训练就是寻找一组参数，让训练样本上的平均损失较小。<\/p><p>神经网络使用更多层和更多参数，但基本结构仍然是输入、计算、输出、计算损失和更新参数。参数多并不意味着自动正确；训练数据、目标与优化过程共同决定它学到什么。产品目标如果没有被训练信号合理表达，模型可能很好地优化了错误方向。<\/p><h2 id=\"section-2\">梯度提供调整方向<\/h2><p>可以把损失想象为地形高度，参数是当前位置。梯度描述某个参数略微变化时，损失怎样变化；沿着梯度反方向移动，通常尝试降低损失。学习率控制每次走多远。步子太大可能来回越过低点甚至发散，太小则更新缓慢或难以在有限计算时间内取得进展。<\/p><p>这个比喻只帮助建立直觉：真实模型处于高维空间，地形复杂，也不保证找到全局最优。训练会使用小批量数据近似计算更新，因而损失曲线可能波动。看到曲线不是单调下降，不应立即判断训练失败；需要结合整体趋势、验证集和任务结果分析。<\/p><h2 id=\"section-3\">训练轮次与批次不是知识量刻度<\/h2><p>一个批次是一次更新所用的一组样本；一轮通常表示遍历一遍训练数据。增加轮次可能改善拟合，也可能让模型过度记住训练数据。更多计算并不自动带来更好的线上效果，还受到数据质量、模型容量、超参数和任务难度影响。<\/p><p>大模型预训练可能使用自监督目标，例如预测下一个 Token。后训练则可能优化指令遵循、偏好或其他行为。用户提出一个新问题时发生的是推理，一般不会因为这次提问就改写模型参数。把一次对话里的“学会了”与参数训练区分，是理解记忆、上下文和微调的基础。<\/p><h2 id=\"section-4\">损失函数与业务指标的距离<\/h2><p>分类模型可能优化交叉熵，业务却关心漏掉严重故障的数量。语言模型训练损失降低，也不代表回答一定更符合事实。训练损失是工程优化信号；业务指标是产品价值的度量，两者需要通过验证建立关系。不能仅凭训练曲线批准上线。<\/p><p>教学构造例子：在一万条记录中只有一百条故障，模型始终预测“正常”也能获得很高的整体正确率，但会漏掉全部故障。若业务关注故障召回，就需要调整评估与决策阈值，并理解误报带来的检查成本。选择损失和权重时，也要考虑这种不对称代价。<\/p><h2 id=\"section-5\">产品经理需要参与哪些讨论<\/h2><p>训练方案评审应说明目标为何合理、哪些样本更重要、训练和验证数据是否分开、改进是否覆盖关键场景，以及增加训练成本的预期收益。你无需亲自推导优化器，也应能把“损失更低”追问为“哪些用户任务更好了，有何证据”。<\/p><p>当效果停止提升时，原因可能是标签噪声、数据覆盖不足、模型能力受限或目标不匹配。继续增加轮次只是候选动作之一。将失败样本按原因归类，再决定补数据、改目标、换方案或限制产品范围，通常比笼统要求“再训练一下”更可执行。<\/p><h2 id=\"section-6\">神经网络中的层与非线性<\/h2><p>一个神经元先对输入加权求和，再通过某种变换产生输出；多层连接让模型逐步组合特征。非线性使网络能够表达超出简单直线的关系。隐藏层的表示通常不是人工逐一指定，而是在训练中共同调整。网络深并不意味着每一层对应人能命名的业务步骤，不能把结构图直接当作模型的因果解释。<\/p><h2 id=\"section-7\">用数值看一次更新<\/h2><p>沿用简化耗电例子，设模型为 <code>预测值＝w×时长<\/code>，暂不考虑偏移。当运行两小时的实际耗电为六，初始 <code>w＝2<\/code> 时预测为四，平方误差为四。对这个样本，误差随参数的变化可以写成梯度 <code>2×(预测值－实际值)×时长<\/code>，结果为负八。若学习率为零点一，更新后的系数为二点八，预测五点六，误差降到零点一六。<\/p><p>这个例子说明梯度为什么带来方向，以及学习率怎样控制更新幅度。真实训练同时考虑许多样本，且关系通常不是一条直线。一个样本损失降低，不能证明全部任务改善；如果数据单位或标签有错，优化过程仍会认真沿错误目标前进。公式的价值是帮助理解，而不是让产品经理把局部计算当作完整训练证明。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/supervised_learning.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Supervised learning<\/a><\/li><\/ul><p>核验日期：2026-11-14。设备耗电与故障数据为教学构造，不代表可直接用于真实设备建模。<\/p>","toc":[{"id":"section-1","title":"用一个小模型看清流程","level":2},{"id":"section-2","title":"梯度提供调整方向","level":2},{"id":"section-3","title":"训练轮次与批次不是知识量刻度","level":2},{"id":"section-4","title":"损失函数与业务指标的距离","level":2},{"id":"section-5","title":"产品经理需要参与哪些讨论","level":2},{"id":"section-6","title":"神经网络中的层与非线性","level":2},{"id":"section-7","title":"用数值看一次更新","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"模型训练可以理解为：先定义一种可调整的预测方法，再用数据反复修正它。参数决定当前模型怎样输出，损失衡量输出与训练目标的差距，优化算法决定参数如何更新。理解这条链路，比记住某个算法名称更有助于与技术团队沟通。\n\n## 用一个小模型看清流程\n\n教学构造例子：用运行时长预测设备耗电量，先设模型为“耗电量＝系数×时长＋偏移量”。系数和偏移量就是参数。给定真实样本后，模型产生预测；预测与实际值的差距形成误差。选择平方误差作为损失时，大误差会受到更重惩罚。训练就是寻找一组参数，让训练样本上的平均损失较小。\n\n神经网络使用更多层和更多参数，但基本结构仍然是输入、计算、输出、计算损失和更新参数。参数多并不意味着自动正确；训练数据、目标与优化过程共同决定它学到什么。产品目标如果没有被训练信号合理表达，模型可能很好地优化了错误方向。\n\n## 梯度提供调整方向\n\n可以把损失想象为地形高度，参数是当前位置。梯度描述某个参数略微变化时，损失怎样变化；沿着梯度反方向移动，通常尝试降低损失。学习率控制每次走多远。步子太大可能来回越过低点甚至发散，太小则更新缓慢或难以在有限计算时间内取得进展。\n\n这个比喻只帮助建立直觉：真实模型处于高维空间，地形复杂，也不保证找到全局最优。训练会使用小批量数据近似计算更新，因而损失曲线可能波动。看到曲线不是单调下降，不应立即判断训练失败；需要结合整体趋势、验证集和任务结果分析。\n\n## 训练轮次与批次不是知识量刻度\n\n一个批次是一次更新所用的一组样本；一轮通常表示遍历一遍训练数据。增加轮次可能改善拟合，也可能让模型过度记住训练数据。更多计算并不自动带来更好的线上效果，还受到数据质量、模型容量、超参数和任务难度影响。\n\n大模型预训练可能使用自监督目标，例如预测下一个 Token。后训练则可能优化指令遵循、偏好或其他行为。用户提出一个新问题时发生的是推理，一般不会因为这次提问就改写模型参数。把一次对话里的“学会了”与参数训练区分，是理解记忆、上下文和微调的基础。\n\n## 损失函数与业务指标的距离\n\n分类模型可能优化交叉熵，业务却关心漏掉严重故障的数量。语言模型训练损失降低，也不代表回答一定更符合事实。训练损失是工程优化信号；业务指标是产品价值的度量，两者需要通过验证建立关系。不能仅凭训练曲线批准上线。\n\n教学构造例子：在一万条记录中只有一百条故障，模型始终预测“正常”也能获得很高的整体正确率，但会漏掉全部故障。若业务关注故障召回，就需要调整评估与决策阈值，并理解误报带来的检查成本。选择损失和权重时，也要考虑这种不对称代价。\n\n## 产品经理需要参与哪些讨论\n\n训练方案评审应说明目标为何合理、哪些样本更重要、训练和验证数据是否分开、改进是否覆盖关键场景，以及增加训练成本的预期收益。你无需亲自推导优化器，也应能把“损失更低”追问为“哪些用户任务更好了，有何证据”。\n\n当效果停止提升时，原因可能是标签噪声、数据覆盖不足、模型能力受限或目标不匹配。继续增加轮次只是候选动作之一。将失败样本按原因归类，再决定补数据、改目标、换方案或限制产品范围，通常比笼统要求“再训练一下”更可执行。\n\n## 神经网络中的层与非线性\n\n一个神经元先对输入加权求和，再通过某种变换产生输出；多层连接让模型逐步组合特征。非线性使网络能够表达超出简单直线的关系。隐藏层的表示通常不是人工逐一指定，而是在训练中共同调整。网络深并不意味着每一层对应人能命名的业务步骤，不能把结构图直接当作模型的因果解释。\n\n## 用数值看一次更新\n\n沿用简化耗电例子，设模型为 `预测值＝w×时长`，暂不考虑偏移。当运行两小时的实际耗电为六，初始 `w＝2` 时预测为四，平方误差为四。对这个样本，误差随参数的变化可以写成梯度 `2×(预测值－实际值)×时长`，结果为负八。若学习率为零点一，更新后的系数为二点八，预测五点六，误差降到零点一六。\n\n这个例子说明梯度为什么带来方向，以及学习率怎样控制更新幅度。真实训练同时考虑许多样本，且关系通常不是一条直线。一个样本损失降低，不能证明全部任务改善；如果数据单位或标签有错，优化过程仍会认真沿错误目标前进。公式的价值是帮助理解，而不是让产品经理把局部计算当作完整训练证明。\n\n## 资料与延伸阅读\n\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n- [scikit-learn：Supervised learning](https://scikit-learn.org/stable/supervised_learning.html)\n\n核验日期：2026-11-14。设备耗电与故障数据为教学构造，不代表可直接用于真实设备建模。\n","chars":1559,"minutes":6,"summary":"模型训练可以理解为：先定义一种可调整的预测方法，再用数据反复修正它。参数决定当前模型怎样输出，损失衡量输出与训练目标的差距，优化算法决定参数如何更新。理解这条链路，比记住某个算法名称更有助于与技术团队沟通。"},{"id":"01-05","title":"概率与条件概率：理解不确定的输出","file":"content/01-05.md","level":"基础理解","prerequisites":["01-04"],"aliases":["AI","ML","DL","机器学习","概率","统计"],"module":"01","moduleTitle":"AI 全景与基础认知","html":"<p>AI 系统经常给出分数、概率或“置信度”。这些数值容易被误读为事实保证。产品经理需要理解概率表达的对象、条件和校准情况，才能决定何时自动处理、何时请求补充信息，以及如何向用户呈现不确定性。<\/p><h2 id=\"section-1\">概率总是针对某个事件和条件<\/h2><p>“故障概率为百分之八十”缺少必要上下文：什么设备，在多长时间内，基于哪些信息，故障如何定义？只有事件与条件清楚，数值才有可解释性。概率描述不确定性，不表示系统已经观察到事件，也不表示每个单独对象会以某种比例发生。<\/p><p>教学构造例子：一组被预测为约百分之八十故障风险的设备，若长期来看约八成确实在约定时间内故障，可以说这个范围的预测较好校准。它与区分高低风险的能力不同：模型可能排序很好，却把风险数值估得过高。排名、准确性与校准需要分别理解。<\/p><h2 id=\"section-2\">条件概率与基础发生率<\/h2><p>一个检测器“对故障有很高识别率”，仍不足以判断报警后设备有多大可能真故障。还需要知道故障的基础发生率和误报率。若故障极少，即使误报率不高，正常设备产生的误报也可能占报警的大多数。这是基础发生率的重要影响。<\/p><p>用教学构造数字说明：一万台设备中有一百台故障；检测器识别其中九十台，又把九千九百台正常设备中的九十九台误报。总报警为一百八十九台，真实故障约占其中一半。这里“能找到九成故障”与“报警九成可信”是两个完全不同的问题。<\/p><h2 id=\"section-3\">分数不自动等于概率<\/h2><p>相似度、分类分数、排序分、模型裁判分和语言模型生成的自信程度，含义各不相同。向量余弦相似度高，不表示答案正确概率同样高；模型在文本里写“我有九成把握”，也不等于经过校准的风险估计。没有验证依据时，界面不宜把任意分数包装为精确概率。<\/p><p>语言模型下一个 Token 的概率，描述在当前上下文中不同 Token 的相对可能性。它不直接衡量整个答案的事实可靠程度。一个常见但错误的说法也可能得到很高生成概率；一个正确但罕见的事实可能概率较低。这是生成概率与知识真实性之间的重要边界。<\/p><h2 id=\"section-4\">阈值体现业务代价<\/h2><p>自动化决策往往需要阈值：风险高于某值则告警，分类把握不足则转人工。阈值没有脱离业务的最佳值。降低阈值可能减少漏报但增加人工检查；提高阈值可能节约处理量却错失重要问题。应结合错误代价、处理能力和用户预期评估。<\/p><p>如果严重错误代价极高，可以采用多条件门槛，而非单一分数，例如要求命中明确资料、关键字段齐全、工具结果可验证，再允许自动执行。对其他任务则可先展示建议，让用户决定。概率信息应该参与决策设计，而不是代替业务规则。<\/p><h2 id=\"section-5\">不确定性应怎样表达<\/h2><p>产品可以说明证据来源、缺失条件和可采取的下一步。例如“未找到适用于此型号的维修手册，请确认设备编号”，比没有依据的数字更有行动价值。需要注意，不确定性提示也会增加阅读负担，应针对对结果有影响的地方提供，而非每段话都附带相同警告。<\/p><p>评估时，可以比较不同风险区间的实际错误率，分析某些用户群体是否系统性偏差，并观察阈值变化如何影响任务完成和人工负担。对概率的理解最终服务于更合适的自动化边界，以及更诚实、可控制的人机协作。<\/p><h2 id=\"section-6\">随机性与知识不足并不相同<\/h2><p>某些不确定性来自事件本身的波动，另一些来自数据不足、模型不了解当前场景或关键条件缺失。增加证据可能减少后一类问题，却不一定消除前一类。产品应区分“需要更多信息”“此类输入超出支持范围”和“结果本身存在概率”，因为它们对应不同的用户行动。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/supervised_learning.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Supervised learning<\/a><\/li><\/ul><p>核验日期：2026-11-14。设备数量和比例为教学构造，仅用于解释条件概率与基础发生率。<\/p>","toc":[{"id":"section-1","title":"概率总是针对某个事件和条件","level":2},{"id":"section-2","title":"条件概率与基础发生率","level":2},{"id":"section-3","title":"分数不自动等于概率","level":2},{"id":"section-4","title":"阈值体现业务代价","level":2},{"id":"section-5","title":"不确定性应怎样表达","level":2},{"id":"section-6","title":"随机性与知识不足并不相同","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"AI 系统经常给出分数、概率或“置信度”。这些数值容易被误读为事实保证。产品经理需要理解概率表达的对象、条件和校准情况，才能决定何时自动处理、何时请求补充信息，以及如何向用户呈现不确定性。\n\n## 概率总是针对某个事件和条件\n\n“故障概率为百分之八十”缺少必要上下文：什么设备，在多长时间内，基于哪些信息，故障如何定义？只有事件与条件清楚，数值才有可解释性。概率描述不确定性，不表示系统已经观察到事件，也不表示每个单独对象会以某种比例发生。\n\n教学构造例子：一组被预测为约百分之八十故障风险的设备，若长期来看约八成确实在约定时间内故障，可以说这个范围的预测较好校准。它与区分高低风险的能力不同：模型可能排序很好，却把风险数值估得过高。排名、准确性与校准需要分别理解。\n\n## 条件概率与基础发生率\n\n一个检测器“对故障有很高识别率”，仍不足以判断报警后设备有多大可能真故障。还需要知道故障的基础发生率和误报率。若故障极少，即使误报率不高，正常设备产生的误报也可能占报警的大多数。这是基础发生率的重要影响。\n\n用教学构造数字说明：一万台设备中有一百台故障；检测器识别其中九十台，又把九千九百台正常设备中的九十九台误报。总报警为一百八十九台，真实故障约占其中一半。这里“能找到九成故障”与“报警九成可信”是两个完全不同的问题。\n\n## 分数不自动等于概率\n\n相似度、分类分数、排序分、模型裁判分和语言模型生成的自信程度，含义各不相同。向量余弦相似度高，不表示答案正确概率同样高；模型在文本里写“我有九成把握”，也不等于经过校准的风险估计。没有验证依据时，界面不宜把任意分数包装为精确概率。\n\n语言模型下一个 Token 的概率，描述在当前上下文中不同 Token 的相对可能性。它不直接衡量整个答案的事实可靠程度。一个常见但错误的说法也可能得到很高生成概率；一个正确但罕见的事实可能概率较低。这是生成概率与知识真实性之间的重要边界。\n\n## 阈值体现业务代价\n\n自动化决策往往需要阈值：风险高于某值则告警，分类把握不足则转人工。阈值没有脱离业务的最佳值。降低阈值可能减少漏报但增加人工检查；提高阈值可能节约处理量却错失重要问题。应结合错误代价、处理能力和用户预期评估。\n\n如果严重错误代价极高，可以采用多条件门槛，而非单一分数，例如要求命中明确资料、关键字段齐全、工具结果可验证，再允许自动执行。对其他任务则可先展示建议，让用户决定。概率信息应该参与决策设计，而不是代替业务规则。\n\n## 不确定性应怎样表达\n\n产品可以说明证据来源、缺失条件和可采取的下一步。例如“未找到适用于此型号的维修手册，请确认设备编号”，比没有依据的数字更有行动价值。需要注意，不确定性提示也会增加阅读负担，应针对对结果有影响的地方提供，而非每段话都附带相同警告。\n\n评估时，可以比较不同风险区间的实际错误率，分析某些用户群体是否系统性偏差，并观察阈值变化如何影响任务完成和人工负担。对概率的理解最终服务于更合适的自动化边界，以及更诚实、可控制的人机协作。\n\n## 随机性与知识不足并不相同\n\n某些不确定性来自事件本身的波动，另一些来自数据不足、模型不了解当前场景或关键条件缺失。增加证据可能减少后一类问题，却不一定消除前一类。产品应区分“需要更多信息”“此类输入超出支持范围”和“结果本身存在概率”，因为它们对应不同的用户行动。\n\n## 资料与延伸阅读\n\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n- [scikit-learn：Supervised learning](https://scikit-learn.org/stable/supervised_learning.html)\n\n核验日期：2026-11-14。设备数量和比例为教学构造，仅用于解释条件概率与基础发生率。\n","chars":1250,"minutes":5,"summary":"AI 系统经常给出分数、概率或“置信度”。这些数值容易被误读为事实保证。产品经理需要理解概率表达的对象、条件和校准情况，才能决定何时自动处理、何时请求补充信息，以及如何向用户呈现不确定性。"},{"id":"01-06","title":"向量、距离与相似度：从数字到语义","file":"content/01-06.md","level":"基础理解","prerequisites":["01-05"],"aliases":["AI","ML","DL","机器学习","概率","统计"],"module":"01","moduleTitle":"AI 全景与基础认知","html":"<p>向量可以理解为一组按固定顺序排列的数字。它既能表示温度、运行时长等人工定义的特征，也能表示模型从文本、图像中学习到的特征。向量的关键价值在于把复杂对象放进可以计算的空间，让系统能够比较、分类、检索和组合信息。<\/p><h2 id=\"section-1\">从业务字段到数学表示<\/h2><p>假设用“日均使用次数、平均任务时长、付费金额”描述用户，就可以把每个用户表示为三个数字。但这些维度的单位不同，付费金额的数值范围可能远大于使用次数。直接计算距离，结果容易被金额支配。因此表示方法、标准化和距离选择会影响“相似用户”的含义。<\/p><p>Embedding 通常指把对象映射为连续向量的表示。文本 Embedding 模型可能把语义相近的句子放在相近位置。它不是把一句话翻译成具有固定人工含义的若干指标；每一维通常不能简单命名为“积极程度”或“设备相关性”。意义更多体现在整个空间的结构与任务表现中。<\/p><h2 id=\"section-2\">相似度怎样计算<\/h2><p>常见方法包括点积、余弦相似度和欧氏距离。点积同时受到方向和长度影响；余弦相似度更关注方向；欧氏距离关注空间中的几何距离。某些模型和索引假设向量已经归一化，此时不同计算可能存在特定关系。实际选择应遵循模型训练方式和检索系统要求。<\/p><p>教学构造例子：“如何重置设备”和“恢复出厂设置步骤”词面差别大，却可能语义接近；“允许外部访问”和“不允许外部访问”词面很像，业务结论却相反。向量相似度有助于找到相关材料，但不是逻辑等价、事实正确或权限允许的证明。<\/p><h2 id=\"section-3\">为什么不同模型的向量不能随意混用<\/h2><p>两个 Embedding 模型即使输出相同维数，坐标也未必处于相同空间。用模型甲建立文档索引，再用模型乙编码查询，距离可能失去意义。模型版本变化也可能要求重建索引或进行兼容验证。向量维数相同只是结构一致，不代表语义坐标一致。<\/p><p>分词、文本长度、语言、领域和输入格式都会影响表示。长文直接压成一个向量可能丢失局部信息；把设备编号当普通自然语言处理，也可能无法精确匹配。实际搜索常将向量检索与关键词、元数据过滤和重排结合，分别解决语义、精确实体和相关性问题。<\/p><h2 id=\"section-4\">向量搜索只是检索链路的一部分<\/h2><p>知识库通常先解析文档、切分片段、生成向量并建立索引。查询到来后，再编码查询、寻找候选、过滤权限并排序，最后将材料交给模型生成答案。任何环节都可能影响结果：文档切分把限制条件拆开，索引未更新，或者过滤发生得太晚，都会造成问题。<\/p><p>因此评价 Embedding 不能只看某个通用榜单。应使用自己的问题与相关文档，观察重要材料是否被召回、错误材料是否被排在前面，以及更换模型对成本、时延和索引迁移的影响。对长尾型号、数字、否定表达等内容，还需要专项检查。<\/p><h2 id=\"section-5\">产品经理应记住的边界<\/h2><p>向量提供一种可计算的相关性，而业务还需要规则、来源和解释。高相似度可以触发进一步检查，不能直接授权执行动作。界面中的“相关文档”应尽量保留标题、来源、版本和定位，方便用户理解依据。需要精确结论时，应回到文档实际内容与适用条件。<\/p><p>理解向量后，RAG、推荐、聚类和模型内部表示会更容易连接起来。但也应保持区别：同样使用向量，不意味着它们具有相同目标和评估方式。后续检索专题会进一步讨论召回、重排和引用如何组成可靠知识服务。<\/p><h2 id=\"section-6\">表示也需要版本管理<\/h2><p>索引应记录使用的模型标识、向量维数、预处理方式和生成时间。若升级模型后只更新查询侧，相关性可能突然变化。迁移时通常需要准备新索引、比较查询结果、逐步切换并保留回退路径。向量是数据资产的一部分，也需要可追溯的生成过程。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><li><a href=\"https://huggingface.co/docs/transformers/main/en/tokenizer_summary\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：Tokenization algorithms<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/modules/clustering.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Clustering<\/a><\/li><\/ul><p>核验日期：2026-11-14。用户字段和设备句子为教学构造示例；具体向量模型的距离与输入要求需查其文档。<\/p>","toc":[{"id":"section-1","title":"从业务字段到数学表示","level":2},{"id":"section-2","title":"相似度怎样计算","level":2},{"id":"section-3","title":"为什么不同模型的向量不能随意混用","level":2},{"id":"section-4","title":"向量搜索只是检索链路的一部分","level":2},{"id":"section-5","title":"产品经理应记住的边界","level":2},{"id":"section-6","title":"表示也需要版本管理","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"向量可以理解为一组按固定顺序排列的数字。它既能表示温度、运行时长等人工定义的特征，也能表示模型从文本、图像中学习到的特征。向量的关键价值在于把复杂对象放进可以计算的空间，让系统能够比较、分类、检索和组合信息。\n\n## 从业务字段到数学表示\n\n假设用“日均使用次数、平均任务时长、付费金额”描述用户，就可以把每个用户表示为三个数字。但这些维度的单位不同，付费金额的数值范围可能远大于使用次数。直接计算距离，结果容易被金额支配。因此表示方法、标准化和距离选择会影响“相似用户”的含义。\n\nEmbedding 通常指把对象映射为连续向量的表示。文本 Embedding 模型可能把语义相近的句子放在相近位置。它不是把一句话翻译成具有固定人工含义的若干指标；每一维通常不能简单命名为“积极程度”或“设备相关性”。意义更多体现在整个空间的结构与任务表现中。\n\n## 相似度怎样计算\n\n常见方法包括点积、余弦相似度和欧氏距离。点积同时受到方向和长度影响；余弦相似度更关注方向；欧氏距离关注空间中的几何距离。某些模型和索引假设向量已经归一化，此时不同计算可能存在特定关系。实际选择应遵循模型训练方式和检索系统要求。\n\n教学构造例子：“如何重置设备”和“恢复出厂设置步骤”词面差别大，却可能语义接近；“允许外部访问”和“不允许外部访问”词面很像，业务结论却相反。向量相似度有助于找到相关材料，但不是逻辑等价、事实正确或权限允许的证明。\n\n## 为什么不同模型的向量不能随意混用\n\n两个 Embedding 模型即使输出相同维数，坐标也未必处于相同空间。用模型甲建立文档索引，再用模型乙编码查询，距离可能失去意义。模型版本变化也可能要求重建索引或进行兼容验证。向量维数相同只是结构一致，不代表语义坐标一致。\n\n分词、文本长度、语言、领域和输入格式都会影响表示。长文直接压成一个向量可能丢失局部信息；把设备编号当普通自然语言处理，也可能无法精确匹配。实际搜索常将向量检索与关键词、元数据过滤和重排结合，分别解决语义、精确实体和相关性问题。\n\n## 向量搜索只是检索链路的一部分\n\n知识库通常先解析文档、切分片段、生成向量并建立索引。查询到来后，再编码查询、寻找候选、过滤权限并排序，最后将材料交给模型生成答案。任何环节都可能影响结果：文档切分把限制条件拆开，索引未更新，或者过滤发生得太晚，都会造成问题。\n\n因此评价 Embedding 不能只看某个通用榜单。应使用自己的问题与相关文档，观察重要材料是否被召回、错误材料是否被排在前面，以及更换模型对成本、时延和索引迁移的影响。对长尾型号、数字、否定表达等内容，还需要专项检查。\n\n## 产品经理应记住的边界\n\n向量提供一种可计算的相关性，而业务还需要规则、来源和解释。高相似度可以触发进一步检查，不能直接授权执行动作。界面中的“相关文档”应尽量保留标题、来源、版本和定位，方便用户理解依据。需要精确结论时，应回到文档实际内容与适用条件。\n\n理解向量后，RAG、推荐、聚类和模型内部表示会更容易连接起来。但也应保持区别：同样使用向量，不意味着它们具有相同目标和评估方式。后续检索专题会进一步讨论召回、重排和引用如何组成可靠知识服务。\n\n## 表示也需要版本管理\n\n索引应记录使用的模型标识、向量维数、预处理方式和生成时间。若升级模型后只更新查询侧，相关性可能突然变化。迁移时通常需要准备新索引、比较查询结果、逐步切换并保留回退路径。向量是数据资产的一部分，也需要可追溯的生成过程。\n\n## 资料与延伸阅读\n\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n- [Hugging Face：Tokenization algorithms](https://huggingface.co/docs/transformers/main/en/tokenizer_summary)\n- [scikit-learn：Clustering](https://scikit-learn.org/stable/modules/clustering.html)\n\n核验日期：2026-11-14。用户字段和设备句子为教学构造示例；具体向量模型的距离与输入要求需查其文档。\n","chars":1273,"minutes":5,"summary":"向量可以理解为一组按固定顺序排列的数字。它既能表示温度、运行时长等人工定义的特征，也能表示模型从文本、图像中学习到的特征。向量的关键价值在于把复杂对象放进可以计算的空间，让系统能够比较、分类、检索和组合信息。"},{"id":"01-07","title":"统计、抽样与偏差：读懂效果证据","file":"content/01-07.md","level":"基础理解","prerequisites":["01-06"],"aliases":["AI","ML","DL","机器学习","概率","统计"],"module":"01","moduleTitle":"AI 全景与基础认知","html":"<p>AI 产品决策经常依据有限样本：几十个访谈、几百条评测、一次线上实验。统计直觉帮助你判断观察到的差异有多可靠，以及结论能否推广。它不要求先学完完整数学课程，但要求对样本、偏差、波动和因果关系保持清楚。<\/p><h2 id=\"section-1\">样本来自哪里，比数量更先影响结论<\/h2><p>样本是总体的一部分。若只收集愿意主动反馈的用户，通常会偏向特别满意或特别不满意的人。若只评估研发自己编写的问题，可能更贴近已知能力。增加同类样本数量能够减少部分随机波动，却不能自动消除系统性采样偏差。<\/p><p>教学构造例子：某助手在一百条问题上成功九十条。若全部来自同一部门、同一种模板，就不能直接推断其他部门也有相同成功率。报告需要说明样本组成、获取方式与覆盖范围，而不仅是“准确率百分之九十”。对罕见但严重的错误，随机抽样可能还需要重点补充。<\/p><h2 id=\"section-2\">平均值会掩盖哪些差异<\/h2><p>平均时延可能被少量极慢任务拉高，也可能掩盖用户最关心的尾部体验。中位数描述典型位置，分位数描述达到某一比例任务所需的上界。例如高分位延迟可帮助理解较慢用户遇到的体验。不同指标回答不同问题，不应相互替代。<\/p><p>质量同样需要分组看。整体成功率提升，可能来自简单任务占比增加，而复杂任务反而变差。可以按任务类型、用户群、输入长度和风险分层比较；但分组过细后每组样本又会变少。需要在可解释性与统计稳定性之间平衡，并避免事后只挑有利分组。<\/p><h2 id=\"section-3\">差异与随机波动<\/h2><p>有限样本下，结果会随样本变化。九十次成功和九十二次成功，可能反映真实改进，也可能来自随机差异。置信区间表达估计的不确定范围，其具体含义依赖统计方法和假设。样本更大通常能缩小随机不确定性，却不能修复数据泄漏或不合理指标。<\/p><p>语言模型输出本身也可能随机。比较两套提示时，最好尽量使用相同任务、明确评分标准，并记录模型版本和生成设置。对某些高变异任务，可能需要重复运行。一次成功演示只能证明存在成功路径，无法估计平均表现或稳定性。<\/p><h2 id=\"section-4\">相关性不自动构成因果<\/h2><p>采用 AI 功能的客户留存更高，可能是功能产生了价值，也可能是这些客户本来就更活跃。简单前后比较还会受到季节、营销、用户构成变化影响。随机对照实验通过随机分配减少部分混杂因素，但仍需检查实验单位、样本污染、观察时长和指标定义。<\/p><p>产品实验还应同时观察收益与代价。任务完成率上升可能伴随人工复核时间增加；使用次数增长可能来自用户反复纠错。把质量、效率、成本和用户结果放在同一张指标地图中，能避免只优化表面活跃度。<\/p><h2 id=\"section-5\">从数字回到决策<\/h2><p>决策不只取决于差异是否存在，也取决于差异是否足够有业务价值。极小改进即使在大样本下稳定可见，也未必值得增加复杂度和维护成本。反过来，关键风险样本虽然少，也可能足以触发修复，不应等待平均指标显著变差。<\/p><p>一份有用的结论应包含观察到什么、数据来自哪里、有哪些不确定性、影响什么决策，以及下一步需要什么证据。如果你已有产品实验经验，可以将其迁移到 AI，再进一步处理生成随机性、评价主观性和任务长尾等特点；如果尚未承担实验工作，可以先从本篇的样本与指标概念建立基础。统计方法最终服务于更可靠的判断，而不是给结论增加数学装饰。<\/p><h2 id=\"section-6\">事先确定主要指标<\/h2><p>如果同时观察很多指标，并事后挑出最有利的一项，很容易把偶然波动解释为成功。应事先明确主要目标、重要保护指标和停止规则，同时保留探索性发现的身份。这样后续团队才能区分预先验证的结论与值得继续研究的线索。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><li><a href=\"https://scikit-learn.org/stable/modules/cross_validation.html\" target=\"_blank\" rel=\"noopener noreferrer\">scikit-learn：Cross-validation<\/a><\/li><\/ul><p>核验日期：2026-11-14。成功次数与留存关系为教学构造例子；具体区间估计和实验设计需结合数据结构选择方法。<\/p>","toc":[{"id":"section-1","title":"样本来自哪里，比数量更先影响结论","level":2},{"id":"section-2","title":"平均值会掩盖哪些差异","level":2},{"id":"section-3","title":"差异与随机波动","level":2},{"id":"section-4","title":"相关性不自动构成因果","level":2},{"id":"section-5","title":"从数字回到决策","level":2},{"id":"section-6","title":"事先确定主要指标","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"AI 产品决策经常依据有限样本：几十个访谈、几百条评测、一次线上实验。统计直觉帮助你判断观察到的差异有多可靠，以及结论能否推广。它不要求先学完完整数学课程，但要求对样本、偏差、波动和因果关系保持清楚。\n\n## 样本来自哪里，比数量更先影响结论\n\n样本是总体的一部分。若只收集愿意主动反馈的用户，通常会偏向特别满意或特别不满意的人。若只评估研发自己编写的问题，可能更贴近已知能力。增加同类样本数量能够减少部分随机波动，却不能自动消除系统性采样偏差。\n\n教学构造例子：某助手在一百条问题上成功九十条。若全部来自同一部门、同一种模板，就不能直接推断其他部门也有相同成功率。报告需要说明样本组成、获取方式与覆盖范围，而不仅是“准确率百分之九十”。对罕见但严重的错误，随机抽样可能还需要重点补充。\n\n## 平均值会掩盖哪些差异\n\n平均时延可能被少量极慢任务拉高，也可能掩盖用户最关心的尾部体验。中位数描述典型位置，分位数描述达到某一比例任务所需的上界。例如高分位延迟可帮助理解较慢用户遇到的体验。不同指标回答不同问题，不应相互替代。\n\n质量同样需要分组看。整体成功率提升，可能来自简单任务占比增加，而复杂任务反而变差。可以按任务类型、用户群、输入长度和风险分层比较；但分组过细后每组样本又会变少。需要在可解释性与统计稳定性之间平衡，并避免事后只挑有利分组。\n\n## 差异与随机波动\n\n有限样本下，结果会随样本变化。九十次成功和九十二次成功，可能反映真实改进，也可能来自随机差异。置信区间表达估计的不确定范围，其具体含义依赖统计方法和假设。样本更大通常能缩小随机不确定性，却不能修复数据泄漏或不合理指标。\n\n语言模型输出本身也可能随机。比较两套提示时，最好尽量使用相同任务、明确评分标准，并记录模型版本和生成设置。对某些高变异任务，可能需要重复运行。一次成功演示只能证明存在成功路径，无法估计平均表现或稳定性。\n\n## 相关性不自动构成因果\n\n采用 AI 功能的客户留存更高，可能是功能产生了价值，也可能是这些客户本来就更活跃。简单前后比较还会受到季节、营销、用户构成变化影响。随机对照实验通过随机分配减少部分混杂因素，但仍需检查实验单位、样本污染、观察时长和指标定义。\n\n产品实验还应同时观察收益与代价。任务完成率上升可能伴随人工复核时间增加；使用次数增长可能来自用户反复纠错。把质量、效率、成本和用户结果放在同一张指标地图中，能避免只优化表面活跃度。\n\n## 从数字回到决策\n\n决策不只取决于差异是否存在，也取决于差异是否足够有业务价值。极小改进即使在大样本下稳定可见，也未必值得增加复杂度和维护成本。反过来，关键风险样本虽然少，也可能足以触发修复，不应等待平均指标显著变差。\n\n一份有用的结论应包含观察到什么、数据来自哪里、有哪些不确定性、影响什么决策，以及下一步需要什么证据。如果你已有产品实验经验，可以将其迁移到 AI，再进一步处理生成随机性、评价主观性和任务长尾等特点；如果尚未承担实验工作，可以先从本篇的样本与指标概念建立基础。统计方法最终服务于更可靠的判断，而不是给结论增加数学装饰。\n\n## 事先确定主要指标\n\n如果同时观察很多指标，并事后挑出最有利的一项，很容易把偶然波动解释为成功。应事先明确主要目标、重要保护指标和停止规则，同时保留探索性发现的身份。这样后续团队才能区分预先验证的结论与值得继续研究的线索。\n\n## 资料与延伸阅读\n\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n- [scikit-learn：Cross-validation](https://scikit-learn.org/stable/modules/cross_validation.html)\n\n核验日期：2026-11-14。成功次数与留存关系为教学构造例子；具体区间估计和实验设计需结合数据结构选择方法。\n","chars":1286,"minutes":5,"summary":"AI 产品决策经常依据有限样本：几十个访谈、几百条评测、一次线上实验。统计直觉帮助你判断观察到的差异有多可靠，以及结论能否推广。它不要求先学完完整数学课程，但要求对样本、偏差、波动和因果关系保持清楚。"},{"id":"01-08","title":"强化学习：奖励、策略与长期目标","file":"content/01-08.md","level":"基础理解","prerequisites":["01-07"],"aliases":["AI","ML","DL","机器学习","概率","统计"],"module":"01","moduleTitle":"AI 全景与基础认知","html":"<p>强化学习关注连续决策：系统在环境中行动，观察结果并获得奖励，逐步形成更有利的策略。理解它，有助于分清模型如何被训练、产品运行时如何执行，以及目标为什么需要认真设计。并非所有 Agent 都使用强化学习，也并非每次用户反馈都会自动训练模型。<\/p><h2 id=\"section-1\">状态、动作、奖励与策略<\/h2><p>状态描述当前可用于决策的信息；动作是系统能够选择的行为；奖励是环境对行为结果提供的信号；策略规定在某种观察下如何选择动作。环境会随动作和其他因素变化。强化学习优化的往往是未来一段时间内的累计回报，而非只看下一步是否获利。<\/p><p>教学构造例子：仓库机器人选择绕行可能暂时更慢，却避免拥堵并缩短整个任务时间。若每一步只奖励距离终点更近，它可能陷入障碍附近。状态中是否包含地图、拥堵和电量，奖励是否体现安全与整体完成，都影响学到的行为。任务定义的一点变化，可能改变最优策略。<\/p><h2 id=\"section-2\">延迟奖励与信用分配<\/h2><p>当成功只在最后发生时，系统需要判断前面哪些动作起到了作用，这称为信用分配问题。一段长任务可能包含许多中间步骤，最终失败不一定意味着每一步都错。对 AI 产品而言，这也提示我们：只记录整体成败，往往不足以定位改进位置，应保留阶段结果和执行证据。<\/p><p>折扣因子是常见概念，用来表达未来奖励相对于当前奖励的权重。更重视短期结果，可能忽略长期影响；过度追求遥远收益，也可能使学习困难。产品中的用户留存、售后成本和信任同样具有长期效应，因此用短期点击或会话结束来代表整体价值，需要特别谨慎。<\/p><h2 id=\"section-3\">探索与利用的取舍<\/h2><p>系统可以利用已知较好的策略，也可以尝试不确定动作以获得信息。探索可能找到更优方案，也可能带来损失。真实世界的设备控制、资金操作和客户沟通往往不能随意探索，因此训练常借助仿真、离线数据、受控环境或严格约束。训练环境中的探索许可不能直接转移到线上产品。<\/p><p>多臂老虎机问题是较简化的决策形式，常用于理解探索与利用；一般强化学习还要处理动作对后续状态的影响。不要把任何动态推荐都笼统称为强化学习，也不要因系统会调整就认为它在学习策略。需要确认是否真的存在参数更新与明确的优化过程。<\/p><h2 id=\"section-4\">奖励为何可能偏离真实目标<\/h2><p>教学构造例子：客服系统若只奖励快速结束会话，可能倾向于过早关闭问题；若只奖励用户点赞，可能过度承诺。奖励只是目标的近似表达，优化越强，越可能暴露近似中的漏洞。约束、安全规则、质量指标和人工审查需要与奖励共同设计。<\/p><p>奖励黑客可以理解为系统找到高得分但不符合设计意图的路径。处理方法不只是增加几条惩罚，还包括重新定义任务、改善反馈、限制行动空间以及使用独立评估。训练和评价使用同一个有缺陷指标，可能使团队更难发现偏离。<\/p><h2 id=\"section-5\">与大模型后训练的关系<\/h2><p>部分大模型后训练会利用人类或其他反馈构建奖励，再优化模型行为。偏好优化也可以采用不同技术路线，并不全都需要完整的在线强化学习流程。后训练改变模型参数；部署后的 Agent 通常是在固定模型下调用工具和管理状态。这两层即使都使用智能体术语，工程含义仍需分开。<\/p><p>用户在对话中纠正模型后，系统可能只是把纠正加入上下文，或者保存为用户偏好。只有存在明确的数据回收、训练与发布流程，反馈才可能用于后续模型更新。向用户说明学习能力时，应描述实际保存与更新机制，避免让人误以为每次聊天都会永久改变模型。<\/p><h2 id=\"section-6\">产品经理的工作判断<\/h2><p>你需要理解奖励信号代表什么，哪些重要结果尚未进入指标，探索发生在何种环境，以及哪些行为由硬约束限制。对于长任务，还应关注阶段性反馈、终止条件与失败恢复。强化学习的价值在于帮助理解连续决策及目标优化，不能替代业务责任和安全设计。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><li><a href=\"https://arxiv.org/abs/2203.02155\" target=\"_blank\" rel=\"noopener noreferrer\">InstructGPT 原论文<\/a><\/li><li><a href=\"https://arxiv.org/abs/2305.18290\" target=\"_blank\" rel=\"noopener noreferrer\">Direct Preference Optimization 原论文<\/a><\/li><\/ul><p>核验日期：2026-11-14。机器人与客服奖励为教学构造示例；具体后训练算法需结合模型技术报告判断。<\/p>","toc":[{"id":"section-1","title":"状态、动作、奖励与策略","level":2},{"id":"section-2","title":"延迟奖励与信用分配","level":2},{"id":"section-3","title":"探索与利用的取舍","level":2},{"id":"section-4","title":"奖励为何可能偏离真实目标","level":2},{"id":"section-5","title":"与大模型后训练的关系","level":2},{"id":"section-6","title":"产品经理的工作判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"强化学习关注连续决策：系统在环境中行动，观察结果并获得奖励，逐步形成更有利的策略。理解它，有助于分清模型如何被训练、产品运行时如何执行，以及目标为什么需要认真设计。并非所有 Agent 都使用强化学习，也并非每次用户反馈都会自动训练模型。\n\n## 状态、动作、奖励与策略\n\n状态描述当前可用于决策的信息；动作是系统能够选择的行为；奖励是环境对行为结果提供的信号；策略规定在某种观察下如何选择动作。环境会随动作和其他因素变化。强化学习优化的往往是未来一段时间内的累计回报，而非只看下一步是否获利。\n\n教学构造例子：仓库机器人选择绕行可能暂时更慢，却避免拥堵并缩短整个任务时间。若每一步只奖励距离终点更近，它可能陷入障碍附近。状态中是否包含地图、拥堵和电量，奖励是否体现安全与整体完成，都影响学到的行为。任务定义的一点变化，可能改变最优策略。\n\n## 延迟奖励与信用分配\n\n当成功只在最后发生时，系统需要判断前面哪些动作起到了作用，这称为信用分配问题。一段长任务可能包含许多中间步骤，最终失败不一定意味着每一步都错。对 AI 产品而言，这也提示我们：只记录整体成败，往往不足以定位改进位置，应保留阶段结果和执行证据。\n\n折扣因子是常见概念，用来表达未来奖励相对于当前奖励的权重。更重视短期结果，可能忽略长期影响；过度追求遥远收益，也可能使学习困难。产品中的用户留存、售后成本和信任同样具有长期效应，因此用短期点击或会话结束来代表整体价值，需要特别谨慎。\n\n## 探索与利用的取舍\n\n系统可以利用已知较好的策略，也可以尝试不确定动作以获得信息。探索可能找到更优方案，也可能带来损失。真实世界的设备控制、资金操作和客户沟通往往不能随意探索，因此训练常借助仿真、离线数据、受控环境或严格约束。训练环境中的探索许可不能直接转移到线上产品。\n\n多臂老虎机问题是较简化的决策形式，常用于理解探索与利用；一般强化学习还要处理动作对后续状态的影响。不要把任何动态推荐都笼统称为强化学习，也不要因系统会调整就认为它在学习策略。需要确认是否真的存在参数更新与明确的优化过程。\n\n## 奖励为何可能偏离真实目标\n\n教学构造例子：客服系统若只奖励快速结束会话，可能倾向于过早关闭问题；若只奖励用户点赞，可能过度承诺。奖励只是目标的近似表达，优化越强，越可能暴露近似中的漏洞。约束、安全规则、质量指标和人工审查需要与奖励共同设计。\n\n奖励黑客可以理解为系统找到高得分但不符合设计意图的路径。处理方法不只是增加几条惩罚，还包括重新定义任务、改善反馈、限制行动空间以及使用独立评估。训练和评价使用同一个有缺陷指标，可能使团队更难发现偏离。\n\n## 与大模型后训练的关系\n\n部分大模型后训练会利用人类或其他反馈构建奖励，再优化模型行为。偏好优化也可以采用不同技术路线，并不全都需要完整的在线强化学习流程。后训练改变模型参数；部署后的 Agent 通常是在固定模型下调用工具和管理状态。这两层即使都使用智能体术语，工程含义仍需分开。\n\n用户在对话中纠正模型后，系统可能只是把纠正加入上下文，或者保存为用户偏好。只有存在明确的数据回收、训练与发布流程，反馈才可能用于后续模型更新。向用户说明学习能力时，应描述实际保存与更新机制，避免让人误以为每次聊天都会永久改变模型。\n\n## 产品经理的工作判断\n\n你需要理解奖励信号代表什么，哪些重要结果尚未进入指标，探索发生在何种环境，以及哪些行为由硬约束限制。对于长任务，还应关注阶段性反馈、终止条件与失败恢复。强化学习的价值在于帮助理解连续决策及目标优化，不能替代业务责任和安全设计。\n\n## 资料与延伸阅读\n\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n- [InstructGPT 原论文](https://arxiv.org/abs/2203.02155)\n- [Direct Preference Optimization 原论文](https://arxiv.org/abs/2305.18290)\n\n核验日期：2026-11-14。机器人与客服奖励为教学构造示例；具体后训练算法需结合模型技术报告判断。\n","chars":1363,"minutes":5,"summary":"强化学习关注连续决策：系统在环境中行动，观察结果并获得奖励，逐步形成更有利的策略。理解它，有助于分清模型如何被训练、产品运行时如何执行，以及目标为什么需要认真设计。并非所有 Agent 都使用强化学习，也并非每次用户反馈都会自动训练模型。"},{"id":"02-01","title":"Token 与分词：模型如何处理文字","file":"content/02-01.md","level":"基础理解","prerequisites":["01-01"],"aliases":["LLM","Transformer","Token","Attention","RLHF"],"module":"02","moduleTitle":"大模型机制","html":"<p>语言模型通常不直接把文字当作完整句子处理，而是先通过分词器转换成 Token 序列，再映射为数字标识。Token 是模型处理文本的重要单位，也影响上下文预算、成本和某些任务表现。它可能对应一个词、词的一部分、字符或字节组合，不能简单等同于一个汉字或一个英文单词。<\/p><h2 id=\"section-1\">从输入文字到数字序列<\/h2><p>分词器根据自身规则和词表，把文本拆成单位，再把每个单位映射为整数编号。编号只表示词表中的位置，本身没有大小意义；模型随后通过 Embedding 把编号转换成向量。输出时，模型预测下一个 Token 的分布，再由解码过程选择具体 Token，最终还原为用户看到的文字。<\/p><p>常见的子词方法在整词与单字符之间折中。高频词或片段可以作为一个单位，少见词被拆成多个片段，以控制词表规模并覆盖新词。BPE、WordPiece 和 Unigram 是不同的方法家族，具体分词结果还取决于训练语料和实现。不同模型的 Token 数不能一概换算。<\/p><h2 id=\"section-2\">为什么中文、代码与编号表现不同<\/h2><p>同样长度的文本，中文、英文、代码、空白和特殊符号可能产生不同数量的 Token。设备编号、长数字和专业术语可能被拆得较碎。一个文字很短的标识，也可能需要多个单位表示。这会影响成本估算，也解释了为什么精确字符串任务需要额外验证。<\/p><p>教学构造例子：型号“AB-2026-X7”可能被拆成若干片段。模型在长回答中复述型号时，有机会遗漏或替换某个片段。对于查询、生成配置和执行工具，最好把型号作为结构化字段传递，并与原值比对，而不是依赖自由文本复述。具体拆分必须使用目标模型的分词器查看，不能凭肉眼推断。<\/p><h2 id=\"section-3\">上下文与输出预算<\/h2><p>模型一次处理的输入和输出受上下文与服务限制影响。实际预算可能还包含系统指令、历史消息、工具定义、检索资料和内部处理所需空间，具体规则依产品与 API 而异。只看用户输入长度，容易低估请求规模。预留输出空间也很重要，否则生成可能因达到限制而截断。<\/p><p>当用户上传长文档，产品需要明确是全文进入模型，还是先检索片段、压缩或分段处理。分段可以减少单次输入，却会引入跨段信息丢失和合并问题。更大的窗口提供容纳空间，但不保证模型能同样可靠地利用全部位置的信息。<\/p><h2 id=\"section-4\">Token 与费用的关系<\/h2><p>许多服务按输入、输出及其他计算类别计量，具体价格和缓存规则需要在使用时核验。产品估算应基于完整调用链：一次用户任务可能触发多轮模型、检索改写和工具结果回填。单次请求的 Token 少，不一定意味着成功任务总成本低。<\/p><p>教学构造例子：方案甲一次调用输入较长，但能稳定完成；方案乙每次较短，却经常需要三次重试。应比较最终任务的总消耗、成功率与延迟，而不是只比较提示词长度。模型回复冗长也会影响输出成本和等待时间，因此输出格式与信息需求应在产品层定义。<\/p><h2 id=\"section-5\">产品经理应怎样使用这一概念<\/h2><p>Token 是容量和计算的单位，不是用户价值单位。用户更关心能否上传资料、获得完整结果和理解等待。界面可以用页数或文件说明辅助理解，但后台仍应按实际 Token 测量，并说明估算误差。达到限制时，应给出压缩、选择范围或分批处理等清楚路径。<\/p><p>涉及代码、数字、表格和精确实体时，应结合解析器、字段校验和工具验证，提高可靠性。理解分词之后，你可以解释为什么“只差一个字符”也可能是严重业务错误，并在需求中为这些字段设计更严格的检查。<\/p><h3 id=\"section-6\">精确长度任务的处理<\/h3><p>模型按 Token 生成，而用户可能要求按字符、单词或行数限制。两者不是同一单位。严格字数、固定编码和校验位等要求，应由程序计算并反馈，而不是假设模型天然精确计数。将生成与计数校验分开，可以保留语言灵活性，也能满足明确格式约束。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://huggingface.co/docs/transformers/main/en/tokenizer_summary\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：Tokenization algorithms<\/a><\/li><li><a href=\"https://arxiv.org/abs/1706.03762\" target=\"_blank\" rel=\"noopener noreferrer\">Attention Is All You Need 原论文<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Effective context engineering<\/a><\/li><\/ul><p>核验日期：2026-11-14。型号与成本方案为教学构造示例；具体 Token 计费、窗口与分词须按目标模型核验。<\/p>","toc":[{"id":"section-1","title":"从输入文字到数字序列","level":2},{"id":"section-2","title":"为什么中文、代码与编号表现不同","level":2},{"id":"section-3","title":"上下文与输出预算","level":2},{"id":"section-4","title":"Token 与费用的关系","level":2},{"id":"section-5","title":"产品经理应怎样使用这一概念","level":2},{"id":"section-6","title":"精确长度任务的处理","level":3},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"语言模型通常不直接把文字当作完整句子处理，而是先通过分词器转换成 Token 序列，再映射为数字标识。Token 是模型处理文本的重要单位，也影响上下文预算、成本和某些任务表现。它可能对应一个词、词的一部分、字符或字节组合，不能简单等同于一个汉字或一个英文单词。\n\n## 从输入文字到数字序列\n\n分词器根据自身规则和词表，把文本拆成单位，再把每个单位映射为整数编号。编号只表示词表中的位置，本身没有大小意义；模型随后通过 Embedding 把编号转换成向量。输出时，模型预测下一个 Token 的分布，再由解码过程选择具体 Token，最终还原为用户看到的文字。\n\n常见的子词方法在整词与单字符之间折中。高频词或片段可以作为一个单位，少见词被拆成多个片段，以控制词表规模并覆盖新词。BPE、WordPiece 和 Unigram 是不同的方法家族，具体分词结果还取决于训练语料和实现。不同模型的 Token 数不能一概换算。\n\n## 为什么中文、代码与编号表现不同\n\n同样长度的文本，中文、英文、代码、空白和特殊符号可能产生不同数量的 Token。设备编号、长数字和专业术语可能被拆得较碎。一个文字很短的标识，也可能需要多个单位表示。这会影响成本估算，也解释了为什么精确字符串任务需要额外验证。\n\n教学构造例子：型号“AB-2026-X7”可能被拆成若干片段。模型在长回答中复述型号时，有机会遗漏或替换某个片段。对于查询、生成配置和执行工具，最好把型号作为结构化字段传递，并与原值比对，而不是依赖自由文本复述。具体拆分必须使用目标模型的分词器查看，不能凭肉眼推断。\n\n## 上下文与输出预算\n\n模型一次处理的输入和输出受上下文与服务限制影响。实际预算可能还包含系统指令、历史消息、工具定义、检索资料和内部处理所需空间，具体规则依产品与 API 而异。只看用户输入长度，容易低估请求规模。预留输出空间也很重要，否则生成可能因达到限制而截断。\n\n当用户上传长文档，产品需要明确是全文进入模型，还是先检索片段、压缩或分段处理。分段可以减少单次输入，却会引入跨段信息丢失和合并问题。更大的窗口提供容纳空间，但不保证模型能同样可靠地利用全部位置的信息。\n\n## Token 与费用的关系\n\n许多服务按输入、输出及其他计算类别计量，具体价格和缓存规则需要在使用时核验。产品估算应基于完整调用链：一次用户任务可能触发多轮模型、检索改写和工具结果回填。单次请求的 Token 少，不一定意味着成功任务总成本低。\n\n教学构造例子：方案甲一次调用输入较长，但能稳定完成；方案乙每次较短，却经常需要三次重试。应比较最终任务的总消耗、成功率与延迟，而不是只比较提示词长度。模型回复冗长也会影响输出成本和等待时间，因此输出格式与信息需求应在产品层定义。\n\n## 产品经理应怎样使用这一概念\n\nToken 是容量和计算的单位，不是用户价值单位。用户更关心能否上传资料、获得完整结果和理解等待。界面可以用页数或文件说明辅助理解，但后台仍应按实际 Token 测量，并说明估算误差。达到限制时，应给出压缩、选择范围或分批处理等清楚路径。\n\n涉及代码、数字、表格和精确实体时，应结合解析器、字段校验和工具验证，提高可靠性。理解分词之后，你可以解释为什么“只差一个字符”也可能是严重业务错误，并在需求中为这些字段设计更严格的检查。\n\n### 精确长度任务的处理\n\n模型按 Token 生成，而用户可能要求按字符、单词或行数限制。两者不是同一单位。严格字数、固定编码和校验位等要求，应由程序计算并反馈，而不是假设模型天然精确计数。将生成与计数校验分开，可以保留语言灵活性，也能满足明确格式约束。\n\n## 资料与延伸阅读\n\n- [Hugging Face：Tokenization algorithms](https://huggingface.co/docs/transformers/main/en/tokenizer_summary)\n- [Attention Is All You Need 原论文](https://arxiv.org/abs/1706.03762)\n- [Anthropic：Effective context engineering](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n\n核验日期：2026-11-14。型号与成本方案为教学构造示例；具体 Token 计费、窗口与分词须按目标模型核验。\n","chars":1280,"minutes":5,"summary":"语言模型通常不直接把文字当作完整句子处理，而是先通过分词器转换成 Token 序列，再映射为数字标识。Token 是模型处理文本的重要单位，也影响上下文预算、成本和某些任务表现。它可能对应一个词、词的一部分、字符或字节组合，不能简单等同于一个汉字或一个英文单词。"},{"id":"02-02","title":"Embedding 与表示：语义如何成为向量","file":"content/02-02.md","level":"基础理解","prerequisites":["02-01"],"aliases":["LLM","Transformer","Token","Attention","RLHF"],"module":"02","moduleTitle":"大模型机制","html":"<p>Embedding 把离散对象映射到连续向量空间，使模型能够计算对象之间的关系。文字、图像、用户或商品都可以有向量表示，但“都叫 Embedding”不意味着它们可直接比较。理解表示的来源和训练目标，是理解语义检索与大模型内部机制的关键。<\/p><h2 id=\"section-1\">编号如何变成可计算的表示<\/h2><p>Token 编号只是词表索引。如果把编号直接当大小使用，模型会错误地认为某些词比另一些词“更大”。Embedding 层为每个 Token 关联一个向量，使训练能够调整它们在空间中的关系。向量维度通常不是人工逐项命名，而是通过整体参数共同表达规律。<\/p><p>一个直观比喻是给每种零件建立多维描述，但真实模型学习到的特征远比“重量、长度”抽象。不要期待第十维固定表示情感、第十一维固定表示设备类型。某些分析可以发现特定方向与概念相关，但不等于每一维都有独立、稳定的人类含义。<\/p><h2 id=\"section-2\">静态表示与上下文表示<\/h2><p>同一个词在不同句子中可能有不同含义。静态词向量通常为词提供固定表示；上下文模型会根据周围信息不断更新位置的表示。例如“苹果手机”和“苹果变甜”中的同一词，经过上下文处理后应体现不同关系。Transformer 的多层计算让表示逐步吸收其他位置的信息。<\/p><p>因此模型不是只通过词典查找后拼接答案。输入经过多次变换，表示随上下文改变，再用于后续预测。与此同时，内部表示的存在也不意味着模型建立了与人相同的概念系统，或拥有可靠的世界事实数据库。表示服务于训练目标，解释其语义时需要证据。<\/p><h2 id=\"section-3\">语言模型内部向量与检索向量<\/h2><p>用于预测后续 Token 的内部表示，与专门用于句子相似性检索的向量，不应直接视为同一产品能力。检索模型通常通过相应目标优化，使查询和文档的向量适合比较。任意取大模型某层向量，再求平均，并不保证获得优秀的语义搜索效果。<\/p><p>教学构造例子：企业希望搜索“高温停机处理”，需要找到含有“过热保护复位”的手册。检索向量应在这种查询与相关资料之间建立可用距离。若实际问题经常包含精确型号、时间和否定条件，还需要关键词和过滤机制配合，不能只依赖大致语义接近。<\/p><h2 id=\"section-4\">表示能力依赖数据与任务<\/h2><p>模型在通用语料中学到的相似性，可能不适用于特定行业。两个设备型号在自然语言空间中非常接近，却对应不同操作限制。跨语言、专业缩写、代码和长表格都可能形成覆盖边界。通用榜单是候选筛选信息，真实任务仍需要本地验证。<\/p><p>向量长度、归一化、输入模板和距离函数也会影响结果。有的模型区分查询和文档输入格式；有的模型对长度有明确限制。缺少这些条件时，“维度更多所以更准确”是没有充分依据的判断。更高维也会增加存储与搜索成本，应与效果一起比较。<\/p><h2 id=\"section-5\">从表示到产品决策<\/h2><p>选型时，需要记录模型版本、输入处理、向量维度和距离方式。升级表示模型往往涉及重新编码文档、重建索引和迁移查询路径；仅替换接口名称可能破坏已有空间的一致性。应为新旧索引安排比较与回退，而非假设版本越新就必然改善所有场景。<\/p><p>用户界面呈现的是相关资料和结果，而不是向量本身。产品应保留来源、标题、版本和实际片段，让用户能判断相关性的依据。尤其当资料用于生成操作建议时，相似性只是寻找证据的步骤，最终还要核对条件是否一致。<\/p><h2 id=\"section-6\">表示与可解释性的边界<\/h2><p>观察两个向量接近，只能说明在某种表示和距离下相近，不能单独证明因果、授权或事实等价。可视化降维也可能丢失结构，因此二维图中的聚集应作为探索线索。把数值结果放回原始样本检查，能避免将漂亮图形误当确定结论。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://developers.google.com/machine-learning/crash-course\" target=\"_blank\" rel=\"noopener noreferrer\">Google：Machine Learning Crash Course<\/a><\/li><li><a href=\"https://arxiv.org/abs/1706.03762\" target=\"_blank\" rel=\"noopener noreferrer\">Attention Is All You Need 原论文<\/a><\/li><li><a href=\"https://huggingface.co/docs/transformers/main/en/tokenizer_summary\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：Tokenization algorithms<\/a><\/li><\/ul><p>核验日期：2026-11-14。手册检索为教学构造案例；检索模型输入规范应依据各模型文档核验。<\/p>","toc":[{"id":"section-1","title":"编号如何变成可计算的表示","level":2},{"id":"section-2","title":"静态表示与上下文表示","level":2},{"id":"section-3","title":"语言模型内部向量与检索向量","level":2},{"id":"section-4","title":"表示能力依赖数据与任务","level":2},{"id":"section-5","title":"从表示到产品决策","level":2},{"id":"section-6","title":"表示与可解释性的边界","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"Embedding 把离散对象映射到连续向量空间，使模型能够计算对象之间的关系。文字、图像、用户或商品都可以有向量表示，但“都叫 Embedding”不意味着它们可直接比较。理解表示的来源和训练目标，是理解语义检索与大模型内部机制的关键。\n\n## 编号如何变成可计算的表示\n\nToken 编号只是词表索引。如果把编号直接当大小使用，模型会错误地认为某些词比另一些词“更大”。Embedding 层为每个 Token 关联一个向量，使训练能够调整它们在空间中的关系。向量维度通常不是人工逐项命名，而是通过整体参数共同表达规律。\n\n一个直观比喻是给每种零件建立多维描述，但真实模型学习到的特征远比“重量、长度”抽象。不要期待第十维固定表示情感、第十一维固定表示设备类型。某些分析可以发现特定方向与概念相关，但不等于每一维都有独立、稳定的人类含义。\n\n## 静态表示与上下文表示\n\n同一个词在不同句子中可能有不同含义。静态词向量通常为词提供固定表示；上下文模型会根据周围信息不断更新位置的表示。例如“苹果手机”和“苹果变甜”中的同一词，经过上下文处理后应体现不同关系。Transformer 的多层计算让表示逐步吸收其他位置的信息。\n\n因此模型不是只通过词典查找后拼接答案。输入经过多次变换，表示随上下文改变，再用于后续预测。与此同时，内部表示的存在也不意味着模型建立了与人相同的概念系统，或拥有可靠的世界事实数据库。表示服务于训练目标，解释其语义时需要证据。\n\n## 语言模型内部向量与检索向量\n\n用于预测后续 Token 的内部表示，与专门用于句子相似性检索的向量，不应直接视为同一产品能力。检索模型通常通过相应目标优化，使查询和文档的向量适合比较。任意取大模型某层向量，再求平均，并不保证获得优秀的语义搜索效果。\n\n教学构造例子：企业希望搜索“高温停机处理”，需要找到含有“过热保护复位”的手册。检索向量应在这种查询与相关资料之间建立可用距离。若实际问题经常包含精确型号、时间和否定条件，还需要关键词和过滤机制配合，不能只依赖大致语义接近。\n\n## 表示能力依赖数据与任务\n\n模型在通用语料中学到的相似性，可能不适用于特定行业。两个设备型号在自然语言空间中非常接近，却对应不同操作限制。跨语言、专业缩写、代码和长表格都可能形成覆盖边界。通用榜单是候选筛选信息，真实任务仍需要本地验证。\n\n向量长度、归一化、输入模板和距离函数也会影响结果。有的模型区分查询和文档输入格式；有的模型对长度有明确限制。缺少这些条件时，“维度更多所以更准确”是没有充分依据的判断。更高维也会增加存储与搜索成本，应与效果一起比较。\n\n## 从表示到产品决策\n\n选型时，需要记录模型版本、输入处理、向量维度和距离方式。升级表示模型往往涉及重新编码文档、重建索引和迁移查询路径；仅替换接口名称可能破坏已有空间的一致性。应为新旧索引安排比较与回退，而非假设版本越新就必然改善所有场景。\n\n用户界面呈现的是相关资料和结果，而不是向量本身。产品应保留来源、标题、版本和实际片段，让用户能判断相关性的依据。尤其当资料用于生成操作建议时，相似性只是寻找证据的步骤，最终还要核对条件是否一致。\n\n## 表示与可解释性的边界\n\n观察两个向量接近，只能说明在某种表示和距离下相近，不能单独证明因果、授权或事实等价。可视化降维也可能丢失结构，因此二维图中的聚集应作为探索线索。把数值结果放回原始样本检查，能避免将漂亮图形误当确定结论。\n\n## 资料与延伸阅读\n\n- [Google：Machine Learning Crash Course](https://developers.google.com/machine-learning/crash-course)\n- [Attention Is All You Need 原论文](https://arxiv.org/abs/1706.03762)\n- [Hugging Face：Tokenization algorithms](https://huggingface.co/docs/transformers/main/en/tokenizer_summary)\n\n核验日期：2026-11-14。手册检索为教学构造案例；检索模型输入规范应依据各模型文档核验。\n","chars":1258,"minutes":5,"summary":"Embedding 把离散对象映射到连续向量空间，使模型能够计算对象之间的关系。文字、图像、用户或商品都可以有向量表示，但“都叫 Embedding”不意味着它们可直接比较。理解表示的来源和训练目标，是理解语义检索与大模型内部机制的关键。"},{"id":"02-03","title":"Attention 与 Transformer：信息如何关联","file":"content/02-03.md","level":"基础理解","prerequisites":["02-02"],"aliases":["LLM","Transformer","Token","Attention","RLHF"],"module":"02","moduleTitle":"大模型机制","html":"<p>Attention 的作用是让一个位置根据任务需要组合其他位置的信息。Transformer 将这种机制作为重要构件，使模型能够处理序列关系。产品经理不必手写矩阵计算，但应理解信息如何流动，以及为什么“能接收长输入”与“能稳定理解所有细节”不同。<\/p><figure class=\"concept-diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 602\" role=\"img\" aria-labelledby=\"title-model desc-model\"><title id=\"title-model\">一次语言模型生成<\/title><desc id=\"desc-model\">文字输入：分词为 Token，并组织指令与上下文；向量表示：Token、位置与其他输入形成表示；模型计算：多层注意力与网络计算关联信息；输出分布：得到下一 Token 的候选分数；采样与继续：选择输出，循环生成直到停止<\/desc><rect width=\"360\" height=\"602\" rx=\"15\" fill=\"#f0f4ec\"/><text x=\"24\" y=\"35\" fill=\"#244c3e\" font-size=\"16\" font-family=\"sans-serif\" font-weight=\"600\">一次语言模型生成<\/text><rect x=\"22\" y=\"56\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"80\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"84\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">1<\/text><text x=\"65\" y=\"84\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">文字输入<\/text><text x=\"37\" y=\"109\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">分词为 Token，并组织指令与上下文<\/text><path d=\"M180 131 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"148\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"172\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"176\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">2<\/text><text x=\"65\" y=\"176\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">向量表示<\/text><text x=\"37\" y=\"201\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">Token、位置与其他输入形成表示<\/text><path d=\"M180 223 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"240\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"264\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">3<\/text><text x=\"65\" y=\"268\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">模型计算<\/text><text x=\"37\" y=\"293\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">多层注意力与网络计算关联信息<\/text><path d=\"M180 315 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"332\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"356\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"360\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">4<\/text><text x=\"65\" y=\"360\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">输出分布<\/text><text x=\"37\" y=\"385\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">得到下一 Token 的候选分数<\/text><path d=\"M180 407 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"424\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"448\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"452\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">5<\/text><text x=\"65\" y=\"452\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">采样与继续<\/text><text x=\"37\" y=\"477\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">选择输出，循环生成直到停止<\/text><text x=\"24\" y=\"558\" font-size=\"10.5\" fill=\"#6a816c\" font-family=\"sans-serif\">图示为通用直觉；具体架构与生成策略可能不同。<\/text><\/svg><figcaption>语言模型的信息处理流程 · 本知识库绘制的机制示意<\/figcaption><\/figure><h2 id=\"section-1\">先理解信息关联<\/h2><p>看一句话：“工程师把手册交给操作员，因为他需要检查报警。”其中代词指谁，需要结合其他词判断。注意力机制让当前位置对其他位置分配不同权重，并聚合相关表示。它不是人工指定某个词一定关注哪个词，而是通过训练学会生成这些关联。<\/p><p>常见解释使用 Query、Key 和 Value：当前位置产生查询，其他位置提供键用于比较匹配程度，再根据匹配权重组合对应的值。这只是对计算角色的命名，不等于模型真的像人一样主动提出自然语言问题。实际计算由向量投影、相似度、归一化和加权组合完成。<\/p><h2 id=\"section-2\">多头与多层分别带来什么<\/h2><p>多头注意力允许模型在不同表示子空间中同时建模关系。不同头可能捕捉不同模式，但不能保证每个头都对应固定的人类语法或业务概念。多层处理进一步把局部关系和复杂特征组合起来。前馈网络、残差连接、归一化等组件也共同影响训练和表示能力。<\/p><p>因此 Transformer 不是只有 Attention 的单一公式，也不是一个可直接读出完整推理理由的数据库。注意力权重有时能辅助分析，但不能简单作为模型决策的充分解释。面向用户的依据仍应来自可验证资料、工具结果和实际计算，而非仅展示内部权重。<\/p><h2 id=\"section-3\">位置与可见范围<\/h2><p>纯粹的内容匹配不足以表达顺序，因此模型需要位置相关信息。不同架构采用不同方式编码位置。用于自回归生成的模型还会限制某个位置只能利用允许的先前信息，避免在训练预测时偷看后续答案。这类限制通常称为因果掩码，与现实世界的因果推断不是同一个概念。<\/p><p>编码器、解码器及其组合适合不同任务，现代大语言模型也有多种变体。了解这些区别的价值在于理解输入与生成过程，而不是用结构名称直接推断产品效果。相同架构在不同数据、训练与后训练下，能力可能相差很大。<\/p><h2 id=\"section-4\">长序列为什么带来成本<\/h2><p>经典全注意力需要处理位置之间的大量关联，序列变长时，计算与内存压力会显著增加。现代系统使用不同优化和架构改进，因此具体成本不能仅用一个理论公式估算。但“输入越长，系统负担越大”仍是需要结合实际服务测量的方向。<\/p><p>教学构造例子：把所有维修手册一次塞入上下文，可能增加成本、延迟和无关信息干扰。先检索相关型号和章节，再提供必要材料，通常更容易控制来源与范围；但检索也可能漏掉跨章节条件。选择长上下文、检索或组合，需要基于任务证据比较。<\/p><h2 id=\"section-5\">对产品设计的直接影响<\/h2><p>输入结构应让关键信息清楚可定位。把明确任务、资料范围、字段约束和证据放在连贯结构中，能减少歧义；但格式本身不是可靠性的保证。资料冲突、关键信息缺失或不可信文本，仍需系统层处理。复杂性增加时，应检查模型实际使用了什么证据，而非只看最终语言是否流畅。<\/p><p>长文任务可以分别验证资料定位、条件整合和最终输出。例如要求模型引用适用条款，再检查引用与答案是否一致。这样可以定位是输入覆盖、注意利用还是生成约束出现问题。模型内部机制提供解释方向，产品评估则提供任务层证据。<\/p><h2 id=\"section-6\">需要保持的认知边界<\/h2><p>Transformer 是重要的模型架构，而非智能的完整定义。参数规模、上下文长度和注意力头数量都不能单独决定真实任务表现。产品经理应将架构知识用于理解约束、提出合理问题，并通过实际样本验证决策，避免从一个技术指标直接跳到商业承诺。<\/p><h2 id=\"section-7\">用一个简化过程理解权重<\/h2><p>假设当前位置面对三个候选信息，它们经匹配计算后得到的分数不同。归一化会将分数转成一组总和为一的权重，再用这些权重组合对应 Value 向量。高权重表示在这次计算中贡献较大，不表示该来源真实可靠，也不表示模型在全部层都以相同方式利用它。<\/p><p>如果输入资料本身错误，注意力机制可以非常有效地传播错误信息。它的职责是组织表示，不是核验来源。产品中的证据可信度、版本和权限，需要在数据与系统层提供。理解这一点，可以避免把模型架构中的“关注”误当作业务意义上的“确认”。<\/p><p>对于长文比较，可以把任务拆成查找相关段落、抽取条件和形成结论，分别观察失败。若相关证据根本未进入输入，不能期待注意力解决；若证据已在输入却被忽略，可以研究结构、位置、任务复杂度与模型适配。机制知识应帮助定位假设，再由任务结果验证。<\/p><h2 id=\"section-8\">输入处理与逐步生成<\/h2><p>推理服务通常先处理已有输入，再逐步生成新 Token。已计算的某些中间状态可以缓存，减少后续步骤重复工作，但缓存也占用内存。输入长、输出长和并发高，会以不同方式影响资源。因此长窗口支持、首字时延、生成速度与可同时服务人数是不同指标，不能只用一个“速度”概括。<\/p><p>当用户说系统慢，需要知道是上传解析、输入计算、排队、工具等待还是输出过程。架构机制能提供拆分方向，真实监控才能说明主要耗时。产品选择应比较用户任务的总完成时间，并考虑能否通过流式展示、阶段反馈或异步执行改善体验。<\/p><h2 id=\"section-9\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/1706.03762\" target=\"_blank\" rel=\"noopener noreferrer\">Attention Is All You Need 原论文<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Effective context engineering<\/a><\/li><\/ul><p>核验日期：2026-11-14。手册方案为教学构造；本文解释通用机制，具体架构和优化以模型技术资料为准。<\/p>","toc":[{"id":"section-1","title":"先理解信息关联","level":2},{"id":"section-2","title":"多头与多层分别带来什么","level":2},{"id":"section-3","title":"位置与可见范围","level":2},{"id":"section-4","title":"长序列为什么带来成本","level":2},{"id":"section-5","title":"对产品设计的直接影响","level":2},{"id":"section-6","title":"需要保持的认知边界","level":2},{"id":"section-7","title":"用一个简化过程理解权重","level":2},{"id":"section-8","title":"输入处理与逐步生成","level":2},{"id":"section-9","title":"资料与延伸阅读","level":2}],"text":"Attention 的作用是让一个位置根据任务需要组合其他位置的信息。Transformer 将这种机制作为重要构件，使模型能够处理序列关系。产品经理不必手写矩阵计算，但应理解信息如何流动，以及为什么“能接收长输入”与“能稳定理解所有细节”不同。\n\n![语言模型的信息处理流程](../site/diagrams/model.svg)\n\n## 先理解信息关联\n\n看一句话：“工程师把手册交给操作员，因为他需要检查报警。”其中代词指谁，需要结合其他词判断。注意力机制让当前位置对其他位置分配不同权重，并聚合相关表示。它不是人工指定某个词一定关注哪个词，而是通过训练学会生成这些关联。\n\n常见解释使用 Query、Key 和 Value：当前位置产生查询，其他位置提供键用于比较匹配程度，再根据匹配权重组合对应的值。这只是对计算角色的命名，不等于模型真的像人一样主动提出自然语言问题。实际计算由向量投影、相似度、归一化和加权组合完成。\n\n## 多头与多层分别带来什么\n\n多头注意力允许模型在不同表示子空间中同时建模关系。不同头可能捕捉不同模式，但不能保证每个头都对应固定的人类语法或业务概念。多层处理进一步把局部关系和复杂特征组合起来。前馈网络、残差连接、归一化等组件也共同影响训练和表示能力。\n\n因此 Transformer 不是只有 Attention 的单一公式，也不是一个可直接读出完整推理理由的数据库。注意力权重有时能辅助分析，但不能简单作为模型决策的充分解释。面向用户的依据仍应来自可验证资料、工具结果和实际计算，而非仅展示内部权重。\n\n## 位置与可见范围\n\n纯粹的内容匹配不足以表达顺序，因此模型需要位置相关信息。不同架构采用不同方式编码位置。用于自回归生成的模型还会限制某个位置只能利用允许的先前信息，避免在训练预测时偷看后续答案。这类限制通常称为因果掩码，与现实世界的因果推断不是同一个概念。\n\n编码器、解码器及其组合适合不同任务，现代大语言模型也有多种变体。了解这些区别的价值在于理解输入与生成过程，而不是用结构名称直接推断产品效果。相同架构在不同数据、训练与后训练下，能力可能相差很大。\n\n## 长序列为什么带来成本\n\n经典全注意力需要处理位置之间的大量关联，序列变长时，计算与内存压力会显著增加。现代系统使用不同优化和架构改进，因此具体成本不能仅用一个理论公式估算。但“输入越长，系统负担越大”仍是需要结合实际服务测量的方向。\n\n教学构造例子：把所有维修手册一次塞入上下文，可能增加成本、延迟和无关信息干扰。先检索相关型号和章节，再提供必要材料，通常更容易控制来源与范围；但检索也可能漏掉跨章节条件。选择长上下文、检索或组合，需要基于任务证据比较。\n\n## 对产品设计的直接影响\n\n输入结构应让关键信息清楚可定位。把明确任务、资料范围、字段约束和证据放在连贯结构中，能减少歧义；但格式本身不是可靠性的保证。资料冲突、关键信息缺失或不可信文本，仍需系统层处理。复杂性增加时，应检查模型实际使用了什么证据，而非只看最终语言是否流畅。\n\n长文任务可以分别验证资料定位、条件整合和最终输出。例如要求模型引用适用条款，再检查引用与答案是否一致。这样可以定位是输入覆盖、注意利用还是生成约束出现问题。模型内部机制提供解释方向，产品评估则提供任务层证据。\n\n## 需要保持的认知边界\n\nTransformer 是重要的模型架构，而非智能的完整定义。参数规模、上下文长度和注意力头数量都不能单独决定真实任务表现。产品经理应将架构知识用于理解约束、提出合理问题，并通过实际样本验证决策，避免从一个技术指标直接跳到商业承诺。\n\n## 用一个简化过程理解权重\n\n假设当前位置面对三个候选信息，它们经匹配计算后得到的分数不同。归一化会将分数转成一组总和为一的权重，再用这些权重组合对应 Value 向量。高权重表示在这次计算中贡献较大，不表示该来源真实可靠，也不表示模型在全部层都以相同方式利用它。\n\n如果输入资料本身错误，注意力机制可以非常有效地传播错误信息。它的职责是组织表示，不是核验来源。产品中的证据可信度、版本和权限，需要在数据与系统层提供。理解这一点，可以避免把模型架构中的“关注”误当作业务意义上的“确认”。\n\n对于长文比较，可以把任务拆成查找相关段落、抽取条件和形成结论，分别观察失败。若相关证据根本未进入输入，不能期待注意力解决；若证据已在输入却被忽略，可以研究结构、位置、任务复杂度与模型适配。机制知识应帮助定位假设，再由任务结果验证。\n\n## 输入处理与逐步生成\n\n推理服务通常先处理已有输入，再逐步生成新 Token。已计算的某些中间状态可以缓存，减少后续步骤重复工作，但缓存也占用内存。输入长、输出长和并发高，会以不同方式影响资源。因此长窗口支持、首字时延、生成速度与可同时服务人数是不同指标，不能只用一个“速度”概括。\n\n当用户说系统慢，需要知道是上传解析、输入计算、排队、工具等待还是输出过程。架构机制能提供拆分方向，真实监控才能说明主要耗时。产品选择应比较用户任务的总完成时间，并考虑能否通过流式展示、阶段反馈或异步执行改善体验。\n\n## 资料与延伸阅读\n\n- [Attention Is All You Need 原论文](https://arxiv.org/abs/1706.03762)\n- [Anthropic：Effective context engineering](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n\n核验日期：2026-11-14。手册方案为教学构造；本文解释通用机制，具体架构和优化以模型技术资料为准。\n","chars":1821,"minutes":7,"summary":"Attention 的作用是让一个位置根据任务需要组合其他位置的信息。Transformer 将这种机制作为重要构件，使模型能够处理序列关系。产品经理不必手写矩阵计算，但应理解信息如何流动，以及为什么“能接收长输入”与“能稳定理解所有细节”不同。"},{"id":"02-04","title":"预训练与规模：能力从哪里来","file":"content/02-04.md","level":"基础理解","prerequisites":["02-03"],"aliases":["LLM","Transformer","Token","Attention","RLHF"],"module":"02","moduleTitle":"大模型机制","html":"<p>预训练让模型从大量数据中学习通用表示和统计规律。它是大模型能力的重要来源，但不会自动赋予产品所需的实时知识、业务权限或可靠行动。理解预训练目标、数据与规模的作用，可以帮助你区分基础模型能力和应用系统责任。<\/p><h2 id=\"section-1\">模型在预训练中优化什么<\/h2><p>自回归语言模型常用已有 Token 预测后续 Token；其他模型也可以采用掩码恢复等目标。训练数据本身提供目标信号，模型不断调整参数，使预测更符合数据中的模式。通过大量任务形式和内容，模型可能学到语言、知识关联与某些问题解决方式。<\/p><p>这与逐条把事实写入数据库不同。参数中的信息分散在复杂表示里，不能保证随时准确提取，也难以按普通记录方式更新或删除。用户问一个事实时，模型生成的是符合当前上下文的输出，不是在一个完整、可审计的事实表中查询。<\/p><h2 id=\"section-2\">数据质量与构成影响能力<\/h2><p>训练语料的语言、领域、时间、质量和重复程度会塑造能力边界。更多数据若主要是重复或低质量内容，收益可能有限，还可能引入偏差。代码、数学、对话与文档的配比也会影响不同任务。产品选型不应只询问“训练了多少数据”，还应关注与目标任务的匹配与公开说明。<\/p><p>数据中存在错误、偏见和互相矛盾的信息，模型也可能吸收这些规律。预训练得到的能力与用户期望之间，仍需要后训练、输入组织、工具和评估。模型能流畅讨论某领域，并不意味着已达到该领域实际工作的可靠程度。<\/p><h2 id=\"section-3\">规模为什么有效，又为什么不能独立比较<\/h2><p>参数规模、数据量和训练计算共同影响模型能拟合的复杂性。研究中的规模规律常描述在特定条件下，增加资源与损失变化之间的关系。它们不是任何场景都适用的产品质量公式。训练目标、数据和计算分配不同，单看参数量无法公平比较。<\/p><p>教学构造例子：一个更小但针对中文企业工单优化的模型，可能在该任务上优于更大但不适配的模型；通用大模型也可能凭广泛能力在长尾任务更稳。结论只能通过同条件任务评估形成，不能把“大”或“小”当作默认答案。<\/p><h2 id=\"section-4\">知识时间与实时信息<\/h2><p>基础模型训练材料具有时间范围，但这并不等于模型掌握该时间之前的所有事实，也不保证它完全不知道之后的信息；后训练和服务系统可能另外引入资料。准确描述应基于模型与产品的实际来源，而不是一个简化的时间标签。<\/p><p>价格、政策、库存和企业内部状态需要可靠的实时数据路径。应用可以检索资料或调用业务接口，再要求模型基于返回结果回答。工具是否成功、数据是否最新、权限是否正确，都是系统必须验证的部分，不能由模型“记得大概情况”来替代。<\/p><h2 id=\"section-5\">预训练与产品定制的分工<\/h2><p>从零预训练通常需要大量数据、计算和研究工程投入。多数应用产品更适合先使用现有模型，再通过 Prompt、RAG、工具或针对性微调适配任务。选择路径应取决于具体瓶颈：知识缺失、格式不稳定、领域表达，还是基础能力不足。<\/p><p>若模型已经能完成任务，只是缺少当前企业资料，重新训练基础模型通常不是最直接的第一步。若反复出现某类稳定行为问题，可以研究数据和定制方式，但仍需要独立验证集。预训练知识帮助你判断问题属于哪一层，也帮助避免把所有需求都归结为“训练专属大模型”。<\/p><h2 id=\"section-6\">如何阅读模型能力介绍<\/h2><p>关注测试任务、样本、提示方式、是否使用工具、计算预算和比较对象。一个模型在某榜单领先，只证明在该评估设置下的结果。还应查看失败场景和服务限制。产品需求最终要落在真实用户任务，而非将技术报告的单个分数直接转换成整体产品保证。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/1706.03762\" target=\"_blank\" rel=\"noopener noreferrer\">Attention Is All You Need 原论文<\/a><\/li><li><a href=\"https://huggingface.co/learn/llm-course/chapter1/1\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：LLM Course<\/a><\/li><li><a href=\"https://arxiv.org/abs/1810.03993\" target=\"_blank\" rel=\"noopener noreferrer\">Model Cards for Model Reporting 原论文<\/a><\/li><\/ul><p>核验日期：2026-11-14。工单选型为教学构造；具体模型训练数据及性能需按公开技术资料核验。<\/p>","toc":[{"id":"section-1","title":"模型在预训练中优化什么","level":2},{"id":"section-2","title":"数据质量与构成影响能力","level":2},{"id":"section-3","title":"规模为什么有效，又为什么不能独立比较","level":2},{"id":"section-4","title":"知识时间与实时信息","level":2},{"id":"section-5","title":"预训练与产品定制的分工","level":2},{"id":"section-6","title":"如何阅读模型能力介绍","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"预训练让模型从大量数据中学习通用表示和统计规律。它是大模型能力的重要来源，但不会自动赋予产品所需的实时知识、业务权限或可靠行动。理解预训练目标、数据与规模的作用，可以帮助你区分基础模型能力和应用系统责任。\n\n## 模型在预训练中优化什么\n\n自回归语言模型常用已有 Token 预测后续 Token；其他模型也可以采用掩码恢复等目标。训练数据本身提供目标信号，模型不断调整参数，使预测更符合数据中的模式。通过大量任务形式和内容，模型可能学到语言、知识关联与某些问题解决方式。\n\n这与逐条把事实写入数据库不同。参数中的信息分散在复杂表示里，不能保证随时准确提取，也难以按普通记录方式更新或删除。用户问一个事实时，模型生成的是符合当前上下文的输出，不是在一个完整、可审计的事实表中查询。\n\n## 数据质量与构成影响能力\n\n训练语料的语言、领域、时间、质量和重复程度会塑造能力边界。更多数据若主要是重复或低质量内容，收益可能有限，还可能引入偏差。代码、数学、对话与文档的配比也会影响不同任务。产品选型不应只询问“训练了多少数据”，还应关注与目标任务的匹配与公开说明。\n\n数据中存在错误、偏见和互相矛盾的信息，模型也可能吸收这些规律。预训练得到的能力与用户期望之间，仍需要后训练、输入组织、工具和评估。模型能流畅讨论某领域，并不意味着已达到该领域实际工作的可靠程度。\n\n## 规模为什么有效，又为什么不能独立比较\n\n参数规模、数据量和训练计算共同影响模型能拟合的复杂性。研究中的规模规律常描述在特定条件下，增加资源与损失变化之间的关系。它们不是任何场景都适用的产品质量公式。训练目标、数据和计算分配不同，单看参数量无法公平比较。\n\n教学构造例子：一个更小但针对中文企业工单优化的模型，可能在该任务上优于更大但不适配的模型；通用大模型也可能凭广泛能力在长尾任务更稳。结论只能通过同条件任务评估形成，不能把“大”或“小”当作默认答案。\n\n## 知识时间与实时信息\n\n基础模型训练材料具有时间范围，但这并不等于模型掌握该时间之前的所有事实，也不保证它完全不知道之后的信息；后训练和服务系统可能另外引入资料。准确描述应基于模型与产品的实际来源，而不是一个简化的时间标签。\n\n价格、政策、库存和企业内部状态需要可靠的实时数据路径。应用可以检索资料或调用业务接口，再要求模型基于返回结果回答。工具是否成功、数据是否最新、权限是否正确，都是系统必须验证的部分，不能由模型“记得大概情况”来替代。\n\n## 预训练与产品定制的分工\n\n从零预训练通常需要大量数据、计算和研究工程投入。多数应用产品更适合先使用现有模型，再通过 Prompt、RAG、工具或针对性微调适配任务。选择路径应取决于具体瓶颈：知识缺失、格式不稳定、领域表达，还是基础能力不足。\n\n若模型已经能完成任务，只是缺少当前企业资料，重新训练基础模型通常不是最直接的第一步。若反复出现某类稳定行为问题，可以研究数据和定制方式，但仍需要独立验证集。预训练知识帮助你判断问题属于哪一层，也帮助避免把所有需求都归结为“训练专属大模型”。\n\n## 如何阅读模型能力介绍\n\n关注测试任务、样本、提示方式、是否使用工具、计算预算和比较对象。一个模型在某榜单领先，只证明在该评估设置下的结果。还应查看失败场景和服务限制。产品需求最终要落在真实用户任务，而非将技术报告的单个分数直接转换成整体产品保证。\n\n## 资料与延伸阅读\n\n- [Attention Is All You Need 原论文](https://arxiv.org/abs/1706.03762)\n- [Hugging Face：LLM Course](https://huggingface.co/learn/llm-course/chapter1/1)\n- [Model Cards for Model Reporting 原论文](https://arxiv.org/abs/1810.03993)\n\n核验日期：2026-11-14。工单选型为教学构造；具体模型训练数据及性能需按公开技术资料核验。\n","chars":1268,"minutes":5,"summary":"预训练让模型从大量数据中学习通用表示和统计规律。它是大模型能力的重要来源，但不会自动赋予产品所需的实时知识、业务权限或可靠行动。理解预训练目标、数据与规模的作用，可以帮助你区分基础模型能力和应用系统责任。"},{"id":"02-05","title":"后训练与对齐：SFT、RLHF 与偏好优化","file":"content/02-05.md","level":"基础理解","prerequisites":["02-04"],"aliases":["LLM","Transformer","Token","Attention","RLHF"],"module":"02","moduleTitle":"大模型机制","html":"<p>预训练模型擅长延续文本，不一定自然遵循用户意图。后训练通过示范、偏好或其他反馈调整模型行为，使它更适合对话、工具使用和特定任务。SFT、RLHF 与 DPO 描述不同环节或方法，不能都简单理解为给模型补充知识。<\/p><h2 id=\"section-1\">SFT：用示范表达期望行为<\/h2><p>监督微调使用输入与理想输出配对的数据继续训练。示范可以包含回答方式、任务步骤、结构化输出或工具调用。模型通过这些例子学习“遇到这类请求应该如何回应”。示范质量决定它所模仿的行为，数据中的冗长、错误和不一致也可能被学习。<\/p><p>教学构造例子：企业希望助手输出包含故障现象、资料依据和待确认条件的摘要，可以准备符合规范的示范。如果示范总是缺少不确定情况，模型可能学会在证据不足时仍给出完整答案。数据设计应覆盖正常、缺失信息、冲突和超出范围等情形。<\/p><h2 id=\"section-2\">RLHF：根据偏好调整输出分布<\/h2><p>一种经典流程先收集多个候选输出的相对偏好，训练奖励模型，再用强化学习调整语言模型，使其倾向更受偏好的输出，同时避免无约束偏离原模型。人类反馈可以表达难以用简单规则写出的质量，例如帮助程度和表达方式。<\/p><p>偏好并不自动等于事实真相。评审者可能偏爱更自信、更长或更符合自身预期的回答。奖励模型也可能存在误差，语言模型在优化中找到高分但不符合真实目标的模式。因此偏好数据、奖励和最终评估都需要独立审查。<\/p><h2 id=\"section-3\">DPO：另一种偏好优化路线<\/h2><p>直接偏好优化利用成对偏好数据构造训练目标，在其方法假设下避免完整的显式奖励模型加在线强化学习流程。它提供了相对简化的优化路线，但仍依赖偏好数据的质量和分布。不能因为流程较简单，就认为它适合所有模型和任务。<\/p><p>对于产品经理，更重要的是理解输入数据是什么、希望改变哪类行为、如何检查改进及回退。具体算法选择由研究与工程团队结合资源和实验决定。把 SFT、偏好优化与数据准备、评估和发布放在同一条链路讨论，才能判断项目是否可落地。<\/p><h2 id=\"section-4\">对齐不意味着所有目标都一致<\/h2><p>“对齐”可能涉及遵循指令、符合偏好、安全限制或特定任务目标。不同目标之间会有取舍。例如过度迎合用户可能牺牲事实性；过度保守可能降低任务完成。单一的“对齐更好”需要进一步说明究竟改善了哪种行为、对哪些用户有效。<\/p><p>模型后训练也无法替代工具权限、数据隔离和业务规则。即使模型通常拒绝越权请求，服务端仍应独立校验实际权限；即使模型习惯输出 JSON，执行端仍需验证结构与业务条件。训练是在改变概率分布，系统约束承担另外一层责任。<\/p><h2 id=\"section-5\">企业定制时的常见误判<\/h2><p>把最新政策全部塞进微调数据，可能仍难保证更新及时和引用可追溯；这类需求往往还需要检索。反过来，只靠检索也不一定解决稳定格式或特殊表达习惯。知识来源与行为适配是不同维度，应用可以组合多种方式。<\/p><p>定制之前应建立基线，确认问题持续存在、数据可获得，并明确成本。训练后不仅看目标任务，还要检查通用能力、拒答、长尾和旧流程是否回退。模型、数据、提示和工具版本应一起记录，否则难以复现结果或定位变化原因。<\/p><h2 id=\"section-6\">如何转化为产品需求<\/h2><p>需求应描述可观察行为，例如“资料不足时指出缺失条件”“工具失败时不宣称完成”，而非只写“模型更懂业务”。每项行为都应连接样例范围与评估标准。这样团队才能判断需要数据、提示、模型定制还是流程修改，也能把训练投入连接到实际产品收益。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/2203.02155\" target=\"_blank\" rel=\"noopener noreferrer\">Training language models to follow instructions with human feedback<\/a><\/li><li><a href=\"https://arxiv.org/abs/2305.18290\" target=\"_blank\" rel=\"noopener noreferrer\">Direct Preference Optimization 原论文<\/a><\/li><li><a href=\"https://arxiv.org/abs/2106.09685\" target=\"_blank\" rel=\"noopener noreferrer\">LoRA 原论文<\/a><\/li><\/ul><p>核验日期：2026-11-14。企业摘要为教学构造例子；本文解释方法关系，不代表任何具体模型完整公开了其后训练流程。<\/p>","toc":[{"id":"section-1","title":"SFT：用示范表达期望行为","level":2},{"id":"section-2","title":"RLHF：根据偏好调整输出分布","level":2},{"id":"section-3","title":"DPO：另一种偏好优化路线","level":2},{"id":"section-4","title":"对齐不意味着所有目标都一致","level":2},{"id":"section-5","title":"企业定制时的常见误判","level":2},{"id":"section-6","title":"如何转化为产品需求","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"预训练模型擅长延续文本，不一定自然遵循用户意图。后训练通过示范、偏好或其他反馈调整模型行为，使它更适合对话、工具使用和特定任务。SFT、RLHF 与 DPO 描述不同环节或方法，不能都简单理解为给模型补充知识。\n\n## SFT：用示范表达期望行为\n\n监督微调使用输入与理想输出配对的数据继续训练。示范可以包含回答方式、任务步骤、结构化输出或工具调用。模型通过这些例子学习“遇到这类请求应该如何回应”。示范质量决定它所模仿的行为，数据中的冗长、错误和不一致也可能被学习。\n\n教学构造例子：企业希望助手输出包含故障现象、资料依据和待确认条件的摘要，可以准备符合规范的示范。如果示范总是缺少不确定情况，模型可能学会在证据不足时仍给出完整答案。数据设计应覆盖正常、缺失信息、冲突和超出范围等情形。\n\n## RLHF：根据偏好调整输出分布\n\n一种经典流程先收集多个候选输出的相对偏好，训练奖励模型，再用强化学习调整语言模型，使其倾向更受偏好的输出，同时避免无约束偏离原模型。人类反馈可以表达难以用简单规则写出的质量，例如帮助程度和表达方式。\n\n偏好并不自动等于事实真相。评审者可能偏爱更自信、更长或更符合自身预期的回答。奖励模型也可能存在误差，语言模型在优化中找到高分但不符合真实目标的模式。因此偏好数据、奖励和最终评估都需要独立审查。\n\n## DPO：另一种偏好优化路线\n\n直接偏好优化利用成对偏好数据构造训练目标，在其方法假设下避免完整的显式奖励模型加在线强化学习流程。它提供了相对简化的优化路线，但仍依赖偏好数据的质量和分布。不能因为流程较简单，就认为它适合所有模型和任务。\n\n对于产品经理，更重要的是理解输入数据是什么、希望改变哪类行为、如何检查改进及回退。具体算法选择由研究与工程团队结合资源和实验决定。把 SFT、偏好优化与数据准备、评估和发布放在同一条链路讨论，才能判断项目是否可落地。\n\n## 对齐不意味着所有目标都一致\n\n“对齐”可能涉及遵循指令、符合偏好、安全限制或特定任务目标。不同目标之间会有取舍。例如过度迎合用户可能牺牲事实性；过度保守可能降低任务完成。单一的“对齐更好”需要进一步说明究竟改善了哪种行为、对哪些用户有效。\n\n模型后训练也无法替代工具权限、数据隔离和业务规则。即使模型通常拒绝越权请求，服务端仍应独立校验实际权限；即使模型习惯输出 JSON，执行端仍需验证结构与业务条件。训练是在改变概率分布，系统约束承担另外一层责任。\n\n## 企业定制时的常见误判\n\n把最新政策全部塞进微调数据，可能仍难保证更新及时和引用可追溯；这类需求往往还需要检索。反过来，只靠检索也不一定解决稳定格式或特殊表达习惯。知识来源与行为适配是不同维度，应用可以组合多种方式。\n\n定制之前应建立基线，确认问题持续存在、数据可获得，并明确成本。训练后不仅看目标任务，还要检查通用能力、拒答、长尾和旧流程是否回退。模型、数据、提示和工具版本应一起记录，否则难以复现结果或定位变化原因。\n\n## 如何转化为产品需求\n\n需求应描述可观察行为，例如“资料不足时指出缺失条件”“工具失败时不宣称完成”，而非只写“模型更懂业务”。每项行为都应连接样例范围与评估标准。这样团队才能判断需要数据、提示、模型定制还是流程修改，也能把训练投入连接到实际产品收益。\n\n## 资料与延伸阅读\n\n- [Training language models to follow instructions with human feedback](https://arxiv.org/abs/2203.02155)\n- [Direct Preference Optimization 原论文](https://arxiv.org/abs/2305.18290)\n- [LoRA 原论文](https://arxiv.org/abs/2106.09685)\n\n核验日期：2026-11-14。企业摘要为教学构造例子；本文解释方法关系，不代表任何具体模型完整公开了其后训练流程。\n","chars":1229,"minutes":5,"summary":"预训练模型擅长延续文本，不一定自然遵循用户意图。后训练通过示范、偏好或其他反馈调整模型行为，使它更适合对话、工具使用和特定任务。SFT、RLHF 与 DPO 描述不同环节或方法，不能都简单理解为给模型补充知识。"},{"id":"02-06","title":"推理与采样：为什么同一问题回答不同","file":"content/02-06.md","level":"基础理解","prerequisites":["02-05"],"aliases":["LLM","Transformer","Token","Attention","RLHF"],"module":"02","moduleTitle":"大模型机制","html":"<p>推理是使用已有模型参数处理输入并生成结果的过程。它与改变参数的训练不同。语言模型通常逐步产生 Token，每一步都有若干候选及其概率，解码策略决定选哪个候选。这个过程解释了为什么同一问题可能得到不同回答，也解释了随机性与正确性为什么不能画等号。<\/p><h2 id=\"section-1\">从概率分布到输出<\/h2><p>给定上下文，模型为下一个 Token 计算分数，再转换为分布。贪心解码选择当前概率最高的候选；采样则允许按分布随机选择。一个 Token 产生后会加入上下文，影响下一步预测，因此早期的小差异可能导致后续回答明显不同。<\/p><p>教学构造例子：模型生成维修报告时，开头选了“可能原因”而非“确定原因”，后续表达结构就可能变化。语言流畅不代表每一步都有事实依据。输出是序列决策的结果，需要通过资料、结构和业务验证判断其是否适合实际使用。<\/p><h2 id=\"section-2\">Temperature、Top-p 与 Top-k<\/h2><p>Temperature 调整候选分布的集中程度：较低设置通常使高概率候选更突出，较高设置可能增加多样性。Top-k 限制候选数量，Top-p 根据累计概率保留候选集合。具体 API 支持与交互方式依模型和服务而异，应查当前文档。<\/p><p>这些参数控制生成方式，不是质量旋钮。降低随机性可能提高格式稳定性，却不能让错误知识自动变真；提高随机性可能有助于创意探索，也可能增加偏离。对于抽取、操作参数和合规文本，通常更重视可验证性；对于创意候选，则可以在生成后进行筛选。<\/p><h2 id=\"section-3\">为什么低随机性也不保证完全复现<\/h2><p>即使设置相同，服务端实现、模型版本、硬件与并行计算等因素仍可能带来差异。某些服务提供随机种子或版本固定选项，但其保证范围需要核验。产品不应把“温度为零”当作严格确定性的替代方案，尤其当输出直接触发业务操作时。<\/p><p>需要精确稳定的部分，可以通过规则和代码处理。例如金额计算由确定性计算器完成，设备编号从结构化字段传递，权限由服务端检查。模型负责理解和提出候选，执行前再验证。这种分工比依赖一个参数设置更可靠。<\/p><h2 id=\"section-4\">生成长度与停止条件<\/h2><p>输出长度限制可能导致回答截断，停止词或结构边界也可能使生成提前结束。产品需要区分自然完成、达到 Token 上限、工具调用、内容限制和异常中断。收到一段文字不等于任务已完成，特别是要求 JSON、代码或长报告时。<\/p><p>教学构造例子：生成配置文件时，输出达到限制，末尾缺少必要字段。若界面直接展示“生成成功”，会误导用户。应检查完成原因、解析结果及业务必填项，并给出继续生成或重新组织任务的路径。流式展示还应明确文本仍在生成，避免过早执行。<\/p><h2 id=\"section-5\">推理成本的组成<\/h2><p>输入处理、逐步生成、工具等待和额外推理计算都可能影响时延。用户感受到的首字等待与完整完成时间是不同指标。让模型输出更长的解释，既可能改善理解，也会增加等待和成本。输出应该服务于用户任务，而不是默认越详细越好。<\/p><p>比较模型或提示时，需要记录模型版本、输入、解码配置、工具条件和重复运行方式。只比较一次输出容易受到随机性影响。对高风险流程，更应看错误类型与稳定性，而非挑选最漂亮的演示结果。<\/p><h2 id=\"section-6\">产品设计中的应用<\/h2><p>可把创意生成与最终执行分成不同阶段：先获得候选，再用明确标准筛选、编辑和确认。对需要精确结果的任务，则优先使用结构化数据和确定性检查。理解采样机制后，你可以更合理地设计重试、候选数量和默认设置，并解释结果变化的实际原因。<\/p><h3 id=\"section-7\">重试需要改变什么<\/h3><p>原样重试可能因为随机性得到不同输出，却不代表根因已修复。若缺少资料或参数，应该先补充信息；若出现暂时服务错误，再采用有限重试。记录每次尝试及其成本，才能区分偶然成功与可靠恢复。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://huggingface.co/docs/transformers/main_classes/text_generation\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：Generation documentation<\/a><\/li><li><a href=\"https://huggingface.co/learn/llm-course/chapter1/1\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：LLM Course<\/a><\/li><\/ul><p>核验日期：2026-11-14。报告和配置为教学构造示例；具体采样参数和复现保证需按目标服务核验。<\/p>","toc":[{"id":"section-1","title":"从概率分布到输出","level":2},{"id":"section-2","title":"Temperature、Top-p 与 Top-k","level":2},{"id":"section-3","title":"为什么低随机性也不保证完全复现","level":2},{"id":"section-4","title":"生成长度与停止条件","level":2},{"id":"section-5","title":"推理成本的组成","level":2},{"id":"section-6","title":"产品设计中的应用","level":2},{"id":"section-7","title":"重试需要改变什么","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"推理是使用已有模型参数处理输入并生成结果的过程。它与改变参数的训练不同。语言模型通常逐步产生 Token，每一步都有若干候选及其概率，解码策略决定选哪个候选。这个过程解释了为什么同一问题可能得到不同回答，也解释了随机性与正确性为什么不能画等号。\n\n## 从概率分布到输出\n\n给定上下文，模型为下一个 Token 计算分数，再转换为分布。贪心解码选择当前概率最高的候选；采样则允许按分布随机选择。一个 Token 产生后会加入上下文，影响下一步预测，因此早期的小差异可能导致后续回答明显不同。\n\n教学构造例子：模型生成维修报告时，开头选了“可能原因”而非“确定原因”，后续表达结构就可能变化。语言流畅不代表每一步都有事实依据。输出是序列决策的结果，需要通过资料、结构和业务验证判断其是否适合实际使用。\n\n## Temperature、Top-p 与 Top-k\n\nTemperature 调整候选分布的集中程度：较低设置通常使高概率候选更突出，较高设置可能增加多样性。Top-k 限制候选数量，Top-p 根据累计概率保留候选集合。具体 API 支持与交互方式依模型和服务而异，应查当前文档。\n\n这些参数控制生成方式，不是质量旋钮。降低随机性可能提高格式稳定性，却不能让错误知识自动变真；提高随机性可能有助于创意探索，也可能增加偏离。对于抽取、操作参数和合规文本，通常更重视可验证性；对于创意候选，则可以在生成后进行筛选。\n\n## 为什么低随机性也不保证完全复现\n\n即使设置相同，服务端实现、模型版本、硬件与并行计算等因素仍可能带来差异。某些服务提供随机种子或版本固定选项，但其保证范围需要核验。产品不应把“温度为零”当作严格确定性的替代方案，尤其当输出直接触发业务操作时。\n\n需要精确稳定的部分，可以通过规则和代码处理。例如金额计算由确定性计算器完成，设备编号从结构化字段传递，权限由服务端检查。模型负责理解和提出候选，执行前再验证。这种分工比依赖一个参数设置更可靠。\n\n## 生成长度与停止条件\n\n输出长度限制可能导致回答截断，停止词或结构边界也可能使生成提前结束。产品需要区分自然完成、达到 Token 上限、工具调用、内容限制和异常中断。收到一段文字不等于任务已完成，特别是要求 JSON、代码或长报告时。\n\n教学构造例子：生成配置文件时，输出达到限制，末尾缺少必要字段。若界面直接展示“生成成功”，会误导用户。应检查完成原因、解析结果及业务必填项，并给出继续生成或重新组织任务的路径。流式展示还应明确文本仍在生成，避免过早执行。\n\n## 推理成本的组成\n\n输入处理、逐步生成、工具等待和额外推理计算都可能影响时延。用户感受到的首字等待与完整完成时间是不同指标。让模型输出更长的解释，既可能改善理解，也会增加等待和成本。输出应该服务于用户任务，而不是默认越详细越好。\n\n比较模型或提示时，需要记录模型版本、输入、解码配置、工具条件和重复运行方式。只比较一次输出容易受到随机性影响。对高风险流程，更应看错误类型与稳定性，而非挑选最漂亮的演示结果。\n\n## 产品设计中的应用\n\n可把创意生成与最终执行分成不同阶段：先获得候选，再用明确标准筛选、编辑和确认。对需要精确结果的任务，则优先使用结构化数据和确定性检查。理解采样机制后，你可以更合理地设计重试、候选数量和默认设置，并解释结果变化的实际原因。\n\n### 重试需要改变什么\n\n原样重试可能因为随机性得到不同输出，却不代表根因已修复。若缺少资料或参数，应该先补充信息；若出现暂时服务错误，再采用有限重试。记录每次尝试及其成本，才能区分偶然成功与可靠恢复。\n\n## 资料与延伸阅读\n\n- [Hugging Face：Generation documentation](https://huggingface.co/docs/transformers/main_classes/text_generation)\n- [Hugging Face：LLM Course](https://huggingface.co/learn/llm-course/chapter1/1)\n\n核验日期：2026-11-14。报告和配置为教学构造示例；具体采样参数和复现保证需按目标服务核验。\n","chars":1280,"minutes":5,"summary":"推理是使用已有模型参数处理输入并生成结果的过程。它与改变参数的训练不同。语言模型通常逐步产生 Token，每一步都有若干候选及其概率，解码策略决定选哪个候选。这个过程解释了为什么同一问题可能得到不同回答，也解释了随机性与正确性为什么不能画等号。"},{"id":"02-07","title":"上下文、位置与长文：窗口不等于记忆","file":"content/02-07.md","level":"基础理解","prerequisites":["02-06"],"aliases":["LLM","Transformer","Token","Attention","RLHF"],"module":"02","moduleTitle":"大模型机制","html":"<p>上下文是模型当前生成时能够接收的信息集合，可能包含系统指令、用户输入、历史对话、检索资料和工具返回。上下文窗口描述容量边界，而记忆是应用持续保存、选择和重新提供信息的机制。二者相关，却不能互相替代。<\/p><h2 id=\"section-1\">一次请求实际包含什么<\/h2><p>用户只看到一句提问，后台可能还加入角色说明、工具定义、账号信息、历史摘要和检索片段。这些内容共同竞争有限空间。上下文工程要决定哪些信息最有用、哪些可信、放在何处，以及何时更新。它比单纯把提示写得更长更复杂。<\/p><p>教学构造例子：工单 Agent 需要当前客户、产品型号和最新进度，不一定需要此前十轮完整闲聊。保留全部历史会增加噪声；只保留简短摘要又可能丢失用户授权范围。需要区分对话叙述、持久偏好、任务状态和关键业务事实，并采用不同保存方式。<\/p><h2 id=\"section-2\">窗口容量不等于实际利用质量<\/h2><p>能够接收某个长度，不代表在全部位置都同样准确地定位和整合信息。任务复杂度、资料冲突、信息位置与格式都会影响结果。长窗口也不能让模型自动识别过期资料或不可信文本。容量是必要约束之一，质量仍需实际任务验证。<\/p><p>如果用户上传多份相互冲突的制度，系统应保留版本、适用组织和生效时间，让模型能够比较条件。把所有内容拼成无来源的大段文本，会让模型更难解释依据，也让后续排查失去线索。文档结构和元数据是上下文质量的一部分。<\/p><h2 id=\"section-3\">历史对话如何变成记忆<\/h2><p>应用可以保存用户偏好、任务摘要或结构化事实，在后续请求中按需读取。保存本身不是模型参数更新；模型只有在相关信息再次进入当前输入时，才能据此生成。搜索式记忆也可能漏检、误召回或保留过时内容，因此需要来源、更新时间和删除机制。<\/p><p>例如用户曾说“报告默认用中文”，可作为明确偏好；某次讨论中的临时假设则不宜自动永久保存。把模型推测写入长期记忆，可能在后续逐渐被当成事实。记忆应区分用户声明、系统观测和推断，并允许用户查看与纠正。<\/p><h2 id=\"section-4\">压缩带来的收益与损失<\/h2><p>摘要能够降低上下文长度，但它是有损处理。数字、限定词、否定条件和授权边界尤其容易在压缩中丢失。对关键状态，使用结构化字段和原始证据链接往往更合适。摘要负责帮助理解，精确记录负责支撑执行。<\/p><p>教学构造例子：原始授权是“生成草稿，确认后再发送”。若摘要变成“帮助用户发邮件”，后续 Agent 可能误解行动范围。压缩时应专门保留目标、已完成事项、待办、限制和需确认动作，并在执行前重新核对关键条件。<\/p><h2 id=\"section-5\">上下文污染与信任边界<\/h2><p>检索文档和网页可能包含看似指令的文本。它们应作为待分析的数据，而非自动获得系统指令的权限。仅靠排版不能保证安全，应用还需要权限校验和工具约束。上下文组织有助于减少混淆，但不能承担全部防护责任。<\/p><p>随着任务推进，工具返回可能重复、冗长或互相冲突。应选择真正影响下一步的内容，保留必要证据，并避免无休止累积。长任务还可以把大任务拆成阶段，用明确状态交接，而不是依赖不断增长的单一对话。<\/p><h2 id=\"section-6\">对产品承诺的影响<\/h2><p>“记住用户”应说明记住什么、保存多久、在哪些场景使用，以及如何删除。对话历史可见、长期偏好保存和任务断点恢复是不同能力。把这些机制具体化，既能帮助用户形成正确预期，也能让研发清楚实现与验收范围。<\/p><h3 id=\"section-7\">用户可见的记忆控制<\/h3><p>偏好保存应允许查看、纠正与删除，并明确作用范围。一个账号下的个人偏好，不一定适合整个团队。临时任务信息也不应默认成为长期事实。控制能力应与真实存储机制对应，避免界面上的删除只隐藏展示，却保留后续仍会调用的内容。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Effective context engineering<\/a><\/li><li><a href=\"https://arxiv.org/abs/1706.03762\" target=\"_blank\" rel=\"noopener noreferrer\">Attention Is All You Need 原论文<\/a><\/li><\/ul><p>核验日期：2026-11-14。工单与邮件授权为教学构造例子；上下文和存储能力取决于具体模型及应用实现。<\/p>","toc":[{"id":"section-1","title":"一次请求实际包含什么","level":2},{"id":"section-2","title":"窗口容量不等于实际利用质量","level":2},{"id":"section-3","title":"历史对话如何变成记忆","level":2},{"id":"section-4","title":"压缩带来的收益与损失","level":2},{"id":"section-5","title":"上下文污染与信任边界","level":2},{"id":"section-6","title":"对产品承诺的影响","level":2},{"id":"section-7","title":"用户可见的记忆控制","level":3},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"上下文是模型当前生成时能够接收的信息集合，可能包含系统指令、用户输入、历史对话、检索资料和工具返回。上下文窗口描述容量边界，而记忆是应用持续保存、选择和重新提供信息的机制。二者相关，却不能互相替代。\n\n## 一次请求实际包含什么\n\n用户只看到一句提问，后台可能还加入角色说明、工具定义、账号信息、历史摘要和检索片段。这些内容共同竞争有限空间。上下文工程要决定哪些信息最有用、哪些可信、放在何处，以及何时更新。它比单纯把提示写得更长更复杂。\n\n教学构造例子：工单 Agent 需要当前客户、产品型号和最新进度，不一定需要此前十轮完整闲聊。保留全部历史会增加噪声；只保留简短摘要又可能丢失用户授权范围。需要区分对话叙述、持久偏好、任务状态和关键业务事实，并采用不同保存方式。\n\n## 窗口容量不等于实际利用质量\n\n能够接收某个长度，不代表在全部位置都同样准确地定位和整合信息。任务复杂度、资料冲突、信息位置与格式都会影响结果。长窗口也不能让模型自动识别过期资料或不可信文本。容量是必要约束之一，质量仍需实际任务验证。\n\n如果用户上传多份相互冲突的制度，系统应保留版本、适用组织和生效时间，让模型能够比较条件。把所有内容拼成无来源的大段文本，会让模型更难解释依据，也让后续排查失去线索。文档结构和元数据是上下文质量的一部分。\n\n## 历史对话如何变成记忆\n\n应用可以保存用户偏好、任务摘要或结构化事实，在后续请求中按需读取。保存本身不是模型参数更新；模型只有在相关信息再次进入当前输入时，才能据此生成。搜索式记忆也可能漏检、误召回或保留过时内容，因此需要来源、更新时间和删除机制。\n\n例如用户曾说“报告默认用中文”，可作为明确偏好；某次讨论中的临时假设则不宜自动永久保存。把模型推测写入长期记忆，可能在后续逐渐被当成事实。记忆应区分用户声明、系统观测和推断，并允许用户查看与纠正。\n\n## 压缩带来的收益与损失\n\n摘要能够降低上下文长度，但它是有损处理。数字、限定词、否定条件和授权边界尤其容易在压缩中丢失。对关键状态，使用结构化字段和原始证据链接往往更合适。摘要负责帮助理解，精确记录负责支撑执行。\n\n教学构造例子：原始授权是“生成草稿，确认后再发送”。若摘要变成“帮助用户发邮件”，后续 Agent 可能误解行动范围。压缩时应专门保留目标、已完成事项、待办、限制和需确认动作，并在执行前重新核对关键条件。\n\n## 上下文污染与信任边界\n\n检索文档和网页可能包含看似指令的文本。它们应作为待分析的数据，而非自动获得系统指令的权限。仅靠排版不能保证安全，应用还需要权限校验和工具约束。上下文组织有助于减少混淆，但不能承担全部防护责任。\n\n随着任务推进，工具返回可能重复、冗长或互相冲突。应选择真正影响下一步的内容，保留必要证据，并避免无休止累积。长任务还可以把大任务拆成阶段，用明确状态交接，而不是依赖不断增长的单一对话。\n\n## 对产品承诺的影响\n\n“记住用户”应说明记住什么、保存多久、在哪些场景使用，以及如何删除。对话历史可见、长期偏好保存和任务断点恢复是不同能力。把这些机制具体化，既能帮助用户形成正确预期，也能让研发清楚实现与验收范围。\n\n### 用户可见的记忆控制\n\n偏好保存应允许查看、纠正与删除，并明确作用范围。一个账号下的个人偏好，不一定适合整个团队。临时任务信息也不应默认成为长期事实。控制能力应与真实存储机制对应，避免界面上的删除只隐藏展示，却保留后续仍会调用的内容。\n\n## 资料与延伸阅读\n\n- [Anthropic：Effective context engineering](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n- [Attention Is All You Need 原论文](https://arxiv.org/abs/1706.03762)\n\n核验日期：2026-11-14。工单与邮件授权为教学构造例子；上下文和存储能力取决于具体模型及应用实现。\n","chars":1290,"minutes":5,"summary":"上下文是模型当前生成时能够接收的信息集合，可能包含系统指令、用户输入、历史对话、检索资料和工具返回。上下文窗口描述容量边界，而记忆是应用持续保存、选择和重新提供信息的机制。二者相关，却不能互相替代。"},{"id":"02-08","title":"推理模型、幻觉与知识边界","file":"content/02-08.md","level":"基础理解","prerequisites":["02-07"],"aliases":["LLM","Transformer","Token","Attention","RLHF"],"module":"02","moduleTitle":"大模型机制","html":"<p>推理能力指模型处理多步关系、约束和问题求解的表现；幻觉通常指生成了缺乏依据、与事实不符或与给定资料冲突的内容。二者并不互相排斥：模型可以在复杂问题中表现出色，也可能在简单事实或执行结果上犯错。产品需要分别理解能力和可靠性。<\/p><h2 id=\"section-1\">多步推理能够帮助什么<\/h2><p>将复杂问题分解、检查中间结果或使用额外计算，可能提高某些任务表现。模型也可以借助代码、搜索和计算器完成单靠文字生成难以稳定处理的工作。但增加步骤会带来更多成本与新的失败点，并不保证每一步都正确。<\/p><p>教学构造例子：比较两种采购方案，需要提取数量、价格、交期和约束，再计算总成本。模型可以组织分析流程，但金额计算宜交给确定性工具，最终还要核对输入单位和适用条件。推理表现良好不意味着有权直接下单，行动授权仍是独立问题。<\/p><h2 id=\"section-2\">可见解释不等于内部机制证明<\/h2><p>模型给出的自然语言解释可能帮助用户理解结果，但不能自动证明它真实反映了内部计算过程。解释也可能流畅却错误。产品应优先展示可验证的依据、计算结果、工具返回和关键决策，而不是把一段很长的思考文字当作正确性保证。<\/p><p>对于用户而言，清楚的计划、执行状态和结果依据往往更有价值。需要调试时，可以记录可观察的输入输出、工具调用、检索材料和校验结果。这样的执行证据能够被检查，也更便于比较不同版本。<\/p><h2 id=\"section-3\">幻觉不只有编造知识<\/h2><p>常见形式包括虚构引用、错误归因、忽略限制条件、把推断写成事实，以及声称完成了实际未执行的动作。知识库助手可能引用真实文档却曲解内容；工具 Agent 可能在接口失败后仍说“已创建”。不同形式对应不同修复方式，不能统一归为模型不够聪明。<\/p><p>信息缺失、训练材料中的错误、上下文冲突、任务诱导和系统反馈不足，都可能导致不可靠输出。即使加入“不要编造”指令，也无法消除所有问题。需要将证据获取、答案约束和结果校验组合起来，并在无法确认时提供合适的下一步。<\/p><h2 id=\"section-4\">检索与工具怎样改变边界<\/h2><p>RAG 可以提供外部资料，但检索可能命中错版本或遗漏关键条款。工具可以提供实时状态，但调用可能超时或返回不完整。模型能访问工具，并不代表它总会选择正确工具或正确解读结果。因此必须分别检查资料、调用与生成三层。<\/p><p>教学构造例子：用户询问设备是否可恢复运行。模型找到相似型号手册并给出步骤，语言上非常专业，但型号不一致可能导致严重问题。正确路径应先确认型号、资料版本和现场条件，再决定是否能给出建议。高风险场景还需要专业判断与明确控制边界。<\/p><h2 id=\"section-5\">如何判断需要更强模型还是更好系统<\/h2><p>如果错误来自复杂约束理解，可以比较更适配模型；来自知识缺失则检查检索与数据；来自工具结果未回填则修复流程；来自执行后未核验则补充完成判定。先做失败分类，才能避免用更昂贵模型掩盖系统缺陷。<\/p><p>评估应覆盖真实任务、长尾和失败条件，并记录模型版本、输入、工具状态与结果。对同一任务多次运行，可以观察稳定性；对关键错误应单独报告，避免被平均成功率掩盖。推理预算增加后的收益，也需要与延迟和成本一起衡量。<\/p><h2 id=\"section-6\">面向用户的可靠性设计<\/h2><p>提供来源、明确缺失条件、允许编辑与接管，并在关键动作前确认，能够让用户合理依赖系统。承诺应围绕经过验证的能力范围。持续改进的重点是减少特定失败、扩大可验证任务范围，而不是宣称模型已经不会幻觉。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/2203.02155\" target=\"_blank\" rel=\"noopener noreferrer\">InstructGPT 原论文<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Building effective agents<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Effective context engineering<\/a><\/li><\/ul><p>核验日期：2026-11-14。采购与设备情境为教学构造，不代表具体模型的实测结论。<\/p>","toc":[{"id":"section-1","title":"多步推理能够帮助什么","level":2},{"id":"section-2","title":"可见解释不等于内部机制证明","level":2},{"id":"section-3","title":"幻觉不只有编造知识","level":2},{"id":"section-4","title":"检索与工具怎样改变边界","level":2},{"id":"section-5","title":"如何判断需要更强模型还是更好系统","level":2},{"id":"section-6","title":"面向用户的可靠性设计","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"推理能力指模型处理多步关系、约束和问题求解的表现；幻觉通常指生成了缺乏依据、与事实不符或与给定资料冲突的内容。二者并不互相排斥：模型可以在复杂问题中表现出色，也可能在简单事实或执行结果上犯错。产品需要分别理解能力和可靠性。\n\n## 多步推理能够帮助什么\n\n将复杂问题分解、检查中间结果或使用额外计算，可能提高某些任务表现。模型也可以借助代码、搜索和计算器完成单靠文字生成难以稳定处理的工作。但增加步骤会带来更多成本与新的失败点，并不保证每一步都正确。\n\n教学构造例子：比较两种采购方案，需要提取数量、价格、交期和约束，再计算总成本。模型可以组织分析流程，但金额计算宜交给确定性工具，最终还要核对输入单位和适用条件。推理表现良好不意味着有权直接下单，行动授权仍是独立问题。\n\n## 可见解释不等于内部机制证明\n\n模型给出的自然语言解释可能帮助用户理解结果，但不能自动证明它真实反映了内部计算过程。解释也可能流畅却错误。产品应优先展示可验证的依据、计算结果、工具返回和关键决策，而不是把一段很长的思考文字当作正确性保证。\n\n对于用户而言，清楚的计划、执行状态和结果依据往往更有价值。需要调试时，可以记录可观察的输入输出、工具调用、检索材料和校验结果。这样的执行证据能够被检查，也更便于比较不同版本。\n\n## 幻觉不只有编造知识\n\n常见形式包括虚构引用、错误归因、忽略限制条件、把推断写成事实，以及声称完成了实际未执行的动作。知识库助手可能引用真实文档却曲解内容；工具 Agent 可能在接
