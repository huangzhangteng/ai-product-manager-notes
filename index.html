\"#3b7056\" font-family=\"sans-serif\">1<\/text><text x=\"65\" y=\"84\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">目标与约束<\/text><text x=\"37\" y=\"109\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">明确产物、允许行动、预算和完成标准<\/text><path d=\"M180 131 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"148\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"172\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"176\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">2<\/text><text x=\"65\" y=\"176\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">状态与计划<\/text><text x=\"37\" y=\"201\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">读取事实，决定下一步可执行动作<\/text><path d=\"M180 223 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"240\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"264\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">3<\/text><text x=\"65\" y=\"268\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">行动与观察<\/text><text x=\"37\" y=\"293\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">调用工具，取得真实结果与错误信息<\/text><path d=\"M180 315 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"332\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"356\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"360\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">4<\/text><text x=\"65\" y=\"360\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">更新与判断<\/text><text x=\"37\" y=\"385\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">更新状态，判断继续、恢复或升级<\/text><path d=\"M180 407 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"424\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"448\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"452\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">5<\/text><text x=\"65\" y=\"452\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">结束与交付<\/text><text x=\"37\" y=\"477\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">以完成证据交付；未完成部分明确说明<\/text><text x=\"24\" y=\"558\" font-size=\"10.5\" fill=\"#6a816c\" font-family=\"sans-serif\">第 2—4 步可循环，停止条件始终由系统控制。<\/text><\/svg><figcaption>Agent行动循环与停止条件 · 本知识库绘制的机制示意<\/figcaption><\/figure><h2 id=\"section-1\">目标如何变成行动<\/h2><p>用户目标通常缺少足够明确的条件。系统先确认对象、范围、约束和预期产物，再结合当前状态选择动作。动作可以是读取资料、调用业务工具、询问用户、写入文件或结束任务。模型提出的动作需要经过应用的参数、权限和业务校验，然后才由执行环境实际完成。<\/p><p>结果返回后，Agent更新对任务的理解：已获得什么事实，哪些步骤完成，是否出现新限制。它再选择下一动作，直到满足完成条件或达到预算、权限和失败边界。ReAct等研究将推理与行动交替作为重要模式，但具体产品并不需要公开模型隐藏的内部推理文本。<\/p><h2 id=\"section-2\">观察不是简单回显<\/h2><p>观察可以包括工具返回数据、错误码、页面截图、对象状态和用户反馈。Agent需要区分事实与解释：工具说申请已创建，是一个可验证状态；模型自己说“应该已经创建”，不是同等证据。观察质量不足，后续规划就可能建立在错误基础上。<\/p><p>教学构造：研究助手先搜索行业资料，发现用户指定的时间范围内没有足够数据。合理调整可能是改用官方统计、说明缺口或询问是否扩大范围；不合理调整则是默默使用更早数据并声称完成。目标与约束必须贯穿循环，不能在追求完成时被悄悄改写。<\/p><h2 id=\"section-3\">工具、状态与记忆如何配合<\/h2><p>工具提供行动能力，状态记录当前任务进展，记忆保存可复用信息。聊天历史可以承载部分上下文，却不是可靠的业务数据库。重要结果需要对象标识、版本和来源；长期偏好需要明确来源和更新方式；敏感信息则应受到保存范围与访问控制。<\/p><p>上下文有限时，系统可能压缩历史，但摘要需要保留目标、约束、未完成步骤与关键证据。若只保留成功动作，丢掉失败原因，Agent可能重复同样尝试。任务恢复时也要检查外部状态是否已经改变，不能机械地按旧摘要继续执行。<\/p><h2 id=\"section-4\">停止也是一种重要决策<\/h2><p>Agent不仅要决定做什么，还要决定何时不继续。完成应有外部可检查的条件，例如报告已保存且覆盖规定主题，或订单状态已确认。预算耗尽、工具不可用、目标不清、权限不足和连续无进展都可能要求停止或转交用户。<\/p><p>无限循环常表现为重复搜索、反复修改相同文件、在多个工具间来回切换。应用可以记录步骤、结果变化和预算，并设置可解释的停止规则。规则不是简单限制模型能力，而是避免不确定决策持续消耗资源或扩大影响。<\/p><h2 id=\"section-5\">产品设计中的落点<\/h2><p>定义Agent产品时，应分别说明目标输入、可用动作、状态表示、观察来源、完成条件和失败出口。还要确定哪些结果需要向用户展示、何时可以继续后台运行，以及用户怎样修改或取消任务。仅写“自动完成用户目标”没有提供足够执行边界。<\/p><p>对质量的评价应同时覆盖最终结果和执行过程。一个结果看似正确，却读取了不该读取的资料或重复发信，仍不是可接受成功。Agent能力来自模型、工具、环境和控制机制的共同作用，不能只用模型榜单推断整个系统效果。<\/p><h2 id=\"section-6\">进一步的系统判断<\/h2><p>循环中的每一步还应有明确关联标识。一个工具请求可能异步返回，多个请求也可能交错完成；应用需要知道结果属于哪个任务和哪次行动。若把过期结果注入当前上下文，模型可能基于错误状态继续执行。因此，行动编号、对象版本和结果时间不是纯日志细节，而是控制正确性的基础。模型可以选择下一步，但不能替代这些确定性关联机制。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://arxiv.org/abs/2210.03629\" target=\"_blank\" rel=\"noopener noreferrer\">ReAct原论文：推理与行动结合<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Agent与可组合模式<\/a><\/li><\/ul><p>资料核验：2026-11-14。研究助手为教学构造；本文不将模型解释文本等同于真实内部推理。<\/p>","toc":[{"id":"section-1","title":"目标如何变成行动","level":2},{"id":"section-2","title":"观察不是简单回显","level":2},{"id":"section-3","title":"工具、状态与记忆如何配合","level":2},{"id":"section-4","title":"停止也是一种重要决策","level":2},{"id":"section-5","title":"产品设计中的落点","level":2},{"id":"section-6","title":"进一步的系统判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"Agent可以理解为围绕目标持续选择行动、观察结果并调整下一步的系统。与一次性回答相比，它的核心差异是执行循环：生成的内容会影响后续动作，外部世界的变化又会成为下一轮输入。产品经理需要理解整个循环，而不是只看最终那段自然语言。\n\n![Agent行动循环与停止条件](../site/diagrams/agent.svg)\n\n## 目标如何变成行动\n\n用户目标通常缺少足够明确的条件。系统先确认对象、范围、约束和预期产物，再结合当前状态选择动作。动作可以是读取资料、调用业务工具、询问用户、写入文件或结束任务。模型提出的动作需要经过应用的参数、权限和业务校验，然后才由执行环境实际完成。\n\n结果返回后，Agent更新对任务的理解：已获得什么事实，哪些步骤完成，是否出现新限制。它再选择下一动作，直到满足完成条件或达到预算、权限和失败边界。ReAct等研究将推理与行动交替作为重要模式，但具体产品并不需要公开模型隐藏的内部推理文本。\n\n## 观察不是简单回显\n\n观察可以包括工具返回数据、错误码、页面截图、对象状态和用户反馈。Agent需要区分事实与解释：工具说申请已创建，是一个可验证状态；模型自己说“应该已经创建”，不是同等证据。观察质量不足，后续规划就可能建立在错误基础上。\n\n教学构造：研究助手先搜索行业资料，发现用户指定的时间范围内没有足够数据。合理调整可能是改用官方统计、说明缺口或询问是否扩大范围；不合理调整则是默默使用更早数据并声称完成。目标与约束必须贯穿循环，不能在追求完成时被悄悄改写。\n\n## 工具、状态与记忆如何配合\n\n工具提供行动能力，状态记录当前任务进展，记忆保存可复用信息。聊天历史可以承载部分上下文，却不是可靠的业务数据库。重要结果需要对象标识、版本和来源；长期偏好需要明确来源和更新方式；敏感信息则应受到保存范围与访问控制。\n\n上下文有限时，系统可能压缩历史，但摘要需要保留目标、约束、未完成步骤与关键证据。若只保留成功动作，丢掉失败原因，Agent可能重复同样尝试。任务恢复时也要检查外部状态是否已经改变，不能机械地按旧摘要继续执行。\n\n## 停止也是一种重要决策\n\nAgent不仅要决定做什么，还要决定何时不继续。完成应有外部可检查的条件，例如报告已保存且覆盖规定主题，或订单状态已确认。预算耗尽、工具不可用、目标不清、权限不足和连续无进展都可能要求停止或转交用户。\n\n无限循环常表现为重复搜索、反复修改相同文件、在多个工具间来回切换。应用可以记录步骤、结果变化和预算，并设置可解释的停止规则。规则不是简单限制模型能力，而是避免不确定决策持续消耗资源或扩大影响。\n\n## 产品设计中的落点\n\n定义Agent产品时，应分别说明目标输入、可用动作、状态表示、观察来源、完成条件和失败出口。还要确定哪些结果需要向用户展示、何时可以继续后台运行，以及用户怎样修改或取消任务。仅写“自动完成用户目标”没有提供足够执行边界。\n\n对质量的评价应同时覆盖最终结果和执行过程。一个结果看似正确，却读取了不该读取的资料或重复发信，仍不是可接受成功。Agent能力来自模型、工具、环境和控制机制的共同作用，不能只用模型榜单推断整个系统效果。\n\n## 进一步的系统判断\n\n循环中的每一步还应有明确关联标识。一个工具请求可能异步返回，多个请求也可能交错完成；应用需要知道结果属于哪个任务和哪次行动。若把过期结果注入当前上下文，模型可能基于错误状态继续执行。因此，行动编号、对象版本和结果时间不是纯日志细节，而是控制正确性的基础。模型可以选择下一步，但不能替代这些确定性关联机制。\n\n## 资料与延伸阅读\n\n- [ReAct原论文：推理与行动结合](https://arxiv.org/abs/2210.03629)\n- [Anthropic：Agent与可组合模式](https://www.anthropic.com/engineering/building-effective-agents)\n\n资料核验：2026-11-14。研究助手为教学构造；本文不将模型解释文本等同于真实内部推理。\n","chars":1298,"minutes":5,"summary":"Agent可以理解为围绕目标持续选择行动、观察结果并调整下一步的系统。与一次性回答相比，它的核心差异是执行循环：生成的内容会影响后续动作，外部世界的变化又会成为下一轮输入。产品经理需要理解整个循环，而不是只看最终那段自然语言。"},{"id":"09-02","title":"规划、任务分解与动态调整","file":"content/09-02.md","level":"工作应用","prerequisites":["09-01"],"aliases":["Agent","智能体","多智能体","memory"],"module":"09","moduleTitle":"Agent 系统","html":"<p>复杂目标需要分解，但一份看起来完整的计划并不保证可执行。Agent规划的价值是把目标、依赖、工具和验证条件组织起来，并在新信息出现时调整。计划应服务任务进展，而不是成为必须照抄的长清单。<\/p><h2 id=\"section-1\">从结果倒推子任务<\/h2><p>教学构造：用户要求“比较三家供应商并整理采购建议”。系统可以拆为确认比较标准、查找资料、核对来源、提取可比字段、分析差异和形成建议。每个子任务应有输入和产物，关键步骤还应说明完成依据。没有比较标准，搜集再多资料也可能无法支持决策。<\/p><p>任务分解需要考虑依赖。确定候选供应商后才能研究其报价，取得最新报价后才能计算成本。独立资料搜集可以并行，但综合结论需要等待必要信息。分解过细会增加调度成本，过粗则难发现具体阻塞，应按可验证产物与工具边界选择粒度。<\/p><h2 id=\"section-2\">静态计划与动态计划<\/h2><p>静态计划适合路径可预测的任务，便于展示与审查；动态规划允许根据观察改变步骤，更适合开放研究和复杂操作。实际产品可先生成高层计划，再逐步细化下一段动作，而不是一开始决定全部微操作。<\/p><p>若发现某供应商没有公开报价，系统可以标记缺口、使用明确可比的替代维度，或请求用户资料。它不能为了完成计划而编造价格。重新规划应保留原目标和约束，并记录为什么调整，特别是范围、成本或对外影响发生变化时。<\/p><h2 id=\"section-3\">计划中的验证节点<\/h2><p>每个重要阶段都可以有检查点：资料是否满足日期要求，字段是否可比，计算是否可复核，最终建议是否覆盖用户问题。验证可以由规则、代码、独立模型或人工完成。单纯让同一个模型说“检查通过”未必能发现它自身的盲点。<\/p><p>验证强度与风险匹配。一个内部研究摘要可以允许用户继续编辑，自动提交采购申请则需要明确金额、供应商、审批与权限检查。把高影响动作放在可审查的阶段，能减少错误执行，也有助于用户理解系统为何需要确认。<\/p><h2 id=\"section-4\">常见规划失败<\/h2><p>第一类是不可执行计划，例如要求调用不存在的工具；第二类是遗漏约束，例如忽视预算；第三类是只完成局部而宣称全局完成；第四类是计划僵化，新证据出现后仍继续错误路径。还有“过度规划”，花大量时间设计步骤，却没有产生可用结果。<\/p><p>工具能力发现、计划可执行校验、阶段产物检查和预算控制可以分别应对这些问题。计划不应假设外部服务始终可用，也应有无资料、拒绝授权、来源冲突等分支。对于高频稳定任务，经过验证的工作流可能比每次重新规划更可靠。<\/p><h2 id=\"section-5\">用户是否需要看到计划<\/h2><p>用户需要知道范围、关键动作和潜在影响，但通常不需要阅读全部内部调用细节。可以展示“查找资料—核对信息—形成比较”，在涉及发送、付款或数据变更前单独说明。计划变更若只影响内部检索，可以简短更新；若扩大范围或预算，应依据授权规则处理。<\/p><p>产品经理可以把计划作为协作界面，而不是思考过程展示。好的计划让用户能纠正目标、发现遗漏并理解等待原因。最终仍需用实际产物证明进展，而不能因为界面中的步骤被打勾，就推断任务已经正确完成。<\/p><h2 id=\"section-6\">进一步的系统判断<\/h2><p>规划还需要区分必要步骤与可选优化。先完成核心资料核验，再决定是否增加图表，可以避免任务在美化环节耗尽预算。若用户只要求比较功能，系统不应自行扩大到联系供应商或获取私人报价。计划范围应与用户目标一致，新增步骤要说明它支持哪个结果。这样能够减少看似勤奋、实际上偏离目标的执行。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：层级分解、协调与循环模式<\/a><\/li><li><a href=\"https://arxiv.org/abs/2210.03629\" target=\"_blank\" rel=\"noopener noreferrer\">ReAct：根据观察调整行动<\/a><\/li><\/ul><p>资料核验：2026-11-14。供应商比较为教学构造；具体商业结论应以实际资料为依据。<\/p>","toc":[{"id":"section-1","title":"从结果倒推子任务","level":2},{"id":"section-2","title":"静态计划与动态计划","level":2},{"id":"section-3","title":"计划中的验证节点","level":2},{"id":"section-4","title":"常见规划失败","level":2},{"id":"section-5","title":"用户是否需要看到计划","level":2},{"id":"section-6","title":"进一步的系统判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"复杂目标需要分解，但一份看起来完整的计划并不保证可执行。Agent规划的价值是把目标、依赖、工具和验证条件组织起来，并在新信息出现时调整。计划应服务任务进展，而不是成为必须照抄的长清单。\n\n## 从结果倒推子任务\n\n教学构造：用户要求“比较三家供应商并整理采购建议”。系统可以拆为确认比较标准、查找资料、核对来源、提取可比字段、分析差异和形成建议。每个子任务应有输入和产物，关键步骤还应说明完成依据。没有比较标准，搜集再多资料也可能无法支持决策。\n\n任务分解需要考虑依赖。确定候选供应商后才能研究其报价，取得最新报价后才能计算成本。独立资料搜集可以并行，但综合结论需要等待必要信息。分解过细会增加调度成本，过粗则难发现具体阻塞，应按可验证产物与工具边界选择粒度。\n\n## 静态计划与动态计划\n\n静态计划适合路径可预测的任务，便于展示与审查；动态规划允许根据观察改变步骤，更适合开放研究和复杂操作。实际产品可先生成高层计划，再逐步细化下一段动作，而不是一开始决定全部微操作。\n\n若发现某供应商没有公开报价，系统可以标记缺口、使用明确可比的替代维度，或请求用户资料。它不能为了完成计划而编造价格。重新规划应保留原目标和约束，并记录为什么调整，特别是范围、成本或对外影响发生变化时。\n\n## 计划中的验证节点\n\n每个重要阶段都可以有检查点：资料是否满足日期要求，字段是否可比，计算是否可复核，最终建议是否覆盖用户问题。验证可以由规则、代码、独立模型或人工完成。单纯让同一个模型说“检查通过”未必能发现它自身的盲点。\n\n验证强度与风险匹配。一个内部研究摘要可以允许用户继续编辑，自动提交采购申请则需要明确金额、供应商、审批与权限检查。把高影响动作放在可审查的阶段，能减少错误执行，也有助于用户理解系统为何需要确认。\n\n## 常见规划失败\n\n第一类是不可执行计划，例如要求调用不存在的工具；第二类是遗漏约束，例如忽视预算；第三类是只完成局部而宣称全局完成；第四类是计划僵化，新证据出现后仍继续错误路径。还有“过度规划”，花大量时间设计步骤，却没有产生可用结果。\n\n工具能力发现、计划可执行校验、阶段产物检查和预算控制可以分别应对这些问题。计划不应假设外部服务始终可用，也应有无资料、拒绝授权、来源冲突等分支。对于高频稳定任务，经过验证的工作流可能比每次重新规划更可靠。\n\n## 用户是否需要看到计划\n\n用户需要知道范围、关键动作和潜在影响，但通常不需要阅读全部内部调用细节。可以展示“查找资料—核对信息—形成比较”，在涉及发送、付款或数据变更前单独说明。计划变更若只影响内部检索，可以简短更新；若扩大范围或预算，应依据授权规则处理。\n\n产品经理可以把计划作为协作界面，而不是思考过程展示。好的计划让用户能纠正目标、发现遗漏并理解等待原因。最终仍需用实际产物证明进展，而不能因为界面中的步骤被打勾，就推断任务已经正确完成。\n\n## 进一步的系统判断\n\n规划还需要区分必要步骤与可选优化。先完成核心资料核验，再决定是否增加图表，可以避免任务在美化环节耗尽预算。若用户只要求比较功能，系统不应自行扩大到联系供应商或获取私人报价。计划范围应与用户目标一致，新增步骤要说明它支持哪个结果。这样能够减少看似勤奋、实际上偏离目标的执行。\n\n## 资料与延伸阅读\n\n- [Google Cloud：层级分解、协调与循环模式](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n- [ReAct：根据观察调整行动](https://arxiv.org/abs/2210.03629)\n\n资料核验：2026-11-14。供应商比较为教学构造；具体商业结论应以实际资料为依据。\n","chars":1238,"minutes":5,"summary":"复杂目标需要分解，但一份看起来完整的计划并不保证可执行。Agent规划的价值是把目标、依赖、工具和验证条件组织起来，并在新信息出现时调整。计划应服务任务进展，而不是成为必须照抄的长清单。"},{"id":"09-03","title":"短期状态、长期记忆与用户画像","file":"content/09-03.md","level":"工作应用","prerequisites":["09-02"],"aliases":["Agent","智能体","多智能体","memory"],"module":"09","moduleTitle":"Agent 系统","html":"<p>用户说“按我习惯的格式整理”，Agent需要知道这个习惯从哪里来。短期状态、长期记忆与用户画像保存的信息范围和可信度不同。把它们混成一段不断追加的提示，会造成过时信息、错误偏好、隐私和跨任务污染。<\/p><h2 id=\"section-1\">三种信息的时间尺度<\/h2><p>短期状态服务当前任务，例如已选文件、刚查到的结果和待确认参数。长期记忆保存未来可能复用的事实或偏好，例如用户明确要求报告先给结论。用户画像是对偏好、角色或需求的结构化表达，其中有些来自明确输入，有些只是系统推断，应区分标记。<\/p><p>对话历史不等于记忆数据库。历史包含临时假设、纠正、玩笑和过期信息，直接检索可能把过去某次要求当成永久规则。保存记忆前需要判断它是否稳定、是否值得保留、是否敏感，以及是否已经被后续信息替代。<\/p><h2 id=\"section-2\">写入、检索和使用<\/h2><p>记忆通常经历提取候选、确认或过滤、保存、查询检索、注入上下文和更新删除。每个阶段都可能出错。保存错误事实会长期影响后续任务；检索遗漏则使系统看似不记得；注入过多无关偏好会挤占当前任务上下文。<\/p><p>教学构造：用户在一次营销活动中要求语气活泼，系统据此永久把所有报告改成口语。问题不是记忆能力不足，而是把任务偏好泛化为全局偏好。更好的结构可以记录适用范围、来源、时间和明确程度，例如“此次活动文案使用活泼语气”。<\/p><h2 id=\"section-3\">事实与推断要分开<\/h2><p>用户明确说“我负责Agent产品”与系统推断“用户具备Python能力”不是同等事实。画像应避免把推断当成已确认背景，尤其在职业、健康、身份和敏感偏好上。对关键事实，可以要求明确确认或提供修改入口；低风险推荐则可使用带不确定性的推断。<\/p><p>来源和时间有助于处理冲突。用户调岗后，旧角色可能不再适用；某个工具偏好也可能变化。记忆系统需要优先级和失效策略，而不是只做不断累积。删除用户信息时，也要考虑派生摘要、向量索引和缓存中的副本。<\/p><h2 id=\"section-4\">记忆如何影响权限与隐私<\/h2><p>记忆应与用户、组织和任务边界绑定，不能因语义相似就把其他人的历史注入当前会话。企业共享知识与个人偏好也应分别管理。把敏感内容保存到长期存储，需要明确必要性、访问范围、保留期限和用户控制方式。<\/p><p>产品界面可以让用户查看系统记住了什么、纠正错误、关闭某类记忆或删除内容。若系统根据记忆做了显著决定，适当说明依据能帮助用户理解和纠错。透明度应围绕可管理事实，而非展示无法核验的“我了解你”的拟人化承诺。<\/p><h2 id=\"section-5\">上下文压缩不是无损保存<\/h2><p>长任务可能需要摘要或压缩。应保留目标、限制、关键结果、失败原因、未完成事项及证据位置，避免只保留顺畅的叙事。压缩会丢失细节，因此重要原始资料应可重新读取；恢复任务时还应重新核对外部状态。<\/p><p>对产品经理而言，记忆需求应该写成具体行为：保存什么、何时用、何时不用、如何纠正和失效。评估也要观察不该记住的信息是否被保留、不该使用的偏好是否干扰任务。记得更多并不天然更好，合适的信息边界才使长期体验稳定。<\/p><h2 id=\"section-6\">进一步的系统判断<\/h2><p>记忆检索还可以依据任务相关性而非仅按语义相似度。用户曾说不喜欢某类营销语气，不意味着技术报告也要套用同样限制。应用可把偏好分为全局、场景与单次任务，并设置冲突优先级。用户当前明确要求通常应覆盖过去偏好；若两者存在实质矛盾，可以用简短方式确认，而不是让模型暗中决定。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：增强模型中的检索、工具与记忆<\/a><\/li><li><a href=\"https://modelcontextprotocol.io/docs/learn/architecture\" target=\"_blank\" rel=\"noopener noreferrer\">MCP：应用与上下文连接架构<\/a><\/li><\/ul><p>资料核验：2026-11-14。营销偏好例子为教学构造；具体记忆实现与隐私要求需按产品环境设计。<\/p>","toc":[{"id":"section-1","title":"三种信息的时间尺度","level":2},{"id":"section-2","title":"写入、检索和使用","level":2},{"id":"section-3","title":"事实与推断要分开","level":2},{"id":"section-4","title":"记忆如何影响权限与隐私","level":2},{"id":"section-5","title":"上下文压缩不是无损保存","level":2},{"id":"section-6","title":"进一步的系统判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"用户说“按我习惯的格式整理”，Agent需要知道这个习惯从哪里来。短期状态、长期记忆与用户画像保存的信息范围和可信度不同。把它们混成一段不断追加的提示，会造成过时信息、错误偏好、隐私和跨任务污染。\n\n## 三种信息的时间尺度\n\n短期状态服务当前任务，例如已选文件、刚查到的结果和待确认参数。长期记忆保存未来可能复用的事实或偏好，例如用户明确要求报告先给结论。用户画像是对偏好、角色或需求的结构化表达，其中有些来自明 可以先做工具筛选和任务路由。<\/p><p>当任务涉及大量互相干扰的规则、不同权限域或独立子目标时，单一上下文可能变得臃肿。模型可能选错工具、混淆对象或忽略某类要求。此时可以考虑分离职责，但要先确认问题确实来自上下文与责任边界，而不是数据缺失或工具契约模糊。<\/p><h2 id=\"section-2\">多Agent可能带来的价值<\/h2><p>独立资料搜集可以并行，专业子任务可以使用不同工具或模型，敏感权限也可以局部隔离。一个协调者把任务交给子Agent，子Agent返回有范围的产物，再由协调者综合。价值来自清楚的任务边界与验证，而非给同一模型换几个称呼。<\/p><p>教学构造：一个市场研究任务同时调查法规、竞争产品和客户访谈。三类资料可以独立搜集，最终需要统一时间范围和比较口径。若所有Agent都重复搜索同样网站，只是各自写一份摘要，多Agent可能增加费用却没有增加证据覆盖。<\/p><h2 id=\"section-3\">协调成本会抵消收益<\/h2><p>委托需要传递目标、约束、背景与结果格式；返回后需要核验、合并、处理冲突。上下文传输有成本，摘要可能丢失细节，错误也可能在多层间放大。并行只降低部分等待，协调与汇总仍然占用时间。整体效果需要通过完整任务测量。<\/p><p>独立Agent也不等于独立误差。如果它们使用同一模型、相同资料和相似提示，可能重复相同偏差。让多个Agent投票未必比一个模型更可靠。真正有价值的验证可以来自不同证据、规则检查、代码执行或人工判断，而不是仅增加讨论轮数。<\/p><h2 id=\"section-4\">选择时看哪些维度<\/h2><p>可以比较任务是否可分、子任务是否需要不同上下文或权限、产物能否清晰验收，以及并行收益是否超过协调代价。还应考虑运维能力：团队能否追踪每个Agent的行为，定位失败来源，控制总预算，并在一个子任务失败时合理降级。<\/p><p>从单Agent基线开始，记录失败后再有针对性拆分，通常更容易判断架构收益。这不是固定要求单Agent优于多Agent，而是为了保留可比较的证据。某些天然跨组织的任务也可能从一开始就需要独立协作边界。<\/p><h2 id=\"section-5\">产品承诺如何表达<\/h2><p>对用户而言，关键是任务是否完成、结果是否可信、等待和费用是否合理。内部Agent数量通常不是用户决策的核心。可以展示必要职责与进展，但不应让用户承担内部协调工作，也不应把复杂架构当作质量保证。<\/p><p>产品经理应能够解释“为何拆分、拆分后减少什么问题、增加什么成本、如何验证”。架构评审可以围绕同一批任务比较单Agent、固定工作流与多Agent，观察成功率、失败类型、总延迟和成功任务成本，再形成适合当前阶段的选择。<\/p><h2 id=\"section-6\">进一步的系统判断<\/h2><p>权限隔离也需要实际实施。如果所谓财务Agent与研究Agent共享同一账户和全部工具，角色提示并未形成真实安全边界。拆分后应明确凭证、存储与可调用动作，协调者是否能重新取得下游权限也要考虑。否则多角色只改变了文本组织，既没有减少风险，也可能让数据在更多上下文中复制。<\/p><h2 id=\"section-7\">延伸的产品设计考虑<\/h2><p>当子任务需要跨组织服务时，独立Agent还可能是既有组织边界的自然结果，而非模型性能优化。此时重点是身份、产物契约和责任归属。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：单Agent与多Agent模式<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：从简单可组合模式增加复杂度<\/a><\/li><\/ul><p>资料核验：2026-11-14。市场研究情境为教学构造；多Agent收益需在实际任务上验证。<\/p>","toc":[{"id":"section-1","title":"单Agent的优势与边界","level":2},{"id":"section-2","title":"多Agent可能带来的价值","level":2},{"id":"section-3","title":"协调成本会抵消收益","level":2},{"id":"section-4","title":"选择时看哪些维度","level":2},{"id":"section-5","title":"产品承诺如何表达","level":2},{"id":"section-6","title":"进一步的系统判断","level":2},{"id":"section-7","title":"延伸的产品设计考虑","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"多Agent架构常被描述为一群专家协作，但角色名称不会自动带来真实专业能力。选择单Agent还是多Agent，应根据任务分解、上下文、权限和独立验证需要，而不是希望系统看起来更像一个团队。\n\n## 单Agent的优势与边界\n\n单Agent维护一个主要目标和执行状态，调用不同工具完成任务。它的优势是上下文共享直接、协调较少、调试路径相对清楚。对许多任务，改进提示、工具描述和检索比增加角色更有效。工具多并不必然需要多个Agent，也可以先做工具筛选和任务路由。\n\n当任务涉及大量互相干扰的规则、不同权限域或独立子目标时，单一上下文可能变得臃肿。模型可能选错工具、混淆对象或忽略某类要求。此时可以考虑分离职责，但要先确认问题确实来自上下文与责任边界，而不是数据缺失或工具契约模糊。\n\n## 多Agent可能带来的价值\n\n独立资料搜集可以并行，专业子任务可以使用不同工具或模型，敏感权限也可以局部隔离。一个协调者把任务交给子Agent，子Agent返回有范围的产物，再由协调者综合。价值来自清楚的任务边界与验证，而非给同一模型换几个称呼。\n\n教学构造：一个市场研究任务同时调查法规、竞争产品和客户访谈。三类资料可以独立搜集，最终需要统一时间范围和比较口径。若所有Agent都重复搜索同样网站，只是各自写一份摘要，多Agent可能增加费用却没有增加证据覆盖。\n\n## 协调成本会抵消收益\n\n委托需要传递目标、约束、背景与结果格式；返回后需要核验、合并、处理冲突。上下文传输有成本，摘要可能丢失细节，错误也可能在多层间放大。并行只降低部分等待，协调与汇总仍然占用时间。整体效果需要通过完整任务测量。\n\n独立Agent也不等于独立误差。如果它们使用同一模型、相同资料和相似提示，可能重复相同偏差。让多个Agent投票未必比一个模型更可靠。真正有价值的验证可以来自不同证据、规则检查、代码执行或人工判断，而不是仅增加讨论轮数。\n\n## 选择时看哪些维度\n\n可以比较任务是否可分、子任务是否需要不同上下文或权限、产物能否清晰验收，以及并行收益是否超过协调代价。还应考虑运维能力：团队能否追踪每个Agent的行为，定位失败来源，控制总预算，并在一个子任务失败时合理降级。\n\n从单Agent基线开始，记录失败后再有针对性拆分，通常更容易判断架构收益。这不是固定要求单Agent优于多Agent，而是为了保留可比较的证据。某些天然跨组织的任务也可能从一开始就需要独立协作边界。\n\n## 产品承诺如何表达\n\n对用户而言，关键是任务是否完成、结果是否可信、等待和费用是否合理。内部Agent数量通常不是用户决策的核心。可以展示必要职责与进展，但不应让用户承担内部协调工作，也不应把复杂架构当作质量保证。\n\n产品经理应能够解释“为何拆分、拆分后减少什么问题、增加什么成本、如何验证”。架构评审可以围绕同一批任务比较单Agent、固定工作流与多Agent，观察成功率、失败类型、总延迟和成功任务成本，再形成适合当前阶段的选择。\n\n## 进一步的系统判断\n\n权限隔离也需要实际实施。如果所谓财务Agent与研究Agent共享同一账户和全部工具，角色提示并未形成真实安全边界。拆分后应明确凭证、存储与可调用动作，协调者是否能重新取得下游权限也要考虑。否则多角色只改变了文本组织，既没有减少风险，也可能让数据在更多上下文中复制。\n\n## 延伸的产品设计考虑\n\n当子任务需要跨组织服务时，独立Agent还可能是既有组织边界的自然结果，而非模型性能优化。此时重点是身份、产物契约和责任归属。\n\n## 资料与延伸阅读\n\n- [Google Cloud：单Agent与多Agent模式](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n- [Anthropic：从简单可组合模式增加复杂度](https://www.anthropic.com/engineering/building-effective-agents)\n\n资料核验：2026-11-14。市场研究情境为教学构造；多Agent收益需在实际任务上验证。\n","chars":1243,"minutes":5,"summary":"多Agent架构常被描述为一群专家协作，但角色名称不会自动带来真实专业能力。选择单Agent还是多Agent，应根据任务分解、上下文、权限和独立验证需要，而不是希望系统看起来更像一个团队。"},{"id":"09-05","title":"多 Agent 协作、交接与协调成本","file":"content/09-05.md","level":"深入阅读","prerequisites":["09-04"],"aliases":["Agent","智能体","多智能体","memory"],"module":"09","moduleTitle":"Agent 系统","html":"<p>多Agent系统中的难点往往发生在交接处：任务范围不清、上下文缺失、结果不可验证，或者所有角色都以为别人会处理某个步骤。协作设计需要明确谁负责什么、怎样传递事实、如何处理冲突，以及谁有权宣布整体完成。<\/p><h2 id=\"section-1\">委托契约需要哪些内容<\/h2><p>一次委托应包含子目标、输入资料、限制、允许工具、时间或费用预算、产物格式和完成标准。还应说明哪些决定可由子Agent自主作出，哪些需要向协调者请求。仅发一句“你是研究专家，请研究这个问题”，容易导致范围不断扩张或结果难以合并。<\/p><p>教学构造：协调者要求分析三个竞争产品的企业定价。子Agent需要知道地区、套餐口径、资料日期、是否允许使用第三方转述，以及找不到公开价格时如何报告。否则一人记录按月价格，一人记录按年折算，一人引用旧新闻，汇总表看似完整却不可比较。<\/p><h2 id=\"section-2\">交接的是证据而非叙事<\/h2><p>产物最好包含事实、来源、日期、限制和未解决项。摘要应保留关键条件，必要时提供原始记录或对象标识。协调者不应仅凭“已经核实”的声明接受结果，而要根据任务重要性做适当验证。不同Agent的自信语气无法替代证据质量。<\/p><p>上下文也需要最小化。子任务只应获得必要资料和权限，避免把全部客户信息复制给每个Agent。减少无关上下文可以降低成本与干扰，但过度压缩会造成漏条件。因此传递内容应按任务契约组织，而非机械截取聊天记录。<\/p><h2 id=\"section-3\">常见协调结构<\/h2><p>顺序协作适合后一步依赖前一步产物；并行适合独立子任务；协调者模式负责分派和整合；层级模式适合大任务再分解。循环评审可以改进质量，却需要停止条件与变化标准。不同模式可以组合，但每层都会增加状态与故障处理成本。<\/p><p>角色之间自由对话并不保证有效协作。若缺少明确决策者、共享事实与结束条件，可能出现重复讨论、互相迎合或循环转交。系统应记录任务所有权和责任转移，确保任何时刻都知道下一步由谁负责、等待什么输入。<\/p><h2 id=\"section-4\">冲突如何处理<\/h2><p>两份产物冲突时，应先检查对象、日期、口径和来源，而不是直接投票。可能是资料更新、定义差异，也可能确实存在不确定性。协调者可以要求补证、执行规则核验或交给人工。无法解决的冲突应在最终输出中保留，不能为了流畅统一而抹平。<\/p><p>子Agent失败后，可以重试、换路径、缩小范围或返回部分结果。选择应依据失败类型与剩余预算。一个子任务不断重启，可能拖住整体流程；一个部分结果未经标注就被当作完整，也会误导用户。协调策略需要把这些状态明确表达。<\/p><h2 id=\"section-5\">评价协作是否值得<\/h2><p>可以记录委托次数、重复工作、有效证据、交接失败、协调延迟和总成本。若并行搜集节省十秒，却花更多时间合并矛盾，整体未必改善。还应分析多Agent是否扩大了权限和数据暴露范围，以及团队能否追踪责任。<\/p><p>对产品经理而言，多Agent协作更接近组织流程设计与分布式系统设计的结合。已有跨团队协作经验可以迁移：清楚目标、责任、接口、验收和升级机制。不同之处在于Agent误解和重复执行可能更快发生，因此边界和验证需要落在系统机制里。<\/p><h2 id=\"section-6\">进一步的系统判断<\/h2><p>共享状态需要确定更新规则。多个Agent同时修改同一结论或文件时，可能覆盖彼此结果；可以通过明确所有权、版本检查或集中合并处理。共享白板不应成为无来源的事实池，每条重要信息仍应有生产者、证据和时间。协调者也应检查信息是否已经过期，不能只因它先被写入就视为权威。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：协调、层级、并行与评审模式<\/a><\/li><li><a href=\"https://a2a-protocol.org/latest/specification/\" target=\"_blank\" rel=\"noopener noreferrer\">A2A：独立Agent的任务与产物交互<\/a><\/li><\/ul><p>资料核验：2026-11-14。竞争产品定价情境为教学构造；协议与协调策略是不同层次的设计。<\/p>","toc":[{"id":"section-1","title":"委托契约需要哪些内容","level":2},{"id":"section-2","title":"交接的是证据而非叙事","level":2},{"id":"section-3","title":"常见协调结构","level":2},{"id":"section-4","title":"冲突如何处理","level":2},{"id":"section-5","title":"评价协作是否值得","level":2},{"id":"section-6","title":"进一步的系统判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"多Agent系统中的难点往往发生在交接处：任务范围不清、上下文缺失、结果不可验证，或者所有角色都以为别人会处理某个步骤。协作设计需要明确谁负责什么、怎样传递事实、如何处理冲突，以及谁有权宣布整体完成。\n\n## 委托契约需要哪些内容\n\n一次委托应包含子目标、输入资料、限制、允许工具、时间或费用预算、产物格式和完成标准。还应说明哪些决定可由子Agent自主作出，哪些需要向协调者请求。仅发一句“你是研究专家，请研究这个问题”，容易导致范围不断扩张或结果难以合并。\n\n教学构造：协调者要求分析三个竞争产品的企业定价。子Agent需要知道地区、套餐口径、资料日期、是否允许使用第三方转述，以及找不到公开价格时如何报告。否则一人记录按月价格，一人记录按年折算，一人引用旧新闻，汇总表看似完整却不可比较。\n\n## 交接的是证据而非叙事\n\n产物最好包含事实、来源、日期、限制和未解决项。摘要应保留关键条件，必要时提供原始记录或对象标识。协调者不应仅凭“已经核实”的声明接受结果，而要根据任务重要性做适当验证。不同Agent的自信语气无法替代证据质量。\n\n上下文也需要最小化。子任务只应获得必要资料和权限，避免把全部客户信息复制给每个Agent。减少无关上下文可以降低成本与干扰，但过度压缩会造成漏条件。因此传递内容应按任务契约组织，而非机械截取聊天记录。\n\n## 常见协调结构\n\n顺序协作适合后一步依赖前一步产物；并行适合独立子任务；协调者模式负责分派和整合；层级模式适合大任务再分解。循环评审可以改进质量，却需要停止条件与变化标准。不同模式可以组合，但每层都会增加状态与故障处理成本。\n\n角色之间自由对话并不保证有效协作。若缺少明确决策者、共享事实与结束条件，可能出现重复讨论、互相迎合或循环转交。系统应记录任务所有权和责任转移，确保任何时刻都知道下一步由谁负责、等待什么输入。\n\n## 冲突如何处理\n\n两份产物冲突时，应先检查对象、日期、口径和来源，而不是直接投票。可能是资料更新、定义差异，也可能确实存在不确定性。协调者可以要求补证、执行规则核验或交给人工。无法解决的冲突应在最终输出中保留，不能为了流畅统一而抹平。\n\n子Agent失败后，可以重试、换路径、缩小范围或返回部分结果。选择应依据失败类型与剩余预算。一个子任务不断重启，可能拖住整体流程；一个部分结果未经标注就被当作完整，也会误导用户。协调策略需要把这些状态明确表达。\n\n## 评价协作是否值得\n\n可以记录委托次数、重复工作、有效证据、交接失败、协调延迟和总成本。若并行搜集节省十秒，却花更多时间合并矛盾，整体未必改善。还应分析多Agent是否扩大了权限和数据暴露范围，以及团队能否追踪责任。\n\n对产品经理而言，多Agent协作更接近组织流程设计与分布式系统设计的结合。已有跨团队协作经验可以迁移：清楚目标、责任、接口、验收和升级机制。不同之处在于Agent误解和重复执行可能更快发生，因此边界和验证需要落在系统机制里。\n\n## 进一步的系统判断\n\n共享状态需要确定更新规则。多个Agent同时修改同一结论或文件时，可能覆盖彼此结果；可以通过明确所有权、版本检查或集中合并处理。共享白板不应成为无来源的事实池，每条重要信息仍应有生产者、证据和时间。协调者也应检查信息是否已经过期，不能只因它先被写入就视为权威。\n\n## 资料与延伸阅读\n\n- [Google Cloud：协调、层级、并行与评审模式](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n- [A2A：独立Agent的任务与产物交互](https://a2a-protocol.org/latest/specification/)\n\n资料核验：2026-11-14。竞争产品定价情境为教学构造；协议与协调策略是不同层次的设计。\n","chars":1223,"minutes":5,"summary":"多Agent系统中的难点往往发生在交接处：任务范围不清、上下文缺失、结果不可验证，或者所有角色都以为别人会处理某个步骤。协作设计需要明确谁负责什么、怎样传递事实、如何处理冲突，以及谁有权宣布整体完成。"},{"id":"09-06","title":"长任务、执行环境与完成判定","file":"content/09-06.md","level":"工作应用","prerequisites":["09-05"],"aliases":["Agent","智能体","多智能体","memory"],"module":"09","moduleTitle":"Agent 系统","html":"<p>有些Agent任务持续几分钟甚至更久，需要调用多个工具、等待外部系统、保存文件并处理中断。长任务不是把单次聊天时间拉长，而是需要持久状态、执行环境、预算、恢复与明确完成判定的一套产品能力。<\/p><h2 id=\"section-1\">执行环境提供真实行动空间<\/h2><p>环境可能包含文件系统、浏览器、代码运行器、业务接口和网络访问。模型决定动作，环境执行动作并提供观察。环境权限决定Agent实际能影响什么：读文件、写草稿、安装依赖、访问外网或发送信息，都应有独立边界。<\/p><p>教学构造：报告Agent需要下载公开数据、运行分析并生成文档。它应使用隔离工作目录、记录数据版本与产物路径，并验证文件可读取。若只在聊天里说“报告已生成”却没有真实文件，任务并未完成。环境能力与产物验证是长任务可信度的重要基础。<\/p><h2 id=\"section-2\">持久化与恢复<\/h2><p>进程重启、网络中断和用户离开都可能打断任务。系统可以保存检查点，记录目标、约束、已完成动作、产物和未解决项。恢复时应重新核对外部状态，特别是已经发生写入的动作，避免从旧步骤重新执行造成重复影响。<\/p><p>检查点不应只有自然语言总结，还应保留对象标识、版本和执行状态。摘要有助于模型理解，结构化状态有助于系统控制。任务版本变化也需要处理：旧任务可能使用旧工具契约，不能在后台更新后直接假设仍兼容。<\/p><h2 id=\"section-3\">完成条件需要由结果证明<\/h2><p>完成可以包括产物存在、内容满足范围、关键计算可复核、外部状态一致和没有未处理阻塞。不同任务要求不同证据。研究报告需要来源与覆盖，代码修改需要适当检查，业务操作需要确认系统状态。计划步骤全部勾选只是过程记录，不是充分证据。<\/p><p>“停止执行”与“目标完成”应区分。预算耗尽、权限不足、用户取消和不可恢复错误都可能使任务终止，但结果状态应分别标注。产品不能为了给出一个圆满结尾，把部分完成包装成全部完成。保留剩余工作有助于用户继续处理。<\/p><h2 id=\"section-4\">预算与无进展检测<\/h2><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>任务类型<\/th><th>完成证据示例<\/th><\/tr><tr><td>生成报告<\/td><td>文件存在、可以打开、内容覆盖约定范围、来源可追溯<\/td><\/tr><tr><td>修改业务对象<\/td><td>权威系统返回对应对象的目标状态<\/td><\/tr><tr><td>发送通知<\/td><td>发送服务确认受理，并清楚区分送达或已读状态<\/td><\/tr><tr><td>研究分析<\/td><td>必要主题和证据覆盖，未知项与限制已说明<\/td><\/tr><tr><td>代码修改<\/td><td>实际文件变更与适当验证结果，剩余风险已交代<\/td><\/tr><\/table><\/div><p>长任务需要控制总时间、调用次数、Token、费用和外部动作数量。还可以观察连续步骤是否带来新证据或状态变化。重复相同搜索、反复打开同一页面、持续改写相同段落，都可能意味着无进展，需要调整路径或停止。<\/p><p>预算策略应结合任务价值，而不只是统一设置小上限。高价值复杂任务可以有更多资源，但仍需让用户理解费用与预计范围。若扩大目标或增加高影响动作，按授权规则处理。后台持续运行也不等于可以无限占用用户资源。<\/p><h2 id=\"section-5\">用户交互与交付<\/h2><p>长任务适合展示阶段成果、当前状态、需要用户输入的问题和可取消范围。进度百分比若无法准确计算，可以显示已完成事项与当前步骤，避免虚假精度。用户回来时应容易找到产物和执行摘要，而不是从长聊天里逐条搜索。<\/p><p>失败交付应说明已完成、未完成、原因、产物位置和可恢复方式。对产品经理而言，长任务体验需要同时考虑运行时、存储、权限、成本和通知。它不是一个加载动画，而是可持续、可解释的执行服务。<\/p><h2 id=\"section-6\">进一步的系统判断<\/h2><p>长任务的文件产物还应有命名与保存规则。中间文件、最终交付和临时缓存需要区分，避免用户下载到尚未完成版本。任务结束前可以核对文件存在、格式可打开、链接指向正确位置，并保留必要的来源说明。对于多次运行，版本与覆盖行为也要明确，防止新任务悄悄替换用户仍需保留的结果。<\/p><h2 id=\"section-7\">延伸的产品设计考虑<\/h2><p>对历史任务的保留期限也应明确，避免工作目录和敏感中间资料无限积累。归档、删除和重新运行应有可理解行为。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：多轮行动与Agent设计<\/a><\/li><li><a href=\"https://docs.temporal.io/activity-definition\" target=\"_blank\" rel=\"noopener noreferrer\">Temporal：持久活动、幂等与重试<\/a><\/li><\/ul><p>资料核验：2026-11-14。报告Agent例子为教学构造；环境隔离与恢复保证取决于具体实现。<\/p>","toc":[{"id":"section-1","title":"执行环境提供真实行动空间","level":2},{"id":"section-2","title":"持久化与恢复","level":2},{"id":"section-3","title":"完成条件需要由结果证明","level":2},{"id":"section-4","title":"预算与无进展检测","level":2},{"id":"section-5","title":"用户交互与交付","level":2},{"id":"section-6","title":"进一步的系统判断","level":2},{"id":"section-7","title":"延伸的产品设计考虑","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"有些Agent任务持续几分钟甚至更久，需要调用多个工具、等待外部系统、保存文件并处理中断。长任务不是把单次聊天时间拉长，而是需要持久状态、执行环境、预算、恢复与明确完成判定的一套产品能力。\n\n## 执行环境提供真实行动空间\n\n环境可能包含文件系统、浏览器、代码运行器、业务接口和网络访问。模型决定动作，环境执行动作并提供观察。环境权限决定Agent实际能影响什么：读文件、写草稿、安装依赖、访问外网或发送信息，都应有独立边界。\n\n教学构造：报告Agent需要下载公开数据、运行分析并生成文档。它应使用隔离工作目录、记录数据版本与产物路径，并验证文件可读取。若只在聊天里说“报告已生成”却没有真实文件，任务并未完成。环境能力与产物验证是长任务可信度的重要基础。\n\n## 持久化与恢复\n\n进程重启、网络中断和用户离开都可能打断任务。系统可以保存检查点，记录目标、约束、已完成动作、产物和未解决项。恢复时应重新核对外部状态，特别是已经发生写入的动作，避免从旧步骤重新执行造成重复影响。\n\n检查点不应只有自然语言总结，还应保留对象标识、版本和执行状态。摘要有助于模型理解，结构化状态有助于系统控制。任务版本变化也需要处理：旧任务可能使用旧工具契约，不能在后台更新后直接假设仍兼容。\n\n## 完成条件需要由结果证明\n\n完成可以包括产物存在、内容满足范围、关键计算可复核、外部状态一致和没有未处理阻塞。不同任务要求不同证据。研究报告需要来源与覆盖，代码修改需要适当检查，业务操作需要确认系统状态。计划步骤全部勾选只是过程记录，不是充分证据。\n\n“停止执行”与“目标完成”应区分。预算耗尽、权限不足、用户取消和不可恢复错误都可能使任务终止，但结果状态应分别标注。产品不能为了给出一个圆满结尾，把部分完成包装成全部完成。保留剩余工作有助于用户继续处理。\n\n## 预算与无进展检测\n\n| 任务类型 | 完成证据示例 |\n|---|---|\n| 生成报告 | 文件存在、可以打开、内容覆盖约定范围、来源可追溯 |\n| 修改业务对象 | 权威系统返回对应对象的目标状态 |\n| 发送通知 | 发送服务确认受理，并清楚区分送达或已读状态 |\n| 研究分析 | 必要主题和证据覆盖，未知项与限制已说明 |\n| 代码修改 | 实际文件变更与适当验证结果，剩余风险已交代 |\n\n长任务需要控制总时间、调用次数、Token、费用和外部动作数量。还可以观察连续步骤是否带来新证据或状态变化。重复相同搜索、反复打开同一页面、持续改写相同段落，都可能意味着无进展，需要调整路径或停止。\n\n预算策略应结合任务价值，而不只是统一设置小上限。高价值复杂任务可以有更多资源，但仍需让用户理解费用与预计范围。若扩大目标或增加高影响动作，按授权规则处理。后台持续运行也不等于可以无限占用用户资源。\n\n## 用户交互与交付\n\n长任务适合展示阶段成果、当前状态、需要用户输入的问题和可取消范围。进度百分比若无法准确计算，可以显示已完成事项与当前步骤，避免虚假精度。用户回来时应容易找到产物和执行摘要，而不是从长聊天里逐条搜索。\n\n失败交付应说明已完成、未完成、原因、产物位置和可恢复方式。对产品经理而言，长任务体验需要同时考虑运行时、存储、权限、成本和通知。它不是一个加载动画，而是可持续、可解释的执行服务。\n\n## 进一步的系统判断\n\n长任务的文件产物还应有命名与保存规则。中间文件、最终交付和临时缓存需要区分，避免用户下载到尚未完成版本。任务结束前可以核对文件存在、格式可打开、链接指向正确位置，并保留必要的来源说明。对于多次运行，版本与覆盖行为也要明确，防止新任务悄悄替换用户仍需保留的结果。\n\n## 延伸的产品设计考虑\n\n对历史任务的保留期限也应明确，避免工作目录和敏感中间资料无限积累。归档、删除和重新运行应有可理解行为。\n\n## 资料与延伸阅读\n\n- [Anthropic：多轮行动与Agent设计](https://www.anthropic.com/engineering/building-effective-agents)\n- [Temporal：持久活动、幂等与重试](https://docs.temporal.io/activity-definition)\n\n资料核验：2026-11-14。报告Agent例子为教学构造；环境隔离与恢复保证取决于具体实现。\n","chars":1373,"minutes":5,"summary":"有些Agent任务持续几分钟甚至更久，需要调用多个工具、等待外部系统、保存文件并处理中断。长任务不是把单次聊天时间拉长，而是需要持久状态、执行环境、预算、恢复与明确完成判定的一套产品能力。"},{"id":"09-07","title":"浏览器与电脑操作 Agent","file":"content/09-07.md","level":"工作应用","prerequisites":["09-06"],"aliases":["Agent","智能体","多智能体","memory"],"module":"09","moduleTitle":"Agent 系统","html":"<p>浏览器与电脑操作Agent通过页面结构、截图、鼠标和键盘等方式使用软件。它能覆盖没有专用API的流程，却也继承了界面变化、视觉歧义、焦点错误和不可逆操作风险。把“像人一样点击”理解为一种执行通道，更有助于判断其能力边界。<\/p><h2 id=\"section-1\">观察与动作循环<\/h2><p>系统读取页面或截图，定位目标元素，发出点击、输入、滚动等动作，再观察新状态。某些浏览器环境还提供可访问性树或结构化元素信息，可以减少纯坐标操作的歧义。无论方式如何，动作后都需要核对页面是否到达预期状态。<\/p><p>教学构造：Agent填写一张采购表单。它需要确认当前账户、供应商、数量和提交按钮，输入后再次检查关键字段，提交后验证申请编号。若只看到按钮被点击就宣布成功，可能忽略验证错误、弹窗或网络失败。输入与提交是不同阶段的责任。<\/p><h2 id=\"section-2\">API与界面操作如何选择<\/h2><p>成熟API通常更结构化、可验证且速度更稳定；界面操作适合遗留系统、跨应用流程或用户实际使用场景。API存在也不一定覆盖全部功能，界面操作也不天然更通用可靠。可以优先使用可信的结构化通道，在必要环节使用UI，并明确切换边界。<\/p><p>纯坐标依赖分辨率、窗口位置、缩放和页面布局。视觉模型可能把相似图标认错，页面动画和异步加载也会造成时机问题。产品需要考虑环境稳定、元素定位、等待条件和恢复，而不能把一次成功录像当作长期可靠性证明。<\/p><h2 id=\"section-3\">外部页面是不可信输入<\/h2><p>网页、邮件和文档可能包含恶意指令，诱导Agent泄露数据或执行额外动作。页面上的文字并不自动代表用户授权。系统需要限制可访问范围、隔离凭证、控制剪贴板与文件读写，并对高影响动作设置独立检查。<\/p><p>登录状态尤其敏感。Agent可能在用户账户中继承广泛权限，误操作的影响与普通测试环境不同。产品应清楚说明工作环境、账户范围和可执行动作；必要时使用专用账户或隔离环境，减少跨任务信息与权限污染。<\/p><h2 id=\"section-4\">失败与恢复<\/h2><p>常见失败包括页面变动、目标未加载、焦点错位、重复提交、弹窗遮挡和会话失效。恢复应先观察当前状态，避免机械重复上一动作。若用户中途接管，Agent需要重新了解环境，不能继续使用过期坐标或旧页面假设。<\/p><p>截图和日志有助于定位问题，但也可能包含密码、客户数据和个人信息，应控制保存范围。对于发送、付款、删除等动作，最好在执行前展示目标与影响，执行后核对真实结果。无法确认结果时，应明确状态未知而不是猜测成功。<\/p><h2 id=\"section-5\">产品评价的重点<\/h2><p>除了任务成功率，还要看人工接管次数、重复动作、错误页面影响、完成时间和失败恢复能力。界面任务应覆盖布局变化、异常状态和无权限情况，不能只评估固定演示路径。环境限制和测试条件也应随结果说明。<\/p><p>对AI SCADA等工具产品，界面操作可以帮助配置和维护，但涉及真实设备控制时需要更严格安全机制和业务验证。通用电脑使用能力不能自动延伸为工业安全控制资格。产品经理需要根据影响范围划定可自主、需确认和禁止的操作。<\/p><h2 id=\"section-6\">进一步的系统判断<\/h2><p>界面状态验证可以组合多个信号。按钮点击后，既看成功提示，也读取对象列表或详情确认状态；填写金额时，检查币种、单位与表单格式。对于视觉不明确的目标，暂停并请求澄清通常比连续试点更合适。产品应允许这种有依据的停止，而不是把每次人工请求都计为模型能力失败。<\/p><h2 id=\"section-7\">延伸的产品设计考虑<\/h2><p>因此，任务成功证据最好包含最终对象标识或可复核状态。仅保存最后一张截图，可能无法证明整个任务范围都已完成。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Computer use工具与安全考虑<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Agent评估中的电脑操作任务<\/a><\/li><\/ul><p>资料核验：2026-11-14。采购表单为教学构造；具体工具功能、测试环境与安全限制需核验当前版本。<\/p>","toc":[{"id":"section-1","title":"观察与动作循环","level":2},{"id":"section-2","title":"API与界面操作如何选择","level":2},{"id":"section-3","title":"外部页面是不可信输入","level":2},{"id":"section-4","title":"失败与恢复","level":2},{"id":"section-5","title":"产品评价的重点","level":2},{"id":"section-6","title":"进一步的系统判断","level":2},{"id":"section-7","title":"延伸的产品设计考虑","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"浏览器与电脑操作Agent通过页面结构、截图、鼠标和键盘等方式使用软件。它能覆盖没有专用API的流程，却也继承了界面变化、视觉歧义、焦点错误和不可逆操作风险。把“像人一样点击”理解为一种执行通道，更有助于判断其能力边界。\n\n## 观察与动作循环\n\n系统读取页面或截图，定位目标元素，发出点击、输入、滚动等动作，再观察新状态。某些浏览器环境还提供可访问性树或结构化元素信息，可以减少纯坐标操作的歧义。无论方式如何，动作后都需要核对页面是否到达预期状态。\n\n教学构造：Agent填写一张采购表单。它需要确认当前账户、供应商、数量和提交按钮，输入后再次检查关键字段，提交后验证申请编号。若只看到按钮被点击就宣布成功，可能忽略验证错误、弹窗或网络失败。输入与提交是不同阶段的责任。\n\n## API与界面操作如何选择\n\n成熟API通常更结构化、可验证且速度更稳定；界面操作适合遗留系统、跨应用流程或用户实际使用场景。API存在也不一定覆盖全部功能，界面操作也不天然更通用可靠。可以优先使用可信的结构化通道，在必要环节使用UI，并明确切换边界。\n\n纯坐标依赖分辨率、窗口位置、缩放和页面布局。视觉模型可能把相似图标认错，页面动画和异步加载也会造成时机问题。产品需要考虑环境稳定、元素定位、等待条件和恢复，而不能把一次成功录像当作长期可靠性证明。\n\n## 外部页面是不可信输入\n\n网页、邮件和文档可能包含恶意指令，诱导Agent泄露数据或执行额外动作。页面上的文字并不自动代表用户授权。系统需要限制可访问范围、隔离凭证、控制剪贴板与文件读写，并对高影响动作设置独立检查。\n\n登录状态尤其敏感。Agent可能在用户账户中继承广泛权限，误操作的影响与普通测试环境不同。产品应清楚说明工作环境、账户范围和可执行动作；必要时使用专用账户或隔离环境，减少跨任务信息与权限污染。\n\n## 失败与恢复\n\n常见失败包括页面变动、目标未加载、焦点错位、重复提交、弹窗遮挡和会话失效。恢复应先观察当前状态，避免机械重复上一动作。若用户中途接管，Agent需要重新了解环境，不能继续使用过期坐标或旧页面假设。\n\n截图和日志有助于定位问题，但也可能包含密码、客户数据和个人信息，应控制保存范围。对于发送、付款、删除等动作，最好在执行前展示目标与影响，执行后核对真实结果。无法确认结果时，应明确状态未知而不是猜测成功。\n\n## 产品评价的重点\n\n除了任务成功率，还要看人工接管次数、重复动作、错误页面影响、完成时间和失败恢复能力。界面任务应覆盖布局变化、异常状态和无权限情况，不能只评估固定演示路径。环境限制和测试条件也应随结果说明。\n\n对AI SCADA等工具产品，界面操作可以帮助配置和维护，但涉及真实设备控制时需要更严格安全机制和业务验证。通用电脑使用能力不能自动延伸为工业安全控制资格。产品经理需要根据影响范围划定可自主、需确认和禁止的操作。\n\n## 进一步的系统判断\n\n界面状态验证可以组合多个信号。按钮点击后，既看成功提示，也读取对象列表或详情确认状态；填写金额时，检查币种、单位与表单格式。对于视觉不明确的目标，暂停并请求澄清通常比连续试点更合适。产品应允许这种有依据的停止，而不是把每次人工请求都计为模型能力失败。\n\n## 延伸的产品设计考虑\n\n因此，任务成功证据最好包含最终对象标识或可复核状态。仅保存最后一张截图，可能无法证明整个任务范围都已完成。\n\n## 资料与延伸阅读\n\n- [Anthropic：Computer use工具与安全考虑](https://platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool)\n- [Anthropic：Agent评估中的电脑操作任务](https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents)\n\n资料核验：2026-11-14。采购表单为教学构造；具体工具功能、测试环境与安全限制需核验当前版本。\n","chars":1251,"minutes":5,"summary":"浏览器与电脑操作Agent通过页面结构、截图、鼠标和键盘等方式使用软件。它能覆盖没有专用API的流程，却也继承了界面变化、视觉歧义、焦点错误和不可逆操作风险。把“像人一样点击”理解为一种执行通道，更有助于判断其能力边界。"},{"id":"09-08","title":"自主程度、人工介入与失败恢复","file":"content/09-08.md","level":"工作应用","prerequisites":["09-07"],"aliases":["Agent","智能体","多智能体","memory"],"module":"09","moduleTitle":"Agent 系统","html":"<p>自主程度不是一个“开启Agent”的开关。系统可以自动读取资料、主动提出计划、执行草稿修改，或直接对外采取行动；不同阶段的风险和授权要求不同。人机协作设计需要让用户在真正重要的位置拥有理解、选择和接管能力。<\/p><h2 id=\"section-1\">按动作影响划分自主程度<\/h2><p>可以从建议、准备、确认后执行到限定范围内自动执行逐步增加自主性。选择依据包括错误代价、可逆性、影响范围、证据充分程度和用户偏好。相同模型在生成标题和转账任务中，应受到完全不同的执行边界。<\/p><p>教学构造：客户服务Agent可以自动检索退货政策、生成回复草稿，在规则内处理低金额退款；超出金额或涉及特殊条款时转人工。关键在于金额与条件由业务系统验证，模型不能自行扩大限额。人工参与不是补救装饰，而是产品流程的一部分。<\/p><h2 id=\"section-2\">何时请求确认<\/h2><p>确认应围绕目标对象、动作、关键参数和影响，而不是只问“继续吗”。例如说明将向哪些人发送什么内容、是否可撤回。用户应能在执行前修改或拒绝。重复确认所有低风险细节会造成疲劳，使真正重要的确认更容易被忽略。<\/p><p>已有明确授权可以覆盖范围内动作；当目标、数据范围、成本或副作用发生实质变化时，需要依据规则重新处理。权限与确认不是同一回事：用户点击确认不代表系统可以越过服务端授权，已有权限也不代表用户希望自动执行所有动作。<\/p><h2 id=\"section-3\">人工接管需要上下文<\/h2><p>转交人工时，应提供任务目标、已执行动作、关键证据、失败原因和待决事项。只把完整聊天扔给人工，会增加理解成本。人工还需要知道哪些外部动作已经生效，防止再次执行。接管完成后，系统应明确后续由谁负责，避免人与Agent同时修改。<\/p><p>用户主动打断、修改目标或取消任务时，Agent需要更新状态并停止不再合适的动作。已经发出的请求可能无法立即取消，界面要说明真实情况。中断后的恢复也应检查当前业务状态，而不是从旧计划机械续跑。<\/p><h2 id=\"section-4\">失败恢复的层次<\/h2><p>局部技术失败可以重试或换路径；信息不足需要澄清或补资料；权限不足需要停止或转交；业务冲突可能需要补偿与人工判断。把所有失败都转为“再试一次”会扩大成本，甚至重复副作用。恢复策略应与错误分类和工具契约连接。<\/p><p>系统还要识别连续无进展。多次失败后，应交代已经尝试什么、还有哪些可行路径，而不是不断生成新的乐观承诺。部分完成可以是有价值的结果，只要范围和限制清楚。诚实表达边界比虚假完成更能建立长期信任。<\/p><h2 id=\"section-5\">自主策略如何演进<\/h2><p>可以先在有限任务、数据和权限范围内运行，观察成功率、接管原因和异常影响，再逐步调整自动化范围。某类任务稳定不意味着所有相似任务都可自动处理，尤其在客户、地区或业务规则变化后，应重新核验适用条件。<\/p><p>产品经理应把自主程度视为可配置的产品策略，连接用户角色、任务风险和实际证据。成熟的Agent既能主动推进，也知道何时需要人、何时应停止。其目标是让用户以合适成本完成工作，而不是尽可能减少人类出现的次数。<\/p><h2 id=\"section-6\">进一步的系统判断<\/h2><p>人工参与的效果也要观察。若用户总是在同一个信息缺失处接管，可能需要补数据或改工具；若用户反复修改计划，则可能是目标理解不足。接管记录可以形成产品改进证据，但不应把用户每次纠正直接保存为永久偏好。自动化策略应从这些具体原因演进，而不是只追求一个更高的自动完成比例。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：Human-in-the-loop及Agent模式<\/a><\/li><li><a href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Agent的复杂度与控制取舍<\/a><\/li><\/ul><p>资料核验：2026-11-14。客服与退款情境为教学构造；自动化额度及授权边界需由真实业务确定。<\/p>","toc":[{"id":"section-1","title":"按动作影响划分自主程度","level":2},{"id":"section-2","title":"何时请求确认","level":2},{"id":"section-3","title":"人工接管需要上下文","level":2},{"id":"section-4","title":"失败恢复的层次","level":2},{"id":"section-5","title":"自主策略如何演进","level":2},{"id":"section-6","title":"进一步的系统判断","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"自主程度不是一个“开启Agent”的开关。系统可以自动读取资料、主动提出计划、执行草稿修改，或直接对外采取行动；不同阶段的风险和授权要求不同。人机协作设计需要让用户在真正重要的位置拥有理解、选择和接管能力。\n\n## 按动作影响划分自主程度\n\n可以从建议、准备、确认后执行到限定范围内自动执行逐步增加自主性。选择依据包括错误代价、可逆性、影响范围、证据充分程度和用户偏好。相同模型在生成标题和转账任务中，应受到完全不同的执行边界。\n\n教学构造：客户服务Agent可以自动检索退货政策、生成回复草稿，在规则内处理低金额退款；超出金额或涉及特殊条款时转人工。关键在于金额与条件由业务系统验证，模型不能自行扩大限额。人工参与不是补救装饰，而是产品流程的一部分。\n\n## 何时请求确认\n\n确认应围绕目标对象、动作、关键参数和影响，而不是只问“继续吗”。例如说明将向哪些人发送什么内容、是否可撤回。用户应能在执行前修改或拒绝。重复确认所有低风险细节会造成疲劳，使真正重要的确认更容易被忽略。\n\n已有明确授权可以覆盖范围内动作；当目标、数据范围、成本或副作用发生实质变化时，需要依据规则重新处理。权限与确认不是同一回事：用户点击确认不代表系统可以越过服务端授权，已有权限也不代表用户希望自动执行所有动作。\n\n## 人工接管需要上下文\n\n转交人工时，应提供任务目标、已执行动作、关键证据、失败原因和待决事项。只把完整聊天扔给人工，会增加理解成本。人工还需要知道哪些外部动作已经生效，防止再次执行。接管完成后，系统应明确后续由谁负责，避免人与Agent同时修改。\n\n用户主动打断、修改目标或取消任务时，Agent需要更新状态并停止不再合适的动作。已经发出的请求可能无法立即取消，界面要说明真实情况。中断后的恢复也应检查当前业务状态，而不是从旧计划机械续跑。\n\n## 失败恢复的层次\n\n局部技术失败可以重试或换路径；信息不足需要澄清或补资料；权限不足需要停止或转交；业务冲突可能需要补偿与人工判断。把所有失败都转为“再试一次”会扩大成本，甚至重复副作用。恢复策略应与错误分类和工具契约连接。\n\n系统还要识别连续无进展。多次失败后，应交代已经尝试什么、还有哪些可行路径，而不是不断生成新的乐观承诺。部分完成可以是有价值的结果，只要范围和限制清楚。诚实表达边界比虚假完成更能建立长期信任。\n\n## 自主策略如何演进\n\n可以先在有限任务、数据和权限范围内运行，观察成功率、接管原因和异常影响，再逐步调整自动化范围。某类任务稳定不意味着所有相似任务都可自动处理，尤其在客户、地区或业务规则变化后，应重新核验适用条件。\n\n产品经理应把自主程度视为可配置的产品策略，连接用户角色、任务风险和实际证据。成熟的Agent既能主动推进，也知道何时需要人、何时应停止。其目标是让用户以合适成本完成工作，而不是尽可能减少人类出现的次数。\n\n## 进一步的系统判断\n\n人工参与的效果也要观察。若用户总是在同一个信息缺失处接管，可能需要补数据或改工具；若用户反复修改计划，则可能是目标理解不足。接管记录可以形成产品改进证据，但不应把用户每次纠正直接保存为永久偏好。自动化策略应从这些具体原因演进，而不是只追求一个更高的自动完成比例。\n\n## 资料与延伸阅读\n\n- [Google Cloud：Human-in-the-loop及Agent模式](https://cloud.google.com/architecture/choose-design-pattern-agentic-ai-system)\n- [Anthropic：Agent的复杂度与控制取舍](https://www.anthropic.com/engineering/building-effective-agents)\n\n资料核验：2026-11-14。客服与退款情境为教学构造；自动化额度及授权边界需由真实业务确定。\n","chars":1210,"minutes":5,"summary":"自主程度不是一个“开启Agent”的开关。系统可以自动读取资料、主动提出计划、执行草稿修改，或直接对外采取行动；不同阶段的风险和授权要求不同。人机协作设计需要让用户在真正重要的位置拥有理解、选择和接管能力。"},{"id":"10-01","title":"多模态表示与产品能力地图","file":"content/10-01.md","level":"工作应用","prerequisites":["02-01","02-02"],"aliases":["多模态","ASR","TTS","OCR","具身"],"module":"10","moduleTitle":"多模态与扩展方向","html":"<p>多模态AI能够处理文字之外的图像、语音、视频等信息，有些模型还可以生成不同类型的内容。对产品经理而言，首先要把“输入什么、理解什么、输出什么”拆开，而不是把所有功能都归为一个“支持多模态”的标签。<\/p><h2 id=\"section-1\">从模态到任务<\/h2><p>图像输入可以支持分类、目标识别、视觉问答、图表解释或文档理解；音频输入可以支持转写、声音事件分析和语音交互；视频引入连续时间与动作。输出也要单独看：生成一段文字、合成语音、编辑图片和生成视频有不同的数据、质量与交互要求。<\/p><p>一个产品可以组合专用模型，也可以使用统一多模态模型。专用OCR通常输出明确文字位置，视觉语言模型更擅长开放式解释；专用语音识别可以给出时间戳，实时语音模型可以直接进行对话。选择应依据目标任务、可验证性与成本，而不是模型能接收多少种文件。<\/p><h2 id=\"section-2\">表示与对齐的直觉<\/h2><p>系统需要把不同输入转成模型可处理的表示，并建立跨模态关系。例如让图像区域与文字描述关联，或把音频片段与文本对齐。内部表示不等于人类看到的原始内容，分辨率、采样和压缩都会影响可见信息。模型没有处理到的细节，无法仅靠流畅语言恢复。<\/p><p>教学构造：用户上传一张设备铭牌，希望读取型号并解释参数。小字、反光和倾斜可能导致字符识别错误；模型仍可能根据常见型号补出一个看似合理的答案。产品应允许放大、重新拍摄或人工确认关键字段，而不能因为模型能描述整张照片就相信每个字符都准确。<\/p><h2 id=\"section-3\">跨模态组合的系统流程<\/h2><p>一份会议视频可以先提取音频、转写、区分说话人，再结合关键画面生成纪要；也可以直接交给多模态模型理解。前者步骤较多但易定位问题，后者可能更简洁却不一定提供同样细粒度证据。两种方案都需要核对时间范围、信息遗漏和结果支持度。<\/p><p>模态转换还会丢失信息。把图表仅转换为文字，可能丢掉空间关系；只转写会议，可能丢掉白板和演示内容；只抽视频关键帧，可能漏掉短暂动作。产品应明确哪些信息必须保留，避免用户误以为系统完整理解了全部原始内容。<\/p><h2 id=\"section-4\">能力地图如何用于产品选择<\/h2><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>用户任务<\/th><th>需要的主要能力<\/th><th>关键核对点<\/th><\/tr><tr><td>照片转报销字段<\/td><td>OCR、版式、字段抽取<\/td><td>金额、日期与字段归属<\/td><\/tr><tr><td>会议形成纪要<\/td><td>转写、说话人、语义总结<\/td><td>原话、决策与责任人<\/td><\/tr><tr><td>设备视频查异常<\/td><td>时间采样、事件理解<\/td><td>关键片段是否被观察到<\/td><\/tr><tr><td>产品海报制作<\/td><td>生成、参考约束、编辑<\/td><td>主体准确、版式与可用素材<\/td><\/tr><tr><td>截图驱动操作<\/td><td>视觉定位、工具执行<\/td><td>真实界面状态与动作影响<\/td><\/tr><\/table><\/div><p>可以按输入来源、任务目标、输出形式和关键限制组织能力。比如“发票照片转报销字段”重视数字与字段一致性，“品牌海报生成”重视视觉与可编辑流程，“实时陪练”重视延迟与打断。相同的图像或语音能力，在不同任务中的验收标准完全不同。<\/p><p>多模态也增加隐私和版权问题。照片可能含人脸、音频可能含个人信息、视频可能含环境细节。数据上传、保留和访问范围应随产品流程说明。输入支持不代表可以合法使用任意素材，也不代表模型输出可以直接用于所有商业场景。<\/p><h2 id=\"section-5\">评价与学习顺序<\/h2><p>先理解各模态的基本任务，再学习具体系统流程和质量指标，最后比较统一模型与组合方案。评价时按字段、片段或任务结果分析，而非只问“模型看懂了吗”。还应观察成本、设备要求和用户纠错负担，尤其是手机上传、弱网和长媒体场景。<\/p><p>对通用Agent而言，多模态扩展了观察和行动范围；它不消除原有的权限、状态和完成验证要求。模型可以看截图并操作界面，也仍需检查真实执行结果。跨模态能力最终应服务清楚的用户任务，并提供与风险相匹配的证据和控制。<\/p><h2 id=\"section-6\">延伸的产品设计考虑<\/h2><p>跨模态评估还要检查信息是否被错误融合。例如录音中的数量与幻灯片中的数量不同，系统应核对时间与语境，而不是随意选择一个。若不同来源冲突，可以展示差异并说明依据。统一模型可能让交互更自然，但数据来源与证据关系仍需保留。用户最终需要知道结论根据什么，而不是只听到模型声称理解了文件。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://huggingface.co/docs/transformers/tasks/image_text_to_text\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：视觉语言模型任务<\/a><\/li><li><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/multimodal/video-understanding\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：视频理解<\/a><\/li><\/ul><p>资料核验：2026-11-14。铭牌与会议流程为教学构造；模型格式、时长及分辨率限制需按版本核验。<\/p>","toc":[{"id":"section-1","title":"从模态到任务","level":2},{"id":"section-2","title":"表示与对齐的直觉","level":2},{"id":"section-3","title":"跨模态组合的系统流程","level":2},{"id":"section-4","title":"能力地图如何用于产品选择","level":2},{"id":"section-5","title":"评价与学习顺序","level":2},{"id":"section-6","title":"延伸的产品设计考虑","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"多模态AI能够处理文字之外的图像、语音、视频等信息，有些模型还可以生成不同类型的内容。对产品经理而言，首先要把“输入什么、理解什么、输出什么”拆开，而不是把所有功能都归为一个“支持多模态”的标签。\n\n## 从模态到任务\n\n图像输入可以支持分类、目标识别、视觉问答、图表解释或文档理解；音频输入可以支持转写、声音事件分析和语音交互；视频引入连续时间与动作。输出也要单独看：生成一段文字、合成语音、编辑图片和生成视频有不同的数据、质量与交互要求。\n\n一个产品可以组合专用模型，也可以使用统一多模态模型。专用OCR通常输出明确文字位置，视觉语言模型更擅长开放式解释；专用语音识别可以给出时间戳，实时语音模型可以直接进行对话。选择应依据目标任务、可验证性与成本，而不是模型能接收多少种文件。\n\n## 表示与对齐的直觉\n\n系统需要把不同输入转成模型可处理的表示，并建立跨模态关系。例如让图像区域与文字描述关联，或把音频片段与文本对齐。内部表示不等于人类看到的原始内容，分辨率、采样和压缩都会影响可见信息。模型没有处理到的细节，无法仅靠流畅语言恢复。\n\n教学构造：用户上传一张设备铭牌，希望读取型号并解释参数。小字、反光和倾斜可能导致字符识别错误；模型仍可能根据常见型号补出一个看似合理的答案。产品应允许放大、重新拍摄或人工确认关键字段，而不能因为模型能描述整张照片就相信每个字符都准确。\n\n## 跨模态组合的系统流程\n\n一份会议视频可以先提取音频、转写、区分说话人，再结合关键画面生成纪要；也可以直接交给多模态模型理解。前者步骤较多但易定位问题，后者可能更简洁却不一定提供同样细粒度证据。两种方案都需要核对时间范围、信息遗漏和结果支持度。\n\n模态转换还会丢失信息。把图表仅转换为文字，可能丢掉空间关系；只转写会议，可能丢掉白板和演示内容；只抽视频关键帧，可能漏掉短暂动作。产品应明确哪些信息必须保留，避免用户误以为系统完整理解了全部原始内容。\n\n## 能力地图如何用于产品选择\n\n| 用户任务 | 需要的主要能力 | 关键核对点 |\n|---|---|---|\n| 照片转报销字段 | OCR、版式、字段抽取 | 金额、日期与字段归属 |\n| 会议形成纪要 | 转写、说话人、语义总结 | 原话、决策与责任人 |\n| 设备视频查异常 | 时间采样、事件理解 | 关键片段是否被观察到 |\n| 产品海报制作 | 生成、参考约束、编辑 | 主体准确、版式与可用素材 |\n| 截图驱动操作 | 视觉定位、工具执行 | 真实界面状态与动作影响 |\n\n可以按输入来源、任务目标、输出形式和关键限制组织能力。比如“发票照片转报销字段”重视数字与字段一致性，“品牌海报生成”重视视觉与可编辑流程，“实时陪练”重视延迟与打断。相同的图像或语音能力，在不同任务中的验收标准完全不同。\n\n多模态也增加隐私和版权问题。照片可能含人脸、音频可能含个人信息、视频可能含环境细节。数据上传、保留和访问范围应随产品流程说明。输入支持不代表可以合法使用任意素材，也不代表模型输出可以直接用于所有商业场景。\n\n## 评价与学习顺序\n\n先理解各模态的基本任务，再学习具体系统流程和质量指标，最后比较统一模型与组合方案。评价时按字段、片段或任务结果分析，而非只问“模型看懂了吗”。还应观察成本、设备要求和用户纠错负担，尤其是手机上传、弱网和长媒体场景。\n\n对通用Agent而言，多模态扩展了观察和行动范围；它不消除原有的权限、状态和完成验证要求。模型可以看截图并操作界面，也仍需检查真实执行结果。跨模态能力最终应服务清楚的用户任务，并提供与风险相匹配的证据和控制。\n\n## 延伸的产品设计考虑\n\n跨模态评估还要检查信息是否被错误融合。例如录音中的数量与幻灯片中的数量不同，系统应核对时间与语境，而不是随意选择一个。若不同来源冲突，可以展示差异并说明依据。统一模型可能让交互更自然，但数据来源与证据关系仍需保留。用户最终需要知道结论根据什么，而不是只听到模型声称理解了文件。\n\n## 资料与延伸阅读\n\n- [Hugging Face：视觉语言模型任务](https://huggingface.co/docs/transformers/tasks/image_text_to_text)\n- [Google Cloud：视频理解](https://cloud.google.com/vertex-ai/generative-ai/docs/multimodal/video-understanding)\n\n资料核验：2026-11-14。铭牌与会议流程为教学构造；模型格式、时长及分辨率限制需按版本核验。\n","chars":1436,"minutes":6,"summary":"多模态AI能够处理文字之外的图像、语音、视频等信息，有些模型还可以生成不同类型的内容。对产品经理而言，首先要把“输入什么、理解什么、输出什么”拆开，而不是把所有功能都归为一个“支持多模态”的标签。"},{"id":"10-02","title":"图像理解、OCR 与文档智能","file":"content/10-02.md","level":"工作应用","prerequisites":["10-01"],"aliases":["多模态","ASR","TTS","OCR","具身"],"module":"10","moduleTitle":"多模态与扩展方向","html":"<p>图片里有文字，不代表整个任务就是OCR；文档里有表格，也不代表把全部字符提出来就理解了内容。图像理解、文字识别和文档智能各自关注不同结构，实际产品往往需要组合它们，并保留原始位置供用户核对。<\/p><h2 id=\"section-1\">三类能力的区别<\/h2><p>OCR将视觉中的字符转成文本，通常还可以提供位置；图像理解回答场景、对象及关系等问题；文档智能进一步识别标题、段落、表格、选择框和阅读顺序，有些任务还需要抽取特定业务字段。能力之间有交集，但不能互相完全替代。<\/p><p>教学构造：一张发票需要读取号码、金额、税额与开票日期。OCR得到字符，版式分析判断哪些字符属于哪个字段，业务校验再核对金额关系和重复发票。视觉模型可以辅助理解，但精确财务字段仍需要针对性验证。系统生成“这是一张发票”的描述，不代表报销数据已可靠提取。<\/p><h2 id=\"section-2\">从图像到结构化记录<\/h2><p>流程可以包括图像质量检查、旋转与裁剪、OCR、版式分析、字段映射、格式与业务校验，最后展示可编辑结果。每个字段最好保留原图位置，让用户点击即可看到依据。若只给出一个无法追溯的JSON，纠错成本会明显增加。<\/p><p>表格尤其需要保留行列关系、合并单元格和脚注。跨页表格可能没有重复表头，双栏文档可能被错误串行，扫描件也可能存在缺页。导入流程应报告无法可靠处理的内容，不应把解析失败静默转换成看似完整的正文。<\/p><h2 id=\"section-3\">图表与截图中的关系<\/h2><p>图表理解需要区分标题、坐标轴、单位、图例和数据。模型可能读对趋势，却读错数值；可以解释截图功能，却不一定知道按钮背后的真实业务状态。重要数字最好回到结构化数据或人工核对，不能把视觉估读当作精确计算。<\/p><p>设备界面截图还可能含颜色、布局和告警符号。用户问“哪里异常”时，系统需要结合界面规则与背景知识，而不是仅凭红色区域判断。AI SCADA案例可以帮助理解这种关系：图像只是观察，实时数据与控制权限应来自可信业务系统。<\/p><h2 id=\"section-4\">常见失败及产品处理<\/h2><p>低清晰度、反光、遮挡、手写、相似字符和复杂排版都可能造成错误。模型对不确定字段可能直接给出最可能猜测。产品可以要求重新拍摄、标记需核对字段、保留空值或提供候选，但不应把未校准的模型分数直接称为准确率。<\/p><p>字段校验要区分格式正确与事实正确。一个日期能被解析，不代表识别的日期就是原文；金额合计一致也不代表发票真实。外部真伪验证和业务审批属于额外能力，需要明确边界。技术流程中的多个检查应各自说明能证明什么。<\/p><h2 id=\"section-5\">方案比较与验收<\/h2><p>可以比较专用文档服务、视觉语言模型和组合方案，观察字段准确性、版式覆盖、引用位置、延迟、成本和人工修改时间。不同文件类型应分别统计，避免大量清晰样本掩盖扫描件或复杂表格问题。数据采样也需符合隐私和授权要求。<\/p><p>产品经理应定义输出结构、可为空字段、错误提示、用户修订与后续系统写入规则。自动抽取只是第一步，用户能否快速确认并安全使用数据才是完整体验。把原图、字段、校验和业务状态连接起来，才能形成可持续使用的文档产品。<\/p><h2 id=\"section-6\">延伸的产品设计考虑<\/h2><p>文档更新同样影响已提取字段。重新上传版本后，旧字段是否覆盖、用户手工修订是否保留、下游业务是否重新计算，需要提前确定。原文变化与人工更正应分别记录。否则自动处理越多，用户越难发现数据已被新一轮解析悄悄改回错误值。字段级来源与版本是长期使用的重要基础。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：文档版式、表格与结构分析<\/a><\/li><li><a href=\"https://huggingface.co/docs/transformers/tasks/image_text_to_text\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：Image-text-to-text<\/a><\/li><\/ul><p>资料核验：2026-11-14。发票与设备截图示例为教学构造；本文不涉及发票法律效力认定。<\/p>","toc":[{"id":"section-1","title":"三类能力的区别","level":2},{"id":"section-2","title":"从图像到结构化记录","level":2},{"id":"section-3","title":"图表与截图中的关系","level":2},{"id":"section-4","title":"常见失败及产品处理","level":2},{"id":"section-5","title":"方案比较与验收","level":2},{"id":"section-6","title":"延伸的产品设计考虑","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"图片里有文字，不代表整个任务就是OCR；文档里有表格，也不代表把全部字符提出来就理解了内容。图像理解、文字识别和文档智能各自关注不同结构，实际产品往往需要组合它们，并保留原始位置供用户核对。\n\n## 三类能力的区别\n\nOCR将视觉中的字符转成文本，通常还可以提供位置；图像理解回答场景、对象及关系等问题；文档智能进一步识别标题、段落、表格、选择框和阅读顺序，有些任务还需要抽取特定业务字段。能力之间有交集，但不能互相完全替代。\n\n教学构造：一张发票需要读取号码、金额、税额与开票日期。OCR得到字符，版式分析判断哪些字符属于哪个字段，业务校验再核对金额关系和重复发票。视觉模型可以辅助理解，但精确财务字段仍需要针对性验证。系统生成“这是一张发票”的描述，不代表报销数据已可靠提取。\n\n## 从图像到结构化记录\n\n流程可以包括图像质量检查、旋转与裁剪、OCR、版式分析、字段映射、格式与业务校验，最后展示可编辑结果。每个字段最好保留原图位置，让用户点击即可看到依据。若只给出一个无法追溯的JSON，纠错成本会明显增加。\n\n表格尤其需要保留行列关系、合并单元格和脚注。跨页表格可能没有重复表头，双栏文档可能被错误串行，扫描件也可能存在缺页。导入流程应报告无法可靠处理的内容，不应把解析失败静默转换成看似完整的正文。\n\n## 图表与截图中的关系\n\n图表理解需要区分标题、坐标轴、单位、图例和数据。模型可能读对趋势，却读错数值；可以解释截图功能，却不一定知道按钮背后的真实业务状态。重要数字最好回到结构化数据或人工核对，不能把视觉估读当作精确计算。\n\n设备界面截图还可能含颜色、布局和告警符号。用户问“哪里异常”时，系统需要结合界面规则与背景知识，而不是仅凭红色区域判断。AI SCADA案例可以帮助理解这种关系：图像只是观察，实时数据与控制权限应来自可信业务系统。\n\n## 常见失败及产品处理\n\n低清晰度、反光、遮挡、手写、相似字符和复杂排版都可能造成错误。模型对不确定字段可能直接给出最可能猜测。产品可以要求重新拍摄、标记需核对字段、保留空值或提供候选，但不应把未校准的模型分数直接称为准确率。\n\n字段校验要区分格式正确与事实正确。一个日期能被解析，不代表识别的日期就是原文；金额合计一致也不代表发票真实。外部真伪验证和业务审批属于额外能力，需要明确边界。技术流程中的多个检查应各自说明能证明什么。\n\n## 方案比较与验收\n\n可以比较专用文档服务、视觉语言模型和组合方案，观察字段准确性、版式覆盖、引用位置、延迟、成本和人工修改时间。不同文件类型应分别统计，避免大量清晰样本掩盖扫描件或复杂表格问题。数据采样也需符合隐私和授权要求。\n\n产品经理应定义输出结构、可为空字段、错误提示、用户修订与后续系统写入规则。自动抽取只是第一步，用户能否快速确认并安全使用数据才是完整体验。把原图、字段、校验和业务状态连接起来，才能形成可持续使用的文档产品。\n\n## 延伸的产品设计考虑\n\n文档更新同样影响已提取字段。重新上传版本后，旧字段是否覆盖、用户手工修订是否保留、下游业务是否重新计算，需要提前确定。原文变化与人工更正应分别记录。否则自动处理越多，用户越难发现数据已被新一轮解析悄悄改回错误值。字段级来源与版本是长期使用的重要基础。\n\n## 资料与延伸阅读\n\n- [Microsoft：文档版式、表格与结构分析](https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout)\n- [Hugging Face：Image-text-to-text](https://huggingface.co/docs/transformers/tasks/image_text_to_text)\n\n资料核验：2026-11-14。发票与设备截图示例为教学构造；本文不涉及发票法律效力认定。\n","chars":1216,"minutes":5,"summary":"图片里有文字，不代表整个任务就是OCR；文档里有表格，也不代表把全部字符提出来就理解了内容。图像理解、文字识别和文档智能各自关注不同结构，实际产品往往需要组合它们，并保留原始位置供用户核对。"},{"id":"10-03","title":"图像生成与编辑的产品流程","file":"content/10-03.md","level":"工作应用","prerequisites":["10-02"],"aliases":["多模态","ASR","TTS","OCR","具身"],"module":"10","moduleTitle":"多模态与扩展方向","html":"<p>图像生成产品不是一个提示框加下载按钮。用户往往需要形成创意、选择参考、生成候选、局部修改、保持主体一致并导出合适素材。理解生成与编辑的流程，有助于把模型能力转化为可控的设计工作方式。<\/p><h2 id=\"section-1\">生成与编辑的基本区别<\/h2><p>文生图根据文字条件生成图像，图生图还使用初始图像作为约束，局部编辑则限定某个区域或对象。不同模型可以采用扩散、自回归或其他生成机制，具体参数与控制方式不通用。产品需要说明模型支持的参考、尺寸、透明背景、文字与编辑能力，而不是把某个平台选项当作行业标准。<\/p><p>扩散模型的一种直观解释是从噪声逐步形成符合条件的图像；图生图可以将原图编码后加入噪声，再根据条件生成变化。保留原图程度与变化程度存在权衡，具体控制参数因实现不同而异。这个机制解释了为什么“只改一个小地方”也可能影响其他细节。<\/p><h2 id=\"section-2\">用户需求如何变成约束<\/h2><p>教学构造：用户要制作工业产品宣传图，要求设备外观保持准确、背景体现工厂环境、右侧留出标题区域。这里包含主体忠实度、场景风格和版式三类约束。仅描述“科技感、高级感”无法充分表达需求，需要明确哪些可以变化、哪些必须保留。<\/p><p>参考图可能提供主体、构图、色彩或风格，产品应允许区分用途。多张参考互相冲突时，模型不一定知道优先级。对品牌标识、工业设备细节和文字排版，可能需要后续编辑工具或原始素材合成，不能假设一次生成即可达到可交付要求。<\/p><h2 id=\"section-3\">候选、迭代与版本<\/h2><p>生成通常有随机性，同样输入可能得到不同结果。用户需要比较候选、保留满意部分并撤回修改。系统可记录提示、参考素材、模型版本与编辑历史，方便继续迭代；但相同随机种子在不同模型或版本间不保证完全复现。<\/p><p>局部编辑应让用户清楚指定区域与变化目标，并核对区域外内容是否被改变。失败可能是主体形状漂移、文字拼写错误、人物数量不符或视觉关系不合理。产品可以提供对照、遮罩预览和版本回退，减少用户不断重生成全部画面的成本。<\/p><h2 id=\"section-4\">质量与输出条件<\/h2><p>质量不只是美观，还包括要求覆盖、主体一致性、细节准确性、文字可读性、构图适配和导出格式。社交媒体封面与印刷海报对尺寸、清晰度和色彩流程的要求不同。位图生成也不自动得到可编辑矢量或分层设计文件，交付应明确格式边界。<\/p><p>输入素材需要合法使用，涉及真人、品牌和商业作品时尤其要核对授权与平台规则。模型输出可能与已有内容相似，也可能产生不适合发布的细节。产品应支持人工审查和来源管理，而不能仅凭“AI生成”就默认不存在权利问题。<\/p><h2 id=\"section-5\">成本与工作流价值<\/h2><p>按生成次数收费的产品，需要观察用户取得一张可用图的总成本，而不仅是单次价格。失败重试、局部编辑和高分辨率处理都会影响费用与等待。可以先低成本探索方向，再精修选定方案，但具体做法需要看模型能力与用户用途。<\/p><p>产品经理应围绕“从意图到可用素材”拆解流程，观察用户在哪些环节需要反复解释、修正和转到其他工具。真正的产品机会可能在参考组织、主体保持、批量变体和导出，而不只是提供更多风格按钮。模型能力变化时，也应重新验证完整工作流。<\/p><h2 id=\"section-6\">延伸的产品设计考虑<\/h2><p>批量生成还会引入一致性要求。系列海报需要统一色彩、主体和留白，电商图片需要保持商品真实外观。可以用固定参考、模板和后期合成组织流程，但仍需逐张核验。一次生成成功不保证批次全部合格，自动化发布前应保留审查与回退。产品可以减少重复操作，却不能把未经检查的素材默认视为可直接发布。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://huggingface.co/docs/diffusers/using-diffusers/img2img\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face Diffusers：图生图及参数机制<\/a><\/li><li><a href=\"https://huggingface.co/docs/transformers/tasks/image_text_to_text\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：视觉语言模型<\/a><\/li><\/ul><p>资料核验：2026-11-14。工业宣传图为教学构造；具体生成能力与素材使用条件需按模型及平台核验。<\/p>","toc":[{"id":"section-1","title":"生成与编辑的基本区别","level":2},{"id":"section-2","title":"用户需求如何变成约束","level":2},{"id":"section-3","title":"候选、迭代与版本","level":2},{"id":"section-4","title":"质量与输出条件","level":2},{"id":"section-5","title":"成本与工作流价值","level":2},{"id":"section-6","title":"延伸的产品设计考虑","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"图像生成产品不是一个提示框加下载按钮。用户往往需要形成创意、选择参考、生成候选、局部修改、保持主体一致并导出合适素材。理解生成与编辑的流程，有助于把模型能力转化为可控的设计工作方式。\n\n## 生成与编辑的基本区别\n\n文生图根据文字条件生成图像，图生图还使用初始图像作为约束，局部编辑则限定某个区域或对象。不同模型可以采用扩散、自回归或其他生成机制，具体参数与控制方式不通用。产品需要说明模型支持的参考、尺寸、透明背景、文字与编辑能力，而不是把某个平台选项当作行业标准。\n\n扩散模型的一种直观解释是从噪声逐步形成符合条件的图像；图生图可以将原图编码后加入噪声，再根据条件生成变化。保留原图程度与变化程度存在权衡，具体控制参数因实现不同而异。这个机制解释了为什么“只改一个小地方”也可能影响其他细节。\n\n## 用户需求如何变成约束\n\n教学构造：用户要制作工业产品宣传图，要求设备外观保持准确、背景体现工厂环境、右侧留出标题区域。这里包含主体忠实度、场景风格和版式三类约束。仅描述“科技感、高级感”无法充分表达需求，需要明确哪些可以变化、哪些必须保留。\n\n参考图可能提供主体、构图、色彩或风格，产品应允许区分用途。多张参考互相冲突时，模型不一定知道优先级。对品牌标识、工业设备细节和文字排版，可能需要后续编辑工具或原始素材合成，不能假设一次生成即可达到可交付要求。\n\n## 候选、迭代与版本\n\n生成通常有随机性，同样输入可能得到不同结果。用户需要比较候选、保留满意部分并撤回修改。系统可记录提示、参考素材、模型版本与编辑历史，方便继续迭代；但相同随机种子在不同模型或版本间不保证完全复现。\n\n局部编辑应让用户清楚指定区域与变化目标，并核对区域外内容是否被改变。失败可能是主体形状漂移、文字拼写错误、人物数量不符或视觉关系不合理。产品可以提供对照、遮罩预览和版本回退，减少用户不断重生成全部画面的成本。\n\n## 质量与输出条件\n\n质量不只是美观，还包括要求覆盖、主体一致性、细节准确性、文字可读性、构图适配和导出格式。社交媒体封面与印刷海报对尺寸、清晰度和色彩流程的要求不同。位图生成也不自动得到可编辑矢量或分层设计文件，交付应明确格式边界。\n\n输入素材需要合法使用，涉及真人、品牌和商业作品时尤其要核对授权与平台规则。模型输出可能与已有内容相似，也可能产生不适合发布的细节。产品应支持人工审查和来源管理，而不能仅凭“AI生成”就默认不存在权利问题。\n\n## 成本与工作流价值\n\n按生成次数收费的产品，需要观察用户取得一张可用图的总成本，而不仅是单次价格。失败重试、局部编辑和高分辨率处理都会影响费用与等待。可以先低成本探索方向，再精修选定方案，但具体做法需要看模型能力与用户用途。\n\n产品经理应围绕“从意图到可用素材”拆解流程，观察用户在哪些环节需要反复解释、修正和转到其他工具。真正的产品机会可能在参考组织、主体保持、批量变体和导出，而不只是提供更多风格按钮。模型能力变化时，也应重新验证完整工作流。\n\n## 延伸的产品设计考虑\n\n批量生成还会引入一致性要求。系列海报需要统一色彩、主体和留白，电商图片需要保持商品真实外观。可以用固定参考、模板和后期合成组织流程，但仍需逐张核验。一次生成成功不保证批次全部合格，自动化发布前应保留审查与回退。产品可以减少重复操作，却不能把未经检查的素材默认视为可直接发布。\n\n## 资料与延伸阅读\n\n- [Hugging Face Diffusers：图生图及参数机制](https://huggingface.co/docs/diffusers/using-diffusers/img2img)\n- [Hugging Face：视觉语言模型](https://huggingface.co/docs/transformers/tasks/image_text_to_text)\n\n资料核验：2026-11-14。工业宣传图为教学构造；具体生成能力与素材使用条件需按模型及平台核验。\n","chars":1287,"minutes":5,"summary":"图像生成产品不是一个提示框加下载按钮。用户往往需要形成创意、选择参考、生成候选、局部修改、保持主体一致并导出合适素材。理解生成与编辑的流程，有助于把模型能力转化为可控的设计工作方式。"},{"id":"10-04","title":"语音识别、转写与说话人区分","file":"content/10-04.md","level":"工作应用","prerequisites":["10-03"],"aliases":["多模态","ASR","TTS","OCR","具身"],"module":"10","moduleTitle":"多模态与扩展方向","html":"<p>语音识别把声音转换为文字，会议纪要还需要知道谁在说、何时说、哪些是结论和行动项。把转写、说话人区分和语义总结分开理解，才能诊断问题，也能避免把一份流畅摘要误当作准确记录。<\/p><h2 id=\"section-1\">从音频到文字<\/h2><p>音频包含采样率、声道、噪声和时间信息。识别模型将声音片段映射为文本，系统可能再处理标点、数字、专有名词和时间戳。流式识别可以边听边显示，但中间结果可能修改，最终结果与暂定文本需要有清楚区别。<\/p><p>教学构造：会议中说“下周不要上线”，噪声使“不”被漏掉，摘要就可能变成相反决策。错误不一定表现为整句乱码，短小否定词、金额和日期更可能产生重大影响。产品需要针对关键事实设计核对，而不是只关注总体转写是否可读。<\/p><h2 id=\"section-2\">说话人区分与身份识别<\/h2><p>说话人区分把音频分成不同发言者，不一定知道真实姓名；身份识别则尝试将声音关联到具体人物，是另一个任务。标签“说话人一”不能自动变成某位参会人，用户确认或额外信息可能是必要的。多人重叠、远场录音和频繁打断会增加难度。<\/p><p>语音与视频也可能提供不同线索。看到某人出现在画面里，并不保证当前声音属于他；共享麦克风和屏幕录制也会让自动映射更复杂。产品应允许修正说话人，并说明修正是否会影响全文归属、摘要和行动项。<\/p><h2 id=\"section-3\">术语、数字与语言混合<\/h2><p>行业词、产品名、英文缩写和口音可能导致识别错误。热词或上下文可以帮助，但不应把候选词强行替换为看似熟悉的名称。数字表达还需标准化，如口述金额、百分比和日期；标准化后的字段应能回到原始音频位置核对。<\/p><p>评估识别常使用词错误率等指标，但用户关心的关键字段不一定与平均错误率一致。一场会议大量寒暄识别准确，唯一的交付日期识别错误，整体指标仍可能很好。因此需要补充人名、金额、日期、否定和决策归属等任务级指标。<\/p><h2 id=\"section-4\">从转写到会议知识<\/h2><p>纪要生成需要区分事实陈述、建议、讨论和最终决策，不能把所有“可以考虑”都写成行动项。行动项还需责任人、截止时间和状态；缺少明确依据时应保留未确定，而不是自动补全。摘要中的每项重要结论最好能跳转到音频片段或转写位置。<\/p><p>长录音分段处理时，需要保留跨段人物与话题关系。上下文不足可能使同一事项被重复记录，或把前面已经否决的方案再次写成结论。系统应合并与核对，而不只是把多段摘要顺序拼接。<\/p><h2 id=\"section-5\">隐私与用户体验<\/h2><p>录音涉及参与者知情、组织规则、个人信息和保存期限，产品应按使用场景明确录制与访问边界。转写可搜索后，原本难检索的对话会变得易传播，权限设计需要覆盖录音、全文、摘要和分享链接，而非只保护音频文件。<\/p><p>手机场景还需考虑弱网、断点上传和后台录音限制。产品应显示录制、上传、识别和总结的不同状态，并保留失败恢复方式。对用户而言，能找到原话、快速纠错并安全使用结论，比一份无法追溯的漂亮纪要更重要。<\/p><h2 id=\"section-6\">延伸的产品设计考虑<\/h2><p>转写修订需要与摘要联动。用户把“周三”改成“周四”后，行动项日期是否自动更新，已经分享的纪要如何提示版本，应有明确行为。若摘要与全文独立保存却不同步，产品可能继续传播旧错误。重要修订可以触发相关结论重新核对，并保留修改记录，让使用者知道哪一版是当前有效内容。<\/p><h2 id=\"section-7\">补充的判断方法<\/h2><p>原始录音与摘要的版本关系还应便于用户理解。删除录音后，转写和分享内容是否一并删除，需要明确说明。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://huggingface.co/docs/transformers/tasks/asr\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：自动语音识别任务<\/a><\/li><li><a href=\"https://docs.cloud.google.com/vertex-ai/generative-ai/docs/live-api\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：实时音视频交互架构<\/a><\/li><\/ul><p>资料核验：2026-11-14。会议话语为教学构造；录音与身份处理的适用要求需按地区及组织核验。<\/p>","toc":[{"id":"section-1","title":"从音频到文字","level":2},{"id":"section-2","title":"说话人区分与身份识别","level":2},{"id":"section-3","title":"术语、数字与语言混合","level":2},{"id":"section-4","title":"从转写到会议知识","level":2},{"id":"section-5","title":"隐私与用户体验","level":2},{"id":"section-6","title":"延伸的产品设计考虑","level":2},{"id":"section-7","title":"补充的判断方法","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"语音识别把声音转换为文字，会议纪要还需要知道谁在说、何时说、哪些是结论和行动项。把转写、说话人区分和语义总结分开理解，才能诊断问题，也能避免把一份流畅摘要误当作准确记录。\n\n## 从音频到文字\n\n音频包含采样率、声道、噪声和时间信息。识别模型将声音片段映射为文本，系统可能再处理标点、数字、专有名词和时间戳。流式识别可以边听边显示，但中间结果可能修改，最终结果与暂定文本需要有清楚区别。\n\n教学构造：会议中说“下周不要上线”，噪声使“不”被漏掉，摘要就可能变成相反决策。错误不一定表现为整句乱码，短小否定词、金额和日期更可能产生重大影响。产品需要针对关键事实设计核对，而不是只关注总体转写是否可读。\n\n## 说话人区分与身份识别\n\n说话人区分把音频分成不同发言者，不一定知道真实姓名；身份识别则尝试将声音关联到具体人物，是另一个任务。标签“说话人一”不能自动变成某位参会人，用户确认或额外信息可能是必要的。多人重叠、远场录音和频繁打断会增加难度。\n\n语音与视频也可能提供不同线索。看到某人出现在画面里，并不保证当前声音属于他；共享麦克风和屏幕录制也会让自动映射更复杂。产品应允许修正说话人，并说明修正是否会影响全文归属、摘要和行动项。\n\n## 术语、数字与语言混合\n\n行业词、产品名、英文缩写和口音可能导致识别错误。热词或上下文可以帮助，但不应把候选词强行替换为看似熟悉的名称。数字表达还需标准化，如口述金额、百分比和日期；标准化后的字段应能回到原始音频位置核对。\n\n评估识别常使用词错误率等指标，但用户关心的关键字段不一定与平均错误率一致。一场会议大量寒暄识别准确，唯一的交付日期识别错误，整体指标仍可能很好。因此需要补充人名、金额、日期、否定和决策归属等任务级指标。\n\n## 从转写到会议知识\n\n纪要生成需要区分事实陈述、建议、讨论和最终决策，不能把所有“可以考虑”都写成行动项。行动项还需责任人、截止时间和状态；缺少明确依据时应保留未确定，而不是自动补全。摘要中的每项重要结论最好能跳转到音频片段或转写位置。\n\n长录音分段处理时，需要保留跨段人物与话题关系。上下文不足可能使同一事项被重复记录，或把前面已经否决的方案再次写成结论。系统应合并与核对，而不只是把多段摘要顺序拼接。\n\n## 隐私与用户体验\n\n录音涉及参与者知情、组织规则、个人信息和保存期限，产品应按使用场景明确录制与访问边界。转写可搜索后，原本难检索的对话会变得易传播，权限设计需要覆盖录音、全文、摘要和分享链接，而非只保护音频文件。\n\n手机场景还需考虑弱网、断点上传和后台录音限制。产品应显示录制、上传、识别和总结的不同状态，并保留失败恢复方式。对用户而言，能找到原话、快速纠错并安全使用结论，比一份无法追溯的漂亮纪要更重要。\n\n## 延伸的产品设计考虑\n\n转写修订需要与摘要联动。用户把“周三”改成“周四”后，行动项日期是否自动更新，已经分享的纪要如何提示版本，应有明确行为。若摘要与全文独立保存却不同步，产品可能继续传播旧错误。重要修订可以触发相关结论重新核对，并保留修改记录，让使用者知道哪一版是当前有效内容。\n\n## 补充的判断方法\n\n原始录音与摘要的版本关系还应便于用户理解。删除录音后，转写和分享内容是否一并删除，需要明确说明。\n\n## 资料与延伸阅读\n\n- [Hugging Face：自动语音识别任务](https://huggingface.co/docs/transformers/tasks/asr)\n- [Google Cloud：实时音视频交互架构](https://docs.cloud.google.com/vertex-ai/generative-ai/docs/live-api)\n\n资料核验：2026-11-14。会议话语为教学构造；录音与身份处理的适用要求需按地区及组织核验。\n","chars":1233,"minutes":5,"summary":"语音识别把声音转换为文字，会议纪要还需要知道谁在说、何时说、哪些是结论和行动项。把转写、说话人区分和语义总结分开理解，才能诊断问题，也能避免把一份流畅摘要误当作准确记录。"},{"id":"10-05","title":"语音合成、实时语音与打断","file":"content/10-05.md","level":"工作应用","prerequisites":["10-04"],"aliases":["多模态","ASR","TTS","OCR","具身"],"module":"10","moduleTitle":"多模态与扩展方向","html":"<p>语音合成将文字变成可听内容，实时语音产品还要处理用户何时说话、系统何时回应，以及双方互相打断。流畅声音只是基础，真正自然的交互需要模型、音频链路、状态和界面共同配合。<\/p><h2 id=\"section-1\">两种典型系统路线<\/h2><p>级联系统通常先识别语音，再用语言模型生成文字，最后合成语音。它的各阶段较容易分别检查，也便于保存可编辑文本；端到端语音模型可以直接处理声音并生成语音，可能更好利用语调等信息，但不一定提供同样清楚的中间证据。实际选择要比较任务与实现条件。<\/p><p>两种路线都需要采集、传输、播放和会话管理。耳机、扬声器回声、网络抖动和设备权限都会影响体验。模型服务响应快，不代表用户听到第一段有用内容也快；产品需要测量端到端链路。<\/p><h2 id=\"section-2\">合成质量的多个维度<\/h2><p>语音清晰度、自然度、发音准确性、情绪和角色一致性都重要。产品名、缩写、数字和中英混合可能需要发音控制；文字适合阅读，不一定适合口述。长句、表格和代码需要转成适合听觉理解的表达，而不是原样朗读页面。<\/p><p>教学构造：学习助手解释一个API参数，直接朗读长JSON会造成认知负担。可以先口头概括字段含义，再在屏幕展示结构；用户追问时再读关键部分。多模态界面可以分配听觉与视觉负担，提高理解效率。<\/p><h2 id=\"section-3\">回合与打断<\/h2><p>系统需要判断用户是否说完、短暂停顿是否只是思考，以及是否出现插话。等待太久显得迟钝，过早回答会抢话。用户打断时，系统可能需要停止播放、取消仍在生成的语音，并更新对话状态。已经说出的内容与尚未播放的内容应区分，否则模型可能以为用户听完全部回答。<\/p><p>教学构造：系统正在讲第三步，用户说“先停一下，第二步没明白”。合理行为是停止并回到第二步，而不是继续把剩余内容播放完。工具执行中的打断更复杂：停止语音不等于取消已经提交的订单，界面和声音都要说明真实业务状态。<\/p><h2 id=\"section-4\">延迟与反馈<\/h2><p>可以关注识别结束等待、模型首段生成、语音首包、播放启动和完整任务时间。提前播放部分内容可以降低感知等待，但若后文需要纠正前文，体验可能更差。短反馈如“我在核对资料”有帮助，重复无信息占位则会增加烦躁。<\/p><p>实时系统还需处理断线重连、会话过期和音频丢失。恢复时不应让用户重复整段，也不能默认丢失部分没有重要内容。必要时明确说明未听清的范围。用户能否随时切换文字输入，也是可访问性与可靠性设计的一部分。<\/p><h2 id=\"section-5\">声音与授权<\/h2><p>自定义声音可能涉及真人授权、冒用和欺骗风险。产品应核对素材来源、可用范围和披露要求，不能因为技术可克隆就默认可使用。语音输出也可能被外放给其他人听到，敏感信息应结合场景和用户控制处理。<\/p><p>产品经理需要把声音质量、回合控制、打断、屏幕辅助与业务执行一起评审。一个实时语音Agent的成功，不是持续说话，而是让用户能自然表达、及时纠正并完成任务。实际模型、语言支持和延迟限制应随版本持续核验。<\/p><h2 id=\"section-6\">延伸的产品设计考虑<\/h2><p>语音场景中的确认也应适合听觉。长串参数一次读完容易让用户遗漏，可以先概括关键影响，再把收件人、金额等重要字段逐项明确。用户的简短“嗯”是否构成授权，需结合任务风险和交互规则判断。对于高影响动作，屏幕确认或明确复述可能更合适，不能只靠模糊声音猜测同意。<\/p><h2 id=\"section-7\">补充的判断方法<\/h2><p>播放速度、音量与字幕也属于用户控制，应在不同环境下可调整，避免自然声音反而降低信息可达性。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech\" target=\"_blank\" rel=\"noopener noreferrer\">Microsoft：语音合成能力与特性<\/a><\/li><li><a href=\"https://docs.cloud.google.com/vertex-ai/generative-ai/docs/live-api\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：Gemini Live API概览<\/a><\/li><\/ul><p>资料核验：2026-11-14。学习助手例子为教学构造；声音授权和具体服务能力需按实际条件核验。<\/p>","toc":[{"id":"section-1","title":"两种典型系统路线","level":2},{"id":"section-2","title":"合成质量的多个维度","level":2},{"id":"section-3","title":"回合与打断","level":2},{"id":"section-4","title":"延迟与反馈","level":2},{"id":"section-5","title":"声音与授权","level":2},{"id":"section-6","title":"延伸的产品设计考虑","level":2},{"id":"section-7","title":"补充的判断方法","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"语音合成将文字变成可听内容，实时语音产品还要处理用户何时说话、系统何时回应，以及双方互相打断。流畅声音只是基础，真正自然的交互需要模型、音频链路、状态和界面共同配合。\n\n## 两种典型系统路线\n\n级联系统通常先识别语音，再用语言模型生成文字，最后合成语音。它的各阶段较容易分别检查，也便于保存可编辑文本；端到端语音模型可以直接处理声音并生成语音，可能更好利用语调等信息，但不一定提供同样清楚的中间证据。实际选择要比较任务与实现条件。\n\n两种路线都需要采集、传输、播放和会话管理。耳机、扬声器回声、网络抖动和设备权限都会影响体验。模型服务响应快，不代表用户听到第一段有用内容也快；产品需要测量端到端链路。\n\n## 合成质量的多个维度\n\n语音清晰度、自然度、发音准确性、情绪和角色一致性都重要。产品名、缩写、数字和中英混合可能需要发音控制；文字适合阅读，不一定适合口述。长句、表格和代码需要转成适合听觉理解的表达，而不是原样朗读页面。\n\n教学构造：学习助手解释一个API参数，直接朗读长JSON会造成认知负担。可以先口头概括字段含义，再在屏幕展示结构；用户追问时再读关键部分。多模态界面可以分配听觉与视觉负担，提高理解效率。\n\n## 回合与打断\n\n系统需要判断用户是否说完、短暂停顿是否只是思考，以及是否出现插话。等待太久显得迟钝，过早回答会抢话。用户打断时，系统可能需要停止播放、取消仍在生成的语音，并更新对话状态。已经说出的内容与尚未播放的内容应区分，否则模型可能以为用户听完全部回答。\n\n教学构造：系统正在讲第三步，用户说“先停一下，第二步没明白”。合理行为是停止并回到第二步，而不是继续把剩余内容播放完。工具执行中的打断更复杂：停止语音不等于取消已经提交的订单，界面和声音都要说明真实业务状态。\n\n## 延迟与反馈\n\n可以关注识别结束等待、模型首段生成、语音首包、播放启动和完整任务时间。提前播放部分内容可以降低感知等待，但若后文需要纠正前文，体验可能更差。短反馈如“我在核对资料”有帮助，重复无信息占位则会增加烦躁。\n\n实时系统还需处理断线重连、会话过期和音频丢失。恢复时不应让用户重复整段，也不能默认丢失部分没有重要内容。必要时明确说明未听清的范围。用户能否随时切换文字输入，也是可访问性与可靠性设计的一部分。\n\n## 声音与授权\n\n自定义声音可能涉及真人授权、冒用和欺骗风险。产品应核对素材来源、可用范围和披露要求，不能因为技术可克隆就默认可使用。语音输出也可能被外放给其他人听到，敏感信息应结合场景和用户控制处理。\n\n产品经理需要把声音质量、回合控制、打断、屏幕辅助与业务执行一起评审。一个实时语音Agent的成功，不是持续说话，而是让用户能自然表达、及时纠正并完成任务。实际模型、语言支持和延迟限制应随版本持续核验。\n\n## 延伸的产品设计考虑\n\n语音场景中的确认也应适合听觉。长串参数一次读完容易让用户遗漏，可以先概括关键影响，再把收件人、金额等重要字段逐项明确。用户的简短“嗯”是否构成授权，需结合任务风险和交互规则判断。对于高影响动作，屏幕确认或明确复述可能更合适，不能只靠模糊声音猜测同意。\n\n## 补充的判断方法\n\n播放速度、音量与字幕也属于用户控制，应在不同环境下可调整，避免自然声音反而降低信息可达性。\n\n## 资料与延伸阅读\n\n- [Microsoft：语音合成能力与特性](https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech)\n- [Google Cloud：Gemini Live API概览](https://docs.cloud.google.com/vertex-ai/generative-ai/docs/live-api)\n\n资料核验：2026-11-14。学习助手例子为教学构造；声音授权和具体服务能力需按实际条件核验。\n","chars":1227,"minutes":5,"summary":"语音合成将文字变成可听内容，实时语音产品还要处理用户何时说话、系统何时回应，以及双方互相打断。流畅声音只是基础，真正自然的交互需要模型、音频链路、状态和界面共同配合。"},{"id":"10-06","title":"视频理解与生成的时间维度","file":"content/10-06.md","level":"工作应用","prerequisites":["10-05"],"aliases":["多模态","ASR","TTS","OCR","具身"],"module":"10","moduleTitle":"多模态与扩展方向","html":"<p>视频同时包含画面、声音与时间关系。理解某一帧不等于理解整个事件，生成连续画面也不等于动作与物理关系正确。时间维度让视频产品在采样、证据、成本和质量判断上与图片明显不同。<\/p><h2 id=\"section-1\">视频理解依赖什么信息<\/h2><p>系统可以采样画面、分析音轨、读取字幕，并结合时间戳理解内容。不同任务需要不同密度：概括一场讲座可能主要依赖语音，识别短暂设备异常则需要足够连续的画面。若采样漏掉关键瞬间，模型再强也无法可靠描述未观察到的事件。<\/p><p>教学构造：一分钟设备视频里，某个指示灯只闪烁半秒。低频抽帧可能完全错过；但提高采样又增加处理成本。产品应按目标事件持续时间、错误代价和设备条件选择方案，不能把“支持长视频”理解为“不会漏掉任何短事件”。<\/p><h2 id=\"section-2\">时间关系与证据定位<\/h2><p>用户可能问谁先操作、何时出现异常、某动作持续多久。系统需要保持事件顺序与时间范围，不能只列出视频出现过的对象。答案最好提供对应片段或时间戳，便于用户复核。时间定位精度也应说明，避免把近似位置呈现成精确测量。<\/p><p>长视频分段后，要合并跨段人物、物体与话题。只拼接各段摘要，可能重复计数或丢失跨段因果。因果解释尤其需要谨慎：画面中先后发生两个事件，不代表前者导致后者。产品应区分观察到的顺序与需要额外证据的推断。<\/p><h2 id=\"section-3\">视频生成的主要约束<\/h2><p>生成视频需要在连续帧中保持主体、场景、镜头和动作一致。常见问题包括物体突然改变、人物身份漂移、手部或运动关系异常，以及文字不可读。短片段单帧美观不代表连续观看可用，质量评价应覆盖时间一致性和用户具体要求。<\/p><p>文生视频、图生视频和参考驱动编辑的控制能力不同。用户需要明确镜头、时长、动作与不可改变的主体特征，产品则应说明支持范围。生成一段视频通常也不等于得到可编辑时间线、独立音轨或分层素材，导出能力需要单独定义。<\/p><h2 id=\"section-4\">生成工作流与迭代成本<\/h2><p>可以先形成脚本、分镜和参考，再生成候选片段，最后剪辑、配音和检查。长内容往往需要多段组合，段间主体和风格一致性成为额外问题。某些失败适合局部重做，另一些需要重新设计动作或镜头，产品应帮助用户理解可控范围。<\/p><p>总成本包括多次候选、失败重试、高清处理、音频与编辑。单次生成价格不能代表得到可发布成片的成本。等待也可能较长，任务队列、后台处理、进度与取消说明会显著影响体验。模型能力与平台限制变化较快，需要标注核验日期。<\/p><h2 id=\"section-5\">隐私、真实性与场景边界<\/h2><p>视频容易包含人脸、声音、位置和工作环境信息，输入与分享需要合理权限。生成内容还可能被误认为真实记录，涉及人物或事件时应考虑授权、披露和平台规则。对于工业安全、医疗或法律取证等高风险用途，不能把生成或视觉解释当成权威证据。<\/p><p>产品经理应先定义目标任务，再确定需要保留哪些时间信息、如何复核、怎样评价遗漏和误报。视频能力的价值来自帮助用户理解或制作内容，而不是把更长媒体交给模型后获得一段无法核查的概括。<\/p><h2 id=\"section-6\">延伸的产品设计考虑<\/h2><p>视频检索还需要保存片段级索引。用户问某次操作出现在哪，可返回候选时间段并允许继续缩小范围；若只有整段摘要，很难支持精确查找。片段描述、转写和视觉证据可以组合，但必须标明各自来源。这样能把一次性总结扩展为可查阅知识，而不是每次重新处理全部视频。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/multimodal/video-understanding\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：视频理解输入与处理<\/a><\/li><li><a href=\"https://huggingface.co/docs/diffusers/using-diffusers/img2img\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：生成模型与图像编辑基础<\/a><\/li><\/ul><p>资料核验：2026-11-14。指示灯视频为教学构造；本文视频生成部分为通用产品分析，不代表特定模型性能。<\/p>","toc":[{"id":"section-1","title":"视频理解依赖什么信息","level":2},{"id":"section-2","title":"时间关系与证据定位","level":2},{"id":"section-3","title":"视频生成的主要约束","level":2},{"id":"section-4","title":"生成工作流与迭代成本","level":2},{"id":"section-5","title":"隐私、真实性与场景边界","level":2},{"id":"section-6","title":"延伸的产品设计考虑","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"视频同时包含画面、声音与时间关系。理解某一帧不等于理解整个事件，生成连续画面也不等于动作与物理关系正确。时间维度让视频产品在采样、证据、成本和质量判断上与图片明显不同。\n\n## 视频理解依赖什么信息\n\n系统可以采样画面、分析音轨、读取字幕，并结合时间戳理解内容。不同任务需要不同密度：概括一场讲座可能主要依赖语音，识别短暂设备异常则需要足够连续的画面。若采样漏掉关键瞬间，模型再强也无法可靠描述未观察到的事件。\n\n教学构造：一分钟设备视频里，某个指示灯只闪烁半秒。低频抽帧可能完全错过；但提高采样又增加处理成本。产品应按目标事件持续时间、错误代价和设备条件选择方案，不能把“支持长视频”理解为“不会漏掉任何短事件”。\n\n## 时间关系与证据定位\n\n用户可能问谁先操作、何时出现异常、某动作持续多久。系统需要保持事件顺序与时间范围，不能只列出视频出现过的对象。答案最好提供对应片段或时间戳，便于用户复核。时间定位精度也应说明，避免把近似位置呈现成精确测量。\n\n长视频分段后，要合并跨段人物、物体与话题。只拼接各段摘要，可能重复计数或丢失跨段因果。因果解释尤其需要谨慎：画面中先后发生两个事件，不代表前者导致后者。产品应区分观察到的顺序与需要额外证据的推断。\n\n## 视频生成的主要约束\n\n生成视频需要在连续帧中保持主体、场景、镜头和动作一致。常见问题包括物体突然改变、人物身份漂移、手部或运动关系异常，以及文字不可读。短片段单帧美观不代表连续观看可用，质量评价应覆盖时间一致性和用户具体要求。\n\n文生视频、图生视频和参考驱动编辑的控制能力不同。用户需要明确镜头、时长、动作与不可改变的主体特征，产品则应说明支持范围。生成一段视频通常也不等于得到可编辑时间线、独立音轨或分层素材，导出能力需要单独定义。\n\n## 生成工作流与迭代成本\n\n可以先形成脚本、分镜和参考，再生成候选片段，最后剪辑、配音和检查。长内容往往需要多段组合，段间主体和风格一致性成为额外问题。某些失败适合局部重做，另一些需要重新设计动作或镜头，产品应帮助用户理解可控范围。\n\n总成本包括多次候选、失败重试、高清处理、音频与编辑。单次生成价格不能代表得到可发布成片的成本。等待也可能较长，任务队列、后台处理、进度与取消说明会显著影响体验。模型能力与平台限制变化较快，需要标注核验日期。\n\n## 隐私、真实性与场景边界\n\n视频容易包含人脸、声音、位置和工作环境信息，输入与分享需要合理权限。生成内容还可能被误认为真实记录，涉及人物或事件时应考虑授权、披露和平台规则。对于工业安全、医疗或法律取证等高风险用途，不能把生成或视觉解释当成权威证据。\n\n产品经理应先定义目标任务，再确定需要保留哪些时间信息、如何复核、怎样评价遗漏和误报。视频能力的价值来自帮助用户理解或制作内容，而不是把更长媒体交给模型后获得一段无法核查的概括。\n\n## 延伸的产品设计考虑\n\n视频检索还需要保存片段级索引。用户问某次操作出现在哪，可返回候选时间段并允许继续缩小范围；若只有整段摘要，很难支持精确查找。片段描述、转写和视觉证据可以组合，但必须标明各自来源。这样能把一次性总结扩展为可查阅知识，而不是每次重新处理全部视频。\n\n## 资料与延伸阅读\n\n- [Google Cloud：视频理解输入与处理](https://cloud.google.com/vertex-ai/generative-ai/docs/multimodal/video-understanding)\n- [Hugging Face：生成模型与图像编辑基础](https://huggingface.co/docs/diffusers/using-diffusers/img2img)\n\n资料核验：2026-11-14。指示灯视频为教学构造；本文视频生成部分为通用产品分析，不代表特定模型性能。\n","chars":1229,"minutes":5,"summary":"视频同时包含画面、声音与时间关系。理解某一帧不等于理解整个事件，生成连续画面也不等于动作与物理关系正确。时间维度让视频产品在采样、证据、成本和质量判断上与图片明显不同。"},{"id":"10-07","title":"多模态产品质量、成本与体验","file":"content/10-07.md","level":"工作应用","prerequisites":["10-06"],"aliases":["多模态","ASR","TTS","OCR","具身"],"module":"10","moduleTitle":"多模态与扩展方向","html":"<p>多模态产品容易给人强烈演示效果，但日常使用质量取决于输入变化、处理成本和纠错体验。图片能上传、语音能播放、视频能总结，只证明链路可运行；真正的产品判断需要回到具体任务和用户代价。<\/p><h2 id=\"section-1\">质量应按任务拆开<\/h2><p>文档抽取关注关键字段与结构，图像生成关注要求覆盖和可用素材，语音产品关注识别、回合与听觉理解，视频产品关注事件与时间关系。不能用一个统一的“多模态准确率”概括。每类任务还要区分严重错误、轻微瑕疵和用户可接受的变化。<\/p><p>教学构造：报销字段九成正确听起来不错，但若错误集中在金额和收款人，就可能不可接受；海报生成中颜色略有变化可能可接受，品牌标识变形则不可接受。错误位置与业务影响比平均分更重要，需要在评价标准中体现。<\/p><h2 id=\"section-2\">输入条件决定可见信息<\/h2><p>分辨率、音频质量、视频采样、压缩和文件结构会影响模型观察。提高质量可能增加上传时间、存储和推理成本。手机拍摄还存在弱网、旋转、反光和后台限制。产品应提供前置质量检查与可理解提示，减少用户等待后才发现无法处理。<\/p><p>输入过大时可以裁剪、分段或抽样，但需要说明是否可能丢失信息。系统自动缩小图片后，用户可能不知道小字已不可读。对关键字段，应保留原始素材与查看入口；必要时请求更清晰输入，而不是让模型猜测。<\/p><h2 id=\"section-3\">成本需要按成功结果计算<\/h2><p>成本可能按图像数量、像素、音频时长、视频时长或Token计量，还包括预处理、存储、传输和人工修订。不同供应商计价单位不可直接比较。应换算到用户完成一项任务的总成本，并观察失败重试与候选数量。<\/p><p>教学构造：方案A每次生成更便宜，但平均需要五次才能得到可用素材；方案B单次更贵，却通常两次可用。最终还要加入等待与编辑时间，不能仅凭接口单价决定。价格会变化，知识库中的数值应标注日期，通用方法则可长期使用。<\/p><h2 id=\"section-4\">体验设计连接不确定性<\/h2><p>长媒体处理适合后台任务、分阶段结果和明确状态；实时语音更重视低延迟与打断；文档抽取需要原文对照与字段编辑。错误恢复也应贴合模态：重新拍照、选择说话人、调整裁剪或定位视频片段，比统一“重试”更有帮助。<\/p><p>可访问性也要考虑。语音回答应有文字替代，图片信息应有必要说明，颜色不应成为唯一状态提示。用户所在环境可能不方便发声或听音，手机产品应支持灵活切换输入输出方式，而不是强迫使用最具演示效果的模态。<\/p><h2 id=\"section-5\">隐私与发布前检查<\/h2><p>多模态资料包含的信息往往比用户主动输入的文字更多。照片背景、音频旁人和视频位置都可能涉及隐私。产品需要明确上传范围、保留、分享与删除行为；调用外部模型时还要核对数据处理条件和组织要求。<\/p><p>上线前应按设备、文件类型、语言、噪声和复杂场景分层检查，避免只使用最清晰的素材。对无法可靠支持的情况给出边界，比笼统声称“理解任意文件”更可持续。产品经理的职责是把能力、成本与用户控制组合成稳定工作流。<\/p><h2 id=\"section-6\">延伸的产品设计考虑<\/h2><p>还应观察人工修订时间。模型输出在自动指标上只差一点，却可能让用户花大量时间逐项核对；另一方案保留清楚来源和编辑入口，实际工作可能更快。可用性评价可以记录从上传到确认可用的完整时长，并区分模型等待、人工检查和修订。这个指标更接近真实生产力，也更容易解释产品价值。<\/p><h2 id=\"section-7\">补充的判断方法<\/h2><p>最终验收应保留原始输入条件，让后续模型升级可以在相同素材和范围下比较，避免结论失去参照。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://huggingface.co/docs/transformers/tasks/image_text_to_text\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：视觉模型输入与推理<\/a><\/li><li><a href=\"https://docs.cloud.google.com/vertex-ai/generative-ai/docs/live-api\" target=\"_blank\" rel=\"noopener noreferrer\">Google Cloud：实时多模态API概览<\/a><\/li><\/ul><p>资料核验：2026-11-14。成本与字段例子为教学构造，非报价或性能承诺。<\/p>","toc":[{"id":"section-1","title":"质量应按任务拆开","level":2},{"id":"section-2","title":"输入条件决定可见信息","level":2},{"id":"section-3","title":"成本需要按成功结果计算","level":2},{"id":"section-4","title":"体验设计连接不确定性","level":2},{"id":"section-5","title":"隐私与发布前检查","level":2},{"id":"section-6","title":"延伸的产品设计考虑","level":2},{"id":"section-7","title":"补充的判断方法","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"多模态产品容易给人强烈演示效果，但日常使用质量取决于输入变化、处理成本和纠错体验。图片能上传、语音能播放、视频能总结，只证明链路可运行；真正的产品判断需要回到具体任务和用户代价。\n\n## 质量应按任务拆开\n\n文档抽取关注关键字段与结构，图像生成关注要求覆盖和可用素材，语音产品关注识别、回合与听觉理解，视频产品关注事件与时间关系。不能用一个统一的“多模态准确率”概括。每类任务还要区分严重错误、轻微瑕疵和用户可接受的变化。\n\n教学构造：报销字段九成正确听起来不错，但若错误集中在金额和收款人，就可能不可接受；海报生成中颜色略有变化可能可接受，品牌标识变形则不可接受。错误位置与业务影响比平均分更重要，需要在评价标准中体现。\n\n## 输入条件决定可见信息\n\n分辨率、音频质量、视频采样、压缩和文件结构会影响模型观察。提高质量可能增加上传时间、存储和推理成本。手机拍摄还存在弱网、旋转、反光和后台限制。产品应提供前置质量检查与可理解提示，减少用户等待后才发现无法处理。\n\n输入过大时可以裁剪、分段或抽样，但需要说明是否可能丢失信息。系统自动缩小图片后，用户可能不知道小字已不可读。对关键字段，应保留原始素材与查看入口；必要时请求更清晰输入，而不是让模型猜测。\n\n## 成本需要按成功结果计算\n\n成本可能按图像数量、像素、音频时长、视频时长或Token计量，还包括预处理、存储、传输和人工修订。不同供应商计价单位不可直接比较。应换算到用户完成一项任务的总成本，并观察失败重试与候选数量。\n\n教学构造：方案A每次生成更便宜，但平均需要五次才能得到可用素材；方案B单次更贵，却通常两次可用。最终还要加入等待与编辑时间，不能仅凭接口单价决定。价格会变化，知识库中的数值应标注日期，通用方法则可长期使用。\n\n## 体验设计连接不确定性\n\n长媒体处理适合后台任务、分阶段结果和明确状态；实时语音更重视低延迟与打断；文档抽取需要原文对照与字段编辑。错误恢复也应贴合模态：重新拍照、选择说话人、调整裁剪或定位视频片段，比统一“重试”更有帮助。\n\n可访问性也要考虑。语音回答应有文字替代，图片信息应有必要说明，颜色不应成为唯一状态提示。用户所在环境可能不方便发声或听音，手机产品应支持灵活切换输入输出方式，而不是强迫使用最具演示效果的模态。\n\n## 隐私与发布前检查\n\n多模态资料包含的信息往往比用户主动输入的文字更多。照片背景、音频旁人和视频位置都可能涉及隐私。产品需要明确上传范围、保留、分享与删除行为；调用外部模型时还要核对数据处理条件和组织要求。\n\n上线前应按设备、文件类型、语言、噪声和复杂场景分层检查，避免只使用最清晰的素材。对无法可靠支持的情况给出边界，比笼统声称“理解任意文件”更可持续。产品经理的职责是把能力、成本与用户控制组合成稳定工作流。\n\n## 延伸的产品设计考虑\n\n还应观察人工修订时间。模型输出在自动指标上只差一点，却可能让用户花大量时间逐项核对；另一方案保留清楚来源和编辑入口，实际工作可能更快。可用性评价可以记录从上传到确认可用的完整时长，并区分模型等待、人工检查和修订。这个指标更接近真实生产力，也更容易解释产品价值。\n\n## 补充的判断方法\n\n最终验收应保留原始输入条件，让后续模型升级可以在相同素材和范围下比较，避免结论失去参照。\n\n## 资料与延伸阅读\n\n- [Hugging Face：视觉模型输入与推理](https://huggingface.co/docs/transformers/tasks/image_text_to_text)\n- [Google Cloud：实时多模态API概览](https://docs.cloud.google.com/vertex-ai/generative-ai/docs/live-api)\n\n资料核验：2026-11-14。成本与字段例子为教学构造，非报价或性能承诺。\n","chars":1239,"minutes":5,"summary":"多模态产品容易给人强烈演示效果，但日常使用质量取决于输入变化、处理成本和纠错体验。图片能上传、语音能播放、视频能总结，只证明链路可运行；真正的产品判断需要回到具体任务和用户代价。"},{"id":"10-08","title":"边缘、空间与具身 AI 的认知入口","file":"content/10-08.md","level":"深入阅读","prerequisites":["10-07"],"aliases":["多模态","ASR","TTS","OCR","具身"],"module":"10","moduleTitle":"多模态与扩展方向","html":"<p>边缘AI、空间理解与具身AI把模型能力带到设备、环境和物理行动中。它们与通用软件Agent有相通之处，也有更严格的实时、硬件和安全约束。对以通用Agent为主的产品经理，这一领域适合先建立能力地图和判断边界。<\/p><h2 id=\"section-1\">边缘AI关注部署位置<\/h2><p>边缘通常指在手机、摄像头、工业设备或本地计算节点处理数据，而非全部发送到远端云服务。它可能降低网络依赖、改善隐私和响应时间，但受算力、内存、功耗、温度与模型更新条件限制。本地运行不自动代表数据绝不外传，也不自动代表结果更准确。<\/p><p>教学构造：工厂摄像头需要及时发现异常。若视频全传云端，网络与带宽可能成为瓶颈；若本地做初筛再上传片段，可以减少传输，但本地误判与软件更新需要管理。选择应依据事件时效、设备能力和错误代价，而不是简单偏好云或本地。<\/p><h2 id=\"section-2\">空间理解关注三维关系<\/h2><p>空间任务涉及位置、方向、距离、物体关系和可行动区域。二维图片里看见一个杯子，不等于知道机器人能否抓到它；遮挡、深度和坐标系都会影响行动。传感器、定位和环境建模提供额外信息，语言模型只是整体系统的一部分。<\/p><p>产品描述应区分识别、推理和控制。系统可以解释“物体在桌子左侧”，也可能需要更精确坐标才能执行动作。自然语言模糊指令与硬件控制之间需要转换和验证，尤其在人员与设备共同工作的环境中。<\/p><h2 id=\"section-3\">具身AI连接感知与行动<\/h2><p>具身系统通过传感器感知环境，并通过物理执行器改变环境。视觉—语言—行动模型尝试把视觉和语言输入连接到动作控制，但实际机器人还需要控制器、运动规划、力和碰撞约束等机制。模型演示完成某项任务，不代表可直接迁移到所有硬件和场景。<\/p><p>物理行动的错误可能不可逆，训练与评估也更昂贵。模拟环境可以帮助开发，却存在与现实差异；真实环境又有光照、物体位置、摩擦与人类行为变化。系统需要明确运行设计范围、异常停止与人工接管，而不只是提高平均成功率。<\/p><h2 id=\"section-4\">与软件Agent的相同与不同<\/h2><p>两者都有目标、观察、行动、状态和完成条件。软件Agent发出错误请求可能可以撤销，机器人误动作可能造成人身或设备影响，因此控制边界通常更严格。真实时间约束也更突出：等待几秒生成解释可能可以接受，运动控制却可能需要更低层的实时机制。<\/p><p>通用模型可以帮助理解指令、规划高层任务或解释异常，但不能因此替代经过验证的安全控制。AI SCADA中的知识助手、配置辅助和设备控制应分别评估，不能把对话能力直接当作控制系统能力。工业与机器人领域还需专业工程和适用标准支持。<\/p><h2 id=\"section-5\">产品经理的学习落点<\/h2><p>先理解传感器、边缘计算、空间表示、控制与模型之间的分工，再看具体产品。评审时关注任务环境、硬件限制、错误影响、更新方式和人工接管。不要把最前沿演示中的能力泛化到日常运营条件。<\/p><p>对于通用Agent职业方向，这一主题可以帮助识别边界与扩展机会，无需一开始深入全部机器人算法。若后续进入工业、车载或机器人岗位，再补充相应工程知识和专业要求。当前知识重点是知道系统依赖什么，以及哪些承诺必须由真实环境证据支持。<\/p><h2 id=\"section-6\">延伸的产品设计考虑<\/h2><p>部署之后仍有持续运维问题。边缘设备离线时如何更新模型，版本不同是否影响识别，故障数据能否安全回传，硬件更换后是否需要重新校准，都应纳入产品范围。物理环境中的稳定运行依赖整套生命周期管理，不能把模型安装到设备上就视为交付结束。<\/p><h2 id=\"section-7\">资料与延伸阅读<\/h2><ul><li><a href=\"https://deepmind.google/models/gemini-robotics/\" target=\"_blank\" rel=\"noopener noreferrer\">Google DeepMind：Gemini Robotics及视觉语言行动体系<\/a><\/li><li><a href=\"https://huggingface.co/docs/transformers/tasks/image_text_to_text\" target=\"_blank\" rel=\"noopener noreferrer\">Hugging Face：视觉语言模型基础<\/a><\/li><\/ul><p>资料核验：2026-11-14。工厂摄像头为教学构造；厂商展示不构成跨设备或工业安全性能保证。<\/p>","toc":[{"id":"section-1","title":"边缘AI关注部署位置","level":2},{"id":"section-2","title":"空间理解关注三维关系","level":2},{"id":"section-3","title":"具身AI连接感知与行动","level":2},{"id":"section-4","title":"与软件Agent的相同与不同","level":2},{"id":"section-5","title":"产品经理的学习落点","level":2},{"id":"section-6","title":"延伸的产品设计考虑","level":2},{"id":"section-7","title":"资料与延伸阅读","level":2}],"text":"边缘AI、空间理解与具身AI把模型能力带到设备、环境和物理行动中。它们与通用软件Agent有相通之处，也有更严格的实时、硬件和安全约束。对以通用Agent为主的产品经理，这一领域适合先建立能力地图和判断边界。\n\n## 边缘AI关注部署位置\n\n边缘通常指在手机、摄像头、工业设备或本地计算节点处理数据，而非全部发送到远端云服务。它可能降低网络依赖、改善隐私和响应时间，但受算力、内存、功耗、温度与模型更新条件限制。本地运行不自动代表数据绝不外传，也不自动代表结果更准确。\n\n教学构造：工厂摄像头需要及时发现异常。若视频全传云端，网络与带宽可能成为瓶颈；若本地做初筛再上传片段，可以减少传输，但本地误判与软件更新需要管理。选择应依据事件时效、设备能力和错误代价，而不是简单偏好云或本地。\n\n## 空间理解关注三维关系\n\n空间任务涉及位置、方向、距离、物体关系和可行动区域。二维图片里看见一个杯子，不等于知道机器人能否抓到它；遮挡、深度和坐标系都会影响行动。传感器、定位和环境建模提供额外信息，语言模型只是整体系统的一部分。\n\n产品描述应区分识别、推理和控制。系统可以解释“物体在桌子左侧”，也可能需要更精确坐标才能执行动作。自然语言模糊指令与硬件控制之间需要转换和验证，尤其在人员与设备共同工作的环境中。\n\n## 具身AI连接感知与行动\n\n具身系统通过传感器感知环境，并通过物理执行器改变环境。视觉—语言—行动模型尝试把视觉和语言输入连接到动作控制，但实际机器人还需要控制器、运动规划、力和碰撞约束等机制。模型演示完成某项任务，不代表可直接迁移到所有硬件和场景。\n\n物理行动的错误可能不可逆，训练与评估也更昂贵。模拟环境可以帮助开发，却存在与现实差异；真实环境又有光照、物体位置、摩擦与人类行为变化。系统需要明确运行设计范围、异常停止与人工接管，而不只是提高平均成功率。\n\n## 与软件Agent的相同与不同\n\n两者都有目标、观察、行动、状态和完成条件。软件Agent发出错误请求可能可以撤销，机器人误动作可能造成人身或设备影响，因此控制边界通常更严格。真实时间约束也更突出：等待几秒生成解释可能可以接受，运动控制却可能需要更低层的实时机制。\n\n通用模型可以帮助理解指令、规划高层任务或解释异常，但不能因此替代经过验证的安全控制。AI SCADA中的知识助手、配置辅助和设备控制应分别评估，不能把对话能力直接当作控制系统能力。工业与机器人领域还需专业工程和适用标准支持。\n\n## 产品经理的学习落点\n\n先理解传感器、边缘计算、空间表示、控制与模型之间的分工，再看具体产品。评审时关注任务环境、硬件限制、错误影响、更新方式和人工接管。不要把最前沿演示中的能力泛化到日常运营条件。\n\n对于通用Agent职业方向，这一主题可以帮助识别边界与扩展机会，无需一开始深入全部机器人算法。若后续进入工业、车载或机器人岗位，再补充相应工程知识和专业要求。当前知识重点是知道系统依赖什么，以及哪些承诺必须由真实环境证据支持。\n\n## 延伸的产品设计考虑\n\n部署之后仍有持续运维问题。边缘设备离线时如何更新模型，版本不同是否影响识别，故障数据能否安全回传，硬件更换后是否需要重新校准，都应纳入产品范围。物理环境中的稳定运行依赖整套生命周期管理，不能把模型安装到设备上就视为交付结束。\n\n## 资料与延伸阅读\n\n- [Google DeepMind：Gemini Robotics及视觉语言行动体系](https://deepmind.google/models/gemini-robotics/)\n- [Hugging Face：视觉语言模型基础](https://huggingface.co/docs/transformers/tasks/image_text_to_text)\n\n资料核验：2026-11-14。工厂摄像头为教学构造；厂商展示不构成跨设备或工业安全性能保证。\n","chars":1231,"minutes":5,"summary":"边缘AI、空间理解与具身AI把模型能力带到设备、环境和物理行动中。它们与通用软件Agent有相通之处，也有更严格的实时、硬件和安全约束。对以通用Agent为主的产品经理，这一领域适合先建立能力地图和判断边界。"},{"id":"11-01","title":"从业务目标到 AI 质量指标","file":"content/11-01.md","level":"工作应用","prerequisites":["01-07"],"aliases":["evals","评测","LLM judge","A/B"],"module":"11","moduleTitle":"评估与实验","html":"<p>“回答更准确”不足以指导产品建设。AI质量指标需要从用户任务出发，连接业务价值、系统行为与不可接受风险。模型基准可以帮助了解能力，却不能直接证明一个具体产品能让用户完成工作。<\/p><figure class=\"concept-diagram\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 602\" role=\"img\" aria-labelledby=\"title-eval desc-eval\"><title id=\"title-eval\">从业务目标到改进证据<\/title><desc id=\"desc-eval\">定义成功：用户任务、分母、风险和护栏指标；构建样本：目标分布、典型情况、难例与异常；建立基线：固定版本、量表和判定流程；比较与诊断：看分组结果、错误类型与不确定性；发布与回归：明确准入 → 灰度监控 → 退化时回滚<\/desc><rect width=\"360\" height=\"602\" rx=\"15\" fill=\"#f0f4ec\"/><text x=\"24\" y=\"35\" fill=\"#244c3e\" font-size=\"16\" font-family=\"sans-serif\" font-weight=\"600\">从业务目标到改进证据<\/text><rect x=\"22\" y=\"56\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"80\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"84\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">1<\/text><text x=\"65\" y=\"84\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">定义成功<\/text><text x=\"37\" y=\"109\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">用户任务、分母、风险和护栏指标<\/text><path d=\"M180 131 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"148\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"172\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"176\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">2<\/text><text x=\"65\" y=\"176\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">构建样本<\/text><text x=\"37\" y=\"201\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">目标分布、典型情况、难例与异常<\/text><path d=\"M180 223 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"240\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"264\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"268\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">3<\/text><text x=\"65\" y=\"268\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">建立基线<\/text><text x=\"37\" y=\"293\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">固定版本、量表和判定流程<\/text><path d=\"M180 315 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"332\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"356\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"360\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">4<\/text><text x=\"65\" y=\"360\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">比较与诊断<\/text><text x=\"37\" y=\"385\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">看分组结果、错误类型与不确定性<\/text><path d=\"M180 407 v10 m-4 -4 4 4 4 -4\" stroke=\"#88a185\" fill=\"none\" stroke-width=\"1.5\"/><rect x=\"22\" y=\"424\" width=\"316\" height=\"70\" rx=\"9\" fill=\"#fff\" stroke=\"#d6e1d4\"/><circle cx=\"44\" cy=\"448\" r=\"12\" fill=\"#e4eddf\"/><text x=\"44\" y=\"452\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3b7056\" font-family=\"sans-serif\">5<\/text><text x=\"65\" y=\"452\" font-size=\"14\" fill=\"#234438\" font-family=\"sans-serif\" font-weight=\"600\">发布与回归<\/text><text x=\"37\" y=\"477\" font-size=\"11.5\" fill=\"#687d6b\" font-family=\"sans-serif\">明确准入 → 灰度监控 → 退化时回滚<\/text><text x=\"24\" y=\"558\" font-size=\"10.5\" fill=\"#6a816c\" font-family=\"sans-serif\">一次演示、平均分或公开榜单，都不足以单独验收。<\/text><\/svg><figcaption>从业务目标到评估证据 · 本知识库绘制的机制示意<\/figcaption><\/figure><h2 id=\"section-1\">从业务结果向下拆解<\/h2><p>教学构造：客服助手的业务目标是提高有效解决率。用户任务是得到符合政策、能够执行的处理方案；AI质量包括事实正确、规则适用、信息完整与表达清楚；系统约束包括等待、费用、权限和安全。各层之间有关联，但不能互相替代。回复更长可能改善表面完整性，却增加阅读负担。<\/p><p>指标可以分为结果、过程和护栏。结果指标看任务是否成功，过程指标帮助定位检索、工具或生成问题，护栏限制不可接受退化，如泄露、重复退款或成本失控。主指标帮助做选择，护栏决定某些选择即使平均收益高也不能接受。<\/p><h2 id=\"section-2\">把抽象质量转为可判定标准<\/h2><p>准确性需要说明哪些事实、允许何种误差；完整性需要列出必要内容；任务成功需要确定外部结果。对于结构化抽取，可以比较字段；对于开放研究，可以判断主题覆盖、来源支持与关键遗漏；对于Agent，还要核查动作和最终业务状态。<\/p><p>主观维度也能建立标准，例如“清楚”可以拆为先给结论、术语有解释、重要限制明确。标准不必规定唯一措辞，但应让评审者知道什么算明显缺陷。若所有人都凭个人喜好打总分，指标变化很难解释。<\/p><h2 id=\"section-3\">平均值与分层观察<\/h2><div class=\"table-wrap\" tabindex=\"0\"><table><tr><th>指标层次<\/th><th>客服助手中的例子<\/th><th>能支持的判断<\/th><\/tr><tr><td>用户结果<\/td><td>问题是否有效解决<\/td><td>用户是否获得价值<\/td><\/tr><tr><td>内容质量<\/td><td>政策与事实是否准确<\/td><td>回答是否符合任务<\/td><\/tr><tr><td>系统过程<\/td><td>检索命中、工具参数正确<\/td><td>失败可能在哪里<\/td><\/tr><tr><td>体验效率<\/td><td>总等待、人工修订时间<\/td><td>工作负担是否改善<\/td><\/tr><tr><td>护栏<\/td><td>越权、重复退款、费用异常<\/td><td>是否存在不可接受代价<\/td><\/tr><\/table><\/div><p>总体成功率可能掩盖关键人群或任务失败。应按语言、任务复杂度、资料类型、用户角色、工具和错误风险分层。一个系统在简单问答上很好，却在退款和权限问题上不稳定，不能靠大量简单样本稀释风险。<\/p><p>教学构造：一百个任务成功九十个，若失败都集中在十个高价值企业客户，产品意义与随机分布完全不同。还要关注错误严重度和人工恢复成本。质量决策通常不是单一分数排序，而是多维证据与业务优先级的结合。<\/p><h2 id=\"section-4\">成功定义需要防止投机<\/h2><p>如果只奖励用户点赞，系统可能更迎合；只看回答率，系统可能减少合理拒答；只看完成速度，系统可能省略验证。指标会影响团队优化方向，因此需要考虑是否存在看似提升、实际伤害任务的捷径。<\/p><p>可以同时观察正确拒答、错误拒答、无依据回答和用户后续行为。Agent任务还应区分“宣称成功”与“验证成功”。结果由可信系统状态或明确产物证明，避免模型通过一段自信回复满足表面指标。<\/p><h2 id=\"section-5\">产品需求中的指标契约<\/h2><p>指标定义应写清分母、样本范围、判定规则、数据来源、时间窗口和责任人。比如“任务成功率”是否包含用户取消、外部服务故障和人工接管，需要一致约定。不同口径无法直接比较，也容易在汇报中产生误解。<\/p><p>上线前可以建立基线，说明当前人工流程或旧版本表现；上线后再连接使用、留存和成本。技术质量改善只有在真实任务中产生价值，才值得持续投入。产品经理应把评估当作设计的一部分，尽早确定系统要证明什么，而不是完成后才寻找有利数字。<\/p><h2 id=\"section-6\">指标与服务质量共同管理<\/h2><p>内容正确但响应过慢，用户可能放弃；服务在线但总给无用答案，也不能视为可靠。可以分别定义可用性、延迟与内容质量，再观察它们的组合。某个指标达到目标不代表所有能力达标，应保留不同维度的限制和适用条件。<\/p><h2 id=\"section-7\">补充的判断方法<\/h2><p>指标之间有时存在真实冲突。系统更保守可能减少无依据回答，却增加错误拒答；允许更多自主执行可能减少人工操作，却放大单次错误影响。产品经理需要明确当前阶段优先保护什么，并用护栏限制代价。不能把所有指标都写成“越高越好”，而应说明取舍和适用范围。评价标准也要随用户任务演进，定期检查指标是否仍代表真实价值。<\/p><h2 id=\"section-8\">资料与延伸阅读<\/h2><ul><li><a href=\"https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Anthropic：Agent评估结构与评判方式<\/a><\/li><li><a href=\"https://sre.google/sre-book/service-level-objectives/\" target=\"_blank\" rel=\"noopener noreferrer\">Google SRE：从用户关切定义服务指标<\/a><\/li><\/ul><p>资料核验：2026-11-14。客服和样本数字为教学构造，不是行业标准或实际业务表现。<\/p>","toc":[{"id":"section-1","title":"从业务结果向下拆解","level":2},{"id":"section-2","title":"把抽象质量转为可判定标准","level":2},{"id":"section-3","title":"平均值与分层观察","level":2},{"id":"section-4","title":"成功定义需要防止投机","level":2},{"id":"section-5","title":"产品需求中的指标契约","level":2},{"id":"section-6","title":"指标与服务质量共同管理","level":2},{"id":"section-7","title":"补充的判断方法","level":2},{"id":"section-8","title":"资料与延伸阅读","level":2}],"text":"“回答更准确”不足以指导产品建设。AI质量指标需要从用户任务出发，连接业务价值、系统行为与不可接受风险。模型基准可以帮助了解能力，却不能直接证明一个具体产品能让用户完成工作。\n\n![从业务目标到评估证据](../site/diagrams/eval.svg)\n\n## 从业务结果向下拆解\n\n教学构造：客服助手的业务目标是提高有效解决率。用户任务是得到符合政策、能够执行的处理方案；AI质量包括事实正确、规则适用、信息完整与表达清楚；系统约束包括等待、费用、权限和安全。各层之间有关联，但不能互相替代。回复更长可能改善表面完整性，却增加阅读负担。\n\n指标可以分为结果、过程和护栏。结果指标看任务是否成功，过程指标帮助定位检索、工具或生成问题，护栏限制不可接受退化，如泄露、重复退款或成本失控。主指标帮助做选择，护栏决定某些选择即使平均收益高也不能接受。\n\n## 把抽象质量转为可判定标准\n\n准确性需要说明哪些事实、允许何种误差；完整性需要列出必要内容；任务成功需要确定外部结果。对于结构化抽取，可以比较字段；对于开放研究，可以判断主题覆盖、来源支持与关键遗漏；对于Agent，还要核查动作和最终业务状态。\n\n主观维度也能建立标准，例如“清楚”可以拆为先给结论、术语有解释、重要限制明确。标准不必规定唯一措辞，但应让评审者知道什么算明显缺陷。若所有人都凭个人喜好打总分，指标变化很难解释。\n\n## 平均值与分层观察\n\n| 指标层次 | 客服助手中的例子 | 能支持的判断 |\n|---|---|---|\n| 用户结果 | 问题是否有效解决 | 用户是否获得价值 |\n| 内容质量 | 政策与事实是否准确 | 回答是否符合任务 |\n| 系统过程 | 检索命中、工具参数正确 | 失败可能在哪里 |\n| 体验效率 | 总等待、人工修订时间 | 工作负担是否改善 |\n| 护栏 | 越权、重复退
